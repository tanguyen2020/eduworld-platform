# gitleaks configuration (F001 T004, AGENTS R4).
# Default rules + a narrow allowlist: only the literal local placeholder `change-me-local`.
title = "EduWorld gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Local-only placeholder secret used in .env.example, compose and the dev realm"
regexTarget = "match"
# F130: SOPS ciphertext (deploy/secrets/<env>/*.sops.yaml) is encrypted with age, not a secret in clear.
regexes = ['''change-me-local''', '''ENC\[AES256_GCM,data:[A-Za-z0-9+/=]+,iv:[A-Za-z0-9+/=]+,tag:[A-Za-z0-9+/=]+,type:[a-z]+\]''']
# Third-party and local data directories are never committed (.gitignore) — skip them in `gitleaks dir`.
paths = ['''(^|/)node_modules/''', '''^data/''', '''^bin/''']

# OWASP ZAP rule configuration of the EduWorld DAST (F132-AC-18, SECURITY_ARCHITECTURE §16).
# Format of zap-baseline.py / zap-api-scan.py `-c`: <rule id>\t<IGNORE|INFO|WARN|FAIL>\t(<name>)
# Default for every rule not listed: WARN. The release gate is NOT this file: tests/security/zap/check-report.mjs
# fails on any alert of risk High (ZAP has no Critical level; High = High/Critical of DEPLOYMENT §15), whatever the
# action below. Each IGNORE needs a reason; review this file with every ZAP upgrade.

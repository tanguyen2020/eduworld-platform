10027	INFO	(Information Disclosure - Suspicious Comments)	Admin Portal bundle (minified vendor code)
10109	INFO	(Modern Web Application)	informational only
90004	WARN	(Insufficient Site Isolation Against Spectre Vulnerability)	COOP/COEP reviewed in the pentest P3
10202	FAIL	(Absence of Anti-CSRF Tokens)	portal refresh/logout use the CSRF double-submit (ADR-0091)
10038	FAIL	(Content Security Policy Header Not Set)	Admin Portal must send CSP (SECURITY_ARCHITECTURE §9)
10035	FAIL	(Strict-Transport-Security Header Not Set)	staging/production are HTTPS only
40012	FAIL	(Cross Site Scripting (Reflected))
40014	FAIL	(Cross Site Scripting (Persistent))
40018	FAIL	(SQL Injection)
90019	FAIL	(Server Side Include)

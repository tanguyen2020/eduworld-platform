# Local CDN stand-in (LOCAL_DEVELOPMENT §3.1): main configuration of the cdn service — the one of the nginx image plus the
# njs module, which signs the origin requests of ew-media-private (s3_origin.js). The server is the template nginx.conf
# (/etc/nginx/templates → conf.d, envsubst). The access log keeps the method, path and status only: the md5/expires of
# a signed URL are never written (R14).
load_module modules/ngx_http_js_module.so;

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  cdn  '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';
    access_log  /var/log/nginx/access.log  cdn;

    sendfile        on;
    keepalive_timeout  65;

    include /etc/nginx/conf.d/*.conf;
}

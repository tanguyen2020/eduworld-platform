# Local CDN stand-in (LOCAL_DEVELOPMENT §3.1): path-style proxy to floci, read-only (GET/HEAD), the way DEPLOYMENT §9 and
# ADR-0044 §2 describe the production CDN:
#   - ew-media-public, ew-game-bundles: public buckets — anonymous origin GET, allowed by the public-read bucket policy
#     that s3-init sets on these two buckets only (docker-compose.yml); hashed (immutable) paths get long-lived cache
#     headers;
#   - ew-media-private: only signed URLs (F027 CdnSigner: secure_link md5 of "<expires><uri> <EW_CDN_SIGNING_KEY>",
#     expiry media_signed_url_ttl; missing/wrong → 403, expired → 410), then an origin request signed with SigV4 by
#     s3_origin.js (the bucket stays private: its public access block is untouched).
# Keys and the origin credential come from the environment through the nginx template mechanism
# (/etc/nginx/templates/*.template, envsubst of defined variables only); local/CI values only.
js_import s3 from /etc/nginx/njs/s3_origin.js;
js_set $s3_date s3.amzDate;
js_set $s3_auth s3.authorization;

upstream floci_origin {
  server floci:4566;
}

server {
  listen 8090;

  location = /healthz {
    default_type text/plain;
    return 200 "ok\n";
  }

  location ~ "^/(ew-media-public|ew-game-bundles)/(media/[0-9a-f]{64}/|math/[0-9a-f]{64}\.svg$)" {
    limit_except GET { deny all; }
    proxy_pass http://floci:4566;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location ~ "^/ew-media-private/media/[0-9a-f]{64}/[A-Za-z0-9._/-]+$" {
    limit_except GET { deny all; }
    secure_link $arg_md5,$arg_expires;
    secure_link_md5 "$secure_link_expires$uri ${EW_CDN_SIGNING_KEY}";
    if ($secure_link = "") { return 403; }
    if ($secure_link = "0") { return 410; }

    set $s3_host "floci:4566";
    set $s3_region "${EW_S3_REGION}";
    set $s3_access_key "${EW_S3_ACCESS_KEY}";
    set $s3_secret_key "${EW_S3_SECRET_KEY}";
    # Only the signed headers and the conditional/range headers of a player reach the origin (no client x-amz-*).
    proxy_pass_request_headers off;
    proxy_set_header Host $s3_host;
    proxy_set_header Authorization $s3_auth;
    proxy_set_header x-amz-date $s3_date;
    proxy_set_header x-amz-content-sha256 UNSIGNED-PAYLOAD;
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
    proxy_set_header If-None-Match $http_if_none_match;
    proxy_set_header If-Modified-Since $http_if_modified_since;
    proxy_pass http://floci_origin$uri;
    add_header Cache-Control "private, max-age=600" always;
  }

  location ~ ^/(ew-media-public|ew-game-bundles)/ {
    limit_except GET { deny all; }
    proxy_pass http://floci:4566;
  }

  location / {
    return 404;
  }
}

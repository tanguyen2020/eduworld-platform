# Local CDN stand-in (LOCAL_DEVELOPMENT §3.1): path-style proxy to floci. Hashed (immutable) paths get
# long-lived cache headers. ew-media-private only answers signed URLs (F027 CdnSigner: secure_link md5 of
# "<expires><uri> <EW_CDN_SIGNING_KEY>", expiry media_signed_url_ttl); the key comes from the environment through the
# nginx template mechanism (/etc/nginx/templates/*.template, envsubst of defined variables only).
server {
  listen 8090;

  location = /healthz {
    default_type text/plain;
    return 200 "ok\n";
  }

  location ~ "^/(ew-media-public|ew-game-bundles)/(media/[0-9a-f]{64}/|math/[0-9a-f]{64}\.svg$)" {
    proxy_pass http://floci:4566;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location ~ "^/ew-media-private/media/[0-9a-f]{64}/" {
    secure_link $arg_md5,$arg_expires;
    secure_link_md5 "$secure_link_expires$uri ${EW_CDN_SIGNING_KEY}";
    if ($secure_link = "") { return 403; }
    if ($secure_link = "0") { return 410; }
    proxy_pass http://floci:4566;
    add_header Cache-Control "private, max-age=600" always;
  }

  location ~ ^/(ew-media-public|ew-game-bundles)/ {
    proxy_pass http://floci:4566;
  }

  location / {
    return 404;
  }
}

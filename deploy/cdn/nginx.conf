# Local CDN stand-in (LOCAL_DEVELOPMENT §3.1): path-style proxy to floci. Hashed (immutable) paths get
# long-lived cache headers. Signed-URL checks for ew-media-private are added by the media feature.
server {
  listen 8090;

  location = /healthz {
    default_type text/plain;
    return 200 "ok\n";
  }

  location ~ "^/(ew-media-public|ew-game-bundles)/media/[0-9a-f]{64}/" {
    proxy_pass http://floci:4566;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location ~ ^/(ew-media-public|ew-game-bundles)/ {
    proxy_pass http://floci:4566;
  }

  location / {
    return 404;
  }
}

# CDN rules of the Web client on play.<domain> and of the public zone packs (F133 T022, F133-AC-09, NFR-COMP-004,
# DEPLOYMENT §9 / §11.2, PERFORMANCE_BUDGET §14, research R4). Provider-independent (OQ-10: the CDN is chosen when the
# environment is built — translate these rules into its configuration). scripts/godot/publish-web.mjs reads this file
# to set the object metadata at upload time (one source of truth, R33); deploy/cdn/play/headers.test lives in
# scripts/godot/tests/publish-web.test.mjs.
#   - /v/<client_version>/… is immutable: Brotli pre-compressed .wasm/.pck/.js/.html/.css, one-year cache;
#   - /index.html (entry, points to the current version) has a short cache and is switched LAST; a rollback is
#     re-pointing it to an earlier /v/<version>/ (no rebuild);
#   - single-threaded export: no COOP/COEP needed (and none sent);
#   - CORS: only the Web origin of the environment (EW_CORS_GAME_ORIGINS, never "*", no credentials) for the packs and
#     public media the game fetches (DEPLOYMENT §9 "CDN media/gói").
version: 1
web:
  versioned_prefix: v/
  entry: index.html
  rules:
    - match: "v/*/index.html"
      cache_control: "public, max-age=31536000, immutable"
      content_type: "text/html; charset=utf-8"
      brotli: true
    - match: "v/*/*.wasm"
      cache_control: "public, max-age=31536000, immutable"
      content_type: "application/wasm"
      brotli: true
    - match: "v/*/*.pck"
      cache_control: "public, max-age=31536000, immutable"
      content_type: "application/octet-stream"
      brotli: true
    - match: "v/*/*.js"
      cache_control: "public, max-age=31536000, immutable"
      content_type: "text/javascript; charset=utf-8"
      brotli: true
    - match: "v/*/*.css"
      cache_control: "public, max-age=31536000, immutable"
      content_type: "text/css; charset=utf-8"
      brotli: true
    - match: "v/*/*"
      cache_control: "public, max-age=31536000, immutable"
      content_type: "application/octet-stream"
      brotli: false
    - match: "index.html"
      cache_control: "public, max-age=60"
      content_type: "text/html; charset=utf-8"
      brotli: false
  security_headers:
    X-Content-Type-Options: nosniff
    Referrer-Policy: no-referrer
    Strict-Transport-Security: "max-age=31536000; includeSubDomains"
  forbidden_headers: [Cross-Origin-Opener-Policy, Cross-Origin-Embedder-Policy]
bundles:
  rules:
    - match: "bundles/*.pck"
      cache_control: "public, max-age=31536000, immutable"
      content_type: "application/octet-stream"
    - match: "index/*.json"
      cache_control: "public, max-age=31536000, immutable"
      content_type: "application/json"
    - match: "index/*.json.sig"
      cache_control: "public, max-age=31536000, immutable"
      content_type: "text/plain"
cors:
  allowed_origins_env: EW_CORS_GAME_ORIGINS
  allow_methods: [GET, HEAD]
  allow_credentials: false
  max_age_sec: 600

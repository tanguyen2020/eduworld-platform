# NATS resolver configuration of staging/production (F130 T053; DEPLOYMENT §8b, §13). TEMPLATE, no secret: the
# {{...}} values are public JWTs/keys filled by scripts/deploy/nats-accounts.sh from the offline nsc store (operator
# EDUWORLD, system account SYS, account EDUWORLD with JetStream enabled); the rendered file is the Docker secret
# nats_accounts, included by deploy/swarm/config/nats.conf (`include accounts.conf`). User permissions are not here:
# they are signed into each user JWT (<binary>_nats_creds) from deploy/nats/permissions.yaml.
# A new user or a permission change needs new creds only (same account JWT); a new account or account limits need a
# new nats_accounts and a rolling restart of nats-1..3.
operator: {{operator_jwt}}
system_account: {{system_account}}
resolver: MEMORY
resolver_preload: {
  {{system_account}}: {{system_account_jwt}}
  {{account}}: {{account_jwt}}
}

# Docker Engine API allowlist proxy of ops-scheduler (F130-AC-23, DEPLOYMENT §4.4). The only calls allowed:
#   GET /services, GET /nodes, GET /tasks (with an optional /v1.NN version prefix) and POST /services/{id}/update.
# Everything else (POST /services/create, DELETE, /containers, /exec, /secrets, /swarm …) answers 403.
# Backend: the manager Engine API over TLS with the proxy's own client certificate (Docker secrets); managers stay
# drained and no Docker socket is mounted anywhere. DOCKER_API_ADDR = host:port of the manager API (service env).
global
  log stdout format raw local0 info
  maxconn 256
defaults
  mode http
  log global
  option httplog
  timeout connect 5s
  timeout client 30s
  timeout server 30s
frontend docker_api
  bind :2375
  acl get_list method GET
  acl list_path path_reg ^/(v[0-9]+\.[0-9]+/)?(services|nodes|tasks)$
  acl update method POST
  acl update_path path_reg ^/(v[0-9]+\.[0-9]+/)?services/[A-Za-z0-9_.-]{1,128}/update$
  http-request allow if get_list list_path
  http-request allow if update update_path
  http-request deny deny_status 403
  default_backend manager
backend manager
  server manager "${DOCKER_API_ADDR}" ssl verify required ca-file /run/secrets/docker-api/ca.pem crt /run/secrets/docker-api/client.pem

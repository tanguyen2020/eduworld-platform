# pgBackRest TLS server next to a PostgreSQL node (research R2). Only the repo host certificate (CN backup-tools)
# may act on stanza eduworld. Certificates: Docker secrets backup_pgbackrest_* (CA shared with the client side).
[global]
tls-server-address=*
tls-server-port=8432
tls-server-cert-file=/run/secrets/backup_pgbackrest_server_cert
tls-server-key-file=/run/secrets/backup_pgbackrest_server_key
tls-server-ca-file=/run/secrets/backup_pgbackrest_ca
tls-server-auth=backup-tools=eduworld
log-level-console=info
log-level-file=off
lock-path=/tmp/pgbackrest

[eduworld]
pg1-path=/var/lib/postgresql/data/pgdata
pg1-socket-path=/var/run/postgresql

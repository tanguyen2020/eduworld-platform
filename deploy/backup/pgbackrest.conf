# pgBackRest — repo host (backup-tools on node ops, research R2; BACKUP_RECOVERY §3). One stanza for the single
# cluster (5 module databases + keycloak, ADR-0074 mục 4). The repo bucket lives on S3 OUTSIDE the main
# infrastructure (other account/site) with object lock 14 days; endpoint/bucket/region come from PGBACKREST_REPO1_*
# environment variables (backup.env), keys and the cipher passphrase from Docker secrets (scripts/backup/lib-backup.sh).
# Retention (BACKUP_RECOVERY §3.2): 4 full (weekly), 12 differential (≈ 14 days of daily diffs), WAL of the last 3
# full backups (≥ 14 days of PITR).
[global]
repo1-type=s3
repo1-path=/pgbackrest
repo1-s3-uri-style=path
repo1-cipher-type=aes-256-cbc
repo1-retention-full-type=count
repo1-retention-full=4
repo1-retention-diff=12
repo1-retention-archive-type=full
repo1-retention-archive=3
process-max=4
compress-type=zst
start-fast=y
delta=y
backup-standby=y
log-level-console=info
log-level-file=off
lock-path=/tmp/pgbackrest

[global:archive-get]
process-max=2

[eduworld]
pg1-host=pgbackrest-1
pg1-host-type=tls
pg1-host-port=8432
pg1-path=/var/lib/postgresql/data/pgdata
pg1-host-cert-file=/run/secrets/backup_pgbackrest_client_cert
pg1-host-key-file=/run/secrets/backup_pgbackrest_client_key
pg1-host-ca-file=/run/secrets/backup_pgbackrest_ca_client
pg2-host=pgbackrest-2
pg2-host-type=tls
pg2-host-port=8432
pg2-path=/var/lib/postgresql/data/pgdata
pg2-host-cert-file=/run/secrets/backup_pgbackrest_client_cert
pg2-host-key-file=/run/secrets/backup_pgbackrest_client_key
pg2-host-ca-file=/run/secrets/backup_pgbackrest_ca_client
pg3-host=pgbackrest-3
pg3-host-type=tls
pg3-host-port=8432
pg3-path=/var/lib/postgresql/data/pgdata
pg3-host-cert-file=/run/secrets/backup_pgbackrest_client_cert
pg3-host-key-file=/run/secrets/backup_pgbackrest_client_key
pg3-host-ca-file=/run/secrets/backup_pgbackrest_ca_client

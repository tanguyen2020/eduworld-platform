# pgBackRest on a PostgreSQL node (archive-push/archive-get of Patroni, F130). Same repo as the repo host
# (deploy/backup/pgbackrest.conf); credentials: the write-only backup key + cipher from Docker secrets (patroni-start).
[global]
repo1-type=s3
repo1-path=/pgbackrest
repo1-s3-uri-style=path
repo1-cipher-type=aes-256-cbc
archive-async=y
spool-path=/var/spool/pgbackrest
compress-type=zst
log-level-console=warn
log-level-file=off
lock-path=/tmp/pgbackrest

[global:archive-push]
process-max=2

[eduworld]
pg1-path=/var/lib/postgresql/data/pgdata
pg1-socket-path=/var/run/postgresql

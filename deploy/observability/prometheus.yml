# Prometheus (local): scrape the admin port (/metrics) of each binary and the collector.
global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts/*.yml

scrape_configs:
  - job_name: core-api
    static_configs: [{ targets: ["core-api:9090"], labels: { binary: core-api } }]
  - job_name: realtime
    static_configs: [{ targets: ["realtime:9090"], labels: { binary: realtime } }]
  - job_name: worker
    static_configs: [{ targets: ["worker:9090"], labels: { binary: worker } }]
  - job_name: otel-collector
    static_configs: [{ targets: ["otel-collector:8889"] }]

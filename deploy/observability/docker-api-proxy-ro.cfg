# Read-only Docker Engine API proxy of the observability stack (F131 T014/T016; DEPLOYMENT §4.4): Prometheus
# dockerswarm_sd_configs and swarm-exporter need GET /services, /tasks, /nodes, /networks (+ /_ping, /version for API
# version negotiation). Every other method or path (POST, DELETE, /containers, /exec, /secrets, /swarm …) answers 403.
# Backend: the manager Engine API over TLS with this proxy's own client certificate (Docker secrets
# ops_docker_api_ca, ops_docker_api_ro_client_cert); no Docker socket is mounted. DOCKER_API_ADDR = host:port (env).
global
  log stdout format raw local0 info
  maxconn 256
defaults
  mode http
  log global
  option httplog
  timeout connect 5s
  timeout client 30s
  timeout server 30s
frontend docker_api
  bind :2375
  acl read_method method GET HEAD
  acl read_path path_reg ^/(v[0-9]+\.[0-9]+/)?(_ping|version|services|tasks|nodes|networks)$
  http-request allow if read_method read_path
  http-request deny deny_status 403
  default_backend manager
backend manager
  server manager "${DOCKER_API_ADDR}" ssl verify required ca-file /run/secrets/docker-api/ca.pem crt /run/secrets/docker-api/client.pem

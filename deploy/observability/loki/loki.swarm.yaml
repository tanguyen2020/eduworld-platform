# Loki of staging/production (F131 T015, F131-AC-05; MONITORING §8). Single binary on node `ops` (volume loki-data),
# reached only on network `admin`. Retention = app_log_retention (CONFIG_DEFAULTS §18: 14 days); the compactor deletes
# expired chunks (log data, not business data — audit stays in PostgreSQL audit.audit_logs). Queries of production are
# audited through the Grafana router log and the Loki query log (both collected back into Loki, MONITORING §8).
auth_enabled: false

server:
  http_listen_port: 3100
  log_level: info

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore: { store: inmemory }
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index: { prefix: index_, period: 24h }

limits_config:
  retention_period: 336h          # 14 days — app_log_retention
  allow_structured_metadata: true
  max_query_lookback: 336h
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
  per_stream_rate_limit: 8MB

query_range:
  results_cache:
    cache:
      embedded_cache: { enabled: true, max_size_mb: 256 }

frontend:
  log_queries_longer_than: 0s     # every query is logged (access audit, F131-AC-07)

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

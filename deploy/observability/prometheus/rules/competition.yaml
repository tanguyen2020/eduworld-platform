# Alert rules of module competition (F091 T032, F104 T042, F131 T023, MONITORING §5). Thresholds owned by MONITORING
# §5 (room tick budget: REALTIME_ARCHITECTURE §8; matchmaking: MATCHMAKING §10 — MONITORING §5 links them).
groups:
  - name: competition-hub
    rules:
      - alert: CompetitionRoomTickSlow
        expr: histogram_quantile(0.99, sum by (le, room_type) (rate(eduworld_room_tick_duration_seconds_bucket[5m]))) > 0.02
        for: 10m
        labels: { severity: warning, module: competition }
        annotations:
          summary: "Room tick p99 > 20 ms ({{ $labels.room_type }})"
          description: "Budget ≤ 5 ms per tick for a hub instance of 40 (REALTIME_ARCHITECTURE §8). Check room count per core-api replica."
          runbook_url: "docs/11-operations/runbooks/CompetitionRoomTickSlow.md"
          source: "docs/11-operations/MONITORING.md#5-alert-rules--confirmed"
  - name: competition-matchmaking
    rules:
      - alert: MatchmakingWaitHigh
        expr: histogram_quantile(0.95, sum by (le, mode) (rate(eduworld_mm_wait_seconds_bucket{result="matched"}[15m]))) > 60
        for: 15m
        labels: { severity: warning, module: competition }
        annotations:
          summary: "Matchmaking wait p95 > 60 s ({{ $labels.mode }})"
          description: "NFR-PERF-007 targets p90 ≤ 45 s when the queue has enough players. Check queue sizes (eduworld_mm_queue_size) and the matchmaker loop."
          runbook_url: "docs/11-operations/runbooks/MatchmakingWaitHigh.md"
          source: "docs/11-operations/MONITORING.md#5-alert-rules--confirmed"
      - alert: MatchmakerLoopSlow
        expr: histogram_quantile(0.95, sum by (le) (rate(eduworld_mm_loop_duration_seconds_bucket[5m]))) > 1
        for: 10m
        labels: { severity: warning, module: competition }
        annotations:
          summary: "Matchmaker pass p95 > 1 s"
          description: "One pass over every queue must stay under 1 s (MATCHMAKING §10). Check Valkey latency and the number of queues per worker."
          runbook_url: "docs/11-operations/runbooks/MatchmakerLoopSlow.md"
          source: "docs/11-operations/MONITORING.md#5-alert-rules--confirmed"
      - alert: MatchmakingStalled
        expr: |
          sum by (queue) (eduworld_mm_queue_size) > 0
          and on() sum(increase(eduworld_mm_proposals_total[3m])) == 0
          and on() eduworld:school_hours
        for: 1m
        labels: { severity: warning, module: competition, service: worker, profile: jobs }
        annotations:
          summary: "Queue {{ $labels.queue }} has players but no new proposal for 3 minutes"
          runbook_url: "docs/11-operations/runbooks/MatchmakingStalled.md"
          source: "docs/11-operations/MONITORING.md#5-alert-rules--confirmed"
      - alert: DuplicateMatchResults
        expr: sum by (mode) (increase(eduworld_match_results_total{result="duplicate_rejected"}[5m])) > 20
        labels: { severity: warning, module: competition }
        annotations:
          summary: "More than 20 duplicate match results rejected in 5 minutes ({{ $labels.mode }})"
          runbook_url: "docs/11-operations/runbooks/DuplicateMatchResults.md"
          source: "docs/11-operations/MONITORING.md#5-alert-rules--confirmed"

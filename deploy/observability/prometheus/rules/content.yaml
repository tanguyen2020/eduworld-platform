# Content publishing, content cache and media pipeline alerts (F131 T023, MONITORING §5, ADR-0043, ADR-0044).
# ContentPublishSlow threshold = publish_to_visible_max (30 s, CONFIG_DEFAULTS).
groups:
  - name: content
    rules:
      - alert: ContentPublishSlow
        expr: histogram_quantile(0.95, sum by (le) (rate(eduworld_content_publish_to_visible_seconds_bucket[15m]))) > 30
        for: 15m
        labels: { severity: warning, module: learning }
        annotations:
          summary: "p95 publish → visible above 30 s for 15 minutes (publish_to_visible_max)"
          runbook_url: "docs/11-operations/runbooks/ContentPublishSlow.md"
          source: "docs/11-operations/MONITORING.md#5-alert-rules--confirmed"
      - alert: ContentCacheHitLow
        expr: |
          sum(rate(eduworld_content_cache_requests_total{layer="valkey",result="hit"}[30m]))
            / sum(rate(eduworld_content_cache_requests_total{layer="valkey"}[30m])) < 0.9
          and on() eduworld:school_hours
        for: 30m
        labels: { severity: warning, module: learning }
        annotations:
          summary: "Valkey content cache hit ratio below 90% for 30 minutes in school hours"
          runbook_url: "docs/11-operations/runbooks/ContentCacheHitLow.md"
          source: "docs/11-operations/MONITORING.md#5-alert-rules--confirmed"
      - alert: MediaPipelineBacklog
        expr: max(eduworld_media_queue_pending) > 200
        for: 15m
        labels: { severity: warning, module: learning, service: worker, profile: events }
        annotations:
          summary: "More than 200 media jobs pending for 15 minutes"
          runbook_url: "docs/11-operations/runbooks/MediaPipelineBacklog.md"
          source: "docs/11-operations/MONITORING.md#5-alert-rules--confirmed"
      - alert: MediaInfectedFile
        expr: sum(increase(eduworld_media_infected_total[10m])) > 0
        labels: { severity: warning, module: learning }
        annotations:
          summary: "The antivirus rejected an uploaded media file"
          runbook_url: "docs/11-operations/runbooks/MediaInfectedFile.md"
          source: "docs/11-operations/MONITORING.md#5-alert-rules--confirmed"

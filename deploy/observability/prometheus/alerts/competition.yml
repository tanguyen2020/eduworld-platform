# Alert rules of module competition (F091 T032, REALTIME_ARCHITECTURE §8): room tick budget ≤ 5 ms for a hub of 40,
# alert when the p99 goes over 20 ms. Loaded by prometheus.yml (rule_files).
groups:
  - name: competition-hub
    rules:
      - alert: CompetitionRoomTickSlow
        expr: histogram_quantile(0.99, sum by (le, room_type) (rate(eduworld_room_tick_duration_seconds_bucket[5m]))) > 0.02
        for: 10m
        labels: { severity: warning, module: competition }
        annotations:
          summary: "Room tick p99 > 20 ms ({{ $labels.room_type }})"
          description: "Budget ≤ 5 ms per tick for a hub instance of 40 (REALTIME_ARCHITECTURE §8). Check room count per core-api replica."
  # F104 T042 (MATCHMAKING §10): wait p95 > 60 s over 15 minutes, matchmaker pass > 1 s.
  - name: competition-matchmaking
    rules:
      - alert: MatchmakingWaitHigh
        expr: histogram_quantile(0.95, sum by (le, mode) (rate(eduworld_mm_wait_seconds_bucket{result="matched"}[15m]))) > 60
        for: 15m
        labels: { severity: warning, module: competition }
        annotations:
          summary: "Matchmaking wait p95 > 60 s ({{ $labels.mode }})"
          description: "NFR-PERF-007 targets p90 ≤ 45 s when the queue has enough players. Check queue sizes (eduworld_mm_queue_size) and the matchmaker loop."
      - alert: MatchmakerLoopSlow
        expr: histogram_quantile(0.95, sum by (le) (rate(eduworld_mm_loop_duration_seconds_bucket[5m]))) > 1
        for: 10m
        labels: { severity: warning, module: competition }
        annotations:
          summary: "Matchmaker pass p95 > 1 s"
          description: "One pass over every queue must stay under 1 s (MATCHMAKING §10). Check Valkey latency and the number of queues per worker."

# Alert rules of module game — Game Analytics (F080 T050, GAME_ANALYTICS §9–§10, MONITORING). Loaded by prometheus.yml
# (rule_files). Labels never carry a user id (R14).
groups:
  - name: game-analytics
    rules:
      - alert: AnalyticsRawRowsHigh
        expr: sum(eduworld_analytics_raw_rows) > 500000000
        for: 14d
        labels: { severity: warning, module: game }
        annotations:
          summary: "analytics.events_raw passed 500 million rows (analytics_store_migration_threshold)"
          description: "Two weeks above the threshold of GAME_ANALYTICS §10: decide the analytics store migration by a new ADR (ADR-0058)."
      - alert: RollupLagHigh
        expr: histogram_quantile(0.95, sum by (le) (rate(eduworld_analytics_rollup_duration_seconds_bucket{step="day"}[1h]))) > 7200
        for: 1h
        labels: { severity: warning, module: game }
        annotations:
          summary: "A tenant day of the Game Analytics rollup takes more than 2 hours (p95)"
          description: "GAME_ANALYTICS §10 threshold (rollup ngày > 2 h). Check the job analytics-rollup-hourly / dashboard-day-close-game and the size of events_raw."
      - alert: DayCloseNotDone
        expr: time() - max(eduworld_job_runs_total{job="dashboard-day-close-game", result="ok"} > 0) > 0 and absent(increase(eduworld_job_runs_total{job="dashboard-day-close-game", result="ok"}[2h]))
        for: 30m
        labels: { severity: warning, module: game }
        annotations:
          summary: "The Game Analytics day close has not succeeded for 2 hours"
          description: "Days stay provisional (is_partial) on the dashboards. Check the worker jobs logs of dashboard-day-close-game (DASHBOARD_DATA §4)."
      - alert: LateAnalyticsEventsHigh
        expr: sum(increase(eduworld_rollup_late_events_total[1h])) > 1000
        for: 1h
        labels: { severity: info, module: game }
        annotations:
          summary: "Many analytics events arrive later than analytics_late_event_window"
          description: "Rollups are not corrected for them (DASHBOARD_DATA §5): run a targeted backfill if needed."

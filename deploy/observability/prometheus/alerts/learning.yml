# Alert rules of module learning (F035 T068, LEARNING_EFFICACY_PLAN §6): an A/B experiment stopped by its guardrail
# (an arm at least experiment_guardrail_drop_pp points under the control). Loaded by prometheus.yml (rule_files).
groups:
  - name: learning-experiments
    rules:
      - alert: ExperimentGuardrailBreached
        expr: increase(eduworld_experiment_guardrail_breaches_total[1d]) > 0
        labels: { severity: warning, module: learning }
        annotations:
          summary: "An A/B learning experiment was stopped by its guardrail"
          description: "An arm lowered the primary metric by experiment_guardrail_drop_pp or more against the control; the students are back on the control. Review the results (getLearningExperimentResults)."

# Alert rules of module identity for the enforcement of the Safety Team (F124 T037, MONITORING §5, MODERATION §6.4):
# staff emails (job email-sender) and school notifications without any recipient. Labels carry templates only (R14).
# Loaded by prometheus.yml (rule_files).
groups:
  - name: identity-safety-mail
    rules:
      - alert: EmailDeliveryFailing
        expr: sum by (template) (increase(eduworld_email_deliveries_total{status="failed"}[15m])) > 0
        labels: { severity: critical, module: identity, team: safety }
        annotations:
          summary: "Staff emails of template {{ $labels.template }} failed after email_delivery_max_attempts"
          description: "Check the SMTP relay (EW_SMTP_*) and identity.email_deliveries (status failed, last_error_code); the school still sees the notification in the portal. Runbook: MONITORING §5."
          runbook_url: "docs/11-operations/MONITORING.md#runbook-email-delivery-failing"
      - alert: SchoolSafetyNotificationNoRecipient
        expr: sum by (template) (increase(eduworld_school_safety_notification_no_recipient_total[1h])) > 0
        labels: { severity: warning, module: identity, team: safety }
        annotations:
          summary: "A school safety notification has no School Admin or Tenant Admin to email"
          description: "Assign a School Admin to the school (or a Tenant Admin) and contact the school directly (MODERATION §6.4). Runbook: MONITORING §5."
          runbook_url: "docs/11-operations/MONITORING.md#runbook-email-delivery-failing"

# Alert rules of module chat (F116 T035, MODERATION §12.2, ADR-0030, ADR-0078): a moderation step switched off for the
# platform or a tenant raises a warning for operations at once (eduworld_chat_policy_disabled{tenant,step} = 1 while the
# step is off; tenant="platform" for the platform level). Loaded by prometheus.yml (rule_files).
groups:
  - name: chat-moderation
    rules:
      - alert: ChatModerationDisabled
        expr: max by (tenant, step) (eduworld_chat_policy_disabled) == 1
        labels: { severity: warning, module: chat }
        annotations:
          summary: "Moderation step {{ $labels.step }} switched off ({{ $labels.tenant }})"
          description: "Approved by two System Admins with a reason and expires_at ≤ 24 h (ADR-0078); pii and grooming always run. Check the reason and expiry in listModerationSwitches; it switches back on at expires_at (moderation-switch-expirer)."
  # Platform Safety Team (F121 T041, MODERATION §6.3, CHILD_SAFETY §11): gauges refreshed every 30 s by
  # moderation-sla-escalator (worker jobs). A p1 case without assignee for p1_unclaimed_alert_minutes (15 min) pages the
  # on-call (receiver safety-oncall, F124); escalations past report_sla show in the queue for the team lead.
  - name: chat-safety-team
    rules:
      - alert: ModerationP1Unclaimed
        expr: max(eduworld_moderation_case_unclaimed_age_seconds{severity="p1"}) > 900
        labels: { severity: critical, module: chat, team: safety }
        annotations:
          summary: "A p1 moderation case has no assignee for more than 15 minutes (p1_unclaimed_alert_minutes)"
          description: "Claim the oldest p1 case in the queue (listModerationCases?severity=p1&assignee=unassigned). Runbook: MONITORING §5 (on-call p1, CHILD_SAFETY §11)."
          runbook_url: "docs/11-operations/MONITORING.md#runbook-moderation-p1-unclaimed"
      - alert: ModerationSlaBreached
        expr: sum(eduworld_moderation_cases_open{severity="p1"}) > 0 and on() max(eduworld_moderation_case_unclaimed_age_seconds{severity="p1"}) > 3600
        labels: { severity: critical, module: chat, team: safety }
        annotations:
          summary: "A p1 moderation case missed its first-response SLA (report_sla: 1 hour)"
          description: "moderation-sla-escalator escalated it; the team lead takes it (MODERATION §6.3)."
          runbook_url: "docs/11-operations/MONITORING.md#runbook-moderation-p1-unclaimed"
      - alert: ModerationSchoolNotificationsOverdue
        expr: max(eduworld_moderation_school_notifications_overdue) > 0
        for: 1h
        labels: { severity: warning, module: chat, team: safety }
        annotations:
          summary: "School safety notifications past ack_due_at without acknowledgement"
          description: "school-notification-reminder reminded the school; follow up per MODERATION §6.4 (listSchoolSafetyNotificationsPlatform?overdue=true)."
  # Safety Team operations (F124 T037, MODERATION §6.1, §6.3): on-call coverage refreshed every minute by oncall-escalator.
  - name: chat-safety-operations
    rules:
      - alert: ModerationOncallGap
        expr: min by (oncall_role) (eduworld_moderation_oncall_coverage) == 0
        for: 5m
        labels: { severity: critical, module: chat, team: safety }
        annotations:
          summary: "No live on-call shift of role {{ $labels.oncall_role }} covers now"
          description: "p1 cases page the next level with people (MODERATION §6.3). The team lead creates the missing shift (createModerationOncallShift). Runbook: MONITORING §5."
          runbook_url: "docs/11-operations/MONITORING.md#runbook-moderation-oncall-gap"
  # In-game notifications (F123 T030, CHAT_SYSTEM §10): the chat.notify_* consumers fall behind (learning slow or down
  # keeps chat.notify_assignment from acking, F123-AC-07) or the push misses SC-001 (p95 ≤ 2 s from the source event).
  - name: chat-notifications
    rules:
      - alert: NotificationConsumerBacklog
        expr: max by (consumer) (eduworld_consumer_pending{consumer=~"chat\.notify_.*"}) > 1000
        for: 10m
        labels: { severity: warning, module: chat }
        annotations:
          summary: "Notification consumer {{ $labels.consumer }} has more than 1000 pending events for 10 minutes"
          description: "Students see their notifications late. chat.notify_assignment waits for module learning (listAssignmentRecipients); check DLQ_CHAT and the modcall errors of chat→learning."
      - alert: NotificationDeliverySlow
        expr: histogram_quantile(0.95, sum by (le) (rate(eduworld_notification_delivery_latency_seconds_bucket[10m]))) > 2
        for: 15m
        labels: { severity: warning, module: chat }
        annotations:
          summary: "p95 from the source event to notification.item.created above 2 s (SC-001 of F123)"
          description: "Check the lag of the chat.notify_* consumers and the Valkey publish of ew:rt:user:<id>."

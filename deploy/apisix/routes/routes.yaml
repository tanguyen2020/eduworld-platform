# F004 T004 — the single source of APISIX routes (API_DESIGN §10, ADR-0074 §5): rendered by
# scripts/render.mjs into standalone/{public,internal}/apisix.yaml (local) per environment; checked
# against the merged OpenAPI spec by scripts/check-routes.mjs. Values from the environment use ${VAR}
# (routes/env/<env>.env); no URL, host, CIDR or secret is written here (AGENTS R3).
#
# Fields: gateway public|internal|both · ip_allow (env var of the CIDR allowlist, internal gateway;
# default EW_ADMIN_CIDRS) · upstream core-api|realtime · modules (x-service of the
# operations served) · auth oidc|none|ticket · tenant_header required|optional|none · login (plugin
# ew-login-key profile) · rate (plugin ew-api-rate profile, api_rate_default per user; required with
# auth oidc) · body_max (bytes) · sensitive (never log/trace the body) · priority · cors game (route
# of the game client: CORS also allows the Web play origin(s) EW_CORS_GAME_ORIGINS, F133 — never on the
# portal cookie routes).

upstreams:
  core-api: ${EW_UPSTREAM_CORE_API}
  realtime: ${EW_UPSTREAM_REALTIME}

login_profiles:
  game: { fields: [username], device_count: ${EW_RATE_LOGIN_DEVICE_PER_MIN}, user_count: ${EW_RATE_LOGIN_USER_PER_MIN},
          global_count: ${EW_RATE_LOGIN_GLOBAL_PER_SEC}, global_window: 1, global_code: LOGIN_QUEUE_BUSY, name: game-login }
  game_refresh: { fields: [], device_count: ${EW_RATE_REFRESH_DEVICE_PER_MIN}, global_count: ${EW_RATE_LOGIN_GLOBAL_PER_SEC},
                  global_window: 1, global_code: LOGIN_QUEUE_BUSY, name: game-refresh }
  portal: { fields: [username, identifier], device_count: ${EW_RATE_PORTAL_DEVICE_PER_MIN}, user_count: ${EW_RATE_PORTAL_USER_PER_MIN},
            global_count: ${EW_RATE_PORTAL_GLOBAL_PER_SEC}, global_window: 1, global_code: RATE_LIMITED, name: portal-login }

# api_rate_default (SECURITY_ARCHITECTURE §14): per user (`sub`), reads and writes counted apart, in Valkey.
rate_store: { host: ${EW_RATELIMIT_VALKEY_HOST}, port: ${EW_RATELIMIT_VALKEY_PORT} }
rate_profiles:
  api: { read_count: ${EW_RATE_API_READ_PER_MIN}, write_count: ${EW_RATE_API_WRITE_PER_MIN} }
  session: { read_count: ${EW_RATE_SESSION_PER_MIN}, write_count: ${EW_RATE_SESSION_PER_MIN} }

routes:
  - id: auth-game-login
    gateway: public
    cors: game
    uris: [/api/v1/auth/game/login, /api/v1/auth/game/tenant:select]
    methods: [POST]
    upstream: core-api
    modules: [identity]
    auth: none
    tenant_header: none
    login: game
    body_max: 4096
    sensitive: true
    priority: 300

  - id: auth-game-token
    gateway: public
    cors: game
    uris: [/api/v1/auth/game/token:refresh]
    methods: [POST]
    upstream: core-api
    modules: [identity]
    auth: none
    tenant_header: required
    login: game_refresh
    body_max: 4096
    sensitive: true
    priority: 300

  # Logout uses the global bearer security of the spec (401 when the access token is invalid).
  - id: auth-game-logout
    gateway: public
    cors: game
    uris: [/api/v1/auth/game/logout]
    methods: [POST]
    upstream: core-api
    modules: [identity]
    auth: oidc
    rate: api
    tenant_header: required
    body_max: 4096
    sensitive: true
    priority: 300

  - id: auth-portal
    gateway: public
    host: ${EW_PORTAL_HOST}
    uris: [/api/v1/auth/portal/*]
    upstream: core-api
    modules: [identity]
    auth: none
    tenant_header: none
    login: portal
    body_max: 4096
    sensitive: true
    priority: 300

  - id: auth-session
    gateway: public
    uris: [/api/v1/auth/session, /api/v1/me/tenants]
    upstream: core-api
    modules: [identity]
    auth: oidc
    rate: session
    tenant_header: none
    body_max: 16384
    priority: 250

  - id: tenant-optional
    gateway: both
    uris: [/api/v1/auth/me, /api/v1/me/permissions, /api/v1/catalog/countries*, /api/v1/catalog/provinces*, /api/v1/catalog/schools*, /api/v1/cms/*]
    upstream: core-api
    modules: [identity, learning]
    auth: oidc
    rate: api
    tenant_header: optional
    body_max: 1048576
    priority: 200

  - id: game-client-config
    gateway: public
    cors: game
    uris: [/api/v1/game/client-config]
    methods: [GET]
    upstream: core-api
    modules: [game]
    auth: none
    tenant_header: none
    body_max: 1024
    priority: 250

  - id: portal-tenant
    gateway: both
    uris: [/api/v1/schools/*, /api/v1/tenant/*, /api/v1/lms/*, /api/v1/catalog/*]
    upstream: core-api
    modules: [identity, learning, game, chat, competition]
    auth: oidc
    rate: api
    tenant_header: required
    body_max: 1048576
    priority: 100

  - id: player
    gateway: public
    cors: game
    uris: [/api/v1/auth/*, /api/v1/me/*, /api/v1/students/*, /api/v1/learning/*, /api/v1/exams/*, /api/v1/game/*,
           /api/v1/multiplayer/*, /api/v1/competition/*, /api/v1/leaderboards/*, /api/v1/chat/*, /api/v1/social/*,
           /api/v1/notifications, /api/v1/notifications/*]
    upstream: core-api
    modules: [identity, learning, game, competition, chat]
    auth: oidc
    rate: api
    tenant_header: required
    body_max: 262144
    priority: 100

  - id: platform-internal
    gateway: internal
    uris: [/api/v1/admin/*, /api/v1/sis/*, /api/v1/game-admin/*, /api/v1/game-media*]
    upstream: core-api
    modules: [identity, learning, game, competition, chat]
    auth: oidc
    rate: api
    tenant_header: optional
    body_max: 1048576
    priority: 100

  # F017 (receiveSisChanges): SIS → EduWorld webhook. No token: the HMAC of the connection's webhook secret
  # authenticates the SIS in module identity; partner IP allowlist (EW_SIS_WEBHOOK_CIDRS) instead of the
  # admin VPN ranges; bodies carry student records (never logged).
  - id: sis-webhook
    gateway: internal
    uris: [/internal/sis/webhooks/*]
    methods: [POST]
    upstream: core-api
    modules: [identity]
    auth: none
    tenant_header: none
    ip_allow: EW_SIS_WEBHOOK_CIDRS
    body_max: 8388608
    sensitive: true
    priority: 110

  - id: realtime
    gateway: public
    cors: game
    uris: [/realtime/v1]
    upstream: realtime
    modules: [realtime]
    auth: ticket
    tenant_header: none
    websocket: true
    priority: 100

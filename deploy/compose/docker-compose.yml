# Local infrastructure (F001 T021, LOCAL_DEVELOPMENT §3.1). Run via `make up`.
# One PostgreSQL cluster with one database per module (ADR-0074 §4). Values are local-only.
name: eduworld

x-healthcheck: &hc
  interval: 5s
  timeout: 3s
  retries: 30
  start_period: 5s

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local}
      EW_DB_ROLE_PASSWORD: ${EW_DB_ROLE_PASSWORD:-change-me-local}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-change-me-local}
    ports: ["5432:5432"]
    volumes:
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      <<: *hc
      test: ["CMD-SHELL", "pg_isready -U postgres -d eduworld_chat"]

  valkey:
    image: valkey/valkey:8
    ports: ["6379:6379"]
    healthcheck:
      <<: *hc
      test: ["CMD", "valkey-cli", "ping"]

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports: ["4222:4222", "8222:8222"]
    volumes:
      - nats-data:/data
    healthcheck:
      <<: *hc
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8222/healthz | grep -q ok"]

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--http-port=8180"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-change-me-local}
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-change-me-local}
    ports: ["8180:8180"]
    volumes:
      - ../keycloak/themes/eduworld-ops:/opt/keycloak/themes/eduworld-ops:ro
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      <<: *hc
      start_period: 60s
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]

  # Applies deploy/keycloak/realm-eduworld.json (idempotent) — `make keycloak-import` (F004).
  keycloak-config:
    image: adorsys/keycloak-config-cli:6.4.0-26.1.0
    profiles: ["tools"]
    environment:
      KEYCLOAK_URL: http://keycloak:8180
      KEYCLOAK_USER: admin
      KEYCLOAK_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-change-me-local}
      KEYCLOAK_AVAILABILITYCHECK_ENABLED: "true"
      KEYCLOAK_AVAILABILITYCHECK_TIMEOUT: 120s
      IMPORT_VARSUBSTITUTION_ENABLED: "true"
      IMPORT_FILES_LOCATIONS: ${KC_IMPORT_FILES:-/config/realm-eduworld.json}
      KC_GAME_BACKEND_SECRET: ${KC_GAME_BACKEND_SECRET:-change-me-local}
      KC_PORTAL_CLIENT_SECRET: ${KC_PORTAL_CLIENT_SECRET:-change-me-local}
      KC_SIS_SYNC_SECRET: ${KC_SIS_SYNC_SECRET:-change-me-local}
      KC_SVC_IDENTITY_SECRET: ${KC_SVC_IDENTITY_SECRET:-change-me-local}
    volumes:
      - ../keycloak:/config:ro
    depends_on:
      keycloak: { condition: service_healthy }

  apisix:
    image: apache/apisix:3.13.0-debian
    environment:
      APISIX_STAND_ALONE: "true"
      EW_APISIX_LOGIN_KEY_SECRET: ${EW_APISIX_LOGIN_KEY_SECRET:-change-me-local}
    ports: ["9080:9080", "9443:9443"]
    volumes:
      - ../apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ../apisix/standalone/public/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
      - ../apisix/plugins:/usr/local/apisix/custom/apisix/plugins:ro
    healthcheck:
      <<: *hc
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9080'"]

  # Internal gateway (admin CIDRs only): /api/v1/admin, /sis, /game-admin, /game-media + portal routes (F004).
  apisix-internal:
    image: apache/apisix:3.13.0-debian
    environment:
      APISIX_STAND_ALONE: "true"
      EW_APISIX_LOGIN_KEY_SECRET: ${EW_APISIX_LOGIN_KEY_SECRET:-change-me-local}
    ports: ["9180:9080"]
    volumes:
      - ../apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ../apisix/standalone/internal/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
      - ../apisix/plugins:/usr/local/apisix/custom/apisix/plugins:ro
    healthcheck:
      <<: *hc
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9080'"]

  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["8025:8025", "1025:1025"]
    healthcheck:
      <<: *hc
      test: ["CMD", "/mailpit", "readyz"]

  floci:
    image: floci/floci:2.5.0
    environment:
      FLOCI_STORAGE_MODE: persistent
      FLOCI_SERVICES_S3_ENFORCE_AUTH: "true"
    ports: ["4566:4566"]
    volumes:
      - ../../data/floci:/app/data
    # Healthcheck comes from the image (/usr/local/bin/healthcheck.sh).

  s3-init:
    image: floci/floci:2.5.0-compat
    entrypoint: ["sh", "-c"]
    environment:
      AWS_ACCESS_KEY_ID: ${EW_S3_ACCESS_KEY:-test}       # floci default account (local/CI only)
      AWS_SECRET_ACCESS_KEY: ${EW_S3_SECRET_KEY:-test}
      AWS_DEFAULT_REGION: us-east-1
    command:
      - |
        set -e
        S3="aws --endpoint-url http://floci:4566"
        for b in ew-media-quarantine ew-media-public ew-media-private ew-game-bundles ew-exports; do
          $$S3 s3api head-bucket --bucket "$$b" 2>/dev/null || $$S3 s3 mb "s3://$$b"
        done
        for b in ew-media-public ew-media-private ew-game-bundles; do
          $$S3 s3api put-bucket-versioning --bucket "$$b" --versioning-configuration Status=Enabled
        done
        echo "buckets ready"
    depends_on:
      floci: { condition: service_healthy }
    restart: "no"

  cdn:
    image: nginx:1.27-alpine
    ports: ["8090:8090"]
    volumes:
      - ../cdn/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      floci: { condition: service_healthy }
    healthcheck:
      <<: *hc
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8090/healthz | grep -q ok"]

  sis-mock:
    image: stoplight/prism:4
    command: ["mock", "-h", "0.0.0.0", "-p", "4010", "/specs/sis/eduworld-sis-contract.v1.yaml"]
    ports: ["4010:4010"]
    volumes:
      - ../../specs:/specs:ro
    healthcheck:
      <<: *hc
      test: ["CMD-SHELL", "node -e \"require('net').connect(4010,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))\""]

  clamav:
    image: clamav/clamav:1.4
    profiles: [media]
    ports: ["3310:3310"]

  nats-box:
    image: natsio/nats-box:0.16.0
    profiles: [tools]
    command: ["sleep", "infinity"]
    environment:
      NATS_URL: nats://nats:4222

volumes:
  postgres-data:
  nats-data:

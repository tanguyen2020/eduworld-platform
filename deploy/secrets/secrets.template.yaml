# Layout of the SOPS secret files of an environment (F130 T024, DEPLOYMENT §13, research R1). NOT a secret file:
# keys only. Create deploy/secrets/<env>/<owner>.sops.yaml with the keys of one owner (module, binary, infra, backup,
# ops), put GENERATED high-entropy values (never reuse across environments), then `sops --encrypt --in-place <file>`
# (recipients: deploy/secrets/.sops.yaml). Every key below must exist in exactly one file of the environment:
#   sops -d --output-type json deploy/secrets/<env>/*.sops.yaml | jq -s add > /dev/shm/s.json
#   node scripts/deploy/list-secrets.mjs <env> --check /dev/shm/s.json && shred -u /dev/shm/s.json
# The list is generated from the stacks + one-off jobs: node scripts/deploy/list-secrets.mjs <env>.

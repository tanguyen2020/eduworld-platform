# SOPS creation rules (F130 T024, research R1, DEPLOYMENT §13): one age recipient set per environment. The public
# recipients below are PLACEHOLDERS — `sops` refuses to encrypt until the Release Manager / DevOps lead replace them with
# the real age public keys of the environment (the private keys live only in the GitHub Environment secret SOPS_AGE_KEY
# and with the key holders). Only values are encrypted; keys (= Docker secret names) stay readable for review.
creation_rules:
  - path_regex: deploy/secrets/staging/[^/]+\.sops\.yaml$
    encrypted_regex: '^(?!sops$).*'
    age: age1replace-with-the-staging-recipient-public-key
  - path_regex: deploy/secrets/production/[^/]+\.sops\.yaml$
    encrypted_regex: '^(?!sops$).*'
    age: age1replace-with-the-production-recipient-public-key

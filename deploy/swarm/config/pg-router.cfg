# Patroni-aware PostgreSQL router (F130, DEPLOYMENT §7, RB-02): :5432 → current leader (Patroni REST GET /primary = 200),
# :5433 → replicas (GET /replica = 200; read context ADR-0087, dashboards ADR-0062, logical dumps). After a switchover the
# health checks move traffic within seconds; PgBouncer and the binaries reconnect without a task restart.
global
  maxconn 2000
defaults
  mode tcp
  timeout connect 5s
  timeout client 30m
  timeout server 30m
  default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
resolvers swarm
  nameserver dns 127.0.0.11:53
  hold valid 5s
frontend primary
  bind :5432
  default_backend pg_primary
frontend replicas
  bind :5433
  default_backend pg_replicas
backend pg_primary
  option httpchk GET /primary
  http-check expect status 200
  server pg-1 pg-1:5432 check port 8008 resolvers swarm init-addr none
  server pg-2 pg-2:5432 check port 8008 resolvers swarm init-addr none
  server pg-3 pg-3:5432 check port 8008 resolvers swarm init-addr none
backend pg_replicas
  balance roundrobin
  option httpchk GET /replica
  http-check expect status 200
  server pg-1 pg-1:5432 check port 8008 resolvers swarm init-addr none
  server pg-2 pg-2:5432 check port 8008 resolvers swarm init-addr none
  server pg-3 pg-3:5432 check port 8008 resolvers swarm init-addr none

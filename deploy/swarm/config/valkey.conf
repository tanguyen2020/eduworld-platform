# Valkey (F130, DEPLOYMENT §8): not a source of truth (ADR-0004); AOF everysec for fast restart only. Users and the
# replication credential come from the Docker secret valkey_acl (ACL file); no password on the command line.
bind 0.0.0.0
protected-mode yes
port 6379
appendonly yes
appendfsync everysec
dir /data
aclfile /run/secrets/valkey_acl
masteruser replicator
include /run/secrets/valkey_masterauth
maxmemory-policy allkeys-lru

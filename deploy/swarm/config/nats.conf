# NATS JetStream cluster node (F130, DEPLOYMENT §8b). server_name and routes come from the service environment;
# operator/JWT mode: the resolver config (operator, system account, account EDUWORLD — rendered from
# deploy/nats/accounts.template.conf by scripts/deploy/nats-accounts.sh) is the Docker secret nats_accounts mounted at
# /etc/nats/accounts.conf; users (one per binary + ops) and their subject permissions are signed into the .creds of each
# binary from deploy/nats/permissions.yaml (SECURITY_ARCHITECTURE §8.1); the cluster route password is the secret
# nats_cluster_password (read by the entrypoint).
server_name: $NATS_SERVER_NAME
listen: 0.0.0.0:4222
http: 0.0.0.0:8222
max_payload: 1MB
# The CONNECT line carries the user JWT; the worker JWT (permissions of deploy/nats/permissions.yaml) is ~6 KB, above
# the 4 KB default (F130 T053, scripts/deploy/validate-acl.sh). Keep >= 2x the largest JWT.
max_control_line: 16KB

jetstream {
  store_dir: /data/jetstream
  max_file_store: 80GB
}

cluster {
  name: eduworld
  listen: 0.0.0.0:6222
  authorization { user: route, password: $NATS_CLUSTER_PASSWORD }
  routes: [
    nats-route://route:$NATS_CLUSTER_PASSWORD@nats-1:6222
    nats-route://route:$NATS_CLUSTER_PASSWORD@nats-2:6222
    nats-route://route:$NATS_CLUSTER_PASSWORD@nats-3:6222
  ]
}

include accounts.conf

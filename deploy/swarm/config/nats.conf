# NATS JetStream cluster node (F130, DEPLOYMENT §8b). server_name and routes come from the service environment;
# accounts/users (one user per binary, SECURITY_ARCHITECTURE §8.1) are in the Docker secret nats_accounts mounted
# at /etc/nats/accounts.conf; the cluster route password is the secret nats_cluster_password (read by the entrypoint).
server_name: $NATS_SERVER_NAME
listen: 0.0.0.0:4222
http: 0.0.0.0:8222
max_payload: 1MB

jetstream {
  store_dir: /data/jetstream
  max_file_store: 80GB
}

cluster {
  name: eduworld
  listen: 0.0.0.0:6222
  authorization { user: route, password: $NATS_CLUSTER_PASSWORD }
  routes: [
    nats-route://route:$NATS_CLUSTER_PASSWORD@nats-1:6222
    nats-route://route:$NATS_CLUSTER_PASSWORD@nats-2:6222
    nats-route://route:$NATS_CLUSTER_PASSWORD@nats-3:6222
  ]
}

include accounts.conf

; PgBouncer (F130, DEPLOYMENT §7): transaction pooling, one pool per database/role; primary through pg-router:5432,
; read replicas (<db>_read entries, read context/dashboards) through pg-router:5433. Users/passwords: auth_file from the
; Docker secret pgbouncer_userlist (SCRAM verifiers, never plain text in Git). Keycloak needs session pooling.
[databases]
eduworld_identity = host=pg-router port=5432 dbname=eduworld_identity
eduworld_learning = host=pg-router port=5432 dbname=eduworld_learning
eduworld_game = host=pg-router port=5432 dbname=eduworld_game
eduworld_competition = host=pg-router port=5432 dbname=eduworld_competition
eduworld_chat = host=pg-router port=5432 dbname=eduworld_chat
eduworld_identity_read = host=pg-router port=5433 dbname=eduworld_identity
eduworld_learning_read = host=pg-router port=5433 dbname=eduworld_learning
eduworld_game_read = host=pg-router port=5433 dbname=eduworld_game
eduworld_competition_read = host=pg-router port=5433 dbname=eduworld_competition
eduworld_chat_read = host=pg-router port=5433 dbname=eduworld_chat
keycloak = host=pg-router port=5432 dbname=keycloak pool_mode=session

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir =
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 4000
default_pool_size = 40
reserve_pool_size = 10
server_reset_query =
server_check_delay = 10
server_lifetime = 1800
ignore_startup_parameters = extra_float_digits,options
admin_users =
stats_users =
log_connections = 0
log_disconnections = 0

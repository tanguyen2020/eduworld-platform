# Scale schedule of production (F130 US5, DEPLOYMENT §4.2, §4.4; ADR-0024 mục 4, ADR-0045). Schema:
# deploy/swarm/schema/scale-schedule.schema.json. Windows = warm_up_windows (CONFIG_DEFAULTS, ICT), peak reached
# lead_minutes (15) before each window; baseline/peak = "Replica thường → đỉnh" of DEPLOYMENT §4.2. worker-jobs stays at 2
# (leader + standby) and is not scheduled. No autoscale on load.
version: 1
stack: eduworld
timezone: Asia/Ho_Chi_Minh
lead_minutes: 15
windows:
  - { name: morning, start: "06:45", end: "08:00" }
  - { name: afternoon, start: "13:15", end: "14:30" }
  - { name: evening, start: "19:00", end: "21:00" }
services:
  - { name: keycloak, baseline: 4, peak: 6 }
  - { name: apisix, baseline: 3, peak: 5 }
  - { name: core-api, baseline: 6, peak: 16 }
  - { name: realtime, baseline: 4, peak: 6 }
  - { name: worker-events, baseline: 2, peak: 4 }
  - { name: worker-chat, baseline: 2, peak: 4 }

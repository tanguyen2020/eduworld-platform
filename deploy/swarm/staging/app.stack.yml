    command: ["--profile=chat"]
    env_file: [worker.env]
    environment:
      OTEL_SERVICE_NAME: worker-chat
      EW_WORKER_PROFILE: chat
      EW_DB_CHAT_URL_FILE: /run/secrets/chat_db_dsn
      EW_DB_CHAT_PLATFORM_URL_FILE: /run/secrets/chat_platform_dsn
      EW_DB_CHAT_PURGER_URL_FILE: /run/secrets/chat_purger_dsn     # gameplay-chat-purge only (ADR-0033)
      EW_PAGE_CURSOR_KEY_FILE: /run/secrets/shared_page_cursor_key
      EW_CDN_SIGNING_KEY_FILE: /run/secrets/shared_cdn_signing_key
      EW_NATS_CREDS_FILE: /run/secrets/worker_nats_creds
      EW_VALKEY_PASSWORD_FILE: /run/secrets/worker_valkey_password
      EW_S3_ACCESS_KEY_FILE: /run/secrets/s3_worker_access_key
      EW_S3_SECRET_KEY_FILE: /run/secrets/s3_worker_secret_key
    secrets: [chat_db_dsn, chat_platform_dsn, chat_purger_dsn, shared_page_cursor_key, shared_cdn_signing_key, worker_nats_creds,
      worker_valkey_password, s3_worker_access_key, s3_worker_secret_key]
    networks: [app, data]
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "/app/worker", "healthcheck", "--endpoint=/livez"]
    stop_grace_period: 40s
    logging: *logging
    deploy:
      replicas: 2
      labels: { ew.binary: worker, ew.profile: chat }
      placement:
        constraints: [node.labels.role == app]
        preferences: [{ spread: node.labels.zone }]
      resources:
        limits: { cpus: "2", memory: 2G }
        reservations: { cpus: "1", memory: 1G }
      <<: *backend-update

  worker-jobs:
    image: ghcr.io/${GHCR_ORG}/eduworld/worker:${BACKEND_VERSION}
    command: ["--profile=jobs"]
    env_file: [worker.env]
    environment:
      OTEL_SERVICE_NAME: worker-jobs
      EW_WORKER_PROFILE: jobs
      EW_DB_IDENTITY_URL_FILE: /run/secrets/identity_db_dsn
      EW_DB_IDENTITY_PLATFORM_URL_FILE: /run/secrets/identity_platform_dsn
      EW_DB_IDENTITY_PARTITION_ADMIN_URL_FILE: /run/secrets/identity_partition_admin_dsn
      EW_DB_LEARNING_URL_FILE: /run/secrets/learning_db_dsn
      EW_DB_LEARNING_PLATFORM_URL_FILE: /run/secrets/learning_platform_dsn
      EW_DB_LEARNING_PARTITION_ADMIN_URL_FILE: /run/secrets/learning_partition_admin_dsn
      EW_DB_GAME_URL_FILE: /run/secrets/game_db_dsn
      EW_DB_GAME_PLATFORM_URL_FILE: /run/secrets/game_platform_dsn
      EW_DB_COMPETITION_URL_FILE: /run/secrets/competition_db_dsn
      EW_DB_COMPETITION_PLATFORM_URL_FILE: /run/secrets/competition_platform_dsn
      EW_DB_CHAT_URL_FILE: /run/secrets/chat_db_dsn
      EW_DB_CHAT_PLATFORM_URL_FILE: /run/secrets/chat_platform_dsn
      EW_KC_ADMIN_CLIENT_SECRET_FILE: /run/secrets/kc_svc_identity
      EW_SMTP_PASSWORD_FILE: /run/secrets/identity_smtp_password
      EW_ANALYTICS_PLAYER_KEYS_FILE: /run/secrets/game_analytics_player_keys
      EW_EFFICACY_PSEUDONYM_KEY_FILE: /run/secrets/learning_efficacy_pseudonym_key
      EW_PAGE_CURSOR_KEY_FILE: /run/secrets/shared_page_cursor_key
      EW_CDN_SIGNING_KEY_FILE: /run/secrets/shared_cdn_signing_key
      EW_NATS_CREDS_FILE: /run/secrets/worker_nats_creds
      EW_VALKEY_PASSWORD_FILE: /run/secrets/worker_valkey_password
      EW_S3_ACCESS_KEY_FILE: /run/secrets/s3_worker_access_key
      EW_S3_SECRET_KEY_FILE: /run/secrets/s3_worker_secret_key
    secrets:
      [identity_db_dsn, identity_platform_dsn, identity_partition_admin_dsn, learning_db_dsn, learning_platform_dsn,
       learning_partition_admin_dsn, game_db_dsn, game_platform_dsn, competition_db_dsn, competition_platform_dsn, chat_db_dsn,
       chat_platform_dsn, kc_svc_identity, identity_smtp_password, game_analytics_player_keys, learning_efficacy_pseudonym_key,
       shared_page_cursor_key, shared_cdn_signing_key, worker_nats_creds, worker_valkey_password, s3_worker_access_key,
       s3_worker_secret_key]
    networks: [app, data]
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "/app/worker", "healthcheck", "--endpoint=/livez"]
    stop_grace_period: 40s                                       # releases the leader lock on SIGTERM (§11.2)
    logging: *logging
    deploy:
      replicas: 2
      labels: { ew.binary: worker, ew.profile: jobs }
      placement:
        constraints: [node.labels.role == app]
        preferences: [{ spread: node.labels.zone }]
      resources:
        limits: { cpus: "1", memory: 1G }
        reservations: { cpus: "0.5", memory: 512M }
      <<: *backend-update

networks:
  edge: { external: true }
  app: { external: true }
  data: { external: true }

# External, versioned secrets (<name>_v<N>, created by scripts/deploy/secrets-sync.sh from deploy/secrets/staging/*.sops.yaml).

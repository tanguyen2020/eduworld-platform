        - lms
      operationId: gradeReviewTask
      summary: Chấm theo rubric + nhận xét (RUBRIC_INCOMPLETE) — permission lms.review.grade
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ReviewTaskIdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewGradeInput'
      responses:
        '200':
          description: Evaluation có hiệu lực
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evaluation'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /lms/reviews/{review_task_id}:return:
    post:
      x-service: learning
      tags:
        - lms
      operationId: returnReviewTask
      summary: Trả bài cho học sinh làm tiếp (attempt → returned)
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ReviewTaskIdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - feedback
              properties:
                feedback:
                  type: string
                  minLength: 1
                  maxLength: 4000
      responses:
        '200':
          description: Đã trả bài
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewTaskSummary'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /lms/reviews/{review_task_id}:regrade:
    post:
      x-service: learning
      tags:
        - lms
      operationId: regradeReviewTask
      summary: Chấm lại (reason bắt buộc) → evaluation mới, evaluation cũ superseded
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ReviewTaskIdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:

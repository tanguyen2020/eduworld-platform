components:
  parameters:
    TenantIdHeader:
      name: X-Tenant-Id
      in: header
      required: true
      description: |
        Tenant của phiên (ADR-0065). Lấy từ `PlayerBootstrap.tenant_id` (game) hoặc tenant đã chọn sau đăng nhập portal (`GET /me/tenants`).
        Gateway trả `400 TENANT_HEADER_REQUIRED` khi thiếu, `400 BAD_REQUEST` khi sai định dạng; backend kiểm tra khớp token + membership,
        lệch → `403 TENANT_MISMATCH`. `Principal.tenant_id` lấy từ kết quả kiểm tra, không lấy thẳng từ header.
      schema:
        $ref: '#/components/schemas/Uuid'
    StudentId:
      name: student_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    SubjectIdQuery:
      name: subject_id
      in: query
      schema:
        $ref: '#/components/schemas/Uuid'
    GradeLevelQuery:
      name: grade_level
      in: query
      schema:
        $ref: '#/components/schemas/GradeLevel'
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: Ngôn ngữ hiển thị mong muốn (`vi-VN` mặc định, `en-US`). Server chọn ngôn ngữ trả về và đặt `Content-Language` (ADR-0056). Dữ liệu cache dài (manifest, snapshot) luôn trả đủ vi+en.
      schema:
        type: string
        maxLength: 64
        examples:
          - vi-VN
          - en-US
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      description: Cursor opaque từ page.next_cursor
      schema:
        type: string
        maxLength: 512
    LessonIdPath:
      name: lesson_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID do client sinh; lưu 24h (ADR-0010)
      schema:
        type: string
        format: uuid
    ExamSessionId:
      name: exam_session_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    AttemptId:
      name: attempt_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    TenantIdHeaderOptional:
      name: X-Tenant-Id
      in: header
      required: false
      description: |
        Người dùng tenant: **bắt buộc** (thiếu → `400 TENANT_HEADER_REQUIRED`). Role platform (System Admin, content_admin…):
        vắng mặt = phạm vi platform / đọc liên tenant bằng `tenant_ids`; có giá trị = tenant đích của thao tác ghi (ADR-0027, ADR-0065).
        Có giá trị thì luôn được kiểm tra như `TenantIdHeader`.
      schema:
        $ref: '#/components/schemas/Uuid'
    TenantIds:
      name: tenant_ids
      in: query
      required: false
      description: |
        Chỉ System Admin (platform.cross_tenant.read): lọc theo một hoặc nhiều tenant; vắng mặt = tất cả tenant.
        Người dùng tenant gửi tham số này bị bỏ qua (luôn khóa vào tenant của phiên) — ADR-0027 §6.
      style: form
      explode: true
      schema:
        type: array
        maxItems: 100
        items:
          $ref: '#/components/schemas/Uuid'
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        maxLength: 512
    Version:
      name: version
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    LearningContentType:
      name: content_type
      in: path
      required: true
      schema:
        type: string
        enum:
          - question
          - question_set
          - assessment_blueprint
          - lesson
          - learning_material
          - learning_path
          - activity
          - rubric
    ContentIdPath:
      name: content_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    TranslationJobIdPath:
      name: job_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    AssetIdPath:
      name: asset_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    DashboardFrom:
      name: from
      in: query
      required: true
      description: Ngày bắt đầu (bao gồm, theo múi giờ tenant). Khoảng `from`–`to` tối đa 730 ngày (`dashboard_max_range_days`) — vượt → `422 DASHBOARD_RANGE_TOO_LARGE` (DASHBOARD_DATA §8).
      schema:
        type: string
        format: date
    DashboardTo:
      name: to
      in: query
      required: true
      description: Ngày kết thúc (bao gồm). Phải ≥ `from`.
      schema:
        type: string
        format: date
    DashboardPageSize:
      name: page_size
      in: query
      required: false
      description: Số dòng của danh sách chi tiết (tối đa 100, phân trang cursor — DASHBOARD_DATA §8)
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    SchoolId:
      name: school_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    DashboardGrain:
      name: grain
      in: query
      required: false
      description: |
        Độ hạt **gợi ý**; server quyết định theo khoảng (≤ 31 ngày → day; 32 ngày–1 năm → week; > 1 năm → month) và chỉ chấp nhận
        độ hạt **thô hơn** quy tắc, không mịn hơn (DASHBOARD_DATA §8). Phản hồi luôn trả `grain` thực dùng.
      schema:
        $ref: '#/components/schemas/DashboardGrain'
    ReportIdPath:
      name: report_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ActivityIdPath:
      name: activity_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    RecordingIdPath:
      name: recording_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    RubricIdPath:
      name: rubric_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ReviewTaskIdPath:
      name: review_task_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
  schemas:
    Uuid:
      type: string
      format: uuid
      description: UUIDv7
    LearningProgress:
      type: object
      required:
        - student_id
        - objectives
      properties:
        student_id:
          $ref: '#/components/schemas/Uuid'
        totals:
          type: object
          properties:
            lessons_completed:
              type: integer
            items_answered:
              type: integer
            accuracy:
              type: number
              minimum: 0
              maximum: 1
            active_minutes:
              type: integer
        objectives:
          type: array
          items:
            type: object
            required:
              - objective_id
              - level
            properties:
              objective_id:
                $ref: '#/components/schemas/Uuid'
              level:
                $ref: '#/components/schemas/MasteryLevel'
              evidence_count:
                type: integer
              last_evidence_at:
                $ref: '#/components/schemas/Timestamp'
    MasteryLevel:
      type: string
      enum:
        - not_started
        - beginning
        - developing
        - proficient
        - mastered
    Timestamp:
      type: string
      format: date-time
    Problem:
      type: object
      required:
        - type
        - title
        - status
        - code
      properties:
        type:
          type: string
          maxLength: 2048
          format: uri
        title:
          type: string
          maxLength: 255

      summary: Sửa rubric draft (If-Match) — publish/rollback qua endpoint chung content/rubric
      parameters:
        - $ref: '#/components/parameters/TenantIdHeaderOptional'
        - $ref: '#/components/parameters/RubricIdPath'
        - $ref: '#/components/parameters/IfMatch'

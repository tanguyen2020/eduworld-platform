                    - reason
                  properties:
                    reason:
                      type: string
                      minLength: 5
                      maxLength: 1000
      responses:
        '200':
          description: Evaluation mới
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evaluation'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /lms/project-groups:
    post:

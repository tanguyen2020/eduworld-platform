          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    maxItems: 200
                    items:
                      $ref: '#/components/schemas/SimulationTemplate'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /lms/reviews:
    get:
      x-service: learning
      tags:
        - lms
      operationId: listReviewTasks
      summary: Hàng đợi chấm bài (tự luận, nói, dự án) của giáo viên được phân công
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - name: class_id
          in: query
          schema:
            $ref: '#/components/schemas/Uuid'
        - $ref: '#/components/parameters/SubjectIdQuery'
        - name: status
          in: query
          schema:
            type: string
            enum:
              - pending
              - in_progress
              - graded
              - returned
        - name: due_before
          in: query
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/TenantIds'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - page
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ReviewTaskSummary'
                  page:
                    $ref: '#/components/schemas/PageInfo'
        '403':
          $ref: '#/components/responses/Forbidden'
  /lms/reviews/{review_task_id}:
    get:
      x-service: learning
      tags:
        - lms
      operationId: getReviewTask
      summary: Bài làm + rubric (version đã ghim) + gợi ý AI nếu tenant bật (ADR-0053, chỉ gợi ý)
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ReviewTaskIdPath'
      responses:
        '200':

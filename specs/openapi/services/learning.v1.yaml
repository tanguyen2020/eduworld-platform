                class_id:
                  $ref: '#/components/schemas/Uuid'
                name:
                  type: string
                  minLength: 1
                  maxLength: 128
                member_ids:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items:
                    $ref: '#/components/schemas/Uuid'
      responses:
        '201':
          description: Đã tạo nhóm

  headers:
    ContentLanguage:
      description: Ngôn ngữ của văn bản đã chọn trong response (`vi-VN` | `en-US`)
      schema:
        type: string
        maxLength: 16
    RateLimitLimit:
      schema:
        type: integer
    RateLimitRemaining:
      schema:
        type: integer
    RateLimitReset:
      schema:
        type: integer
    RetryAfter:
      schema:
        type: integer
    ETag:
      description: Phiên bản tài nguyên cho optimistic concurrency
      schema:
        type: string
        maxLength: 512
  responses:
    ValidationFailed:
      description: VALIDATION_FAILED, ATTEMPT_DEADLINE_PASSED, INVALID_STATE_TRANSITION, MODERATION_SWITCH_REASON_REQUIRED, SENSITIVE_TERM_INVALID, SENSITIVE_CATALOG_REGRESSION_FAILED, DASHBOARD_RANGE_TOO_LARGE; sub-code `errors[].code = PERMISSION_NOT_ALLOWED_FOR_SCOPE` khi role tenant chứa permission platform
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
    RateLimited:
      description: RATE_LIMITED, LOGIN_QUEUE_BUSY (hàng chờ đăng nhập game, ADR-0045/0068)
      headers:
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: Dịch vụ phụ thuộc tạm thời không sẵn sàng (vd. CHAT_TEMPORARILY_UNAVAILABLE khi NATS JetStream lỗi) — client thử lại theo Retry-After
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthenticated:
      description: Thiếu/sai/hết hạn token (UNAUTHENTICATED)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: PERMISSION_DENIED, GAME_ACCESS_STUDENT_ONLY, FORBIDDEN_SCOPE, POLICY_DENIED, TENANT_NOT_SELECTED, TENANT_MISMATCH, TENANT_ACCESS_DISABLED, RESOURCE_NOT_ASSIGNED, ACCOUNT_LOCKED, ACCOUNT_DEACTIVATED, ACCOUNT_NOT_PROVISIONED, NO_ACTIVE_ENROLLMENT, ACCESS_OUTSIDE_ALLOWED_HOURS, PARTY_NOT_LEADER, PARTY_INVITE_NOT_ALLOWED, PARTY_POLICY_VIOLATION, CHAT_NOT_ALLOWED, CHAT_KIND_NOT_ALLOWED, CHAT_MUTED, TENANT_TOGGLE_NOT_ALLOWED, PORTAL_ACCESS_STAFF_ONLY
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem:
      description: Lỗi (RFC 9457)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Không tồn tại hoặc ngoài tenant scope (NOT_FOUND)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Xung đột trạng thái (vd. CONTENT_VERSION_CONFLICT, CONTENT_NOT_PUBLISHED, SIS_SCHOOL_ALREADY_CONNECTED, ATTEMPT_ALREADY_SUBMITTED, EXAM_ALREADY_SUBMITTED, PARTY_ALREADY_IN_PARTY, PARTY_FULL, MM_TICKET_ALREADY_ACTIVE, IDEMPOTENCY_KEY_REUSED, IDENTITY_CONFLICT, USERNAME_TAKEN, EMAIL_TAKEN)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailed:
      description: VERSION_MISMATCH
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionRequired:
      description: IDEMPOTENCY_KEY_REQUIRED hoặc PRECONDITION_REQUIRED
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PayloadTooLarge:
      description: MEDIA_TOO_LARGE — vượt giới hạn dung lượng của loại media (ADR-0044)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  securitySchemes:
    keycloakBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token Keycloak (realm eduworld, aud eduworld-api, TTL 5 phút).
    keycloakAdminBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token Keycloak của Admin Portal (claim `azp = eduworld-portal`) có MFA (`acr` mức MFA, `amr` chứa otp/webauthn; thiếu → 403 MFA_REQUIRED),
        Principal phải có role platform với permission tương ứng (`game.*`, `competition.config.*`, `platform.*`).
        Chỉ dùng trên gateway nội bộ (ADR-0027).
    keycloakOidc:
      type: openIdConnect
      description: Host thật theo môi trường (`sso.<env>.<domain>`, OQ-10); URL dưới đây là placeholder hợp lệ.
      openIdConnectUrl: https://sso.eduworld.example/realms/eduworld/.well-known/openid-configuration

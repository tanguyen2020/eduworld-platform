      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/MyTenant'
        has_platform_role:
          type: boolean
          description: true nếu người dùng có UserRole platform còn hiệu lực (vào phạm vi platform, không cần chọn tenant)

    GameLoginProblem:
      description: |
        Problem của `/auth/game/login` và `/auth/game/tenant:select`. Khi `code = TENANT_NOT_SELECTED` có `choices` (các tenant còn
        hiệu lực của học sinh — ADR-0063) + `login_ticket` (dùng một lần, TTL 2 phút, gắn `device_id`); khi `code = ACTIVE_SESSION_ON_OTHER_DEVICE` có `other_device`.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            choices:
              type: array
              minItems: 2
              maxItems: 20
              items:
                $ref: '#/components/schemas/GameLoginTenantChoice'
            login_ticket:
              type: string
              minLength: 16
              maxLength: 128
            login_ticket_expires_at:
              $ref: '#/components/schemas/Timestamp'
            other_device:
              type: object
              properties:
                platform:
                  type: string
                  maxLength: 32
                device_label:
                  type: string
                  maxLength: 128
                last_seen_at:
                  $ref: '#/components/schemas/Timestamp'
    GameLoginTenantChoice:
      type: object
      required:
        - tenant_id
        - tenant_type
        - name
      properties:
        tenant_id:
          $ref: '#/components/schemas/Uuid'
        tenant_type:
          $ref: '#/components/schemas/TenantType'
        name:
          type: string
          maxLength: 255
        school_name:
          type: string
          maxLength: 255
          description: Trường của học sinh trong tenant đó (để học sinh nhận ra)
        logo_url:
          type: string
          maxLength: 2048
          format: uri
    ValidationProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            errors:
              type: array
              items:
                type: object
                required:
                  - field
                  - code
                properties:
                  field:
                    type: string
                    maxLength: 64
                  code:
                    type: string
                    maxLength: 64
                  message:
                    type: string
                    maxLength: 1000
    ClientVersionProblem:
      description: '`426 CLIENT_VERSION_UNSUPPORTED` — game hiển thị màn cập nhật'
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required:
            - min_client_version
          properties:
            min_client_version:
              type: string
              maxLength: 32
            store_url:
              type: string
              maxLength: 2048
              format: uri
    GameTenantSelectRequest:
      type: object
      required:
        - login_ticket
        - tenant_id
        - device_id
      additionalProperties: false
      properties:
        login_ticket:
          type: string
          minLength: 16
          maxLength: 128
          writeOnly: true
        tenant_id:
          $ref: '#/components/schemas/Uuid'
        device_id:
          $ref: '#/components/schemas/Uuid'
        takeover:
          type: boolean
          default: false
    GameTokenRefreshRequest:
      type: object
      required:
        - refresh_token
      additionalProperties: false
      properties:
        refresh_token:
          type: string
          maxLength: 8192
          writeOnly: true
    GameLogoutRequest:
      type: object
      additionalProperties: false
      properties:
        refresh_token:
          type: string
          maxLength: 8192
          writeOnly: true
    PermissionSet:
      type: object
      required:
        - roles
        - permissions
      properties:
        tenant_id:
          description: Tenant của phiên; null với System Admin ở phạm vi platform
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/EffectiveRole'
        permissions:
          type: array
          description: 'Ví dụ: lms.assignment.write, learning_content.publish, game.quest.write (chỉ role platform)'
          items:
            type: string
            maxLength: 64
            pattern: ^[a-z_]+(\.[a-z_]+)+$
        workspaces:
          type: array
          description: Workspace của Admin Portal người dùng được thấy (ADR-0027 mục 7). Chỉ dùng dựng menu, không phải nguồn quyết định quyền.
          items:
            type: string
            enum:
              - school_lms
              - content_studio
              - game_ops
              - live_ops
              - platform_admin
    MyTenantsResponse:
      type: object

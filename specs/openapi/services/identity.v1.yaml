    Province:
      type: object
      required:
        - province_id
        - code
        - country_code
        - name
        - short_name
        - province_type
        - status
      description: Đơn vị hành chính cấp tỉnh (34 tỉnh/thành từ 01/07/2025 — Nghị quyết 202/2025/QH15; 63 đơn vị cũ ở trạng thái inactive). Mã nội bộ `code` ổn định; `official_code` [TBD].
      properties:
        province_id:
          $ref: '#/components/schemas/Uuid'
        code:
          type: string
          maxLength: 64
          pattern: ^[a-z]{2}(\.old)?\.[a-z0-9-]+$
        country_code:
          type: string
          pattern: ^[A-Z]{2}$
          maxLength: 2
        official_code:
          type:
            - string
            - 'null'
          maxLength: 16
        name:
          $ref: '#/components/schemas/LocalizedName'
        short_name:
          $ref: '#/components/schemas/LocalizedName'
        province_type:
          type: string
          enum:
            - municipality
            - province
        effective_from:
          type:
            - string
            - 'null'
          format: date
        effective_to:
          type:
            - string
            - 'null'
          format: date
        status:
          type: string
          enum:
            - active
            - inactive
        successor_code:
          type:
            - string
            - 'null'
          maxLength: 64
          description: 'Với đơn vị inactive: mã đơn vị kế thừa hiện hành'
    SchoolPage:
      type: object
      required:
        - items

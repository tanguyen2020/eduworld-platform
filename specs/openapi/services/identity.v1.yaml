          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameLoginResponse'
        '401':
          description: INVALID_CREDENTIALS — Keycloak từ chối username/mật khẩu (không tồn tại, sai mật khẩu hoặc đang bị khóa tạm; một thông điệp chung)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: TENANT_NOT_SELECTED (học sinh thuộc nhiều tenant — kèm choices + login_ticket), GAME_ACCESS_STUDENT_ONLY, ACCOUNT_NOT_PROVISIONED, ACCOUNT_LOCKED, ACCOUNT_DEACTIVATED, NO_ACTIVE_ENROLLMENT, TENANT_ACCESS_DISABLED, ACCESS_OUTSIDE_ALLOWED_HOURS
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/GameLoginProblem'
        '409':
          description: ACTIVE_SESSION_ON_OTHER_DEVICE — gọi lại với `takeover = true` sau khi học sinh xác nhận
          content:
            application/problem+json:

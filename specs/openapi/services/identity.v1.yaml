    post:
      x-service: identity
      tags:
        - tenant
      operationId: createStudentCleanupExclusions
      summary: Loại trừ hoặc gia hạn học sinh khỏi đợt dọn
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CleanupExclusionRequest'
      responses:
        '204':
          description: Đã loại trừ
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    delete:
      x-service: identity
      tags:
        - tenant
      operationId: deleteStudentCleanupExclusions
      summary: Gỡ loại trừ (soft-delete bản ghi loại trừ)
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CleanupExclusionRequest'
      responses:
        '204':
          description: Đã gỡ
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/settings/student-cleanup:
    get:
      x-service: identity
      tags:
        - admin
      operationId: getStudentCleanupSettings
      summary: Cấu hình platform cho worker dọn học sinh (ADR-0032)
      x-internal: true
      security:
        - keycloakAdminBearer: []
      responses:
        '200':
          description: OK
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentCleanupSettings'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      x-service: identity
      tags:
        - admin
      operationId: putStudentCleanupSettings
      summary: Cập nhật cấu hình dọn học sinh (bắt buộc reason, audit)
      x-internal: true
      security:
        - keycloakAdminBearer: []
      parameters:
        - $ref: '#/components/parameters/TenantIdHeaderOptional'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentCleanupSettings'
      responses:
        '200':
          description: Đã cập nhật
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentCleanupSettings'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /admin/student-cleanup/runs:
    get:
      x-service: identity
      tags:
        - admin
      operationId: listStudentCleanupRuns
      summary: Lịch sử các lần chạy worker dọn học sinh
      x-internal: true
      security:
        - keycloakAdminBearer: []
      parameters:
        - $ref: '#/components/parameters/TenantIds'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentCleanupRunPage'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/student-cleanup/runs/{run_id}:approve:
    post:
      x-service: identity
      tags:
        - admin
      operationId: approveStudentCleanupRun
      summary: Xác nhận lần dọn vượt ngưỡng (> 10% học sinh tenant)
      x-internal: true
      security:
        - keycloakAdminBearer: []
      parameters:
        - $ref: '#/components/parameters/TenantIdHeaderOptional'
        - name: run_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Đã xác nhận, worker tiếp tục
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/settings/chat-retention:
    get:
      x-service: identity
      tags:
        - admin
      operationId: getChatRetentionSettings
      summary: Cấu hình thời hạn lưu chat gameplay (ADR-0033)
      x-internal: true
      security:
        - keycloakAdminBearer: []
      responses:
        '200':
          description: OK
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatRetentionSettings'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      x-service: identity
      tags:
        - admin
      operationId: putChatRetentionSettings
      summary: Cập nhật thời hạn lưu chat gameplay (tối thiểu 3 ngày → RETENTION_BELOW_MINIMUM)
      x-internal: true
      security:
        - keycloakAdminBearer: []
      parameters:
        - $ref: '#/components/parameters/TenantIdHeaderOptional'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRetentionSettings'
      responses:
        '200':
          description: Đã cập nhật
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatRetentionSettings'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /admin/users/{user_id}:lock:
    post:
      x-service: identity
      tags:
        - admin
      operationId: lockUser
      summary: Khóa tài khoản người dùng
      x-internal: true
      parameters:
        - $ref: '#/components/parameters/TenantIdHeaderOptional'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
              properties:
                reason:
                  type: string
                  maxLength: 500
      responses:
        '204':
          description: Đã khóa, phát user.access_revoked
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/sis/connections/{connection_id}/schools:
    get:
      x-service: identity
      tags:
        - admin
      operationId: listSisConnectionSchools
      summary: Danh sách trường gắn với một SIS connection (ADR-0046)
      x-internal: true
      security:
        - keycloakAdminBearer: []
      parameters:
        - $ref: '#/components/parameters/ConnectionIdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SisConnectionSchool'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      x-service: identity
      tags:
        - admin
      operationId: setSisConnectionSchools
      summary: Gán tập trường cho SIS connection — mỗi trường chỉ một connection hoạt động (SIS_SCHOOL_ALREADY_CONNECTED)
      x-internal: true
      security:
        - keycloakAdminBearer: []
      parameters:
        - $ref: '#/components/parameters/TenantIdHeaderOptional'
        - $ref: '#/components/parameters/ConnectionIdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - school_ids
                - reason
              properties:
                school_ids:
                  type: array
                  maxItems: 500
                  items:
                    $ref: '#/components/schemas/Uuid'
                reason:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: Danh sách trường sau khi gán
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SisConnectionSchool'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
components:
  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: Ngôn ngữ hiển thị mong muốn (`vi-VN` mặc định, `en-US`). Server chọn ngôn ngữ trả về và đặt `Content-Language` (ADR-0056). Dữ liệu cache dài (manifest, snapshot) luôn trả đủ vi+en.
      schema:
        type: string
        maxLength: 64
        examples:
          - vi-VN
          - en-US
    TenantIdHeader:
      name: X-Tenant-Id
      in: header
      required: true
      description: |
        Tenant của phiên (ADR-0065). Lấy từ `PlayerBootstrap.tenant_id` (game) hoặc tenant đã chọn sau đăng nhập portal (`GET /me/tenants`).
        Gateway trả `400 TENANT_HEADER_REQUIRED` khi thiếu, `400 BAD_REQUEST` khi sai định dạng; backend kiểm tra khớp token + membership,
        lệch → `403 TENANT_MISMATCH`. `Principal.tenant_id` lấy từ kết quả kiểm tra, không lấy thẳng từ header.
      schema:
        $ref: '#/components/schemas/Uuid'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID do client sinh; lưu 24h (ADR-0010)
      schema:
        type: string
        format: uuid
    TenantIdHeaderOptional:
      name: X-Tenant-Id
      in: header
      required: false
      description: |
        Người dùng tenant: **bắt buộc** (thiếu → `400 TENANT_HEADER_REQUIRED`). Role platform (System Admin, content_admin…):
        vắng mặt = phạm vi platform / đọc liên tenant bằng `tenant_ids`; có giá trị = tenant đích của thao tác ghi (ADR-0027, ADR-0065).
        Có giá trị thì luôn được kiểm tra như `TenantIdHeader`.
      schema:
        $ref: '#/components/schemas/Uuid'
    TenantIds:
      name: tenant_ids
      in: query
      required: false
      description: |
        Chỉ System Admin (platform.cross_tenant.read): lọc theo một hoặc nhiều tenant; vắng mặt = tất cả tenant.
        Người dùng tenant gửi tham số này bị bỏ qua (luôn khóa vào tenant của phiên) — ADR-0027 §6.
      style: form
      explode: true
      schema:
        type: array
        maxItems: 100
        items:
          $ref: '#/components/schemas/Uuid'
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      description: Cursor opaque từ page.next_cursor
      schema:
        type: string
        maxLength: 512
    StudentId:
      name: student_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    SchoolId:
      name: school_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    GradeLevelQuery:
      name: grade_level
      in: query
      schema:
        $ref: '#/components/schemas/GradeLevel'
    ResourceTypePath:
      name: resource_type
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ResourceType'
    ResourceIdPath:
      name: resource_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    RoleIdPath:
      name: role_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        maxLength: 512
    ReasonQuery:
      name: reason
      in: query
      required: true
      description: Lý do (ghi audit) — bắt buộc khi xóa/thu hồi
      schema:
        type: string
        minLength: 3
        maxLength: 1000
    UserRoleIdPath:
      name: user_role_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    CountryCodePath:
      name: code
      in: path
      required: true
      schema:
        type: string
        pattern: ^[A-Z]{2}$
        maxLength: 2
    ProvinceIdPath:
      name: province_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ConnectionIdPath:
      name: connection_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
  schemas:
    GameLoginRequest:
      type: object
      required:
        - username
        - password
        - device_id
        - client_version
        - platform
      additionalProperties: false
      description: Body của `POST /auth/game/login`. **Không bao giờ log** (APISIX, service, tracing); mật khẩu chỉ chuyển tiếp tới Keycloak.
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 128
          description: So sánh không phân biệt hoa thường sau chuẩn hóa trim/NFC; duy nhất trên SSO (ADR-0069)
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 256
          writeOnly: true
        device_id:
          $ref: '#/components/schemas/Uuid'
          description: UUID của bản cài game (giống header X-Device-Id)
        client_version:
          type: string
          maxLength: 32
          pattern: ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]{1,20})?$
        platform:
          type: string
          enum:
            - windows
            - macos
            - linux
            - android
            - ios
            - web
        locale:
          $ref: '#/components/schemas/Locale'
        takeover:
          type: boolean
          default: false
          description: true sau khi học sinh xác nhận đăng xuất thiết bị khác (ADR-0031)
    Uuid:
      type: string
      format: uuid
      description: UUIDv7
    Locale:
      type: string
      enum:
        - vi-VN
        - en-US
      description: Locale đầy đủ dùng ở client/HTTP (ADR-0056)
    GameLoginResponse:
      type: object
      required:
        - tokens
        - bootstrap
      properties:
        tokens:
          $ref: '#/components/schemas/GameTokenSet'
        bootstrap:
          $ref: '#/components/schemas/PlayerBootstrap'
          description: '`bootstrap.tenant_id` là giá trị header `X-Tenant-Id` của mọi request tiếp theo (ADR-0065)'
        game_session_id:
          $ref: '#/components/schemas/Uuid'
          description: Game session đã tạo trong cùng lời gọi (ghi login_events, last_login_at — ADR-0031)
    GameTokenSet:
      type: object
      required:
        - access_token
        - refresh_token
        - token_type
        - expires_in
        - refresh_expires_in
      description: Token Keycloak của học sinh (client `eduworld-game-backend`, `azp = eduworld-game-backend`). Game chỉ giữ trong RAM, không ghi xuống đĩa (ADR-0064).
      properties:
        access_token:
          type: string
          maxLength: 8192
        refresh_token:
          type: string
          maxLength: 8192
        token_type:
          type: string
          enum:
            - Bearer
        expires_in:
          type: integer
          minimum: 1
          description: Giây (mặc định 300)
        refresh_expires_in:
          type: integer
          minimum: 1
          description: Giây tới khi refresh token hết hạn theo idle (30 phút, tối đa 10 giờ — ADR-0064)
    PlayerBootstrap:
      type: object
      required:
        - user
        - tenant_id
        - tenant_type
        - is_common_tenant
        - game_profile
        - policies
        - feature_flags
      properties:
        user:
          $ref: '#/components/schemas/Principal'
        tenant_id:
          $ref: '#/components/schemas/Uuid'
          description: Giá trị header `X-Tenant-Id` của mọi request tiếp theo (ADR-0065)
        tenant_type:
          $ref: '#/components/schemas/TenantType'
        is_common_tenant:
          type: boolean
          description: true nếu học sinh không thuộc tenant SIS nào và vào tenant chung (ADR-0026, ADR-0063)
        tenant_name:
          type: string
          maxLength: 255
        student:
          $ref: '#/components/schemas/StudentSummary'
        school:
          $ref: '#/components/schemas/PlayerSchool'
        class:
          $ref: '#/components/schemas/PlayerClass'
        game_profile:
          $ref: '#/components/schemas/GameProfile'
        grade_band:
          $ref: '#/components/schemas/GradeBand'
        policies:
          type: object
          description: Policy hiệu lực rút gọn cho client (chỉ để hiển thị; server vẫn kiểm tra)
          properties:
            chat:
              type: object
              properties:
                allowed_kinds_by_channel:
                  type: object
                  additionalProperties:
                    type: array
                    items:
                      type: string
                      enum:
                        - text
                        - quick
                        - emoji
                direct_message_enabled:
                  type: boolean
            party:
              type: object
              properties:
                max_members:
                  type: integer
                  minimum: 2
                  maximum: 8
                  default: 4
                cross_class_allowed:
                  type: boolean
            play_time:
              type: object
              properties:
                break_reminder_minutes:
                  type: integer
                access_window:
                  type: string
                  maxLength: 64
                  description: vd. 06:30-21:30 Asia/Ho_Chi_Minh
        feature_flags:
          type: object
          additionalProperties:
            type: boolean
        content_manifest_version:
          type: string
          maxLength: 64
        server_time:
          $ref: '#/components/schemas/Timestamp'
        preferred_language:
          $ref: '#/components/schemas/Locale'
          description: Ngôn ngữ đã chọn của học sinh; vắng mặt = default_locale của tenant
        supported_locales:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/Locale'
    Principal:
      type: object
      required:
        - user_id
        - user_type
        - status
        - roles
      properties:
        user_id:
          $ref: '#/components/schemas/Uuid'
        user_type:
          type: string
          enum:
            - student
            - teacher
            - staff
            - admin
        status:
          type: string
          enum:
            - pending
            - active
            - locked
            - deactivated
        display_name:
          type: string
          maxLength: 128
        roles:
          type: array
          items:
            $ref: '#/components/schemas/EffectiveRole'
    EffectiveRole:
      type: object
      required:
        - role
        - scope_type
      properties:
        role:
          $ref: '#/components/schemas/RoleCode'
        scope_type:
          type: string
          enum:
            - platform
            - tenant
            - school
            - class
            - subject
        tenant_id:
          description: Tenant của assignment; null với scope platform
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        scope_id:
          $ref: '#/components/schemas/Uuid'
      description: Role hiệu lực rút gọn của Principal (tóm tắt từ UserRole, ADR-0066)
    RoleCode:
      type: string
      description: |
        Mã role (`identity.roles.code`). Role hệ thống seed sẵn — tenant: tenant_admin, school_admin, academic_manager, teacher,
        tenant_content_editor, tenant_content_reviewer, tenant_moderator; platform: system_admin, content_admin, content_reviewer,
        game_designer, liveops, competition_admin (ADR-0066). Tenant có thể tạo role tùy biến [Proposed] nên không dùng enum.
        `student` là realm role Keycloak của học sinh, không phải role portal.
      maxLength: 64
      pattern: ^[a-z][a-z0-9_]{1,63}$
    TenantType:
      type: string
      enum:
        - school
        - unit
        - common
      description: school = trường độc lập; unit = đơn vị nhiều trường; common = tenant chung (ADR-0005)
    StudentSummary:
      type: object
      required:
        - student_id
        - school_id
        - grade_level
      properties:
        student_id:
          $ref: '#/components/schemas/Uuid'
        display_name:
          type: string
          maxLength: 128
        school_id:
          $ref: '#/components/schemas/Uuid'
        school_name:
          type: string
          maxLength: 255
        grade_level:
          $ref: '#/components/schemas/GradeLevel'
        class_id:
          $ref: '#/components/schemas/Uuid'
        class_name:
          type: string
          maxLength: 128
    GradeLevel:
      type: integer
      minimum: 1
      maximum: 9
    PlayerSchool:
      type: object
      required:
        - school_id
        - name
        - is_virtual
      description: Trường của học sinh để hiển thị trong game (song ngữ, ADR-0056/0060)
      properties:
        school_id:
          $ref: '#/components/schemas/Uuid'
        name:
          $ref: '#/components/schemas/TenantLocalizedName'
        province:
          $ref: '#/components/schemas/ProvinceRef'
        school_level:
          $ref: '#/components/schemas/SchoolLevel'
        is_virtual:
          type: boolean
    TenantLocalizedName:
      type: object
      description: 'Tên do tenant nhập: vi bắt buộc, en tùy chọn (sự kiện trường — EVENT_SEASON_SYSTEM §10)'
      required:
        - vi
      additionalProperties: false
      properties:
        vi:
          type: string
          minLength: 1
          maxLength: 255
        en:
          type: string
          minLength: 1
          maxLength: 255
    ProvinceRef:
      type: object
      required:
        - code
        - name
      properties:
        code:
          type: string
          maxLength: 64
        name:
          $ref: '#/components/schemas/LocalizedName'
    LocalizedName:
      type: object
      description: Tên/nhãn hiển thị song ngữ bắt buộc cả vi và en (văn bản game — ADR-0056 mục 2)
      required:
        - vi
        - en
      additionalProperties: false
      properties:
        vi:
          type: string
          minLength: 1
          maxLength: 255
        en:
          type: string
          minLength: 1
          maxLength: 255
    SchoolLevel:
      type: string
      enum:
        - primary
        - lower_secondary
        - multi_level
    PlayerClass:
      type: object
      required:
        - class_id
        - name
        - grade_level
      properties:
        class_id:

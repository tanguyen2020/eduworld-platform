        country_code:
          type: string
          pattern: ^[A-Z]{2}$
          maxLength: 2
        name:
          $ref: '#/components/schemas/LocalizedName'
        default_locale:
          $ref: '#/components/schemas/Locale'
        status:
          type: string
          enum:
            - active

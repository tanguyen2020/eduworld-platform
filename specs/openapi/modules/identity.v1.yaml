          maxLength: 128
          pattern: ^[A-Za-z0-9._-]{3,128}$
        email:
          type: string
          format: email
          maxLength: 320
          description: Bắt buộc với nhân sự; duy nhất trên SSO (ADR-0069)
        display_name:
          type: string
          minLength: 1
          maxLength: 128
        user_type:

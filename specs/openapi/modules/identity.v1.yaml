    GameLoginProblem:
      description: |
        Problem của `/auth/game/login` và `/auth/game/tenant:select`. Khi `code = TENANT_NOT_SELECTED` có `choices` (các tenant còn
        hiệu lực của học sinh — ADR-0063) + `login_ticket` (dùng một lần, TTL 2 phút, gắn `device_id`). Xung đột thiết bị không trả ở đây
        mà ở `createGameSession` (ADR-0083).
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            choices:
              type: array
              minItems: 2
              maxItems: 20
              items:
                $ref: '#/components/schemas/GameLoginTenantChoice'
            login_ticket:
              type: string
              minLength: 16
              maxLength: 128
            login_ticket_expires_at:
              $ref: '#/components/schemas/Timestamp'
    GameLoginTenantChoice:
      type: object
      required:
        - tenant_id
        - tenant_type
        - name
      properties:
        tenant_id:
          $ref: '#/components/schemas/Uuid'
        tenant_type:
          $ref: '#/components/schemas/TenantType'
        name:
          type: string
          maxLength: 255
        school_name:
          type: string
          maxLength: 255
          description: Trường của học sinh trong tenant đó (để học sinh nhận ra)
        logo_url:
          type: string
          maxLength: 2048
          format: uri
    ValidationProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            errors:
              type: array
              items:
                type: object
                required:
                  - field
                  - code
                properties:
                  field:
                    type: string
                    maxLength: 64
                  code:
                    type: string
                    maxLength: 64
                  message:
                    type: string
                    maxLength: 1000
    ClientVersionProblem:
      description: '`426 CLIENT_VERSION_UNSUPPORTED` — game hiển thị màn cập nhật'
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required:
            - min_client_version
          properties:
            min_client_version:
              type: string
              maxLength: 32
            store_url:
              type: string
              maxLength: 2048
              format: uri
    GameTenantSelectRequest:
      type: object
      required:
        - login_ticket
        - tenant_id
        - device_id
      additionalProperties: false
      properties:
        login_ticket:
          type: string
          minLength: 16
          maxLength: 128
          writeOnly: true
        tenant_id:
          $ref: '#/components/schemas/Uuid'
        device_id:
          $ref: '#/components/schemas/Uuid'
    GameTokenRefreshRequest:
      type: object
      required:
        - refresh_token
        - device_id
      additionalProperties: false
      description: Body của `POST /auth/game/token:refresh`. **Không bao giờ log** (ADR-0086).
      properties:
        refresh_token:
          type: string
          minLength: 1
          maxLength: 8192
          writeOnly: true
        device_id:
          $ref: '#/components/schemas/Uuid'
          description: UUID của bản cài game (giống `GameLoginRequest.device_id`); phải trùng thiết bị gắn với phiên lúc đăng nhập, khác → `401 REFRESH_TOKEN_DEVICE_MISMATCH`
        mode:
          type: string
          enum:
            - renew
            - resume
          default: renew
          description: '`renew` — gia hạn khi đang chơi; `resume` — mở lại game bằng refresh token đã lưu (kiểm tra lại tài khoản/tenant, trả `bootstrap`)'
        client_version:
          type: string
          maxLength: 32
          pattern: ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]{1,20})?$
          description: Nên gửi khi `mode = resume` để kiểm tra `426`
    GameTokenRefreshResponse:
      description: Token mới sau xoay vòng; `bootstrap` chỉ có khi `mode = resume` (ADR-0086). Không có `game_session_id` — game client gọi `createGameSession` sau đó (ADR-0083).
      allOf:
        - $ref: '#/components/schemas/GameTokenSet'
        - type: object
          properties:
            bootstrap:
              $ref: '#/components/schemas/PlayerBootstrap'
              description: '`bootstrap.tenant_id` trùng header `X-Tenant-Id` của request'
    GameLogoutRequest:
      type: object
      additionalProperties: false
      properties:
        refresh_token:
          type: string
          maxLength: 8192
          writeOnly: true
    PortalLoginRequest:
      type: object
      required:
        - username
        - password
        - device_id
      additionalProperties: false
      description: Body của `POST /auth/portal/login`. **Không bao giờ log** (APISIX, module identity, tracing); mật khẩu chỉ chuyển tiếp tới Keycloak. Không có trường mã OTP (ADR-0094).
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 254
          description: Username hoặc email; không phân biệt hoa thường sau chuẩn hóa trim/NFC (ADR-0069)
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 256
          writeOnly: true
        device_id:
          $ref: '#/components/schemas/Uuid'
          description: UUID trình duyệt do portal sinh và lưu (không phải bí mật)
          dùng cho rate limit theo thiết bị: null
        locale:
          $ref: '#/components/schemas/Locale'
    PortalTokenResponse:
      type: object
      required:
        - access_token
        - token_type
        - expires_in
        - refresh_expires_in
        - auth_time
      description: |
        Access token Keycloak của Admin Portal (`azp = eduworld-portal`). Portal **chỉ giữ trong bộ nhớ** (không localStorage/sessionStorage);
        refresh token không bao giờ nằm trong body — chỉ trong cookie HttpOnly.
      properties:
        access_token:
          type: string
          maxLength: 8192
        token_type:
          type: string
          enum:
            - Bearer
        expires_in:
          type: integer
          minimum: 1
          description: Giây (mặc định 300)
        refresh_expires_in:
          type: integer
          minimum: 1
          description: Giây tới khi phiên hết hạn theo idle (30 phút) nhưng không vượt tối đa 10 giờ — `portal_session_sso`
        auth_time:
          $ref: '#/components/schemas/Timestamp'
          description: Lúc nhập mật khẩu của phiên; phiên nhân sự platform không làm mới được quá `EW_OIDC_PLATFORM_MAX_AUTH_AGE` (8 giờ) — ADR-0094 §2
    PortalLoginProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            setup_ticket:
              type: string
              minLength: 32
              maxLength: 128
              description: 'Chỉ có khi `code = ACCOUNT_SETUP_REQUIRED`: dùng một lần, hết hạn theo `portal_setup_ticket_ttl`'
            required_steps:
              type: array
              maxItems: 1
              uniqueItems: true
              items:
                $ref: '#/components/schemas/PortalSetupStep'
    PortalSetupStep:
      type: string
      enum:
        - update_password
      description: Bước thiết lập còn thiếu (required action Keycloak `UPDATE_PASSWORD`); không có bước OTP (ADR-0094)
    PortalSetupPasswordRequest:
      type: object
      required:
        - setup_ticket
        - new_password
      additionalProperties: false
      properties:
        setup_ticket:
          type: string
          minLength: 32
          maxLength: 128
          writeOnly: true
        new_password:
          type: string
          format: password
          minLength: 1
          maxLength: 256
          writeOnly: true
          description: Kiểm tra bằng password policy của realm Keycloak
    PortalSetupResult:
      type: object
      required:
        - remaining_steps
      properties:
        remaining_steps:
          type: array
          maxItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/PortalSetupStep'
    PortalForgotPasswordRequest:
      type: object
      required:
        - identifier
        - device_id
      additionalProperties: false
      properties:
        identifier:
          type: string
          minLength: 1
          maxLength: 254
          description: Username hoặc email của nhân sự
        device_id:
          $ref: '#/components/schemas/Uuid'
        locale:
          $ref: '#/components/schemas/Locale'
    PortalResetPasswordRequest:
      type: object
      required:
        - token
        - new_password
        - device_id
      additionalProperties: false
      properties:
        token:
          type: string
          minLength: 32
          maxLength: 128
          pattern: ^[A-Za-z0-9_-]+$
          writeOnly: true
          description: Token trong link email (base64url); server chỉ lưu SHA-256
        new_password:
          type: string
          format: password
          minLength: 1
          maxLength: 256
          writeOnly: true
        device_id:
          $ref: '#/components/schemas/Uuid'
    PermissionSet:
      type: object
      required:
        - roles
        - permissions
      properties:
        tenant_id:
          description: Tenant của phiên; null với System Admin ở phạm vi platform
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/EffectiveRole'
        permissions:
          type: array
          description: 'Ví dụ: lms.assignment.write, learning_content.publish, game.quest.write (chỉ role platform)'
          items:
            type: string
            maxLength: 64
            pattern: ^[a-z_]+(\.[a-z_]+)+$
        workspaces:
          type: array
          description: Workspace của Admin Portal người dùng được thấy (ADR-0027 mục 7). Chỉ dùng dựng menu, không phải nguồn quyết định quyền.
          items:
            type: string
            enum:
              - school_lms
              - content_studio
              - game_ops
              - live_ops
              - platform_admin
        disabled_menus:
          type: array
          maxItems: 1000
          description: Khóa menu (`menu.<workspace>.<menu>`) đang tắt hiệu lực với phạm vi phiên; portal ẩn menu này (ADR-0090)
          items:
            type: string
            maxLength: 128
            pattern: ^menu\.[a-z0-9_]+\.[a-z0-9_]+$
        disabled_actions:
          type: array
          maxItems: 2000
          description: Khóa action đang tắt hiệu lực (gồm action có menu cha đang tắt); portal ẩn/khóa nút, API trả `403 FEATURE_DISABLED`
          items:
            type: string
            maxLength: 128
            pattern: ^action\.[a-z0-9_]+\.[a-z0-9_]+\.[a-z0-9_]+$
    MyTenantsResponse:
      type: object
      required:
        - items
        - has_platform_role
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/MyTenant'
        has_platform_role:
          type: boolean
          description: true nếu người dùng có UserRole platform còn hiệu lực (vào phạm vi platform, không cần chọn tenant)
    MyTenant:
      allOf:
        - $ref: '#/components/schemas/TenantSummary'
        - type: object
          properties:
            logo_url:
              type: string
              maxLength: 2048
              format: uri
            role_codes:
              type: array
              maxItems: 50
              description: Mã role đang hiệu lực của người dùng trong tenant (tóm tắt để hiển thị)
              items:
                $ref: '#/components/schemas/RoleCode'
    TenantSummary:
      type: object
      required:
        - tenant_id
        - code
        - name
        - tenant_type
        - status
      properties:
        tenant_id:
          $ref: '#/components/schemas/Uuid'
        code:
          type: string
          maxLength: 64
        name:
          type: string
          maxLength: 255
        tenant_type:
          $ref: '#/components/schemas/TenantType'
        status:
          type: string
          enum:
            - active
            - disabled
        school_count:
          type: integer
        version:
          type: integer
          minimum: 1
          description: Version hiện tại của bản ghi = giá trị `If-Match` của updateTenant (OQ F057-3)
    Country:
      type: object
      required:
        - country_code
        - name
        - default_locale
        - status
      properties:
        country_code:
          type: string
          pattern: ^[A-Z]{2}$
          maxLength: 2
        name:
          $ref: '#/components/schemas/LocalizedName'
        default_locale:
          $ref: '#/components/schemas/Locale'
        status:
          type: string
          enum:
            - active
            - inactive
        version:
          type: integer
          minimum: 1
          description: Version hiện tại = giá trị `If-Match` của updateCountry (OQ F057-3)
    Province:
      type: object
      required:
        - province_id
        - code
        - country_code
        - name
        - short_name
        - province_type
        - status
      description: Đơn vị hành chính cấp tỉnh (34 tỉnh/thành từ 01/07/2025 — Nghị quyết 202/2025/QH15; 63 đơn vị cũ ở trạng thái inactive). Mã nội bộ `code` ổn định; `official_code` [TBD].
      properties:
        province_id:
          $ref: '#/components/schemas/Uuid'
        code:
          type: string
          maxLength: 64
          pattern: ^[a-z]{2}(\.old)?\.[a-z0-9-]+$
        country_code:
          type: string
          pattern: ^[A-Z]{2}$
          maxLength: 2
        official_code:
          type:
            - string
            - 'null'
          maxLength: 16
        name:
          $ref: '#/components/schemas/LocalizedName'
        short_name:
          $ref: '#/components/schemas/LocalizedName'
        province_type:
          type: string
          enum:
            - municipality
            - province
        effective_from:
          type:
            - string
            - 'null'
          format: date
        effective_to:
          type:
            - string
            - 'null'
          format: date
        status:
          type: string
          enum:
            - active
            - inactive
        successor_code:
          type:
            - string
            - 'null'
          maxLength: 64
          description: 'Với đơn vị inactive: mã đơn vị kế thừa hiện hành'
        version:
          type: integer
          minimum: 1
          description: Version hiện tại = giá trị `If-Match` của updateProvince (OQ F057-3)
    SchoolPage:
      type: object
      required:
        - items
        - page
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/School'
        page:
          $ref: '#/components/schemas/PageInfo'
    School:
      type: object
      required:
        - school_id
        - tenant_id
        - code
        - name
        - school_level
        - grade_min
        - grade_max
        - status
        - is_virtual
      properties:
        school_id:
          $ref: '#/components/schemas/Uuid'
        tenant_id:
          $ref: '#/components/schemas/Uuid'
        code:
          type: string
          maxLength: 64
        name:
          $ref: '#/components/schemas/TenantLocalizedName'
        country_code:
          type:
            - string
            - 'null'
          pattern: ^[A-Z]{2}$
          maxLength: 2
        province:
          $ref: '#/components/schemas/ProvinceRef'
        moet_code:
          type:
            - string
            - 'null'
          maxLength: 32
        school_level:
          $ref: '#/components/schemas/SchoolLevel'
        grade_min:
          $ref: '#/components/schemas/GradeLevel'
        grade_max:
          $ref: '#/components/schemas/GradeLevel'
        address:
          type:
            - string
            - 'null'
          maxLength: 500
        status:
          type: string
          enum:
            - pending_review
            - active
            - disabled
        is_virtual:
          type: boolean
          description: Trường ảo "EduWorld chung" của tenant common
        source:
          type: string
          enum:
            - sis
            - manual
            - import
        version:
          type: integer
          minimum: 1
    PageInfo:
      type: object
      required:
        - has_more
        - limit
      properties:
        next_cursor:
          type:
            - string
            - 'null'
          maxLength: 512
        has_more:
          type: boolean
        limit:
          type: integer
    Class:
      type: object
      required:
        - class_id
        - school_id
        - grade_level
        - name
      properties:
        class_id:
          $ref: '#/components/schemas/Uuid'
        school_id:
          $ref: '#/components/schemas/Uuid'
        academic_year_id:
          $ref: '#/components/schemas/Uuid'
        grade_level:
          $ref: '#/components/schemas/GradeLevel'
        name:
          type: string
          maxLength: 255
        student_count:
          type: integer
    SchoolAcademicYear:
      type: object
      additionalProperties: false
      description: Năm học của trường (`org.academic_years`, F010 T047); `end_date` > `start_date`.
      required:
        - academic_year_id
        - name
        - start_date
        - end_date
        - is_current
        - terms
      properties:
        academic_year_id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
          maxLength: 32
          description: Vd. "2026-2027"
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        is_current:
          type: boolean
          description: Năm học hiện hành của trường (tối đa một)
        terms:
          type: array
          maxItems: 4
          description: Học kỳ của năm học theo thứ tự thời gian; hiện luôn rỗng (chưa có nguồn dữ liệu học kỳ — câu hỏi mở F010-4)
          items:
            $ref: '#/components/schemas/AcademicTerm'
    AcademicTerm:
      type: object
      additionalProperties: false
      description: Học kỳ trong một năm học (khoảng ngày nằm trong năm học).
      required:
        - name
        - start_date
        - end_date
      properties:
        name:
          type: string
          maxLength: 32
          description: Vd. "Học kỳ I"
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
    SchoolSettings:
      type: object
      additionalProperties: false
      description: Cài đặt cấp trường (FR-ORG-007; ADMIN_PORTAL §3.9). Mọi khóa chỉ được siết chặt hơn cấp platform/tenant (ADR-0020, ADR-0078). Chat policy trường do F122 bổ sung.
      properties:
        school_id:
          readOnly: true
          allOf:
            - $ref: '#/components/schemas/Uuid'
        allowed_hours:
          $ref: '#/components/schemas/AllowedHours'
          description: Khung giờ truy cập của trường (chỉ siết chặt hơn tenant)
        class_leaderboard_enabled:
          type: boolean
        school_leaderboard_enabled:
          type: boolean
        student_club_creation:
          type: boolean
          default: false
        daily_play_limit_minutes:
          description: Giới hạn chơi/ngày (phút) áp như nhau cho mọi học sinh của trường, tính trên tổng thời gian game session trong ngày (ICT); `null` = tắt (mặc định — CONFIG_DEFAULTS `daily_play_limit_minutes`, CHILD_SAFETY §4, OQ-17). Phát trong `school.updated` cho module game; tenant `common` không áp; khoảng 15–300 phút [Proposed]
          oneOf:
            - type: integer
              minimum: 15
              maximum: 300
            - type: 'null'
        curfew_window:
          description: Khung giới nghiêm của trường (chỉ mở rộng, phải chứa trọn platform_curfew); null = chỉ áp platform_curfew
          oneOf:
            - $ref: '#/components/schemas/CurfewWindow'
            - type: 'null'
        platform_curfew:
          readOnly: true
          allOf:
            - $ref: '#/components/schemas/CurfewWindow'
        effective_curfew:
          readOnly: true
          description: Giới nghiêm hiệu lực của học sinh trường = hợp platform_curfew và curfew_window
          allOf:
            - $ref: '#/components/schemas/CurfewWindow'
        updated_at:
          readOnly: true
          allOf:
            - $ref: '#/components/schemas/Timestamp'
        reason:
          type: string
          minLength: 3
          maxLength: 500
          writeOnly: true
          description: Bắt buộc khi đổi curfew_window hoặc daily_play_limit_minutes (audit)
    AllowedHours:
      type: object
      additionalProperties: false
      required:
        - windows
      description: Khung giờ truy cập dùng chung cho tenant và trường (F015); cấp dưới chỉ siết chặt (ADR-0020). Giờ HH:MM theo `timezone` (mặc định múi giờ tenant).
      properties:
        timezone:
          type: string
          maxLength: 64
          example: Asia/Ho_Chi_Minh
        windows:
          type: array
          maxItems: 14
          items:
            type: object
            additionalProperties: false
            required:
              - days
              - from
              - to
            properties:
              days:
                type: array
                minItems: 1
                maxItems: 7
                uniqueItems: true
                items:
                  type: string
                  enum:
                    - mon
                    - tue
                    - wed
                    - thu
                    - fri
                    - sat
                    - sun
              from:
                type: string
                maxLength: 5
                pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
                example: '06:30'
              to:
                type: string
                maxLength: 5
                pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
                example: '21:30'
    CurfewWindow:
      type: object
      required:
        - start
        - end
      additionalProperties: false
      description: Khung giới nghiêm hằng ngày theo giờ ICT (HH:MM); end nhỏ hơn start nghĩa là qua nửa đêm (vd. 21:30–06:30). Không theo khối lớp (R15).
      properties:
        start:
          type: string
          maxLength: 5
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          example: '21:30'
        end:
          type: string
          maxLength: 5
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          example: '06:30'
    SisImportCreate:
      type: object
      required:
        - file_name
        - size_bytes
        - entity_kinds
      properties:
        file_name:
          type: string
          maxLength: 200
          pattern: \.csv$
        size_bytes:
          type: integer
          minimum: 1
          maximum: 10485760
        sha256:
          type: string
          maxLength: 128
        entity_kinds:
          type: array
          minItems: 1
          maxItems: 1
          description: Loại bản ghi của file CSV (một file một loại, F011 [Proposed])
          items:
            type: string
            enum:
              - schools
              - students
              - classes
              - enrollments
        academic_year_id:
          $ref: '#/components/schemas/Uuid'
        dry_run:
          type: boolean
          default: true
          description: true → chỉ validate và trả diff, không đổi dữ liệu nghiệp vụ (F011-AC-01); false → áp dụng
    SisImport:
      type: object
      required:
        - import_id
        - school_id
        - status
        - created_at
      properties:
        import_id:
          $ref: '#/components/schemas/Uuid'
        school_id:
          $ref: '#/components/schemas/Uuid'
        status:
          type: string
          enum:
            - awaiting_upload
            - queued
            - validating
            - applying
            - completed
            - completed_with_issues
            - failed
            - expired
        dry_run:
          type: boolean
        entity_kinds:
          type: array
          maxItems: 1
          items:
            type: string
            enum:
              - schools
              - students
              - classes
              - enrollments
        diff:
          type: object
          description: Số bản ghi theo hành động (create/update/noop/deactivate) của từng loại, sau validate
          additionalProperties:
            type: object
            additionalProperties:
              type: integer
        errors:
          type: array
          maxItems: 1000
          description: Vi phạm contract (SIS_CONTRACT_VIOLATION) theo dòng/cột, tối đa 1000
          items:
            $ref: '#/components/schemas/SyncRecordError'
        upload_url:
          type: string
          maxLength: 2048
          format: uri
          description: Presigned URL — chỉ trả khi status=awaiting_upload
        upload_expires_at:
          $ref: '#/components/schemas/Timestamp'
        sync_run_id:
          $ref: '#/components/schemas/Uuid'
        rows_total:
          type: integer
        rows_applied:
          type: integer
        rows_rejected:
          type: integer
        reconciliation_issue_count:
          type: integer
        created_at:
          $ref: '#/components/schemas/Timestamp'
    SyncRecordError:
      type: object
      required:
        - error_code
        - occurred_at
      description: Lỗi theo bản ghi của sync run (sis.sync_record_errors); không chứa payload thô.
      properties:
        entity_kind:
          type: string
          maxLength: 64
          description: vd. school, class, student, enrollment
        external_id:
          type:
            - string
            - 'null'
          maxLength: 64
        row_no:
          type:
            - integer
            - 'null'
          minimum: 1
          description: Số dòng CSV (csv_import)
        column_name:
          type:
            - string
            - 'null'
          maxLength: 64
        error_code:
          type: string
          maxLength: 64
          description: vd. SIS_CONTRACT_VIOLATION
        message:
          type: string
          maxLength: 1000
        occurred_at:
          $ref: '#/components/schemas/Timestamp'
    SisReconciliationIssueType:
      type: string
      description: Loại xung đột (conflict matrix SIS_INTEGRATION §6.3, F011-AC-14; `unexpected_org_member`, `school_duplicate` do F010)
      enum:
        - possible_duplicate
        - transfer_confirmation
        - missing_class
        - class_school_mismatch
        - orphan_enrollment
        - multi_school_enrollment
        - school_province_missing
        - unmapped_school
        - cleaned_up_student_in_sis
        - duplicate_identifier
        - grade_mismatch
        - deactivation_review
        - ambiguous_login
        - school_duplicate
        - unexpected_org_member
    SisReconciliationIssuePage:
      type: object
      required:
        - data
        - page
      properties:
        data:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/SisReconciliationIssue'
        page:
          $ref: '#/components/schemas/PageInfo'
    SisReconciliationIssue:
      type: object
      required:
        - issue_id
        - tenant_id
        - issue_type
        - status
        - created_at
      properties:
        issue_id:
          $ref: '#/components/schemas/Uuid'
        tenant_id:
          $ref: '#/components/schemas/Uuid'
        school_id:
          description: null với `unmapped_school`
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        sis_connection_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        issue_type:
          $ref: '#/components/schemas/SisReconciliationIssueType'
        entity_refs:
          type: object
          maxProperties: 20
          description: ID nội bộ/external của bản ghi liên quan (không PII thô)
          additionalProperties:
            type: string
            maxLength: 128
        suggested_action:
          type:
            - string
            - 'null'
          maxLength: 64
        status:
          type: string
          enum:
            - open
            - resolved
            - ignored
        resolution:
          type:
            - string
            - 'null'
          enum:
            - link
            - same_person
            - ignore
            - fixed_in_source
            - merge_requested
            - merged
            - null
        resolution_note:
          type:
            - string
            - 'null'
          maxLength: 1000
        resolved_by:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        resolved_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        created_at:
          $ref: '#/components/schemas/Timestamp'
    SchoolReconciliationResolve:
      type: object
      additionalProperties: false
      required:
        - resolution
        - reason
      description: 'Xử lý xung đột ở portal trường (F052-AC-10): `fixed_in_source` → `resolved`, `ignore` → `ignored`; `merge_requested` (F011 T041, OQ F045-7) = đề nghị gộp hai tài khoản, chỉ issue `duplicate_identifier`/`possible_duplicate`, issue giữ `open` (System Admin chạy `mergeUsers`), đã đề nghị → `409 CONFLICT`; `reason` bắt buộc, ghi vào `resolution_note` và audit.'
      properties:
        resolution:
          type: string
          enum:
            - fixed_in_source
            - ignore
            - merge_requested
        reason:
          type: string
          minLength: 3
          maxLength: 500
    UserRolePage:
      type: object
      required:
        - items
        - page
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/UserRole'
        page:
          $ref: '#/components/schemas/PageInfo'
    UserRole:
      type: object
      required:
        - user_role_id
        - user_id
        - role_id
        - role_code
        - scope_type
        - source
        - valid_from
      description: Gán role cho người dùng trong một phạm vi (`identity.user_roles`, ADR-0066) — thay `RoleAssignment` cũ
      properties:
        user_role_id:
          $ref: '#/components/schemas/Uuid'
        user_id:
          $ref: '#/components/schemas/Uuid'
        role_id:
          $ref: '#/components/schemas/Uuid'
        role_code:
          $ref: '#/components/schemas/RoleCode'
        tenant_id:
          description: null khi scope_type = platform
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        scope_type:
          $ref: '#/components/schemas/UserRoleScopeType'
        scope_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        valid_from:
          $ref: '#/components/schemas/Timestamp'
        valid_to:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        source:
          type: string
          enum:
            - sis
            - manual
        granted_by:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        created_at:
          $ref: '#/components/schemas/Timestamp'
    UserRoleScopeType:
      type: string
      enum:
        - platform
        - tenant
        - school
        - subject
      description: Không có scope lớp/phân công giảng dạy (ADR-0072); subject dùng cho academic_manager
    UserRoleGrantRequest:
      type: object
      required:
        - user_id
        - role_id
        - scope_type
      additionalProperties: false
      properties:
        user_id:
          $ref: '#/components/schemas/Uuid'
        role_id:
          $ref: '#/components/schemas/Uuid'
        scope_type:
          $ref: '#/components/schemas/UserRoleScopeType'
        scope_id:
          description: school_id / subject_id theo scope_type (không có scope lớp, ADR-0072); null với tenant/platform
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        valid_from:
          $ref: '#/components/schemas/Timestamp'
        valid_to:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        reason:
          type: string
          maxLength: 1000
        training_completed_at:
          description: Bắt buộc khi gán role `safety_moderator` (F012-AC-24, ADR-0072)
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    SisProviderKind:
      type: string
      enum:
        - contract_v1
        - csv_import
      description: Loại nguồn SIS (ADR-0021); `contract_v1` do F017 hiện thực
    SisConnectionStatus:
      type: string
      enum:
        - active
        - auth_error
        - contract_error
        - paused
    SisConnectionPage:
      type: object
      required:
        - data
        - page
      properties:
        data:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/SisConnection'
        page:
          $ref: '#/components/schemas/PageInfo'
    SisConnection:
      type: object
      required:
        - sis_connection_id
        - tenant_id
        - provider_kind
        - status
        - created_at
      description: SIS connection; không bao giờ chứa `secret_ref` hay credential (F011-AC-27).
      properties:
        sis_connection_id:
          $ref: '#/components/schemas/Uuid'
        tenant_id:
          $ref: '#/components/schemas/Uuid'
        provider_kind:
          $ref: '#/components/schemas/SisProviderKind'
        contract_version:
          type:
            - string
            - 'null'
          maxLength: 64
        status:
          $ref: '#/components/schemas/SisConnectionStatus'
        school_count:
          type: integer
          minimum: 0
        last_sync_run:
          oneOf:
            - $ref: '#/components/schemas/SyncRun'
            - type: 'null'
        config:
          description: Cấu hình `contract_v1` (không secret); `null` với `csv_import`
          oneOf:
            - $ref: '#/components/schemas/SisContractConfig'
            - type: 'null'
        schedule:
          type:
            - string
            - 'null'
          maxLength: 64
        has_secret:
          type: boolean
          description: Có `secret_ref` (giá trị không bao giờ được trả, F017-AC-04)
        has_webhook_secret:
          type: boolean
        capabilities:
          type: array
          maxItems: 4
          items:
            $ref: '#/components/schemas/SisCapability'
        status_reason:
          type:
            - string
            - 'null'
          enum:
            - version_mismatch
            - violation_threshold
            - credential_rejected
            - secret_unavailable
            - circuit_open
            - manual
            - null
        consecutive_failed_runs:
          type: integer
          minimum: 0
        last_health_at:
          type:
            - string
            - 'null'
          format: date-time
        last_success_at:
          type:
            - string
            - 'null'
          format: date-time
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    SyncRun:
      type: object
      description: Một lần đồng bộ SIS (sis.sync_runs, DATABASE_DESIGN §2.3); `kind` = cột `mode`.
      required:
        - sync_run_id
        - kind
        - status
      properties:
        sync_run_id:
          $ref: '#/components/schemas/Uuid'
        sis_connection_id:
          $ref: '#/components/schemas/Uuid'
        tenant_id:
          $ref: '#/components/schemas/Uuid'
        kind:
          type: string
          enum:
            - full
            - delta
            - webhook
            - csv_import
        status:
          type: string
          enum:
            - queued
            - running
            - succeeded
            - partially_failed
            - failed
        dry_run:
          type: boolean
          default: false
        trigger:
          type: string
          enum:
            - schedule
            - manual
            - webhook
            - fallback_full
        failure_code:
          type:
            - string
            - 'null'
          maxLength: 64
        started_at:
          $ref: '#/components/schemas/Timestamp'
        finished_at:
          $ref: '#/components/schemas/Timestamp'
        stats:
          type: object
          additionalProperties:
            type: integer
    SisContractConfig:
      type: object
      additionalProperties: false
      required:
        - base_url
        - auth_type
        - schools
      properties:
        base_url:
          type: string
          format: uri
          maxLength: 2048
          pattern: ^https?://
          description: Base URL facade (`…/eduworld/v1`); https bắt buộc (http chỉ khi cờ dev EW_SIS_ALLOW_HTTP_BASE_URL)
        auth_type:
          type: string
          enum:
            - oauth2_client_credentials
            - api_key
            - mtls
        token_url:
          type: string
          format: uri
          maxLength: 2048
          pattern: ^https?://
        oauth_scope:
          type: string
          maxLength: 255
          default: eduworld.sis.read
        schools:
          type: array
          maxItems: 500
          description: Trường của connection — ánh xạ `school_external_id` của SIS sang trường EduWorld trong tenant (OQ F017-1)
          items:
            type: object
            additionalProperties: false
            required:
              - school_external_id
              - school_id
            properties:
              school_external_id:
                type: string
                minLength: 1
                maxLength: 64
                pattern: ^[A-Za-z0-9._:-]+$
              school_id:
                $ref: '#/components/schemas/Uuid'
    SisCapability:
      type: string
      enum:
        - full_sync
        - delta
        - webhook
        - student_lookup
    SisConnectionCreate:
      description: Tạo SIS connection — `csv_import` (F011, không `config`/`secret_ref`) hoặc `contract_v1` (F017).
      oneOf:
        - $ref: '#/components/schemas/SisConnectionCreateCsv'
        - $ref: '#/components/schemas/SisConnectionCreateContract'
      discriminator:
        propertyName: provider_kind
        mapping:
          csv_import: '#/components/schemas/SisConnectionCreateCsv'
          contract_v1: '#/components/schemas/SisConnectionCreateContract'
    SisConnectionCreateCsv:
      type: object
      additionalProperties: false
      required:
        - provider_kind
      properties:
        provider_kind:
          type: string
          enum:
            - csv_import
        reason:
          type: string
          maxLength: 500
    SisConnectionCreateContract:
      type: object
      additionalProperties: false
      required:
        - provider_kind
        - contract_version
        - config
        - secret_ref
      description: Connection `contract_v1` (F017-AC-01). `config` không chứa secret hay field-mapping; credential chỉ qua tham chiếu secret manager.
      properties:
        provider_kind:
          type: string
          enum:
            - contract_v1
        contract_version:
          type: string
          maxLength: 64
          pattern: ^1\.[0-9]+\.[0-9]+$
        config:
          $ref: '#/components/schemas/SisContractConfig'
        secret_ref:
          $ref: '#/components/schemas/SisSecretRef'
        webhook_secret_ref:
          $ref: '#/components/schemas/SisSecretRef'
        schedule:
          type: string
          maxLength: 64
          description: Cron 5 trường (giờ ICT) của full sync; bỏ trống = `sis_sync_schedule`
        reason:
          type: string
          maxLength: 500
    SisSecretRef:
      type: string
      maxLength: 512
      pattern: ^[a-z0-9][a-z0-9._/-]{0,511}$
      description: Tham chiếu secret manager (Swarm secret), không phải credential; không bao giờ được trả về.
    SyncRunPage:
      type: object
      required:
        - data
        - page
      properties:
        data:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/SyncRun'
        page:
          $ref: '#/components/schemas/PageInfo'
    SisConnectionUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      description: JSON Merge Patch của connection (F017). Đổi `status` bắt buộc `reason`.
      properties:
        config:
          $ref: '#/components/schemas/SisContractConfig'
        secret_ref:
          $ref: '#/components/schemas/SisSecretRef'
        webhook_secret_ref:
          oneOf:
            - $ref: '#/components/schemas/SisSecretRef'
            - type: 'null'
        schedule:
          type:
            - string
            - 'null'
          maxLength: 64
        status:
          type: string
          enum:
            - active
            - paused
        reason:
          type: string
          maxLength: 500
    SisConnectionHealth:
      type: object
      required:
        - status
        - compatible
        - capabilities
        - checked_at
      properties:
        status:
          type: string
          enum:
            - ok
            - degraded
            - unreachable
        contract_version:
          type:
            - string
            - 'null'
          maxLength: 64
        compatible:
          type: boolean
        capabilities:
          type: array
          maxItems: 4
          items:
            $ref: '#/components/schemas/SisCapability'
        checked_at:
          $ref: '#/components/schemas/Timestamp'
    SyncRecordErrorPage:
      type: object
      required:
        - data
        - page
      properties:
        data:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/SyncRecordError'
        page:
          $ref: '#/components/schemas/PageInfo'
    PlatformSisImportCreate:
      description: Như `SisImportCreate`, thêm `school_id` của trường thuộc tenant đích (System Admin).
      allOf:
        - $ref: '#/components/schemas/SisImportCreate'
        - type: object
          required:
            - school_id
          properties:
            school_id:
              $ref: '#/components/schemas/Uuid'
    SisReconciliationResolve:
      type: object
      additionalProperties: false
      required:
        - resolution
      description: '`ignore` → issue `ignored`; các giá trị khác → `resolved`.'
      properties:
        resolution:
          type: string
          enum:
            - link
            - same_person
            - ignore
            - fixed_in_source
        resolution_note:
          type: string
          maxLength: 1000
    TenantCreate:
      type: object
      additionalProperties: false
      required:
        - code
        - name
        - tenant_type
        - keycloak_org_alias
      description: Tạo tenant (F010-AC-01, F010-AC-02, F010-AC-05). Chỉ một tenant `common`.
      properties:
        code:
          type: string
          minLength: 2
          maxLength: 64
        name:
          type: string
          minLength: 1
          maxLength: 255
        tenant_type:
          $ref: '#/components/schemas/TenantType'
        keycloak_org_alias:
          type: string
          maxLength: 63
          pattern: ^[a-z0-9-]{3,63}$
          description: Alias Keycloak Organization, duy nhất (KEYCLOAK_SSO §2.1)
        default_locale:
          $ref: '#/components/schemas/Locale'
        reason:
          type: string
          maxLength: 500
    TenantDetail:
      allOf:
        - $ref: '#/components/schemas/TenantSummary'
        - type: object
          required:
            - keycloak_org_alias
            - created_at
            - updated_at
          properties:
            keycloak_org_alias:
              type: string
              maxLength: 63
              pattern: ^[a-z0-9-]{3,63}$
            created_at:
              $ref: '#/components/schemas/Timestamp'
            updated_at:
              $ref: '#/components/schemas/Timestamp'
    TenantUpdate:
      type: object
      additionalProperties: false
      minProperties: 2
      required:
        - reason
      description: JSON Merge Patch cho tenant; `tenant_type`, `code`, `keycloak_org_alias` không đổi được.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        status:
          type: string
          enum:
            - active
            - disabled
        reason:
          type: string
          minLength: 3
          maxLength: 500
    AdminSchoolCreate:
      type: object
      additionalProperties: false
      required:
        - code
        - name
        - province_code
        - school_level
        - grade_min
        - grade_max

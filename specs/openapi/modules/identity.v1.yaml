      operationId: portalLogout
      summary: Đăng xuất portal — thu hồi refresh token và phiên Keycloak, xóa cookie — ADR-0091
      description: |
        Bắt buộc header `X-EW-CSRF` khớp cookie CSRF (thiếu/lệch → `403 CSRF_TOKEN_INVALID`). module identity thu hồi refresh token
        và phiên Keycloak (`sid`), trả `Set-Cookie` xóa cả hai cookie; portal xóa access token khỏi bộ nhớ. Idempotent: không có cookie
        hoặc phiên đã hết → vẫn `204`. Ghi audit `portal.logout`.
      security: []
      parameters:
        - $ref: '#/components/parameters/PortalRefreshCookieOptional'
        - $ref: '#/components/parameters/PortalCsrfCookie'
        - $ref: '#/components/parameters/PortalCsrfHeader'
      responses:
        '204':
          description: Đã đăng xuất; cookie đã xóa
          headers:
            Set-Cookie:
              $ref: '#/components/headers/PortalSessionSetCookie'
        '403':
          description: CSRF_TOKEN_INVALID
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/portal/setup:password:
    post:
      x-service: identity
      x-portal-shell: true
      tags:
        - auth
      operationId: setupPortalPassword
      summary: Đổi mật khẩu tạm lần đầu bằng setup_ticket (sau ACCOUNT_SETUP_REQUIRED) — ADR-0091 mục 3
      description: |
        Public, không cần token. `setup_ticket` lấy từ `403 ACCOUNT_SETUP_REQUIRED` của `portalLogin`: dùng một lần,
        hết hạn theo `portal_setup_ticket_ttl`; hết hạn/đã dùng/không tồn tại → `401 SETUP_TICKET_INVALID` (portal về `/login`).
        module identity đặt mật khẩu mới qua Keycloak Admin API (client `svc-identity`, áp password policy của realm; không đạt →
        `422 VALIDATION_FAILED` với `errors[].code = PASSWORD_POLICY_VIOLATION`) và gỡ required action `UPDATE_PASSWORD`
        (không có bước đăng ký OTP — ADR-0094). Người dùng đăng nhập lại bằng mật khẩu mới (không phát token ở đây). Body không bao giờ log; audit `portal.password_setup`. Không dùng
        `Idempotency-Key`: ticket dùng một lần đã chặn thực hiện lặp.
      security: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PortalSetupPasswordRequest'
      responses:
        '200':
          description: Đã đặt mật khẩu mới; còn các bước trong `remaining_steps`
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalSetupResult'
        '401':
          description: SETUP_TICKET_INVALID
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /auth/portal/password:forgot:
    post:
      x-service: identity
      x-portal-shell: true
      tags:
        - auth
      operationId: forgotPortalPassword
      summary: Quên mật khẩu portal — luôn 202, gửi email đặt lại nếu có tài khoản nhân sự khớp — ADR-0091 mục 3
      description: |
        Public. **Luôn trả `202`** với cùng nội dung và thời gian phản hồi tương đương, kể cả khi không có tài khoản, tài khoản là học sinh
        hoặc bị vô hiệu hóa (không lộ tài khoản tồn tại). Nếu `identifier` (username hoặc email, không phân biệt hoa thường) khớp một
        tài khoản nhân sự (`user_type = staff`) đang hoạt động, module identity sinh token ngẫu nhiên, chỉ lưu SHA-256
        (`identity.portal_password_reset_tokens`, dùng một lần, hết hạn theo `portal_password_reset_ttl`; token cũ chưa dùng của người đó bị vô hiệu)
        và gửi email chứa link `https://portal.<domain>/reset-password?token=…` (xử lý bất đồng bộ qua outbox để thời gian phản hồi không đổi).
        Học sinh không dùng luồng này (mật khẩu học sinh do quản trị trường đặt lại). Rate limit `portal_login_rate` (theo identifier và `device_id`).
      security: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PortalForgotPasswordRequest'
      responses:
        '202':
          description: Đã tiếp nhận (không cho biết có gửi email hay không)
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/portal/password:reset:
    post:
      x-service: identity
      x-portal-shell: true
      tags:
        - auth
      operationId: resetPortalPassword
      summary: Đặt lại mật khẩu portal bằng token trong email — ADR-0091 mục 3
      description: |
        Public. Token so khớp theo SHA-256, dùng một lần (đánh dấu `used_at` nguyên tử), hết hạn theo `portal_password_reset_ttl`;
        sai/hết hạn/đã dùng → `401 PASSWORD_RESET_TOKEN_INVALID`. module identity đặt mật khẩu qua Keycloak Admin API (password policy
        của realm; không đạt → `422 VALIDATION_FAILED`, `errors[].code = PASSWORD_POLICY_VIOLATION`, token **không** bị tiêu thụ), gỡ
        `UPDATE_PASSWORD` nếu có và **thu hồi mọi phiên portal** của người dùng; người dùng đăng nhập lại bằng mật khẩu mới.
        Body không bao giờ log; audit `portal.password_reset`. Không dùng `Idempotency-Key`: token dùng một lần.
      security: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PortalResetPasswordRequest'
      responses:
        '204':
          description: Đã đặt lại mật khẩu; mọi phiên portal của người dùng đã bị thu hồi
        '401':
          description: PASSWORD_RESET_TOKEN_INVALID
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /auth/session:
    post:
      x-service: identity
      tags:
        - auth
      operationId: createAuthSession
      summary: Bootstrap phiên cho client có hồ sơ người chơi (trả PlayerBootstrap) — map (iss, sub) → User, không JIT; Admin Portal không gọi
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Bootstrap thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerBootstrap'
          headers:
            Content-Language:
              $ref: '#/components/headers/ContentLanguage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Problem'
      description: |
        Bootstrap cho client dùng luồng trình duyệt có hồ sơ người chơi (trả `PlayerBootstrap`); game dùng `/auth/game/login` (ADR-0068). Không cần `X-Tenant-Id`.
        **Admin Portal không gọi endpoint này** (RB-115): sau `portalLogin` portal gọi `listMyTenants` → `getMyPermissions` (header `X-Tenant-Id`) → `getMe` (ADR-0091).
        Không có JIT provisioning (ADR-0063): tài khoản không có membership tenant chung/SIS hoặc không còn UserRole portal → `403 ACCOUNT_NOT_PROVISIONED`
        / `403 PORTAL_ACCESS_STAFF_ONLY`. Nhân sự thuộc nhiều tenant chọn tenant sau đăng nhập qua `GET /me/tenants` (ADR-0067, ADR-0069).
  /auth/me:
    get:
      x-service: identity
      tags:
        - auth
      operationId: getMe
      x-portal-shell: true
      summary: Principal hiện tại (roles, scopes)
      description: |
        Nhân sự platform không gửi `X-Tenant-Id` nhận hồ sơ ở phạm vi platform; người dùng tenant thiếu header → `400 TENANT_HEADER_REQUIRED` (OQ F051-3, ADR-0065).
      parameters:
        - $ref: '#/components/parameters/TenantIdHeaderOptional'
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Principal'
          headers:
            Content-Language:
              $ref: '#/components/headers/ContentLanguage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /auth/logout:
    post:
      x-service: identity
      tags:
        - auth
      operationId: logout
      summary: Đóng game session, thu hồi realtime ticket (client tự gọi Keycloak end-session)
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
      responses:
        '204':
          description: Đã đăng xuất
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /auth/sessions:revoke-all:
    post:
      x-service: identity
      tags:
        - auth
      operationId: revokeAllSessions
      summary: Đăng xuất trên mọi thiết bị (thu hồi Keycloak session + kết thúc game session, ADR-0031)
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Đã thu hồi
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /me/permissions:
    get:
      x-service: identity
      tags:
        - me
      operationId: getMyPermissions
      x-portal-shell: true
      summary: Permission hiệu lực của người dùng trong một tenant (dựng menu CMS)
      description: |
        Trả về role và permission đã giải theo scope. Role tenant không bao giờ chứa permission
        `game.*`, `competition.config.*`, `platform.*` (ADR-0027). Backend vẫn kiểm tra quyền ở mọi endpoint.
        Kèm `disabled_menus[]`, `disabled_actions[]` — menu/action của danh mục portal đang tắt với phạm vi phiên (tenant của
        `X-Tenant-Id`; System Admin không gửi header → mặc định platform), tính trong ≤ `feature_toggle_cache_ttl` (ADR-0090).
      parameters:
        - $ref: '#/components/parameters/TenantIdHeaderOptional'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionSet'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
  /me/tenants:
    get:
      x-service: identity
      tags:
        - me
      operationId: listMyTenants
      x-portal-shell: true
      summary: Tenant của người dùng sau đăng nhập (không cần X-Tenant-Id) — chọn tenant sau đăng nhập portal
      description: |
        Danh sách tenant mà người dùng có membership và (với portal) UserRole portal còn hiệu lực, cờ `has_platform_role`.
        Portal: 1 tenant → vào thẳng; nhiều tenant → màn chọn tenant sau đăng nhập và bộ chọn trên topbar; rỗng và không có role
        platform → `403 PORTAL_ACCESS_STAFF_ONLY` (ADR-0066, ADR-0067). Token game nhận đúng một tenant của phiên.
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyTenantsResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

    UserRoleGrantRequest:
      type: object
      required:
        - user_id
        - role_id
        - scope_type
      additionalProperties: false
      properties:
        user_id:
          $ref: '#/components/schemas/Uuid'
        role_id:
          $ref: '#/components/schemas/Uuid'
        scope_type:
          $ref: '#/components/schemas/UserRoleScopeType'
        scope_id:
          description: school_id / class_id / subject_id theo scope_type; null với tenant/platform
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        valid_from:
          $ref: '#/components/schemas/Timestamp'
        valid_to:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        reason:
          type: string
          maxLength: 1000
    SyncRun:
      type: object
      required:
        - sync_run_id
        - kind
        - status
      properties:
        sync_run_id:
          $ref: '#/components/schemas/Uuid'
        kind:
          type: string
          enum:
            - full
            - delta
            - webhook
        status:
          type: string
          enum:
            - queued
            - running
            - succeeded
            - failed
            - partial
        started_at:
          $ref: '#/components/schemas/Timestamp'
        finished_at:
          $ref: '#/components/schemas/Timestamp'
        stats:
          type: object
          additionalProperties:
            type: integer
    ResourceType:
      type: string
      description: Loại tài nguyên dùng cho Thùng rác, gán và clone (ADR-0028, ADR-0029)
      enum:
        - curriculum
        - lesson
        - question
        - question_set
        - assessment_blueprint
        - media
        - assignment
        - course
        - learning_path
        - challenge
        - challenge_template
        - tournament_template
        - quest
        - minigame_config
        - item
        - class_template
        - school_settings
        - tenant_settings
    TrashItem:
      type: object
      description: Chỉ trả trong API Thùng rác — schema duy nhất có deleted_at
      required:
        - resource_type
        - resource_id

      operationId: listFeatureFlags
      summary: Danh sách feature flag và cờ bật/tắt menu/action của portal (mặc định platform + ghi đè theo tenant) — F015, ADR-0090
      description: |
        Chỉ System Admin (`platform.feature_flag.write`, gateway nội bộ). `flag_kind` lọc theo loại (`feature` — tính năng game/portal
        trả trong bootstrap; `menu`/`action` — mục trong danh mục `specs/portal/menu-catalog.yaml`). `tenant_id` có giá trị → mỗi dòng có thêm
        `tenant_override` và `effective_enabled` của tenant đó; vắng mặt → `effective_enabled` theo mặc định platform. Không có dòng flag nghĩa là **bật**.
      x-internal: true

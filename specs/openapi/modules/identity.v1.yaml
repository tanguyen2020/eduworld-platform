      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/Class'
        page:
          $ref: '#/components/schemas/PageInfo'
    ClassStudentPage:
      type: object
      required:
        - items
        - page
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/ClassStudent'
        page:
          $ref: '#/components/schemas/PageInfo'
    ClassStudent:

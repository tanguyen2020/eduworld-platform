  /admin/feature-flags/{flag_key}:
    put:
      x-service: identity
      x-portal-action: action.platform_admin.feature_toggles.update
      tags:
        - admin
      operationId: putFeatureFlag
      summary: Đặt mặc định platform hoặc ghi đè cho một tenant đích của feature flag / menu / action (chỉ System Admin) — F015, ADR-0090
      description: |
        Chỉ System Admin (`platform.feature_flag.write`, gateway nội bộ, `azp = eduworld-portal`). Bắt buộc `reason` và `If-Match`
        (ETag của flag; flag chưa có dòng dùng `If-Match: "0"`).

        - `scope = platform`: đặt `default_enabled` (`state` = `enabled`/`disabled`); **không** gửi `X-Tenant-Id`.
        - `scope = tenant`: ghi đè cho tenant đích trong header `X-Tenant-Id` (bắt buộc; thiếu → `400 TENANT_HEADER_REQUIRED`);
          `state = inherit` gỡ ghi đè (về mặc định platform).
        - `flag_key` dạng `menu.*`/`action.*` phải tồn tại trong `platform.portal_menu_catalog` (bản sao đọc-chỉ của danh mục) → không có →
          `404 NOT_FOUND`; `flag_kind`, `parent_key` suy ra từ danh mục, client không gửi. Key khác là feature flag (`flag_kind = feature`).
        - Mục `can_disable = false` (Người dùng & phân quyền, Tenant, Bật/tắt menu, Nhật ký toàn hệ thống, Thùng rác, hàng đợi case kiểm duyệt,
          sanction, thông báo an toàn của trường và mọi action của chúng) không đặt `disabled` được → `422 FEATURE_NOT_DISABLEABLE`.

        Ghi audit `feature_flag.updated` (trước/sau, `reason`, tenant đích), phát `platform_settings.changed` (scope `feature_flag`) để
        `featuregate` và `getMyPermissions` làm mới cache trong ≤ `feature_toggle_cache_ttl`. Giá trị hiệu lực của action = cờ của action
        AND cờ của menu cha. Không cần `Idempotency-Key`: `PUT` + `If-Match` là idempotent.
      x-internal: true
      security:
        - keycloakAdminBearer: []
      parameters:
        - name: flag_key
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/FeatureFlagKey'
        - $ref: '#/components/parameters/TenantIdHeaderOptional'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeatureFlagWrite'
      responses:
        '200':
          description: Đã cập nhật
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureFlag'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          description: VALIDATION_FAILED (thiếu `reason`, `inherit` với `scope = platform`), FEATURE_NOT_DISABLEABLE (mục `can_disable = false`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
  /admin/portal-menu-catalog:
    get:
      x-service: identity
      x-portal-action: action.platform_admin.feature_toggles.view
      tags:
        - admin
      operationId: listPortalMenuCatalog
      summary: Cây danh mục workspace → menu → action của Admin Portal kèm trạng thái bật/tắt (màn "Bật/tắt menu & action") — ADR-0090
      description: |

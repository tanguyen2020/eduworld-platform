        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: USERNAME_TAKEN, EMAIL_TAKEN (định danh đã thuộc tài khoản khác trên SSO hoặc trong module identity)

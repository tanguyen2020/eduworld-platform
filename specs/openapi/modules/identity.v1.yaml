        - CHAT_PIN_LIMIT_REACHED
        - CHAT_MENTION_LIMIT
        - CHAT_TEMPORARILY_UNAVAILABLE
        - CHAT_FEATURE_DISABLED
        - CHAT_ASSET_NOT_AVAILABLE
        - CHAT_CONTENT_HELD
        - MODERATION_SWITCH_REASON_REQUIRED
        - MODERATION_SWITCH_STEP_NOT_ALLOWED
        - MODERATION_SWITCH_EXPIRY_REQUIRED
        - MODERATION_SWITCH_SELF_APPROVAL
        - TENANT_TOGGLE_NOT_ALLOWED
        - SENSITIVE_TERM_INVALID
        - SENSITIVE_CATALOG_REGRESSION_FAILED
        - ITEM_REF_INVALID
        - TRANSLATION_INCOMPLETE
        - EVENT_NOT_AVAILABLE
        - EVENT_ENDED
        - EVENT_MILESTONE_NOT_REACHED
        - SEASON_TIER_NOT_REACHED
        - EVENT_TEMPLATE_PARAM_NOT_ALLOWED
        - DASHBOARD_RANGE_TOO_LARGE
        - DASHBOARD_BUSY
        - DASHBOARD_QUERY_TIMEOUT
        - EXPORT_LIMIT_REACHED
        - MODERATION_CASE_CLOSED
        - ROLE_NOT_FOUND
        - FEATURE_DISABLED
        - FEATURE_NOT_DISABLEABLE
    GameLoginProblem:
      description: |
        Problem của `/auth/game/login` và `/auth/game/tenant:select`. Khi `code = TENANT_NOT_SELECTED` có `choices` (các tenant còn
        hiệu lực của học sinh — ADR-0063) + `login_ticket` (dùng một lần, TTL 2 phút, gắn `device_id`). Xung đột thiết bị không trả ở đây
        mà ở `createGameSession` (ADR-0083).
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            choices:
              type: array
              minItems: 2
              maxItems: 20
              items:
                $ref: '#/components/schemas/GameLoginTenantChoice'
            login_ticket:
              type: string
              minLength: 16
              maxLength: 128
            login_ticket_expires_at:
              $ref: '#/components/schemas/Timestamp'
    GameLoginTenantChoice:
      type: object
      required:
        - tenant_id
        - tenant_type
        - name
      properties:
        tenant_id:
          $ref: '#/components/schemas/Uuid'
        tenant_type:
          $ref: '#/components/schemas/TenantType'
        name:
          type: string
          maxLength: 255
        school_name:
          type: string
          maxLength: 255
          description: Trường của học sinh trong tenant đó (để học sinh nhận ra)
        logo_url:
          type: string
          maxLength: 2048
          format: uri
    ValidationProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            errors:
              type: array
              items:
                type: object
                required:
                  - field
                  - code
                properties:
                  field:
                    type: string
                    maxLength: 64
                  code:
                    type: string
                    maxLength: 64
                  message:
                    type: string
                    maxLength: 1000
    ClientVersionProblem:
      description: '`426 CLIENT_VERSION_UNSUPPORTED` — game hiển thị màn cập nhật'
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required:
            - min_client_version
          properties:
            min_client_version:
              type: string
              maxLength: 32
            store_url:
              type: string
              maxLength: 2048
              format: uri
    GameTenantSelectRequest:
      type: object
      required:
        - login_ticket
        - tenant_id
        - device_id
      additionalProperties: false
      properties:
        login_ticket:
          type: string
          minLength: 16
          maxLength: 128
          writeOnly: true
        tenant_id:
          $ref: '#/components/schemas/Uuid'
        device_id:
          $ref: '#/components/schemas/Uuid'
    GameTokenRefreshRequest:
      type: object
      required:
        - refresh_token
        - device_id
      additionalProperties: false
      description: Body của `POST /auth/game/token:refresh`. **Không bao giờ log** (ADR-0086).
      properties:
        refresh_token:
          type: string
          minLength: 1
          maxLength: 8192
          writeOnly: true
        device_id:
          $ref: '#/components/schemas/Uuid'
          description: UUID của bản cài game (giống `GameLoginRequest.device_id`); phải trùng thiết bị gắn với phiên lúc đăng nhập, khác → `401 REFRESH_TOKEN_DEVICE_MISMATCH`
        mode:
          type: string
          enum:
            - renew
            - resume
          default: renew
          description: '`renew` — gia hạn khi đang chơi; `resume` — mở lại game bằng refresh token đã lưu (kiểm tra lại tài khoản/tenant, trả `bootstrap`)'
        client_version:
          type: string
          maxLength: 32
          pattern: ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]{1,20})?$
          description: Nên gửi khi `mode = resume` để kiểm tra `426`
    GameTokenRefreshResponse:
      description: Token mới sau xoay vòng; `bootstrap` chỉ có khi `mode = resume` (ADR-0086). Không có `game_session_id` — game client gọi `createGameSession` sau đó (ADR-0083).
      allOf:
        - $ref: '#/components/schemas/GameTokenSet'
        - type: object
          properties:
            bootstrap:
              $ref: '#/components/schemas/PlayerBootstrap'
              description: '`bootstrap.tenant_id` trùng header `X-Tenant-Id` của request'
    GameLogoutRequest:
      type: object
      additionalProperties: false
      properties:
        refresh_token:
          type: string
          maxLength: 8192
          writeOnly: true
    PortalLoginRequest:
      type: object
      required:
        - username
        - password
        - device_id
      additionalProperties: false
      description: Body của `POST /auth/portal/login`. **Không bao giờ log** (APISIX, module identity, tracing); mật khẩu và OTP chỉ chuyển tiếp tới Keycloak.
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 254
          description: Username hoặc email; không phân biệt hoa thường sau chuẩn hóa trim/NFC (ADR-0069)
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 256
          writeOnly: true
        otp:
          type: string
          minLength: 6
          maxLength: 6
          pattern: ^[0-9]{6}$
          writeOnly: true
          description: Mã TOTP 6 số; bắt buộc với tài khoản vận hành platform (thiếu/sai → cùng `401 INVALID_CREDENTIALS`)
        device_id:
          $ref: '#/components/schemas/Uuid'
          description: UUID trình duyệt do portal sinh và lưu (không phải bí mật)
          dùng cho rate limit theo thiết bị: null
        locale:
          $ref: '#/components/schemas/Locale'
    PortalTokenResponse:
      type: object
      required:
        - access_token
        - token_type
        - expires_in
        - refresh_expires_in
        - auth_time
        - mfa
      description: |
        Access token Keycloak của Admin Portal (`azp = eduworld-portal`). Portal **chỉ giữ trong bộ nhớ** (không localStorage/sessionStorage);
        refresh token không bao giờ nằm trong body — chỉ trong cookie HttpOnly.
      properties:
        access_token:
          type: string
          maxLength: 8192
        token_type:
          type: string
          enum:
            - Bearer
        expires_in:
          type: integer
          minimum: 1
          description: Giây (mặc định 300)
        refresh_expires_in:
          type: integer
          minimum: 1
          description: Giây tới khi phiên hết hạn theo idle (30 phút) nhưng không vượt tối đa 10 giờ — `portal_session_sso`
        auth_time:
          $ref: '#/components/schemas/Timestamp'
        mfa:
          type: boolean
          description: true khi bước OTP đã chạy (`amr` chứa `otp`); route platform còn yêu cầu `auth_time` trong 8 giờ
    PortalLoginProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            setup_ticket:
              type: string
              minLength: 32
              maxLength: 128
              description: 'Chỉ có khi `code = ACCOUNT_SETUP_REQUIRED`: dùng một lần, hết hạn theo `portal_setup_ticket_ttl`'
            required_steps:
              type: array
              maxItems: 2
              uniqueItems: true
              items:
                $ref: '#/components/schemas/PortalSetupStep'
            otp_setup_email_sent:
              type: boolean
              description: true khi module identity đã gửi email đăng ký ứng dụng xác thực (trang action-token Keycloak)
    PortalSetupStep:
      type: string
      enum:
        - update_password
        - configure_otp
      description: Bước thiết lập còn thiếu (required action Keycloak `UPDATE_PASSWORD` / `CONFIGURE_TOTP`)
    PortalSetupPasswordRequest:
      type: object
      required:
        - setup_ticket
        - new_password
      additionalProperties: false
      properties:
        setup_ticket:
          type: string
          minLength: 32
          maxLength: 128
          writeOnly: true
        new_password:
          type: string
          format: password
          minLength: 1
          maxLength: 256
          writeOnly: true
          description: Kiểm tra bằng password policy của realm Keycloak
    PortalSetupResult:
      type: object
      required:
        - remaining_steps
        - otp_setup_email_sent
      properties:
        remaining_steps:
          type: array
          maxItems: 2
          uniqueItems: true
          items:
            $ref: '#/components/schemas/PortalSetupStep'
        otp_setup_email_sent:
          type: boolean
    PortalForgotPasswordRequest:
      type: object
      required:
        - identifier
        - device_id
      additionalProperties: false
      properties:
        identifier:
          type: string
          minLength: 1
          maxLength: 254
          description: Username hoặc email của nhân sự
        device_id:
          $ref: '#/components/schemas/Uuid'
        locale:
          $ref: '#/components/schemas/Locale'
    PortalResetPasswordRequest:
      type: object
      required:
        - token
        - new_password
        - device_id
      additionalProperties: false
      properties:
        token:
          type: string
          minLength: 32
          maxLength: 128
          pattern: ^[A-Za-z0-9_-]+$
          writeOnly: true
          description: Token trong link email (base64url); server chỉ lưu SHA-256
        new_password:
          type: string
          format: password
          minLength: 1
          maxLength: 256
          writeOnly: true
        device_id:
          $ref: '#/components/schemas/Uuid'
    PermissionSet:
      type: object
      required:
        - roles
        - permissions
      properties:
        tenant_id:
          description: Tenant của phiên; null với System Admin ở phạm vi platform
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/EffectiveRole'
        permissions:
          type: array
          description: 'Ví dụ: lms.assignment.write, learning_content.publish, game.quest.write (chỉ role platform)'
          items:
            type: string
            maxLength: 64
            pattern: ^[a-z_]+(\.[a-z_]+)+$
        workspaces:
          type: array
          description: Workspace của Admin Portal người dùng được thấy (ADR-0027 mục 7). Chỉ dùng dựng menu, không phải nguồn quyết định quyền.
          items:
            type: string
            enum:
              - school_lms
              - content_studio
              - game_ops
              - live_ops
              - platform_admin
        disabled_menus:
          type: array
          maxItems: 1000
          description: Khóa menu (`menu.<workspace>.<menu>`) đang tắt hiệu lực với phạm vi phiên; portal ẩn menu này (ADR-0090)
          items:
            type: string
            maxLength: 128
            pattern: ^menu\.[a-z0-9_]+\.[a-z0-9_]+$
        disabled_actions:
          type: array
          maxItems: 2000
          description: Khóa action đang tắt hiệu lực (gồm action có menu cha đang tắt); portal ẩn/khóa nút, API trả `403 FEATURE_DISABLED`
          items:
            type: string
            maxLength: 128
            pattern: ^action\.[a-z0-9_]+\.[a-z0-9_]+\.[a-z0-9_]+$
    MyTenantsResponse:
      type: object
      required:
        - items
        - has_platform_role
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/MyTenant'
        has_platform_role:
          type: boolean
          description: true nếu người dùng có UserRole platform còn hiệu lực (vào phạm vi platform, không cần chọn tenant)
    MyTenant:
      allOf:
        - $ref: '#/components/schemas/TenantSummary'
        - type: object
          properties:
            logo_url:
              type: string
              maxLength: 2048
              format: uri
            role_codes:
              type: array
              maxItems: 50
              description: Mã role đang hiệu lực của người dùng trong tenant (tóm tắt để hiển thị)
              items:
                $ref: '#/components/schemas/RoleCode'
    TenantSummary:
      type: object
      required:
        - tenant_id
        - code
        - name
        - tenant_type
        - status
      properties:
        tenant_id:
          $ref: '#/components/schemas/Uuid'
        code:
          type: string
          maxLength: 64
        name:
          type: string
          maxLength: 255
        tenant_type:
          $ref: '#/components/schemas/TenantType'
        status:
          type: string
          enum:
            - active
            - disabled
        school_count:
          type: integer
    Country:
      type: object
      required:
        - country_code
        - name
        - default_locale
        - status
      properties:
        country_code:
          type: string
          pattern: ^[A-Z]{2}$
          maxLength: 2
        name:
          $ref: '#/components/schemas/LocalizedName'
        default_locale:
          $ref: '#/components/schemas/Locale'
        status:
          type: string
          enum:
            - active
            - inactive
    Province:
      type: object
      required:
        - province_id
        - code
        - country_code
        - name
        - short_name
        - province_type
        - status
      description: Đơn vị hành chính cấp tỉnh (34 tỉnh/thành từ 01/07/2025 — Nghị quyết 202/2025/QH15; 63 đơn vị cũ ở trạng thái inactive). Mã nội bộ `code` ổn định; `official_code` [TBD].
      properties:
        province_id:
          $ref: '#/components/schemas/Uuid'
        code:
          type: string
          maxLength: 64
          pattern: ^[a-z]{2}(\.old)?\.[a-z0-9-]+$
        country_code:
          type: string
          pattern: ^[A-Z]{2}$
          maxLength: 2
        official_code:
          type:
            - string
            - 'null'
          maxLength: 16
        name:
          $ref: '#/components/schemas/LocalizedName'
        short_name:
          $ref: '#/components/schemas/LocalizedName'
        province_type:
          type: string
          enum:
            - municipality
            - province
        effective_from:
          type:
            - string
            - 'null'
          format: date
        effective_to:
          type:
            - string
            - 'null'
          format: date
        status:
          type: string
          enum:
            - active
            - inactive
        successor_code:
          type:
            - string
            - 'null'
          maxLength: 64
          description: 'Với đơn vị inactive: mã đơn vị kế thừa hiện hành'
    SchoolPage:
      type: object
      required:
        - items
        - page
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/School'
        page:
          $ref: '#/components/schemas/PageInfo'
    School:
      type: object
      required:
        - school_id
        - tenant_id
        - code
        - name
        - school_level
        - grade_min
        - grade_max
        - status
        - is_virtual
      properties:
        school_id:
          $ref: '#/components/schemas/Uuid'
        tenant_id:
          $ref: '#/components/schemas/Uuid'
        code:
          type: string
          maxLength: 64
        name:
          $ref: '#/components/schemas/TenantLocalizedName'
        country_code:
          type:
            - string
            - 'null'
          pattern: ^[A-Z]{2}$
          maxLength: 2
        province:
          $ref: '#/components/schemas/ProvinceRef'
        moet_code:
          type:
            - string
            - 'null'
          maxLength: 32
        school_level:
          $ref: '#/components/schemas/SchoolLevel'
        grade_min:
          $ref: '#/components/schemas/GradeLevel'
        grade_max:
          $ref: '#/components/schemas/GradeLevel'
        address:
          type:
            - string
            - 'null'
          maxLength: 500
        status:
          type: string
          enum:
            - pending_review
            - active
            - disabled
        is_virtual:
          type: boolean
          description: Trường ảo "EduWorld chung" của tenant common
        source:
          type: string
          enum:
            - sis
            - manual
            - import
        version:
          type: integer
          minimum: 1
    PageInfo:
      type: object
      required:
        - has_more
        - limit
      properties:
        next_cursor:
          type:
            - string
            - 'null'
          maxLength: 512
        has_more:
          type: boolean
        limit:
          type: integer
    Class:
      type: object
      required:
        - class_id
        - school_id
        - grade_level
        - name
      properties:
        class_id:
          $ref: '#/components/schemas/Uuid'
        school_id:
          $ref: '#/components/schemas/Uuid'
        academic_year_id:
          $ref: '#/components/schemas/Uuid'
        grade_level:
          $ref: '#/components/schemas/GradeLevel'
        name:
          type: string
          maxLength: 255
        student_count:
          type: integer
    SisImportCreate:
      type: object
      required:
        - file_name
        - size_bytes
        - entity_kinds
      properties:
        file_name:
          type: string
          maxLength: 200
          pattern: \.csv$
        size_bytes:
          type: integer
          minimum: 1
          maximum: 10485760
        sha256:
          type: string
          maxLength: 128
        entity_kinds:
          type: array
          minItems: 1
          items:
            type: string
            enum:
              - students
              - classes
              - enrollments
        academic_year_id:
          $ref: '#/components/schemas/Uuid'
    SisImport:
      type: object
      required:
        - import_id
        - school_id
        - status
        - created_at
      properties:
        import_id:
          $ref: '#/components/schemas/Uuid'
        school_id:
          $ref: '#/components/schemas/Uuid'
        status:
          type: string
          enum:
            - awaiting_upload
            - queued
            - validating
            - applying
            - completed
            - completed_with_issues
            - failed
            - expired
        upload_url:
          type: string
          maxLength: 2048
          format: uri
          description: Presigned URL — chỉ trả khi status=awaiting_upload
        upload_expires_at:
          $ref: '#/components/schemas/Timestamp'
        sync_run_id:
          $ref: '#/components/schemas/Uuid'
        rows_total:
          type: integer
        rows_applied:
          type: integer
        rows_rejected:
          type: integer
        reconciliation_issue_count:
          type: integer
        created_at:
          $ref: '#/components/schemas/Timestamp'
    UserRolePage:
      type: object
      required:
        - items
        - page
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/UserRole'
        page:
          $ref: '#/components/schemas/PageInfo'
    UserRole:
      type: object
      required:
        - user_role_id
        - user_id
        - role_id
        - role_code
        - scope_type
        - source
        - valid_from
      description: Gán role cho người dùng trong một phạm vi (`identity.user_roles`, ADR-0066) — thay `RoleAssignment` cũ
      properties:
        user_role_id:
          $ref: '#/components/schemas/Uuid'
        user_id:
          $ref: '#/components/schemas/Uuid'
        role_id:
          $ref: '#/components/schemas/Uuid'
        role_code:
          $ref: '#/components/schemas/RoleCode'
        tenant_id:
          description: null khi scope_type = platform
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        scope_type:
          $ref: '#/components/schemas/UserRoleScopeType'
        scope_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        valid_from:
          $ref: '#/components/schemas/Timestamp'
        valid_to:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        source:
          type: string
          enum:
            - sis
            - manual
        granted_by:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        created_at:
          $ref: '#/components/schemas/Timestamp'
    UserRoleScopeType:

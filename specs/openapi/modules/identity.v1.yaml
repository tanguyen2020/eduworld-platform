          $ref: '#/components/schemas/Uuid'
        status:
          type: string
          enum:
            - queued
            - running
            - succeeded
            - failed
            - cancelled
        dry_run:
          type: boolean
        target_tenant_id:
          $ref: '#/components/schemas/Uuid'
        total_rows:
          type: integer
          minimum: 0
        created_rows:
          type: integer
          minimum: 0
        updated_rows:
          type: integer
          minimum: 0
        error_rows:
          type: integer
          minimum: 0
        errors:
          type: array
          maxItems: 1000
          items:
            type: object
            required:
              - row
              - code
            properties:
              row:
                type: integer
                minimum: 1
              field:
                type: string
                maxLength: 64
              code:
                type: string
                maxLength: 64
                description: vd. PROVINCE_INACTIVE, DUPLICATE_MOET_CODE, GRADE_RANGE_INVALID
              message:
                type: string
                maxLength: 1000
        created_at:
          $ref: '#/components/schemas/Timestamp'
        finished_at:
          $ref: '#/components/schemas/Timestamp'
    TenantSettings:
      type: object
      description: Cài đặt tenant (một phần). Trường cleanup chỉ ghi được khi platform cho phép ghi đè (ADR-0032).
      properties:
        allowed_hours:
          $ref: '#/components/schemas/AllowedHours'
        inactive_student_cleanup_days:
          description: null hoặc 0 = tắt dọn cho tenant; vắng mặt = dùng mặc định platform
          oneOf:
            - type: integer
              minimum: 0
              maximum: 3650
            - type: 'null'
        effective_cleanup_days:
          readOnly: true
          oneOf:
            - type: integer
            - type: 'null'
        gameplay_chat_retention_days:
          description: Thời hạn lưu chat gameplay của tenant (ADR-0033), ≥ 3; vắng mặt = mặc định platform
          oneOf:
            - type: integer
              minimum: 3
              maximum: 365
            - type: 'null'
        default_locale:
          $ref: '#/components/schemas/Locale'
          description: Ngôn ngữ mặc định của tenant cho học sinh mới (ADR-0056)
        cross_school_social_enabled:
          type:
            - boolean
            - 'null'
          description: Xã hội liên trường trong tenant `unit` (ADR-0054, SOCIAL_SYSTEM §7; mặc định `false`, CONFIG_DEFAULTS). Chỉ tenant `unit` bật được (tenant khác gửi `true` → 422); `null` = về mặc định tắt. Đổi giá trị phát `tenant.updated` kèm `settings_subset` để module chat/competition áp phạm vi (F015 T044). Phản hồi luôn có giá trị hiệu lực (boolean).

      operationId: resetStudentPassword
      x-portal-action: action.school_lms.classes.reset_student_password
      summary: Đặt lại mật khẩu học sinh — mật khẩu mới sinh ngẫu nhiên, trả một lần (owner F016)
      description: |
        Quyền `lms.student.password_reset`: School Admin của trường học sinh, Tenant Admin của tenant, System Admin (tenant đích qua `X-Tenant-Id`,
        gồm tenant `common` qua gateway nội bộ). Học sinh không gọi được (game không có tự đặt lại — "Quên mật khẩu? Liên hệ nhà trường").
        Học sinh ngoài tenant/scope → `404`. Quy tắc nguồn: ACCOUNT_PROVISIONING §6d.

        Module identity sinh mật khẩu ngẫu nhiên, đặt qua Keycloak Admin API (`temporary` theo khối như ACCOUNT_PROVISIONING §3.4), trả **một lần** trong
        `initial_password` (`Cache-Control: no-store`), không lưu, không log (R14); thu hồi mọi phiên game của học sinh (`revoke_reason = password_changed`,
        ADR-0086) và phát `user.access_revoked` (`reason = password_changed`, không tắt user Keycloak); ghi audit. Replay cùng `Idempotency-Key` trả kết quả
        đã lưu không có `initial_password` (`password_redacted = true`).
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/StudentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentPasswordResetRequest'
      responses:
        '200':
          description: Đã đặt lại mật khẩu
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentPasswordResetResult'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

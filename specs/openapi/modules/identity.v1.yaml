    TenantUserCreateRequest:
      type: object
      required:
        - username
        - email
        - display_name
        - user_type
        - initial_user_roles
      additionalProperties: false
      description: Tạo tài khoản nhân sự thủ công (ngoài SIS) trong tenant của phiên. Username/email đã thuộc tài khoản khác (trong tenant hoặc trên SSO) → `409 USERNAME_TAKEN` / `409 EMAIL_TAKEN`; cùng một người thì thêm membership thay vì tạo tài khoản (ADR-0069).
      properties:

          $ref: '#/components/schemas/FeatureFlagKey'
        label_key:
          type: string
          maxLength: 128
        title:
          type: string
          maxLength: 200
        path:
          type: string
          maxLength: 256
          pattern: ^/[a-z0-9/:_-]*$
        order:
          type: integer
          minimum: 0
        required_permissions:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 64
            pattern: ^[a-z_]+(\.[a-z_]+)+$
        can_disable:
          type: boolean
        default_enabled:
          type: boolean
        tenant_override:
          type:
            - boolean
            - 'null'
        effective_enabled:
          type: boolean
        actions:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/PortalCatalogAction'
    PortalCatalogAction:
      type: object
      required:
        - key
        - label_key
        - required_permissions
        - can_disable
        - default_enabled
        - effective_enabled
      properties:
        key:
          $ref: '#/components/schemas/FeatureFlagKey'
        label_key:
          type: string
          maxLength: 128
        title:
          type: string
          maxLength: 200
        required_permissions:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 64
            pattern: ^[a-z_]+(\.[a-z_]+)+$
        operation_ids:
          type: array
          maxItems: 100
          items:
            type: string
            maxLength: 128
        can_disable:
          type: boolean
        default_enabled:
          type: boolean
        tenant_override:
          type:
            - boolean
            - 'null'
        effective_enabled:
          type: boolean
    StudentCleanupSettings:
      type: object
      required:
        - default_days
        - notice_days
        - allow_tenant_override
        - approval_threshold_percent
        - reason
      properties:
        default_days:
          description: Mặc định platform (180 [Proposed]); null = tắt toàn hệ thống
          oneOf:
            - type: integer
              minimum: 0
              maximum: 3650
            - type: 'null'
        notice_days:
          type: integer
          minimum: 0
          maximum: 90
          default: 14
        allow_tenant_override:
          type: boolean
          default: true
        approval_threshold_percent:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
        reason:
          type: string
          minLength: 3
          maxLength: 500
          writeOnly: true
    StudentCleanupRunPage:
      type: object
      required:
        - data
        - page
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/StudentCleanupRun'
        page:
          $ref: '#/components/schemas/PageInfo'
    StudentCleanupRun:
      type: object
      required:
        - run_id
        - tenant_id
        - status
        - started_at
      properties:
        run_id:
          $ref: '#/components/schemas/Uuid'
        tenant_id:
          $ref: '#/components/schemas/Uuid'
        status:
          type: string
          enum:
            - dry_run
            - running
            - completed
            - awaiting_approval
            - approved
            - failed
        candidates:
          type: integer
        cleaned:
          type: integer
        excluded:
          type: integer
        skipped_active:
          type: integer
          description: Đang có session/bài kiểm tra/giải đấu/moderation case mở
        started_at:
          $ref: '#/components/schemas/Timestamp'
        finished_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    ChatRetentionSettings:
      type: object
      required:
        - gameplay_chat_retention_days
        - ephemeral_retention_hours
        - allow_tenant_override
        - reason
      properties:
        gameplay_chat_retention_days:
          type: integer
          minimum: 3
          maximum: 365
          default: 7
        minimum_days:
          type: integer
          readOnly: true
          const: 3
        ephemeral_retention_hours:
          type: integer
          minimum: 1
          maximum: 168
          default: 24
        allow_tenant_override:
          type: boolean
          default: true
        reason:
          type: string
          minLength: 3
          maxLength: 500
          writeOnly: true
    AuditLogPage:
      type: object
      required:
        - data
        - page
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AuditLogEntry'
        page:
          $ref: '#/components/schemas/PageInfo'
    AuditLogEntry:
      type: object
      required:
        - audit_id
        - action
        - actor_id
        - occurred_at
      properties:
        audit_id:
          $ref: '#/components/schemas/Uuid'
        tenant_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        actor_id:
          $ref: '#/components/schemas/Uuid'
        actor_type:
          type: string
          enum:
            - staff
            - system
            - service
          description: staff gồm nhân sự trường và platform (ADR-0081)
        action:
          type: string
          maxLength: 128
        resource_type:
          type: string
          maxLength: 64
        resource_id:
          $ref: '#/components/schemas/Uuid'
        reason:
          type: string
          maxLength: 1000
        changes:
          type: object
          maxProperties: 100
          description: Diff đã lọc PII/secret
          additionalProperties: true
        trace_id:
          type: string
          maxLength: 64
        occurred_at:
          $ref: '#/components/schemas/Timestamp'
    DataRequest:
      allOf:
        - $ref: '#/components/schemas/DataRequestCreate'
        - type: object
          required:
            - data_request_id
            - tenant_id
            - status
            - created_at
          properties:
            data_request_id:
              $ref: '#/components/schemas/Uuid'
            tenant_id:
              $ref: '#/components/schemas/Uuid'
            status:
              type: string
              enum:
                - received
                - verifying
                - in_progress
                - completed
                - rejected
            download_url:
              type:
                - string
                - 'null'
              maxLength: 2048
              format: uri
            created_at:
              $ref: '#/components/schemas/Timestamp'
            completed_at:
              $ref: '#/components/schemas/Timestamp'
    DataRequestCreate:
      type: object
      required:
        - request_type
        - subject_user_id
        - requester_kind
        - reason
      additionalProperties: false
      properties:
        request_type:
          type: string
          enum:
            - export
            - anonymize
        subject_user_id:
          $ref: '#/components/schemas/Uuid'
        requester_kind:
          type: string
          enum:
            - school
            - parent_via_school
            - student
            - authority
        reference:
          type: string
          maxLength: 128
          description: Số văn bản/mã hồ sơ của yêu cầu
        reason:
          type: string
          minLength: 10
          maxLength: 1000
    SisConnectionSchool:
      type: object
      required:
        - sis_connection_id
        - school_id
        - active
      properties:
        sis_connection_id:
          $ref: '#/components/schemas/Uuid'
        school_id:
          $ref: '#/components/schemas/Uuid'
        tenant_id:
          $ref: '#/components/schemas/Uuid'
        school_name:
          type: string
          maxLength: 255
        active:
          type: boolean
        assigned_at:
          $ref: '#/components/schemas/Timestamp'
  headers:
    ContentLanguage:
      description: Ngôn ngữ của văn bản đã chọn trong response (`vi-VN` | `en-US`)
      schema:
        type: string
        maxLength: 16
    RateLimitLimit:
      schema:
        type: integer
    RateLimitRemaining:
      schema:
        type: integer
    RateLimitReset:
      schema:
        type: integer
    RetryAfter:
      schema:
        type: integer
    PortalSessionSetCookie:
      description: |
        Cookie phiên portal (ADR-0091 mục 4): `__Secure-ew_portal_rt=<refresh token>; HttpOnly; Secure; SameSite=Strict; Path=/api/v1/auth/portal; Max-Age=<refresh_expires_in>`
        và `__Host-ew_portal_csrf=<giá trị CSRF>; Secure; SameSite=Strict; Path=/` (không HttpOnly — portal đọc để gửi header `X-EW-CSRF`).
        Khi đăng xuất hoặc refresh thất bại: cả hai cookie được xóa (`Max-Age=0`).
      schema:
        type: string
        maxLength: 8192
    ETag:
      description: Phiên bản tài nguyên cho optimistic concurrency
      schema:
        type: string
        maxLength: 512
  responses:
    ValidationFailed:
      description: VALIDATION_FAILED, ATTEMPT_DEADLINE_PASSED, INVALID_STATE_TRANSITION, MODERATION_SWITCH_REASON_REQUIRED, SENSITIVE_TERM_INVALID, SENSITIVE_CATALOG_REGRESSION_FAILED, DASHBOARD_RANGE_TOO_LARGE, ROLE_NOT_FOUND; sub-code `errors[].code = PERMISSION_NOT_ALLOWED_FOR_SCOPE` khi role tenant chứa permission platform
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
    RateLimited:
      description: RATE_LIMITED, LOGIN_QUEUE_BUSY (hàng chờ đăng nhập game, ADR-0045/0068)
      headers:
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: Dịch vụ phụ thuộc tạm thời không sẵn sàng (vd. CHAT_TEMPORARILY_UNAVAILABLE khi NATS JetStream lỗi) — client thử lại theo Retry-After
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthenticated:
      description: Thiếu/sai/hết hạn token (UNAUTHENTICATED)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: PERMISSION_DENIED, FEATURE_DISABLED (action/menu portal đang tắt, có `feature_key` — ADR-0090), GAME_ACCESS_STUDENT_ONLY, FORBIDDEN_SCOPE, POLICY_DENIED, TENANT_NOT_SELECTED, TENANT_MISMATCH, TENANT_ACCESS_DISABLED, RESOURCE_NOT_ASSIGNED, ACCOUNT_LOCKED, ACCOUNT_DEACTIVATED, ACCOUNT_NOT_PROVISIONED, NO_ACTIVE_ENROLLMENT, ACCESS_OUTSIDE_ALLOWED_HOURS, CURFEW_ACTIVE, PARTY_NOT_LEADER, PARTY_INVITE_NOT_ALLOWED, PARTY_POLICY_VIOLATION, CHAT_NOT_ALLOWED, CHAT_KIND_NOT_ALLOWED, CHAT_MUTED, TENANT_TOGGLE_NOT_ALLOWED, MODERATION_SWITCH_SELF_APPROVAL, PORTAL_ACCESS_STAFF_ONLY, HINTS_NOT_ALLOWED
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem:
      description: Lỗi (RFC 9457)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Không tồn tại hoặc ngoài tenant scope (NOT_FOUND)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Xung đột trạng thái (vd. CONTENT_VERSION_CONFLICT, CONTENT_NOT_PUBLISHED, SIS_SCHOOL_ALREADY_CONNECTED, ATTEMPT_ALREADY_SUBMITTED, EXAM_ALREADY_SUBMITTED, PARTY_ALREADY_IN_PARTY, PARTY_FULL, MM_TICKET_ALREADY_ACTIVE, IDEMPOTENCY_KEY_REUSED, IDENTITY_CONFLICT, USERNAME_TAKEN, EMAIL_TAKEN, HINTS_EXHAUSTED, ASSIGNMENT_NOT_EDITABLE, MODERATION_CASE_CLOSED)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailed:
      description: VERSION_MISMATCH
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionRequired:
      description: IDEMPOTENCY_KEY_REQUIRED hoặc PRECONDITION_REQUIRED
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PayloadTooLarge:
      description: MEDIA_TOO_LARGE — vượt giới hạn dung lượng của loại media (ADR-0044)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  securitySchemes:
    keycloakBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token Keycloak (realm eduworld, aud eduworld-api, TTL 5 phút).
    keycloakAdminBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token Keycloak của Admin Portal (claim `azp = eduworld-portal`, phát qua `POST /auth/portal/login` — ADR-0091) có MFA (`acr` mức MFA, `amr` chứa `otp`; thiếu hoặc `auth_time` quá 8 giờ → 403 MFA_REQUIRED),
        Principal phải có role platform với permission tương ứng (`game.*`, `competition.config.*`, `platform.*`).
        Chỉ dùng trên gateway nội bộ (ADR-0027).
    keycloakOidc:
      type: openIdConnect
      description: Host thật theo môi trường (`sso.<env>.<domain>`, OQ-10); URL dưới đây là placeholder hợp lệ.
      openIdConnectUrl: https://sso.eduworld.example/realms/eduworld/.well-known/openid-configuration

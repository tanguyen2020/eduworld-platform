components:
  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: Ngôn ngữ hiển thị mong muốn (`vi-VN` mặc định, `en-US`). Server chọn ngôn ngữ trả về và đặt `Content-Language` (ADR-0056). Dữ liệu cache dài (manifest, snapshot) luôn trả đủ vi+en.
      schema:
        type: string
        maxLength: 64
        examples:
          - vi-VN
          - en-US
    TenantIdHeader:
      name: X-Tenant-Id
      in: header
      required: true
      description: |
        Tenant của phiên (ADR-0065). Lấy từ `PlayerBootstrap.tenant_id` (game) hoặc tenant đã chọn sau đăng nhập portal (`GET /me/tenants`).
        Gateway trả `400 TENANT_HEADER_REQUIRED` khi thiếu, `400 BAD_REQUEST` khi sai định dạng; backend kiểm tra khớp token + membership,
        lệch → `403 TENANT_MISMATCH`. `Principal.tenant_id` lấy từ kết quả kiểm tra, không lấy thẳng từ header.
      schema:
        $ref: '#/components/schemas/Uuid'
    PortalRefreshCookie:
      name: __Secure-ew_portal_rt
      in: cookie
      required: true
      description: Refresh token của portal (`HttpOnly; Secure; SameSite=Strict; Path=/api/v1/auth/portal`) — JavaScript không đọc được (ADR-0091 mục 4)
      schema:
        type: string
        maxLength: 8192
    PortalCsrfCookie:
      name: __Host-ew_portal_csrf
      in: cookie
      required: true
      description: Giá trị CSRF double-submit (`Secure; SameSite=Strict; Path=/`, không HttpOnly), đổi mỗi lần đăng nhập/làm mới
      schema:
        type: string
        minLength: 43
        maxLength: 64
        pattern: ^[A-Za-z0-9_-]+$
    PortalCsrfHeader:
      name: X-EW-CSRF
      in: header
      required: true
      description: Phải bằng giá trị cookie `__Host-ew_portal_csrf`; thiếu/lệch → `403 CSRF_TOKEN_INVALID` (ADR-0091 mục 4)
      schema:
        type: string
        minLength: 43
        maxLength: 64
        pattern: ^[A-Za-z0-9_-]+$
    PortalRefreshCookieOptional:
      name: __Secure-ew_portal_rt
      in: cookie
      required: false
      description: Refresh token của portal; vắng mặt khi phiên đã hết (đăng xuất vẫn `204`)
      schema:
        type: string
        maxLength: 8192
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID do client sinh; lưu 24h (ADR-0010)
      schema:
        type: string
        format: uuid
    TenantIdHeaderOptional:
      name: X-Tenant-Id
      in: header
      required: false
      description: |
        Người dùng tenant: **bắt buộc** (thiếu → `400 TENANT_HEADER_REQUIRED`). Role platform (System Admin, content_admin…):
        vắng mặt = phạm vi platform / đọc liên tenant bằng `tenant_ids`; có giá trị = tenant đích của thao tác ghi (ADR-0027, ADR-0065).
        Có giá trị thì luôn được kiểm tra như `TenantIdHeader`.
      schema:
        $ref: '#/components/schemas/Uuid'
    TenantIds:
      name: tenant_ids
      in: query
      required: false
      description: |
        Chỉ System Admin (platform.cross_tenant.read): lọc theo một hoặc nhiều tenant; vắng mặt = tất cả tenant.
        Người dùng tenant gửi tham số này bị bỏ qua (luôn khóa vào tenant của phiên) — ADR-0027 §6.
      style: form
      explode: true
      schema:
        type: array
        maxItems: 100
        items:
          $ref: '#/components/schemas/Uuid'
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      description: Cursor opaque từ page.next_cursor
      schema:
        type: string
        maxLength: 512
    StudentId:
      name: student_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    SchoolId:
      name: school_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    GradeLevelQuery:
      name: grade_level
      in: query
      schema:
        $ref: '#/components/schemas/GradeLevel'
    ResourceTypePath:
      name: resource_type
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ResourceType'
    ResourceIdPath:
      name: resource_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    RoleIdPath:
      name: role_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        maxLength: 512
    ReasonQuery:
      name: reason
      in: query
      required: true
      description: Lý do (ghi audit) — bắt buộc khi xóa/thu hồi
      schema:
        type: string
        minLength: 3
        maxLength: 1000
    UserRoleIdPath:
      name: user_role_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    CountryCodePath:
      name: code
      in: path
      required: true
      schema:
        type: string
        pattern: ^[A-Z]{2}$
        maxLength: 2
    ProvinceIdPath:
      name: province_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    DataRequestIdPath:
      name: data_request_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ConnectionIdPath:
      name: connection_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
  schemas:
    GameLoginRequest:
      type: object
      required:
        - username
        - password
        - device_id
        - client_version
        - platform
      additionalProperties: false
      description: Body của `POST /auth/game/login`. **Không bao giờ log** (APISIX, service, tracing); mật khẩu chỉ chuyển tiếp tới Keycloak.
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 128
          description: So sánh không phân biệt hoa thường sau chuẩn hóa trim/NFC; duy nhất trên SSO (ADR-0069)
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 256
          writeOnly: true
        device_id:
          $ref: '#/components/schemas/Uuid'
          description: UUID của bản cài game (giống header X-Device-Id)
        client_version:
          type: string
          maxLength: 32
          pattern: ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]{1,20})?$
        platform:
          type: string
          enum:
            - windows
            - macos
            - linux
            - android
            - ios
            - web
        locale:
          $ref: '#/components/schemas/Locale'
    Uuid:
      type: string
      format: uuid
      description: UUIDv7
    Locale:
      type: string
      enum:
        - vi-VN
        - en-US
      description: Locale đầy đủ dùng ở client/HTTP (ADR-0056)
    GameLoginResponse:
      type: object
      description: Không có `game_session_id` — game client tạo game session bằng `createGameSession` sau khi đăng nhập (ADR-0083).
      required:
        - tokens
        - bootstrap
      properties:
        tokens:
          $ref: '#/components/schemas/GameTokenSet'
        bootstrap:
          $ref: '#/components/schemas/PlayerBootstrap'
          description: '`bootstrap.tenant_id` là giá trị header `X-Tenant-Id` của mọi request tiếp theo (ADR-0065)'
    GameTokenSet:
      type: object
      required:
        - access_token
        - refresh_token
        - token_type
        - expires_in
        - refresh_expires_in
      description: |
        Token Keycloak của học sinh (client `eduworld-game-backend`, `azp = eduworld-game-backend`). Access token chỉ trong RAM.
        Refresh token (xoay vòng mỗi lần dùng): thiết bị cá nhân lưu trong kho bảo mật OS (Windows DPAPI, Android Keystore, iOS Keychain);
        Web và máy `shared_device` chỉ giữ trong RAM (ADR-0086). Không bao giờ lưu mật khẩu, không ghi vào `user://`/localStorage.
      properties:
        access_token:
          type: string
          maxLength: 8192
        refresh_token:
          type: string
          maxLength: 8192
        token_type:
          type: string
          enum:
            - Bearer
        expires_in:
          type: integer
          minimum: 1
          description: Giây (mặc định 300)
        refresh_expires_in:
          type: integer
          minimum: 1
          description: Giây tới khi refresh token hết hạn theo idle (7 ngày) nhưng không vượt tối đa phiên (30 ngày) — `game_session_sso`, ADR-0086
    PlayerBootstrap:
      type: object
      required:
        - user
        - tenant_id
        - tenant_type
        - is_common_tenant
        - game_profile
        - policies
        - feature_flags
      properties:
        user:
          $ref: '#/components/schemas/Principal'
        tenant_id:
          $ref: '#/components/schemas/Uuid'
          description: Giá trị header `X-Tenant-Id` của mọi request tiếp theo (ADR-0065)
        tenant_type:
          $ref: '#/components/schemas/TenantType'
        is_common_tenant:
          type: boolean
          description: true nếu học sinh không thuộc tenant SIS nào và vào tenant chung (ADR-0026, ADR-0063)
        tenant_name:
          type: string
          maxLength: 255
        student:
          $ref: '#/components/schemas/StudentSummary'
        school:
          $ref: '#/components/schemas/PlayerSchool'
        class:
          $ref: '#/components/schemas/PlayerClass'
        game_profile:
          $ref: '#/components/schemas/GameProfile'
        grade_band:
          $ref: '#/components/schemas/GradeBand'
        policies:
          type: object
          description: Policy hiệu lực rút gọn cho client (chỉ để hiển thị; server vẫn kiểm tra)
          properties:
            chat:
              type: object
              properties:
                allowed_kinds_by_channel:
                  type: object
                  additionalProperties:
                    type: array
                    items:
                      type: string
                      enum:
                        - text
                        - quick
                        - emoji
                direct_message_enabled:
                  type: boolean
            party:
              type: object
              properties:
                max_members:
                  type: integer
                  minimum: 2
                  maximum: 8
                  default: 4
                cross_class_allowed:
                  type: boolean
            play_time:
              type: object
              properties:
                break_reminder_minutes:
                  type: integer
                access_window:
                  type: string
                  maxLength: 64
                  description: vd. 06:30-21:30 Asia/Ho_Chi_Minh
        feature_flags:
          type: object
          additionalProperties:
            type: boolean
        content_manifest_version:
          type: string
          maxLength: 64
        server_time:
          $ref: '#/components/schemas/Timestamp'
        preferred_language:
          $ref: '#/components/schemas/Locale'
          description: Ngôn ngữ đã chọn của học sinh; vắng mặt = default_locale của tenant
        supported_locales:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/Locale'
    Principal:
      type: object
      required:
        - user_id
        - user_type
        - status
        - roles
      properties:
        user_id:
          $ref: '#/components/schemas/Uuid'
        user_type:
          type: string
          enum:
            - student
            - staff
          description: staff = nhân sự (trường hoặc platform); phân biệt platform/tenant bằng primary_tenant_id và role, không bằng user_type (ADR-0081)
        status:
          type: string
          enum:
            - pending
            - active
            - locked
            - deactivated
        display_name:
          type: string
          maxLength: 128
        roles:
          type: array
          items:
            $ref: '#/components/schemas/EffectiveRole'
    EffectiveRole:
      type: object
      required:
        - role
        - scope_type
      properties:
        role:
          $ref: '#/components/schemas/RoleCode'
        scope_type:
          type: string
          enum:
            - platform
            - tenant
            - school
            - class
            - subject
        tenant_id:
          description: Tenant của assignment; null với scope platform
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        scope_id:
          $ref: '#/components/schemas/Uuid'
      description: Role hiệu lực rút gọn của Principal (tóm tắt từ UserRole, ADR-0066)
    RoleCode:
      type: string
      description: |
        Mã role (`identity.roles.code`). Role hệ thống seed sẵn — tenant: tenant_admin, school_admin, academic_manager,
        tenant_content_editor, tenant_content_reviewer; platform: system_admin, content_admin, content_reviewer,
        game_designer, liveops, competition_admin, safety_moderator (ADR-0066, ADR-0072). Mã không tồn tại → `422 ROLE_NOT_FOUND`. Tenant có thể tạo role tùy biến [Proposed] nên không dùng enum.
        `student` là realm role Keycloak của học sinh, không phải role portal.
      maxLength: 64
      pattern: ^[a-z][a-z0-9_]{1,63}$
    TenantType:
      type: string
      enum:
        - school
        - unit
        - common
      description: school = trường độc lập; unit = đơn vị nhiều trường; common = tenant chung (ADR-0005)
    StudentSummary:
      type: object
      required:
        - student_id
        - school_id
        - grade_level
      properties:
        student_id:
          $ref: '#/components/schemas/Uuid'
        display_name:
          type: string
          maxLength: 128
        school_id:
          $ref: '#/components/schemas/Uuid'
        school_name:
          type: string
          maxLength: 255
        grade_level:
          $ref: '#/components/schemas/GradeLevel'
        class_id:
          $ref: '#/components/schemas/Uuid'
        class_name:
          type: string
          maxLength: 128
    GradeLevel:
      type: integer
      minimum: 1
      maximum: 9
    PlayerSchool:
      type: object
      required:
        - school_id
        - name
        - is_virtual
      description: Trường của học sinh để hiển thị trong game (song ngữ, ADR-0056/0060)
      properties:
        school_id:
          $ref: '#/components/schemas/Uuid'
        name:
          $ref: '#/components/schemas/TenantLocalizedName'
        province:
          $ref: '#/components/schemas/ProvinceRef'
        school_level:
          $ref: '#/components/schemas/SchoolLevel'
        is_virtual:
          type: boolean
    TenantLocalizedName:
      type: object
      description: 'Tên do tenant nhập: vi bắt buộc, en tùy chọn (sự kiện trường — EVENT_SEASON_SYSTEM §10)'
      required:
        - vi
      additionalProperties: false
      properties:
        vi:
          type: string
          minLength: 1
          maxLength: 255
        en:
          type: string
          minLength: 1
          maxLength: 255
    ProvinceRef:
      type: object
      required:
        - code
        - name
      properties:
        code:
          type: string
          maxLength: 64
        name:
          $ref: '#/components/schemas/LocalizedName'
    LocalizedName:
      type: object
      description: Tên/nhãn hiển thị song ngữ bắt buộc cả vi và en (văn bản game — ADR-0056 mục 2)
      required:
        - vi
        - en
      additionalProperties: false
      properties:
        vi:
          type: string
          minLength: 1
          maxLength: 255
        en:
          type: string
          minLength: 1
          maxLength: 255
    SchoolLevel:
      type: string
      enum:
        - primary
        - lower_secondary
        - multi_level
    PlayerClass:
      type: object
      required:
        - class_id
        - name
        - grade_level
      properties:
        class_id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
          maxLength: 255
        grade_level:
          $ref: '#/components/schemas/GradeLevel'
        academic_year:
          type: string
          maxLength: 16
          examples:
            - 2026-2027
    GameProfile:
      type: object
      required:
        - student_id
        - nickname
        - level
        - xp_total
      properties:
        student_id:
          $ref: '#/components/schemas/Uuid'
        nickname:
          type: string
          maxLength: 128
        level:
          type: integer
          minimum: 1
        xp_total:
          type: integer
          minimum: 0
        avatar_config:
          $ref: '#/components/schemas/AvatarConfig'
        last_area_id:
          type: string
          maxLength: 64
        settings:
          type: object
          additionalProperties: true
        preferred_language:
          $ref: '#/components/schemas/Locale'
    AvatarConfig:
      type: object
      properties:
        body:
          type: string
          maxLength: 1000
        skin_tone:
          type: string
          maxLength: 64
        hair_item_id:
          $ref: '#/components/schemas/Uuid'
        outfit_item_id:
          $ref: '#/components/schemas/Uuid'
        accessory_item_ids:
          type: array
          maxItems: 4
          items:
            $ref: '#/components/schemas/Uuid'
        emote_item_ids:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/Uuid'
    GradeBand:
      type: string
      enum:
        - g1_3
        - g4_5
        - g6_7
        - g8_9
    Timestamp:
      type: string
      format: date-time
    Problem:
      type: object
      required:
        - type
        - title
        - status
        - code
      properties:
        type:
          type: string
          maxLength: 2048
          format: uri
        title:
          type: string
          maxLength: 255
        status:
          type: integer
        code:
          description: Mã ổn định; client phải chấp nhận giá trị chưa biết
          anyOf:
            - $ref: '#/components/schemas/ProblemCode'
            - type: string
              maxLength: 64
        detail:
          type: string
          maxLength: 1000
        instance:
          type: string
          maxLength: 2048
        trace_id:
          type: string
          maxLength: 64
        policy_reason:
          type: string
          maxLength: 1000
        feature_key:
          type: string
          maxLength: 128
          description: 'Chỉ có khi `code = FEATURE_DISABLED`: khóa action hoặc menu cha đang tắt (ADR-0090)'
    ProblemCode:
      type: string
      description: Mã lỗi ổn định — catalog đầy đủ trong docs/07-backend/API_DESIGN.md §4.1. Client phải chấp nhận giá trị lạ.

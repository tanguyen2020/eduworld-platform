            properties:
              role_id:
                $ref: '#/components/schemas/Uuid'
              scope_type:
                type: string
                enum:
                  - tenant
                  - school
                  - subject
                description: Không có scope lớp (ADR-0072)
              scope_id:
                $ref: '#/components/schemas/Uuid'
    TenantUserUpdateRequest:

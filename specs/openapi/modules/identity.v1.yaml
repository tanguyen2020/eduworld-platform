      properties:
        name:
          $ref: '#/components/schemas/TenantLocalizedName'
        province_code:
          type: string
          maxLength: 64
          description: Chỉ đơn vị `active`
        moet_code:
          type:
            - string
            - 'null'
          maxLength: 32
        school_level:
          $ref: '#/components/schemas/SchoolLevel'
        grade_min:
          $ref: '#/components/schemas/GradeLevel'
        grade_max:
          $ref: '#/components/schemas/GradeLevel'
        address:
          type:
            - string
            - 'null'
          maxLength: 500
    ClassPage:
      type: object

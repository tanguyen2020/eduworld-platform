      summary: Đăng xuất game — thu hồi refresh token + phiên Keycloak (không đóng game session — ADR-0083, ADR-0086)
      description: |
        Gọi khi học sinh bấm **Đăng xuất**, hoặc khi thoát game trên máy `shared_device`/Web, **sau** `endGameSession`
        (`POST /game/sessions/{game_session_id}:end`); client xóa refresh token khỏi kho bảo mật + RAM. Thoát game bình thường
        trên thiết bị cá nhân **không** gọi endpoint này (giữ phiên để lần mở sau `mode = resume`, ADR-0086).
        Chỉ thu hồi refresh token và phiên Keycloak (`game_auth_sessions.revoked_at`, `revoke_reason = logout`); module identity không gọi module game. Nếu client không gọi được
        `endGameSession`, module game tự đóng game session theo heartbeat timeout (ADR-0083). Idempotent (`204` cả khi
        token đã hết hạn).
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
      requestBody:

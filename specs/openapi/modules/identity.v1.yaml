      description: Tài khoản SSO (`identity.users`, liên kết `keycloak_sub`). Một người một tài khoản; username và email duy nhất trên Keycloak và trong module identity (không phân biệt hoa thường), nên không bao giờ trùng trong cùng tenant; thuộc nhiều tenant qua membership/UserRole (ADR-0066, ADR-0069).
      properties:
        user_id:
          $ref: '#/components/schemas/Uuid'
        user_type:
          type: string
          enum:
            - student
            - staff
          description: staff = nhân sự (trường hoặc platform); phân biệt platform/tenant bằng primary_tenant_id và role, không bằng user_type (ADR-0081)
        primary_tenant_id:
          description: Tenant gốc; null = nhân sự platform (chỉ nhận role platform), có giá trị = học sinh hoặc nhân sự trường (chỉ nhận role tenant) — ADR-0081
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        status:
          type: string
          enum:
            - pending
            - active
            - locked
            - deactivated
        username:
          type: string
          minLength: 3
          maxLength: 128
        email:
          type:
            - string
            - 'null'
          format: email
          maxLength: 320
        display_name:
          type: string
          maxLength: 128
        locale:
          $ref: '#/components/schemas/Locale'
        source:
          type: string
          enum:
            - sis
            - manual
            - import
        last_login_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        tenant_ids:
          type: array
          maxItems: 50
          description: Tenant có membership của người dùng trong phạm vi truy vấn (chỉ listPlatformUsers với tenant_ids; vắng ở API khác)
          items:
            $ref: '#/components/schemas/Uuid'
        user_roles:
          type: array
          maxItems: 100
          description: UserRole hiệu lực trong tenant hiện tại
          items:
            $ref: '#/components/schemas/UserRole'
        version:
          type: integer
          minimum: 1
    PlatformUserCreateRequest:
      type: object
      required:
        - username
        - email
        - display_name
        - initial_role_ids
        - reason
      additionalProperties: false
      description: Tạo nhân sự platform (`createPlatformUser`, `primary_tenant_id = null`, chỉ nhận role platform — ADR-0081). Username/email duy nhất trên SSO và trong module identity, không phân biệt hoa thường (ADR-0069).
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 128
          pattern: ^[A-Za-z0-9._-]{3,128}$
        email:
          type: string
          format: email
          maxLength: 320
          description: Bắt buộc với nhân sự (ADR-0069)
        display_name:
          type: string
          minLength: 1
          maxLength: 128
        locale:
          $ref: '#/components/schemas/Locale'
        initial_role_ids:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          description: Role `platform` (scope_type = platform); `safety_moderator` gán sau bằng grantPlatformUserRole (cần training_completed_at)
          items:
            $ref: '#/components/schemas/Uuid'
        reason:
          type: string
          minLength: 3
          maxLength: 1000
    IntegrationOverview:
      type: object
      required:
        - keycloak
        - apisix
        - sis
        - generated_at
      description: Tổng quan tích hợp chỉ đọc từ cấu hình server và số liệu SIS; không có secret (getIntegrationOverview).
      properties:
        keycloak:
          type: object
          required:
            - issuer_url
            - realm
            - clients
            - platform_auth_max_age_seconds
          properties:
            issuer_url:
              type: string
              format: uri
              maxLength: 2048
              description: Issuer OIDC của realm (phần tử đầu EW_OIDC_ISSUERS)
            realm:
              type: string
              maxLength: 64
            clients:
              type: array
              maxItems: 20
              items:
                type: object
                required:
                  - client_id
                  - purpose
                properties:
                  client_id:
                    type: string
                    maxLength: 64
                  purpose:
                    type: string
                    enum:
                      - portal
                      - game
                      - admin_api
                    description: portal = client portal, game = client game backend, admin_api = service account Admin API của module identity
            platform_auth_max_age_seconds:
              type: integer
              minimum: 0
              description: Tuổi tối đa của phiên portal nhân sự platform tính từ lúc nhập mật khẩu (EW_OIDC_PLATFORM_MAX_AUTH_AGE, ADR-0094 §2)
        apisix:
          type: object
          required:
            - public_base_url
            - internal_base_url
            - route_groups
          description: Định tuyến quản lý bằng route-as-code (deploy/apisix/routes/routes.yaml); URL lấy từ EW_GATEWAY_PUBLIC_BASE_URL / EW_GATEWAY_INTERNAL_BASE_URL, null = chưa cấu hình
          properties:
            public_base_url:
              type:
                - string
                - 'null'
              format: uri
              maxLength: 2048
            internal_base_url:
              type:
                - string
                - 'null'
              format: uri
              maxLength: 2048
            route_groups:
              type: array
              maxItems: 100
              description: 'Nhóm prefix → service của gateway, sinh lúc build từ deploy/apisix/routes/routes.yaml (route-as-code, `make gen`; core-api không đọc file triển khai lúc chạy — OQ F059-12). Route `gateway: both` cho hai mục (public, internal)'
              items:
                type: object
                additionalProperties: false
                required:
                  - prefix
                  - gateway
                  - service
                properties:
                  prefix:
                    type: string
                    maxLength: 256
                    description: URI của route, bỏ ký tự đại diện cuối (*)
                  gateway:
                    type: string
                    enum:
                      - public
                      - internal
                  service:
                    type: string
                    maxLength: 64
                    description: Upstream nhận route (core-api, realtime)
        sis:
          type: object
          required:
            - connections_total
            - connections_by_status
          properties:
            connections_total:
              type: integer
              minimum: 0
            connections_by_status:
              type: object
              maxProperties: 10
              description: Số kết nối SIS (mọi tenant, chưa xóa) theo `status`
              additionalProperties:
                type: integer
                minimum: 0
        generated_at:
          $ref: '#/components/schemas/Timestamp'
    UserMergeCommand:

      description: |
        Quyền `school.settings.read` trong scope trường (School Admin trường mình; Tenant Admin các trường của tenant). Trường ngoài tenant/scope → `404`. Trả `platform_curfew`, `effective_curfew` chỉ đọc để portal hiển thị giới hạn "chỉ siết thêm" (CHILD_SAFETY §4.1, ADR-0078).
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/SchoolId'
      responses:
        '200':
          description: OK
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchoolSettings'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      x-service: identity
      tags:
        - schools
      operationId: updateSchoolSettings
      x-portal-action: action.school_lms.settings.edit_school

      x-portal-shell: true
      summary: Danh mục trường (người dùng tenant thấy trường trong tenant; System Admin lọc theo tenant_ids)
      description: |
        Người dùng tenant: luôn khóa vào tenant của phiên (`X-Tenant-Id` bắt buộc, `tenant_ids` bị bỏ qua).
        System Admin: không gửi `X-Tenant-Id` thì **bắt buộc** `tenant_ids` (`platform.cross_tenant.read`, CrossTenantScope,
        audit `cross_tenant.accessed`); không có `tenant_ids` → `403 PERMISSION_DENIED` (không liệt kê trường của mọi tenant).
        Gửi `X-Tenant-Id` = tenant đích thì đọc đúng tenant đó (OQ F057-4).
      parameters:
        - $ref: '#/components/parameters/TenantIdHeaderOptional'
        - name: status

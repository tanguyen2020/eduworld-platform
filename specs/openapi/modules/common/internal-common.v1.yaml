# THƯ VIỆN DÙNG CHUNG cho hợp đồng facade giữa module (ADR-0074, ADR-0040).
# Không phải tài liệu OpenAPI độc lập: các file `<module>.internal.v1.yaml` tham chiếu tới
# `#/paths/...` (interface platform ops chuẩn) và `#/components/...` trong file này.
# Mọi `type: string` phải có `maxLength` (ADR-0041) — kiểm tra bằng scripts/specs/check-maxlength.mjs.
#
# Facade được gọi TRONG TIẾN TRÌNH (modular monolith, ADR-0074): `make gen` sinh kiểu DTO + interface strict-server
# vào `modules/<module>/api/`. Path `/internal/v1/...` chỉ là định danh operation (dùng lại khi tách module thành
# service); không có HTTP nội bộ, không security scheme, không token `svc-*`.
# - `x-allowed-callers`: tên module được gọi operation (`identity`, `learning`, `game`, `competition`, `chat`).
#   depguard/`make arch-check` chặn module khác import/gọi; `pkg/modcall` kiểm lại lúc chạy → 403 CALLER_NOT_ALLOWED.
# - Ngữ cảnh đi qua `context.Context` bằng `pkg/modcall`, không phải header: span tracing, deadline, TenantScope,
#   Principal gốc (on-behalf), module gọi, Idempotency-Key. `x-context-required` liệt kê phần bắt buộc:
#   `tenant_scope` (phải có TenantScope/CrossTenantScope/PlatformScope), `idempotency_key` (UUIDv7, thao tác ghi).
#   Khi tách module thành service, adapter HTTP ánh xạ ngữ cảnh này sang `traceparent`, `X-Tenant-Id`, `Idempotency-Key`.

paths:
  /internal/v1/platform/tenant-clones/{job_id}/steps:
    post:
      tags: [platform-ops]
      operationId: executeTenantCloneStep
      summary: Thực thi bước clone thuộc module này trong một job clone tenant (saga do module identity điều phối)
      description: |
        Clone sâu các tài nguyên thuộc module này từ tenant nguồn sang tenant đích (ADR-0029).
        Idempotent theo `(job_id, resource_type)`: gọi lại trả kết quả lần trước. Không bao giờ clone
        dữ liệu cá nhân/học tập của học sinh. Bản sao có `cloned_from_id`, `cloned_from_tenant_id`.
      x-allowed-callers: [identity]
      x-context-required: [idempotency_key]
      parameters:
        - $ref: '#/components/parameters/JobIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TenantCloneStepRequest' }
      responses:
        '200':
          description: Kết quả bước clone
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantCloneStepResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CallerNotAllowed' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }

  /internal/v1/platform/trash:
    get:
      tags: [platform-ops]
      operationId: listTrash
      summary: Liệt kê bản ghi đã soft-delete của module này (Thùng rác, ADR-0028)
      description: Module identity gộp kết quả từ mọi module để trả cho `/api/v1/admin/trash` và `/api/v1/tenant/trash`.
      x-allowed-callers: [identity]
      parameters:
        - name: tenant_ids
          in: query
          required: false
          description: Lọc tenant. Vắng mặt = mọi tenant (chỉ hợp lệ khi người gọi gốc là System Admin, kiểm tra bởi module identity).
          style: form
          explode: true
          schema:
            type: array
            maxItems: 100
            items: { type: string, format: uuid }
        - name: resource_type
          in: query
          required: false
          schema: { $ref: '#/components/schemas/ResourceType' }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Một trang bản ghi đã xóa
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrashPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CallerNotAllowed' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /internal/v1/platform/trash/{resource_type}/{resource_id}:restore:
    post:
      tags: [platform-ops]
      operationId: restoreTrashItem
      summary: Khôi phục một bản ghi đã soft-delete (đặt lại deleted_at = NULL)
      x-allowed-callers: [identity]
      x-context-required: [tenant_scope, idempotency_key]
      parameters:
        - $ref: '#/components/parameters/ResourceTypePath'
        - $ref: '#/components/parameters/ResourceIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RestoreRequest' }
      responses:
        '200':
          description: Đã khôi phục
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RestoreResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CallerNotAllowed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /internal/v1/platform/tenant-assignments:
    get:
      tags: [platform-ops]
      operationId: listResourceAssignments
      summary: Liệt kê assignment active của một tài nguyên platform (gán cho tenant, ADR-0029)
      description: |
        Đọc `infra.tenant_resource_assignments` của module sở hữu tài nguyên cho một `(resource_type, resource_id)`.
        Chỉ module identity gọi khi trả `/api/v1/admin/tenant-assignments`; Principal gốc phải là nhân sự platform có
        `platform.tenant_data.assign`.
      x-allowed-callers: [identity]
      parameters:
        - name: resource_type
          in: query
          required: true
          schema: { $ref: '#/components/schemas/ResourceType' }
        - name: resource_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Một trang assignment active
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantAssignmentList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CallerNotAllowed' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /internal/v1/platform/tenant-assignments:apply:
    post:
      tags: [platform-ops]
      operationId: applyTenantAssignments
      summary: Gán một tài nguyên platform cho các tenant (tạo assignment active còn thiếu, ADR-0029)
      description: |
        Bước của luồng gán do module identity điều phối. Tài nguyên phải là `owner_scope = platform`, chưa soft-delete;
        mỗi tenant phải `active` trong `ref.tenants` của module nhận. Một phần tử lỗi → `422 VALIDATION_FAILED` liệt kê
        từng phần tử, không ghi gì. Cặp (tài nguyên, tenant) đã có assignment active không tạo dòng mới. Idempotent theo
        `Idempotency-Key`: gọi lại trả kết quả lần trước. Audit `tenant_data.assigned` (actor = Principal gốc) qua outbox chỉ cho
        tenant được gán mới. Mỗi phần tử trả `created` (true = lần gọi này tạo assignment, false = đã có từ trước) để module identity
        chỉ phát event `tenant_data.assigned` + audit cho thay đổi thật (F045 Clarifications 2026-11-28).
      x-allowed-callers: [identity]
      x-context-required: [idempotency_key]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TenantAssignmentApplyRequest' }
      responses:
        '200':
          description: Assignment active của tài nguyên cho các tenant yêu cầu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantAssignmentList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CallerNotAllowed' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /internal/v1/platform/tenant-assignments:revoke:
    post:
      tags: [platform-ops]
      operationId: revokeTenantAssignments
      summary: Gỡ gán một tài nguyên platform khỏi các tenant (soft-delete assignment, ADR-0028/0029)
      description: |
        Soft-delete assignment active của các tenant yêu cầu; tenant không còn thấy tài nguyên ở lần đọc kế tiếp, lượt
        học/attempt đã ghim version giữ nguyên. Tenant không có assignment active được bỏ qua. Idempotent theo
        `Idempotency-Key`. Audit `tenant_data.unassigned` (actor = Principal gốc) qua outbox.
      x-allowed-callers: [identity]
      x-context-required: [idempotency_key]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TenantAssignmentRevokeRequest' }
      responses:
        '200':
          description: Assignment đã gỡ (status `revoked`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantAssignmentList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CallerNotAllowed' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /internal/v1/platform/students/{student_id}:cleanup:
    post:
      tags: [platform-ops]
      operationId: cleanupStudentData
      summary: Soft-delete dữ liệu của học sinh trong module này khi bị dọn do không đăng nhập (ADR-0032)
      description: |
        Bước của saga dọn học sinh do module identity điều phối. Chỉ soft-delete (ADR-0028), đặt
        `delete_reason = inactive_cleanup`. Module trả `blocked` nếu học sinh đang có hoạt động không
        được dọn (trận đang chạy, bài kiểm tra chưa nộp, moderation case mở) để saga hủy và bù trừ.
      x-allowed-callers: [identity]
      x-context-required: [tenant_scope, idempotency_key]
      parameters:
        - $ref: '#/components/parameters/StudentIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StudentCleanupRequest' }
      responses:
        '200':
          description: Kết quả bước dọn
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudentLifecycleResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CallerNotAllowed' }
        '404': { $ref: '#/components/responses/NotFound' }

  /internal/v1/platform/students/{student_id}:restore:
    post:
      tags: [platform-ops]
      operationId: restoreStudentData
      summary: Khôi phục dữ liệu học sinh đã bị dọn khi học sinh đăng nhập lại (ADR-0032 mục 5)
      x-allowed-callers: [identity]
      x-context-required: [tenant_scope, idempotency_key]
      parameters:
        - $ref: '#/components/parameters/StudentIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StudentRestoreRequest' }
      responses:
        '200':
          description: Kết quả bước khôi phục
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudentLifecycleResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CallerNotAllowed' }
        '404': { $ref: '#/components/responses/NotFound' }

  /internal/v1/platform/users/{user_id}:merge-into:
    post:
      tags: [platform-ops]
      operationId: mergeUserData
      summary: Chuyển dữ liệu của một user sang user đích khi gộp tài khoản trùng (module identity điều phối)
      description: |
        Bước của saga gộp tài khoản (ACCOUNT_PROVISIONING §7b, IDENTITY_MAPPING). Module cập nhật mọi tham chiếu
        `user_id` nguồn sang `target_user_id` trong cùng tenant; bản ghi nguồn bị soft-delete (ADR-0028).
        Idempotent theo `merge_id`. Trả `blocked` nếu có xung đột không tự gộp được (vd. hai attempt cùng lúc).
      x-allowed-callers: [identity]
      x-context-required: [tenant_scope, idempotency_key]
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserMergeRequest' }
      responses:
        '200':
          description: Kết quả bước gộp
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserLifecycleResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CallerNotAllowed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /internal/v1/platform/users/{user_id}:anonymize:
    post:
      tags: [platform-ops]
      operationId: anonymizeUserData
      summary: Ẩn danh hóa dữ liệu cá nhân của user trong module này (yêu cầu xóa dữ liệu = ẩn danh hóa, ADR-0028 mục 8)
      description: |
        Ghi đè trường PII (tên hiển thị, nội dung tự do do user tạo, metadata thiết bị…) bằng giá trị ẩn danh,
        giữ bản ghi để thống kê và tính toàn vẹn. Không xóa dòng. Idempotent theo `erasure_request_id`.
      x-allowed-callers: [identity]
      x-context-required: [tenant_scope, idempotency_key]
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserAnonymizeRequest' }
      responses:
        '200':
          description: Kết quả bước ẩn danh hóa
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserLifecycleResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CallerNotAllowed' }
        '404': { $ref: '#/components/responses/NotFound' }

# Đối soát event liên module sau khôi phục một database (F134, BACKUP_RECOVERY §3.5): mọi module có database hiện thực
# hai operation chỉ đọc này; được chép vào cả 5 file `<module>.internal.v1.yaml` bởi scripts/openapi/sync-platform-ops.mjs
# (khối `ops-reconcile`). Chỉ trả ID event + metadata từ `infra.*` của database module (không `envelope`, không PII — R14).
x-ops-reconcile-paths:
  /internal/v1/ops/outbox-events:
    get:
      tags: [ops-reconcile]
      operationId: listOutboxEventIds
      summary: Liệt kê ID event trong `infra.outbox_events` của module này trong một cửa sổ thời gian (đối soát F134)
      description: |
        Gọi bởi lệnh `worker reconcile --module=<module được khôi phục>` (F134-AC-02) để so `processed_events` của module được
        khôi phục với outbox của module nguồn. Cửa sổ lọc theo thời điểm trong UUIDv7 của `event_id` (`from` ≤ t < `to`), sắp theo
        `event_id`; `event_types` (tùy chọn) thu hẹp loại event. Ngữ cảnh: PlatformScope của job (`tenancy.Bypass`
        lý do `platform_job`, có audit + metric). Không bao giờ trả `envelope`/payload.
      x-allowed-callers: [identity, learning, game, competition, chat]
      x-context-required: [tenant_scope]
      parameters:
        - $ref: '#/components/parameters/ReconcileFrom'
        - $ref: '#/components/parameters/ReconcileTo'
        - name: event_types
          in: query
          required: false
          description: Loại event cần liệt kê; vắng mặt = mọi loại (consumer đăng ký subject wildcard)
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 100
            items: { type: string, maxLength: 64, pattern: '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$' }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/ReconcileLimit'
      responses:
        '200':
          description: Một trang ID event của outbox
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OutboxEventIdPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CallerNotAllowed' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /internal/v1/ops/processed-events:
    get:
      tags: [ops-reconcile]
      operationId: listProcessedEventIds
      summary: Liệt kê ID event của một module nguồn mà consumer của module này đã xử lý hoặc đưa vào DLQ (đối soát F134)
      description: |
        Gọi bởi lệnh `worker reconcile --module=<module được khôi phục>` (F134-AC-01): trả danh sách consumer của module này đăng ký
        event của `source_module` (`consumers[]`, kèm loại event) và các dòng `infra.processed_events` (`status = processed`) cùng
        `infra.dead_letters` (`status = dead_lettered`) của các consumer đó, lọc theo thời điểm UUIDv7 của `event_id`, sắp theo
        `(consumer, event_id, status)`. Ngữ cảnh như `listOutboxEventIds`.
      x-allowed-callers: [identity, learning, game, competition, chat]
      x-context-required: [tenant_scope]
      parameters:
        - name: source_module
          in: query
          required: true
          schema: { $ref: '#/components/schemas/ReconcileModule' }
        - $ref: '#/components/parameters/ReconcileFrom'
        - $ref: '#/components/parameters/ReconcileTo'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/ReconcileLimit'
      responses:
        '200':
          description: Một trang ID event đã xử lý/DLQ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProcessedEventIdPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CallerNotAllowed' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }

components:
  parameters:
    ReconcileFrom:
      name: from
      in: query
      required: true
      description: Đầu cửa sổ (bao gồm), so với thời điểm UUIDv7 của `event_id`
      schema: { type: string, format: date-time }
    ReconcileTo:
      name: to
      in: query
      required: true
      description: Cuối cửa sổ (không bao gồm); `to − from` ≤ `outbox_retention`
      schema: { type: string, format: date-time }
    ReconcileLimit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 5000, default: 5000 }
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string, maxLength: 512 }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    JobIdPath:
      name: job_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    StudentIdPath:
      name: student_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserIdPath:
      name: user_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    TenantIdPath:
      name: tenant_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ResourceTypePath:
      name: resource_type
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ResourceType' }
    ResourceIdPath:
      name: resource_id
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: Request không hợp lệ
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: '`UNAUTHENTICATED` — context không có Principal hoặc scope hợp lệ (bên gọi không đi qua `pkg/modcall`); lỗi lập trình, không có token giữa module'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    CallerNotAllowed:
      description: Module gọi không nằm trong `x-allowed-callers` (`CALLER_NOT_ALLOWED`) hoặc Principal gốc thiếu quyền nghiệp vụ (`PERMISSION_DENIED`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Không tồn tại hoặc ngoài tenant
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Xung đột trạng thái (vd. unique khi khôi phục)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ValidationFailed:
      description: '`VALIDATION_FAILED` — vi phạm schema, gồm vượt `maxLength` (ADR-0041)'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    DependencyUnavailable:
      description: '`UNAVAILABLE` — database của module đích không sẵn sàng, lời gọi vượt deadline, hoặc hệ thống ngoài mà module đích phụ thuộc lỗi'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    ReconcileModule:
      type: string
      description: Module có database (ADR-0074); `realtime` không có database nên không bao giờ là nguồn/đích đối soát.
      enum: [identity, learning, game, competition, chat]
    OutboxEventId:
      type: object
      required: [event_id, event_type, created_at]
      properties:
        event_id: { type: string, format: uuid }
        event_type: { type: string, maxLength: 64 }
        tenant_id: { type: [string, 'null'], format: uuid }
        created_at: { type: string, format: date-time }
        published_at: { type: [string, 'null'], format: date-time, description: '`null` = relay chưa phát lên JetStream' }
    OutboxEventIdPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 5000
          items: { $ref: '#/components/schemas/OutboxEventId' }
        next_cursor: { type: [string, 'null'], maxLength: 512, description: '`null` = trang cuối' }
    ReconcileConsumer:
      type: object
      required: [consumer, event_types]
      properties:
        consumer: { type: string, maxLength: 128, description: 'Tên consumer `<module>.<handler>`' }
        event_types:
          type: array
          maxItems: 100
          description: Loại event của nguồn mà consumer đăng ký; `["*"]` = mọi loại (subject wildcard)
          items: { type: string, maxLength: 64 }
    ProcessedEventId:
      type: object
      required: [consumer, event_id, processed_at, status]
      properties:
        consumer: { type: string, maxLength: 128 }
        event_id: { type: string, format: uuid }
        processed_at: { type: string, format: date-time, description: 'Thời điểm xử lý (`processed`) hoặc vào DLQ (`dead_lettered`)' }
        status: { type: string, enum: [processed, dead_lettered] }
    ProcessedEventIdPage:
      type: object
      required: [consumers, items]
      properties:
        consumers:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/ReconcileConsumer' }
        items:
          type: array
          maxItems: 5000
          items: { $ref: '#/components/schemas/ProcessedEventId' }
        next_cursor: { type: [string, 'null'], maxLength: 512, description: '`null` = trang cuối' }
    Problem:
      type: object
      description: RFC 9457 Problem Details, dùng chung catalog mã lỗi với API public (API_DESIGN §4.1).
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri, maxLength: 2048 }
        title: { type: string, maxLength: 255 }
        status: { type: integer, minimum: 400, maximum: 599 }
        code: { type: string, maxLength: 64 }
        detail: { type: string, maxLength: 1000 }
        instance: { type: string, maxLength: 2048 }
        trace_id: { type: string, maxLength: 64 }
        errors:
          type: array
          maxItems: 100
          items:
            type: object
            required: [field, code]
            properties:
              field: { type: string, maxLength: 255 }
              code: { type: string, maxLength: 64 }
              message: { type: string, maxLength: 1000 }

    PageInfo:
      type: object
      required: [has_more]
      properties:
        next_cursor: { type: [string, 'null'], maxLength: 512 }
        has_more: { type: boolean }

    ResourceType:
      type: string
      description: Loại tài nguyên dùng chung cho Thùng rác, gán và clone — giữ đồng bộ với `ResourceType` của API public (eduworld-api.v1.yaml).
      enum: [curriculum, lesson, learning_material, question, question_set, assessment_blueprint, media, assignment, activity, challenge, challenge_template, tournament_template, quest, minigame_config, item, shop_item, event_template, sticker_pack, school_settings, tenant_settings]

    TenantCloneStepRequest:
      type: object
      required: [source_tenant_id, target_tenant_id, resource_type, resource_ids]
      properties:
        source_tenant_id: { type: string, format: uuid }
        target_tenant_id: { type: string, format: uuid }
        resource_type: { $ref: '#/components/schemas/ResourceType' }
        resource_ids:
          type: array
          minItems: 1
          maxItems: 500
          items: { type: string, format: uuid }
        id_map:
          type: object
          description: Ánh xạ ID nguồn → ID đích của các bước trước (để nối lại tham chiếu giữa module).
          maxProperties: 10000
          additionalProperties: { type: string, format: uuid }

    TenantCloneStepResult:
      type: object
      required: [job_id, resource_type, status, cloned]
      properties:
        job_id: { type: string, format: uuid }
        resource_type: { $ref: '#/components/schemas/ResourceType' }
        status: { type: string, enum: [completed, partially_failed, failed] }
        cloned:
          type: array
          maxItems: 10000
          items:
            type: object
            required: [source_id, target_id]
            properties:
              source_id: { type: string, format: uuid }
              target_id: { type: string, format: uuid }
        skipped:
          type: array
          maxItems: 10000
          items:
            type: object
            required: [source_id, reason]
            properties:
              source_id: { type: string, format: uuid }
              reason: { type: string, maxLength: 1000 }
        errors:
          type: array
          maxItems: 1000
          items: { $ref: '#/components/schemas/Problem' }

    TrashItem:
      type: object
      required: [resource_type, resource_id, deleted_at]
      properties:
        resource_type: { $ref: '#/components/schemas/ResourceType' }
        resource_id: { type: string, format: uuid }
        tenant_id: { type: [string, 'null'], format: uuid }
        title: { type: string, maxLength: 255 }
        deleted_at: { type: string, format: date-time }
        deleted_by: { type: [string, 'null'], format: uuid }
        delete_reason: { type: [string, 'null'], maxLength: 1000 }
        restorable: { type: boolean, description: 'false khi một bản ghi đang hoạt động đã giữ khóa unique của bản ghi này (khôi phục sẽ trả 409 CONFLICT, F020-AC-26)' }

    TrashPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/TrashItem' }
        page: { $ref: '#/components/schemas/PageInfo' }

    RestoreRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 3, maxLength: 1000 }

    RestoreResult:
      type: object
      required: [resource_type, resource_id, restored_at]
      properties:
        resource_type: { $ref: '#/components/schemas/ResourceType' }
        resource_id: { type: string, format: uuid }
        restored_at: { type: string, format: date-time }

    TenantAssignmentApplyRequest:
      type: object
      required: [resource_type, resource_id, tenant_ids]
      properties:
        resource_type: { $ref: '#/components/schemas/ResourceType' }
        resource_id: { type: string, format: uuid }
        tenant_ids:
          type: array
          minItems: 1
          maxItems: 500
          uniqueItems: true
          items: { type: string, format: uuid }

    TenantAssignmentRevokeRequest:
      type: object
      required: [resource_type, resource_id, tenant_ids, reason]
      properties:
        resource_type: { $ref: '#/components/schemas/ResourceType' }
        resource_id: { type: string, format: uuid }
        tenant_ids:
          type: array
          minItems: 1
          maxItems: 500
          uniqueItems: true
          items: { type: string, format: uuid }
        reason: { type: string, minLength: 3, maxLength: 1000 }

    TenantAssignment:
      type: object
      required: [assignment_id, resource_type, resource_id, tenant_id, assigned_by, assigned_at, status]
      properties:
        assignment_id: { type: string, format: uuid }
        resource_type: { $ref: '#/components/schemas/ResourceType' }
        resource_id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        assigned_by: { type: string, format: uuid }
        assigned_at: { type: string, format: date-time }
        status: { type: string, enum: [active, revoked] }
        revoked_at: { type: [string, 'null'], format: date-time }
        created:
          type: boolean
          description: |
            Chỉ `applyTenantAssignments`: `true` khi lần gọi này tạo assignment active cho tenant (chưa được gán hoặc đã gỡ trước đó),
            `false` khi tenant đã có assignment active từ trước (không đổi gì). Vắng mặt (list, revoke, kết quả lưu trước khi có trường này)
            = không rõ; bên gọi coi như đã thay đổi (F045 Clarifications 2026-11-28).

    TenantAssignmentList:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          maxItems: 500
          items: { $ref: '#/components/schemas/TenantAssignment' }
        page: { $ref: '#/components/schemas/PageInfo' }

    StudentCleanupRequest:
      type: object
      required: [cleanup_run_id, reason]
      properties:
        cleanup_run_id: { type: string, format: uuid }
        reason: { type: string, enum: [inactive_cleanup] }
        last_login_at: { type: [string, 'null'], format: date-time }

    StudentRestoreRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, enum: [student_logged_in_again, admin_restore] }

    StudentLifecycleResult:
      type: object
      required: [student_id, status]
      properties:
        student_id: { type: string, format: uuid }
        status: { type: string, enum: [done, blocked, nothing_to_do] }
        blocked_reason: { type: [string, 'null'], enum: [active_game_session, active_match, open_exam_attempt, open_moderation_case, null] }
        affected:
          type: array
          maxItems: 100
          items:
            type: object
            required: [resource_type, count]
            properties:
              resource_type: { $ref: '#/components/schemas/ResourceType' }
              count: { type: integer, minimum: 0 }

    UserMergeRequest:
      type: object
      required: [merge_id, target_user_id, reason]
      properties:
        merge_id: { type: string, format: uuid }
        target_user_id: { type: string, format: uuid }
        reason: { type: string, minLength: 3, maxLength: 1000 }

    UserAnonymizeRequest:
      type: object
      required: [erasure_request_id, reason]
      properties:
        erasure_request_id: { type: string, format: uuid }
        reason: { type: string, enum: [data_subject_request, retention_expired, legal_order] }

    UserLifecycleResult:
      type: object
      required: [user_id, status]
      properties:
        user_id: { type: string, format: uuid }
        status: { type: string, enum: [done, blocked, nothing_to_do] }
        blocked_reason: { type: [string, 'null'], maxLength: 1000 }
        affected:
          type: array
          maxItems: 100
          items:
            type: object
            required: [resource_type, count]
            properties:
              resource_type: { type: string, maxLength: 64 }
              count: { type: integer, minimum: 0 }

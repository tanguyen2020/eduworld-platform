          $ref: '#/components/schemas/Timestamp'
    DashboardGrain:
      type: string
      enum:
        - day
        - week
        - month
    GradeDashboard:
      allOf:
        - $ref: '#/components/schemas/DashboardMeta'
        - type: object
          required:
            - school_id
            - grade_level
            - generated_at
            - suppressed
            - students
          description: |
            Dashboard một khối của trường (SCHOOL_LMS §8.2–§8.3, ADR-0095) — không có cột XP, Game Rating, xếp hạng hay nội dung
            chat (F043-AC-11). `suppressed: true` khi khối có dưới `analytics_min_cell_size` học sinh (FR-ANL-016): số tổng hợp
            `null`, `objective_distribution` rỗng; `students` vẫn liệt kê học sinh của khối.
          properties:
            school_id:
              $ref: '#/components/schemas/Uuid'
            grade_level:
              $ref: '#/components/schemas/GradeLevel'
            subject_id:
              $ref: '#/components/schemas/Uuid'
            generated_at:
              $ref: '#/components/schemas/Timestamp'
            suppressed:
              type: boolean
              description: true khi ô khối < analytics_min_cell_size học sinh bị che
            student_count:
              type:
                - integer
                - 'null'
              minimum: 0
              description: Số học sinh hiệu lực của khối (null khi bị che)
            active_students_7d:
              type:
                - integer
                - 'null'
              minimum: 0
            assignments_open:
              type: integer
              minimum: 0
            accuracy:
              type:
                - number
                - 'null'
              minimum: 0
              maximum: 1
            rapid_guess_ratio:
              type:
                - number
                - 'null'
              minimum: 0
              maximum: 1
              description: Tỷ lệ câu trả lời "làm quá nhanh"
            assignment_completion_rate:
              type:
                - number
                - 'null'
              minimum: 0
              maximum: 1
              description: Bài giao đến hạn từ 14 ngày qua đã nộp / được giao
            assignments:
              type: array
              maxItems: 20
              items:
                $ref: '#/components/schemas/DashboardAssignmentProgress'
            objective_distribution:
              type: array
              maxItems: 500
              description: Heatmap khối × LO — phân bố mức mastery (not_started, beginning, developing, proficient, mastered)
              items:
                type: object
                properties:
                  objective_id:
                    $ref: '#/components/schemas/Uuid'
                  code:
                    type: string
                    maxLength: 64
                  yccd_ref:
                    type: string
                    maxLength: 64
                  students_with_evidence:
                    type: integer
                    minimum: 0
                  below_proficient_ratio:
                    type:
                      - number
                      - 'null'
                    minimum: 0
                    maximum: 1
                  level_counts:
                    type: object
                    additionalProperties:
                      type: integer
            students_needing_attention:
              type: array
              maxItems: 100
              items:
                type: object
                properties:
                  student_id:
                    $ref: '#/components/schemas/Uuid'
                  display_name:
                    type: string
                    maxLength: 128
                  reasons:
                    type: array
                    maxItems: 8
                    items:
                      $ref: '#/components/schemas/AttentionReason'
                  weak_objective_ids:
                    type: array
                    items:
                      $ref: '#/components/schemas/Uuid'
            students:
              type: object
              required:
                - data
                - page
              description: Học sinh hiệu lực của khối, phân trang cursor (≤ dashboard_page_size_max)
              properties:
                data:
                  type: array
                  maxItems: 100
                  items:
                    type: object
                    required:
                      - student_id
                    properties:
                      student_id:
                        $ref: '#/components/schemas/Uuid'
                      activities_completed:
                        type: integer
                        minimum: 0
                      lessons_completed:
                        type: integer
                        minimum: 0
                      accuracy:
                        type:
                          - number
                          - 'null'
                        minimum: 0
                        maximum: 1
                      active_minutes:
                        type: integer
                        minimum: 0
                      rapid_guess_ratio:
                        type:
                          - number
                          - 'null'
                        minimum: 0
                        maximum: 1
                      rapid_guess_flag:
                        type: boolean
                        description: true khi tỷ lệ "làm quá nhanh" ≥ ngưỡng của dashboard_attention_thresholds
                      reasons:
                        type: array
                        maxItems: 8
                        items:
                          $ref: '#/components/schemas/AttentionReason'
                page:
                  $ref: '#/components/schemas/PageInfo'
    DashboardMeta:
      type: object
      required:
        - grain
        - data_as_of
        - is_partial
      description: Siêu dữ liệu bắt buộc của mọi phản hồi dashboard (DASHBOARD_DATA §8)
      properties:
        grain:
          $ref: '#/components/schemas/DashboardGrain'
        data_as_of:
          $ref: '#/components/schemas/Timestamp'
          description: '`computed_at` cũ nhất trong kết quả'
        is_partial:
          type: boolean
          description: true nếu có dòng chưa chốt (`is_final = false`, ví dụ hôm nay)
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        available_from:
          type:
            - string
            - 'null'
          format: date
          description: Ngày sớm nhất có số liệu (rollup ngày) của phạm vi trả lời — trường/lớp được hỏi, cả tenant ở tóm tắt tenant; `null` khi phạm vi chưa có số liệu hoặc ở tóm tắt platform. Khi sau `from`, portal hiện "Chưa có số liệu trước ngày …" (F043 T042, F056-AC-02).
        replica_lag_warning:
          type: boolean
          description: 'true khi độ trễ của read replica dashboard vượt `dashboard_replica_lag_alert_seconds` (CONFIG_DEFAULTS, DASHBOARD_DATA §7): số liệu vẫn trả kèm `data_as_of`, không đọc primary; phản hồi có cờ này không được cache (F043 T042).'
    DashboardAssignmentProgress:
      type: object
      required:
        - assignment_id
        - title
        - due_at
        - status
        - submitted
        - total
      description: Tiến độ một bài giao đang mở/sắp hạn (read model trạng thái `assignment_submissions`, SCHOOL_LMS §8.1)
      properties:
        assignment_id:
          $ref: '#/components/schemas/Uuid'
        title:
          type: string
          maxLength: 120
        subject_id:
          $ref: '#/components/schemas/Uuid'
        due_at:
          $ref: '#/components/schemas/Timestamp'
        status:
          type: string
          enum:
            - scheduled
            - open
            - closed
            - results_released
        submitted:
          type: integer
          minimum: 0
          description: Học sinh đã nộp (đúng hạn hoặc muộn) — tổng các ô khối hiển thị
        total:
          type: integer
          minimum: 0
          description: Học sinh được giao (trừ được miễn) — tổng các ô khối hiển thị
        not_started:
          type: integer
          minimum: 0
        missed:
          type: integer
          minimum: 0
        by_grade:
          type: array
          maxItems: 10
          description: Theo khối của học sinh lúc được giao (ADR-0095); ô có dưới analytics_min_cell_size học sinh bị che (số đếm null, suppressed, che bổ sung trong bài giao — FR-ANL-016); 0 = khối chưa xác định
          items:
            type: object
            required:
              - grade_level
              - suppressed
            properties:
              grade_level:
                type: integer
                minimum: 0
                maximum: 9
              submitted:
                type:
                  - integer
                  - 'null'
                minimum: 0
              total:
                type:
                  - integer
                  - 'null'
                minimum: 0
              not_started:
                type:
                  - integer
                  - 'null'
                minimum: 0
              missed:
                type:
                  - integer
                  - 'null'
                minimum: 0
              suppressed:
                type: boolean
    AttentionReason:
      type: string
      maxLength: 64

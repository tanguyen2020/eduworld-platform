                  - added
                  - removed
                  - changed
              before:
                description: Giá trị cũ (answer_key chỉ trả khi có quyền review)
              after:
                description: Giá trị mới
    PublishRequest:
      type: object
      properties:
        publish_at:
          description: Hẹn giờ xuất bản (UTC); bỏ trống = xuất bản ngay
          $ref: '#/components/schemas/Timestamp'
        change_note:
          type: string
          maxLength: 500
    ContentRelease:
      type: object
      required:
        - release_id
        - item_type
        - item_id
        - action
        - released_by
        - released_at
      properties:
        release_id:
          $ref: '#/components/schemas/Uuid'
        item_type:
          type: string
          maxLength: 64
        item_id:
          $ref: '#/components/schemas/Uuid'
        action:
          type: string
          enum:
            - publish
            - rollback
            - unpublish
        from_version:
          type: integer
          minimum: 1
        to_version:
          type: integer
          minimum: 1
        reason:
          type: string
          maxLength: 500
        scheduled_for:
          $ref: '#/components/schemas/Timestamp'
        status:
          type: string
          enum:
            - scheduled
            - applied
            - cancelled
            - failed
        failure_code:
          type: string
          maxLength: 64
          description: Mã lỗi guard khi lịch hẹn không áp dụng được
        released_by:
          $ref: '#/components/schemas/Uuid'
        released_at:
          $ref: '#/components/schemas/Timestamp'
    RollbackRequest:
      type: object
      required:
        - to_version
        - reason
      properties:
        to_version:
          type: integer
          minimum: 1
          description: Số version đã publish của chính item (ROLLBACK_TARGET_INVALID nếu không hợp lệ)
        reason:
          type: string
          minLength: 1
          maxLength: 500
    ReasonRequest:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string

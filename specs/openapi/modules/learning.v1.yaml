            type: object
            additionalProperties: false
            required:
              - latex
              - speech_text
            properties:
              latex:
                type: string
                minLength: 1
                maxLength: 2000
              svg:
                type: string
                maxLength: 262144
                description: SVG ≤ 256 KB (math_svg_max), chỉ gửi lên
              svg_asset:
                type: string
                maxLength: 128

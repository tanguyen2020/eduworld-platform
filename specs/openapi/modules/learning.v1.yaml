          type: string
          enum:
            - platform
            - tenant
          default: tenant
        type:
          $ref: '#/components/schemas/QuestionType'
        stem:
          type: object
          additionalProperties: true
          maxProperties: 4
          description: richContent (question.schema.json#/$defs/richContent)
        render_payload:
          type: object
          additionalProperties: true
          maxProperties: 16
        answer_key:
          type: object
          additionalProperties: true
          maxProperties: 16
        scoring_rule:
          type: object
          additionalProperties: true
          maxProperties: 8
        explanation:
          type: object
          additionalProperties: true
          maxProperties: 4
          description: richContent
        hints:
          type: array
          maxItems: 5
          description: Gợi ý theo cấp (richContent), chỉ server
          items:
            type: object
            additionalProperties: true
            maxProperties: 4

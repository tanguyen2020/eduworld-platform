  /cms/learning/content/{content_type}/{content_id}/versions/{version}:transition:
    post:
      x-service: learning
      tags:
        - cms
      operationId: transitionContentVersion
      x-portal-action:
        param: content_type
        map:
          lesson: action.content_studio.lessons.workflow
          learning_material: action.content_studio.lessons.workflow
          activity: action.content_studio.activities.workflow
          question: action.content_studio.question_bank.workflow
          question_set: action.content_studio.question_sets.workflow
          assessment_blueprint: action.content_studio.assessments.workflow
          learning_path: action.content_studio.learning_paths.workflow
      summary: Workflow Draft → Review → Approved → Published → Archived
      parameters:
        - $ref: '#/components/parameters/TenantIdHeaderOptional'
        - $ref: '#/components/parameters/LearningContentType'
        - name: content_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
        - $ref: '#/components/parameters/Version'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - action
              additionalProperties: false
              properties:
                action:
                  type: string
                  enum:
                    - submit_review
                    - approve
                    - reject
                    - revise
                    - archive
                  description: |
                    CONTENT_MODEL §6 (F025): submit_review, revise (rejected/approved → draft) cần learning_content.write; approve, reject cần
                    learning_content.review (activity: learning_content.activity.write/review); reviewer ≠ author (403 PERMISSION_DENIED);
                    reject bắt buộc note. archive do F026. Publish/rollback/unpublish dùng endpoint riêng (:publish, :rollback, :unpublish — ADR-0043)
                note:
                  type: string
                  maxLength: 2000
                audio_exemption_acknowledged:
                  type: boolean
                  description: Bắt buộc true khi approve version có audio_exempt_reason (CONTENT_MODEL §8.1, F025-AC-16); thiếu → 422 VALIDATION_FAILED
      responses:
        '200':
          description: Trạng thái mới
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentVersion'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          description: VALIDATION_FAILED (schema/metadata, JSON pointer trong errors[]), MEDIA_NOT_READY (asset_ids), AUDIO_REQUIRED (field thiếu), TRANSLATION_INCOMPLETE (JSON pointer), INVALID_STATE_TRANSITION
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
        '428':
          $ref: '#/components/responses/PreconditionRequired'

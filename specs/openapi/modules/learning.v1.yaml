          minimum: 1
        content_version_id:
          $ref: '#/components/schemas/Uuid'
        status:
          $ref: '#/components/schemas/ContentStatus'
        is_current:
          type: boolean
          description: true nếu là con trỏ release hiện hành
        change_note:
          type: string
          maxLength: 500
        author_id:
          $ref: '#/components/schemas/Uuid'
        reviewer_id:
          $ref: '#/components/schemas/Uuid'
        published_by:
          $ref: '#/components/schemas/Uuid'
        published_at:
          $ref: '#/components/schemas/Timestamp'
        publish_at:
          $ref: '#/components/schemas/Timestamp'
        active_pinned_sessions:

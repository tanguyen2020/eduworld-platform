      x-service: learning
      tags:
        - cms
      operationId: searchQuestions
      x-portal-action: action.content_studio.question_bank.view
      summary: Tìm kiếm question bank (version mới nhất của mỗi câu) theo môn, khối, chủ đề, LO, độ khó, trạng thái, loại, nguồn (learning_content.read)
      parameters:
        - $ref: '#/components/parameters/TenantIdHeaderOptional'
        - name: q
          in: query
          description: Tìm full-text — F024 (bỏ qua ở F022)
          schema:
            type: string
            maxLength: 200
        - $ref: '#/components/parameters/SubjectIdQuery'
        - $ref: '#/components/parameters/GradeLevelQuery'
        - name: topic_id
          in: query
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: objective_id
          in: query
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: difficulty
          in: query
          style: form
          explode: true
          schema:
            type: array
            maxItems: 5
            items:
              type: integer
              minimum: 1
              maximum: 5
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ContentStatus'
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/QuestionType'
        - name: source
          in: query
          description: own = dữ liệu của tenant; assigned = dữ liệu platform được gán cho tenant (chỉ đọc); platform = dữ liệu platform (chỉ role platform)
          schema:
            type: string
            enum:
              - own
              - assigned
              - platform
        - name: efficacy_instrument
          in: query
          description: Lọc câu đo hiệu quả (F035; chỉ có ở dữ liệu platform)
          schema:
            type: boolean
        - $ref: '#/components/parameters/TenantIds'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - page
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/QuestionAuthoring'
                  page:
                    $ref: '#/components/schemas/PageInfo'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      x-service: learning
      tags:
        - cms
      operationId: createQuestion
      x-portal-action: action.content_studio.question_bank.edit
      summary: Tạo question (version 1, draft)
      parameters:
        - $ref: '#/components/parameters/TenantIdHeaderOptional'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestionAuthoringInput'
      responses:
        '201':
          description: Question + version 1 (draft)
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionAuthoring'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'

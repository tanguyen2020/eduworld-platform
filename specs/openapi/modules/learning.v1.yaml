        map:
          lesson: action.content_studio.lessons.workflow
          learning_material: action.content_studio.lessons.workflow
          activity: action.content_studio.activities.workflow
          question: action.content_studio.question_bank.workflow
          question_set: action.content_studio.question_sets.workflow
          assessment_blueprint: action.content_studio.assessments.workflow
      summary: Workflow Draft → Review → Approved → Published → Archived
      parameters:
        - $ref: '#/components/parameters/TenantIdHeaderOptional'
        - $ref: '#/components/parameters/LearningContentType'
        - name: content_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
        - $ref: '#/components/parameters/Version'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - action
              additionalProperties: false
              properties:
                action:
                  type: string
                  enum:
                    - submit_review
                    - approve
                    - reject
                    - revise
                    - archive
                  description: |
                    CONTENT_MODEL §6 (F025): submit_review, revise (rejected/approved → draft) cần learning_content.write; approve, reject cần
                    learning_content.review (activity: learning_content.activity.write/review); reviewer ≠ author (403 PERMISSION_DENIED);
                    reject bắt buộc note. archive do F026. Publish/rollback/unpublish dùng endpoint riêng (:publish, :rollback, :unpublish — ADR-0043)
                note:
                  type: string
                  maxLength: 2000
                audio_exemption_acknowledged:
                  type: boolean
                  description: Bắt buộc true khi approve version có audio_exempt_reason (CONTENT_MODEL §8.1, F025-AC-16); thiếu → 422 VALIDATION_FAILED
                field_comments:
                  type: array
                  maxItems: 50
                  description: Nhận xét theo trường của người duyệt (OQ F054-1, F025 T046); chỉ nhận với action reject (khác → 422 VALIDATION_FAILED). Lưu cùng review task và lịch sử transition, trả trong ContentReviewTask và ContentVersionSummary
                  items:
                    $ref: '#/components/schemas/ReviewFieldComment'
      responses:
        '200':
          description: Trạng thái mới
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:

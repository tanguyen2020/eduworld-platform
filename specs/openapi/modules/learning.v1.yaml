components:
  parameters:
    TenantIdHeader:
      name: X-Tenant-Id
      in: header
      required: true
      description: |
        Tenant của phiên (ADR-0065). Lấy từ `PlayerBootstrap.tenant_id` (game) hoặc tenant đã chọn sau đăng nhập portal (`GET /me/tenants`).
        Gateway trả `400 TENANT_HEADER_REQUIRED` khi thiếu, `400 BAD_REQUEST` khi sai định dạng; backend kiểm tra khớp token + membership,
        lệch → `403 TENANT_MISMATCH`. `Principal.tenant_id` lấy từ kết quả kiểm tra, không lấy thẳng từ header.
      schema:
        $ref: '#/components/schemas/Uuid'
    StudentId:
      name: student_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    SubjectIdQuery:
      name: subject_id
      in: query
      schema:
        $ref: '#/components/schemas/Uuid'
    GradeLevelQuery:
      name: grade_level
      in: query
      schema:
        $ref: '#/components/schemas/GradeLevel'
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: Ngôn ngữ hiển thị mong muốn (`vi-VN` mặc định, `en-US`). Server chọn ngôn ngữ trả về và đặt `Content-Language` (ADR-0056). Dữ liệu cache dài (manifest, snapshot) luôn trả đủ vi+en.
      schema:
        type: string
        maxLength: 64
        examples:
          - vi-VN
          - en-US
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      description: Cursor opaque từ page.next_cursor
      schema:
        type: string
        maxLength: 512
    ObjectiveIdPath:
      name: objective_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    LessonIdPath:
      name: lesson_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        UUIDv7 do client sinh cho mỗi thao tác (ADR-0010, ADR-0089 §4); timestamp trong key lệch quá `idempotency_record_ttl`
        (24 h) so với giờ server hoặc key không phải UUIDv7 → `400 BAD_REQUEST`. Bản ghi giữ trong `idempotency_record_ttl`;
        gửi lại cùng key + cùng body → response đã lưu kèm `Idempotent-Replayed: true`; khác body → `409 IDEMPOTENCY_KEY_REUSED`.
      schema:
        type: string
        format: uuid
        pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
    ExamSessionId:
      name: exam_session_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ExamDeviceToken:
      name: X-Exam-Device-Token
      in: header
      required: false
      description: Token thiết bị đang làm đề do client sinh cho mỗi bản cài (lưu băm ở server, EXAM_ENGINE §12); một attempt đề chỉ có một thiết bị active (F042-AC-14).
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: ^[A-Za-z0-9._~-]+$
    AttemptId:
      name: attempt_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        maxLength: 512
    TenantIdHeaderOptional:
      name: X-Tenant-Id
      in: header
      required: false
      description: |
        Người dùng tenant: **bắt buộc** (thiếu → `400 TENANT_HEADER_REQUIRED`). Role platform (System Admin, content_admin…):
        vắng mặt = phạm vi platform / đọc liên tenant bằng `tenant_ids`; có giá trị = tenant đích của thao tác ghi (ADR-0027, ADR-0065).
        Có giá trị thì luôn được kiểm tra như `TenantIdHeader`.
      schema:
        $ref: '#/components/schemas/Uuid'
    ContentLanguageFilter:
      name: content_language
      in: query
      description: Lọc theo ngôn ngữ gốc của version mới nhất (OQ F054-2, F024 T041)
      schema:
        $ref: '#/components/schemas/ContentLanguage'
    TranslationStatusFilter:
      name: translation_status
      in: query
      description: Lọc theo trạng thái bản dịch của version mới nhất (OQ F054-2, F024 T041)
      schema:
        $ref: '#/components/schemas/TranslationStatus'
    TenantIds:
      name: tenant_ids
      in: query
      required: false
      description: |
        Chỉ System Admin (platform.cross_tenant.read): lọc theo một hoặc nhiều tenant; vắng mặt = tất cả tenant.
        Người dùng tenant gửi tham số này bị bỏ qua (luôn khóa vào tenant của phiên) — ADR-0027 §6.
      style: form
      explode: true
      schema:
        type: array
        maxItems: 100
        items:
          $ref: '#/components/schemas/Uuid'
    QuestionIdPath:
      name: question_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    Version:
      name: version
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    LearningContentType:
      name: content_type
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/LearningContentType'
    ContentIdPath:
      name: content_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ProposalIdPath:
      name: proposal_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ImportIdPath:
      name: import_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    CurriculumIdPath:
      name: curriculum_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    SubjectIdPath:
      name: subject_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    TopicIdPath:
      name: topic_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    SectionIdPath:
      name: section_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    QuestionSetIdPath:
      name: question_set_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    BlueprintIdPath:
      name: assessment_blueprint_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    LearningMaterialIdPath:
      name: learning_material_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    AssetIdPath:
      name: asset_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    AssignmentIdPath:
      name: assignment_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    SchoolId:
      name: school_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ReportIdPath:
      name: report_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    DashboardFrom:
      name: from
      in: query
      required: true
      description: Ngày bắt đầu (bao gồm, theo múi giờ tenant). Khoảng `from`–`to` tối đa 730 ngày (`dashboard_max_range_days`) — vượt → `422 DASHBOARD_RANGE_TOO_LARGE` (DASHBOARD_DATA §8).
      schema:
        type: string
        format: date
    DashboardTo:
      name: to
      in: query
      required: true
      description: Ngày kết thúc (bao gồm). Phải ≥ `from`.
      schema:
        type: string
        format: date
    DashboardGrain:
      name: grain
      in: query
      required: false
      description: |
        Độ hạt **gợi ý**; server quyết định theo khoảng (≤ 31 ngày → day; 32 ngày–1 năm → week; > 1 năm → month) và chỉ chấp nhận
        độ hạt **thô hơn** quy tắc, không mịn hơn (DASHBOARD_DATA §8). Phản hồi luôn trả `grain` thực dùng.
      schema:
        $ref: '#/components/schemas/DashboardGrain'
    DashboardPageSize:
      name: page_size
      in: query
      required: false
      description: |
        Số dòng của danh sách chi tiết (phân trang cursor — DASHBOARD_DATA §8). Giá trị lớn hơn `dashboard_page_size_max` (100)

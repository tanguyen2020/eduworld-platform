                      - grade_level
                      - suppressed
                    properties:
                      grade_level:
                        $ref: '#/components/schemas/GradeLevel'
                      students:
                        type:
                          - integer
                          - 'null'
                        minimum: 0
                      active_students:
                        type:
                          - integer
                          - 'null'
                        minimum: 0
                      accuracy:
                        type:
                          - number
                          - 'null'
                        minimum: 0
                        maximum: 1
                      assignment_completion_rate:
                        type:
                          - number
                          - 'null'
                        minimum: 0
                        maximum: 1
                      suppressed:
                        type: boolean
                weak_objectives:
                  type: array
                  maxItems: 20
                  items:
                    type: object
                    required:
                      - objective_id
                      - code
                    properties:
                      objective_id:
                        $ref: '#/components/schemas/Uuid'
                      code:
                        type: string
                        maxLength: 64
                      yccd_ref:
                        type: string
                        maxLength: 64
                      below_proficient_ratio:
                        type: number
                        minimum: 0
                        maximum: 1
                      grade_levels:
                        type: array
                        maxItems: 9
                        description: Khối hiển thị có từ 50% học sinh trở lên dưới mức thành thạo
                        items:
                          $ref: '#/components/schemas/GradeLevel'
                students_needing_attention:
                  type: array
                  maxItems: 100
                  items:
                    type: object
                    required:
                      - student_id
                      - reasons
                    properties:
                      student_id:
                        $ref: '#/components/schemas/Uuid'
                      display_name:
                        type: string
                        maxLength: 128
                      grade_level:
                        $ref: '#/components/schemas/GradeLevel'
                      reasons:
                        type: array
                        maxItems: 8
                        items:
                          $ref: '#/components/schemas/AttentionReason'
                students_needing_attention_total:
                  type: integer
                  minimum: 0

                  type: integer
                  minimum: 0
                  description: Bài đang mở có hạn trong 48 giờ tới
                assignment_completion_rate:
                  type:
                    - number
                    - 'null'
                  minimum: 0
                  maximum: 1
                accuracy:
                  type:
                    - number
                    - 'null'
                  minimum: 0
                  maximum: 1
                rapid_guess_ratio:
                  type:
                    - number
                    - 'null'
                  minimum: 0
                  maximum: 1
                  description: Tỷ lệ câu trả lời "làm quá nhanh" (rapid_guess)
                safety_notifications_unacknowledged:
                  type:
                    - integer
                    - 'null'
                  minimum: 0

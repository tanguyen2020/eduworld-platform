                        - number
                        - 'null'
                      minimum: 0
                      maximum: 1
                      description: Tỷ lệ gợi ý 7 ngày qua được học sinh bắt đầu
                    objectives_improved_after_recommendation:
                      type: integer
                      minimum: 0
                      description: Số LO lên mức trong 14 ngày sau gợi ý (28 ngày qua)
    AnalyticsPoint:

          description: Cùng shape AssignmentCreate.late_policy; client chỉ dùng để hiện nhãn quá hạn, server quyết định có cho nộp muộn
          properties:
            allow_late:
              type: boolean
            late_window_hours:
              type: integer
              minimum: 0
              maximum: 168
    ActivityDefinition:
      type: object
      required:
        - activity_id
        - activity_type
        - title
        - status
        - version
      properties:
        activity_id:
          $ref: '#/components/schemas/Uuid'
        activity_version_id:
          $ref: '#/components/schemas/Uuid'
        version:
          type: integer
          minimum: 1
        activity_type:
          $ref: '#/components/schemas/ActivityType'
        title:
          $ref: '#/components/schemas/LearningName'
        status:
          $ref: '#/components/schemas/ContentStatus'
        owner_scope:
          type: string
          enum:
            - platform
            - tenant
        tenant_id:
          $ref: '#/components/schemas/Uuid'
        grade_levels:
          type: array
          maxItems: 9
          items:
            $ref: '#/components/schemas/GradeLevel'
        subject_id:
          $ref: '#/components/schemas/Uuid'
        objective_ids:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/Uuid'
        difficulty:
          type: integer
          minimum: 1
          maximum: 5
        config:
          type: object
          additionalProperties: true
        current_published_version:
          type:
            - integer
            - 'null'
          minimum: 1
        updated_at:
          $ref: '#/components/schemas/Timestamp'
        content_language:
          $ref: '#/components/schemas/ContentLanguage'
        translation_status:
          $ref: '#/components/schemas/TranslationStatus'
          readOnly: true
        description:
          $ref: '#/components/schemas/LearningText'
        instructions:
          $ref: '#/components/schemas/LearningText'
        instructions_audio_ref:
          $ref: '#/components/schemas/Uuid'
          description: Audio đọc hướng dẫn (bản content_language), bắt buộc khi grade_levels giao {1,2,3} trừ khi có audio_exempt_reason — 422 AUDIO_REQUIRED khi gửi duyệt (CONTENT_MODEL §8.1, F058-AC-09)
        audio_exempt_reason:
          type: string
          maxLength: 255
          description: Miễn trừ audio hướng dẫn nhóm g1_3 (CONTENT_MODEL §8.1); người duyệt xác nhận khi duyệt
        topic_id:
          $ref: '#/components/schemas/Uuid'
        time_limit_seconds:
          type: integer
          minimum: 1
        reward_rule_id:
          $ref: '#/components/schemas/Uuid'
        math_assets:
          type: array
          maxItems: 200
          description: Công thức đã lưu của version (Activity Builder F058 sửa lại không mất SVG)
          items:
            type: object
            required:
              - math_id
              - latex
              - svg
            properties:
              math_id:
                type: string
                maxLength: 64
              latex:
                type: string
                maxLength: 2000
              svg:
                type: string
                maxLength: 262144
              speech_text:
                type: string
                maxLength: 1000
              display:
                type: string
                enum:
                  - inline
                  - block
        author_id:
          $ref: '#/components/schemas/Uuid'
          description: Tác giả version (portal ẩn Duyệt với chính tác giả
          F058-AC-12): null
        assigned:
          type: boolean
          description: Nội dung platform được gán cho tenant phiên — chỉ đọc "Từ EduWorld" (F058-AC-27)
    ActivityDefinitionInput:
      type: object
      required:
        - activity_type
        - title
        - grade_levels
        - subject_id
        - objective_ids
        - config
        - content_language
      properties:
        activity_type:
          $ref: '#/components/schemas/ActivityType'
        title:
          $ref: '#/components/schemas/LearningName'
        description:
          $ref: '#/components/schemas/LearningText'
        instructions:
          $ref: '#/components/schemas/LearningText'
        instructions_audio_ref:
          $ref: '#/components/schemas/Uuid'
          description: Audio đọc hướng dẫn (bản content_language), bắt buộc khi grade_levels giao {1,2,3} trừ khi có audio_exempt_reason — 422 AUDIO_REQUIRED khi gửi duyệt (CONTENT_MODEL §8.1, F058-AC-09)
        audio_exempt_reason:
          type: string
          maxLength: 255
          description: Miễn trừ audio hướng dẫn nhóm g1_3 (CONTENT_MODEL §8.1); chuỗi rỗng xóa
        grade_levels:
          type: array
          minItems: 1
          maxItems: 9
          items:
            $ref: '#/components/schemas/GradeLevel'
        subject_id:
          $ref: '#/components/schemas/Uuid'
        topic_id:
          $ref: '#/components/schemas/Uuid'
        objective_ids:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/Uuid'
        difficulty:
          type: integer
          minimum: 1
          maximum: 5
        time_limit_seconds:
          type: integer
          minimum: 1
        reward_rule_id:
          $ref: '#/components/schemas/Uuid'
        tenant_id:
          $ref: '#/components/schemas/Uuid'
          description: Tenant đích khi System Admin tạo (ADR-0027); null = nội dung platform
        config:
          type: object
          description: content/interaction/evaluation/feedback/scoring/completion_rule theo specs/schemas/activities/<type>.schema.json (ACTIVITY_CONFIG_INVALID)
          additionalProperties: true
        math_assets:
          type: array
          maxItems: 200
          description: SVG + speech text do portal render bằng MathJax 4 (ADR-0055); server sanitize, thiếu → MATH_RENDER_FAILED
          items:
            type: object
            required:
              - math_id
              - latex
              - svg
            properties:
              math_id:
                type: string
                maxLength: 64
              latex:
                type: string
                maxLength: 2000
              svg:
                type: string
                maxLength: 262144
                description: SVG ≤ 256 KB
              speech_text:
                type: string
                maxLength: 1000
              display:
                type: string
                enum:
                  - inline
                  - block
        content_language:
          $ref: '#/components/schemas/ContentLanguage'
    ActivityTypeInfo:
      type: object
      description: Mỗi loại đã đăng ký trong Activity Registry (F030); min_client_version bắt buộc (registry khai báo cho mọi loại)
      required:
        - activity_type
        - schema_url
        - evaluation_strategies
        - min_client_version
        - status
      properties:
        activity_type:
          $ref: '#/components/schemas/ActivityType'
        label:
          type: string
          maxLength: 128
        schema_url:
          type: string
          maxLength: 2048
          description: Đường dẫn JSON Schema cấu hình của loại
        schema_version:
          type: integer
          minimum: 1
        evaluation_strategies:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/EvaluationStrategy'
        min_client_version:
          type: string
          maxLength: 32
        status:
          type: string
          enum:
            - enabled
            - preview
            - disabled
    EvaluationStrategy:
      type: string
      description: Chỉ chấm tự động (ADR-0072)
      enum:
        - auto
        - exact
        - accepted_answers
        - rule
        - numeric_tolerance
        - completion
        - deterministic_check
    SimulationTemplate:
      type: object
      required:
        - template_code
        - template_version
        - title
        - parameter_schema
      properties:
        template_code:
          type: string
          maxLength: 64
        template_version:
          type: integer
          minimum: 1
        title:
          type: string
          maxLength: 255
        simulation_kind:
          type: string
          enum:
            - science_simulation
            - physics
            - geometry_3d
            - virtual_lab
            - interactive_experiment
          description: Cùng enum với simulation.schema.json (F066 T004)
        parameter_schema:
          type: object
          description: JSON Schema tham số mà CMS được phép cấu hình (không có script, ADR-0052)
          additionalProperties: true
        actions:
          type: array
          maxItems: 50
          items:
            type: object
            required:
              - action
            properties:
              action:
                type: string
                maxLength: 64
              args_schema:
                type: object
                additionalProperties: true
        metrics:
          type: array
          maxItems: 50
          items:
            type: object
            required:
              - metric
            properties:
              metric:
                type: string
                maxLength: 64
              unit:
                type: string
                maxLength: 16
              display:
                type: boolean
        checker_available:
          type: boolean
        status:
          type: string
          enum:
            - active
            - retired
        min_client_version:
          type: string
          maxLength: 32
  responses:
    Unauthenticated:
      description: Thiếu/sai/hết hạn token (UNAUTHENTICATED)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: PERMISSION_DENIED, FEATURE_DISABLED (action/menu portal đang tắt, có `feature_key` — ADR-0090), GAME_ACCESS_STUDENT_ONLY, POLICY_DENIED, TENANT_NOT_SELECTED, TENANT_MISMATCH, TENANT_ACCESS_DISABLED, RESOURCE_NOT_ASSIGNED, ACCOUNT_LOCKED, ACCOUNT_DEACTIVATED, ACCOUNT_NOT_PROVISIONED, NO_ACTIVE_ENROLLMENT, ACCESS_OUTSIDE_ALLOWED_HOURS, CURFEW_ACTIVE, DAILY_PLAY_LIMIT_REACHED, PARTY_NOT_LEADER, PARTY_INVITE_NOT_ALLOWED, PARTY_POLICY_VIOLATION, CHAT_NOT_ALLOWED, CHAT_KIND_NOT_ALLOWED, CHAT_MUTED, TENANT_TOGGLE_NOT_ALLOWED, MODERATION_SWITCH_SELF_APPROVAL, PORTAL_ACCESS_STAFF_ONLY, HINTS_NOT_ALLOWED
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Không tồn tại hoặc ngoài tenant scope (NOT_FOUND)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Xung đột trạng thái (vd. CONTENT_VERSION_CONFLICT, CONTENT_NOT_PUBLISHED, SIS_SCHOOL_ALREADY_CONNECTED, SIS_SYNC_ALREADY_RUNNING, SIS_CONNECTION_NOT_ACTIVE, ATTEMPT_ALREADY_SUBMITTED, EXAM_ALREADY_SUBMITTED, PARTY_ALREADY_IN_PARTY, PARTY_FULL, MM_TICKET_ALREADY_ACTIVE, IDEMPOTENCY_KEY_REUSED, IDENTITY_CONFLICT, USERNAME_TAKEN, EMAIL_TAKEN, HINTS_EXHAUSTED, ASSIGNMENT_NOT_EDITABLE, MODERATION_CASE_CLOSED, CHAT_CHANNEL_CLOSED)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationFailed:
      description: VALIDATION_FAILED, SIS_CONTRACT_VERSION_UNSUPPORTED, ATTEMPT_DEADLINE_PASSED, INVALID_STATE_TRANSITION, MODERATION_SWITCH_REASON_REQUIRED, SENSITIVE_TERM_INVALID, SENSITIVE_CATALOG_REGRESSION_FAILED, DASHBOARD_RANGE_TOO_LARGE, ROLE_NOT_FOUND; sub-code `errors[].code = PERMISSION_NOT_ALLOWED_FOR_SCOPE` khi role tenant chứa permission platform
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
    PreconditionRequired:
      description: IDEMPOTENCY_KEY_REQUIRED hoặc PRECONDITION_REQUIRED
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailed:
      description: VERSION_MISMATCH
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PayloadTooLarge:
      description: MEDIA_TOO_LARGE — vượt giới hạn dung lượng của loại media (ADR-0044)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnsupportedMediaType:
      description: MEDIA_TYPE_NOT_ALLOWED — loại file không được phép hoặc magic bytes không khớp
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: RATE_LIMITED, LOGIN_QUEUE_BUSY (hàng chờ đăng nhập game, ADR-0045/0068), CHAT_RATE_LIMITED (giới hạn chat theo policy)
      headers:
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    DashboardBusy:
      description: DASHBOARD_BUSY — người dùng đã có quá số truy vấn dashboard đồng thời, hoặc EXPORT_LIMIT_REACHED với export; thử lại theo Retry-After
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: Dịch vụ phụ thuộc tạm thời không sẵn sàng (vd. CHAT_TEMPORARILY_UNAVAILABLE khi NATS JetStream lỗi) — client thử lại theo Retry-After
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    DashboardTimeout:
      description: DASHBOARD_QUERY_TIMEOUT — truy vấn bị hủy ở database sau statement_timeout 5 giây (DASHBOARD_DATA §8)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem:
      description: Lỗi (RFC 9457)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Gone:
      description: Tài nguyên hết hạn (PARTY_INVITATION_EXPIRED)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  headers:
    ContentLanguage:
      description: Ngôn ngữ của văn bản đã chọn trong response (`vi-VN` | `en-US`)
      schema:
        type: string
        maxLength: 16
    ETag:
      description: Phiên bản tài nguyên cho optimistic concurrency
      schema:
        type: string
        maxLength: 512
    IdempotentReplayed:
      description: |
        Có giá trị `true` khi response được phát lại từ kho idempotency (cùng `Idempotency-Key` + cùng body trong `idempotency_record_ttl`);
        vắng mặt khi request được xử lý lần đầu (API_DESIGN §6, F003).
      schema:
        type: string
        enum:
          - 'true'
    RateLimitLimit:
      schema:
        type: integer
    RateLimitRemaining:
      schema:
        type: integer
    RateLimitReset:
      schema:
        type: integer
    RetryAfter:
      schema:
        type: integer
  securitySchemes:
    keycloakBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token Keycloak (realm eduworld, aud eduworld-api, TTL 5 phút).
    keycloakAdminBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token Keycloak của Admin Portal (claim `azp = eduworld-portal`, phát qua `POST /auth/portal/login` — ADR-0091); không yêu cầu MFA (ADR-0094).
        Principal phải có role platform với permission tương ứng (`game.*`, `competition.config.*`, `platform.*`).
        Chỉ dùng trên gateway nội bộ (ADR-0027).
    keycloakOidc:
      type: openIdConnect
      description: Host thật theo môi trường (`sso.<env>.<domain>`, OQ-10); URL dưới đây là placeholder hợp lệ.
      openIdConnectUrl: https://sso.eduworld.example/realms/eduworld/.well-known/openid-configuration

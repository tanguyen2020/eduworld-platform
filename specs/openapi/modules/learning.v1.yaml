            - students
        target_id:
          $ref: '#/components/schemas/Uuid'
          description: class_id hoặc study_group_id (bắt buộc trừ target_type = students)
        student_ids:
          type: array
          maxItems: 200
          description: Chỉ với target_type = students
          items:
            $ref: '#/components/schemas/Uuid'
    Attempt:
      type: object
      description: 'Entity Attempt duy nhất cho mọi activity_type và mode (ADR-0048, ADR-0059). Server-authoritative: không chứa đáp án (ADR-0016).'
      required:
        - attempt_id
        - mode
        - status
        - started_at
      properties:
        attempt_id:
          $ref: '#/components/schemas/Uuid'
        activity_id:
          $ref: '#/components/schemas/Uuid'
          description: Vắng mặt với attempt ad-hoc (question_set/selection/retry_wrong)
        activity_version_id:
          $ref: '#/components/schemas/Uuid'
        activity_type:
          $ref: '#/components/schemas/ActivityType'
        mode:
          $ref: '#/components/schemas/AttemptMode'
        status:
          $ref: '#/components/schemas/AttemptStatus'
        context_type:
          type: string
          maxLength: 64
          description: quest_step, assignment, challenge, lesson, free_play, exam_session, match…
        context_id:
          $ref: '#/components/schemas/Uuid'
        started_at:
          $ref: '#/components/schemas/Timestamp'
        deadline_at:
          $ref: '#/components/schemas/Timestamp'
        submitted_at:
          $ref: '#/components/schemas/Timestamp'
        server_time:
          $ref: '#/components/schemas/Timestamp'
        feedback_timing:
          $ref: '#/components/schemas/FeedbackTiming'
        result_release:
          $ref: '#/components/schemas/ResultRelease'
        paused_at:
          $ref: '#/components/schemas/Timestamp'
          description: Có giá trị khi attempt đang tạm dừng (resume policy)
        recommendation_id:
          $ref: '#/components/schemas/Uuid'
          description: Gợi ý ôn tập đã dẫn tới attempt (miễn giảm XP khi ôn LO tiên quyết)
        display_language:
          $ref: '#/components/schemas/Locale'
          description: Ngôn ngữ hiển thị cố định trong suốt attempt (ADR-0056)
        items:
          type: array
          maxItems: 200
          description: Câu hỏi (render payload, không đáp án) cho hoạt động dạng câu hỏi
          items:
            $ref: '#/components/schemas/QuestionRender'
        saved_responses:
          type: array
          maxItems: 200
          description: Câu trả lời đã lưu (để resume)
          items:
            type: object
            properties:
              position:
                type: integer
                minimum: 1
              response:
                $ref: '#/components/schemas/QuestionResponse'
              hints_revealed:
                type: integer
                minimum: 0
                maximum: 5
        resume_position_ms:
          type: integer
          minimum: 0
        progress:
          $ref: '#/components/schemas/ActivityProgressState'
        render:
          $ref: '#/components/schemas/ActivityRender'
        evaluation:
          $ref: '#/components/schemas/Evaluation'
    ActivityType:
      type: string
      description: Loại learning activity trong version này (ADR-0072, ADR-0082)
      enum:
        - quiz
        - interactive_exercise
        - minigame
        - video_lesson
        - audio_lesson
        - simulation
    AttemptMode:
      type: string
      enum:
        - practice
        - assignment
        - quest
        - minigame
        - challenge
        - exam
        - competition
        - retry_wrong
        - diagnostic
    AttemptStatus:
      type: string
      description: Tạm dừng là cờ `paused_at`, không phải trạng thái
      enum:
        - in_progress
        - submitted
        - graded
        - expired
        - abandoned
    Locale:
      type: string
      enum:
        - vi-VN
        - en-US
      description: Locale đầy đủ dùng ở client/HTTP (ADR-0056)
    QuestionRender:
      type: object
      description: Render payload — KHÔNG chứa đáp án, scoring rule hay giải thích (ADR-0016)
      required:
        - position
        - question_version_id
        - type
        - render_payload
      properties:
        position:
          type: integer
          minimum: 1
        question_version_id:
          $ref: '#/components/schemas/Uuid'
        type:
          $ref: '#/components/schemas/QuestionType'
        render_payload:
          type: object
          description: |
            Phần render của specs/schemas/question.schema.json theo `type` (options/blanks/zones… không có trường đáp án; options[].feedback
            và misconception_tag bị loại khỏi DTO). Server kiểm tra bằng schema render đóng chặt; OpenAPI chặn thêm các khóa đáp án ở cấp gốc (TC-LRN-007).
          additionalProperties: true
          not:
            anyOf:
              - required:
                  - answer_key
              - required:
                  - scoring_rule
              - required:
                  - accepted_answers
              - required:
                  - correct_option_id
              - required:
                  - correct_option_ids
              - required:
                  - explanation
              - required:
                  - feedback
              - required:
                  - option_feedback
              - required:
                  - hints
              - required:
                  - misconception_tag
        media:
          type: array
          items:
            type: object
            properties:
              asset_id:
                $ref: '#/components/schemas/Uuid'
              url:
                type: string
                maxLength: 2048
                format: uri
              kind:
                type: string
                enum:
                  - image
                  - audio
                  - video
        max_score:
          type: number
    QuestionType:
      type: string
      enum:
        - single_choice
        - multiple_choice
        - true_false
        - fill_in_blank
        - short_answer
        - numeric
        - matching
        - ordering
        - drag_drop
        - image_based
        - interactive
    QuestionResponse:
      description: Câu trả lời thô theo QuestionType của item; server chọn shape theo `type` của version đã ghim, sai cấu trúc → 422 INVALID_RESPONSE. Không có biểu thức toán do học sinh gõ (ADR-0055)
      oneOf:
        - $ref: '#/components/schemas/SingleChoiceResponse'
        - $ref: '#/components/schemas/MultipleChoiceResponse'
        - $ref: '#/components/schemas/TrueFalseResponse'
        - $ref: '#/components/schemas/FillInBlankResponse'
        - $ref: '#/components/schemas/ShortAnswerResponse'
        - $ref: '#/components/schemas/NumericResponse'
        - $ref: '#/components/schemas/MatchingResponse'
        - $ref: '#/components/schemas/OrderingResponse'
        - $ref: '#/components/schemas/DragDropResponse'
        - $ref: '#/components/schemas/ImageBasedResponse'
        - $ref: '#/components/schemas/InteractiveResponse'
    SingleChoiceResponse:
      type: object
      description: single_choice (cũng dùng cho branch_choice)
      required:
        - option_id
      additionalProperties: false
      properties:
        option_id:
          $ref: '#/components/schemas/ItemId'
    ItemId:
      type: string
      maxLength: 64
      pattern: ^[a-z]_[a-z0-9_]{1,24}$
      description: ID ngắn ổn định trong version (option, blank, zone…) — không tiết lộ thứ tự
    MultipleChoiceResponse:
      type: object
      description: multiple_choice
      required:
        - option_ids
      additionalProperties: false
      properties:
        option_ids:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ItemId'
    TrueFalseResponse:
      description: true_false — một mệnh đề (`value`) hoặc nhiều mệnh đề (`statement_values`)
      oneOf:
        - type: object
          required:
            - value
          additionalProperties: false
          properties:
            value:
              type: boolean
        - type: object
          required:
            - statement_values
          additionalProperties: false
          properties:
            statement_values:
              type: object
              minProperties: 1
              maxProperties: 8
              propertyNames:
                $ref: '#/components/schemas/ItemId'
              additionalProperties:
                type: boolean
    FillInBlankResponse:
      type: object
      description: fill_in_blank — giá trị theo blank id
      required:
        - blanks
      additionalProperties: false
      properties:
        blanks:
          type: object
          minProperties: 1
          maxProperties: 10
          propertyNames:
            $ref: '#/components/schemas/ItemId'
          additionalProperties:
            type: string
            maxLength: 200
    ShortAnswerResponse:
      type: object
      description: short_answer (chấm tự động theo đáp án chấp nhận + chuẩn hóa)
      required:
        - text
      additionalProperties: false
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 500
    NumericResponse:
      type: object
      description: numeric — chuỗi học sinh nhập (dấu thập phân theo decimal_separator; `a/b` khi allow_fraction_input)
      required:
        - value
      additionalProperties: false
      properties:
        value:
          type: string
          minLength: 1
          maxLength: 64
    MatchingResponse:
      type: object
      description: matching — cặp [left_id, right_id]
      required:
        - pairs
      additionalProperties: false
      properties:
        pairs:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: array
            minItems: 2
            maxItems: 2
            prefixItems:
              - $ref: '#/components/schemas/ItemId'
              - $ref: '#/components/schemas/ItemId'
            items: false
    OrderingResponse:
      type: object
      description: ordering — thứ tự item id
      required:
        - order
      additionalProperties: false
      properties:
        order:
          type: array
          minItems: 3
          maxItems: 10
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ItemId'
    DragDropResponse:
      type: object
      description: drag_drop — draggable id → zone id
      required:
        - placements
      additionalProperties: false
      properties:
        placements:
          type: object
          minProperties: 1
          maxProperties: 16
          propertyNames:
            $ref: '#/components/schemas/ItemId'
          additionalProperties:
            $ref: '#/components/schemas/ItemId'
    ImageBasedResponse:
      description: image_based — `points` (hotspot, tọa độ theo image_size gốc) hoặc `label_placements` (label id → drop point id)
      oneOf:
        - type: object
          required:
            - points
          additionalProperties: false
          properties:
            points:
              type: array
              minItems: 1
              maxItems: 10
              items:
                type: object
                required:
                  - x
                  - 'y'
                additionalProperties: false
                properties:
                  x:
                    type: number
                    minimum: 0
                  'y':
                    type: number
                    minimum: 0
        - type: object
          required:
            - label_placements
          additionalProperties: false
          properties:
            label_placements:
              type: object
              minProperties: 1
              maxProperties: 16
              propertyNames:
                $ref: '#/components/schemas/ItemId'
              additionalProperties:
                $ref: '#/components/schemas/ItemId'
    InteractiveResponse:
      type: object
      description: interactive — trạng thái widget + action log; validator Go đã đăng ký chấm
      required:
        - state
      additionalProperties: false
      properties:
        state:
          type: object
          maxProperties: 50
          additionalProperties: true
        action_log:
          type: array
          maxItems: 500
          items:
            type: object
            required:
              - t_ms
              - action
            additionalProperties: false
            properties:
              t_ms:
                type: integer
                minimum: 0
              action:
                type: string
                maxLength: 64
              args:
                type: object
                maxProperties: 20
                additionalProperties: true
    ActivityProgressState:
      type: object
      required:
        - watched_ratio
        - completed
      properties:
        position_ms:
          type: integer
          minimum: 0
        watched_ratio:
          type: number
          minimum: 0
          maximum: 1
        completed:
          type: boolean
        pending_cue_ids:
          type: array
          maxItems: 50
          items:
            type: string
            maxLength: 64
    ActivityRender:
      type: object
      description: Render payload — KHÔNG chứa đáp án, phản hồi theo phương án hay scoring rule (ADR-0016)
      required:
        - activity_id
        - activity_version_id
        - activity_type
        - title
        - render_payload
      properties:
        activity_id:
          $ref: '#/components/schemas/Uuid'
        activity_version_id:
          $ref: '#/components/schemas/Uuid'
        version:
          type: integer
          minimum: 1
        activity_type:
          $ref: '#/components/schemas/ActivityType'
        title:
          type: string
          maxLength: 255
        instructions:
          type: string
          maxLength: 2000
        time_limit_seconds:
          type: integer
          minimum: 1
        render_payload:
          type: object
          description: Theo specs/schemas/activities/<type>.schema.json (phần hiển thị) — không chứa đáp án, scoring, phản hồi theo phương án hay gợi ý
          additionalProperties: true
          not:
            anyOf:
              - required:
                  - answer_key
              - required:
                  - scoring_rule
              - required:
                  - accepted_answers
              - required:
                  - correct_option_id
              - required:
                  - correct_option_ids
              - required:
                  - explanation
              - required:
                  - feedback
              - required:
                  - option_feedback
              - required:
                  - hints
              - required:
                  - misconception_tag
        math_assets:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/MathAssetRef'
        media:
          type: array
          maxItems: 50
          items:
            type: object
            required:
              - asset_id
              - url
            properties:
              asset_id:
                $ref: '#/components/schemas/Uuid'
              url:
                type: string
                maxLength: 2048
                format: uri
              kind:
                type: string
                enum:
                  - image
                  - audio
                  - video
                  - subtitle
        min_client_version:
          type: string
          maxLength: 32
        content_language:
          $ref: '#/components/schemas/ContentLanguage'
        display_language:
          $ref: '#/components/schemas/Locale'
        translation_missing:
          type: boolean
          description: true khi học sinh chọn ngôn ngữ chưa có bản dịch — hiển thị ngôn ngữ gốc kèm nhãn "Chưa có bản tiếng Anh"
    MathAssetRef:
      type: object
      description: Công thức đã render sẵn thành SVG (ADR-0055) — game chỉ hiển thị
      required:
        - math_id
        - svg_url
      properties:
        math_id:
          type: string
          maxLength: 64
        svg_url:
          type: string
          maxLength: 2048
          format: uri
        sha256:
          type: string
          maxLength: 64
          pattern: ^[a-f0-9]{64}$
        speech_text:
          type: string
          maxLength: 1000
        display:
          type: string
          enum:
            - inline
            - block
    ContentLanguage:
      type: string
      enum:
        - vi
        - en
      description: Khóa ngôn ngữ trong JSON nội dung (ADR-0056)
    Evaluation:
      type: object
      required:
        - evaluation_id
        - attempt_id
        - source
        - status
        - effective
        - created_at
      properties:
        evaluation_id:
          $ref: '#/components/schemas/Uuid'
        attempt_id:
          $ref: '#/components/schemas/Uuid'
        source:
          type: string
          enum:
            - system
            - re_evaluation
          description: re_evaluation = hệ thống chấm lại khi nội dung có lỗi (attempt.re_evaluated)
        status:
          type: string
          enum:
            - final
            - superseded
        regrade_request_id:
          $ref: '#/components/schemas/Uuid'
        supersedes_evaluation_id:
          $ref: '#/components/schemas/Uuid'
        reason:
          type: string
          maxLength: 1000
        score:
          type: number
          minimum: 0
        max_score:
          type: number
          minimum: 0
        passed:
          type: boolean
        feedback:
          type: string
          maxLength: 4000
          description: Nhận xét tự động theo kết quả (không có nhận xét của người chấm)
        effective:
          type: boolean
        created_at:
          $ref: '#/components/schemas/Timestamp'
    ActivityResponseSubmission:
      type: object
      description: Một câu trả lời trong attempt (thay AnswerSubmission/ActivityPartialResponse — ADR-0059). Server chấm; client không gửi điểm.
      required:
        - response
      properties:
        kind:
          type: string
          enum:
            - question
            - cue_answer
            - branch_choice
            - simulation_question
          default: question
          description: Vắng mặt = question; exam (PUT /exams/attempts/{attempt_id}/answers/{position}) chỉ dùng question
        position:
          type: integer
          minimum: 1
          description: Vị trí item (kind=question)
        question_version_id:
          $ref: '#/components/schemas/Uuid'
        cue_id:
          type: string
          maxLength: 64
        branch_point_id:
          type: string
          maxLength: 64
        option_id:
          type: string
          maxLength: 64
        response:
          $ref: '#/components/schemas/QuestionResponse'
        client_elapsed_ms:
          type: integer
          minimum: 0
          description: Chỉ tham khảo; server dùng thời gian của server
    AttemptResult:
      type: object
      required:
        - attempt_id
        - status
      properties:
        attempt_id:
          $ref: '#/components/schemas/Uuid'
        status:
          $ref: '#/components/schemas/AttemptStatus'
        score:
          type:
            - number
            - 'null'
        max_score:
          type:
            - number
            - 'null'
        correct_count:
          type:
            - integer
            - 'null'
        duration_ms:
          type: integer
        result_available_at:
          $ref: '#/components/schemas/Timestamp'
        rewards:
          type: array
          description: Phần thưởng game đã cấp (không ảnh hưởng điểm)
          items:
            $ref: '#/components/schemas/RewardPreview'
    RewardPreview:
      type: object
      properties:
        kind:
          type: string
          enum:
            - xp
            - item
            - badge
        amount:
          type: integer
        item_id:
          $ref: '#/components/schemas/Uuid'
    AttemptReview:
      type: object
      required:
        - attempt_id
        - items
      properties:
        attempt_id:
          $ref: '#/components/schemas/Uuid'
        score:
          type:
            - number
            - 'null'
        max_score:
          type:
            - number
            - 'null'
        items:
          type: array
          items:
            type: object
            properties:
              position:
                type: integer
              question:
                $ref: '#/components/schemas/QuestionRender'
              response:
                $ref: '#/components/schemas/QuestionResponse'
              feedback:
                $ref: '#/components/schemas/AnswerFeedback'
              hints_used:
                type: integer
                minimum: 0
              is_correct:
                type:
                  - boolean
                  - 'null'
              score:
                type:
                  - number
                  - 'null'
              explanation:
                type:
                  - object
                  - 'null'
                additionalProperties: true
                description: richContent giải thích (chỉ khi FeedbackTiming/ResultRelease cho phép)
              objective_ids:
                type: array
                items:
                  $ref: '#/components/schemas/Uuid'
        weak_objectives:
          type: array
          items:
            $ref: '#/components/schemas/Uuid'
        recommendations:
          type: array
          items:
            type: object
            properties:
              kind:
                type: string
                enum:
                  - lesson
                  - question_set
                  - quest
              ref_id:
                $ref: '#/components/schemas/Uuid'
              title:
                type: string
                maxLength: 255
    AnswerFeedback:
      type: object
      description: Phản hồi theo phương án đã chọn (options[].feedback, phía đáp án) — chỉ trả sau khi chấm theo FeedbackTiming, không có trong render payload
      required:
        - text
      properties:
        option_id:
          $ref: '#/components/schemas/ItemId'
        text:
          type: string
          maxLength: 2000
        math_assets:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/MathAssetRef'
        worked_example_ref:
          $ref: '#/components/schemas/Uuid'
          description: Lesson/learning material dạng ví dụ mẫu gợi ý xem lại
    ContentStatus:
      type: string
      enum:
        - draft
        - in_review
        - approved
        - published
        - archived
        - rejected
    QuestionAuthoring:
      allOf:
        - $ref: '#/components/schemas/ContentVersion'
        - $ref: '#/components/schemas/QuestionAuthoringInput'
    ContentVersion:
      type: object
      required:
        - content_type
        - content_id
        - version
        - status
      properties:
        content_type:
          $ref: '#/components/schemas/LearningContentType'
        content_id:
          $ref: '#/components/schemas/Uuid'
        content_version_id:
          $ref: '#/components/schemas/Uuid'
        version:
          type: integer
        status:
          $ref: '#/components/schemas/ContentStatus'
        owner_scope:
          type: string
          enum:
            - platform
            - tenant
        tenant_id:
          description: Tenant sở hữu; null với dữ liệu platform (owner_scope = platform). Luôn trả về cho System Admin
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        school_id:
          $ref: '#/components/schemas/Uuid'
        assigned:
          type: boolean
          description: true nếu là dữ liệu platform được gán cho tenant (chỉ đọc với tenant)
        cloned_from_id:
          $ref: '#/components/schemas/Uuid'
        cloned_from_tenant_id:
          $ref: '#/components/schemas/Uuid'
        author_id:
          $ref: '#/components/schemas/Uuid'
        reviewer_id:
          $ref: '#/components/schemas/Uuid'
        published_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
        content_language:
          $ref: '#/components/schemas/ContentLanguage'
        translation_status:
          $ref: '#/components/schemas/TranslationStatus'
          readOnly: true
        outdated_fields:
          type: array
          readOnly: true
          maxItems: 500
          description: JSON pointer các trường có bản dịch lỗi thời so với bản gốc (huy hiệu "Lỗi thời" theo trường, CONTENT_MODEL §8; F053). Rỗng/vắng = không có
          items:
            type: string
            maxLength: 256
        audio_exempt_reason:
          type: string
          maxLength: 255
          description: Miễn trừ audio đọc đề nhóm g1_3 (CONTENT_MODEL §8.1) — chỉ question, lesson, activity; reviewer xác nhận khi approve
        audio_exempt_approved_by:
          $ref: '#/components/schemas/Uuid'
          readOnly: true
        warnings:
          type: array
          readOnly: true
          maxItems: 100
          description: Cảnh báo không chặn của submit_review (lựa chọn dạng chữ thiếu audio nhóm g1_3, CONTENT_MODEL §8.1; F025)
          items:
            type: object
            required:
              - field
              - code
            properties:
              field:
                type: string
                maxLength: 256
              code:
                type: string
                maxLength: 64
              message:
                type: string
                maxLength: 500
    LearningContentType:
      type: string
      enum:
        - question
        - question_set
        - assessment_blueprint
        - lesson
        - learning_material
        - learning_path
        - activity
    TranslationStatus:
      type: string
      enum:
        - complete
        - partial
        - outdated
    QuestionAuthoringInput:
      type: object
      description: |
        Dạng soạn thảo — chỉ dùng trong CMS, có answer_key (F022). stem, render_payload, answer_key, scoring_rule, explanation,
        hints được kiểm theo specs/schemas/question.schema.json theo `type` rồi validator ngữ nghĩa của loại (lỗi trả JSON
        pointer trong errors[].field); options[].feedback và options[].misconception_tag được tách khỏi render payload khi lưu
        (chỉ server). Loại chưa bật (short_answer, image_based, interactive — F023) → 422 errors[].code = TYPE_NOT_ENABLED.
      properties:
        tenant_id:
          description: Tenant đích — bắt buộc khi người gọi là System Admin và owner_scope = tenant; người dùng tenant bỏ trống (khác tenant phiên → TENANT_MISMATCH)
          $ref: '#/components/schemas/Uuid'
        owner_scope:
          type: string
          enum:
            - platform
            - tenant
          default: tenant
        type:
          $ref: '#/components/schemas/QuestionType'
        stem:
          type: object
          additionalProperties: true
          maxProperties: 4
          description: richContent (question.schema.json#/$defs/richContent)
        render_payload:
          type: object
          additionalProperties: true
          maxProperties: 16
        answer_key:
          type: object
          additionalProperties: true
          maxProperties: 16
        scoring_rule:
          type: object
          additionalProperties: true
          maxProperties: 8
        explanation:
          type: object
          additionalProperties: true
          maxProperties: 4
          description: richContent
        hints:
          type: array
          maxItems: 5
          description: Gợi ý theo cấp (richContent), chỉ server
          items:
            type: object
            additionalProperties: true
            maxProperties: 4
        worked_example_ref:
          type: object
          additionalProperties: false
          required:
            - content_item_id
            - block_id
          description: Khối worked_example trong lesson/learning material cùng LO (CONTENT_MODEL §9.2); kiểm tồn tại ở F024
          properties:
            content_item_id:
              $ref: '#/components/schemas/Uuid'
            block_id:
              type: string
              minLength: 1
              maxLength: 64
        audio_exempt_reason:
          type: string
          maxLength: 255
          description: Lý do miễn lồng tiếng đề cho khối 1–3 (CONTENT_MODEL §8.1); có lý do thì submit_review không đòi stem.audio_ref, reviewer phải xác nhận khi approve (F025)
        min_response_ms:
          type: integer
          minimum: 0
          maximum: 600000
        max_score:
          type: number
          exclusiveMinimum: 0
          maximum: 99999.99
          default: 1
        math_assets:
          type: array
          maxItems: 50
          description: Công thức đã render (ADR-0055, question.schema.json#/$defs/mathDisplay). Portal gửi svg (MathJax 4) — server kiểm LaTeX, sanitize, lưu math/<sha256>.svg và trả svg_asset; svg_asset không kèm svg phải là SVG đã lưu; thiếu cả hai → 422 MATH_RENDER_FAILED (F027)
          items:
            type: object
            additionalProperties: false
            required:
              - latex
              - speech_text
            properties:
              latex:
                type: string
                minLength: 1
                maxLength: 2000
              svg:
                type: string
                maxLength: 262144
                description: SVG ≤ 256 KB (math_svg_max), chỉ gửi lên
              svg_asset:
                type: string
                maxLength: 128
                pattern: ^math/[0-9a-f]{64}\.svg$
              speech_text:
                type: string
                maxLength: 1000
        tags:
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 50
        difficulty:
          type: integer
          minimum: 1
          maximum: 5
        grade_levels:
          type: array
          minItems: 1
          maxItems: 9
          uniqueItems: true
          items:
            $ref: '#/components/schemas/GradeLevel'
        subject_id:
          $ref: '#/components/schemas/Uuid'
        topic_id:
          $ref: '#/components/schemas/Uuid'
        curriculum_version_id:
          $ref: '#/components/schemas/Uuid'
        objective_ids:
          type: array
          maxItems: 50
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Uuid'
        media_refs:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/Uuid'
        content_language:
          $ref: '#/components/schemas/ContentLanguage'
          description: Ngôn ngữ gốc của câu hỏi; stem/explanation dùng khóa vi/en (specs/schemas/question.schema.json)
        change_note:
          type: string
          maxLength: 500
        exam_only:
          type: boolean
          default: false
          description: Chỉ dùng trong đề kiểm tra (QUESTION_BANK)
        efficacy_instrument:
          type: boolean
          default: false
          description: Câu đo hiệu quả (F035) — chỉ owner_scope = platform, exam_only = true, không tham số hóa (ngược lại 422 VALIDATION_FAILED); bị loại khỏi mọi lần chọn câu; chỉ đổi bằng version mới
    ContentVersionHistory:
      type: object
      required:
        - item_id
        - data
        - page

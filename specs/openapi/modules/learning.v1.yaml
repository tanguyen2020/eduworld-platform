    ActivityType:
      type: string
      description: Loại learning activity trong version này (ADR-0072, ADR-0082)
      enum:
        - quiz
        - interactive_exercise
        - minigame
        - video_lesson
        - audio_lesson
        - simulation
    AttemptMode:
      type: string
      enum:
        - practice
        - assignment
        - quest
        - minigame
        - challenge
        - exam
        - competition
        - retry_wrong
        - diagnostic
    AttemptStatus:
      type: string
      description: Tạm dừng là cờ `paused_at`, không phải trạng thái
      enum:
        - in_progress
        - submitted
        - graded
        - expired
        - abandoned
    Locale:
      type: string
      enum:
        - vi-VN
        - en-US
      description: Locale đầy đủ dùng ở client/HTTP (ADR-0056)
    QuestionRender:
      type: object
      description: Render payload — KHÔNG chứa đáp án, scoring rule hay giải thích (ADR-0016)
      required:
        - position
        - question_version_id
        - type
        - render_payload
      properties:
        position:
          type: integer
          minimum: 1
        question_version_id:
          $ref: '#/components/schemas/Uuid'
        type:
          $ref: '#/components/schemas/QuestionType'
        render_payload:
          type: object
          description: |
            Phần render của specs/schemas/question.schema.json theo `type` (options/blanks/zones… không có trường đáp án; options[].feedback
            và misconception_tag bị loại khỏi DTO). Server kiểm tra bằng schema render đóng chặt; OpenAPI chặn thêm các khóa đáp án ở cấp gốc (TC-LRN-007).
          additionalProperties: true
          not:
            anyOf:
              - required:
                  - answer_key
              - required:
                  - scoring_rule
              - required:
                  - accepted_answers
              - required:
                  - correct_option_id
              - required:
                  - correct_option_ids
              - required:
                  - explanation
              - required:
                  - feedback
              - required:
                  - option_feedback
              - required:
                  - hints
              - required:
                  - misconception_tag
        media:
          type: array
          items:
            type: object
            properties:
              asset_id:
                $ref: '#/components/schemas/Uuid'
              url:
                type: string
                maxLength: 2048
                format: uri
              kind:
                type: string
                enum:
                  - image
                  - audio
                  - video
        max_score:
          type: number
        hint_count:
          type: integer
          minimum: 0
          maximum: 5
          description: Số cấp gợi ý của item (`hints[]` của version đã ghim) — không lộ nội dung gợi ý; client hiện nút Gợi ý khi > 0 (GODOT_ARCHITECTURE §6.2, F063)
    QuestionType:
      type: string
      enum:
        - single_choice
        - multiple_choice
        - true_false
        - fill_in_blank
        - short_answer
        - numeric
        - matching
        - ordering
        - drag_drop
        - image_based
        - interactive
    QuestionResponse:
      description: Câu trả lời thô theo QuestionType của item; server chọn shape theo `type` của version đã ghim, sai cấu trúc → 422 INVALID_RESPONSE. Không có biểu thức toán do học sinh gõ (ADR-0055)
      oneOf:
        - $ref: '#/components/schemas/SingleChoiceResponse'
        - $ref: '#/components/schemas/MultipleChoiceResponse'
        - $ref: '#/components/schemas/TrueFalseResponse'
        - $ref: '#/components/schemas/FillInBlankResponse'
        - $ref: '#/components/schemas/ShortAnswerResponse'
        - $ref: '#/components/schemas/NumericResponse'
        - $ref: '#/components/schemas/MatchingResponse'
        - $ref: '#/components/schemas/OrderingResponse'
        - $ref: '#/components/schemas/DragDropResponse'
        - $ref: '#/components/schemas/ImageBasedResponse'
        - $ref: '#/components/schemas/InteractiveResponse'
    SingleChoiceResponse:
      type: object
      description: single_choice (cũng dùng cho branch_choice)
      required:
        - option_id
      additionalProperties: false
      properties:
        option_id:
          $ref: '#/components/schemas/ItemId'
    ItemId:
      type: string
      maxLength: 64
      pattern: ^[a-z]_[a-z0-9_]{1,24}$
      description: ID ngắn ổn định trong version (option, blank, zone…) — không tiết lộ thứ tự
    MultipleChoiceResponse:
      type: object
      description: multiple_choice
      required:
        - option_ids
      additionalProperties: false
      properties:
        option_ids:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ItemId'
    TrueFalseResponse:
      description: true_false — một mệnh đề (`value`) hoặc nhiều mệnh đề (`statement_values`)
      oneOf:
        - type: object
          required:
            - value
          additionalProperties: false
          properties:
            value:
              type: boolean
        - type: object
          required:
            - statement_values
          additionalProperties: false
          properties:
            statement_values:
              type: object
              minProperties: 1
              maxProperties: 8
              propertyNames:
                $ref: '#/components/schemas/ItemId'
              additionalProperties:
                type: boolean
    FillInBlankResponse:
      type: object
      description: fill_in_blank — giá trị theo blank id
      required:
        - blanks
      additionalProperties: false
      properties:
        blanks:
          type: object
          minProperties: 1
          maxProperties: 10
          propertyNames:
            $ref: '#/components/schemas/ItemId'
          additionalProperties:
            type: string
            maxLength: 200
    ShortAnswerResponse:
      type: object
      description: short_answer (chấm tự động theo đáp án chấp nhận + chuẩn hóa)
      required:
        - text
      additionalProperties: false
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 500
    NumericResponse:
      type: object
      description: numeric — chuỗi học sinh nhập (dấu thập phân theo decimal_separator; `a/b` khi allow_fraction_input)
      required:
        - value
      additionalProperties: false
      properties:
        value:
          type: string
          minLength: 1
          maxLength: 64
    MatchingResponse:
      type: object
      description: matching — cặp [left_id, right_id]
      required:
        - pairs
      additionalProperties: false
      properties:
        pairs:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: array
            minItems: 2
            maxItems: 2
            prefixItems:
              - $ref: '#/components/schemas/ItemId'
              - $ref: '#/components/schemas/ItemId'
            items: false
    OrderingResponse:
      type: object
      description: ordering — thứ tự item id
      required:
        - order
      additionalProperties: false
      properties:
        order:
          type: array
          minItems: 3
          maxItems: 10
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ItemId'
    DragDropResponse:
      type: object
      description: drag_drop — draggable id → zone id
      required:
        - placements
      additionalProperties: false
      properties:
        placements:
          type: object
          minProperties: 1
          maxProperties: 16
          propertyNames:
            $ref: '#/components/schemas/ItemId'
          additionalProperties:
            $ref: '#/components/schemas/ItemId'
    ImageBasedResponse:
      description: image_based — `points` (hotspot, tọa độ theo image_size gốc) hoặc `label_placements` (label id → drop point id)
      oneOf:
        - type: object
          required:
            - points
          additionalProperties: false
          properties:
            points:
              type: array
              minItems: 1
              maxItems: 10
              items:
                type: object
                required:
                  - x
                  - 'y'
                additionalProperties: false
                properties:
                  x:
                    type: number
                    minimum: 0
                  'y':
                    type: number
                    minimum: 0
        - type: object
          required:
            - label_placements
          additionalProperties: false
          properties:
            label_placements:
              type: object
              minProperties: 1
              maxProperties: 16
              propertyNames:
                $ref: '#/components/schemas/ItemId'
              additionalProperties:
                $ref: '#/components/schemas/ItemId'
    InteractiveResponse:
      type: object
      description: interactive — trạng thái widget + action log; validator Go đã đăng ký chấm
      required:
        - state
      additionalProperties: false
      properties:
        state:
          type: object
          maxProperties: 50
          additionalProperties: true
        action_log:
          type: array
          maxItems: 500
          items:
            type: object
            required:
              - t_ms
              - action
            additionalProperties: false
            properties:
              t_ms:
                type: integer
                minimum: 0
              action:
                type: string
                maxLength: 64
              args:
                type: object
                maxProperties: 20
                additionalProperties: true
    ActivityProgressState:
      type: object
      required:
        - watched_ratio
        - completed
      properties:
        position_ms:
          type: integer
          minimum: 0
        watched_ratio:
          type: number
          minimum: 0
          maximum: 1
        completed:
          type: boolean
        watched_ranges:
          type: array
          maxItems: 64
          description: Khoảng đã xem được server chấp nhận (đã gộp) — client khóa tua theo mép (F065-AC-17)
          items:
            type: object
            required:
              - start_ms
              - end_ms
            properties:
              start_ms:
                type: integer
                minimum: 0
              end_ms:
                type: integer
                minimum: 0
        segment_id:
          type: string
          maxLength: 64
          description: Đoạn đang phát của video tương tác
        pending_cue_ids:
          type: array
          maxItems: 50
          items:
            type: string
            maxLength: 64
        plays_used:
          type: integer
          minimum: 0
          description: Lượt nghe server đã ghi nhận (bài nghe; video luôn 0)
        max_plays:
          type:
            - integer
            - 'null'
          minimum: 1
          maximum: 20
          description: Giới hạn lượt nghe của version (null = không giới hạn)
    ActivityRender:
      type: object
      description: Render payload — KHÔNG chứa đáp án, phản hồi theo phương án hay scoring rule (ADR-0016)
      required:
        - activity_id
        - activity_version_id
        - activity_type
        - title
        - render_payload
      properties:
        activity_id:
          $ref: '#/components/schemas/Uuid'
        activity_version_id:
          $ref: '#/components/schemas/Uuid'
        version:
          type: integer
          minimum: 1
        activity_type:
          $ref: '#/components/schemas/ActivityType'
        title:
          type: string
          maxLength: 255
        instructions:
          type: string
          maxLength: 2000
        time_limit_seconds:
          type: integer
          minimum: 1
        render_payload:
          type: object
          description: Theo specs/schemas/activities/<type>.schema.json (phần hiển thị) — không chứa đáp án, scoring, phản hồi theo phương án hay gợi ý
          additionalProperties: true
          not:
            anyOf:
              - required:
                  - answer_key
              - required:
                  - scoring_rule
              - required:
                  - accepted_answers
              - required:
                  - correct_option_id
              - required:
                  - correct_option_ids
              - required:
                  - explanation
              - required:
                  - feedback
              - required:
                  - option_feedback
              - required:
                  - hints
              - required:
                  - misconception_tag
        math_assets:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/MathAssetRef'
        media:
          type: array
          maxItems: 50
          items:
            type: object
            required:
              - asset_id
              - url
            properties:
              asset_id:
                $ref: '#/components/schemas/Uuid'
              url:
                type: string
                maxLength: 2048
                format: uri
              kind:
                type: string
                enum:
                  - image
                  - audio
                  - video
                  - subtitle
                  - transcript
              variant:
                type: string
                maxLength: 32
                description: Biến thể media (ogv_480, ogv_720, ogg, vtt…) — client chọn theo preset chất lượng (F065 research R3)
              language:
                type: string
                maxLength: 8
                description: Ngôn ngữ của phụ đề (kind subtitle)
              segment_id:
                type: string
                maxLength: 64
                description: Đoạn của video tương tác (vắng = video chính)
              expires_at:
                $ref: '#/components/schemas/Timestamp'
                description: Hết hạn của signed URL (media riêng tenant
                ADR-0044): null
        min_client_version:
          type: string
          maxLength: 32
        content_language:
          $ref: '#/components/schemas/ContentLanguage'
        display_language:
          $ref: '#/components/schemas/Locale'
        translation_missing:
          type: boolean
          description: true khi học sinh chọn ngôn ngữ chưa có bản dịch — hiển thị ngôn ngữ gốc kèm nhãn "Chưa có bản tiếng Anh"
    MathAssetRef:
      type: object
      description: Công thức đã render sẵn thành SVG (ADR-0055) — game chỉ hiển thị
      required:
        - math_id
        - svg_url
      properties:
        math_id:
          type: string
          maxLength: 64
        svg_url:
          type: string
          maxLength: 2048
          format: uri
        sha256:
          type: string
          maxLength: 64
          pattern: ^[a-f0-9]{64}$
        speech_text:
          type: string
          maxLength: 1000
        display:
          type: string
          enum:
            - inline
            - block
    ContentLanguage:
      type: string
      enum:
        - vi
        - en
      description: Khóa ngôn ngữ trong JSON nội dung (ADR-0056)
    Evaluation:
      type: object
      required:
        - evaluation_id
        - attempt_id
        - source
        - status
        - effective
        - created_at
      properties:
        evaluation_id:
          $ref: '#/components/schemas/Uuid'
        attempt_id:
          $ref: '#/components/schemas/Uuid'
        source:
          type: string
          enum:
            - system
            - re_evaluation
          description: re_evaluation = hệ thống chấm lại khi nội dung có lỗi (attempt.re_evaluated)
        status:
          type: string
          enum:
            - final
            - superseded
        regrade_request_id:
          $ref: '#/components/schemas/Uuid'
        supersedes_evaluation_id:
          $ref: '#/components/schemas/Uuid'
        reason:
          type: string
          maxLength: 1000
        score:
          type: number
          minimum: 0
        max_score:
          type: number
          minimum: 0
        passed:
          type: boolean
        feedback:
          type: string
          maxLength: 4000
          description: Nhận xét tự động theo kết quả (không có nhận xét của người chấm)
        effective:
          type: boolean
        created_at:
          $ref: '#/components/schemas/Timestamp'
    ActivityResponseSubmission:
      type: object
      description: Một câu trả lời trong attempt (thay AnswerSubmission/ActivityPartialResponse — ADR-0059). Server chấm; client không gửi điểm. `response` bắt buộc với kind question/cue_answer/simulation_question (thiếu → 422 INVALID_RESPONSE); kind branch_choice gửi `branch_point_id` + `option_id`, không có response (F065-AC-24).
      properties:
        kind:
          type: string
          enum:
            - question
            - cue_answer
            - branch_choice
            - simulation_question
          default: question
          description: Vắng mặt = question; exam (PUT /exams/attempts/{attempt_id}/answers/{position}) chỉ dùng question
        position:
          type: integer
          minimum: 1
          description: Vị trí item (kind=question)
        question_version_id:
          $ref: '#/components/schemas/Uuid'
        cue_id:
          type: string
          maxLength: 64
        branch_point_id:
          type: string
          maxLength: 64
        option_id:
          type: string
          maxLength: 64
        response:
          $ref: '#/components/schemas/QuestionResponse'
        client_elapsed_ms:
          type: integer
          minimum: 0
          description: Chỉ tham khảo; server dùng thời gian của server
        answered_at_client:
          $ref: '#/components/schemas/Timestamp'
          description: 'Đề (saveExamAnswer): thời điểm trả lời trên client khi gửi bù sau mất kết nối; nhận nếu trước deadline_at và server nhận trong exam_offline_sync_grace (EXAM_ENGINE §6)'
    AttemptResult:
      type: object
      required:
        - attempt_id
        - status
      properties:
        attempt_id:
          $ref: '#/components/schemas/Uuid'
        status:
          $ref: '#/components/schemas/AttemptStatus'
        score:
          type:
            - number
            - 'null'
        max_score:
          type:
            - number
            - 'null'
        correct_count:
          type:
            - integer
            - 'null'
        duration_ms:
          type: integer
        result_available_at:
          $ref: '#/components/schemas/Timestamp'
        rewards:
          type: array
          description: Phần thưởng game đã cấp (không ảnh hưởng điểm)
          items:
            $ref: '#/components/schemas/RewardPreview'
    RewardPreview:
      type: object
      properties:
        kind:
          type: string
          enum:
            - xp
            - item
            - badge
            - currency
            - title
            - collection_item
        amount:
          type: integer
        item_id:
          $ref: '#/components/schemas/Uuid'
        ref:
          type: string
          maxLength: 64
          description: Mã item/badge/currency/title/collection của phần thưởng quest (quest.schema.json v2)
        first_completion_only:
          type: boolean
    AttemptReview:
      type: object
      required:
        - attempt_id
        - items
      properties:
        attempt_id:
          $ref: '#/components/schemas/Uuid'
        score:
          type:
            - number
            - 'null'
        max_score:
          type:
            - number
            - 'null'
        score_scaled:
          type:
            - number
            - 'null'
          description: Kết quả đề (getExamResult) — điểm theo score_scale
        section_scores:
          type: array
          maxItems: 50
          description: Kết quả đề (getExamResult) — điểm theo section
          items:
            $ref: '#/components/schemas/ExamSectionScore'
        items:
          type: array
          items:
            type: object
            properties:
              position:
                type: integer
              question:
                $ref: '#/components/schemas/QuestionRender'
              response:
                $ref: '#/components/schemas/QuestionResponse'
              feedback:
                $ref: '#/components/schemas/AnswerFeedback'
              hints_used:
                type: integer
                minimum: 0
              is_correct:
                type:
                  - boolean
                  - 'null'
              score:
                type:
                  - number
                  - 'null'
              explanation:
                type:
                  - object
                  - 'null'
                additionalProperties: true
                description: richContent giải thích (chỉ khi FeedbackTiming/ResultRelease cho phép)
              objective_ids:
                type: array
                items:
                  $ref: '#/components/schemas/Uuid'
        weak_objectives:
          type: array
          items:
            $ref: '#/components/schemas/Uuid'
        recommendations:
          type: array
          items:
            type: object
            properties:
              kind:
                type: string
                enum:
                  - lesson
                  - question_set
                  - quest
              ref_id:
                $ref: '#/components/schemas/Uuid'
              recommendation_id:
                $ref: '#/components/schemas/Uuid'
                description: Gợi ý ôn tập (GET /learning/recommendations/me) — client gửi lại trong AdHocAttemptStart.recommendation_id khi học sinh bấm luyện tập (F063-AC-24)
              title:
                type: string
                maxLength: 255
      example:
        attempt_id: 0f630000-0000-7000-8000-000000000001
        score: 7
        max_score: 8
        items:
          - position: 1
            question:
              position: 1
              question_version_id: 0f630000-0000-4000-8000-000000000101
              type: single_choice
              render_payload:
                stem:
                  blocks:
                    - type: paragraph
                      text: Bạn Nam có 3 túi, mỗi túi 6 quả cam. Nam có tất cả bao nhiêu quả cam?
                  audio_ref: 0f630000-0000-4000-8000-0000000000c1
                options:
                  - id: o_a
                    content:
                      blocks:
                        - type: paragraph
                          text: 9 quả
                  - id: o_b
                    content:
                      blocks:
                        - type: paragraph
                          text: 18 quả
                  - id: o_c
                    content:
                      blocks:
                        - type: paragraph
                          text: 12 quả
                  - id: o_d
                    content:
                      blocks:
                        - type: paragraph
                          text: 3 + 6 quả
                shuffle_options: true
            response:
              option_id: o_a
            feedback:
              option_id: o_a
              text: Em đã cộng 3 + 6. Đề hỏi 3 túi, mỗi túi 6 quả, nên cần nhân.
              worked_example_ref: 0f630000-0000-4000-8000-0000000000d1
            hints_used: 1
            is_correct: false
            score: 0
            explanation:
              blocks:
                - type: paragraph
                  text: Có 3 túi, mỗi túi 6 quả nên lấy 6 × 3 = 18.
            objective_ids:
              - 0f630000-0000-4000-8000-0000000000e1
          - position: 2
            question:
              position: 2
              question_version_id: 0f630000-0000-4000-8000-000000000102
              type: multiple_choice
              render_payload:
                stem:
                  blocks:
                    - type: paragraph
                      text: Chọn các số chia hết cho 3.
                options:
                  - id: o_a
                    content:
                      blocks:
                        - type: paragraph
                          text: '9'
                  - id: o_b
                    content:
                      blocks:
                        - type: paragraph
                          text: '10'
                  - id: o_c
                    content:
                      blocks:
                        - type: paragraph
                          text: '12'
                  - id: o_d
                    content:
                      blocks:
                        - type: paragraph
                          text: '14'
                shuffle_options: true
                show_correct_count: false
            response:
              option_ids:
                - o_a
                - o_c
            hints_used: 0
            is_correct: true
            score: 1
            explanation: null
            objective_ids:
              - 0f630000-0000-4000-8000-0000000000e2
        weak_objectives:
          - 0f630000-0000-4000-8000-0000000000e1
        recommendations:
          - kind: question_set
            ref_id: 0f630000-0000-4000-8000-0000000000f1
            recommendation_id: 0f630000-0000-4000-8000-0000000000f2
            title: Luyện 3 câu nhân 7
    ExamSectionScore:
      type: object
      required:
        - section_id
        - score
        - max_score
      properties:
        section_id:
          type: string
          maxLength: 64
        title:
          type: string
          maxLength: 255
        score:
          type: number
        max_score:
          type: number
    AnswerFeedback:
      type: object
      description: Phản hồi theo phương án đã chọn (options[].feedback, phía đáp án) — chỉ trả sau khi chấm theo FeedbackTiming, không có trong render payload
      required:
        - text
      properties:
        option_id:
          $ref: '#/components/schemas/ItemId'
        text:
          type: string
          maxLength: 2000
        math_assets:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/MathAssetRef'
        worked_example_ref:
          $ref: '#/components/schemas/Uuid'
          description: Lesson/learning material dạng ví dụ mẫu gợi ý xem lại
    ExamAttemptAnalysis:
      type: object
      required:
        - attempt_id
        - objective_breakdown
        - wrong_items
        - review_suggestions
      properties:
        attempt_id:
          $ref: '#/components/schemas/Uuid'
        exam_session_id:
          $ref: '#/components/schemas/Uuid'
        score:
          type: number
        max_score:
          type: number
        score_scaled:
          type: number
          description: Điểm theo score_scale (mặc định thang 10)
        duration_ms:
          type: integer
          minimum: 0
        section_scores:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/ExamSectionScore'
        objective_breakdown:
          type: array
          maxItems: 200
          items:
            type: object
            required:
              - objective_id
              - correct
              - total
            properties:
              objective_id:
                $ref: '#/components/schemas/Uuid'
              correct:
                type: integer
                minimum: 0
              total:
                type: integer
                minimum: 1
              mastery_level:
                type:
                  - string
                  - 'null'
                enum:
                  - not_started
                  - developing
                  - approaching
                  - proficient
                  - mastered
                  - null
        wrong_items:
          type: array
          maxItems: 200
          items:
            type: object
            required:
              - position
              - question_version_id
            properties:
              position:
                type: integer
                minimum: 1
              question_version_id:
                $ref: '#/components/schemas/Uuid'
              question:
                $ref: '#/components/schemas/QuestionRender'
              response:
                $ref: '#/components/schemas/QuestionResponse'
              correct_option_ids:
                type: array
                maxItems: 20
                description: Chỉ khi show_correct_answers (câu có phương án)
                items:
                  type: string
                  maxLength: 64
              explanation:
                type:
                  - object
                  - 'null'
                additionalProperties: true
                description: richContent giải thích (chỉ khi show_explanations)
              feedback:
                $ref: '#/components/schemas/AnswerFeedback'
              objective_ids:
                type: array
                maxItems: 20
                items:
                  $ref: '#/components/schemas/Uuid'
        review_suggestions:
          type: array
          maxItems: 3
          items:
            type: object
            required:
              - objective_id
            properties:
              objective_id:
                $ref: '#/components/schemas/Uuid'
              correct_ratio:
                type: number
                minimum: 0
                maximum: 1
              kind:
                type: string
                enum:
                  - practice
                  - lesson
                  - question_set
                  - quest
              ref_id:
                $ref: '#/components/schemas/Uuid'
              title:
                type: string
                maxLength: 255
    ExamAccommodationsUpdate:
      type: object
      required:
        - accommodations
        - reason
      additionalProperties: false
      properties:
        accommodations:
          type: array
          maxItems: 200
          description: Danh sách đầy đủ sau khi lưu (thay thế); rỗng = bỏ mọi gia hạn
          items:
            $ref: '#/components/schemas/ExamAccommodation'
        reason:
          type: string
          minLength: 3
          maxLength: 500
    ExamPaper:
      type: object
      required:
        - exam_paper_id
        - variant_no
        - sections
      properties:
        exam_paper_id:
          $ref: '#/components/schemas/Uuid'
        variant_no:
          type: integer
          minimum: 1
        seed:
          type: string

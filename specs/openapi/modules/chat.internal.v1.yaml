openapi: 3.1.0
info:
  title: EduWorld module chat — Internal API
  version: 1.0.0
  description: |
    Hợp đồng facade của module `chat`, gọi **trong tiến trình** (ADR-0074, ADR-0040); `make gen` sinh kiểu DTO +
    interface strict-server vào `modules/chat/api/`, path `/internal/v1/...` chỉ là định danh operation.
    Module chat giữ quan hệ bạn bè, channel, tin nhắn, moderation. Hiện chỉ cung cấp interface platform ops; channel gameplay được mở/đóng theo event của module competition (ADR-0020 mục 6, ADR-0042).
  license:
    name: Proprietary — EduWorld
    identifier: LicenseRef-EduWorld-Proprietary
tags:
  - name: platform-ops
    description: Interface platform ops chuẩn (module identity điều phối Thùng rác, clone tenant, dọn/khôi phục học sinh, gộp/ẩn danh hóa user)
  - name: moderation
    description: Kiểm duyệt văn bản do học sinh tự đặt cho module khác (tên party/đội — MODERATION §1)
  - name: ops-reconcile
    description: Đối soát event liên module sau khôi phục một database (F134, BACKUP_RECOVERY §3.5) — chỉ ID event, không payload
paths:
  # BEGIN platform-ops (generated by scripts/openapi/sync-platform-ops.mjs — do not edit)
  /internal/v1/platform/tenant-clones/{job_id}/steps:
    post:
      tags:
        - platform-ops
      operationId: executeTenantCloneStep
      summary: Thực thi bước clone thuộc module này trong một job clone tenant (saga do module identity điều phối)
      description: |
        Clone sâu các tài nguyên thuộc module này từ tenant nguồn sang tenant đích (ADR-0029).
        Idempotent theo `(job_id, resource_type)`: gọi lại trả kết quả lần trước. Không bao giờ clone
        dữ liệu cá nhân/học tập của học sinh. Bản sao có `cloned_from_id`, `cloned_from_tenant_id`.
      x-allowed-callers:
        - identity
      x-context-required:
        - idempotency_key
      parameters:
        - $ref: common/internal-common.v1.yaml#/components/parameters/JobIdPath
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: common/internal-common.v1.yaml#/components/schemas/TenantCloneStepRequest
      responses:
        '200':
          description: Kết quả bước clone
          content:
            application/json:
              schema:
                $ref: common/internal-common.v1.yaml#/components/schemas/TenantCloneStepResult
        '400':
          $ref: common/internal-common.v1.yaml#/components/responses/BadRequest
        '401':
          $ref: common/internal-common.v1.yaml#/components/responses/Unauthorized
        '403':
          $ref: common/internal-common.v1.yaml#/components/responses/CallerNotAllowed
        '409':
          $ref: common/internal-common.v1.yaml#/components/responses/Conflict
        '422':
          $ref: common/internal-common.v1.yaml#/components/responses/ValidationFailed
        '503':
          $ref: common/internal-common.v1.yaml#/components/responses/DependencyUnavailable
  /internal/v1/platform/trash:
    get:
      tags:
        - platform-ops
      operationId: listTrash
      summary: Liệt kê bản ghi đã soft-delete của module này (Thùng rác, ADR-0028)
      description: Module identity gộp kết quả từ mọi module để trả cho `/api/v1/admin/trash` và `/api/v1/tenant/trash`.
      x-allowed-callers:
        - identity
      parameters:
        - name: tenant_ids
          in: query
          required: false
          description: Lọc tenant. Vắng mặt = mọi tenant (chỉ hợp lệ khi người gọi gốc là System Admin, kiểm tra bởi module identity).
          style: form
          explode: true
          schema:
            type: array
            maxItems: 100
            items:
              type: string
              format: uuid
        - name: resource_type
          in: query
          required: false
          schema:
            $ref: common/internal-common.v1.yaml#/components/schemas/ResourceType
        - $ref: common/internal-common.v1.yaml#/components/parameters/Cursor
        - $ref: common/internal-common.v1.yaml#/components/parameters/Limit
      responses:
        '200':
          description: Một trang bản ghi đã xóa
          content:
            application/json:
              schema:
                $ref: common/internal-common.v1.yaml#/components/schemas/TrashPage
        '401':
          $ref: common/internal-common.v1.yaml#/components/responses/Unauthorized
        '403':
          $ref: common/internal-common.v1.yaml#/components/responses/CallerNotAllowed
        '422':
          $ref: common/internal-common.v1.yaml#/components/responses/ValidationFailed
  /internal/v1/platform/trash/{resource_type}/{resource_id}:restore:
    post:
      tags:
        - platform-ops
      operationId: restoreTrashItem
      summary: Khôi phục một bản ghi đã soft-delete (đặt lại deleted_at = NULL)
      x-allowed-callers:
        - identity
      x-context-required:
        - tenant_scope
        - idempotency_key
      parameters:
        - $ref: common/internal-common.v1.yaml#/components/parameters/ResourceTypePath
        - $ref: common/internal-common.v1.yaml#/components/parameters/ResourceIdPath
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: common/internal-common.v1.yaml#/components/schemas/RestoreRequest
      responses:
        '200':
          description: Đã khôi phục
          content:
            application/json:
              schema:
                $ref: common/internal-common.v1.yaml#/components/schemas/RestoreResult
        '401':
          $ref: common/internal-common.v1.yaml#/components/responses/Unauthorized
        '403':
          $ref: common/internal-common.v1.yaml#/components/responses/CallerNotAllowed
        '404':
          $ref: common/internal-common.v1.yaml#/components/responses/NotFound
        '409':
          $ref: common/internal-common.v1.yaml#/components/responses/Conflict
  /internal/v1/platform/tenant-assignments:
    get:
      tags:
        - platform-ops
      operationId: listResourceAssignments
      summary: Liệt kê assignment active của một tài nguyên platform (gán cho tenant, ADR-0029)
      description: |
        Đọc `infra.tenant_resource_assignments` của module sở hữu tài nguyên cho một `(resource_type, resource_id)`.
        Chỉ module identity gọi khi trả `/api/v1/admin/tenant-assignments`; Principal gốc phải là nhân sự platform có
        `platform.tenant_data.assign`.
      x-allowed-callers:
        - identity
      parameters:
        - name: resource_type
          in: query
          required: true
          schema:
            $ref: common/internal-common.v1.yaml#/components/schemas/ResourceType
        - name: resource_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - $ref: common/internal-common.v1.yaml#/components/parameters/Cursor
        - $ref: common/internal-common.v1.yaml#/components/parameters/Limit
      responses:
        '200':
          description: Một trang assignment active
          content:
            application/json:
              schema:
                $ref: common/internal-common.v1.yaml#/components/schemas/TenantAssignmentList
        '401':
          $ref: common/internal-common.v1.yaml#/components/responses/Unauthorized
        '403':
          $ref: common/internal-common.v1.yaml#/components/responses/CallerNotAllowed
        '422':
          $ref: common/internal-common.v1.yaml#/components/responses/ValidationFailed
  /internal/v1/platform/tenant-assignments:apply:
    post:
      tags:
        - platform-ops
      operationId: applyTenantAssignments
      summary: Gán một tài nguyên platform cho các tenant (tạo assignment active còn thiếu, ADR-0029)
      description: |
        Bước của luồng gán do module identity điều phối. Tài nguyên phải là `owner_scope = platform`, chưa soft-delete;
        mỗi tenant phải `active` trong `ref.tenants` của module nhận. Một phần tử lỗi → `422 VALIDATION_FAILED` liệt kê
        từng phần tử, không ghi gì. Cặp (tài nguyên, tenant) đã có assignment active không tạo dòng mới. Idempotent theo
        `Idempotency-Key`: gọi lại trả kết quả lần trước. Audit `tenant_data.assigned` (actor = Principal gốc) qua outbox.
      x-allowed-callers:
        - identity
      x-context-required:
        - idempotency_key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: common/internal-common.v1.yaml#/components/schemas/TenantAssignmentApplyRequest
      responses:
        '200':
          description: Assignment active của tài nguyên cho các tenant yêu cầu
          content:
            application/json:
              schema:
                $ref: common/internal-common.v1.yaml#/components/schemas/TenantAssignmentList
        '401':
          $ref: common/internal-common.v1.yaml#/components/responses/Unauthorized
        '403':
          $ref: common/internal-common.v1.yaml#/components/responses/CallerNotAllowed
        '409':
          $ref: common/internal-common.v1.yaml#/components/responses/Conflict
        '422':
          $ref: common/internal-common.v1.yaml#/components/responses/ValidationFailed
  /internal/v1/platform/tenant-assignments:revoke:
    post:
      tags:
        - platform-ops
      operationId: revokeTenantAssignments
      summary: Gỡ gán một tài nguyên platform khỏi các tenant (soft-delete assignment, ADR-0028/0029)
      description: |
        Soft-delete assignment active của các tenant yêu cầu; tenant không còn thấy tài nguyên ở lần đọc kế tiếp, lượt
        học/attempt đã ghim version giữ nguyên. Tenant không có assignment active được bỏ qua. Idempotent theo
        `Idempotency-Key`. Audit `tenant_data.unassigned` (actor = Principal gốc) qua outbox.
      x-allowed-callers:
        - identity
      x-context-required:
        - idempotency_key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: common/internal-common.v1.yaml#/components/schemas/TenantAssignmentRevokeRequest
      responses:
        '200':
          description: Assignment đã gỡ (status `revoked`)
          content:
            application/json:
              schema:
                $ref: common/internal-common.v1.yaml#/components/schemas/TenantAssignmentList
        '401':
          $ref: common/internal-common.v1.yaml#/components/responses/Unauthorized
        '403':
          $ref: common/internal-common.v1.yaml#/components/responses/CallerNotAllowed
        '422':
          $ref: common/internal-common.v1.yaml#/components/responses/ValidationFailed
  /internal/v1/platform/students/{student_id}:cleanup:
    post:
      tags:
        - platform-ops
      operationId: cleanupStudentData
      summary: Soft-delete dữ liệu của học sinh trong module này khi bị dọn do không đăng nhập (ADR-0032)
      description: |
        Bước của saga dọn học sinh do module identity điều phối. Chỉ soft-delete (ADR-0028), đặt
        `delete_reason = inactive_cleanup`. Module trả `blocked` nếu học sinh đang có hoạt động không
        được dọn (trận đang chạy, bài kiểm tra chưa nộp, moderation case mở) để saga hủy và bù trừ.
      x-allowed-callers:
        - identity
      x-context-required:
        - tenant_scope
        - idempotency_key
      parameters:
        - $ref: common/internal-common.v1.yaml#/components/parameters/StudentIdPath
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: common/internal-common.v1.yaml#/components/schemas/StudentCleanupRequest
      responses:
        '200':
          description: Kết quả bước dọn
          content:
            application/json:
              schema:
                $ref: common/internal-common.v1.yaml#/components/schemas/StudentLifecycleResult
        '401':
          $ref: common/internal-common.v1.yaml#/components/responses/Unauthorized
        '403':
          $ref: common/internal-common.v1.yaml#/components/responses/CallerNotAllowed
        '404':
          $ref: common/internal-common.v1.yaml#/components/responses/NotFound
  /internal/v1/platform/students/{student_id}:restore:
    post:
      tags:
        - platform-ops
      operationId: restoreStudentData
      summary: Khôi phục dữ liệu học sinh đã bị dọn khi học sinh đăng nhập lại (ADR-0032 mục 5)
      x-allowed-callers:
        - identity
      x-context-required:
        - tenant_scope
        - idempotency_key
      parameters:
        - $ref: common/internal-common.v1.yaml#/components/parameters/StudentIdPath
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: common/internal-common.v1.yaml#/components/schemas/StudentRestoreRequest
      responses:
        '200':
          description: Kết quả bước khôi phục
          content:
            application/json:
              schema:
                $ref: common/internal-common.v1.yaml#/components/schemas/StudentLifecycleResult
        '401':
          $ref: common/internal-common.v1.yaml#/components/responses/Unauthorized
        '403':
          $ref: common/internal-common.v1.yaml#/components/responses/CallerNotAllowed
        '404':
          $ref: common/internal-common.v1.yaml#/components/responses/NotFound
  /internal/v1/platform/users/{user_id}:merge-into:
    post:
      tags:
        - platform-ops
      operationId: mergeUserData
      summary: Chuyển dữ liệu của một user sang user đích khi gộp tài khoản trùng (module identity điều phối)
      description: |
        Bước của saga gộp tài khoản (ACCOUNT_PROVISIONING §7b, IDENTITY_MAPPING). Module cập nhật mọi tham chiếu
        `user_id` nguồn sang `target_user_id` trong cùng tenant; bản ghi nguồn bị soft-delete (ADR-0028).
        Idempotent theo `merge_id`. Trả `blocked` nếu có xung đột không tự gộp được (vd. hai attempt cùng lúc).
      x-allowed-callers:
        - identity
      x-context-required:
        - tenant_scope
        - idempotency_key
      parameters:
        - $ref: common/internal-common.v1.yaml#/components/parameters/UserIdPath
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: common/internal-common.v1.yaml#/components/schemas/UserMergeRequest
      responses:
        '200':
          description: Kết quả bước gộp
          content:
            application/json:
              schema:
                $ref: common/internal-common.v1.yaml#/components/schemas/UserLifecycleResult
        '401':
          $ref: common/internal-common.v1.yaml#/components/responses/Unauthorized
        '403':
          $ref: common/internal-common.v1.yaml#/components/responses/CallerNotAllowed
        '404':
          $ref: common/internal-common.v1.yaml#/components/responses/NotFound
        '409':
          $ref: common/internal-common.v1.yaml#/components/responses/Conflict
  /internal/v1/platform/users/{user_id}:anonymize:
    post:
      tags:
        - platform-ops
      operationId: anonymizeUserData
      summary: Ẩn danh hóa dữ liệu cá nhân của user trong module này (yêu cầu xóa dữ liệu = ẩn danh hóa, ADR-0028 mục 8)
      description: |
        Ghi đè trường PII (tên hiển thị, nội dung tự do do user tạo, metadata thiết bị…) bằng giá trị ẩn danh,
        giữ bản ghi để thống kê và tính toàn vẹn. Không xóa dòng. Idempotent theo `erasure_request_id`.
      x-allowed-callers:
        - identity
      x-context-required:
        - tenant_scope
        - idempotency_key
      parameters:
        - $ref: common/internal-common.v1.yaml#/components/parameters/UserIdPath
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: common/internal-common.v1.yaml#/components/schemas/UserAnonymizeRequest
      responses:
        '200':
          description: Kết quả bước ẩn danh hóa
          content:
            application/json:
              schema:
                $ref: common/internal-common.v1.yaml#/components/schemas/UserLifecycleResult
        '401':
          $ref: common/internal-common.v1.yaml#/components/responses/Unauthorized
        '403':
          $ref: common/internal-common.v1.yaml#/components/responses/CallerNotAllowed
        '404':
          $ref: common/internal-common.v1.yaml#/components/responses/NotFound
  # END platform-ops
  /internal/v1/moderation/display-text:check:
    post:
      tags: [moderation]
      operationId: moderateDisplayText
      summary: Kiểm duyệt tên hiển thị do học sinh tự đặt (tên party, tên đội) qua pipeline của module chat
      description: |
        Gọi trong tiến trình trước khi lưu tên (MODERATION §1, AGENTS R15). Chỉ trả quyết định `allowed`/`blocked`:
        **không** trả từ đã khớp, vị trí khớp hay danh mục (R15). Bên gọi dùng deadline của request; hết deadline hoặc
        `503` → bên gọi dùng tên mặc định sinh tự động (F100 research R2). Hiện thực bởi F116 (pipeline kiểm duyệt).
      x-allowed-callers: [competition]
      x-context-required: [tenant_scope]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DisplayTextCheckRequest' }
      responses:
        '200':
          description: Quyết định kiểm duyệt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DisplayTextCheckResult' }
        '401': { $ref: 'common/internal-common.v1.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'common/internal-common.v1.yaml#/components/responses/CallerNotAllowed' }
        '422': { $ref: 'common/internal-common.v1.yaml#/components/responses/ValidationFailed' }
  /internal/v1/moderation/texts:screen:
    post:
      tags: [moderation]
      operationId: screenText
      summary: Kiểm tra từ nhạy cảm của văn bản nhà trường nhập (tên, mô tả sự kiện trường) qua pipeline của module chat
      description: |
        Gọi trong tiến trình trước khi lưu văn bản tenant nhập cho sự kiện trường (EVENT_SEASON_SYSTEM §10, F077-AC-23) và tên thử thách khối/giải trường (F107,
        AGENTS R15). Cùng chuẩn hóa, danh mục hiệu lực (platform + tenant, cài đặt danh mục, công tắc hiệu lực; PII luôn chạy)
        như tên hiển thị. Chỉ trả `allowed` và **chỉ số** các văn bản vi phạm (`violations[]`): **không** trả từ đã khớp,
        vị trí khớp hay danh mục (R15). Lỗi hoặc hết deadline → bên gọi trả `503 UNAVAILABLE` và không lưu (không fail-open).
      x-allowed-callers: [game, competition]
      x-context-required: [tenant_scope]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TextScreenRequest' }
      responses:
        '200':
          description: Kết quả kiểm tra
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TextScreenResult' }
        '401': { $ref: 'common/internal-common.v1.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'common/internal-common.v1.yaml#/components/responses/CallerNotAllowed' }
        '422': { $ref: 'common/internal-common.v1.yaml#/components/responses/ValidationFailed' }

  # BEGIN ops-reconcile (generated by scripts/openapi/sync-platform-ops.mjs — do not edit)
  /internal/v1/ops/outbox-events:
    get:
      tags:
        - ops-reconcile
      operationId: listOutboxEventIds
      summary: Liệt kê ID event trong `infra.outbox_events` của module này trong một cửa sổ thời gian (đối soát F134)
      description: |
        Gọi bởi lệnh `worker reconcile --module=<module được khôi phục>` (F134-AC-02) để so `processed_events` của module được
        khôi phục với outbox của module nguồn. Cửa sổ lọc theo thời điểm trong UUIDv7 của `event_id` (`from` ≤ t < `to`), sắp theo
        `event_id`; `event_types` (tùy chọn) thu hẹp loại event. Ngữ cảnh: PlatformScope của job (`tenancy.Bypass`
        lý do `platform_job`, có audit + metric). Không bao giờ trả `envelope`/payload.
      x-allowed-callers:
        - identity
        - learning
        - game
        - competition
        - chat
      x-context-required:
        - tenant_scope
      parameters:
        - $ref: common/internal-common.v1.yaml#/components/parameters/ReconcileFrom
        - $ref: common/internal-common.v1.yaml#/components/parameters/ReconcileTo
        - name: event_types
          in: query
          required: false
          description: Loại event cần liệt kê; vắng mặt = mọi loại (consumer đăng ký subject wildcard)
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 100
            items:
              type: string
              maxLength: 64
              pattern: ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$
        - $ref: common/internal-common.v1.yaml#/components/parameters/Cursor
        - $ref: common/internal-common.v1.yaml#/components/parameters/ReconcileLimit
      responses:
        '200':
          description: Một trang ID event của outbox
          content:
            application/json:
              schema:
                $ref: common/internal-common.v1.yaml#/components/schemas/OutboxEventIdPage
        '401':
          $ref: common/internal-common.v1.yaml#/components/responses/Unauthorized
        '403':
          $ref: common/internal-common.v1.yaml#/components/responses/CallerNotAllowed
        '422':
          $ref: common/internal-common.v1.yaml#/components/responses/ValidationFailed
        '503':
          $ref: common/internal-common.v1.yaml#/components/responses/DependencyUnavailable
  /internal/v1/ops/processed-events:
    get:
      tags:
        - ops-reconcile
      operationId: listProcessedEventIds
      summary: Liệt kê ID event của một module nguồn mà consumer của module này đã xử lý hoặc đưa vào DLQ (đối soát F134)
      description: |
        Gọi bởi lệnh `worker reconcile --module=<module được khôi phục>` (F134-AC-01): trả danh sách consumer của module này đăng ký
        event của `source_module` (`consumers[]`, kèm loại event) và các dòng `infra.processed_events` (`status = processed`) cùng
        `infra.dead_letters` (`status = dead_lettered`) của các consumer đó, lọc theo thời điểm UUIDv7 của `event_id`, sắp theo
        `(consumer, event_id, status)`. Ngữ cảnh như `listOutboxEventIds`.
      x-allowed-callers:
        - identity
        - learning
        - game
        - competition
        - chat
      x-context-required:
        - tenant_scope
      parameters:
        - name: source_module
          in: query
          required: true
          schema:
            $ref: common/internal-common.v1.yaml#/components/schemas/ReconcileModule
        - $ref: common/internal-common.v1.yaml#/components/parameters/ReconcileFrom
        - $ref: common/internal-common.v1.yaml#/components/parameters/ReconcileTo
        - $ref: common/internal-common.v1.yaml#/components/parameters/Cursor
        - $ref: common/internal-common.v1.yaml#/components/parameters/ReconcileLimit
      responses:
        '200':
          description: Một trang ID event đã xử lý/DLQ
          content:
            application/json:
              schema:
                $ref: common/internal-common.v1.yaml#/components/schemas/ProcessedEventIdPage
        '401':
          $ref: common/internal-common.v1.yaml#/components/responses/Unauthorized
        '403':
          $ref: common/internal-common.v1.yaml#/components/responses/CallerNotAllowed
        '422':
          $ref: common/internal-common.v1.yaml#/components/responses/ValidationFailed
        '503':
          $ref: common/internal-common.v1.yaml#/components/responses/DependencyUnavailable
  # END ops-reconcile

components:
  schemas:
    TextScreenRequest:
      type: object
      additionalProperties: false
      required: [tenant_id, locale, texts]
      properties:
        tenant_id: { type: string, format: uuid }
        locale: { type: string, enum: [vi, en] }
        texts:
          type: array
          minItems: 1
          maxItems: 10
          items: { type: string, minLength: 1, maxLength: 4000 }
      examples:
        - { tenant_id: 0193a5f4-6c1e-7b2a-9d1f-000000000001, locale: vi, texts: [Tuần lễ Toán học, Cả trường cùng giải toán] }
    TextScreenResult:
      type: object
      additionalProperties: false
      required: [allowed, violations]
      properties:
        allowed: { type: boolean }
        violations:
          type: array
          maxItems: 10
          description: Chỉ số (0-based) của các văn bản vi phạm — không có từ khớp, vị trí hay danh mục (R15)
          items: { type: integer, minimum: 0, maximum: 9 }
      examples:
        - { allowed: true, violations: [] }
    DisplayTextCheckRequest:
      type: object
      additionalProperties: false
      required: [text, context, tenant_id, author_id]
      properties:
        text: { type: string, minLength: 1, maxLength: 255 }
        context: { type: string, enum: [party_name, team_name] }
        tenant_id: { type: string, format: uuid }
        author_id: { type: string, format: uuid }
      examples:
        - { text: Nhóm Sao Băng, context: party_name, tenant_id: 0193a5f4-6c1e-7b2a-9d1f-000000000001, author_id: 0193a5f4-6c1e-7b2a-9d1f-000000000005 }
    DisplayTextCheckResult:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision: { type: string, enum: [allowed, blocked] }
      examples:
        - { decision: allowed }

    ValidationProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            errors:
              type: array
              items:
                type: object
                required:
                  - field
                  - code
                properties:
                  field:
                    type: string
                    maxLength: 64
                  code:
                    type: string
                    maxLength: 64
                  message:
                    type: string
                    maxLength: 1000
    PartySettingsUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 40
        visibility:
          $ref: '#/components/schemas/PartyVisibility'
        invitation_policy:
          type: string
          enum:
            - leader_only
            - members
        max_members:
          type: integer
          minimum: 2
          maximum: 8
    PartyActivitySelect:
      type: object
      required:
        - activity_type
        - activity_ref
        - expected_version
      properties:
        activity_type:
          $ref: '#/components/schemas/PartyActivityType'
        activity_ref:
          $ref: '#/components/schemas/PartyActivityRef'
        game_mode:
          type: string
          maxLength: 64
          pattern: ^[a-z0-9_]{1,64}$
        expected_version:
          type: integer
          minimum: 0
          description: state_version client đang thấy (F101-AC-04)
    PartySessionStartRequest:
      type: object
      required:
        - expected_version
      properties:
        expected_version:
          type: integer
          minimum: 0
    PartySessionStart:
      type: object
      required:
        - room_id
        - game_session_ref
        - members
      properties:
        room_id:
          $ref: '#/components/schemas/Uuid'
        room_type:
          type: string
          enum:
            - private_instance
            - boss
        party_activity_id:
          $ref: '#/components/schemas/Uuid'
        activity_type:
          $ref: '#/components/schemas/PartyActivityType'
        activity_ref:
          $ref: '#/components/schemas/PartyActivityRef'
        scene_ref:
          type: string
          maxLength: 255
        game_session_ref:
          $ref: '#/components/schemas/Uuid'
        members:
          type: array
          items:
            $ref: '#/components/schemas/Uuid'
        excluded_members:
          type: array
          description: Thành viên không đủ điều kiện (policy) kèm lý do
          items:
            type: object
            properties:
              student_id:
                $ref: '#/components/schemas/Uuid'
              reason:
                type: string
                maxLength: 1000
    PartyStartProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            ineligible_members:
              type: array
              maxItems: 8
              items:
                $ref: '#/components/schemas/PartyIneligibleMember'
    PartyIneligibleMember:
      type: object
      required:
        - student_id
        - reason_code
      properties:
        student_id:
          $ref: '#/components/schemas/Uuid'
        reason_code:
          type: string
          enum:
            - grade_not_allowed
            - grade_band_mismatch
            - prerequisite_missing
            - area_locked
            - attempt_limit
            - sanctioned
            - not_online
        requirement:
          type: string
          maxLength: 255
          description: Yêu cầu của hoạt động (vd. "grade_levels:4"), không phải dữ liệu của học sinh (R16)
    PartyEligibleActivity:
      type: object
      required:
        - activity_type
        - activity_ref
        - min_members
        - max_members
        - all_eligible
        - members
      properties:
        activity_type:
          $ref: '#/components/schemas/PartyActivityType'
        activity_ref:
          $ref: '#/components/schemas/PartyActivityRef'
        title:
          $ref: '#/components/schemas/LocalizedName'
        min_members:
          type: integer
          minimum: 1
          maximum: 8
        max_members:
          type: integer
          minimum: 1
          maximum: 8
        all_eligible:
          type: boolean
        members:
          type: array
          maxItems: 8
          items:
            type: object
            required:
              - student_id
              - eligible
            properties:
              student_id:
                $ref: '#/components/schemas/Uuid'
              eligible:
                type: boolean
              reason_code:
                type: string
                enum:
                  - grade_not_allowed
                  - grade_band_mismatch
                  - prerequisite_missing
                  - area_locked
                  - attempt_limit
                  - sanctioned
                  - not_online
              requirement:
                type: string
                maxLength: 255
    LocalizedName:
      type: object
      description: Tên/nhãn hiển thị song ngữ bắt buộc cả vi và en (văn bản game — ADR-0056 mục 2)
      required:
        - vi
        - en
      additionalProperties: false
      properties:
        vi:
          type: string
          minLength: 1
          maxLength: 255
        en:
          type: string
          minLength: 1
          maxLength: 255
    PartyInvitation:
      type: object
      required:
        - invitation_id
        - party_id
        - inviter
        - status
        - expires_at
      properties:
        invitation_id:
          $ref: '#/components/schemas/Uuid'
        party_id:
          $ref: '#/components/schemas/Uuid'
        party_name:
          type: string
          maxLength: 128
        inviter:
          $ref: '#/components/schemas/PlayerCard'
        invitee_id:
          $ref: '#/components/schemas/Uuid'
        status:
          $ref: '#/components/schemas/InvitationStatus'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        expires_at:
          $ref: '#/components/schemas/Timestamp'
    PlayerCard:
      type: object
      description: Thông tin công khai tối thiểu của người chơi khác (không tên thật, không trường nếu liên trường)
      required:
        - user_id
        - nickname
      properties:
        user_id:
          $ref: '#/components/schemas/Uuid'
        nickname:
          type: string
          maxLength: 32
        level:
          type: integer
        avatar_config:
          $ref: '#/components/schemas/AvatarConfig'
        presence:
          type: string
          enum:
            - offline
            - online
            - in_activity
            - in_match
            - away
          description: PresenceStatus (MULTIPLAYER_GAMEPLAY §5, enum chung với AsyncAPI)
    InvitationStatus:
      type: string
      enum:
        - pending
        - accepted
        - rejected
        - expired
        - cancelled
    Room:
      type: object
      required:
        - room_id
        - room_type
        - status
      properties:
        room_id:
          $ref: '#/components/schemas/Uuid'
        room_type:
          type: string
          enum:
            - hub_instance
            - private_instance
            - battle
            - coop
            - lobby
        area_id:
          type: string
          maxLength: 64
        capacity:
          type: integer
        status:
          type: string
          enum:
            - open
            - running
            - closing
            - closed
        member_count:
          type: integer
    Duel:
      type: object
      required:
        - duel_id
        - challenger_id
        - opponent_id
        - subject_id
        - status
        - expires_at
      properties:
        duel_id:
          $ref: '#/components/schemas/Uuid'
        challenger_id:
          $ref: '#/components/schemas/Uuid'
        opponent_id:
          $ref: '#/components/schemas/Uuid'
        subject_id:
          $ref: '#/components/schemas/Uuid'
        topic_id:
          $ref: '#/components/schemas/Uuid'
        status:
          type: string
          enum:
            - pending
            - accepted
            - declined
            - expired
            - cancelled
        match_id:
          $ref: '#/components/schemas/Uuid'
        expires_at:
          $ref: '#/components/schemas/Timestamp'
    MatchmakingTicketCreate:
      type: object
      required:
        - mode
        - subject_id
      properties:
        mode:
          $ref: '#/components/schemas/MatchMode'
        subject_id:
          $ref: '#/components/schemas/Uuid'
        topic_id:
          $ref: '#/components/schemas/Uuid'
        party_id:
          $ref: '#/components/schemas/Uuid'
        matchmaking_type:
          type: string
          description: '`friend` chỉ qua createDuel, `tournament` chỉ qua proposal trực tiếp của giải → 422 (F104-AC-18).'
          enum:
            - random
            - skill
            - grade
            - subject
            - topic
            - friend
            - team
            - tournament
          default: skill
        allow_fill:
          type: boolean
          default: false
          description: Ticket đội — cho phép ghép thêm ticket lẻ cùng hàng đợi để đủ đội (MATCHMAKING §8).
    MatchMode:
      type: string
      enum:
        - battle_1v1
        - team_battle
        - coop_challenge
        - timed_quiz
        - tournament
    MatchmakingTicket:
      type: object
      required:
        - ticket_id
        - status
        - mode
        - created_at
      properties:
        ticket_id:
          $ref: '#/components/schemas/Uuid'
        status:
          type: string
          enum:
            - queued
            - proposed
            - matched
            - cancelled
            - expired
        mode:
          $ref: '#/components/schemas/MatchMode'
        matchmaking_type:
          type: string
          enum:
            - random
            - skill
            - grade
            - subject
            - topic
            - team
        subject_id:
          $ref: '#/components/schemas/Uuid'
        topic_id:
          $ref: '#/components/schemas/Uuid'
        party_id:
          $ref: '#/components/schemas/Uuid'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        wait_seconds:
          type: integer
          minimum: 0
        estimated_wait_seconds:
          type: integer
        search_widened:
          type: boolean
          description: Đã nới cửa sổ rating (không bao giờ nới ràng buộc khối lớp).
        bot_offer_available:
          type: boolean
          description: Chờ quá mm_bot_after — có thể gọi startBotMatch.
        requeued:
          type: boolean
          description: Về lại hàng đợi sau khi proposal bị hủy, giữ thời gian chờ.
        cancel_reason:
          type: string
          enum:
            - user
            - party_changed
            - timeout
            - system
            - declined_proposal
        proposal_id:
          $ref: '#/components/schemas/Uuid'
        match_id:
          $ref: '#/components/schemas/Uuid'
          description: Bằng proposal_id của proposal đã được mọi bên chấp nhận.
    Match:
      type: object
      required:
        - match_id
        - mode
        - status
      properties:
        match_id:
          $ref: '#/components/schemas/Uuid'
        mode:
          $ref: '#/components/schemas/MatchMode'
        subject_id:
          $ref: '#/components/schemas/Uuid'
        grade_level:
          $ref: '#/components/schemas/GradeLevel'
        status:
          type: string
          enum:
            - proposed
            - lobby
            - running
            - completed
            - cancelled
            - aborted
        matchmaking_type:
          type: string
          enum:
            - random
            - skill
            - grade
            - subject
            - topic
            - friend
            - team
            - tournament
            - bot
        ranked:
          type: boolean
        is_bot:
          type: boolean
          description: Trận với bot luyện tập "Robot Học Giỏi" (unranked).
        room_id:
          $ref: '#/components/schemas/Uuid'
        started_at:
          $ref: '#/components/schemas/Timestamp'
        ended_at:
          $ref: '#/components/schemas/Timestamp'
        end_reason:
          type:
            - string
            - 'null'
          enum:
            - finished
            - abandon
            - forfeit
            - all_left
            - server_failure
            - plan_failure
            - null
          description: 'Lý do kết thúc (F105): finished, abandon (1v1 quá grace), forfeit (trận giải), all_left (cả hai rời → cancelled), server_failure/plan_failure (aborted, không tính rating).'
        rated:
          type: boolean
          description: 'Kết quả có tính rating (F106) hay không: ranked, completed, không bot, không trận giải, không sự cố server.'
        question_count:
          type: integer
          minimum: 0
          maximum: 30
        participants:
          type: array
          maxItems: 40
          items:
            type: object
            properties:
              player:
                $ref: '#/components/schemas/PlayerCard'
              team_no:
                type: integer
              outcome:
                type:
                  - string
                  - 'null'
                enum:
                  - win
                  - loss
                  - draw
                  - abandoned
                  - forfeit
                  - no_contest
                  - null
              score:
                type:
                  - number
                  - 'null'
              correct_count:
                type:
                  - integer
                  - 'null'
                minimum: 0
              competition_points:
                type:
                  - integer
                  - 'null'
        review:
          type: array
          maxItems: 30
          description: 'Xem lại câu hỏi sau trận (F105-AC-23): chỉ khi status = completed và người gọi là người tham gia hoặc nhân sự có lms.student.read trong trường của người tham gia; câu hỏi, đáp án đúng, giải thích lấy từ module learning (revealPlanItem), không bao giờ trước khi trận kết thúc (ADR-0016).'
          items:
            type: object
            required:
              - index
            properties:
              index:
                type: integer
                minimum: 0
              question:
                type: object
                description: Render payload của câu (không đáp án).
              correct_response:
                type:
                  - object
                  - 'null'
                description: Đáp án đúng (shape QuestionResponse) khi loại câu có đáp án cố định.
              explanation:
                type:
                  - string
                  - 'null'
                maxLength: 2000
              my_answer_correct:
                type:
                  - boolean
                  - 'null'
                description: null khi người xem không phải người chơi hoặc không trả lời.
              my_points:
                type:
                  - integer
                  - 'null'
    GradeLevel:
      type: integer
      minimum: 1
      maximum: 9
    CompetitionMode:
      type: object
      required:
        - mode
        - matchmaking_types
        - ranked
        - min_grade
        - subjects
      properties:
        mode:
          $ref: '#/components/schemas/MatchMode'
        matchmaking_types:
          type: array
          maxItems: 8
          items:
            type: string
            enum:
              - random
              - skill
              - grade
              - subject
              - topic
              - team
        ranked:
          type: boolean
          description: Mode có kiểu ghép tính rating.
        ranked_matchmaking_types:
          type: array
          maxItems: 8
          items:
            type: string
            enum:
              - random
              - skill
              - grade
              - subject
              - topic
              - team
        min_grade:
          $ref: '#/components/schemas/GradeLevel'
        subjects:
          type: array
          maxItems: 50
          description: Môn khả dụng cho khối; rỗng = cấu hình chưa giới hạn môn.
          items:
            $ref: '#/components/schemas/Uuid'
    PageInfo:
      type: object
      required:
        - has_more
        - limit
      properties:
        next_cursor:
          type:
            - string
            - 'null'
          maxLength: 512
        has_more:
          type: boolean
        limit:
          type: integer
    Rating:
      type: object
      description: |
        Tier thi đấu của chính học sinh theo mode × môn × mùa (ADR-0018, COMPETITION_SYSTEM §8.2). Không bao giờ chứa số
        rating/RD thô (F106-AC-07); không phải chỉ số học tập (F106-AC-09).
      required:
        - mode
        - subject_id
        - season_id
        - provisional
        - provisional_games_required
        - games_played
      properties:
        mode:
          $ref: '#/components/schemas/MatchMode'
        subject_id:
          $ref: '#/components/schemas/Uuid'
        season_id:
          $ref: '#/components/schemas/Uuid'
        tier_code:
          type:
            - string
            - 'null'
          maxLength: 64
          description: null khi còn provisional
        tier_name:
          type:
            - string
            - 'null'
          maxLength: 128
          description: Tên tier theo Accept-Language (Ranking Rules `tiers`)
        peak_tier_code:
          type:
            - string
            - 'null'
          maxLength: 64
          description: Tier cao nhất đạt trong mùa
        provisional:
          type: boolean
          description: '"Đang xếp hạng (x/N)" — `games_played`/`provisional_games_required`'
        provisional_games_required:
          type: integer
          minimum: 1
        games_played:
          type: integer
          minimum: 0
    Season:
      type: object
      required:
        - season_id
        - code
        - name
        - starts_at
        - ends_at
        - status
      properties:
        season_id:
          $ref: '#/components/schemas/Uuid'
        code:
          type: string
          maxLength: 64
        name:
          type: string
          maxLength: 128
        theme_code:
          type:
            - string
            - 'null'
          maxLength: 64
        starts_at:
          $ref: '#/components/schemas/Timestamp'
        ends_at:
          $ref: '#/components/schemas/Timestamp'
        status:
          type: string
          enum:
            - scheduled
            - active
            - ended
        my_peak_tier_code:
          type:
            - string
            - 'null'
          maxLength: 64
          description: 'Chỉ cho học sinh: tier cao nhất của chính em trong mùa'
    Tournament:
      allOf:
        - $ref: '#/components/schemas/TournamentCreate'
        - type: object
          required:
            - tournament_id
            - status
          properties:
            tournament_id:
              $ref: '#/components/schemas/Uuid'
            status:
              type: string
              enum:
                - draft
                - registration
                - seeded
                - running
                - completed
                - cancelled
            entry_count:
              type: integer
    TournamentCreate:
      type: object
      description: |
        Giải đấu luôn được tạo từ tournament template của platform; tenant tạo qua POST /lms/challenges (ADR-0027).
        Không có giải cấp lớp (ADR-0095): giải khối của trường = `scope_type = school` + `grade_level`.
      required:
        - template_id
        - name
        - format
        - scope_type
        - scope_id
        - subject_id
        - registration_closes_at
      properties:
        template_id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
          maxLength: 80
        format:
          type: string
          enum:
            - single_elim
            - double_elim
            - round_robin
            - team
        scope_type:
          type: string
          enum:
            - school
            - organization
        scope_id:
          $ref: '#/components/schemas/Uuid'
        subject_id:
          $ref: '#/components/schemas/Uuid'
        grade_level:
          description: Khối của giải (giải khối của trường khi `scope_type = school`)
          $ref: '#/components/schemas/GradeLevel'
        registration_closes_at:
          $ref: '#/components/schemas/Timestamp'
        starts_at:
          $ref: '#/components/schemas/Timestamp'
        max_entries:
          type: integer
          minimum: 2
          maximum: 256
    LeaderboardSummary:
      type: object
      required:
        - leaderboard_id
        - code
        - title
        - metric
        - scope_type
        - period
      properties:
        leaderboard_id:
          $ref: '#/components/schemas/Uuid'
        code:
          type: string
          maxLength: 64
        title:
          type: string
          maxLength: 128
        metric:
          $ref: '#/components/schemas/LeaderboardMetric'
        scope_type:
          $ref: '#/components/schemas/LeaderboardScopeType'
        period:
          type: string
          enum:
            - daily
            - weekly
            - monthly
            - season
            - all_time
        scope_id:
          type:
            - string
            - 'null'
          format: uuid
          description: Phạm vi chứa người xem (trường/tenant); null với friends
        grade_level:
          type:
            - integer
            - 'null'
          minimum: 1
          maximum: 9
        filters:
          $ref: '#/components/schemas/LeaderboardFilters'
    LeaderboardMetric:
      type: string
      description: Không có Learning Score/Mastery; `xp` chỉ scope friends; `grade_goal` là mục tiêu tập thể của khối (ADR-0095), không xếp hạng
      enum:
        - competition_points
        - effort_points
        - grade_goal
        - xp
        - quest_completed
        - rating
        - team_points
    LeaderboardScopeType:
      type: string
      description: Không có bảng cấp lớp (ADR-0095); `grade` = một khối trong một trường
      enum:
        - global
        - tenant
        - school
        - grade
        - friends
        - team
        - tournament
    LeaderboardFilters:
      type: object
      properties:
        subject_id:
          type:
            - string
            - 'null'
          format: uuid
        topic_id:
          type:
            - string
            - 'null'
          format: uuid
        mode:
          type:
            - string
            - 'null'
          maxLength: 64
    LeaderboardPage:
      type: object
      required:
        - leaderboard_id
        - period_key
        - entries
      properties:
        leaderboard_id:
          $ref: '#/components/schemas/Uuid'
        scope_type:
          $ref: '#/components/schemas/LeaderboardScopeType'
        scope_id:
          type:
            - string
            - 'null'
          format: uuid
        metric:
          $ref: '#/components/schemas/LeaderboardMetric'
        period:
          type: string
          enum:
            - daily
            - weekly
            - monthly
            - season
            - all_time
        period_key:
          type: string
          maxLength: 64
        filters:
          $ref: '#/components/schemas/LeaderboardFilters'
        visibility:
          type: string
          enum:
            - ranked
            - top_n_percentile
            - grade_goal
          description: 'Theo khối người xem (leaderboard_visibility): grade_goal (lớp 1–3 và mọi mục tiêu của khối), top_n_percentile (lớp 4–5), ranked (lớp 6–9, nhân sự)'
        stale:
          type: boolean
          description: true khi bảng đang được dựng lại từ sổ cái (F106-AC-14)
        entries:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/LeaderboardEntry'
        me:
          type:
            - object
            - 'null'
          properties:
            rank:
              type:
                - integer
                - 'null'
              minimum: 1
              description: null khi ngoài top của lớp 4–5 (xem percentile_bucket)
            value:
              type:
                - number
                - 'null'
            tier_code:
              type:
                - string
                - 'null'
              maxLength: 64
            percentile_bucket:
              type:
                - integer
                - 'null'
              minimum: 1
              maximum: 100
              description: '"Em đang ở nhóm X%" (lớp 4–5 ngoài top 10): 10, 25, 50 hoặc 100'
        around_me:
          type: array
          maxItems: 7
          items:
            $ref: '#/components/schemas/LeaderboardEntry'
        grade_goal:
          $ref: '#/components/schemas/GradeGoal'
        page:
          $ref: '#/components/schemas/PageInfo'
    LeaderboardEntry:
      type: object
      required:
        - rank
        - player
      properties:
        rank:
          type: integer
          minimum: 1
        player:
          $ref: '#/components/schemas/PlayerCard'
        value:
          type: number
          description: Không có với metric rating (chỉ tier + thứ hạng)
        tier_code:
          type:
            - string
            - 'null'
          maxLength: 64
          description: Chỉ metric rating
        is_me:
          type: boolean
    GradeGoal:
      type: object
      description: Mục tiêu tập thể của khối trong trường (ADR-0095) — không thứ hạng, không nickname/tên học sinh khác
      required:
        - grade_level
        - current
        - target
      properties:
        grade_level:
          type: integer
          minimum: 1
          maximum: 9
        current:
          type: number
          minimum: 0
        target:
          type: number
          minimum: 0
        reached:
          type: boolean
        my_contribution:
          type:
            - number
            - 'null'
          minimum: 0
          description: Phần đóng góp của chính học sinh xem (null với nhân sự)
        contributors_count:
          type:
            - integer
            - 'null'
          minimum: 0
          description: null khi < analytics_min_cell_size học sinh (ẩn ô nhỏ)
    LeaderboardPeriod:
      type: object
      required:
        - period_key
        - entries
      properties:
        period_key:
          type: string
          maxLength: 64
        captured_at:
          $ref: '#/components/schemas/Timestamp'
        entries:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/LeaderboardEntry'
        grade_goal:
          $ref: '#/components/schemas/GradeGoal'
    ContentStatus:
      type: string
      enum:
        - draft
        - in_review
        - approved
        - published
        - archived
        - rejected
    GameConfigVersion:
      type: object
      required:
        - config_type
        - config_id
        - version
        - status
        - payload
      properties:
        config_type:
          $ref: '#/components/schemas/GameConfigType'
        config_id:
          $ref: '#/components/schemas/Uuid'
        config_version_id:
          $ref: '#/components/schemas/Uuid'
        version:
          type: integer
        status:
          $ref: '#/components/schemas/ContentStatus'
        title:
          type: string
          maxLength: 255
        payload:
          type: object
          additionalProperties: true
        effective_from:
          $ref: '#/components/schemas/Timestamp'
        author_id:
          $ref: '#/components/schemas/Uuid'
        reviewer_id:
          $ref: '#/components/schemas/Uuid'
        published_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    GameConfigType:
      type: string
      description: Loại cấu hình game — mỗi loại có JSON Schema trong specs/schemas (nếu có)
      enum:
        - quests
        - minigame-configs
        - npc-dialogues
        - world-areas
        - story-chapters
        - items
        - reward-rules
        - progression-levels
        - progression-curves
        - challenges
        - bosses
        - achievements
        - collections
        - shop-items
        - currencies
        - matchmaking-configs
        - ranking-rules
        - seasons
        - tournament-templates
        - challenge-templates
        - leaderboard-definitions
        - sticker-packs
        - gifs
        - events
        - event-templates
        - season-tracks
    GameConfigInput:
      type: object
      required:
        - payload
      properties:
        title:
          type: string
          maxLength: 200
        payload:
          type: object
          description: Nội dung cấu hình theo schema của loại (vd. specs/schemas/quest.schema.json, minigame-config.schema.json, reward-rule.schema.json)
          additionalProperties: true
    ContentVersionHistory:
      type: object
      required:
        - item_id
        - data
        - page
      properties:
        item_id:
          $ref: '#/components/schemas/Uuid'
        current_version:
          type: integer
          minimum: 1
          description: Version học sinh nhận khi bắt đầu lượt mới; vắng = chưa publish/đã gỡ
        data:
          type: array
          items:
            $ref: '#/components/schemas/ContentVersionSummary'
        page:
          $ref: '#/components/schemas/PageInfo'
    ContentVersionSummary:
      type: object
      required:
        - version
        - status
      properties:
        version:
          type: integer
          minimum: 1
        content_version_id:
          $ref: '#/components/schemas/Uuid'
        status:
          $ref: '#/components/schemas/ContentStatus'
        is_current:
          type: boolean
          description: true nếu là con trỏ release hiện hành
        change_note:
          type: string
          maxLength: 500
        author_id:
          $ref: '#/components/schemas/Uuid'
        reviewer_id:
          $ref: '#/components/schemas/Uuid'
        published_by:
          $ref: '#/components/schemas/Uuid'
        published_at:
          $ref: '#/components/schemas/Timestamp'
        publish_at:
          $ref: '#/components/schemas/Timestamp'
        active_pinned_sessions:
          type: integer
          minimum: 0
          description: Số lượt chơi/học đang ghim version này (ước lượng)
        field_comments:
          type: array
          maxItems: 50
          description: Nhận xét theo trường của lần từ chối gần nhất của version (F025 T046)
          items:
            $ref: '#/components/schemas/ReviewFieldComment'
    ReviewFieldComment:
      type: object
      required:
        - path
        - comment
      additionalProperties: false
      properties:
        path:
          type: string
          maxLength: 256
          description: JSON pointer (RFC 6901) tới trường của version, vd. /stem/vi; rỗng = toàn bộ
        comment:
          type: string
          minLength: 1
          maxLength: 1000
    ContentVersionDiff:
      type: object
      required:
        - from_version
        - to_version
        - changes
      properties:
        from_version:
          type: integer
          minimum: 1
        to_version:
          type: integer
          minimum: 1
        changes:
          type: array
          maxItems: 2000
          items:
            type: object
            required:
              - path
              - op
            properties:
              path:
                type: string
                maxLength: 512
                description: JSON pointer của field/khối
              op:
                type: string
                enum:
                  - added
                  - removed
                  - changed
              before:
                description: Giá trị cũ (answer_key chỉ trả khi có quyền review)
              after:
                description: Giá trị mới
    PublishRequest:
      type: object
      properties:
        publish_at:
          description: Hẹn giờ xuất bản (UTC); bỏ trống = xuất bản ngay
          $ref: '#/components/schemas/Timestamp'
        change_note:
          type: string
          maxLength: 500
    ContentRelease:
      type: object
      required:
        - release_id
        - item_type
        - item_id
        - action
        - released_by
        - released_at
      properties:
        release_id:
          $ref: '#/components/schemas/Uuid'
        item_type:
          type: string
          maxLength: 64
        item_id:
          $ref: '#/components/schemas/Uuid'
        action:
          type: string
          enum:
            - publish
            - rollback
            - unpublish
        from_version:
          type: integer
          minimum: 1
        to_version:
          type: integer
          minimum: 1
        reason:
          type: string
          maxLength: 500
        scheduled_for:
          $ref: '#/components/schemas/Timestamp'
        status:
          type: string
          enum:
            - scheduled
            - applied
            - cancelled
            - failed
        failure_code:
          type: string
          maxLength: 64
          description: Mã lỗi guard khi lịch hẹn không áp dụng được
        released_by:
          $ref: '#/components/schemas/Uuid'
        released_at:
          $ref: '#/components/schemas/Timestamp'
    RollbackRequest:
      type: object
      required:
        - to_version
        - reason
      properties:
        to_version:
          type: integer
          minimum: 1
          description: Số version đã publish của chính item (ROLLBACK_TARGET_INVALID nếu không hợp lệ)
        reason:
          type: string
          minLength: 1
          maxLength: 500
    ReasonRequest:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
  headers:
    IdempotentReplayed:
      description: |
        Có giá trị `true` khi response được phát lại từ kho idempotency (cùng `Idempotency-Key` + cùng body trong `idempotency_record_ttl`);
        vắng mặt khi request được xử lý lần đầu (API_DESIGN §6, F003).
      schema:
        type: string
        enum:
          - 'true'
    ContentLanguage:
      description: Ngôn ngữ của văn bản đã chọn trong response (`vi-VN` | `en-US`)
      schema:
        type: string
        maxLength: 16
    RateLimitLimit:
      schema:
        type: integer
    RateLimitRemaining:
      schema:
        type: integer
    RateLimitReset:
      schema:
        type: integer
    RetryAfter:
      schema:
        type: integer
    ETag:
      description: Phiên bản tài nguyên cho optimistic concurrency
      schema:
        type: string
        maxLength: 512
  responses:
    Unauthenticated:
      description: Thiếu/sai/hết hạn token (UNAUTHENTICATED)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: PERMISSION_DENIED, FEATURE_DISABLED (action/menu portal đang tắt, có `feature_key` — ADR-0090), GAME_ACCESS_STUDENT_ONLY, POLICY_DENIED, TENANT_NOT_SELECTED, TENANT_MISMATCH, TENANT_ACCESS_DISABLED, RESOURCE_NOT_ASSIGNED, ACCOUNT_LOCKED, ACCOUNT_DEACTIVATED, ACCOUNT_NOT_PROVISIONED, NO_ACTIVE_ENROLLMENT, ACCESS_OUTSIDE_ALLOWED_HOURS, CURFEW_ACTIVE, DAILY_PLAY_LIMIT_REACHED, PARTY_NOT_LEADER, PARTY_INVITE_NOT_ALLOWED, PARTY_POLICY_VIOLATION, CHAT_NOT_ALLOWED, CHAT_KIND_NOT_ALLOWED, CHAT_MUTED, TENANT_TOGGLE_NOT_ALLOWED, MODERATION_SWITCH_SELF_APPROVAL, PORTAL_ACCESS_STAFF_ONLY, HINTS_NOT_ALLOWED
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Xung đột trạng thái (vd. CONTENT_VERSION_CONFLICT, CONTENT_NOT_PUBLISHED, SIS_SCHOOL_ALREADY_CONNECTED, SIS_SYNC_ALREADY_RUNNING, SIS_CONNECTION_NOT_ACTIVE, ATTEMPT_ALREADY_SUBMITTED, EXAM_ALREADY_SUBMITTED, PARTY_ALREADY_IN_PARTY, PARTY_FULL, MM_TICKET_ALREADY_ACTIVE, IDEMPOTENCY_KEY_REUSED, IDENTITY_CONFLICT, USERNAME_TAKEN, EMAIL_TAKEN, HINTS_EXHAUSTED, ASSIGNMENT_NOT_EDITABLE, MODERATION_CASE_CLOSED, CHAT_CHANNEL_CLOSED)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationFailed:
      description: VALIDATION_FAILED, SIS_CONTRACT_VERSION_UNSUPPORTED, ATTEMPT_DEADLINE_PASSED, INVALID_STATE_TRANSITION, MODERATION_SWITCH_REASON_REQUIRED, SENSITIVE_TERM_INVALID, SENSITIVE_CATALOG_REGRESSION_FAILED, DASHBOARD_RANGE_TOO_LARGE, ROLE_NOT_FOUND; sub-code `errors[].code = PERMISSION_NOT_ALLOWED_FOR_SCOPE` khi role tenant chứa permission platform
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
    RateLimited:
      description: RATE_LIMITED, LOGIN_QUEUE_BUSY (hàng chờ đăng nhập game, ADR-0045/0068), CHAT_RATE_LIMITED (giới hạn chat theo policy)
      headers:
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: Dịch vụ phụ thuộc tạm thời không sẵn sàng (vd. CHAT_TEMPORARILY_UNAVAILABLE khi NATS JetStream lỗi) — client thử lại theo Retry-After
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Không tồn tại hoặc ngoài tenant scope (NOT_FOUND)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailed:
      description: VERSION_MISMATCH
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionRequired:
      description: IDEMPOTENCY_KEY_REQUIRED hoặc PRECONDITION_REQUIRED
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Gone:
      description: Tài nguyên hết hạn (PARTY_INVITATION_EXPIRED)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  securitySchemes:
    keycloakBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token Keycloak (realm eduworld, aud eduworld-api, TTL 5 phút).
    keycloakAdminBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token Keycloak của Admin Portal (claim `azp = eduworld-portal`, phát qua `POST /auth/portal/login` — ADR-0091); không yêu cầu MFA (ADR-0094).
        Principal phải có role platform với permission tương ứng (`game.*`, `competition.config.*`, `platform.*`).
        Chỉ dùng trên gateway nội bộ (ADR-0027).
    keycloakOidc:
      type: openIdConnect
      description: Host thật theo môi trường (`sso.<env>.<domain>`, OQ-10); URL dưới đây là placeholder hợp lệ.
      openIdConnectUrl: https://sso.eduworld.example/realms/eduworld/.well-known/openid-configuration

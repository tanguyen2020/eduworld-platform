          type: string
          enum:
            - random
            - skill
            - grade
            - subject
            - topic
            - friend
            - team
            - tournament
            - bot
        ranked:
          type: boolean
        is_bot:
          type: boolean
          description: Trận với bot luyện tập "Robot Học Giỏi" (unranked).
        room_id:
          $ref: '#/components/schemas/Uuid'
        started_at:
          $ref: '#/components/schemas/Timestamp'
        ended_at:
          $ref: '#/components/schemas/Timestamp'

      properties:
        activity_type:
          $ref: '#/components/schemas/PartyActivityType'
        activity_ref:
          $ref: '#/components/schemas/PartyActivityRef'
        game_mode:
          type: string
          maxLength: 64
    PartyActivityType:
      type: string
      description: Một enum loại hoạt động party (PARTY_SYSTEM §5); nguồn specs/schemas/common/enums.schema.json. M4a chỉ bật explore, quest, boss.
      enum:
        - explore
        - quest
        - boss
        - learning_challenge
        - coop_challenge
        - team_battle
    PartyActivityRef:
      type: string
      maxLength: 64
      pattern: ^[a-z0-9_.-]{1,64}$
      description: area_id (explore) / quest_id (quest) / boss_id (boss)
    PartyMember:
      type: object
      required:

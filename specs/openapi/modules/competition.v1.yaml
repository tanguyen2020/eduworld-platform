    GameConfigVersion:
      type: object
      required:
        - config_type
        - config_id
        - version
        - status
        - payload
      properties:
        config_type:
          $ref: '#/components/schemas/GameConfigType'
        config_id:
          $ref: '#/components/schemas/Uuid'
        config_version_id:
          $ref: '#/components/schemas/Uuid'
        version:
          type: integer
        status:
          $ref: '#/components/schemas/ContentStatus'
        title:
          type: string
          maxLength: 255
        payload:
          type: object
          additionalProperties: true
          description: |
            Nội dung theo JSON Schema của loại (`specs/schemas/<loại>.schema.json`). Với `sticker-packs`/`gifs` (module chat), phản hồi
            thêm URL ký ngắn hạn để xem trước bản chưa phát hành (F082-AC-07): `stickers[].preview_url`, `preview_url`, `url` — chỉ đọc,
            không bao giờ được lưu (server bỏ qua khi nhận lại).
        effective_from:
          $ref: '#/components/schemas/Timestamp'
        author_id:
          $ref: '#/components/schemas/Uuid'
        reviewer_id:
          $ref: '#/components/schemas/Uuid'
        published_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
        based_on_version:
          type: integer
          minimum: 1
          description: Version nguồn khi tạo bằng createGameConfigVersion (F078)
        review_note:
          type: string
          maxLength: 2000
          description: Ghi chú của lần chuyển trạng thái gần nhất (lý do trả lại)
        change_note:
          type: string
          maxLength: 500
        is_current:
          type: boolean
          description: true nếu là con trỏ release hiện hành
        thumbnail_url:
          type: string
          format: uri
          maxLength: 2048
          description: Ảnh render_thumbnail 512×512 khi asset ready; vắng khi chưa có (F078-AC-20)
        turntable_url:
          type: string
          format: uri
          maxLength: 2048
          description: Sprite sheet render_turntable 24 khung khi asset ready
        render_status:
          type: string
          enum:
            - pending
            - ready
            - failed
            - not_applicable
          description: |
            Trạng thái ảnh render_thumbnail của version (F079-AC-16): `ready` có `thumbnail_url`; `pending` job render đang chờ/đang
            thử lại; `failed` job hết lượt (`dead`, sau `game_render_max_attempts`); `not_applicable` version không có job render
            (chưa publish hoặc không có model 3D).
        calendar_warnings:
          type: array
          maxItems: 20
          description: |
            Chỉ có khi listGameConfigs `events` được gọi với `from`/`to` (Lịch sự kiện, F079-AC-14): cảnh báo lịch do server tính
            giữa các sự kiện trong khoảng (portal không tự suy luận).
          items:
            $ref: '#/components/schemas/GameEventCalendarWarning'
        translation_status:
          allOf:
            - $ref: '#/components/schemas/TranslationStatus'
          readOnly: true
          description: |
            Trạng thái bản dịch văn bản game của version (F082-AC-08, CONTENT_MODEL §8), tính khi lưu draft; vắng với loại của
            module chat/competition.
        missing_fields:
          type: array
          readOnly: true
          maxItems: 500
          description: JSON pointer (trong `payload`) của văn bản game còn thiếu một ngôn ngữ bắt buộc (`game_text_required_languages`)
          items:
            type: string
            maxLength: 512
        outdated_fields:
          type: array
          readOnly: true
          maxItems: 500
          description: Văn bản game có bản gốc `vi` đổi sau lần dịch gần nhất; diff bản gốc qua `diffGameConfigVersions` với `translated_in_version`
          items:
            type: object
            required:
              - pointer
              - translated_in_version
            properties:
              pointer:
                type: string
                maxLength: 512
              translated_in_version:
                type: integer
                minimum: 1

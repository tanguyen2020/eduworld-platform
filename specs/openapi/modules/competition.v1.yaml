          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  parameters:
    TenantIdHeader:
      name: X-Tenant-Id
      in: header
      required: true
      description: |
        Tenant của phiên (ADR-0065). Lấy từ `PlayerBootstrap.tenant_id` (game) hoặc tenant đã chọn sau đăng nhập portal (`GET /me/tenants`).
        Gateway trả `400 TENANT_HEADER_REQUIRED` khi thiếu, `400 BAD_REQUEST` khi sai định dạng; backend kiểm tra khớp token + membership,
        lệch → `403 TENANT_MISMATCH`. `Principal.tenant_id` lấy từ kết quả kiểm tra, không lấy thẳng từ header.
      schema:
        $ref: '#/components/schemas/Uuid'
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: Ngôn ngữ hiển thị mong muốn (`vi-VN` mặc định, `en-US`). Server chọn ngôn ngữ trả về và đặt `Content-Language` (ADR-0056). Dữ liệu cache dài (manifest, snapshot) luôn trả đủ vi+en.
      schema:
        type: string
        maxLength: 64
        examples:
          - vi-VN
          - en-US
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        UUIDv7 do client sinh cho mỗi thao tác (ADR-0010, ADR-0089 §4); timestamp trong key lệch quá `idempotency_record_ttl`
        (24 h) so với giờ server hoặc key không phải UUIDv7 → `400 BAD_REQUEST`. Bản ghi giữ trong `idempotency_record_ttl`;
        gửi lại cùng key + cùng body → response đã lưu kèm `Idempotent-Replayed: true`; khác body → `409 IDEMPOTENCY_KEY_REUSED`.
      schema:
        type: string
        format: uuid
        pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
    PartyId:
      name: party_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    StudentId:
      name: student_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    InvitationId:
      name: invitation_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    DuelIdPath:
      name: duel_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    TicketId:
      name: ticket_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      description: Cursor opaque từ page.next_cursor
      schema:
        type: string
        maxLength: 512
    MatchId:
      name: match_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    TournamentId:
      name: tournament_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    EntryId:
      name: entry_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    NodeId:
      name: node_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ChallengeId:
      name: challenge_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    LeaderboardId:
      name: leaderboard_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    LeaderboardScopeId:
      name: scope_id
      in: query
      description: Phạm vi của bảng — trường (scope school/grade), tenant (scope tenant). Học sinh bỏ trống = phạm vi chứa mình.
      schema:
        $ref: '#/components/schemas/Uuid'
    LeaderboardGradeLevel:
      name: grade_level
      in: query
      description: Khối của bảng scope khối (chỉ nhân sự; học sinh luôn là khối của mình — ADR-0095).
      schema:
        $ref: '#/components/schemas/GradeLevel'
    LeaderboardPeriodKey:
      name: period_key
      in: query
      description: Kỳ (giờ Asia/Ho_Chi_Minh) — daily 2026-11-22, weekly 2026-W47, monthly 2026-11, season s-<season_id>, all_time all. Bỏ trống = kỳ đang mở.
      schema:
        type: string
        maxLength: 64
    TenantIds:
      name: tenant_ids
      in: query
      required: false
      description: |
        Chỉ System Admin (platform.cross_tenant.read): lọc theo một hoặc nhiều tenant; vắng mặt = tất cả tenant.
        Người dùng tenant gửi tham số này bị bỏ qua (luôn khóa vào tenant của phiên) — ADR-0027 §6.
      style: form
      explode: true
      schema:
        type: array
        maxItems: 100
        items:
          $ref: '#/components/schemas/Uuid'
    GradeLevelQuery:
      name: grade_level
      in: query
      schema:
        $ref: '#/components/schemas/GradeLevel'
    SubjectIdQuery:
      name: subject_id
      in: query
      schema:
        $ref: '#/components/schemas/Uuid'
    GameConfigId:
      name: config_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    Version:
      name: version
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        maxLength: 512
  schemas:
    Uuid:
      type: string
      format: uuid
      description: UUIDv7
    PartyCreate:
      type: object
      required:
        - name
        - party_type
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 40
        party_type:
          $ref: '#/components/schemas/PartyType'
        visibility:
          $ref: '#/components/schemas/PartyVisibility'
        invitation_policy:
          type: string
          enum:
            - leader_only
            - members
          default: leader_only
        max_members:
          type: integer
          minimum: 2
          maximum: 8
          description: Vắng mặt = party_max_members (CONFIG_DEFAULTS), không vượt max_members_cap của party_policies
    PartyType:
      type: string
      description: study_party là tên mới của study_group (ADR-0095 D7, giữ hành vi).
      enum:
        - friend
        - study_party
        - quest
        - competition_team
        - custom
    PartyVisibility:
      type: string
      description: Không còn class (ADR-0095); party class cũ đọc thành private.
      enum:
        - private
        - friends
    Party:
      type: object
      required:
        - party_id
        - name
        - leader_id
        - party_type
        - visibility
        - max_members
        - status
        - members
      properties:
        party_id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
          maxLength: 128
        leader_id:
          $ref: '#/components/schemas/Uuid'
        party_type:
          $ref: '#/components/schemas/PartyType'
        visibility:
          $ref: '#/components/schemas/PartyVisibility'
        invitation_policy:
          type: string
          enum:
            - leader_only
            - members
        max_members:
          type: integer
          minimum: 2
          maximum: 8
        status:
          type: string
          enum:
            - open
            - in_activity
            - disbanded
        current_activity:
          $ref: '#/components/schemas/PartyActivitySelection'
        current_game_session_ref:
          $ref: '#/components/schemas/Uuid'
        members:
          type: array
          items:
            $ref: '#/components/schemas/PartyMember'
        chat_channel_id:
          $ref: '#/components/schemas/Uuid'
        leader_reconnecting:
          type: boolean
          description: Leader đang trong grace party_leader_grace (F101-AC-15)
        current_room_id:
          $ref: '#/components/schemas/Uuid'
        state_version:
          type: integer
          minimum: 0
          description: Tăng 1 mỗi thay đổi thành viên/cài đặt/hoạt động (expected_version của F101)
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    PartyActivitySelection:
      type: object
      required:

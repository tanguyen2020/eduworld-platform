components:
  parameters:
    TenantIdHeader:
      name: X-Tenant-Id
      in: header
      required: true
      description: |
        Tenant của phiên (ADR-0065). Lấy từ `PlayerBootstrap.tenant_id` (game) hoặc tenant đã chọn sau đăng nhập portal (`GET /me/tenants`).
        Gateway trả `400 TENANT_HEADER_REQUIRED` khi thiếu, `400 BAD_REQUEST` khi sai định dạng; backend kiểm tra khớp token + membership,
        lệch → `403 TENANT_MISMATCH`. `Principal.tenant_id` lấy từ kết quả kiểm tra, không lấy thẳng từ header.
      schema:
        $ref: '#/components/schemas/Uuid'
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: Ngôn ngữ hiển thị mong muốn (`vi-VN` mặc định, `en-US`). Server chọn ngôn ngữ trả về và đặt `Content-Language` (ADR-0056). Dữ liệu cache dài (manifest, snapshot) luôn trả đủ vi+en.
      schema:
        type: string
        maxLength: 64
        examples:
          - vi-VN
          - en-US
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        UUIDv7 do client sinh cho mỗi thao tác (ADR-0010, ADR-0089 §4); timestamp trong key lệch quá `idempotency_record_ttl`
        (24 h) so với giờ server hoặc key không phải UUIDv7 → `400 BAD_REQUEST`. Bản ghi giữ trong `idempotency_record_ttl`;
        gửi lại cùng key + cùng body → response đã lưu kèm `Idempotent-Replayed: true`; khác body → `409 IDEMPOTENCY_KEY_REUSED`.
      schema:
        type: string
        format: uuid
        pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
    PartyId:
      name: party_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    StudentId:
      name: student_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    InvitationId:
      name: invitation_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    DuelIdPath:
      name: duel_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    TicketId:
      name: ticket_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      description: Cursor opaque từ page.next_cursor
      schema:
        type: string
        maxLength: 512
    MatchId:
      name: match_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    LeaderboardId:
      name: leaderboard_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    GameConfigId:
      name: config_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    Version:
      name: version
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        maxLength: 512
  schemas:
    Uuid:
      type: string
      format: uuid
      description: UUIDv7
    PartyCreate:
      type: object
      required:
        - name
        - party_type
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 40
        party_type:
          $ref: '#/components/schemas/PartyType'
        visibility:
          $ref: '#/components/schemas/PartyVisibility'
        invitation_policy:
          type: string
          enum:
            - leader_only
            - members
          default: leader_only
        max_members:
          type: integer
          minimum: 2
          maximum: 8
          default: 4
    PartyType:
      type: string
      enum:
        - friend
        - study_group
        - quest
        - competition_team
        - custom
    PartyVisibility:
      type: string
      enum:
        - private
        - friends
        - class
    Party:
      type: object
      required:
        - party_id
        - name
        - leader_id
        - party_type
        - visibility
        - max_members
        - status
        - members
      properties:
        party_id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
          maxLength: 255
        leader_id:
          $ref: '#/components/schemas/Uuid'
        party_type:
          $ref: '#/components/schemas/PartyType'
        visibility:
          $ref: '#/components/schemas/PartyVisibility'
        invitation_policy:
          type: string
          enum:
            - leader_only
            - members
        max_members:
          type: integer
          minimum: 2
          maximum: 8
        status:
          type: string
          enum:
            - open
            - in_activity
            - disbanded
        current_activity:
          $ref: '#/components/schemas/PartyActivitySelection'
        current_game_session_ref:
          $ref: '#/components/schemas/Uuid'
        members:
          type: array
          items:
            $ref: '#/components/schemas/PartyMember'
        chat_channel_id:
          $ref: '#/components/schemas/Uuid'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    PartyActivitySelection:
      type: object
      required:
        - activity_type
      properties:
        activity_type:
          type: string
          enum:
            - explore
            - quest
            - learning_challenge
            - coop_challenge
            - team_battle
        activity_ref:
          $ref: '#/components/schemas/Uuid'
        game_mode:
          type: string
          maxLength: 64
    PartyMember:
      type: object
      required:
        - student_id
        - nickname
        - role
        - joined_at
      properties:
        student_id:
          $ref: '#/components/schemas/Uuid'
        nickname:
          type: string
          maxLength: 128
        avatar_config:
          $ref: '#/components/schemas/AvatarConfig'
        role:
          type: string
          enum:
            - leader
            - member
        ready:
          type: boolean
        presence:
          type: string
          enum:
            - online
            - in_activity
            - disconnected
            - offline
        joined_at:
          $ref: '#/components/schemas/Timestamp'
    AvatarConfig:
      type: object
      properties:
        body:
          type: string
          maxLength: 1000
        skin_tone:
          type: string
          maxLength: 64
        hair_item_id:
          $ref: '#/components/schemas/Uuid'
        outfit_item_id:
          $ref: '#/components/schemas/Uuid'
        accessory_item_ids:
          type: array
          maxItems: 4
          items:
            $ref: '#/components/schemas/Uuid'
        emote_item_ids:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/Uuid'
    Timestamp:
      type: string
      format: date-time
    Problem:
      type: object
      required:
        - type
        - title
        - status
        - code
      properties:
        type:
          type: string
          maxLength: 2048
          format: uri
        title:
          type: string
          maxLength: 255
        status:
          type: integer
        code:
          description: Mã ổn định; client phải chấp nhận giá trị chưa biết
          anyOf:
            - $ref: '#/components/schemas/ProblemCode'
            - type: string
              maxLength: 64
        detail:
          type: string
          maxLength: 1000
        instance:
          type: string
          maxLength: 2048
        trace_id:
          type: string
          maxLength: 64
        retryable:
          type: boolean
          description: 'Có khi lỗi tạm thời (vd. `503 UNAVAILABLE` khi module identity không trả Principal): client được phép thử lại với backoff (F002-AC-09)'
        policy_reason:
          type: string
          maxLength: 1000
        feature_key:
          type: string
          maxLength: 128
          description: 'Chỉ có khi `code = FEATURE_DISABLED`: khóa action hoặc menu cha đang tắt (ADR-0090)'
        reopen_at:
          type: string
          format: date-time
          description: Chỉ có khi `code = CURFEW_ACTIVE` (thời điểm hết giờ giới nghiêm hiệu lực, giờ server, ADR-0078) hoặc `code = DAILY_PLAY_LIMIT_REACHED` (00:00 ICT hôm sau, CHILD_SAFETY §4.2)

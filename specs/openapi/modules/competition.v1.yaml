      summary: Thử thách khối / giải trường trong scope
      description: |
        Route ngoại lệ dưới `/lms` → module competition (F107, COMPETITION_SYSTEM §10.2). F107-AC-06: thử thách/giải của các trường
        thuộc scope UserRole (`lms.challenge.write`), lọc `grade_level`/`status`; trang keyset `(starts_at, challenge_id)` cắt trong SQL.
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/TenantIds'
        - name: grade_level
          in: query
          description: Khối của thử thách (ADR-0095 — thay class_id)
          schema:
            $ref: '#/components/schemas/GradeLevel'
        - name: status
          in: query
          schema:
            type: string
            enum:
              - scheduled
              - running
              - completed
              - cancelled
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - page
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Challenge'
                  page:
                    $ref: '#/components/schemas/PageInfo'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    post:
      x-service: competition
      tags:
        - lms
      operationId: createChallenge
      x-portal-action: action.school_lms.challenges.create
      summary: Tạo thử thách khối / giải trường từ template do platform publish
      description: |
        Route ngoại lệ dưới `/lms` → module competition (F107). Tenant chỉ điền tham số template cho phép (`allowed_params`); luật chơi,
        phần thưởng, cấu hình thi đấu lấy từ version template được ghim (ADR-0027). Template chưa gán → `403 RESOURCE_NOT_ASSIGNED`;
        tham số ngoài `allowed_params` → `422`; tên chứa từ không phù hợp (kiểm qua facade `screenText` của module chat) → `422`,
        kiểm không được → `503`. Chỉ `school_admin` (trường mình) và System Admin (tenant đích `tenant_id` bắt buộc) — F107-AC-01…AC-05.
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChallengeCreate'
      responses:
        '201':
          description: Đã tạo
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Challenge'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

          $ref: '#/components/schemas/Uuid'
          description: Bằng proposal_id của proposal đã được mọi bên chấp nhận.
    Match:
      type: object
      required:
        - match_id
        - mode
        - status
      properties:
        match_id:
          $ref: '#/components/schemas/Uuid'
        mode:
          $ref: '#/components/schemas/MatchMode'
        subject_id:
          $ref: '#/components/schemas/Uuid'

      summary: Danh sách cấu hình game theo loại (Game Studio)
      x-internal: true
      security:
        - keycloakAdminBearer: []
      parameters:
        - name: config_type
          in: path
          required: true
          schema:
            type: string
            description: Loại cấu hình game — mỗi loại có JSON Schema trong specs/schemas (nếu có)
            enum:
              - matchmaking-configs
              - ranking-rules
              - seasons
              - tournament-templates
              - challenge-templates
              - leaderboard-definitions
              - competition-rewards
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ContentStatus'
        - name: from
          in: query
          description: |
            Chỉ `config_type = events` (Lịch sự kiện, F079-AC-14): giữ sự kiện có `payload.schedule` giao khoảng ngày [from, to]
            theo lịch ICT (gồm cả hai ngày); cần đi cùng `to`, khoảng ≤ 62 ngày. Loại khác hoặc thiếu một đầu → `422 VALIDATION_FAILED`.
            Khi có khoảng ngày, mỗi phần tử mang `calendar_warnings` do server tính.
          schema:
            type: string
            format: date
        - name: to
          in: query
          description: Ngày cuối (ICT, gồm cả ngày này) của khoảng lọc `from`
          schema:
            type: string
            format: date
        - name: translation_status
          in: query
          description: |
            Chỉ `config_type` của module game (F082-AC-09): giữ item có `translation_status` của version mới nhất bằng giá trị này
            ("Cần dịch" = `partial`, "Bản dịch lỗi thời" = `outdated`). Loại của module chat/competition → `422 VALIDATION_FAILED`.
          schema:
            $ref: '#/components/schemas/TranslationStatus'
        - name: tag
          in: query
          description: Chỉ `config_type = gifs` (F082-AC-05) — GIF có tag (vi hoặc en) bằng giá trị này ở version mới nhất.
          schema:
            type: string
            maxLength: 64
            pattern: ^[a-z0-9 _-]{1,64}$
        - name: author_id
          in: query
          description: Chỉ `config_type` `sticker-packs`/`gifs` (F082-AC-05) — version mới nhất do người này tạo/upload.
          schema:
            $ref: '#/components/schemas/Uuid'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - page
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/GameConfigVersion'
                  page:
                    $ref: '#/components/schemas/PageInfo'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':

                  type: array
                  maxItems: 30
                  items:
                    type: string
                    maxLength: 64
            rewards_preview:
              type: array
              maxItems: 20
              description: Phần thưởng dự kiến (ý định — Reward Engine F074 cấp theo reward rule)
              items:
                $ref: '#/components/schemas/RewardPreview'
    QuestStepView:

          type: string
          maxLength: 64
        areas:
          type: array
          items:
            $ref: '#/components/schemas/WorldArea'
        bundles:
          type: array
          items:
            type: object
            required:
              - bundle_id
              - version
              - url
              - sha256
            properties:
              bundle_id:
                type: string
                maxLength: 64
              version:
                type: string
                maxLength: 64
              url:
                type: string
                maxLength: 2048
                format: uri
              sha256:
                type: string
                maxLength: 128
              size_bytes:
                type: integer
    WorldArea:
      type: object
      required:
        - area_id
        - scene_ref
        - accessible
      properties:
        area_id:
          type: string
          maxLength: 64
        scene_ref:
          type: string
          maxLength: 255
        bundle_id:
          type: string
          maxLength: 64
        capacity:
          type: integer
        accessible:
          type: boolean
        lock_reason:
          type: string
          maxLength: 1000
          description: vd. outside_allowed_hours, grade_not_allowed, requirements_not_met
        name:
          $ref: '#/components/schemas/LocalizedName'
        region_code:
          type: string
          maxLength: 64
          description: Vùng đất chứa khu (WORLD_DESIGN §3)
        region_name:
          $ref: '#/components/schemas/LocalizedName'
        area_class:
          type: string
          enum:
            - hub
            - learning
            - practice
            - social
            - quest
            - exam
            - challenge
            - arena
          description: Loại khu (học tập luôn mở theo khối/môn, FR-GAM-009)
        subject_code:
          type: string
          maxLength: 64
          description: Môn của khu học tập
        room_type:
          type: string
          enum:
            - hub_instance
            - private_instance
            - single
        version:
          type: integer
          minimum: 1
          description: Version area đang publish
        map:
          type: object
          description: Vị trí trên World Map S04 (dữ liệu, 0..1)
          required:
            - x
            - 'y'
          properties:
            x:
              type: number
              minimum: 0
              maximum: 1
            'y':
              type: number
              minimum: 0
              maximum: 1
            icon_key:
              type: string
              maxLength: 64
        portals:
          type: array
          maxItems: 20
          description: Cổng gió của khu (portal_id → area đích)
          items:
            type: object
            required:
              - portal_id
              - target_area_id
            properties:
              portal_id:
                type: string
                maxLength: 64
              target_area_id:
                type: string
                maxLength: 64
              target_spawn_point_id:
                type: string
                maxLength: 64
        unlock_requirements:
          type: array
          maxItems: 10
          description: Điều kiện mở khu (khi accessible = false vì chưa mở khóa)
          items:
            $ref: '#/components/schemas/UnlockRequirement'
    LocalizedName:
      type: object
      description: Tên/nhãn hiển thị song ngữ bắt buộc cả vi và en (văn bản game — ADR-0056 mục 2)
      required:
        - vi
        - en
      additionalProperties: false
      properties:
        vi:
          type: string
          minLength: 1
          maxLength: 255
        en:
          type: string
          minLength: 1
          maxLength: 255
    UnlockRequirement:
      type: object
      description: Một điều kiện mở khu (WORLD_DESIGN §7.2) — thông điệp thân thiện, không có điều kiện thanh toán
      required:
        - kind
        - met
      properties:
        kind:
          type: string
          enum:
            - level
            - quest
            - learning_objective
            - achievement
            - event
            - chapters_completed
        ref:
          type: string
          maxLength: 64
        label:
          $ref: '#/components/schemas/LocalizedName'
        met:
          type: boolean
        current:
          type: integer
          minimum: 0
          description: Tiến độ hiện tại (vd. số chương đã xong)
        target:
          type: integer
          minimum: 0
          description: Mức cần đạt (vd. 2 chương)
    AreaEnterResult:
      type: object
      required:
        - area_id
        - room_id
        - room_type
      properties:
        area_id:
          type: string
          maxLength: 64
        room_id:
          $ref: '#/components/schemas/Uuid'
        room_type:
          type: string
          enum:
            - hub_instance
            - private_instance
        spawn_point_id:
          type: string
          maxLength: 64
        level_id:
          $ref: '#/components/schemas/Uuid'
        area_version:
          type: integer
          minimum: 1
    AreaLockedProblem:
      description: Problem AREA_LOCKED kèm điều kiện còn thiếu
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            missing_requirements:
              type: array
              maxItems: 10
              items:
                $ref: '#/components/schemas/UnlockRequirement'
    NpcDialogueDelivery:
      type: object
      description: NPCDialogueVersion đang publish (specs/schemas/npc-dialogue.schema.json) — điều kiện chỉ để hiển thị; action nghiệp vụ đi qua API server (ADR-0016)
      required:
        - schema_version
        - dialogue_id
        - dialogue_version_id
        - npc_id
        - version
        - status
        - start_node_id
        - nodes
      properties:
        schema_version:
          type: integer
          enum:
            - 1
        dialogue_id:
          $ref: '#/components/schemas/Uuid'
        dialogue_version_id:
          $ref: '#/components/schemas/Uuid'
        npc_id:
          type: string
          maxLength: 64
        npc_name:
          $ref: '#/components/schemas/LocalizedName'
        version:
          type: integer
          minimum: 1
        status:
          type: string
          enum:
            - published
        owner_scope:
          type: string
          enum:
            - platform
        grade_levels:
          type: array
          maxItems: 9
          items:
            type: integer
            minimum: 1
            maximum: 9
        start_node_id:
          type: string
          maxLength: 64
        entry_points:
          type: array
          maxItems: 50
          items:
            type: object
            additionalProperties: true
            description: entry_point của npc-dialogue.schema.json
        nodes:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            additionalProperties: true
            description: node của npc-dialogue.schema.json (text/choices song ngữ vi, en)
    TelemetryBatch:
      type: object
      additionalProperties: false
      required:
        - platform
        - client_version
        - events
      description: Lô telemetry không PII (ADR-0058). Tenant tắt telemetry sản phẩm thì client không gửi screen_view/tutorial_step; perf/crash và break_reminder_shown (chỉ số chơi lành mạnh) vẫn gửi.
      properties:
        platform:
          type: string
          maxLength: 32
        client_version:
          type: string
          maxLength: 64
        device_tier:
          $ref: '#/components/schemas/DeviceTier'
        preset:
          $ref: '#/components/schemas/QualityPreset'
        renderer:
          $ref: '#/components/schemas/RendererKind'
        locale:
          $ref: '#/components/schemas/Locale'
        events:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/TelemetryEvent'
    DeviceTier:
      type: string
      enum:
        - minimum
        - mid
        - high
      description: Hạng thiết bị (ADR-0057, PERFORMANCE_BUDGET)
    TelemetryEvent:
      type: object
      additionalProperties: false
      required:
        - type
        - occurred_at
      description: Không PII (GAME_ANALYTICS §3.2). Thuộc tính dùng theo type.
      properties:
        type:
          type: string
          enum:
            - screen_view
            - tutorial_step
            - perf_sample
            - load_time
            - client_error
            - crash
            - network_sample
            - break_reminder_shown
            - chat_seq_gap
            - content_download
        client_event_id:
          $ref: '#/components/schemas/Uuid'
          description: Khử trùng phía server
        occurred_at:
          $ref: '#/components/schemas/Timestamp'
        screen_code:
          type: string
          maxLength: 64
        duration_ms:
          type: integer
          minimum: 0
        step_code:
          type: string
          maxLength: 64
        result:
          type: string
          enum:
            - done
            - skipped
        scene_code:
          type: string
          maxLength: 64
        fps_p50:
          type: number
        fps_p10:
          type: number
        frame_ms_p95:
          type: number
        render_scale:
          type: number
          minimum: 0.3
          maximum: 1
        mem_mb:
          type: integer
          minimum: 0
        kind:
          type: string
          enum:
            - cold_start
            - area_transition
            - activity_open
        ms:
          type: integer
          minimum: 0
        error_code:
          type: string
          maxLength: 64
        fatal:
          type: boolean
        crash_signature:
          type: string
          maxLength: 256
        rtt_p50_ms:
          type: integer
          minimum: 0
        rtt_p95_ms:
          type: integer
          minimum: 0
        reconnects:
          type: integer
          minimum: 0
        reminder_no:
          type: integer
          minimum: 1
          maximum: 20
          description: 'break_reminder_shown: lần nhắc nghỉ thứ mấy trong phiên (GAME_ANALYTICS §3.2)'
        minutes_played:
          type: integer
          minimum: 0
          maximum: 1440
          description: 'break_reminder_shown: số phút chơi liên tục client đếm lúc nhắc; chỉ dùng cho thống kê chơi lành mạnh'
        channel_type:
          $ref: '#/components/schemas/ChannelType'
          description: 'chat_seq_gap: loại channel có khoảng trống seq (MONITORING §3 eduworld_chat_seq_gaps_total)'
        gap_count:
          type: integer
          minimum: 1
          maximum: 1000
          description: 'chat_seq_gap: số tin bị thiếu client phát hiện (seq nhảy), chỉ dùng cho metric'
        source:
          type: string
          enum:
            - preinstalled
            - lan_cache
            - cdn
          description: 'content_download: nguồn tải gói nội dung (PERFORMANCE_BUDGET §10.1)'
        bytes:
          type: integer
          minimum: 0
          maximum: 10737418240
          description: 'content_download: số byte tải từ nguồn, chỉ dùng cho metric eduworld_client_content_download_bytes_total'
    ChannelType:
      type: string
      description: Không còn class, study_group (ADR-0095).
      enum:
        - world
        - area
        - match
        - party
        - team
        - direct
    QuestType:
      type: string
      description: 12 loại quest của quest.schema.json v2 (QUEST_SYSTEM §2.3)
      enum:
        - main
        - side
        - daily
        - weekly
        - learning
        - exploration
        - social
        - party
        - challenge
        - seasonal
        - special_event
        - boss
    QuestStatus:
      type: string
      description: Trạng thái quest trong danh sách của học sinh — `available` (chưa có progress đang làm) hoặc trạng thái progress gần nhất
      enum:
        - available
        - active
        - completed
        - expired
        - abandoned
        - failed
    QuestSummary:
      type: object
      required:
        - quest_id
        - quest_version_id
        - code
        - name
        - quest_type
        - grade_levels
        - status
      properties:
        quest_id:
          $ref: '#/components/schemas/Uuid'
        quest_version_id:
          $ref: '#/components/schemas/Uuid'

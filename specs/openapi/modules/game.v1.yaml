    GameSimulableConfigType:
      type: string
      description: Loại cấu hình có mô phỏng tiến độ (simulateGameConfig)
      enum:
        - progression-curves
        - season-tracks
    GameConfigSimulation:
      type: object
      required:
        - config_type
        - config_id
        - version
        - assumptions
        - points
        - thresholds
      description: |
        Mô phỏng tiến độ do server tính trên payload của version (F079-AC-10, AC-15; AGENTS R1 — portal không tự tính).
        `progression-curves`: XP/ngày = min(`minutes_per_day` × `xp_simulation_minute_rate`, `xp_daily_cap`), `level` theo đường
        cong (công thức + `level_overrides`); `thresholds[]` là bảng ngưỡng level (biểu đồ). `season-tracks`: điểm/ngày chơi =
        `points.daily_cap` (người chơi đạt trần ngày), `level` là cấp của track (≤ số cấp), `thresholds[]` là điểm tích lũy theo cấp.
      properties:
        config_type:
          $ref: '#/components/schemas/GameSimulableConfigType'
        config_id:
          $ref: '#/components/schemas/Uuid'
        version:
          type: integer
          minimum: 1
        assumptions:
          type: object
          required:
            - per_play_day
            - days_per_week
            - weeks
          properties:
            per_play_day:
              type: integer
              minimum: 0
              description: XP (đường cong) hoặc điểm mùa (season track) mỗi ngày chơi
            minutes_per_day:
              type: integer
              minimum: 1
              maximum: 240
            days_per_week:
              type: integer
              minimum: 1
              maximum: 7
            weeks:
              type: integer
              minimum: 1
              maximum: 52
            minute_rate:
              type: integer
              minimum: 1
              description: '`xp_simulation_minute_rate` đã dùng (chỉ đường cong)'
            daily_cap:
              type: integer
              minimum: 1
              description: '`xp_daily_cap` (đường cong) hoặc `points.daily_cap` (season track)'
        points:
          type: array
          maxItems: 52
          items:
            type: object
            required:
              - week
              - level
              - total
            properties:
              week:
                type: integer
                minimum: 1
                maximum: 52
              level:
                type: integer
                minimum: 1
                description: Level (đường cong) hoặc cấp track (season track) cuối tuần
              total:
                type: integer
                minimum: 0
                description: XP hoặc điểm mùa tích lũy cuối tuần
        thresholds:
          type: array
          maxItems: 200
          items:
            type: object
            required:
              - level
              - to_next

    RetentionMatrix:
      type: object
      required:
        - cohorts
        - grain
        - data_as_of
        - is_partial
      properties:
        cohorts:
          type: array
          maxItems: 400
          items:
            type: object
            required:
              - cohort_date
              - cohort_size
            properties:
              cohort_date:
                type: string
                format: date
              cohort_size:
                type:
                  - integer
                  - 'null'
              retention:

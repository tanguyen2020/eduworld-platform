    AttemptMode:
      type: string
      enum:
        - practice
        - assignment
        - quest
        - minigame
        - challenge
        - exam
        - competition
        - retry_wrong
        - diagnostic
    AttemptStatus:
      type: string
      description: Tạm dừng là cờ `paused_at`, không phải trạng thái
      enum:
        - in_progress
        - submitted
        - graded
        - expired
        - abandoned
    FeedbackTiming:
      type: string
      description: Khi nào học sinh thấy đúng/sai + giải thích từng câu (ACTIVITY_ENGINE §8.1)
      enum:
        - immediate
        - after_submit
        - after_close
        - never
    ResultRelease:
      type: string
      description: Khi nào công bố kết quả/đáp án của bài giao, đề (manual = school_admin/academic_manager công bố)
      enum:
        - immediate
        - after_close
        - manual
    QuestionRender:
      type: object
      description: Render payload — KHÔNG chứa đáp án, scoring rule hay giải thích (ADR-0016)
      required:
        - position
        - question_version_id
        - type
        - render_payload
      properties:
        position:
          type: integer
          minimum: 1
        question_version_id:
          $ref: '#/components/schemas/Uuid'
        type:
          $ref: '#/components/schemas/QuestionType'
        render_payload:
          type: object
          description: |
            Phần render của specs/schemas/question.schema.json theo `type` (options/blanks/zones… không có trường đáp án; options[].feedback
            và misconception_tag bị loại khỏi DTO). Server kiểm tra bằng schema render đóng chặt; OpenAPI chặn thêm các khóa đáp án ở cấp gốc (TC-LRN-007).
          additionalProperties: true
          not:
            anyOf:
              - required:
                  - answer_key
              - required:
                  - scoring_rule
              - required:
                  - accepted_answers
              - required:
                  - correct_option_id
              - required:
                  - correct_option_ids
              - required:
                  - explanation
              - required:
                  - feedback
              - required:
                  - option_feedback
              - required:
                  - hints
              - required:
                  - misconception_tag
        media:
          type: array
          items:
            type: object
            properties:
              asset_id:
                $ref: '#/components/schemas/Uuid'
              url:
                type: string
                maxLength: 2048
                format: uri
              kind:
                type: string
                enum:
                  - image
                  - audio
                  - video
        max_score:
          type: number
        hint_count:
          type: integer
          minimum: 0
          maximum: 5
          description: Số cấp gợi ý của item (`hints[]` của version đã ghim) — không lộ nội dung gợi ý; client hiện nút Gợi ý khi > 0 (GODOT_ARCHITECTURE §6.2, F063)
    QuestionType:
      type: string
      enum:
        - single_choice
        - multiple_choice
        - true_false
        - fill_in_blank
        - short_answer
        - numeric
        - matching
        - ordering
        - drag_drop
        - image_based
        - interactive
    QuestionResponse:
      description: Câu trả lời thô theo QuestionType của item; server chọn shape theo `type` của version đã ghim, sai cấu trúc → 422 INVALID_RESPONSE. Không có biểu thức toán do học sinh gõ (ADR-0055)
      oneOf:
        - $ref: '#/components/schemas/SingleChoiceResponse'
        - $ref: '#/components/schemas/MultipleChoiceResponse'
        - $ref: '#/components/schemas/TrueFalseResponse'
        - $ref: '#/components/schemas/FillInBlankResponse'
        - $ref: '#/components/schemas/ShortAnswerResponse'
        - $ref: '#/components/schemas/NumericResponse'
        - $ref: '#/components/schemas/MatchingResponse'
        - $ref: '#/components/schemas/OrderingResponse'
        - $ref: '#/components/schemas/DragDropResponse'
        - $ref: '#/components/schemas/ImageBasedResponse'
        - $ref: '#/components/schemas/InteractiveResponse'
    SingleChoiceResponse:
      type: object
      description: single_choice (cũng dùng cho branch_choice)
      required:
        - option_id
      additionalProperties: false
      properties:
        option_id:
          $ref: '#/components/schemas/ItemId'
    ItemId:
      type: string
      maxLength: 64
      pattern: ^[a-z]_[a-z0-9_]{1,24}$
      description: ID ngắn ổn định trong version (option, blank, zone…) — không tiết lộ thứ tự
    MultipleChoiceResponse:
      type: object
      description: multiple_choice
      required:
        - option_ids
      additionalProperties: false
      properties:
        option_ids:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ItemId'
    TrueFalseResponse:
      description: true_false — một mệnh đề (`value`) hoặc nhiều mệnh đề (`statement_values`)
      oneOf:
        - type: object
          required:
            - value
          additionalProperties: false
          properties:
            value:
              type: boolean
        - type: object
          required:
            - statement_values
          additionalProperties: false
          properties:
            statement_values:
              type: object
              minProperties: 1
              maxProperties: 8
              propertyNames:
                $ref: '#/components/schemas/ItemId'
              additionalProperties:
                type: boolean
    FillInBlankResponse:
      type: object
      description: fill_in_blank — giá trị theo blank id
      required:
        - blanks
      additionalProperties: false
      properties:
        blanks:
          type: object
          minProperties: 1
          maxProperties: 10
          propertyNames:
            $ref: '#/components/schemas/ItemId'
          additionalProperties:
            type: string
            maxLength: 200
    ShortAnswerResponse:
      type: object
      description: short_answer (chấm tự động theo đáp án chấp nhận + chuẩn hóa)
      required:
        - text
      additionalProperties: false
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 500
    NumericResponse:
      type: object
      description: numeric — chuỗi học sinh nhập (dấu thập phân theo decimal_separator; `a/b` khi allow_fraction_input)
      required:
        - value
      additionalProperties: false
      properties:
        value:
          type: string
          minLength: 1
          maxLength: 64
    MatchingResponse:
      type: object
      description: matching — cặp [left_id, right_id]
      required:
        - pairs
      additionalProperties: false
      properties:
        pairs:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: array
            minItems: 2
            maxItems: 2
            prefixItems:
              - $ref: '#/components/schemas/ItemId'
              - $ref: '#/components/schemas/ItemId'
            items: false
    OrderingResponse:
      type: object
      description: ordering — thứ tự item id
      required:
        - order
      additionalProperties: false
      properties:
        order:
          type: array
          minItems: 3
          maxItems: 10
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ItemId'
    DragDropResponse:
      type: object
      description: drag_drop — draggable id → zone id
      required:
        - placements
      additionalProperties: false
      properties:
        placements:
          type: object
          minProperties: 1
          maxProperties: 16
          propertyNames:
            $ref: '#/components/schemas/ItemId'
          additionalProperties:
            $ref: '#/components/schemas/ItemId'
    ImageBasedResponse:
      description: image_based — `points` (hotspot, tọa độ theo image_size gốc) hoặc `label_placements` (label id → drop point id)
      oneOf:
        - type: object
          required:
            - points
          additionalProperties: false
          properties:
            points:
              type: array
              minItems: 1
              maxItems: 10
              items:
                type: object
                required:
                  - x
                  - 'y'
                additionalProperties: false
                properties:
                  x:
                    type: number
                    minimum: 0
                  'y':
                    type: number
                    minimum: 0
        - type: object
          required:
            - label_placements
          additionalProperties: false
          properties:
            label_placements:
              type: object
              minProperties: 1
              maxProperties: 16
              propertyNames:
                $ref: '#/components/schemas/ItemId'
              additionalProperties:
                $ref: '#/components/schemas/ItemId'
    InteractiveResponse:
      type: object
      description: interactive — trạng thái widget + action log; validator Go đã đăng ký chấm
      required:
        - state
      additionalProperties: false
      properties:
        state:
          type: object
          maxProperties: 50
          additionalProperties: true
        action_log:
          type: array
          maxItems: 500
          items:
            type: object
            required:
              - t_ms
              - action
            additionalProperties: false
            properties:
              t_ms:
                type: integer
                minimum: 0
              action:
                type: string
                maxLength: 64
              args:
                type: object
                maxProperties: 20
                additionalProperties: true
    ActivityProgressState:
      type: object
      required:
        - watched_ratio
        - completed
      properties:
        position_ms:
          type: integer
          minimum: 0
        watched_ratio:
          type: number
          minimum: 0
          maximum: 1
        completed:
          type: boolean
        watched_ranges:
          type: array
          maxItems: 64
          description: Khoảng đã xem được server chấp nhận (đã gộp) — client khóa tua theo mép (F065-AC-17)
          items:
            type: object
            required:
              - start_ms
              - end_ms
            properties:
              start_ms:
                type: integer
                minimum: 0
              end_ms:
                type: integer
                minimum: 0
        segment_id:
          type: string
          maxLength: 64
          description: Đoạn đang phát của video tương tác
        pending_cue_ids:
          type: array
          maxItems: 50
          items:
            type: string
            maxLength: 64
        plays_used:
          type: integer
          minimum: 0
          description: Lượt nghe server đã ghi nhận (bài nghe; video luôn 0)
        max_plays:
          type:
            - integer
            - 'null'
          minimum: 1
          maximum: 20
          description: Giới hạn lượt nghe của version (null = không giới hạn)
    ActivityRender:
      type: object
      description: Render payload — KHÔNG chứa đáp án, phản hồi theo phương án hay scoring rule (ADR-0016)
      required:
        - activity_id
        - activity_version_id
        - activity_type
        - title
        - render_payload
      properties:
        activity_id:
          $ref: '#/components/schemas/Uuid'
        activity_version_id:
          $ref: '#/components/schemas/Uuid'
        version:
          type: integer
          minimum: 1
        activity_type:
          $ref: '#/components/schemas/ActivityType'
        title:
          type: string
          maxLength: 255
        instructions:
          type: string
          maxLength: 2000
        time_limit_seconds:
          type: integer
          minimum: 1
        render_payload:
          type: object
          description: Theo specs/schemas/activities/<type>.schema.json (phần hiển thị) — không chứa đáp án, scoring, phản hồi theo phương án hay gợi ý
          additionalProperties: true
          not:
            anyOf:
              - required:
                  - answer_key
              - required:
                  - scoring_rule
              - required:
                  - accepted_answers
              - required:
                  - correct_option_id
              - required:
                  - correct_option_ids
              - required:
                  - explanation
              - required:
                  - feedback
              - required:
                  - option_feedback
              - required:
                  - hints
              - required:
                  - misconception_tag
        math_assets:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/MathAssetRef'
        media:
          type: array
          maxItems: 50
          items:
            type: object
            required:
              - asset_id
              - url
            properties:
              asset_id:
                $ref: '#/components/schemas/Uuid'
              url:
                type: string
                maxLength: 2048
                format: uri
              kind:
                type: string
                enum:
                  - image
                  - audio
                  - video
                  - subtitle
                  - transcript
              variant:
                type: string
                maxLength: 32
                description: Biến thể media (ogv_480, ogv_720, ogg, vtt…) — client chọn theo preset chất lượng (F065 research R3)
              language:
                type: string
                maxLength: 8
                description: Ngôn ngữ của phụ đề (kind subtitle)
              segment_id:
                type: string
                maxLength: 64
                description: Đoạn của video tương tác (vắng = video chính)
              expires_at:
                $ref: '#/components/schemas/Timestamp'
                description: Hết hạn của signed URL (media riêng tenant
                ADR-0044): null
        min_client_version:
          type: string
          maxLength: 32
        content_language:
          $ref: '#/components/schemas/ContentLanguage'
        display_language:
          $ref: '#/components/schemas/Locale'
        translation_missing:
          type: boolean
          description: true khi học sinh chọn ngôn ngữ chưa có bản dịch — hiển thị ngôn ngữ gốc kèm nhãn "Chưa có bản tiếng Anh"
    MathAssetRef:
      type: object
      description: Công thức đã render sẵn thành SVG (ADR-0055) — game chỉ hiển thị
      required:
        - math_id
        - svg_url
      properties:
        math_id:
          type: string
          maxLength: 64
        svg_url:
          type: string
          maxLength: 2048
          format: uri
        sha256:
          type: string

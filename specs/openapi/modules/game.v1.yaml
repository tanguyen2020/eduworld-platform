        area_id:
          type: string
          maxLength: 64
        scene_ref:
          type: string
          maxLength: 255
        bundle_id:
          type: string
          maxLength: 64
        capacity:
          type: integer
        accessible:
          type: boolean
        lock_reason:
          type: string
          maxLength: 1000
          description: vd. outside_allowed_hours, grade_not_allowed
        name:
          $ref: '#/components/schemas/LocalizedName'
        region_code:
          type: string
          maxLength: 64
          description: Vùng đất chứa khu (WORLD_DESIGN §3)
    LocalizedName:
      type: object
      description: Tên/nhãn hiển thị song ngữ bắt buộc cả vi và en (văn bản game — ADR-0056 mục 2)
      required:
        - vi
        - en

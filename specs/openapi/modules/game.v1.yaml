    post:
      x-service: game
      tags:
        - game
      operationId: nextChallengeActivity
      summary: Lấy hoạt động tiếp theo — module game tạo Attempt học tập (mode challenge) qua module learning
      description: |
        Module game gọi `createAttempt` (mode `challenge`, context `challenge_attempt`, dải độ khó của mức, khối học sinh) qua facade
        `learning`; payload không có đáp án. Quá `deadline_at` hoặc challenge đã kết thúc → `422 INVALID_STATE_TRANSITION`; nội dung
        tham chiếu chưa publish → `422 ITEM_REF_INVALID`; module learning lỗi/timeout → `503 UNAVAILABLE` có `Retry-After`, challenge
        không đổi; gọi lại cùng `Idempotency-Key` → cùng attempt học tập (F076-AC-08, AC-12, AC-13).
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/ChallengeAttemptIdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Hoạt động tiếp theo hoặc challenge đã kết thúc
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeNextActivity'
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
            Content-Language:
              $ref: '#/components/headers/ContentLanguage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '503':
          description: UNAVAILABLE — module learning tạm thời không trả lời; thử lại theo Retry-After, challenge không đổi
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

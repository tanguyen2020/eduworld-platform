  headers:
    ContentLanguage:
      description: Ngôn ngữ của văn bản đã chọn trong response (`vi-VN` | `en-US`)
      schema:
        type: string
        maxLength: 16
    IdempotentReplayed:
      description: |
        Có giá trị `true` khi response được phát lại từ kho idempotency (cùng `Idempotency-Key` + cùng body trong `idempotency_record_ttl`);
        vắng mặt khi request được xử lý lần đầu (API_DESIGN §6, F003).
      schema:
        type: string
        enum:
          - 'true'
    RetryAfter:
      schema:
        type: integer
    RateLimitLimit:
      schema:
        type: integer
    RateLimitRemaining:
      schema:
        type: integer
    RateLimitReset:
      schema:
        type: integer
    ETag:
      description: Phiên bản tài nguyên cho optimistic concurrency
      schema:
        type: string
        maxLength: 512
  responses:
    Unauthenticated:
      description: Thiếu/sai/hết hạn token (UNAUTHENTICATED)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem:
      description: Lỗi (RFC 9457)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationFailed:
      description: VALIDATION_FAILED, SIS_CONTRACT_VERSION_UNSUPPORTED, ATTEMPT_DEADLINE_PASSED, INVALID_STATE_TRANSITION, MODERATION_SWITCH_REASON_REQUIRED, SENSITIVE_TERM_INVALID, SENSITIVE_CATALOG_REGRESSION_FAILED, DASHBOARD_RANGE_TOO_LARGE, ROLE_NOT_FOUND; sub-code `errors[].code = PERMISSION_NOT_ALLOWED_FOR_SCOPE` khi role tenant chứa permission platform
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
    Forbidden:
      description: PERMISSION_DENIED, FEATURE_DISABLED (action/menu portal đang tắt, có `feature_key` — ADR-0090), GAME_ACCESS_STUDENT_ONLY, POLICY_DENIED, TENANT_NOT_SELECTED, TENANT_MISMATCH, TENANT_ACCESS_DISABLED, RESOURCE_NOT_ASSIGNED, ACCOUNT_LOCKED, ACCOUNT_DEACTIVATED, ACCOUNT_NOT_PROVISIONED, NO_ACTIVE_ENROLLMENT, ACCESS_OUTSIDE_ALLOWED_HOURS, CURFEW_ACTIVE, DAILY_PLAY_LIMIT_REACHED, PARTY_NOT_LEADER, PARTY_INVITE_NOT_ALLOWED, PARTY_POLICY_VIOLATION, CHAT_NOT_ALLOWED, CHAT_KIND_NOT_ALLOWED, CHAT_MUTED, TENANT_TOGGLE_NOT_ALLOWED, MODERATION_SWITCH_SELF_APPROVAL, PORTAL_ACCESS_STAFF_ONLY, HINTS_NOT_ALLOWED
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionRequired:
      description: IDEMPOTENCY_KEY_REQUIRED hoặc PRECONDITION_REQUIRED
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Không tồn tại hoặc ngoài tenant scope (NOT_FOUND)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: RATE_LIMITED, LOGIN_QUEUE_BUSY (hàng chờ đăng nhập game, ADR-0045/0068)
      headers:
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotModified:
      description: Không đổi so với If-None-Match
      headers:
        ETag:
          schema:
            type: string
            maxLength: 128
    Conflict:
      description: Xung đột trạng thái (vd. CONTENT_VERSION_CONFLICT, CONTENT_NOT_PUBLISHED, SIS_SCHOOL_ALREADY_CONNECTED, SIS_SYNC_ALREADY_RUNNING, SIS_CONNECTION_NOT_ACTIVE, ATTEMPT_ALREADY_SUBMITTED, EXAM_ALREADY_SUBMITTED, PARTY_ALREADY_IN_PARTY, PARTY_FULL, MM_TICKET_ALREADY_ACTIVE, IDEMPOTENCY_KEY_REUSED, IDENTITY_CONFLICT, USERNAME_TAKEN, EMAIL_TAKEN, HINTS_EXHAUSTED, ASSIGNMENT_NOT_EDITABLE, MODERATION_CASE_CLOSED)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    DashboardBusy:
      description: DASHBOARD_BUSY — người dùng đã có quá số truy vấn dashboard đồng thời, hoặc EXPORT_LIMIT_REACHED với export; thử lại theo Retry-After
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    DashboardTimeout:
      description: DASHBOARD_QUERY_TIMEOUT — truy vấn bị hủy ở database sau statement_timeout 5 giây (DASHBOARD_DATA §8)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailed:
      description: VERSION_MISMATCH
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PayloadTooLarge:
      description: MEDIA_TOO_LARGE — vượt giới hạn dung lượng của loại media (ADR-0044)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnsupportedMediaType:
      description: MEDIA_TYPE_NOT_ALLOWED — loại file không được phép hoặc magic bytes không khớp
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  securitySchemes:
    keycloakBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token Keycloak (realm eduworld, aud eduworld-api, TTL 5 phút).
    keycloakAdminBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token Keycloak của Admin Portal (claim `azp = eduworld-portal`, phát qua `POST /auth/portal/login` — ADR-0091) có MFA (`acr` mức MFA, `amr` chứa `otp`; thiếu hoặc `auth_time` quá 8 giờ → 403 MFA_REQUIRED),
        Principal phải có role platform với permission tương ứng (`game.*`, `competition.config.*`, `platform.*`).
        Chỉ dùng trên gateway nội bộ (ADR-0027).
    keycloakOidc:
      type: openIdConnect
      description: Host thật theo môi trường (`sso.<env>.<domain>`, OQ-10); URL dưới đây là placeholder hợp lệ.
      openIdConnectUrl: https://sso.eduworld.example/realms/eduworld/.well-known/openid-configuration

    GameProfileUpdate:
      type: object
      properties:
        nickname_option_id:
          $ref: '#/components/schemas/Uuid'
        settings:
          type: object
          additionalProperties: true
        preferred_language:
          $ref: '#/components/schemas/Locale'
    ValidationProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            errors:
              type: array
              items:
                type: object
                required:
                  - field
                  - code
                properties:
                  field:
                    type: string
                    maxLength: 64
                  code:
                    type: string
                    maxLength: 64
                  message:
                    type: string
                    maxLength: 1000
    NicknameSuggestion:
      type: object
      required:
        - nickname_option_id
        - nickname
      properties:
        nickname_option_id:
          $ref: '#/components/schemas/Uuid'
        nickname:
          type: string
          maxLength: 24
    GameSessionCreate:
      type: object
      required:
        - client_platform
        - client_version
      properties:
        client_platform:
          type: string
          enum:
            - windows
            - android
            - ios
            - web
            - macos
            - linux
        client_version:
          type: string
          maxLength: 32
        device_class:
          type: string
          enum:
            - low
            - mid
            - high
        device_model:
          type: string
          maxLength: 64
          description: Tên rút gọn, không định danh phần cứng
        takeover:
          type: boolean
          default: false
          description: true sau khi học sinh xác nhận đăng xuất thiết bị khác (ADR-0031)
    GameSession:
      type: object
      required:
        - game_session_id
        - started_at
        - login_at
      properties:
        game_session_id:
          $ref: '#/components/schemas/Uuid'
        started_at:
          $ref: '#/components/schemas/Timestamp'
        login_at:
          $ref: '#/components/schemas/Timestamp'
        replaced_session_id:
          description: Session trên thiết bị cũ đã bị kết thúc do takeover
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        assigned_area_id:
          type: string
          maxLength: 64
    Timestamp:
      type: string
      format: date-time
    ActiveSessionConflict:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required:
            - other_device
          properties:
            other_device:
              $ref: '#/components/schemas/OtherDevice'
    OtherDevice:
      type: object
      required:
        - platform
        - last_seen_at
      properties:
        platform:
          type: string
          enum:
            - windows
            - android
            - ios
            - web
            - macos
            - linux
        device_label:
          type: string
          maxLength: 64
          description: Ví dụ "Máy tính Windows", "Điện thoại Android"
        last_seen_at:
          $ref: '#/components/schemas/Timestamp'
    ClientVersionProblem:
      description: '`426 CLIENT_VERSION_UNSUPPORTED` — game hiển thị màn cập nhật'
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required:
            - min_client_version
          properties:
            min_client_version:
              type: string
              maxLength: 32
            store_url:
              type: string
              maxLength: 2048
              format: uri
    RealtimeTicket:
      type: object
      required:
        - ticket
        - expires_at
        - url
      properties:
        ticket:
          type: string
          maxLength: 512
          description: Opaque, dùng 1 lần
        expires_at:
          $ref: '#/components/schemas/Timestamp'
        url:
          type: string
          maxLength: 2048
          format: uri
          description: wss://.../realtime/v1
        protocol_version:
          type: integer
          default: 1
    ContentManifest:
      type: object
      required:
        - tenant_id
        - manifest_version
        - etag
        - items
      description: Manifest nội dung theo tenant (ADR-0043). Snapshot bất biến theo (item_id, version); client cache theo khóa có version
      properties:
        tenant_id:
          $ref: '#/components/schemas/Uuid'
        manifest_version:
          type: integer
          format: int64
        etag:
          type: string
          maxLength: 128
        generated_at:
          $ref: '#/components/schemas/Timestamp'
        min_client_version:
          type: string
          maxLength: 64
        activity_min_client_versions:
          type: object
          description: Phiên bản client tối thiểu theo `activity_type` (FR-EXR-015, ACTIVITY_ENGINE §12) — client chặn mở hoạt động trước khi start (F063-AC-25)
          maxProperties: 16
          propertyNames:
            $ref: '#/components/schemas/ActivityType'
          additionalProperties:
            type: string
            maxLength: 32
          example:
            quiz: 0.0.0
            interactive_exercise: 0.0.0
            simulation: 1.4.0
        items:
          type: array
          maxItems: 20000
          items:
            $ref: '#/components/schemas/ContentManifestItem'
        bundles:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/ContentBundle'
        areas:
          type: array
          maxItems: 500
          items:
            type: object
            required:
              - area_id
              - bundle_id
            properties:
              area_id:
                type: string
                maxLength: 128
              scene_ref:
                type: string
                maxLength: 512
              bundle_id:
                type: string
                maxLength: 128
    ActivityType:
      type: string
      description: Loại learning activity trong version này (ADR-0072, ADR-0082)
      enum:
        - quiz
        - interactive_exercise
        - minigame
        - video_lesson
        - audio_lesson
        - simulation
    ContentManifestItem:
      type: object
      required:
        - item_type
        - item_id
        - version_id
        - version_no
        - sha256
      properties:
        item_type:
          type: string
          maxLength: 64
        item_id:
          $ref: '#/components/schemas/Uuid'
        version_id:
          $ref: '#/components/schemas/Uuid'
        version_no:
          type: integer
          minimum: 1
        snapshot_url:
          type: string
          format: uri
          maxLength: 2048
          description: Vắng với nội dung chỉ phục vụ qua API (câu hỏi đề, nội dung nhạy cảm)
        sha256:
          type: string
          maxLength: 64
        activity_type:
          $ref: '#/components/schemas/ActivityType'
        min_client_version:
          type: string
          maxLength: 32
          description: Phiên bản client tối thiểu của activity_type (ACTIVITY_ENGINE §12, F026-AC-25)
    ContentBundle:
      type: object
      required:
        - bundle_id
        - version
        - url
        - sha256
      properties:
        bundle_id:
          type: string
          maxLength: 128
        version:
          type: integer
          minimum: 1
        url:
          type: string
          format: uri
          maxLength: 2048
        sha256:
          type: string
          maxLength: 64
        size_bytes:
          type: integer
          format: int64
        platforms:
          type: array
          items:
            type: string
            enum:
              - windows
              - android
              - ios
              - web
              - macos
              - linux
        requires_client:
          type: string
          maxLength: 64

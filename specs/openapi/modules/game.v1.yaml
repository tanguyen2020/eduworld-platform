        code:
          type: string
          maxLength: 64
        name:
          $ref: '#/components/schemas/LocalizedText'
        quest_type:
          $ref: '#/components/schemas/QuestType'
        grade_levels:
          type: array
          maxItems: 9
          items:
            type: integer
            minimum: 1
            maximum: 9
        subject_id:
          $ref: '#/components/schemas/Uuid'
        subject_code:
          type: string
          maxLength: 64
        area_id:
          type: string
          maxLength: 64
        giver_npc_id:
          type: string
          maxLength: 64
        story_chapter_code:
          type: string
          maxLength: 64
        start_trigger:
          type: string
          maxLength: 64
          description: npc, quest_board, auto_daily, auto_weekly, chain, discovery, level_reached…
        status:
          $ref: '#/components/schemas/QuestStatus'
        can_accept:
          type: boolean
          description: Quest `available` nhận được ngay (đủ điều kiện, chưa vượt giới hạn)
        locked_reason:
          type: string
          enum:
            - prerequisite_not_met

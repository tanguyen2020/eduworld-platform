        QUEST_PREREQUISITE_NOT_MET` kèm `missing_requirements`; `409 QUEST_ACTIVE_LIMIT` (`max_active_quests`),
        `QUEST_ALREADY_COMPLETED` (`once` đã xong, vượt `max_completions`, kỳ đã xong), `QUEST_COOLDOWN` (kèm `retry_after`).

          type: string
          enum:
            - xp
            - item
            - badge
            - currency
            - title
            - collection_item
        amount:
          type: integer
        item_id:
          $ref: '#/components/schemas/Uuid'
        ref:
          type: string
          maxLength: 64
          description: Mã item/badge/currency/title/collection của phần thưởng quest (quest.schema.json v2)

      type: object
      required:
        - area_id
        - room_id
        - room_type
      properties:
        area_id:
          type: string
          maxLength: 64
        room_id:
          $ref: '#/components/schemas/Uuid'
        room_type:
          type: string
          enum:
            - hub_instance
            - private_instance
        spawn_point_id:
          type: string
          maxLength: 64
    TelemetryBatch:
      type: object
      required:
        - platform
        - client_version
        - events
      description: Lô telemetry không PII (ADR-0058). Tenant tắt telemetry sản phẩm thì client không gửi screen_view/tutorial_step; perf/crash và break_reminder_shown (chỉ số chơi lành mạnh) vẫn gửi.
      properties:
        platform:
          type: string
          maxLength: 32
        client_version:
          type: string
          maxLength: 64
        device_tier:
          $ref: '#/components/schemas/DeviceTier'
        preset:
          $ref: '#/components/schemas/QualityPreset'
        renderer:
          $ref: '#/components/schemas/RendererKind'
        locale:
          $ref: '#/components/schemas/Locale'
        events:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/TelemetryEvent'
    DeviceTier:
      type: string
      enum:
        - minimum
        - mid
        - high
      description: Hạng thiết bị (ADR-0057, PERFORMANCE_BUDGET)
    TelemetryEvent:
      type: object
      required:
        - type
        - occurred_at
      description: Không PII (GAME_ANALYTICS §3.2). Thuộc tính dùng theo type.
      properties:
        type:
          type: string
          enum:
            - screen_view
            - tutorial_step
            - perf_sample
            - load_time
            - client_error
            - crash
            - network_sample
            - break_reminder_shown
        client_event_id:
          $ref: '#/components/schemas/Uuid'
          description: Khử trùng phía server
        occurred_at:
          $ref: '#/components/schemas/Timestamp'
        screen_code:
          type: string
          maxLength: 64
        duration_ms:
          type: integer
          minimum: 0
        step_code:
          type: string
          maxLength: 64
        result:
          type: string
          enum:
            - done
            - skipped
        scene_code:
          type: string
          maxLength: 64
        fps_p50:
          type: number
        fps_p10:
          type: number
        frame_ms_p95:
          type: number
        render_scale:
          type: number
          minimum: 0.3
          maximum: 1
        mem_mb:
          type: integer
          minimum: 0
        kind:
          type: string
          enum:
            - cold_start
            - area_transition
            - activity_open
        ms:
          type: integer
          minimum: 0
        error_code:
          type: string
          maxLength: 64
        fatal:
          type: boolean
        crash_signature:
          type: string
          maxLength: 256
        rtt_p50_ms:
          type: integer
          minimum: 0
        rtt_p95_ms:
          type: integer
          minimum: 0
        reconnects:
          type: integer
          minimum: 0
        reminder_no:
          type: integer
          minimum: 1
          maximum: 20
          description: 'break_reminder_shown: lần nhắc nghỉ thứ mấy trong phiên (GAME_ANALYTICS §3.2)'
        minutes_played:
          type: integer
          minimum: 0
          maximum: 1440
          description: 'break_reminder_shown: số phút chơi liên tục client đếm lúc nhắc; chỉ dùng cho thống kê chơi lành mạnh'

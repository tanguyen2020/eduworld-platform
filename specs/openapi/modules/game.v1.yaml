components:
  parameters:
    TenantIdHeader:
      name: X-Tenant-Id
      in: header
      required: true
      description: |
        Tenant của phiên (ADR-0065). Lấy từ `PlayerBootstrap.tenant_id` (game) hoặc tenant đã chọn sau đăng nhập portal (`GET /me/tenants`).
        Gateway trả `400 TENANT_HEADER_REQUIRED` khi thiếu, `400 BAD_REQUEST` khi sai định dạng; backend kiểm tra khớp token + membership,
        lệch → `403 TENANT_MISMATCH`. `Principal.tenant_id` lấy từ kết quả kiểm tra, không lấy thẳng từ header.
      schema:
        $ref: '#/components/schemas/Uuid'
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: Ngôn ngữ hiển thị mong muốn (`vi-VN` mặc định, `en-US`). Server chọn ngôn ngữ trả về và đặt `Content-Language` (ADR-0056). Dữ liệu cache dài (manifest, snapshot) luôn trả đủ vi+en.
      schema:
        type: string
        maxLength: 64
        examples:
          - vi-VN
          - en-US
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        UUIDv7 do client sinh cho mỗi thao tác (ADR-0010, ADR-0089 §4); timestamp trong key lệch quá `idempotency_record_ttl`
        (24 h) so với giờ server hoặc key không phải UUIDv7 → `400 BAD_REQUEST`. Bản ghi giữ trong `idempotency_record_ttl`;
        gửi lại cùng key + cùng body → response đã lưu kèm `Idempotent-Replayed: true`; khác body → `409 IDEMPOTENCY_KEY_REUSED`.
      schema:
        type: string
        format: uuid
        pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
    DeviceIdHeader:
      name: X-Device-Id
      in: header
      required: true
      description: UUID của bản cài game (sinh lần đầu, lưu user://). Dùng cho quy tắc một thiết bị (ADR-0031), không phải credential.
      schema:
        $ref: '#/components/schemas/Uuid'
    GameSessionId:
      name: game_session_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: ETag của manifest client đang có; trùng → 304
      schema:
        type: string
        maxLength: 128
    AreaId:
      name: area_id
      in: path
      required: true
      description: Danh sách chuẩn ở docs/01-game-design/WORLD_DESIGN.md §3 (vd. main_hub, learning_zone.math, quest_zone.discovery_ocean, challenge_mountain, arena)
      schema:
        type: string
        maxLength: 64
        pattern: ^[a-z0-9_.]{1,64}$
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      description: Cursor opaque từ page.next_cursor
      schema:
        type: string
        maxLength: 512
    QuestId:
      name: quest_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    StepId:
      name: step_id
      in: path
      required: true
      schema:
        type: string
        maxLength: 64
        pattern: ^[a-z0-9_\-]{1,64}$
    StudentId:
      name: student_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    TenantIds:
      name: tenant_ids
      in: query
      required: false
      description: |
        Chỉ System Admin (platform.cross_tenant.read): lọc theo một hoặc nhiều tenant; vắng mặt = tất cả tenant.
        Người dùng tenant gửi tham số này bị bỏ qua (luôn khóa vào tenant của phiên) — ADR-0027 §6.
      style: form
      explode: true
      schema:
        type: array
        maxItems: 100
        items:
          $ref: '#/components/schemas/Uuid'
    DashboardFrom:
      name: from
      in: query
      required: true
      description: Ngày bắt đầu (bao gồm, theo múi giờ tenant). Khoảng `from`–`to` tối đa 730 ngày (`dashboard_max_range_days`) — vượt → `422 DASHBOARD_RANGE_TOO_LARGE` (DASHBOARD_DATA §8).
      schema:
        type: string
        format: date
    DashboardTo:
      name: to
      in: query
      required: true
      description: Ngày kết thúc (bao gồm). Phải ≥ `from`.
      schema:
        type: string
        format: date
    DashboardGrain:
      name: grain
      in: query
      required: false
      description: |
        Độ hạt **gợi ý**; server quyết định theo khoảng (≤ 31 ngày → day; 32 ngày–1 năm → week; > 1 năm → month) và chỉ chấp nhận
        độ hạt **thô hơn** quy tắc, không mịn hơn (DASHBOARD_DATA §8). Phản hồi luôn trả `grain` thực dùng.
      schema:
        $ref: '#/components/schemas/DashboardGrain'
    GameConfigId:
      name: config_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    Version:
      name: version
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        maxLength: 512
    TranslationJobIdPath:
      name: job_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    EventIdPath:
      name: event_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    EventRunIdPath:
      name: run_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    AssetIdPath:
      name: asset_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ChallengeIdPath:
      name: challenge_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ChallengeAttemptIdPath:
      name: challenge_attempt_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    EncounterIdPath:
      name: encounter_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    MilestoneIdPath:
      name: milestone_id
      in: path
      required: true
      schema:
        type: string
        maxLength: 64
    GoalIdPath:
      name: goal_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    SeasonTierPath:
      name: tier
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 100
    FunnelCodePath:
      name: funnel_code
      in: path
      required: true
      schema:
        type: string
        maxLength: 64
    TenantIdHeaderOptional:
      name: X-Tenant-Id
      in: header
      required: false
      description: |
        Người dùng tenant: **bắt buộc** (thiếu → `400 TENANT_HEADER_REQUIRED`). Role platform (System Admin, content_admin…):
        vắng mặt = phạm vi platform / đọc liên tenant bằng `tenant_ids`; có giá trị = tenant đích của thao tác ghi (ADR-0027, ADR-0065).
        Có giá trị thì luôn được kiểm tra như `TenantIdHeader`.
      schema:
        $ref: '#/components/schemas/Uuid'
  schemas:
    Uuid:
      type: string
      format: uuid
      description: UUIDv7
    GameProfile:
      type: object
      required:
        - student_id
        - nickname
        - level
        - xp_total
      properties:
        student_id:
          $ref: '#/components/schemas/Uuid'
        nickname:
          type: string
          maxLength: 128
        level:
          type: integer
          minimum: 1
        xp_total:
          type: integer
          minimum: 0
        avatar_config:
          $ref: '#/components/schemas/AvatarConfig'
        last_area_id:
          type: string
          maxLength: 64
        settings:
          type: object
          additionalProperties: true
        preferred_language:
          $ref: '#/components/schemas/Locale'
    AvatarConfig:
      type: object
      properties:
        body:
          type: string
          maxLength: 1000
        skin_tone:
          type: string
          maxLength: 64
        hair_item_id:
          $ref: '#/components/schemas/Uuid'
        outfit_item_id:
          $ref: '#/components/schemas/Uuid'
        accessory_item_ids:
          type: array
          maxItems: 4
          items:
            $ref: '#/components/schemas/Uuid'
        emote_item_ids:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/Uuid'
    Locale:
      type: string
      enum:
        - vi-VN
        - en-US
      description: Locale đầy đủ dùng ở client/HTTP (ADR-0056)
    Problem:
      type: object
      required:
        - type
        - title
        - status
        - code
      properties:
        type:
          type: string
          maxLength: 2048
          format: uri
        title:
          type: string
          maxLength: 255
        status:
          type: integer
        code:
          description: Mã ổn định; client phải chấp nhận giá trị chưa biết
          anyOf:
            - $ref: '#/components/schemas/ProblemCode'
            - type: string
              maxLength: 64
        detail:
          type: string
          maxLength: 1000
        instance:
          type: string
          maxLength: 2048
        trace_id:
          type: string
          maxLength: 64
        retryable:
          type: boolean
          description: 'Có khi lỗi tạm thời (vd. `503 UNAVAILABLE` khi module identity không trả Principal): client được phép thử lại với backoff (F002-AC-09)'
        policy_reason:
          type: string
          maxLength: 1000
        feature_key:
          type: string
          maxLength: 128
          description: 'Chỉ có khi `code = FEATURE_DISABLED`: khóa action hoặc menu cha đang tắt (ADR-0090)'
        reopen_at:

          properties:
            active:
              type: boolean
            message:
              type: string
              maxLength: 1000
            until:
              $ref: '#/components/schemas/Timestamp'
        login:
          type: object
          description: Đăng nhập game bằng form trong game qua backend (ADR-0068) — game không dùng OIDC trình duyệt, không có client_id/secret phía game
          properties:
            login_url:
              type: string
              maxLength: 2048
              format: uri
              description: URL đầy đủ của `POST /auth/game/login`
            remember_username_default:
              type: boolean
              description: Mặc định bật "Nhớ tên đăng nhập" (chỉ username, điền sẵn form khi phiên hết hạn — ADR-0086); tắt sẵn trên thiết bị phòng máy (`shared_device`)
            password_help:
              $ref: '#/components/schemas/LocalizedText'
        world_manifest_url:
          type: string
          maxLength: 2048
          format: uri
        realtime_url:
          type: string
          maxLength: 2048
          format: uri
        feature_flags:
          type: object
          additionalProperties:
            type: boolean
        device_profiles:
          type: array
          maxItems: 200
          description: Ép renderer/preset cho thiết bị biết trước có lỗi (PERFORMANCE_BUDGET)
          items:
            $ref: '#/components/schemas/DeviceProfile'
        supported_locales:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/Locale'
    LocalizedText:

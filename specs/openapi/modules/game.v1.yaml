        deadline_at:
          $ref: '#/components/schemas/Timestamp'
        submitted_at:
          $ref: '#/components/schemas/Timestamp'
        server_time:
          $ref: '#/components/schemas/Timestamp'
        feedback_timing:
          $ref: '#/components/schemas/FeedbackTiming'
        result_release:
          $ref: '#/components/schemas/ResultRelease'

          items:
            type: string
            maxLength: 64
        count:
          type: integer
          minimum: 1
    QuestStepType:
      type: string
      description: Loại bước của quest.schema.json v2 (QUEST_SYSTEM §3); F072 xử lý talk_npc, go_to, collect, discover, activity
      enum:
        - talk_npc
        - go_to
        - collect
        - discover
        - activity
        - minigame
        - party_activity
        - interdependent
        - challenge
        - boss
    RewardPreview:
      type: object

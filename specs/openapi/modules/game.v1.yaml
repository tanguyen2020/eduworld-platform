        missing_requirements:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/QuestRequirement'
        available_until:
          $ref: '#/components/schemas/Timestamp'
        retry_after:
          $ref: '#/components/schemas/Timestamp'
          description: Thời điểm nhận lại được khi đang cooldown
        progress:
          $ref: '#/components/schemas/QuestProgress'
    QuestRequirement:
      type: object
      description: Điều kiện còn thiếu để nhận quest (thân thiện, không lộ dữ liệu người khác)
      required:
        - kind
        - met
      properties:
        kind:
          type: string
          enum:
            - completed_quest
            - unlocked_area
            - min_level
            - learning_objective
            - discovery
        ref:
          type: string
          maxLength: 64
        met:
          type: boolean
        current:
          type: integer
          minimum: 0
        target:
          type: integer
          minimum: 0
        min_mastery_level:
          type: string
          enum:
            - beginning
            - developing
            - proficient
            - mastered
    QuestProgress:
      type: object
      required:
        - quest_progress_id
        - quest_id
        - quest_version_id
        - status
        - step_states
        - started_at
      properties:
        quest_progress_id:
          $ref: '#/components/schemas/Uuid'
        quest_id:
          $ref: '#/components/schemas/Uuid'
        quest_version_id:
          $ref: '#/components/schemas/Uuid'
        status:
          $ref: '#/components/schemas/QuestProgressStatus'
        step_states:
          type: object
          maxProperties: 30
          additionalProperties:
            $ref: '#/components/schemas/QuestStepState'
        start_trigger:
          type: string
          maxLength: 64
        period_key:
          type: string
          maxLength: 16
        completion_no:
          type: integer
          minimum: 1
        party_id:
          $ref: '#/components/schemas/Uuid'
        started_at:
          $ref: '#/components/schemas/Timestamp'
        completed_at:
          $ref: '#/components/schemas/Timestamp'
        expires_at:
          $ref: '#/components/schemas/Timestamp'
        deadline_at:
          $ref: '#/components/schemas/Timestamp'
          description: Hết giờ theo availability.time_limit_minutes
        failed_at:
          $ref: '#/components/schemas/Timestamp'
        party_progress:
          type: array
          maxItems: 30
          description: |
            Tiến độ chung của phiên quest party (F103-AC-15): chỉ tỷ lệ chung và việc chính người gọi đã đạt `min_contribution`
            — không có số câu đúng hay xếp hạng của thành viên khác (R19).
          items:
            $ref: '#/components/schemas/QuestPartyStepProgress'
    QuestProgressStatus:
      type: string
      description: Trạng thái QuestProgress (QUEST_SYSTEM §5)
      enum:
        - active
        - completed
        - expired
        - abandoned
        - failed
    QuestStepState:
      type: object

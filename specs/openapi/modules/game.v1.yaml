        - data_as_of
        - is_partial
      properties:
        funnel_code:
          type: string
          maxLength: 64
        steps:
          type: array
          maxItems: 50
          items:
            type: object
            required:
              - step_code
            properties:
              step_code:
                type: string
                maxLength: 64
              count:
                type:
                  - integer
                  - 'null'
              conversion_rate:
                type:
                  - number
                  - 'null'
        grain:
          $ref: '#/components/schemas/DashboardGrain'
        data_as_of:
          $ref: '#/components/schemas/Timestamp'
          description: '`computed_at` cũ nhất trong kết quả (DASHBOARD_DATA §8)'
        is_partial:
          type: boolean
          description: true nếu có dòng chưa chốt (hôm nay)
    ContentStatsItem:

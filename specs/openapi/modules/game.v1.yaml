    GameProfileUpdate:
      type: object
      additionalProperties: false
      description: Nickname chỉ đặt qua nickname_option_id của suggestNicknames; trường nickname tự do bị từ chối 422 (F070-AC-10, R16).
      properties:
        nickname_option_id:
          $ref: '#/components/schemas/Uuid'
        settings:
          type: object
          additionalProperties: true
        preferred_language:
          $ref: '#/components/schemas/Locale'
    ValidationProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            errors:
              type: array
              items:
                type: object
                required:
                  - field
                  - code
                properties:
                  field:
                    type: string
                    maxLength: 64
                  code:
                    type: string
                    maxLength: 64
                  message:
                    type: string
                    maxLength: 1000
    CharacterCatalog:
      type: object
      description: Danh mục tạo nhân vật đang publish (nội dung platform có version, ADR-0043) — bản JSON Schema specs/schemas/character-catalog.schema.json (F070-AC-02). Bộ từ nickname không gửi xuống client (gợi ý sinh ở server).
      required:
        - catalog_version_id
        - version
        - presets
        - body_types
        - skin_tones
        - hair_colors
        - default_item_ids
        - default_emote_ids
        - items
      properties:
        catalog_version_id:
          $ref: '#/components/schemas/Uuid'
        version:
          type: integer
          minimum: 1
        presets:
          type: array
          maxItems: 12
          items:
            type: object
            required:
              - preset_code
              - name
              - avatar_config
            properties:
              preset_code:
                $ref: '#/components/schemas/CatalogCode'
              name:
                $ref: '#/components/schemas/CatalogName'
              avatar_config:
                $ref: '#/components/schemas/AvatarConfig'
              thumbnail_asset_id:
                $ref: '#/components/schemas/Uuid'
        body_types:
          $ref: '#/components/schemas/CatalogNamedCodes'
        skin_tones:
          $ref: '#/components/schemas/CatalogNamedCodes'
          description: Mã màu da = khóa token design/game-tokens avatar.skin_tone.<code>; client lấy màu từ token, danh mục không gửi mã màu (OQ F070-2)
        hair_colors:
          $ref: '#/components/schemas/CatalogNamedCodes'
          description: Mã màu tóc = khóa token design/game-tokens avatar.hair_color.<code> (OQ F070-2)
        default_item_ids:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/CatalogCode'
        default_emote_ids:
          type: array
          maxItems: 6
          items:
            $ref: '#/components/schemas/CatalogCode'
        items:
          type: array
          maxItems: 206
          description: Tên vi/en và ô trang phục của mỗi item và emote mặc định (một mục cho mỗi mã của default_item_ids và default_emote_ids; OQ F070-1). Rỗng với version publish trước khi có tên — client hiển thị nhãn thứ tự.
          items:
            $ref: '#/components/schemas/CatalogItem'
    CatalogName:
      type: object
      required:
        - vi
        - en
      properties:
        vi:
          type: string
          maxLength: 64
        en:
          type: string
          maxLength: 64
    CatalogNamedCodes:
      type: array
      maxItems: 32
      items:
        type: object
        required:
          - code
          - name
        properties:
          code:
            $ref: '#/components/schemas/CatalogCode'
          name:
            $ref: '#/components/schemas/CatalogName'
    CatalogItem:
      type: object
      description: Mục hiển thị của một item/emote trong danh mục nhân vật (không nói học sinh sở hữu hay không — server quyết)
      required:
        - item_id
        - equip_slot
        - name
      properties:
        item_id:
          $ref: '#/components/schemas/CatalogCode'
        equip_slot:
          type: string
          enum:
            - hair
            - outfit
            - head
            - face
            - back
            - hand
            - emote
        name:
          $ref: '#/components/schemas/CatalogName'
      example:
        item_id: hair_short_01
        equip_slot: hair
        name:
          vi: Tóc ngắn
          en: Short hair
    NicknameSuggestion:
      type: object
      required:
        - nickname_option_id
        - nickname
      properties:
        nickname_option_id:
          $ref: '#/components/schemas/Uuid'
        nickname:
          type: string
          maxLength: 24
    GameSessionCreate:
      type: object
      required:
        - client_platform
        - client_version
      properties:
        client_platform:
          type: string
          enum:
            - windows
            - android
            - ios
            - web
            - macos
            - linux
        client_version:
          type: string
          maxLength: 32
        device_class:
          type: string
          enum:
            - low
            - mid
            - high
        device_model:
          type: string
          maxLength: 64
          description: Tên rút gọn, không định danh phần cứng
        takeover:
          type: boolean
          default: false
          description: true sau khi học sinh xác nhận đăng xuất thiết bị khác (ADR-0031)
    GameSession:
      type: object
      required:
        - game_session_id
        - started_at
        - login_at
      properties:
        game_session_id:
          $ref: '#/components/schemas/Uuid'
        started_at:
          $ref: '#/components/schemas/Timestamp'
        login_at:
          $ref: '#/components/schemas/Timestamp'
        replaced_session_id:
          description: Session trên thiết bị cũ đã bị kết thúc do takeover
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        assigned_area_id:
          type: string
          maxLength: 64
    Timestamp:
      type: string
      format: date-time
    ActiveSessionConflict:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required:
            - other_device
          properties:
            other_device:
              $ref: '#/components/schemas/OtherDevice'
    OtherDevice:
      type: object
      required:
        - platform
        - last_seen_at
      properties:
        platform:
          type: string
          enum:
            - windows
            - android
            - ios
            - web
            - macos
            - linux
        device_label:
          type: string
          maxLength: 64
          description: Ví dụ "Điện thoại Android", "Trình duyệt web"
        last_seen_at:
          $ref: '#/components/schemas/Timestamp'
    ClientVersionProblem:
      description: '`426 CLIENT_VERSION_UNSUPPORTED` — game hiển thị màn cập nhật'
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required:
            - min_client_version
          properties:
            min_client_version:
              type: string
              maxLength: 32
            store_url:
              type: string
              maxLength: 2048
              format: uri
    RealtimeTicket:
      type: object
      required:
        - ticket
        - expires_at
        - url
        - protocol_version
      properties:
        ticket:
          type: string
          maxLength: 512
          description: Opaque, dùng 1 lần (≥ 256 bit ngẫu nhiên, base64url); server chỉ lưu băm SHA-256
        expires_at:
          $ref: '#/components/schemas/Timestamp'
        url:
          type: string
          maxLength: 2048
          format: uri
          description: wss://.../realtime/v1 — từ cấu hình môi trường (EW_REALTIME_PUBLIC_URL), không hardcode
        protocol_version:
          type: integer
          default: 1
          description: Phiên bản giao thức WebSocket (subprotocol eduworld.v1)
    ContentManifest:
      type: object
      required:
        - tenant_id
        - manifest_version
        - etag
        - items
      description: Manifest nội dung theo tenant (ADR-0043). Snapshot bất biến theo (item_id, version); client cache theo khóa có version
      properties:
        tenant_id:
          $ref: '#/components/schemas/Uuid'
        manifest_version:
          type: integer
          format: int64
        etag:
          type: string
          maxLength: 128
        generated_at:
          $ref: '#/components/schemas/Timestamp'
        min_client_version:
          type: string
          maxLength: 64
        activity_min_client_versions:
          type: object
          description: Phiên bản client tối thiểu theo `activity_type` (FR-EXR-015, ACTIVITY_ENGINE §12) — client chặn mở hoạt động trước khi start (F063-AC-25)
          maxProperties: 16
          propertyNames:
            $ref: '#/components/schemas/ActivityType'
          additionalProperties:
            type: string
            maxLength: 32
          example:
            quiz: 0.0.0
            interactive_exercise: 0.0.0
            simulation: 1.4.0
        items:
          type: array
          maxItems: 20000
          items:
            $ref: '#/components/schemas/ContentManifestItem'
        bundles:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/ContentBundle'
        areas:
          type: array
          maxItems: 500
          items:
            type: object
            required:
              - area_id
              - bundle_id
            properties:
              area_id:
                type: string
                maxLength: 128
              scene_ref:
                type: string
                maxLength: 512
              bundle_id:
                type: string
                maxLength: 128
    ActivityType:
      type: string
      description: Loại learning activity trong version này (ADR-0072, ADR-0082)
      enum:
        - quiz
        - interactive_exercise
        - minigame
        - video_lesson
        - audio_lesson
        - simulation
    ContentManifestItem:
      type: object
      required:
        - item_type
        - item_id
        - version_id
        - version_no
        - sha256
      properties:
        item_type:
          type: string
          maxLength: 64
        item_id:
          $ref: '#/components/schemas/Uuid'
        item_code:
          type: string
          maxLength: 64
          description: Mã ổn định của item game khóa chuỗi (area_id, chapter_code, npc_id); item_id khi đó là UUIDv5 của <item_type>:<mã> (F071)
        version_id:
          $ref: '#/components/schemas/Uuid'
        version_no:
          type: integer
          minimum: 1
        snapshot_url:
          type: string
          format: uri
          maxLength: 2048
          description: Vắng với nội dung chỉ phục vụ qua API (câu hỏi đề, nội dung nhạy cảm)
        sha256:
          type: string
          maxLength: 64
        activity_type:
          $ref: '#/components/schemas/ActivityType'
        min_client_version:
          type: string
          maxLength: 32
          description: Phiên bản client tối thiểu của activity_type (ACTIVITY_ENGINE §12, F026-AC-25)
    ContentBundle:
      type: object
      required:
        - bundle_id
        - version
        - url
        - sha256
      properties:
        bundle_id:
          type: string
          maxLength: 128
        version:
          type: integer
          minimum: 1
        url:
          type: string
          format: uri
          maxLength: 2048
        sha256:
          type: string
          maxLength: 64
        size_bytes:
          type: integer
          format: int64
        platforms:
          type: array
          items:
            type: string
            enum:
              - windows
              - android
              - ios
              - web
              - macos
              - linux
        requires_client:
          type: string
          maxLength: 64
    ClientConfig:
      type: object
      required:
        - min_client_version
        - maintenance
      properties:
        min_client_version:
          type: string
          maxLength: 64
        latest_client_version:
          type: string
          maxLength: 64
        update_required:
          type: boolean
        maintenance:
          type: object
          required:
            - active
          properties:
            active:
              type: boolean
            message:
              type: string
              maxLength: 1000
            until:
              $ref: '#/components/schemas/Timestamp'
        login:
          type: object
          description: Đăng nhập game bằng form trong game qua backend (ADR-0068) — game không dùng OIDC trình duyệt, không có client_id/secret phía game
          properties:
            login_url:
              type: string
              maxLength: 2048
              format: uri
              description: URL đầy đủ của `POST /auth/game/login`
            remember_username_default:
              type: boolean
              description: Mặc định bật "Nhớ tên đăng nhập" (chỉ username, điền sẵn form khi phiên hết hạn — ADR-0086); tắt sẵn trên thiết bị phòng máy (`shared_device`)
            password_help:
              $ref: '#/components/schemas/LocalizedText'
        world_manifest_url:
          type: string
          maxLength: 2048
          format: uri
        realtime_url:
          type: string
          maxLength: 2048
          format: uri
        feature_flags:
          type: object
          additionalProperties:
            type: boolean
        device_profiles:
          type: array
          maxItems: 200
          description: Ép renderer/preset cho thiết bị biết trước có lỗi (PERFORMANCE_BUDGET)
          items:
            $ref: '#/components/schemas/DeviceProfile'
        supported_locales:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/Locale'
        product_telemetry_enabled:
          type: boolean
          description: false = client không gửi `screen_view`/`tutorial_step` (analytics_product_telemetry_enabled của platform, và của tenant khi có `tenant_id`); perf/crash/`break_reminder_shown` vẫn gửi — GAME_ANALYTICS §3.2, F080-AC-03. Server vẫn tự bỏ hai loại này khi tắt.
    LocalizedText:
      type: object
      description: Mô tả/văn bản game song ngữ bắt buộc cả vi và en (ADR-0056 mục 2)
      required:
        - vi
        - en
      additionalProperties: false
      properties:
        vi:
          type: string
          minLength: 1
          maxLength: 4000
        en:
          type: string
          minLength: 1
          maxLength: 4000
    DeviceProfile:
      type: object
      required:
        - match
        - renderer
        - preset
      properties:
        match:
          type: object
          properties:
            platform:
              type: string
              maxLength: 32
            gpu_vendor:
              type: string
              maxLength: 64
            gpu_model_pattern:
              type: string
              maxLength: 255
            device_model_pattern:
              type: string
              maxLength: 255
            os_version_max:
              type: string
              maxLength: 32
        renderer:
          $ref: '#/components/schemas/RendererKind'
        preset:
          $ref: '#/components/schemas/QualityPreset'
        reason:
          type: string
          maxLength: 255
    RendererKind:
      type: string
      enum:
        - mobile
        - compatibility
        - forward_plus
    QualityPreset:
      type: string
      enum:
        - low
        - medium
        - high
    WorldManifest:
      type: object
      required:
        - manifest_version
        - areas
        - bundles
      properties:

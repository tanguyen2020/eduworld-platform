        client_version:
          type: string
          maxLength: 64
        sessions:
          type: integer
        fps_p50:
          type:
            - number
            - 'null'
        fps_p10:
          type:
            - number
            - 'null'
        fps_budget_pass_rate:
          type:
            - number
            - 'null'
        load_time_p50_ms:
          type:
            - integer
            - 'null'
        crash_free_sessions:
          type:
            - number
            - 'null'
    AnalyticsExportRequest:

openapi: 3.1.0
info:
  title: EduWorld module game — Internal API
  version: 1.0.0
  description: |
    Hợp đồng facade của module `game`, gọi **trong tiến trình** (ADR-0074, ADR-0040); `make gen` sinh kiểu DTO +
    interface strict-server vào `modules/game/api/`, path `/internal/v1/...` chỉ là định danh operation.
    Module game giữ dữ liệu game (profile, quest progress, inventory, game session, login events). Hiện chỉ cung cấp interface platform ops; các phản ứng chéo module (cộng XP, cập nhật quest) đi qua event NATS (ADR-0042).
  license:
    name: Proprietary — EduWorld
    identifier: LicenseRef-EduWorld-Proprietary
tags:
  - name: party-activities
    description: Hoạt động party quest/boss do module competition gọi trong luồng Start Session (F101 research R1; hiện thực ở F103)
  - name: catalog
    description: Catalog quest/mini-game đã gán cho tenant (module learning dựng projection catalog nhà trường, F078/F041)
  - name: platform-ops
    description: Interface platform ops chuẩn (module identity điều phối Thùng rác, clone tenant, dọn/khôi phục học sinh, gộp/ẩn danh hóa user)

paths:
  # BEGIN platform-ops (generated by scripts/openapi/sync-platform-ops.mjs — do not edit)
  /internal/v1/platform/tenant-clones/{job_id}/steps:
    post:
      tags:
        - platform-ops
      operationId: executeTenantCloneStep
      summary: Thực thi bước clone thuộc module này trong một job clone tenant (saga do module identity điều phối)
      description: |
        Clone sâu các tài nguyên thuộc module này từ tenant nguồn sang tenant đích (ADR-0029).
        Idempotent theo `(job_id, resource_type)`: gọi lại trả kết quả lần trước. Không bao giờ clone
        dữ liệu cá nhân/học tập của học sinh. Bản sao có `cloned_from_id`, `cloned_from_tenant_id`.
      x-allowed-callers:
        - identity
      x-context-required:
        - idempotency_key
      parameters:
        - $ref: common/internal-common.v1.yaml#/components/parameters/JobIdPath
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: common/internal-common.v1.yaml#/components/schemas/TenantCloneStepRequest
      responses:
        '200':
          description: Kết quả bước clone
          content:
            application/json:
              schema:
                $ref: common/internal-common.v1.yaml#/components/schemas/TenantCloneStepResult
        '400':
          $ref: common/internal-common.v1.yaml#/components/responses/BadRequest
        '401':
          $ref: common/internal-common.v1.yaml#/components/responses/Unauthorized
        '403':
          $ref: common/internal-common.v1.yaml#/components/responses/CallerNotAllowed
        '409':
          $ref: common/internal-common.v1.yaml#/components/responses/Conflict
        '422':
          $ref: common/internal-common.v1.yaml#/components/responses/ValidationFailed
        '503':
          $ref: common/internal-common.v1.yaml#/components/responses/DependencyUnavailable
  /internal/v1/platform/trash:
    get:
      tags:
        - platform-ops
      operationId: listTrash
      summary: Liệt kê bản ghi đã soft-delete của module này (Thùng rác, ADR-0028)
      description: Module identity gộp kết quả từ mọi module để trả cho `/api/v1/admin/trash` và `/api/v1/tenant/trash`.
      x-allowed-callers:
        - identity
      parameters:
        - name: tenant_ids
          in: query
          required: false
          description: Lọc tenant. Vắng mặt = mọi tenant (chỉ hợp lệ khi người gọi gốc là System Admin, kiểm tra bởi module identity).
          style: form
          explode: true
          schema:
            type: array
            maxItems: 100
            items:
              type: string
              format: uuid
        - name: resource_type
          in: query
          required: false
          schema:
            $ref: common/internal-common.v1.yaml#/components/schemas/ResourceType
        - $ref: common/internal-common.v1.yaml#/components/parameters/Cursor
        - $ref: common/internal-common.v1.yaml#/components/parameters/Limit
      responses:
        '200':
          description: Một trang bản ghi đã xóa
          content:
            application/json:
              schema:
                $ref: common/internal-common.v1.yaml#/components/schemas/TrashPage
        '401':
          $ref: common/internal-common.v1.yaml#/components/responses/Unauthorized
        '403':
          $ref: common/internal-common.v1.yaml#/components/responses/CallerNotAllowed
        '422':
          $ref: common/internal-common.v1.yaml#/components/responses/ValidationFailed
  /internal/v1/platform/trash/{resource_type}/{resource_id}:restore:
    post:
      tags:
        - platform-ops
      operationId: restoreTrashItem
      summary: Khôi phục một bản ghi đã soft-delete (đặt lại deleted_at = NULL)
      x-allowed-callers:
        - identity
      x-context-required:
        - tenant_scope
        - idempotency_key
      parameters:
        - $ref: common/internal-common.v1.yaml#/components/parameters/ResourceTypePath
        - $ref: common/internal-common.v1.yaml#/components/parameters/ResourceIdPath
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: common/internal-common.v1.yaml#/components/schemas/RestoreRequest
      responses:
        '200':
          description: Đã khôi phục
          content:
            application/json:
              schema:
                $ref: common/internal-common.v1.yaml#/components/schemas/RestoreResult
        '401':
          $ref: common/internal-common.v1.yaml#/components/responses/Unauthorized
        '403':
          $ref: common/internal-common.v1.yaml#/components/responses/CallerNotAllowed
        '404':
          $ref: common/internal-common.v1.yaml#/components/responses/NotFound
        '409':
          $ref: common/internal-common.v1.yaml#/components/responses/Conflict
  /internal/v1/platform/tenant-assignments:
    get:
      tags:
        - platform-ops
      operationId: listResourceAssignments
      summary: Liệt kê assignment active của một tài nguyên platform (gán cho tenant, ADR-0029)
      description: |
        Đọc `infra.tenant_resource_assignments` của module sở hữu tài nguyên cho một `(resource_type, resource_id)`.
        Chỉ module identity gọi khi trả `/api/v1/admin/tenant-assignments`; Principal gốc phải là nhân sự platform có
        `platform.tenant_data.assign`.
      x-allowed-callers:
        - identity
      parameters:
        - name: resource_type
          in: query
          required: true
          schema:
            $ref: common/internal-common.v1.yaml#/components/schemas/ResourceType
        - name: resource_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - $ref: common/internal-common.v1.yaml#/components/parameters/Cursor
        - $ref: common/internal-common.v1.yaml#/components/parameters/Limit
      responses:
        '200':
          description: Một trang assignment active
          content:
            application/json:
              schema:
                $ref: common/internal-common.v1.yaml#/components/schemas/TenantAssignmentList
        '401':
          $ref: common/internal-common.v1.yaml#/components/responses/Unauthorized
        '403':
          $ref: common/internal-common.v1.yaml#/components/responses/CallerNotAllowed
        '422':
          $ref: common/internal-common.v1.yaml#/components/responses/ValidationFailed
  /internal/v1/platform/tenant-assignments:apply:
    post:
      tags:
        - platform-ops
      operationId: applyTenantAssignments
      summary: Gán một tài nguyên platform cho các tenant (tạo assignment active còn thiếu, ADR-0029)
      description: |
        Bước của luồng gán do module identity điều phối. Tài nguyên phải là `owner_scope = platform`, chưa soft-delete;
        mỗi tenant phải `active` trong `ref.tenants` của module nhận. Một phần tử lỗi → `422 VALIDATION_FAILED` liệt kê
        từng phần tử, không ghi gì. Cặp (tài nguyên, tenant) đã có assignment active không tạo dòng mới. Idempotent theo
        `Idempotency-Key`: gọi lại trả kết quả lần trước. Audit `tenant_data.assigned` (actor = Principal gốc) qua outbox.
      x-allowed-callers:
        - identity
      x-context-required:
        - idempotency_key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: common/internal-common.v1.yaml#/components/schemas/TenantAssignmentApplyRequest
      responses:
        '200':
          description: Assignment active của tài nguyên cho các tenant yêu cầu
          content:
            application/json:
              schema:
                $ref: common/internal-common.v1.yaml#/components/schemas/TenantAssignmentList
        '401':
          $ref: common/internal-common.v1.yaml#/components/responses/Unauthorized
        '403':
          $ref: common/internal-common.v1.yaml#/components/responses/CallerNotAllowed
        '409':
          $ref: common/internal-common.v1.yaml#/components/responses/Conflict
        '422':
          $ref: common/internal-common.v1.yaml#/components/responses/ValidationFailed
  /internal/v1/platform/tenant-assignments:revoke:
    post:
      tags:
        - platform-ops
      operationId: revokeTenantAssignments
      summary: Gỡ gán một tài nguyên platform khỏi các tenant (soft-delete assignment, ADR-0028/0029)
      description: |
        Soft-delete assignment active của các tenant yêu cầu; tenant không còn thấy tài nguyên ở lần đọc kế tiếp, lượt
        học/attempt đã ghim version giữ nguyên. Tenant không có assignment active được bỏ qua. Idempotent theo
        `Idempotency-Key`. Audit `tenant_data.unassigned` (actor = Principal gốc) qua outbox.
      x-allowed-callers:
        - identity
      x-context-required:
        - idempotency_key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: common/internal-common.v1.yaml#/components/schemas/TenantAssignmentRevokeRequest
      responses:
        '200':
          description: Assignment đã gỡ (status `revoked`)
          content:
            application/json:
              schema:
                $ref: common/internal-common.v1.yaml#/components/schemas/TenantAssignmentList
        '401':
          $ref: common/internal-common.v1.yaml#/components/responses/Unauthorized
        '403':
          $ref: common/internal-common.v1.yaml#/components/responses/CallerNotAllowed
        '422':
          $ref: common/internal-common.v1.yaml#/components/responses/ValidationFailed
  /internal/v1/platform/students/{student_id}:cleanup:
    post:
      tags:
        - platform-ops
      operationId: cleanupStudentData
      summary: Soft-delete dữ liệu của học sinh trong module này khi bị dọn do không đăng nhập (ADR-0032)
      description: |
        Bước của saga dọn học sinh do module identity điều phối. Chỉ soft-delete (ADR-0028), đặt
        `delete_reason = inactive_cleanup`. Module trả `blocked` nếu học sinh đang có hoạt động không
        được dọn (trận đang chạy, bài kiểm tra chưa nộp, moderation case mở) để saga hủy và bù trừ.
      x-allowed-callers:
        - identity
      x-context-required:
        - tenant_scope
        - idempotency_key
      parameters:
        - $ref: common/internal-common.v1.yaml#/components/parameters/StudentIdPath
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: common/internal-common.v1.yaml#/components/schemas/StudentCleanupRequest
      responses:
        '200':
          description: Kết quả bước dọn
          content:
            application/json:
              schema:
                $ref: common/internal-common.v1.yaml#/components/schemas/StudentLifecycleResult
        '401':
          $ref: common/internal-common.v1.yaml#/components/responses/Unauthorized
        '403':
          $ref: common/internal-common.v1.yaml#/components/responses/CallerNotAllowed
        '404':
          $ref: common/internal-common.v1.yaml#/components/responses/NotFound
  /internal/v1/platform/students/{student_id}:restore:
    post:
      tags:
        - platform-ops
      operationId: restoreStudentData
      summary: Khôi phục dữ liệu học sinh đã bị dọn khi học sinh đăng nhập lại (ADR-0032 mục 5)
      x-allowed-callers:
        - identity
      x-context-required:
        - tenant_scope
        - idempotency_key
      parameters:
        - $ref: common/internal-common.v1.yaml#/components/parameters/StudentIdPath
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: common/internal-common.v1.yaml#/components/schemas/StudentRestoreRequest
      responses:
        '200':
          description: Kết quả bước khôi phục
          content:
            application/json:
              schema:
                $ref: common/internal-common.v1.yaml#/components/schemas/StudentLifecycleResult
        '401':
          $ref: common/internal-common.v1.yaml#/components/responses/Unauthorized
        '403':
          $ref: common/internal-common.v1.yaml#/components/responses/CallerNotAllowed
        '404':
          $ref: common/internal-common.v1.yaml#/components/responses/NotFound
  /internal/v1/platform/users/{user_id}:merge-into:
    post:
      tags:
        - platform-ops
      operationId: mergeUserData
      summary: Chuyển dữ liệu của một user sang user đích khi gộp tài khoản trùng (module identity điều phối)
      description: |
        Bước của saga gộp tài khoản (ACCOUNT_PROVISIONING §7b, IDENTITY_MAPPING). Module cập nhật mọi tham chiếu
        `user_id` nguồn sang `target_user_id` trong cùng tenant; bản ghi nguồn bị soft-delete (ADR-0028).
        Idempotent theo `merge_id`. Trả `blocked` nếu có xung đột không tự gộp được (vd. hai attempt cùng lúc).
      x-allowed-callers:
        - identity
      x-context-required:
        - tenant_scope
        - idempotency_key
      parameters:
        - $ref: common/internal-common.v1.yaml#/components/parameters/UserIdPath
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: common/internal-common.v1.yaml#/components/schemas/UserMergeRequest
      responses:
        '200':
          description: Kết quả bước gộp
          content:
            application/json:
              schema:
                $ref: common/internal-common.v1.yaml#/components/schemas/UserLifecycleResult
        '401':
          $ref: common/internal-common.v1.yaml#/components/responses/Unauthorized
        '403':
          $ref: common/internal-common.v1.yaml#/components/responses/CallerNotAllowed
        '404':
          $ref: common/internal-common.v1.yaml#/components/responses/NotFound
        '409':
          $ref: common/internal-common.v1.yaml#/components/responses/Conflict
  /internal/v1/platform/users/{user_id}:anonymize:
    post:
      tags:
        - platform-ops
      operationId: anonymizeUserData
      summary: Ẩn danh hóa dữ liệu cá nhân của user trong module này (yêu cầu xóa dữ liệu = ẩn danh hóa, ADR-0028 mục 8)
      description: |
        Ghi đè trường PII (tên hiển thị, nội dung tự do do user tạo, metadata thiết bị…) bằng giá trị ẩn danh,
        giữ bản ghi để thống kê và tính toàn vẹn. Không xóa dòng. Idempotent theo `erasure_request_id`.
      x-allowed-callers:
        - identity
      x-context-required:
        - tenant_scope
        - idempotency_key
      parameters:
        - $ref: common/internal-common.v1.yaml#/components/parameters/UserIdPath
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: common/internal-common.v1.yaml#/components/schemas/UserAnonymizeRequest
      responses:
        '200':
          description: Kết quả bước ẩn danh hóa
          content:
            application/json:
              schema:
                $ref: common/internal-common.v1.yaml#/components/schemas/UserLifecycleResult
        '401':
          $ref: common/internal-common.v1.yaml#/components/responses/Unauthorized
        '403':
          $ref: common/internal-common.v1.yaml#/components/responses/CallerNotAllowed
        '404':
          $ref: common/internal-common.v1.yaml#/components/responses/NotFound
  # END platform-ops
  /internal/v1/party-activities/candidates:list:
    post:
      tags: [party-activities]
      operationId: listPartyActivityCandidates
      summary: Hoạt động quest/boss có thể chơi theo party và điều kiện của từng thành viên
      description: |
        Gọi trong tiến trình từ `listPartyEligibleActivities` (F101-AC-05). Trả mã lý do theo thành viên, không bao giờ khối/lớp thực
        của học sinh (R16). Hiện thực ở F103; trước đó bên gọi chỉ trả `explore`.
      x-allowed-callers: [competition]
      x-context-required: [tenant_scope]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PartyActivityCandidatesRequest' }
      responses:
        '200':
          description: Danh sách ứng viên
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PartyActivityCandidates' }
        '401': { $ref: 'common/internal-common.v1.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'common/internal-common.v1.yaml#/components/responses/CallerNotAllowed' }
        '422': { $ref: 'common/internal-common.v1.yaml#/components/responses/ValidationFailed' }
        '503': { $ref: 'common/internal-common.v1.yaml#/components/responses/DependencyUnavailable' }
  /internal/v1/party-activities/eligibility:check:
    post:
      tags: [party-activities]
      operationId: checkPartyActivityEligibility
      summary: Kiểm điều kiện một hoạt động quest/boss cho các thành viên party
      description: |
        Gọi khi leader chọn hoạt động và ở bước (3) của Start Session (F101-AC-03, AC-08, AC-10). Trả `min_members`/`max_members`
        theo `party_size` và `allow_continue_on_disconnect`.
      x-allowed-callers: [competition]
      x-context-required: [tenant_scope]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PartyActivityCheckRequest' }
      responses:
        '200':
          description: Kết quả kiểm tra
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PartyActivityEligibility' }
        '401': { $ref: 'common/internal-common.v1.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'common/internal-common.v1.yaml#/components/responses/CallerNotAllowed' }
        '404': { $ref: 'common/internal-common.v1.yaml#/components/responses/NotFound' }
        '422': { $ref: 'common/internal-common.v1.yaml#/components/responses/ValidationFailed' }
        '503': { $ref: 'common/internal-common.v1.yaml#/components/responses/DependencyUnavailable' }
  /internal/v1/party-activities:start:
    post:
      tags: [party-activities]
      operationId: startPartyActivity
      summary: Tạo encounter boss hoặc phiên quest chung cho một party activity
      description: |
        Bước (4) của Start Session (F101 research R2): idempotent theo `Idempotency-Key = party_activity_id` — gọi lại trả cùng
        `external_ref`. Module game kiểm lại điều kiện mọi thành viên; commit phía competition thất bại thì phòng không ai vào và tự
        đóng sau `disconnect_grace`.
      x-allowed-callers: [competition]
      x-context-required: [tenant_scope, idempotency_key]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PartyActivityStartRequest' }
      responses:
        '201':
          description: Phiên đã tạo (hoặc đã có với cùng party_activity_id)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PartyActivityStarted' }
        '401': { $ref: 'common/internal-common.v1.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'common/internal-common.v1.yaml#/components/responses/CallerNotAllowed' }
        '404': { $ref: 'common/internal-common.v1.yaml#/components/responses/NotFound' }
        '409': { $ref: 'common/internal-common.v1.yaml#/components/responses/Conflict' }
        '422': { $ref: 'common/internal-common.v1.yaml#/components/responses/ValidationFailed' }
        '503': { $ref: 'common/internal-common.v1.yaml#/components/responses/DependencyUnavailable' }
  /internal/v1/game/assigned-activities:
    get:
      tags: [catalog]
      operationId: listAssignedGameActivities
      summary: Quest/mini-game đã publish đang gán cho một tenant, kèm metadata catalog (F078-AC-23)
      description: |
        Module learning gọi để dựng lại projection catalog nhà trường (DATABASE_DESIGN §2.17 quy tắc 3, F041 `listGameActivities`).
        Chỉ trả nội dung platform đã publish (con trỏ hiện hành) và đang có assignment active cho `tenant_id`; nội dung chưa gán
        cho tenant không bao giờ xuất hiện (R8). Phân trang keyset theo `(content_type, content_id)`. Principal gốc phải là
        nhân sự platform hoặc phạm vi platform của consumer (không có token tenant).
      x-allowed-callers: [learning]
      parameters:
        - name: tenant_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - $ref: 'common/internal-common.v1.yaml#/components/parameters/Cursor'
        - $ref: 'common/internal-common.v1.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: Một trang catalog của tenant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GameActivityCatalogPage' }
        '401': { $ref: 'common/internal-common.v1.yaml#/components/responses/Unauthorized' }
        '403': { $ref: 'common/internal-common.v1.yaml#/components/responses/CallerNotAllowed' }
        '422': { $ref: 'common/internal-common.v1.yaml#/components/responses/ValidationFailed' }
components:
  schemas:
    GameActivityCatalogEntry:
      type: object
      description: Khớp GameActivityCatalogItem của learning.v1 (listGameActivities, F041); title song ngữ i18nText (ADR-0056)
      required: [content_type, content_id, content_version_id, version, title, grade_levels]
      properties:
        content_type: { type: string, enum: [quest, minigame_config] }
        content_id: { type: string, format: uuid }
        content_version_id: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        title:
          type: object
          required: [vi]
          properties:
            vi: { type: string, maxLength: 255 }
            en: { type: string, maxLength: 255 }
        grade_levels:
          type: array
          maxItems: 9
          items: { type: integer, minimum: 1, maximum: 9 }
        subject_id: { type: [string, "null"], format: uuid }
        objective_ids:
          type: array
          maxItems: 50
          items: { type: string, format: uuid }
        estimated_minutes: { type: [integer, "null"], minimum: 1, maximum: 600 }
        thumbnail_url: { type: [string, "null"], format: uri, maxLength: 2048 }
        published_at: { type: string, format: date-time }
    GameActivityCatalogPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          maxItems: 500
          items: { $ref: "#/components/schemas/GameActivityCatalogEntry" }
        page: { $ref: "common/internal-common.v1.yaml#/components/schemas/PageInfo" }
    PartyActivityType:
      type: string
      description: 'Một enum loại hoạt động party (PARTY_SYSTEM §5); nguồn specs/schemas/common/enums.schema.json. Module game chỉ nhận quest, boss.'
      enum: [explore, quest, boss, learning_challenge, coop_challenge, team_battle]
    PartyActivityMember:
      type: object
      additionalProperties: false
      required: [student_id]
      properties:
        student_id: { type: string, format: uuid }
    PartyActivityMemberCheck:
      type: object
      additionalProperties: false
      required: [student_id, eligible]
      properties:
        student_id: { type: string, format: uuid }
        eligible: { type: boolean }
        reason_code: { type: string, enum: [grade_not_allowed, grade_band_mismatch, prerequisite_missing, area_locked, attempt_limit, sanctioned, not_online] }
        requirement: { type: string, maxLength: 255, description: 'Yêu cầu của hoạt động (vd. "grade_levels:4"), không phải dữ liệu của học sinh (R16)' }
    PartyActivityCandidatesRequest:
      type: object
      additionalProperties: false

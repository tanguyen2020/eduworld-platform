        party_id: { type: string, format: uuid }
        area_id: { type: string, maxLength: 64 }
        members:
          type: array
          minItems: 1
          maxItems: 8
          items: { $ref: '#/components/schemas/PartyActivityMember' }
      examples:
        - { party_id: 0193a5f4-6c1e-7b2a-9d1f-0000000000a1, members: [{ student_id: 0193a5f4-6c1e-7b2a-9d1f-000000000005 }] }
    PartyActivityCandidate:
      type: object
      additionalProperties: false
      required: [activity_type, activity_ref, min_members, max_members, all_eligible, members]
      properties:
        activity_type: { $ref: '#/components/schemas/PartyActivityType' }
        activity_ref: { type: string, maxLength: 64, pattern: '^[a-z0-9_.-]{1,64}$' }
        title:
          type: object
          additionalProperties: false
          required: [vi]
          properties:
            vi: { type: string, minLength: 1, maxLength: 255 }
            en: { type: string, minLength: 1, maxLength: 255 }
        min_members: { type: integer, minimum: 1, maximum: 8 }
        max_members: { type: integer, minimum: 1, maximum: 8 }
        all_eligible: { type: boolean }
        members:
          type: array
          maxItems: 8
          items: { $ref: '#/components/schemas/PartyActivityMemberCheck' }
    PartyActivityCandidates:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/PartyActivityCandidate' }
      examples:
        - data:
            - activity_type: quest
              activity_ref: q-bridge-fix
              title: { vi: Sửa cầu }
              min_members: 2
              max_members: 4
              all_eligible: true
              members: [{ student_id: 0193a5f4-6c1e-7b2a-9d1f-000000000005, eligible: true }]
    PartyActivityCheckRequest:
      type: object
      additionalProperties: false
      required: [party_id, activity_type, activity_ref, members]
      properties:
        party_id: { type: string, format: uuid }
        activity_type: { $ref: '#/components/schemas/PartyActivityType' }
        activity_ref: { type: string, maxLength: 64, pattern: '^[a-z0-9_.-]{1,64}$' }
        members:
          type: array
          minItems: 1
          maxItems: 8
          items: { $ref: '#/components/schemas/PartyActivityMember' }
      examples:
        - { party_id: 0193a5f4-6c1e-7b2a-9d1f-0000000000a1, activity_type: quest, activity_ref: q-bridge-fix, members: [{ student_id: 0193a5f4-6c1e-7b2a-9d1f-000000000005 }] }
    PartyActivityEligibility:
      type: object
      additionalProperties: false
      required: [eligible, min_members, max_members, allow_continue_on_disconnect, members]
      properties:
        eligible: { type: boolean }
        min_members: { type: integer, minimum: 1, maximum: 8 }
        max_members: { type: integer, minimum: 1, maximum: 8 }
        allow_continue_on_disconnect: { type: boolean }
        area_id: { type: string, maxLength: 64, description: 'Khu của private_instance (quest)' }
        members:
          type: array
          maxItems: 8
          items: { $ref: '#/components/schemas/PartyActivityMemberCheck' }
      examples:
        - { eligible: true, min_members: 2, max_members: 4, allow_continue_on_disconnect: true, area_id: forest_bridge, members: [{ student_id: 0193a5f4-6c1e-7b2a-9d1f-000000000005, eligible: true }] }
    PartyActivityStartMember:
      type: object
      additionalProperties: false
      required: [student_id]
      properties:
        student_id: { type: string, format: uuid }
        game_session_id: { type: string, format: uuid }
    PartyActivityStartRequest:
      type: object
      additionalProperties: false
      required: [party_activity_id, party_id, leader_id, activity_type, activity_ref, members]
      properties:
        party_activity_id: { type: string, format: uuid }
        party_id: { type: string, format: uuid }
        leader_id: { type: string, format: uuid }
        activity_type: { $ref: '#/components/schemas/PartyActivityType' }
        activity_ref: { type: string, maxLength: 64, pattern: '^[a-z0-9_.-]{1,64}$' }
        game_mode: { type: string, maxLength: 64 }
        members:
          type: array
          minItems: 1
          maxItems: 8
          items: { $ref: '#/components/schemas/PartyActivityStartMember' }
      examples:
        - { party_activity_id: 0193a5f4-6c1e-7b2a-9d1f-0000000000b1, party_id: 0193a5f4-6c1e-7b2a-9d1f-0000000000a1, leader_id: 0193a5f4-6c1e-7b2a-9d1f-000000000005, activity_type: boss, activity_ref: boss-forest-golem, members: [{ student_id: 0193a5f4-6c1e-7b2a-9d1f-000000000005 }] }
    PartyActivityStarted:
      type: object
      additionalProperties: false
      required: [external_ref, room_type]
      properties:
        external_ref: { type: string, format: uuid, description: 'encounter_id (boss) / party_quest_session_id (quest)' }
        room_type: { type: string, enum: [boss, private_instance] }
        area_id: { type: string, maxLength: 64 }
        scene_ref: { type: string, maxLength: 255 }
      examples:
        - { external_ref: 0193a5f4-6c1e-7b2a-9d1f-0000000000c1, room_type: boss, scene_ref: boss/forest_golem }

    post:
      x-service: chat
      tags:
        - social
      operationId: redeemFriendCode
      summary: Nhập mã bạn bè để gửi lời mời kết bạn (vẫn kiểm tra phạm vi trường — ADR-0054)
      description: |
        Mã còn hạn của học sinh khác trong tenant phiên tạo lời mời `source = friend_code` với cùng kiểm tra như
        `sendFriendRequest` (F095-AC-08). Mã sai hoặc hết hạn → `404 FRIEND_CODE_INVALID`; mã sai định dạng hoặc mã của
        chính mình → `422`.
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  type: string
                  maxLength: 12
                  pattern: ^[A-Z0-9]{6,12}$
      responses:
        '201':
          description: Đã gửi lời mời kết bạn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FriendRequest'
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
            Content-Language:
              $ref: '#/components/headers/ContentLanguage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: FRIEND_CODE_INVALID (mã không tồn tại hoặc hết hạn), NOT_FOUND (chủ mã không còn là học sinh hoạt động)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'

  /social/friend-requests:
    get:
      x-service: chat
      tags:
        - social
      operationId: listFriendRequests
      summary: Lời mời kết bạn đến/đi
      description: |
        `incoming`: lời mời `pending` còn hạn gửi tới chính học sinh; `outgoing`: lời mời chính học sinh đã gửi và chưa hết
        hạn. Từ chối là lặng lẽ: lời mời bị từ chối vẫn hiện `pending` với người gửi tới khi hết hạn (F095-AC-06, SC-003).
        Lời mời của người khác không bao giờ xuất hiện (F095-AC-13); tối đa 100 lời mời mới nhất.
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: direction
          in: query
          schema:
            type: string
            enum:
              - incoming
              - outgoing
            default: incoming
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    maxItems: 100
                    description: 'Danh sách có giới hạn theo nghiệp vụ (API_DESIGN §5.1): chỉ lời mời đang chờ chưa hết hạn friend_request_ttl (7 ngày); gửi đi ≤ 10 (friend_limits); 100 mới nhất'
                    items:
                      $ref: '#/components/schemas/FriendRequest'
          headers:
            Content-Language:
              $ref: '#/components/headers/ContentLanguage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      x-service: chat
      tags:
        - social
      operationId: sendFriendRequest
      summary: Gửi lời mời kết bạn
      description: |
        Tới học sinh cùng trường (khác trường chỉ khi tenant `unit` bật `cross_school_social_enabled`, ADR-0054). Người nhận
        khác tenant hoặc không phải học sinh hoạt động → `404`; khác trường khi chưa bật, hai người đã chặn nhau (không tiết lộ
        chiều chặn) hoặc tenant `common` chưa được System Admin bật lại kết bạn (ADR-0078) → `403 SOCIAL_SCOPE_VIOLATION`;
        đã là bạn hoặc đã có lời mời chờ cùng chiều → `409 CONFLICT`; vượt `friend_limits` (lời mời đang chờ, số bạn) →
        `409 FRIEND_LIMIT_REACHED`; vượt số lời mời/ngày → `429 RATE_LIMITED` kèm `Retry-After`; gửi cho chính mình → `422`.
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - addressee_id
              properties:
                addressee_id:
                  $ref: '#/components/schemas/Uuid'
      responses:
        '201':
          description: Đã gửi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FriendRequest'
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
            Content-Language:
              $ref: '#/components/headers/ContentLanguage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
  /social/friend-requests/{request_id}:accept:

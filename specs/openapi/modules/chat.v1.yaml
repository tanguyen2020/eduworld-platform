          type: boolean
        reply:
          type: boolean
        quote:
          type: boolean
        forward:
          type: boolean
        sticker:
          type: boolean
        gif:
          type: boolean
        reaction:
          type: boolean
        mention:
          type: boolean
        pin:
          type: boolean
        typing:
          type: boolean
        receipts:
          type: string

          maxLength: 255
        allowed_kinds:
          type: array
          items:
            $ref: '#/components/schemas/MessageKind'
        features:
          $ref: '#/components/schemas/ChatFeatures'
        unread_count:
          type: integer
        unread_mentions:
          type: integer
        last_seq:
          type: integer
          format: int64
        my_read_seq:
          type: integer
          format: int64
        pinned_count:
          type: integer
          maximum: 3
        status:
          type: string
          enum:
            - open
            - closed
            - read_only
            - frozen
          description: 'closed: channel gameplay đã đóng; read_only: club bị khóa/lưu trữ; frozen: DM bị đóng băng do block (F120)'
        capabilities:
          type: object
          description: Không có voice chat (FR-CHAT-007, ADR-0070) — voice luôn false
          properties:
            voice:
              type: boolean
              enum:
                - false
        purge_after:
          $ref: '#/components/schemas/Timestamp'
        muted:
          type: boolean
    ChannelType:
      type: string
      description: Không còn class, study_group (ADR-0095).
      enum:
        - world
        - area
        - match
        - party
        - team
        - direct
    MessageKind:
      type: string
      enum:
        - text
        - emoji
        - quick
        - sticker
        - gif
        - system
    ChatFeatures:
      type: object
      description: Tính năng hiệu lực của channel (ADR-0034, cấu hình platform)
      properties:
        edit:
          type: boolean
        recall:
          type: boolean
        reply:
          type: boolean
        quote:
          type: boolean
        forward:
          type: boolean
        sticker:
          type: boolean
        gif:
          type: boolean
        reaction:
          type: boolean
        mention:
          type: boolean
        pin:
          type: boolean
        typing:
          type: boolean
        receipts:
          type: string
          enum:
            - none
            - count
            - per_member
        search:
          type: boolean
    Timestamp:
      type: string
      format: date-time
    Problem:
      type: object
      required:
        - type
        - title
        - status
        - code
      properties:
        type:
          type: string
          maxLength: 2048
          format: uri
        title:
          type: string
          maxLength: 255
        status:
          type: integer
        code:
          description: Mã ổn định; client phải chấp nhận giá trị chưa biết
          anyOf:
            - $ref: '#/components/schemas/ProblemCode'
            - type: string
              maxLength: 64
        detail:
          type: string
          maxLength: 1000
        instance:
          type: string
          maxLength: 2048
        trace_id:
          type: string
          maxLength: 64
        retryable:
          type: boolean
          description: 'Có khi lỗi tạm thời (vd. `503 UNAVAILABLE` khi module identity không trả Principal): client được phép thử lại với backoff (F002-AC-09)'
        policy_reason:
          type: string
          maxLength: 1000
        category_code:
          type: string
          maxLength: 64
          description: 'Chỉ có khi `code = CHAT_CONTENT_BLOCKED`/`CHAT_CONTENT_HELD`: mã category của danh mục hoặc `pii`/`spam`/`bullying` — không bao giờ có từ đã khớp hay vị trí (ADR-0030, F116-AC-05)'

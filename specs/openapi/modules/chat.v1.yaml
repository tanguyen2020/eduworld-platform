    ModerationSwitchState:
      type: object
      required:
        - scope
        - configured
        - effective
      properties:
        scope:
          type: string
          enum:
            - platform
            - tenant
        tenant_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        tenant_name:
          type: string
          maxLength: 255
        configured:
          description: Giá trị đặt ở cấp này (null = kế thừa platform)
          oneOf:
            - type: object
              required:
                - enabled_all
                - steps
              properties:
                enabled_all:
                  type: boolean
                steps:
                  $ref: '#/components/schemas/ModerationSwitchSteps'
                expires_at:
                  oneOf:
                    - $ref: '#/components/schemas/Timestamp'
                    - type: 'null'
            - type: 'null'
        effective:
          description: Giá trị hiệu lực sau khi kết hợp platform và tenant
          type: object
          required:
            - enabled_all
            - steps
          properties:
            enabled_all:
              type: boolean
            steps:
              $ref: '#/components/schemas/ModerationSwitchSteps'
        disabled_steps:
          type: array
          items:
            $ref: '#/components/schemas/ModerationStep'
        updated_by:
          $ref: '#/components/schemas/Uuid'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
        pending_requests:
          description: Yêu cầu tắt của cấp này đang chờ System Admin thứ hai phê duyệt (chỉ có ở listModerationSwitches)
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/ModerationSwitchRequest'
    ModerationSwitchSteps:
      type: object
      description: |
        Các bước tắt được (MODERATION §12.1). `pii` và grooming luôn chạy, không có công tắc (ADR-0078, bỏ khỏi schema từ F116):
        yêu cầu `pii: false`/`grooming: false` → `422 MODERATION_SWITCH_STEP_NOT_ALLOWED`; khóa `pii` cũ bị bỏ qua khi resolve.
      required:
        - sensitive_terms
        - spam
        - bullying
        - async_analysis
      properties:
        sensitive_terms:
          type: boolean
        spam:
          type: boolean
        bullying:
          type: boolean
        async_analysis:
          type: boolean
    ModerationStep:
      type: string
      description: Bước có công tắc (MODERATION §12.1). `pii` và grooming luôn chạy, không có công tắc (ADR-0078).
      enum:
        - sensitive_terms
        - spam
        - bullying
        - async_analysis
    ModerationSwitchRequest:
      type: object
      description: Yêu cầu tắt công tắc kiểm duyệt chờ phê duyệt hai người (ADR-0078, F116-AC-32)
      required:
        - request_id
        - scope
        - enabled_all
        - steps
        - reason
        - expires_at
        - status
        - proposed_by
        - created_at
        - request_expires_at
      properties:
        request_id:
          $ref: '#/components/schemas/Uuid'
        scope:
          type: string
          enum:
            - platform
            - tenant
        tenant_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        enabled_all:
          type: boolean
        steps:
          $ref: '#/components/schemas/ModerationSwitchSteps'
        reason:
          type: string
          maxLength: 1000
        expires_at:
          description: Thời điểm tự bật lại nếu được duyệt
          allOf:
            - $ref: '#/components/schemas/Timestamp'
        status:
          type: string
          enum:
            - pending_approval
            - approved
            - rejected
            - expired
        proposed_by:
          $ref: '#/components/schemas/Uuid'
        approved_by:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        decided_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        request_expires_at:
          description: Hết hạn chờ duyệt (≤ 24 giờ sau khi tạo, không muộn hơn expires_at)
          allOf:
            - $ref: '#/components/schemas/Timestamp'
        version:
          type: integer
          minimum: 1
          description: Giá trị If-Match của rejectModerationSwitchChange (`W/"<version>"`)
    ModerationSwitchUpdate:
      type: object
      required:
        - scope
        - enabled_all
        - steps
      properties:
        scope:
          type: string
          enum:
            - platform
            - tenant
        tenant_id:
          description: Bắt buộc khi scope = tenant
          allOf:
            - $ref: '#/components/schemas/Uuid'
        enabled_all:
          type: boolean
        steps:
          $ref: '#/components/schemas/ModerationSwitchSteps'
        reason:
          description: Bắt buộc, ≥ 10 ký tự (thiếu/ngắn → MODERATION_SWITCH_REASON_REQUIRED)
          type: string
          maxLength: 1000
        expires_at:
          description: |
            Thời điểm tự bật lại. Bắt buộc khi tắt bất kỳ bước nào hoặc `enabled_all`, trong (now, now + 24 giờ]
            (`moderation_switch_max_duration`); thiếu/quá hạn → MODERATION_SWITCH_EXPIRY_REQUIRED. Bỏ qua khi chỉ bật lại.
          allOf:
            - $ref: '#/components/schemas/Timestamp'
    ModerationSwitchChange:
      type: object
      required:
        - change_id
        - scope
        - before
        - after
        - reason
        - actor_id
        - changed_at
      properties:
        change_id:
          $ref: '#/components/schemas/Uuid'
        scope:
          type: string
          enum:
            - platform
            - tenant
        tenant_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        before:
          $ref: '#/components/schemas/ModerationSwitchSteps'
        after:
          $ref: '#/components/schemas/ModerationSwitchSteps'
        enabled_all_before:
          type: boolean
        enabled_all_after:
          type: boolean
        reason:
          type: string
          maxLength: 1000
        expires_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        actor_id:
          description: Người thay đổi (người đề xuất với source = approved_request; null với auto_expire)
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        approved_by:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        request_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        source:
          type: string
          enum:
            - manual
            - approved_request
            - auto_expire
        changed_at:
          $ref: '#/components/schemas/Timestamp'

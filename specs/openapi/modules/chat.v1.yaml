  /game-admin/{config_type}/{config_id}/assets:presign:
    post:
      x-service: chat
      tags:
        - game-admin
      operationId: presignChatAssetUpload
      x-portal-action: action.game_ops.chat_assets.edit
      summary: Presigned URL tải lên một tệp sticker/GIF của thư viện (Game Studio, F118)
      description: |
        Khóa bất biến `media/<sha256>/<file_name>` (R31) tính từ `sha256` khai báo; server đọc lại tệp và kiểm sha256, định dạng
        (sniff từ nội dung), kích thước và số pixel khi `submit_review`/publish (`chat_asset_file_max`: sticker WebP/PNG ≤ 512 KB;
        GIF ≤ 2 MB, ≤ 480 px, có preview tĩnh). Không có upload của học sinh. Chỉ role platform có `game.chat_assets.write`.
      x-internal: true
      security:
        - keycloakAdminBearer: []
      parameters:
        - name: config_type
          in: path
          required: true
          schema:
            type: string
            enum:
              - sticker-packs
              - gifs
        - name: config_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - file_name
                - content_type
                - size_bytes
                - sha256
              properties:
                file_name:
                  type: string
                  maxLength: 200
                  pattern: ^[A-Za-z0-9._-]{1,200}$
                content_type:
                  type: string
                  enum:
                    - image/webp
                    - image/png
                    - image/gif
                size_bytes:
                  type: integer
                  minimum: 1
                  maximum: 2097152
                sha256:
                  type: string
                  pattern: ^[0-9a-f]{64}$
                  maxLength: 64
      responses:
        '201':
          description: URL PUT đã ký (Content-Length phải đúng size_bytes)
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                type: object
                required:
                  - asset_key
                  - upload_url
                  - expires_at
                properties:
                  asset_key:
                    type: string
                    maxLength: 512
                  upload_url:
                    type: string
                    format: uri
                    maxLength: 4096
                  expires_at:
                    $ref: '#/components/schemas/Timestamp'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  parameters:
    TenantIdHeader:
      name: X-Tenant-Id
      in: header
      required: true
      description: |
        Tenant của phiên (ADR-0065). Lấy từ `PlayerBootstrap.tenant_id` (game) hoặc tenant đã chọn sau đăng nhập portal (`GET /me/tenants`).
        Gateway trả `400 TENANT_HEADER_REQUIRED` khi thiếu, `400 BAD_REQUEST` khi sai định dạng; backend kiểm tra khớp token + membership,
        lệch → `403 TENANT_MISMATCH`. `Principal.tenant_id` lấy từ kết quả kiểm tra, không lấy thẳng từ header.
      schema:
        $ref: '#/components/schemas/Uuid'
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: Ngôn ngữ hiển thị mong muốn (`vi-VN` mặc định, `en-US`). Server chọn ngôn ngữ trả về và đặt `Content-Language` (ADR-0056). Dữ liệu cache dài (manifest, snapshot) luôn trả đủ vi+en.
      schema:
        type: string
        maxLength: 64
        examples:
          - vi-VN
          - en-US
    ChannelId:
      name: channel_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        UUIDv7 do client sinh cho mỗi thao tác (ADR-0010, ADR-0089 §4); timestamp trong key lệch quá `idempotency_record_ttl`
        (24 h) so với giờ server hoặc key không phải UUIDv7 → `400 BAD_REQUEST`. Bản ghi giữ trong `idempotency_record_ttl`;
        gửi lại cùng key + cùng body → response đã lưu kèm `Idempotent-Replayed: true`; khác body → `409 IDEMPOTENCY_KEY_REUSED`.
      schema:
        type: string
        format: uuid
        pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
    MessageId:
      name: message_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    Cursor:
      name: cursor
      in: query
      description: Cursor opaque từ page.next_cursor
      schema:
        type: string
        maxLength: 512
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ClubIdPath:
      name: club_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        maxLength: 512
    InvitationId:
      name: invitation_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    TenantIdHeaderOptional:
      name: X-Tenant-Id
      in: header
      required: false
      description: |
        Người dùng tenant: **bắt buộc** (thiếu → `400 TENANT_HEADER_REQUIRED`). Role platform (System Admin, content_admin…):
        vắng mặt = phạm vi platform / đọc liên tenant bằng `tenant_ids`; có giá trị = tenant đích của thao tác ghi (ADR-0027, ADR-0065).
        Có giá trị thì luôn được kiểm tra như `TenantIdHeader`.
      schema:
        $ref: '#/components/schemas/Uuid'
    TenantIds:
      name: tenant_ids
      in: query
      required: false
      description: |
        Chỉ System Admin (platform.cross_tenant.read): lọc theo một hoặc nhiều tenant; vắng mặt = tất cả tenant.
        Người dùng tenant gửi tham số này bị bỏ qua (luôn khóa vào tenant của phiên) — ADR-0027 §6.
      style: form
      explode: true
      schema:
        type: array
        maxItems: 100
        items:
          $ref: '#/components/schemas/Uuid'
    TermIdPath:
      name: term_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ChatPolicyScopeType:
      name: scope_type
      in: path
      required: true
      description: Cấp chính sách (không có class — ADR-0095)
      schema:
        type: string
        enum:
          - tenant
          - school
    ChatPolicyScopeId:
      name: scope_id
      in: path
      required: true
      description: tenant_id (scope tenant) hoặc school_id (scope school)
      schema:
        $ref: '#/components/schemas/Uuid'
    CaseIdPath:
      name: case_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    SanctionIdPath:
      name: sanction_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ShiftIdPath:
      name: shift_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    GrantIdPath:
      name: grant_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    NotificationIdPath:
      name: notification_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    GameConfigId:
      name: config_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    Version:
      name: version
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  schemas:
    Uuid:
      type: string
      format: uuid
      description: UUIDv7
    Channel:
      type: object
      required:
        - channel_id
        - channel_type
        - allowed_kinds
      properties:
        channel_id:
          $ref: '#/components/schemas/Uuid'
        channel_type:
          $ref: '#/components/schemas/ChannelType'
        title:

  /admin/chat/moderation-switches:
    get:
      x-service: chat
      tags:
        - admin
      operationId: listModerationSwitches
      x-portal-action: action.platform_admin.moderation_switches.view
      summary: Trạng thái công tắc kiểm duyệt (platform và từng tenant, kèm giá trị hiệu lực)
      description: |
        `platform` luôn có (mọi trang); `tenants` là một trang keyset theo `tenant_id` (`limit`/`cursor`) của các tenant của
        `tenant_ids` (System Admin, đọc liên tenant có audit) — không có `tenant_ids` thì rỗng; chỉ các tenant của trang được đọc
        từ DB (API_DESIGN §5). Mỗi trạng thái kèm các yêu cầu tắt đang `pending_approval` của cấp đó (`pending_requests`).
        Không có `tenant_ids`: trả thêm `disabled_tenant_count` = số tenant đang có ít nhất một giá trị tắt còn hiệu lực ở cấp
        tenant (`expires_at` chưa qua), đếm trong SQL, không liệt kê tenant (banner System Admin, F122 T065).
      x-internal: true
      security:
        - keycloakAdminBearer: []
      parameters:
        - $ref: '#/components/parameters/TenantIds'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - platform
                  - tenants
                  - page
                properties:
                  platform:
                    $ref: '#/components/schemas/ModerationSwitchState'
                  tenants:
                    type: array
                    maxItems: 100
                    items:
                      $ref: '#/components/schemas/ModerationSwitchState'
                  page:
                    $ref: '#/components/schemas/PageInfo'
                  disabled_tenant_count:
                    type: integer
                    minimum: 0
                    description: Chỉ khi không có `tenant_ids` — số tenant đang tắt ít nhất một bước ở cấp tenant (không liệt kê)
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      x-service: chat
      tags:
        - admin
      operationId: setModerationSwitches
      x-portal-action: action.platform_admin.moderation_switches.toggle
      summary: Bật/tắt công tắc kiểm duyệt (tổng hoặc từng bước) cho platform hoặc một tenant
      description: |
        Chỉ System Admin (`chat.policy.toggle`). Body là cấu hình đầy đủ của cấp `scope` (`scope = tenant`: `tenant_id`
        bắt buộc; nếu có `X-Tenant-Id` thì phải trùng). `reason` ≥ 10 ký tự cho mọi thay đổi (thiếu/ngắn →
        `422 MODERATION_SWITCH_REASON_REQUIRED`). `pii` và grooming luôn chạy, không có công tắc (ADR-0078): gửi
        `steps.pii = false` hoặc `steps.grooming = false` → `422 MODERATION_SWITCH_STEP_NOT_ALLOWED`.
        Yêu cầu **tắt** (bất kỳ bước nào hoặc `enabled_all`, kể cả gia hạn `expires_at`) bắt buộc `expires_at` trong
        (now, now + `moderation_switch_max_duration` = 24 giờ] (thiếu/quá → `422 MODERATION_SWITCH_EXPIRY_REQUIRED`) và chỉ tạo
        yêu cầu `pending_approval` (`202`) — giá trị hiệu lực không đổi cho tới khi một System Admin khác gọi
        `approveModerationSwitchChange`; yêu cầu không được duyệt trong 24 giờ tự hết hạn. Thay đổi chỉ **bật lại** (mọi giá trị tắt
        trong body đang tắt sẵn, không gia hạn) có hiệu lực ngay (`200`), ghi `moderation_switch_changes` (`source = manual`),
        audit và phát `chat_policy.moderation_switch_changed`; mọi instance áp dụng trong ≤ 60 giây.
        Thay đổi so với bản trước F116 (ADR-0078, có chủ đích): `ModerationSwitchSteps` bỏ `pii`, thêm response `202`.
      x-internal: true
      security:
        - keycloakAdminBearer: []
      parameters:
        - $ref: '#/components/parameters/TenantIdHeaderOptional'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModerationSwitchUpdate'
      responses:
        '200':
          description: Chỉ bật lại — trạng thái mới của cấp đó, đã có hiệu lực
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModerationSwitchState'
        '202':
          description: Yêu cầu tắt đã lưu `pending_approval`, chưa có hiệu lực (cần System Admin thứ hai phê duyệt)
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModerationSwitchRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /admin/chat/moderation-switches/requests/{request_id}:approve:
    post:
      x-service: chat
      tags:
        - admin
      operationId: approveModerationSwitchChange
      x-portal-action: action.platform_admin.moderation_switches.toggle
      summary: Phê duyệt yêu cầu tắt công tắc kiểm duyệt (System Admin thứ hai)
      description: |
        Chỉ System Admin (`chat.policy.toggle`) **khác** người đề xuất (`moderation_switch_approvals` = 2, ADR-0078); người
        đề xuất tự duyệt → `403 MODERATION_SWITCH_SELF_APPROVAL`. Yêu cầu của tenant: gửi `X-Tenant-Id` = tenant của yêu cầu
        (không có → chỉ tìm yêu cầu platform); không thấy → `404`. Yêu cầu không còn `pending_approval` hoặc đã quá
        `request_expires_at` → `409 CONFLICT`. Áp giá trị yêu cầu (lý do, `expires_at`), ghi `moderation_switch_changes`
        (`source = approved_request`, người đề xuất + người duyệt), audit hai người, phát `chat_policy.moderation_switch_changed`;
        mọi instance áp dụng trong ≤ 60 giây.
      x-internal: true
      security:
        - keycloakAdminBearer: []
      parameters:
        - $ref: '#/components/parameters/TenantIdHeaderOptional'
        - name: request_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Yêu cầu đã duyệt — trạng thái mới của cấp đó
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModerationSwitchState'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/chat/moderation-switches/requests/{request_id}:reject:
    post:
      x-service: chat
      tags:
        - admin
      operationId: rejectModerationSwitchChange
      x-portal-action: action.platform_admin.moderation_switches.toggle
      summary: Từ chối yêu cầu tắt công tắc kiểm duyệt (System Admin thứ hai)
      description: |
        Chỉ System Admin (`chat.policy.toggle`) **khác** người đề xuất (người đề xuất tự từ chối →
        `403 MODERATION_SWITCH_SELF_APPROVAL`, có audit từ chối quyền). `reason` bắt buộc (1–500 ký tự, không chỉ khoảng trắng).
        `If-Match` = `version` của yêu cầu (`W/"<version>"`; thiếu → `428`, lệch → `412 VERSION_MISMATCH`). Yêu cầu của tenant:
        gửi `X-Tenant-Id` = tenant của yêu cầu (không có → chỉ tìm yêu cầu platform); không thấy → `404`. Yêu cầu không còn
        `pending_approval` hoặc đã quá `request_expires_at` → `409 CONFLICT`. Yêu cầu chuyển `rejected` (`decided_at`), giá trị
        hiệu lực không đổi, không ghi `moderation_switch_changes`; audit `chat.moderation_switch_request.rejected` (người đề xuất,
        người từ chối, lý do) và phát `moderation_switch.change_rejected` cùng transaction (F122 T060, ADR-0078).
      x-internal: true
      security:
        - keycloakAdminBearer: []
      parameters:
        - $ref: '#/components/parameters/TenantIdHeaderOptional'
        - name: request_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
              additionalProperties: false
              properties:
                reason:
                  type: string
                  minLength: 1
                  maxLength: 500
                  description: Lý do từ chối
      responses:
        '200':
          description: Yêu cầu đã bị từ chối (`status = rejected`); trạng thái hiệu lực không đổi
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModerationSwitchRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':

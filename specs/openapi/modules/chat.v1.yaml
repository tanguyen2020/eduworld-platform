        rule có điều kiện theo khối (`grade_band`, `grade_level`…) hay trường lạ → `422 VALIDATION_FAILED`; tắt/thu hẹp
        `match`/`team`/`party` → `422 CHAT_POLICY_ALWAYS_ON`; nới lỏng hơn cấp trên (không có `allow_override_relax`) hoặc

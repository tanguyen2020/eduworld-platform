    Message:
      type: object
      required:
        - message_id
        - channel_id
        - seq
        - sender
        - kind
        - created_at
        - moderation_state
      properties:
        message_id:
          $ref: '#/components/schemas/Uuid'
        channel_id:
          $ref: '#/components/schemas/Uuid'
        seq:
          type: integer
          format: int64
        sender:
          $ref: '#/components/schemas/PlayerCard'
        kind:
          $ref: '#/components/schemas/MessageKind'
        body:
          type:
            - string
            - 'null'
          maxLength: 1000
          description: Nội dung hiển thị (đã che); null khi đã thu hồi/gỡ
        quick_message_id:
          type: string
          maxLength: 64
          description: Mã quick message; client hiển thị theo locale của người nhận (ADR-0056)
        sticker_id:
          $ref: '#/components/schemas/Uuid'
        gif_id:
          $ref: '#/components/schemas/Uuid'
        reply_to_message_id:
          $ref: '#/components/schemas/Uuid'
        reply_excerpt:
          type: string
          maxLength: 80
          readOnly: true
          description: Trích ngắn (≤ 80 ký tự) từ nội dung đã che của tin được trả lời; vắng mặt khi tin gốc đã thu hồi/gỡ (client hiển thị "Tin nhắn gốc không còn", F118-AC-05, AC-07)
        quote:
          $ref: '#/components/schemas/QuoteRef'
        forwarded_from:
          $ref: '#/components/schemas/ForwardedFrom'
        mentions:
          type: array
          items:
            $ref: '#/components/schemas/PlayerCard'
        reactions:
          $ref: '#/components/schemas/ReactionSummary'
        revision:
          type: integer
          minimum: 1
        edited_at:
          $ref: '#/components/schemas/Timestamp'
        recalled:
          type: boolean
        pinned:
          type: boolean
        moderation_state:
          type: string
          enum:
            - allowed
            - masked
            - unchecked
            - held
            - removed
        created_at:
          $ref: '#/components/schemas/Timestamp'
        system_code:
          type: string
          maxLength: 128
          description: 'kind=system: mã thông điệp hệ thống, client dựng câu theo locale'
        params:
          type: object
          description: 'kind=system: tham số của system_code; kind=quick: tham số của quick message (đã qua pipeline kiểm duyệt, F116-AC-28)'
          maxProperties: 20
          additionalProperties:
            type: string
            maxLength: 255
    PlayerCard:
      type: object
      description: Thông tin công khai tối thiểu của người chơi khác (không tên thật, không trường nếu liên trường)
      required:
        - user_id
        - nickname
      properties:
        user_id:
          $ref: '#/components/schemas/Uuid'
        nickname:
          type: string
          maxLength: 32
        level:
          type: integer
        avatar_config:
          $ref: '#/components/schemas/AvatarConfig'
        presence:
          type: string
          enum:
            - offline
            - online
            - in_activity
            - in_match
            - away
          description: PresenceStatus (MULTIPLAYER_GAMEPLAY §5, enum chung với AsyncAPI)
    AvatarConfig:
      type: object
      description: Cấu trúc theo CHARACTER_SYSTEM §5.1 — bản JSON Schema dùng chung specs/schemas/avatar-config.schema.json (phải giữ khớp). item_id là mã (varchar 64), không phải UUID; server kiểm danh mục, sở hữu (ITEM_NOT_OWNED) và slot (EQUIP_SLOT_INVALID); ≤ 16 KB.
      additionalProperties: false
      required:
        - schema_version
        - body_type
        - skin_tone
        - hair
        - outfit
      properties:
        schema_version:
          type: integer
          const: 1
        body_type:
          $ref: '#/components/schemas/CatalogCode'
        skin_tone:
          $ref: '#/components/schemas/CatalogCode'
        hair:
          type: object
          additionalProperties: false
          required:
            - item_id
            - color
          properties:
            item_id:
              $ref: '#/components/schemas/CatalogCode'
            color:
              $ref: '#/components/schemas/CatalogCode'
        outfit:
          type: object
          additionalProperties: false
          required:
            - item_id
          properties:
            item_id:
              $ref: '#/components/schemas/CatalogCode'
        accessories:
          type: array
          maxItems: 4
          items:
            type: object
            additionalProperties: false
            required:
              - slot
              - item_id
            properties:
              slot:
                type: string
                enum:
                  - head
                  - face
                  - back
                  - hand
              item_id:
                $ref: '#/components/schemas/CatalogCode'
        emote_slots:
          type: array
          maxItems: 6
          description: Tối đa emote_wheel_slots (CONFIG_DEFAULTS)
          items:
            $ref: '#/components/schemas/CatalogCode'
        pet:
          $ref: '#/components/schemas/CatalogCode'
        title:
          $ref: '#/components/schemas/CatalogCode'
        frame:
          $ref: '#/components/schemas/CatalogCode'
        badge_showcase:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/CatalogCode'
    CatalogCode:
      type: string
      minLength: 1
      maxLength: 64
      pattern: ^[a-z0-9_]+$
      description: Mã nội dung game (item_id, preset, dáng, màu) — chuỗi, không phải UUID
    QuoteRef:
      type: object
      required:
        - message_id
      properties:
        message_id:
          $ref: '#/components/schemas/Uuid'
        excerpt_start:
          type: integer
          minimum: 0
        excerpt_end:
          type: integer
          minimum: 0
        excerpt:
          type: string
          maxLength: 200
          readOnly: true
          description: Server cắt từ nội dung đã che; client không gửi
    ForwardedFrom:
      type: object
      readOnly: true
      properties:
        message_id:
          $ref: '#/components/schemas/Uuid'
        channel_type:
          $ref: '#/components/schemas/ChannelType'
        sender_nickname:
          type: string
          maxLength: 32
    ReactionSummary:
      type: object
      properties:
        counts:
          type: object
          additionalProperties:
            type: integer
          description: emoji_code → số lượng
        mine:
          type: array
          maxItems: 3
          items:
            type: string
            maxLength: 255
    PageInfo:
      type: object
      required:
        - has_more
        - limit
      properties:
        next_cursor:
          type:
            - string
            - 'null'
          maxLength: 512
        has_more:
          type: boolean
        limit:
          type: integer
    MessageCreate:
      type: object
      required:
        - kind
        - client_message_id
      properties:
        client_message_id:
          $ref: '#/components/schemas/Uuid'
        kind:
          type: string
          enum:
            - text
            - emoji
            - quick
            - sticker
            - gif
        body:
          type: string
          maxLength: 300
        quick_message_id:
          type: string
          maxLength: 64
          description: Mã quick message (cùng kiểu với Message.quick_message_id và AsyncAPI)
        params:
          type: object
          maxProperties: 5
          description: 'kind=quick: tham số của quick message có chỗ trống ({n}); mỗi giá trị qua pipeline kiểm duyệt như text (F116-AC-28)'
          propertyNames:
            type: string
            maxLength: 32
            pattern: ^[a-z][a-z0-9_]{0,31}$
          additionalProperties:
            type: string
            minLength: 1
            maxLength: 64
        emoji:
          type: string
          maxLength: 16
        sticker_id:
          $ref: '#/components/schemas/Uuid'
        gif_id:
          $ref: '#/components/schemas/Uuid'
        reply_to_message_id:
          $ref: '#/components/schemas/Uuid'
        quote:
          $ref: '#/components/schemas/QuoteRef'
        mentions:
          type: array
          maxItems: 20
          description: Người được mention (thành viên channel); vượt chat_mentions_max (5) → 422 CHAT_MENTION_LIMIT, id không hợp lệ bị loại khỏi tin (CHAT_SYSTEM §7.7)

          $ref: '#/components/schemas/Uuid'
        published_by:
          $ref: '#/components/schemas/Uuid'
        published_at:
          $ref: '#/components/schemas/Timestamp'
        publish_at:
          $ref: '#/components/schemas/Timestamp'
        active_pinned_sessions:
          type: integer
          minimum: 0
          description: Số lượt chơi/học đang ghim version này (ước lượng)
        field_comments:
          type: array
          maxItems: 50
          description: Nhận xét theo trường của lần từ chối gần nhất của version (F025 T046)
          items:
            $ref: '#/components/schemas/ReviewFieldComment'
    ReviewFieldComment:
      type: object
      required:
        - path
        - comment
      additionalProperties: false
      properties:
        path:
          type: string
          maxLength: 256
          description: JSON pointer (RFC 6901) tới trường của version, vd. /stem/vi; rỗng = toàn bộ
        comment:
          type: string
          minLength: 1
          maxLength: 1000
    ContentVersionDiff:
      type: object
      required:
        - from_version
        - to_version
        - changes
      properties:
        from_version:
          type: integer
          minimum: 1
        to_version:
          type: integer
          minimum: 1
        changes:
          type: array
          maxItems: 2000
          items:
            type: object
            required:
              - path
              - op
            properties:
              path:
                type: string
                maxLength: 512
                description: JSON pointer của field/khối
              op:
                type: string
                enum:
                  - added
                  - removed
                  - changed
              before:
                description: Giá trị cũ (answer_key chỉ trả khi có quyền review)
              after:
                description: Giá trị mới
    PublishRequest:
      type: object
      properties:
        publish_at:
          description: Hẹn giờ xuất bản (UTC); bỏ trống = xuất bản ngay
          $ref: '#/components/schemas/Timestamp'
        change_note:
          type: string
          maxLength: 500
    ContentRelease:
      type: object
      required:
        - release_id
        - item_type
        - item_id
        - action
        - released_by
        - released_at
      properties:
        release_id:
          $ref: '#/components/schemas/Uuid'
        item_type:
          type: string
          maxLength: 64
        item_id:
          $ref: '#/components/schemas/Uuid'
        action:
          type: string
          enum:
            - publish
            - rollback
            - unpublish
        from_version:
          type: integer
          minimum: 1
        to_version:
          type: integer
          minimum: 1
        reason:
          type: string
          maxLength: 500
        scheduled_for:
          $ref: '#/components/schemas/Timestamp'
        status:
          type: string
          enum:
            - scheduled
            - applied
            - cancelled
            - failed
        failure_code:
          type: string
          maxLength: 64
          description: Mã lỗi guard khi lịch hẹn không áp dụng được
        released_by:
          $ref: '#/components/schemas/Uuid'
        released_at:
          $ref: '#/components/schemas/Timestamp'
        usages:
          type: array
          maxItems: 500
          description: 'Chỉ trong phản hồi unpublishGameConfig: nơi còn tham chiếu nội dung vừa gỡ (nội dung game đã publish, tenant được gán) — lượt đã ghim version giữ nguyên (F078-AC-14)'
          items:
            type: object
            required:
              - kind
              - item_type
              - item_id
            properties:
              kind:
                type: string
                enum:
                  - game_content
                  - tenant_assignment
              item_type:
                type: string
                maxLength: 64
              item_id:
                type: string
                maxLength: 64
              tenant_id:
                $ref: '#/components/schemas/Uuid'
    RollbackRequest:
      type: object
      required:
        - to_version
        - reason
      properties:
        to_version:
          type: integer
          minimum: 1
          description: Số version đã publish của chính item (ROLLBACK_TARGET_INVALID nếu không hợp lệ)
        reason:
          type: string
          minLength: 1
          maxLength: 500
  headers:
    ContentLanguage:
      description: Ngôn ngữ của văn bản đã chọn trong response (`vi-VN` | `en-US`)
      schema:
        type: string
        maxLength: 16
    IdempotentReplayed:
      description: |
        Có giá trị `true` khi response được phát lại từ kho idempotency (cùng `Idempotency-Key` + cùng body trong `idempotency_record_ttl`);
        vắng mặt khi request được xử lý lần đầu (API_DESIGN §6, F003).
      schema:
        type: string
        enum:
          - 'true'
    RateLimitLimit:
      schema:
        type: integer
    RateLimitRemaining:
      schema:
        type: integer
    RateLimitReset:
      schema:
        type: integer
    RetryAfter:
      schema:
        type: integer
    ETag:
      description: Phiên bản tài nguyên cho optimistic concurrency
      schema:
        type: string
        maxLength: 512
  responses:
    Unauthenticated:
      description: Thiếu/sai/hết hạn token (UNAUTHENTICATED)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: PERMISSION_DENIED, FEATURE_DISABLED (action/menu portal đang tắt, có `feature_key` — ADR-0090), GAME_ACCESS_STUDENT_ONLY, POLICY_DENIED, TENANT_NOT_SELECTED, TENANT_MISMATCH, TENANT_ACCESS_DISABLED, RESOURCE_NOT_ASSIGNED, ACCOUNT_LOCKED, ACCOUNT_DEACTIVATED, ACCOUNT_NOT_PROVISIONED, NO_ACTIVE_ENROLLMENT, ACCESS_OUTSIDE_ALLOWED_HOURS, CURFEW_ACTIVE, DAILY_PLAY_LIMIT_REACHED, PARTY_NOT_LEADER, PARTY_INVITE_NOT_ALLOWED, PARTY_POLICY_VIOLATION, CHAT_NOT_ALLOWED, CHAT_KIND_NOT_ALLOWED, CHAT_MUTED, TENANT_TOGGLE_NOT_ALLOWED, MODERATION_SWITCH_SELF_APPROVAL, PORTAL_ACCESS_STAFF_ONLY, HINTS_NOT_ALLOWED, BREAK_GLASS_NOT_ACTIVE
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Không tồn tại hoặc ngoài tenant scope (NOT_FOUND)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Xung đột trạng thái (vd. CONTENT_VERSION_CONFLICT, CONTENT_NOT_PUBLISHED, SIS_SCHOOL_ALREADY_CONNECTED, SIS_SYNC_ALREADY_RUNNING, SIS_CONNECTION_NOT_ACTIVE, ATTEMPT_ALREADY_SUBMITTED, EXAM_ALREADY_SUBMITTED, PARTY_ALREADY_IN_PARTY, PARTY_FULL, MM_TICKET_ALREADY_ACTIVE, IDEMPOTENCY_KEY_REUSED, IDENTITY_CONFLICT, USERNAME_TAKEN, EMAIL_TAKEN, HINTS_EXHAUSTED, ASSIGNMENT_NOT_EDITABLE, MODERATION_CASE_CLOSED, CHAT_CHANNEL_CLOSED, ACCOUNT_LOCK_HELD_BY_SAFETY, ONCALL_SHIFT_OVERLAP, BREAK_GLASS_NOT_PENDING)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationFailed:
      description: VALIDATION_FAILED, SIS_CONTRACT_VERSION_UNSUPPORTED, ATTEMPT_DEADLINE_PASSED, INVALID_STATE_TRANSITION, MODERATION_SWITCH_REASON_REQUIRED, SENSITIVE_TERM_INVALID, SENSITIVE_CATALOG_REGRESSION_FAILED, DASHBOARD_RANGE_TOO_LARGE, ROLE_NOT_FOUND; sub-code `errors[].code = PERMISSION_NOT_ALLOWED_FOR_SCOPE` khi role tenant chứa permission platform
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
    PreconditionRequired:
      description: IDEMPOTENCY_KEY_REQUIRED hoặc PRECONDITION_REQUIRED
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: RATE_LIMITED, LOGIN_QUEUE_BUSY (hàng chờ đăng nhập game, ADR-0045/0068), CHAT_RATE_LIMITED (giới hạn chat theo policy)
      headers:
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    MessageBlocked:
      description: CHAT_CONTENT_BLOCKED — tin nhắn bị bộ lọc chặn; chỉ trả category_code, không echo nội dung hay từ đã khớp (ADR-0030)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: Dịch vụ phụ thuộc tạm thời không sẵn sàng (vd. CHAT_TEMPORARILY_UNAVAILABLE khi NATS JetStream lỗi) — client thử lại theo Retry-After
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailed:
      description: VERSION_MISMATCH
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Gone:
      description: Tài nguyên hết hạn (PARTY_INVITATION_EXPIRED)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  securitySchemes:
    keycloakBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token Keycloak (realm eduworld, aud eduworld-api, TTL 5 phút).
    keycloakAdminBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token Keycloak của Admin Portal (claim `azp = eduworld-portal`, phát qua `POST /auth/portal/login` — ADR-0091); không yêu cầu MFA (ADR-0094).
        Principal phải có role platform với permission tương ứng (`game.*`, `competition.config.*`, `platform.*`).
        Chỉ dùng trên gateway nội bộ (ADR-0027).
    keycloakOidc:
      type: openIdConnect
      description: Host thật theo môi trường (`sso.<env>.<domain>`, OQ-10); URL dưới đây là placeholder hợp lệ.
      openIdConnectUrl: https://sso.eduworld.example/realms/eduworld/.well-known/openid-configuration

      summary: Nhập mã bạn bè để gửi lời mời kết bạn (vẫn kiểm tra phạm vi trường — ADR-0054)
      description: |
        Mã còn hạn của học sinh khác trong tenant phiên tạo lời mời `source = friend_code` với cùng kiểm tra như
        `sendFriendRequest` (F095-AC-08). Mã sai hoặc hết hạn → `404 FRIEND_CODE_INVALID`; mã sai định dạng hoặc mã của
        chính mình → `422`.

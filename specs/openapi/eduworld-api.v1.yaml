        status: { type: string, enum: [active, completed, abandoned, expired] }
        content_versions:
          type: array
          description: Version được ghim cho màn này (ADR-0043)
          maxItems: 1000
          items: { $ref: '#/components/schemas/ContentManifestItem' }
        bundles:
          type: array
          items: { $ref: '#/components/schemas/ContentBundle' }
        media:
          type: array
          maxItems: 2000
          items:
            type: object
            required: [sha256, url]
            properties:
              sha256: { type: string, maxLength: 64 }
              variant: { type: string, maxLength: 64 }
              url: { type: string, format: uri, maxLength: 2048, description: 'Signed URL ngắn hạn nếu media private' }
              expires_at: { $ref: '#/components/schemas/Timestamp' }
        started_at: { $ref: '#/components/schemas/Timestamp' }
        ended_at: { $ref: '#/components/schemas/Timestamp' }

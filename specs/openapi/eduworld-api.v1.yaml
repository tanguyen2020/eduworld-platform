components:
  securitySchemes:
    keycloakBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token Keycloak (realm eduworld, aud eduworld-api, TTL 5 phút).
    keycloakAdminBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token Keycloak của Admin Portal (claim `azp = eduworld-portal`) có MFA (`acr` mức MFA, `amr` chứa otp/webauthn; thiếu → 403 MFA_REQUIRED),
        Principal phải có role platform với permission tương ứng (`game.*`, `competition.config.*`, `platform.*`).
        Chỉ dùng trên gateway nội bộ (ADR-0027).
    keycloakOidc:
      type: openIdConnect
      description: Host thật theo môi trường (`sso.<env>.<domain>`, OQ-10); URL dưới đây là placeholder hợp lệ.
      openIdConnectUrl: https://sso.eduworld.example/realms/eduworld/.well-known/openid-configuration

  headers:
    ETag:
      description: Phiên bản tài nguyên cho optimistic concurrency
      schema: { type: string, maxLength: 512 }
    RateLimitLimit:
      schema: { type: integer }
    RateLimitRemaining:
      schema: { type: integer }
    RateLimitReset:
      schema: { type: integer }
    RetryAfter:
      schema: { type: integer }
    ContentLanguage:
      description: Ngôn ngữ của văn bản đã chọn trong response (`vi-VN` | `en-US`)
      schema: { type: string, maxLength: 16 }

  parameters:
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Cursor:
      name: cursor
      in: query
      description: Cursor opaque từ page.next_cursor
      schema: { type: string, maxLength: 512 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID do client sinh; lưu 24h (ADR-0010)
      schema: { type: string, format: uuid }
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string, maxLength: 512 }
    Version:
      name: version
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    SubjectIdQuery:
      name: subject_id
      in: query
      schema: { $ref: '#/components/schemas/Uuid' }
    GradeLevelQuery:
      name: grade_level
      in: query
      schema: { $ref: '#/components/schemas/GradeLevel' }
    GameSessionId:
      name: game_session_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    QuestId:
      name: quest_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    AreaId:
      name: area_id
      in: path
      required: true
      description: 'Danh sách chuẩn ở docs/01-game-design/WORLD_DESIGN.md §3 (vd. main_hub, learning_zone.math, quest_zone.discovery_ocean, challenge_mountain, arena)'
      schema: { type: string, maxLength: 64, pattern: '^[a-z0-9_.]{1,64}$' }
    StepId:
      name: step_id
      in: path
      required: true
      schema: { type: string, maxLength: 64, pattern: '^[a-z0-9_\-]{1,64}$' }
    AttemptId:
      name: attempt_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    ExamSessionId:
      name: exam_session_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    PartyId:
      name: party_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    InvitationId:
      name: invitation_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    StudentId:
      name: student_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    UserId:
      name: user_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    ClubIdPath:
      name: club_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    DuelIdPath:
      name: duel_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    TicketId:
      name: ticket_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    MatchId:
      name: match_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    LeaderboardId:
      name: leaderboard_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    ChannelId:
      name: channel_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    MessageId:
      name: message_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    SchoolId:
      name: school_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    TermIdPath:
      name: term_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    DeviceIdHeader:
      name: X-Device-Id
      in: header
      required: true
      description: UUID của bản cài game (sinh lần đầu, lưu user://). Dùng cho quy tắc một thiết bị (ADR-0031), không phải credential.
      schema: { $ref: '#/components/schemas/Uuid' }
    TenantIds:
      name: tenant_ids
      in: query
      required: false
      description: |
        Chỉ System Admin (platform.cross_tenant.read): lọc theo một hoặc nhiều tenant; vắng mặt = tất cả tenant.
        Người dùng tenant gửi tham số này bị bỏ qua (luôn khóa vào tenant của phiên) — ADR-0027 §6.
      style: form
      explode: true
      schema:
        type: array
        maxItems: 100
        items: { $ref: '#/components/schemas/Uuid' }
    ResourceTypePath:
      name: resource_type
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ResourceType' }
    ResourceIdPath:
      name: resource_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    GameConfigType:
      name: config_type
      in: path
      required: true
      schema: { $ref: '#/components/schemas/GameConfigType' }
    GameConfigId:
      name: config_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }

    LearningContentType:
      name: content_type
      in: path
      required: true
      schema:
        type: string
        enum: [question, question_set, assessment_blueprint, lesson, learning_material, learning_path, activity, rubric]
    ContentIdPath:
      name: content_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    AssetIdPath:
      name: asset_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    ConnectionIdPath:
      name: connection_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: ETag của manifest client đang có; trùng → 304
      schema: { type: string, maxLength: 128 }
    ChallengeIdPath:
      name: challenge_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    ChallengeAttemptIdPath:
      name: challenge_attempt_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    EncounterIdPath:
      name: encounter_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    ActivityIdPath:
      name: activity_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    RecordingIdPath:
      name: recording_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    RubricIdPath:
      name: rubric_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    ReviewTaskIdPath:
      name: review_task_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: Ngôn ngữ hiển thị mong muốn (`vi-VN` mặc định, `en-US`). Server chọn ngôn ngữ trả về và đặt `Content-Language` (ADR-0056). Dữ liệu cache dài (manifest, snapshot) luôn trả đủ vi+en.
      schema: { type: string, maxLength: 64, examples: [vi-VN, en-US] }
    TranslationJobIdPath:
      name: job_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    EventIdPath:
      name: event_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    EventRunIdPath:
      name: run_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    MilestoneIdPath:
      name: milestone_id
      in: path
      required: true
      schema: { type: string, maxLength: 64 }
    GoalIdPath:
      name: goal_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    SeasonTierPath:
      name: tier
      in: path
      required: true
      schema: { type: integer, minimum: 1, maximum: 100 }
    FunnelCodePath:
      name: funnel_code
      in: path
      required: true
      schema: { type: string, maxLength: 64 }
    TenantIdHeader:
      name: X-Tenant-Id
      in: header
      required: true
      description: |
        Tenant của phiên (ADR-0065). Lấy từ `PlayerBootstrap.tenant_id` (game) hoặc tenant đã chọn sau đăng nhập portal (`GET /me/tenants`).
        Gateway trả `400 TENANT_HEADER_REQUIRED` khi thiếu, `400 BAD_REQUEST` khi sai định dạng; backend kiểm tra khớp token + membership,
        lệch → `403 TENANT_MISMATCH`. `Principal.tenant_id` lấy từ kết quả kiểm tra, không lấy thẳng từ header.
      schema: { $ref: '#/components/schemas/Uuid' }
    TenantIdHeaderOptional:
      name: X-Tenant-Id
      in: header
      required: false
      description: |
        Người dùng tenant: **bắt buộc** (thiếu → `400 TENANT_HEADER_REQUIRED`). Role platform (System Admin, content_admin…):
        vắng mặt = phạm vi platform / đọc liên tenant bằng `tenant_ids`; có giá trị = tenant đích của thao tác ghi (ADR-0027, ADR-0065).
        Có giá trị thì luôn được kiểm tra như `TenantIdHeader`.
      schema: { $ref: '#/components/schemas/Uuid' }
    RoleIdPath:
      name: role_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    UserRoleIdPath:
      name: user_role_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    ProvinceIdPath:
      name: province_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    CountryCodePath:
      name: code
      in: path
      required: true
      schema: { type: string, pattern: '^[A-Z]{2}$', maxLength: 2 }
    ReportIdPath:
      name: report_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    LessonIdPath:
      name: lesson_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    ReasonQuery:
      name: reason
      in: query
      required: true
      description: Lý do (ghi audit) — bắt buộc khi xóa/thu hồi
      schema: { type: string, minLength: 3, maxLength: 1000 }
    DashboardFrom:
      name: from
      in: query
      required: true
      description: Ngày bắt đầu (bao gồm, theo múi giờ tenant). Khoảng `from`–`to` tối đa 730 ngày (`dashboard_max_range_days`) — vượt → `422 DASHBOARD_RANGE_TOO_LARGE` (DASHBOARD_DATA §8).
      schema: { type: string, format: date }
    DashboardTo:
      name: to
      in: query
      required: true
      description: Ngày kết thúc (bao gồm). Phải ≥ `from`.
      schema: { type: string, format: date }
    DashboardGrain:
      name: grain
      in: query
      required: false
      description: |
        Độ hạt **gợi ý**; server quyết định theo khoảng (≤ 31 ngày → day; 32 ngày–1 năm → week; > 1 năm → month) và chỉ chấp nhận
        độ hạt **thô hơn** quy tắc, không mịn hơn (DASHBOARD_DATA §8). Phản hồi luôn trả `grain` thực dùng.
      schema: { $ref: '#/components/schemas/DashboardGrain' }
    DashboardPageSize:
      name: page_size
      in: query
      required: false
      description: Số dòng của danh sách chi tiết (tối đa 100, phân trang cursor — DASHBOARD_DATA §8)
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
  responses:
    Problem:
      description: Lỗi (RFC 9457)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthenticated:
      description: Thiếu/sai/hết hạn token (UNAUTHENTICATED)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: PERMISSION_DENIED, GAME_ACCESS_STUDENT_ONLY, FORBIDDEN_SCOPE, POLICY_DENIED, TENANT_NOT_SELECTED, TENANT_MISMATCH, TENANT_ACCESS_DISABLED, RESOURCE_NOT_ASSIGNED, ACCOUNT_LOCKED, ACCOUNT_DEACTIVATED, ACCOUNT_NOT_PROVISIONED, NO_ACTIVE_ENROLLMENT, ACCESS_OUTSIDE_ALLOWED_HOURS, PARTY_NOT_LEADER, PARTY_INVITE_NOT_ALLOWED, PARTY_POLICY_VIOLATION, CHAT_NOT_ALLOWED, CHAT_KIND_NOT_ALLOWED, CHAT_MUTED, TENANT_TOGGLE_NOT_ALLOWED, PORTAL_ACCESS_STAFF_ONLY
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Không tồn tại hoặc ngoài tenant scope (NOT_FOUND)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Xung đột trạng thái (vd. CONTENT_VERSION_CONFLICT, CONTENT_NOT_PUBLISHED, SIS_SCHOOL_ALREADY_CONNECTED, ATTEMPT_ALREADY_SUBMITTED, EXAM_ALREADY_SUBMITTED, PARTY_ALREADY_IN_PARTY, PARTY_FULL, MM_TICKET_ALREADY_ACTIVE, IDEMPOTENCY_KEY_REUSED, IDENTITY_CONFLICT, USERNAME_TAKEN, EMAIL_TAKEN)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Gone:
      description: Tài nguyên hết hạn (PARTY_INVITATION_EXPIRED)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PreconditionFailed:
      description: VERSION_MISMATCH
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PreconditionRequired:
      description: IDEMPOTENCY_KEY_REQUIRED hoặc PRECONDITION_REQUIRED
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ValidationFailed:
      description: VALIDATION_FAILED, ATTEMPT_DEADLINE_PASSED, INVALID_STATE_TRANSITION, MODERATION_SWITCH_REASON_REQUIRED, SENSITIVE_TERM_INVALID, SENSITIVE_CATALOG_REGRESSION_FAILED, DASHBOARD_RANGE_TOO_LARGE; sub-code `errors[].code = PERMISSION_NOT_ALLOWED_FOR_SCOPE` khi role tenant chứa permission platform
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ValidationProblem' }
    RateLimited:
      description: RATE_LIMITED, LOGIN_QUEUE_BUSY (hàng chờ đăng nhập game, ADR-0045/0068)
      headers:
        RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
        RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
        RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' }
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ServiceUnavailable:
      description: Dịch vụ phụ thuộc tạm thời không sẵn sàng (vd. CHAT_TEMPORARILY_UNAVAILABLE khi NATS JetStream lỗi) — client thử lại theo Retry-After
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    MessageBlocked:
      description: CHAT_CONTENT_BLOCKED — tin nhắn bị bộ lọc chặn; chỉ trả category_code, không echo nội dung hay từ đã khớp (ADR-0030)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    PayloadTooLarge:
      description: MEDIA_TOO_LARGE — vượt giới hạn dung lượng của loại media (ADR-0044)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    UnsupportedMediaType:
      description: MEDIA_TYPE_NOT_ALLOWED — loại file không được phép hoặc magic bytes không khớp
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotModified:
      description: Không đổi so với If-None-Match
      headers:
        ETag:
          schema: { type: string, maxLength: 128 }
    DashboardBusy:
      description: DASHBOARD_BUSY — người dùng đã có quá số truy vấn dashboard đồng thời, hoặc EXPORT_LIMIT_REACHED với export; thử lại theo Retry-After
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    DashboardTimeout:
      description: DASHBOARD_QUERY_TIMEOUT — truy vấn bị hủy ở database sau statement_timeout 5 giây (DASHBOARD_DATA §8)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    # ---------- primitives
    Uuid:
      type: string
      format: uuid
      description: UUIDv7
    Timestamp:
      type: string
      format: date-time
    GradeLevel:
      type: integer
      minimum: 1
      maximum: 9
    GradeBand:
      type: string
      enum: [g1_3, g4_5, g6_7, g8_9]
    ProblemCode:
      type: string
      description: Mã lỗi ổn định — catalog đầy đủ trong docs/07-backend/API_DESIGN.md §4.1. Client phải chấp nhận giá trị lạ.
      enum:
        # Chung
        - BAD_REQUEST
        - TENANT_HEADER_REQUIRED
        - UNAUTHENTICATED
        - TOKEN_EXPIRED
        - PERMISSION_DENIED
        - MFA_REQUIRED
        - CALLER_NOT_ALLOWED
        - FORBIDDEN_SCOPE
        - POLICY_DENIED
        - NOT_FOUND
        - CONFLICT
        - VALIDATION_FAILED
        - INVALID_STATE_TRANSITION
        - VERSION_MISMATCH
        - PRECONDITION_REQUIRED
        - IDEMPOTENCY_KEY_REQUIRED
        - IDEMPOTENCY_KEY_REUSED
        - IDEMPOTENCY_IN_PROGRESS
        - RATE_LIMITED
        - INTERNAL
        - UNAVAILABLE
        - MAINTENANCE
        # Identity / tài khoản (04-identity)
        - ACCOUNT_NOT_PROVISIONED
        - INVALID_CREDENTIALS
        - LOGIN_TICKET_INVALID
        - CLIENT_VERSION_UNSUPPORTED
        - LOGIN_QUEUE_BUSY
        - PORTAL_ACCESS_STAFF_ONLY
        - USERNAME_TAKEN
        - EMAIL_TAKEN
        - ACCOUNT_LOCKED
        - ACCOUNT_DEACTIVATED
        - NO_ACTIVE_ENROLLMENT
        - TENANT_ACCESS_DISABLED
        - ACCESS_OUTSIDE_ALLOWED_HOURS
        - IDENTITY_CONFLICT
        - TENANT_NOT_SELECTED
        - TENANT_MISMATCH
        - GAME_ACCESS_STUDENT_ONLY
        - ACTIVE_SESSION_ON_OTHER_DEVICE
        - RETENTION_BELOW_MINIMUM
        - RESOURCE_NOT_ASSIGNED
        # Content / question bank
        - CONTENT_NOT_EDITABLE
        - CONTENT_VERSION_CONFLICT
        - CONTENT_NOT_PUBLISHED
        - ROLLBACK_TARGET_INVALID
        - MEDIA_TYPE_NOT_ALLOWED
        - MEDIA_TOO_LARGE
        - MEDIA_NOT_READY
        - SIS_SCHOOL_ALREADY_CONNECTED
        - QUESTION_POOL_INSUFFICIENT
        # Exercise / attempt (EXERCISE_ENGINE)
        - ATTEMPT_NOT_FOUND
        - ATTEMPT_NOT_IN_PROGRESS
        - ATTEMPT_ALREADY_SUBMITTED
        - ATTEMPT_DEADLINE_PASSED
        - ATTEMPT_EXPIRED
        - ANSWER_LIMIT_REACHED
        - INVALID_RESPONSE
        - ASSIGNMENT_NOT_OPEN
        - ASSIGNMENT_MAX_ATTEMPTS
        # Activity engine / học tập đa định dạng (ACTIVITY_ENGINE, ADR-0048, ADR-0055)
        - ACTIVITY_TYPE_NOT_SUPPORTED
        - ACTIVITY_CONFIG_INVALID
        - ATTEMPT_PENDING_REVIEW
        - EVALUATION_NOT_EDITABLE
        - MATH_RENDER_FAILED
        - VIDEO_NOT_READY
        - VIDEO_SEEK_NOT_ALLOWED
        - CUE_ANSWER_REQUIRED
        - RESPONSE_TOO_LONG
        - RESPONSE_TOO_SHORT
        - REVIEW_NOT_ASSIGNED
        - RUBRIC_INCOMPLETE
        - SUBMISSION_FILE_REJECTED
        - SIMULATION_LOG_INVALID
        - SPEAKING_NOT_ENABLED
        # Exam (EXAM_ENGINE)
        - EXAM_NOT_ASSIGNED
        - EXAM_NOT_OPEN
        - EXAM_WINDOW_CLOSED
        - EXAM_MAX_ATTEMPTS
        - EXAM_ACTIVE_ON_OTHER_DEVICE
        - EXAM_TIME_OVER
        - EXAM_ALREADY_SUBMITTED
        - EXAM_RESULTS_NOT_RELEASED
        # Game
        - STEP_PRECONDITION_FAILED
        - ITEM_NOT_OWNED
        - EQUIP_SLOT_INVALID
        - QUEST_ALREADY_COMPLETED
        - QUEST_COOLDOWN
        - AREA_LOCKED
        - DISCOVERY_ALREADY_FOUND
        - CHALLENGE_NOT_ELIGIBLE
        - CHALLENGE_ATTEMPT_LIMIT
        - BOSS_ENCOUNTER_FULL
        - BOSS_PHASE_CLOSED
        - INSUFFICIENT_BALANCE
        - PURCHASE_LIMIT_REACHED
        - SHOP_ITEM_UNAVAILABLE
        - ITEM_ALREADY_OWNED
        - TRADE_DISABLED
        # Party (PARTY_SYSTEM)
        - PARTY_ALREADY_IN_PARTY
        - PARTY_FULL
        - PARTY_NOT_FOUND
        - PARTY_NOT_LEADER
        - PARTY_INVITE_NOT_ALLOWED
        - PARTY_INVITE_RATE_LIMITED
        - PARTY_INVITATION_EXPIRED
        - PARTY_POLICY_VIOLATION
        - PARTY_MEMBER_NOT_ONLINE
        - PARTY_ACTIVITY_NOT_ELIGIBLE
        - ROOM_NOT_MEMBER
        # Competition
        - MM_TICKET_ALREADY_ACTIVE
        - MATCH_RESULT_ALREADY_RECORDED
        - DUEL_EXPIRED
        # Social (SOCIAL_SYSTEM)
        - SOCIAL_SCOPE_VIOLATION
        - FRIEND_LIMIT_REACHED
        - FRIEND_CODE_INVALID
        - CLUB_FULL
        - CLUB_LIMIT_REACHED
        - CLUB_NOT_APPROVED
        # Chat (CHAT_SYSTEM, MODERATION)
        - CHAT_NOT_ALLOWED
        - CHAT_KIND_NOT_ALLOWED
        - CHAT_CONTENT_BLOCKED
        - CHAT_MUTED
        - CHAT_RATE_LIMITED
        - CHAT_POLICY_ALWAYS_ON
        - CHAT_CHANNEL_CLOSED
        - CHAT_POLICY_RELAX_NOT_ALLOWED
        - CHAT_EDIT_WINDOW_EXPIRED
        - CHAT_RECALL_WINDOW_EXPIRED
        - CHAT_FORWARD_NOT_ALLOWED
        - CHAT_PIN_LIMIT_REACHED
        - CHAT_MENTION_LIMIT
        - CHAT_TEMPORARILY_UNAVAILABLE
        - CHAT_FEATURE_DISABLED
        - CHAT_ASSET_NOT_AVAILABLE
        - CHAT_CONTENT_HELD
        - MODERATION_SWITCH_REASON_REQUIRED
        - TENANT_TOGGLE_NOT_ALLOWED
        - SENSITIVE_TERM_INVALID
        - SENSITIVE_CATALOG_REGRESSION_FAILED
        - ITEM_REF_INVALID
        - TRANSLATION_INCOMPLETE
        - EVENT_NOT_AVAILABLE
        - EVENT_ENDED
        - EVENT_MILESTONE_NOT_REACHED
        - SEASON_TIER_NOT_REACHED
        - EVENT_TEMPLATE_PARAM_NOT_ALLOWED
        # Dashboard & báo cáo (DASHBOARD_DATA, ADR-0062)
        - DASHBOARD_RANGE_TOO_LARGE
        - DASHBOARD_BUSY
        - DASHBOARD_QUERY_TIMEOUT
        - EXPORT_LIMIT_REACHED

    # ---------- an toàn chat: danh mục từ nhạy cảm & công tắc kiểm duyệt (ADR-0030)
    SensitiveSeverity:
      type: string
      enum: [watch, low, medium, high, critical]
    SensitiveAction:
      type: string
      enum: [allow, mask, block, hold_for_review, block_and_alert]
    SensitiveMatchType:
      type: string
      enum: [word, phrase, contains, pattern]
    ModerationStep:
      type: string
      enum: [sensitive_terms, pii, spam, bullying, async_analysis]
    SensitiveTermCategoryInput:
      type: object
      required: [code, name, severity, default_action, enabled, allow_tenant_toggle]
      properties:
        code: { type: string, maxLength: 64, pattern: '^[a-z][a-z0-9_]{1,40}$' }
        name: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 1000 }
        severity: { $ref: '#/components/schemas/SensitiveSeverity' }
        default_action: { $ref: '#/components/schemas/SensitiveAction' }
        enabled: { type: boolean }
        allow_tenant_toggle: { type: boolean }
    SensitiveTermCategory:
      allOf:
        - $ref: '#/components/schemas/SensitiveTermCategoryInput'
        - type: object
          required: [category_id, updated_at]
          properties:
            category_id: { $ref: '#/components/schemas/Uuid' }
            term_count: { type: integer, minimum: 0 }
            updated_at: { $ref: '#/components/schemas/Timestamp' }
    SensitiveTermInput:
      type: object
      required: [category_id, term, match_type, locale, enabled]
      properties:
        category_id: { $ref: '#/components/schemas/Uuid' }
        term: { type: string, minLength: 1, maxLength: 200, description: 'Với match_type = pattern là biểu thức RE2 (không backreference/lookaround)' }
        match_type: { $ref: '#/components/schemas/SensitiveMatchType' }
        locale: { type: string, enum: [vi, en] }
        variants:
          type: array
          maxItems: 50
          items: { type: string, maxLength: 200 }
        severity_override: { $ref: '#/components/schemas/SensitiveSeverity' }
        action_override: { $ref: '#/components/schemas/SensitiveAction' }
        enabled: { type: boolean }
        note: { type: string, maxLength: 500 }
    SensitiveTerm:
      allOf:
        - $ref: '#/components/schemas/SensitiveTermInput'
        - type: object
          required: [term_id, scope, updated_at]
          properties:
            term_id: { $ref: '#/components/schemas/Uuid' }
            scope: { type: string, enum: [platform, tenant] }
            tenant_id:
              oneOf:
                - $ref: '#/components/schemas/Uuid'
                - type: 'null'
            status: { type: string, enum: [draft, published] }
            updated_at: { $ref: '#/components/schemas/Timestamp' }
    SensitiveTermPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/SensitiveTerm' }
        page: { $ref: '#/components/schemas/PageInfo' }
    SensitiveAllowlistInput:
      type: object
      required: [phrase, locale, reason]
      properties:
        phrase: { type: string, minLength: 1, maxLength: 200 }
        locale: { type: string, enum: [vi, en] }
        reason: { type: string, maxLength: 500 }
    SensitiveAllowlistEntry:
      allOf:
        - $ref: '#/components/schemas/SensitiveAllowlistInput'
        - type: object
          required: [entry_id]
          properties:
            entry_id: { $ref: '#/components/schemas/Uuid' }
            tenant_id:
              oneOf:
                - $ref: '#/components/schemas/Uuid'
                - type: 'null'
    SensitiveTermTestRequest:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 500 }
        tenant_id: { $ref: '#/components/schemas/Uuid' }
        include_drafts: { type: boolean, default: true }
    SensitiveTermTestResult:
      type: object
      required: [decision, matches]
      properties:
        decision: { $ref: '#/components/schemas/SensitiveAction' }
        masked_text: { type: string, maxLength: 1000 }
        matches:
          type: array
          items:
            type: object
            required: [category_code, severity, action, start, end]
            properties:
              category_code: { type: string, maxLength: 64 }
              term_id: { $ref: '#/components/schemas/Uuid' }
              severity: { $ref: '#/components/schemas/SensitiveSeverity' }
              action: { $ref: '#/components/schemas/SensitiveAction' }
              start: { type: integer, minimum: 0 }
              end: { type: integer, minimum: 0 }
    SensitiveCatalogPublishRequest:
      type: object
      required: [change_summary]
      properties:
        change_summary: { type: string, minLength: 5, maxLength: 1000 }
    SensitiveCatalogVersion:
      type: object
      required: [catalog_version, scope, published_at, published_by, term_count]
      properties:
        catalog_version: { type: integer, minimum: 1 }
        scope: { type: string, enum: [platform, tenant] }
        tenant_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        published_at: { $ref: '#/components/schemas/Timestamp' }
        published_by: { $ref: '#/components/schemas/Uuid' }
        change_summary: { type: string, maxLength: 1000 }
        term_count: { type: integer, minimum: 0 }
        regression:
          type: object
          properties:
            recall: { type: number, minimum: 0, maximum: 1 }
            false_positive_rate: { type: number, minimum: 0, maximum: 1 }
    ModerationSwitchSteps:
      type: object
      required: [sensitive_terms, pii, spam, bullying, async_analysis]
      properties:
        sensitive_terms: { type: boolean }
        pii: { type: boolean }
        spam: { type: boolean }
        bullying: { type: boolean }
        async_analysis: { type: boolean }
    ModerationSwitchUpdate:
      type: object
      required: [scope, enabled_all, steps, reason]
      properties:
        scope: { type: string, enum: [platform, tenant] }
        tenant_id:
          description: Bắt buộc khi scope = tenant
          allOf:
            - $ref: '#/components/schemas/Uuid'
        enabled_all: { type: boolean }
        steps: { $ref: '#/components/schemas/ModerationSwitchSteps' }
        reason: { type: string, minLength: 10, maxLength: 1000 }
        expires_at:
          description: Thời điểm tự bật lại (tùy chọn)
          allOf:
            - $ref: '#/components/schemas/Timestamp'
    ModerationSwitchState:
      type: object
      required: [scope, configured, effective]
      properties:
        scope: { type: string, enum: [platform, tenant] }
        tenant_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        tenant_name: { type: string, maxLength: 255 }
        configured:
          description: Giá trị đặt ở cấp này (null = kế thừa platform)
          oneOf:
            - type: object
              required: [enabled_all, steps]
              properties:
                enabled_all: { type: boolean }
                steps: { $ref: '#/components/schemas/ModerationSwitchSteps' }
                expires_at:
                  oneOf:
                    - $ref: '#/components/schemas/Timestamp'
                    - type: 'null'
            - type: 'null'
        effective:
          description: Giá trị hiệu lực sau khi kết hợp platform và tenant
          type: object
          required: [enabled_all, steps]
          properties:
            enabled_all: { type: boolean }
            steps: { $ref: '#/components/schemas/ModerationSwitchSteps' }
        disabled_steps:
          type: array
          items: { $ref: '#/components/schemas/ModerationStep' }
        updated_by: { $ref: '#/components/schemas/Uuid' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
    ModerationSwitchChange:
      type: object
      required: [change_id, scope, before, after, reason, actor_id, changed_at]
      properties:
        change_id: { $ref: '#/components/schemas/Uuid' }
        scope: { type: string, enum: [platform, tenant] }
        tenant_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        before: { $ref: '#/components/schemas/ModerationSwitchSteps' }
        after: { $ref: '#/components/schemas/ModerationSwitchSteps' }
        enabled_all_before: { type: boolean }
        enabled_all_after: { type: boolean }
        reason: { type: string, maxLength: 1000 }
        expires_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        actor_id: { $ref: '#/components/schemas/Uuid' }
        changed_at: { $ref: '#/components/schemas/Timestamp' }
    TenantSensitiveCategory:
      type: object
      required: [code, name, severity, enabled_platform, enabled_in_tenant, allow_tenant_toggle]
      properties:
        code: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 255 }
        description: { type: string, maxLength: 1000 }
        severity: { $ref: '#/components/schemas/SensitiveSeverity' }
        enabled_platform: { type: boolean }
        enabled_in_tenant: { type: boolean }
        allow_tenant_toggle: { type: boolean }
        tenant_term_count: { type: integer, minimum: 0 }

    # ---------- common
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, maxLength: 2048, format: uri }
        title: { type: string, maxLength: 255 }
        status: { type: integer }
        code:
          description: Mã ổn định; client phải chấp nhận giá trị chưa biết
          anyOf:
            - $ref: '#/components/schemas/ProblemCode'
            - type: string
              maxLength: 64
        detail: { type: string, maxLength: 1000 }
        instance: { type: string, maxLength: 2048 }
        trace_id: { type: string, maxLength: 64 }
        policy_reason: { type: string, maxLength: 1000 }
    ValidationProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            errors:
              type: array
              items:
                type: object
                required: [field, code]
                properties:
                  field: { type: string, maxLength: 64 }
                  code: { type: string, maxLength: 64 }
                  message: { type: string, maxLength: 1000 }
    PageInfo:
      type: object
      required: [has_more, limit]
      properties:
        next_cursor: { type: [string, 'null'], maxLength: 512 }
        has_more: { type: boolean }
        limit: { type: integer }

    # ---------- identity / org
    RoleCode:
      type: string
      description: |
        Mã role (`identity.roles.code`). Role hệ thống seed sẵn — tenant: tenant_admin, school_admin, academic_manager, teacher,
        tenant_content_editor, tenant_content_reviewer, tenant_moderator; platform: system_admin, content_admin, content_reviewer,
        game_designer, liveops, competition_admin (ADR-0066). Tenant có thể tạo role tùy biến [Proposed] nên không dùng enum.
        `student` là realm role Keycloak của học sinh, không phải role portal.
      maxLength: 64
      pattern: ^[a-z][a-z0-9_]{1,63}$
    EffectiveRole:
      type: object
      required: [role, scope_type]
      properties:
        role: { $ref: '#/components/schemas/RoleCode' }
        scope_type: { type: string, enum: [platform, tenant, school, class, subject] }
        tenant_id:
          description: Tenant của assignment; null với scope platform
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        scope_id: { $ref: '#/components/schemas/Uuid' }
      description: Role hiệu lực rút gọn của Principal (tóm tắt từ UserRole, ADR-0066)
    Principal:
      type: object
      required: [user_id, user_type, status, roles]
      properties:
        user_id: { $ref: '#/components/schemas/Uuid' }
        user_type: { type: string, enum: [student, teacher, staff, admin] }
        status: { type: string, enum: [pending, active, locked, deactivated] }
        display_name: { type: string, maxLength: 128 }
        roles:
          type: array
          items: { $ref: '#/components/schemas/EffectiveRole' }
    StudentSummary:
      type: object
      required: [student_id, school_id, grade_level]
      properties:
        student_id: { $ref: '#/components/schemas/Uuid' }
        display_name: { type: string, maxLength: 128 }
        school_id: { $ref: '#/components/schemas/Uuid' }
        school_name: { type: string, maxLength: 255 }
        grade_level: { $ref: '#/components/schemas/GradeLevel' }
        class_id: { $ref: '#/components/schemas/Uuid' }
        class_name: { type: string, maxLength: 128 }
    Class:
      type: object
      required: [class_id, school_id, grade_level, name]
      properties:
        class_id: { $ref: '#/components/schemas/Uuid' }
        school_id: { $ref: '#/components/schemas/Uuid' }
        academic_year_id: { $ref: '#/components/schemas/Uuid' }
        grade_level: { $ref: '#/components/schemas/GradeLevel' }
        name: { type: string, maxLength: 255 }
        student_count: { type: integer }
    PlayerBootstrap:
      type: object
      required: [user, tenant_id, tenant_type, is_common_tenant, game_profile, policies, feature_flags]
      properties:
        user: { $ref: '#/components/schemas/Principal' }
        tenant_id:
          $ref: '#/components/schemas/Uuid'
          description: Giá trị header `X-Tenant-Id` của mọi request tiếp theo (ADR-0065)
        tenant_type: { $ref: '#/components/schemas/TenantType' }
        is_common_tenant: { type: boolean, description: 'true nếu học sinh không thuộc tenant SIS nào và vào tenant chung (ADR-0026, ADR-0063)' }
        tenant_name: { type: string, maxLength: 255 }
        student: { $ref: '#/components/schemas/StudentSummary' }
        school: { $ref: '#/components/schemas/PlayerSchool' }
        class: { $ref: '#/components/schemas/PlayerClass' }
        game_profile: { $ref: '#/components/schemas/GameProfile' }
        grade_band: { $ref: '#/components/schemas/GradeBand' }
        policies:
          type: object
          description: Policy hiệu lực rút gọn cho client (chỉ để hiển thị; server vẫn kiểm tra)
          properties:
            chat:
              type: object
              properties:
                allowed_kinds_by_channel:
                  type: object
                  additionalProperties:
                    type: array
                    items: { type: string, enum: [text, quick, emoji] }
                direct_message_enabled: { type: boolean }
            party:
              type: object
              properties:
                max_members: { type: integer, minimum: 2, maximum: 8, default: 4 }
                cross_class_allowed: { type: boolean }
            play_time:
              type: object
              properties:
                break_reminder_minutes: { type: integer }
                access_window: { type: string, maxLength: 64, description: 'vd. 06:30-21:30 Asia/Ho_Chi_Minh' }
        feature_flags:
          type: object
          additionalProperties: { type: boolean }
        content_manifest_version: { type: string, maxLength: 64 }
        server_time: { $ref: '#/components/schemas/Timestamp' }
        preferred_language:
          $ref: '#/components/schemas/Locale'
          description: Ngôn ngữ đã chọn của học sinh; vắng mặt = default_locale của tenant
        supported_locales:
          type: array
          maxItems: 8
          items: { $ref: '#/components/schemas/Locale' }

    # ---------- game
    GameProfile:
      type: object
      required: [student_id, nickname, level, xp_total]
      properties:
        student_id: { $ref: '#/components/schemas/Uuid' }
        nickname: { type: string, maxLength: 128 }
        level: { type: integer, minimum: 1 }
        xp_total: { type: integer, minimum: 0 }
        avatar_config: { $ref: '#/components/schemas/AvatarConfig' }
        last_area_id: { type: string, maxLength: 64 }
        settings:
          type: object
          additionalProperties: true
        preferred_language: { $ref: '#/components/schemas/Locale' }
    GameProfileUpdate:
      type: object
      properties:
        nickname_option_id:
          $ref: '#/components/schemas/Uuid'
        settings:
          type: object
          additionalProperties: true
        preferred_language: { $ref: '#/components/schemas/Locale' }
    AvatarConfig:
      type: object
      properties:
        body: { type: string, maxLength: 1000 }
        skin_tone: { type: string, maxLength: 64 }
        hair_item_id: { $ref: '#/components/schemas/Uuid' }
        outfit_item_id: { $ref: '#/components/schemas/Uuid' }
        accessory_item_ids:
          type: array
          maxItems: 4
          items: { $ref: '#/components/schemas/Uuid' }
        emote_item_ids:
          type: array
          maxItems: 8
          items: { $ref: '#/components/schemas/Uuid' }
    PlayerCard:
      type: object
      description: Thông tin công khai tối thiểu của người chơi khác (không tên thật, không trường nếu liên trường)
      required: [user_id, nickname]
      properties:
        user_id: { $ref: '#/components/schemas/Uuid' }
        nickname: { type: string, maxLength: 128 }
        level: { type: integer }
        avatar_config: { $ref: '#/components/schemas/AvatarConfig' }
        presence: { type: string, enum: [online, in_activity, offline] }
    GameSessionCreate:
      type: object
      required: [client_platform, client_version]
      properties:
        client_platform: { type: string, enum: [windows, android, ios, web, macos, linux] }
        client_version: { type: string, maxLength: 32 }
        device_class: { type: string, enum: [low, mid, high] }
        device_model: { type: string, maxLength: 64, description: 'Tên rút gọn, không định danh phần cứng' }
        takeover:
          type: boolean
          default: false
          description: true sau khi học sinh xác nhận đăng xuất thiết bị khác (ADR-0031)
    GameSession:
      type: object
      required: [game_session_id, started_at, login_at]
      properties:
        game_session_id: { $ref: '#/components/schemas/Uuid' }
        started_at: { $ref: '#/components/schemas/Timestamp' }
        login_at: { $ref: '#/components/schemas/Timestamp' }
        replaced_session_id:
          description: Session trên thiết bị cũ đã bị kết thúc do takeover
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        assigned_area_id: { type: string, maxLength: 64 }
    OtherDevice:
      type: object
      required: [platform, last_seen_at]
      properties:
        platform: { type: string, enum: [windows, android, ios, web, macos, linux] }
        device_label: { type: string, maxLength: 64, description: 'Ví dụ "Máy tính Windows", "Điện thoại Android"' }
        last_seen_at: { $ref: '#/components/schemas/Timestamp' }
    ActiveSessionConflict:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [other_device]
          properties:
            other_device: { $ref: '#/components/schemas/OtherDevice' }
    LoginEndReason:
      type: string
      enum: [logout, replaced_by_other_device, timeout, account_locked, cleanup, client_crash]
    LoginEvent:
      type: object
      description: Một lần đăng nhập game (append-only, ADR-0031). Không có IP thô.
      required: [login_event_id, tenant_id, student_id, platform, login_at]
      properties:
        login_event_id: { $ref: '#/components/schemas/Uuid' }
        tenant_id: { $ref: '#/components/schemas/Uuid' }
        student_id: { $ref: '#/components/schemas/Uuid' }
        game_session_id: { $ref: '#/components/schemas/Uuid' }
        platform: { type: string, enum: [windows, android, ios, web, macos, linux] }
        device_label: { type: string, maxLength: 64 }
        client_version: { type: string, maxLength: 32 }
        login_at: { $ref: '#/components/schemas/Timestamp' }
        logout_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        end_reason:
          oneOf:
            - $ref: '#/components/schemas/LoginEndReason'
            - type: 'null'
    LoginEventPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/LoginEvent' }
        page: { $ref: '#/components/schemas/PageInfo' }
    TenantSettings:
      type: object
      description: Cài đặt tenant (một phần). Trường cleanup chỉ ghi được khi platform cho phép ghi đè (ADR-0032).
      properties:
        allowed_hours: { type: object, additionalProperties: true }
        inactive_student_cleanup_days:
          description: null hoặc 0 = tắt dọn cho tenant; vắng mặt = dùng mặc định platform
          oneOf:
            - type: integer
              minimum: 0
              maximum: 3650
            - type: 'null'
        effective_cleanup_days:
          readOnly: true
          oneOf:
            - type: integer
            - type: 'null'
        gameplay_chat_retention_days:
          description: Thời hạn lưu chat gameplay của tenant (ADR-0033), ≥ 3; vắng mặt = mặc định platform
          oneOf:
            - type: integer
              minimum: 3
              maximum: 365
            - type: 'null'
        default_locale:
          $ref: '#/components/schemas/Locale'
          description: Ngôn ngữ mặc định của tenant cho học sinh mới (ADR-0056)
    ChatRetentionSettings:
      type: object
      required: [gameplay_chat_retention_days, ephemeral_retention_hours, allow_tenant_override, reason]
      properties:
        gameplay_chat_retention_days: { type: integer, minimum: 3, maximum: 365, default: 7 }
        minimum_days: { type: integer, readOnly: true, const: 3 }
        ephemeral_retention_hours: { type: integer, minimum: 1, maximum: 168, default: 24 }
        allow_tenant_override: { type: boolean, default: true }
        reason: { type: string, minLength: 3, maxLength: 500, writeOnly: true }
    StudentCleanupSettings:
      type: object
      required: [default_days, notice_days, allow_tenant_override, approval_threshold_percent, reason]
      properties:
        default_days:
          description: Mặc định platform (180 [Proposed]); null = tắt toàn hệ thống
          oneOf:
            - type: integer
              minimum: 0
              maximum: 3650
            - type: 'null'
        notice_days: { type: integer, minimum: 0, maximum: 90, default: 14 }
        allow_tenant_override: { type: boolean, default: true }
        approval_threshold_percent: { type: integer, minimum: 1, maximum: 100, default: 10 }
        reason: { type: string, minLength: 3, maxLength: 500, writeOnly: true }
    StudentCleanupCandidate:
      type: object
      required: [student_id, display_name, last_login_at, scheduled_cleanup_at]
      properties:
        student_id: { $ref: '#/components/schemas/Uuid' }
        display_name: { type: string, maxLength: 128 }
        school_id: { $ref: '#/components/schemas/Uuid' }
        class_name: { type: string, maxLength: 128 }
        last_login_at:
          description: null = chưa từng đăng nhập (tính từ provisioned_at)
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        provisioned_at: { $ref: '#/components/schemas/Timestamp' }
        scheduled_cleanup_at: { $ref: '#/components/schemas/Timestamp' }
        excluded_until:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    StudentCleanupCandidatePage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/StudentCleanupCandidate' }
        page: { $ref: '#/components/schemas/PageInfo' }
    CleanupExclusionRequest:
      type: object
      required: [student_ids, reason]
      properties:
        student_ids:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: '#/components/schemas/Uuid' }
        until:
          description: null = loại trừ vô thời hạn (đến khi gỡ)
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        reason: { type: string, minLength: 3, maxLength: 500 }
    StudentCleanupRun:
      type: object
      required: [run_id, tenant_id, status, started_at]
      properties:
        run_id: { $ref: '#/components/schemas/Uuid' }
        tenant_id: { $ref: '#/components/schemas/Uuid' }
        status: { type: string, enum: [dry_run, running, completed, awaiting_approval, approved, failed] }
        candidates: { type: integer }
        cleaned: { type: integer }
        excluded: { type: integer }
        skipped_active: { type: integer, description: Đang có session/bài kiểm tra/giải đấu/moderation case mở }
        started_at: { $ref: '#/components/schemas/Timestamp' }
        finished_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    StudentCleanupRunPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/StudentCleanupRun' }
        page: { $ref: '#/components/schemas/PageInfo' }
    RealtimeTicket:
      type: object
      required: [ticket, expires_at, url]
      properties:
        ticket: { type: string, maxLength: 512, description: 'Opaque, dùng 1 lần' }
        expires_at: { $ref: '#/components/schemas/Timestamp' }
        url: { type: string, maxLength: 2048, format: uri, description: 'wss://.../realtime/v1' }
        protocol_version: { type: integer, default: 1 }
    ClientConfig:
      type: object
      required: [min_client_version, maintenance]
      properties:
        min_client_version: { type: string, maxLength: 64 }
        latest_client_version: { type: string, maxLength: 64 }
        update_required: { type: boolean }
        maintenance:
          type: object
          required: [active]
          properties:
            active: { type: boolean }
            message: { type: string, maxLength: 1000 }
            until: { $ref: '#/components/schemas/Timestamp' }
        login:
          type: object
          description: Đăng nhập game bằng form trong game qua backend (ADR-0068) — game không dùng OIDC trình duyệt, không có client_id/secret phía game
          properties:
            login_url: { type: string, maxLength: 2048, format: uri, description: 'URL đầy đủ của `POST /auth/game/login`' }
            remember_username_default: { type: boolean, description: 'Mặc định bật "Nhớ tên đăng nhập" (chỉ username, ADR-0064); tắt sẵn trên thiết bị phòng máy' }
            password_help: { $ref: '#/components/schemas/LocalizedText' }
        world_manifest_url: { type: string, maxLength: 2048, format: uri }
        realtime_url: { type: string, maxLength: 2048, format: uri }
        feature_flags:
          type: object
          additionalProperties: { type: boolean }
        device_profiles:
          type: array
          maxItems: 200
          description: Ép renderer/preset cho thiết bị biết trước có lỗi (PERFORMANCE_BUDGET)
          items: { $ref: '#/components/schemas/DeviceProfile' }
        supported_locales:
          type: array
          maxItems: 8
          items: { $ref: '#/components/schemas/Locale' }
    # ---------- social: friends / clubs (SOCIAL_SYSTEM, ADR-0050, ADR-0054)
    PlayerRelation:
      type: object
      required: [user_id, nickname, created_at]
      properties:
        user_id: { $ref: '#/components/schemas/Uuid' }
        nickname: { type: string, maxLength: 64 }
        avatar_thumbnail_url: { type: string, maxLength: 2048, format: uri }
        created_at: { $ref: '#/components/schemas/Timestamp' }
    FriendCode:
      type: object
      required: [code, expires_at]
      properties:
        code: { type: string, maxLength: 12, pattern: '^[A-Z0-9]{6,12}$' }
        expires_at: { $ref: '#/components/schemas/Timestamp' }
    ClubType:
      type: string
      enum: [study_group, school_club, subject_club, competition_team, interest_group]
    ClubRole:
      type: string
      enum: [owner, officer, member, teacher_supervisor]
    ClubStatus:
      type: string
      enum: [pending_approval, active, locked, archived]
    Club:
      type: object
      required: [club_id, club_type, name, status, member_count, max_members]
      properties:
        club_id: { $ref: '#/components/schemas/Uuid' }
        club_type: { $ref: '#/components/schemas/ClubType' }
        name: { type: string, maxLength: 64 }
        description: { type: string, maxLength: 500 }
        icon_id: { type: string, maxLength: 64 }
        subject_id: { $ref: '#/components/schemas/Uuid' }
        school_id: { $ref: '#/components/schemas/Uuid' }
        owner_id: { $ref: '#/components/schemas/Uuid' }
        status: { $ref: '#/components/schemas/ClubStatus' }
        member_count: { type: integer, minimum: 0 }
        max_members: { type: integer, minimum: 2, maximum: 200 }
        my_role: { $ref: '#/components/schemas/ClubRole' }
        chat_channel_id: { $ref: '#/components/schemas/Uuid' }
        version: { type: integer }
        created_at: { $ref: '#/components/schemas/Timestamp' }
    ClubCreate:
      type: object
      required: [club_type, name]
      properties:
        club_type: { $ref: '#/components/schemas/ClubType' }
        name: { type: string, minLength: 2, maxLength: 64 }
        description: { type: string, maxLength: 500 }
        icon_id: { type: string, maxLength: 64 }
        subject_id: { $ref: '#/components/schemas/Uuid' }

        height: { type: integer }
        duration_ms: { type: integer }
        sha256: { type: string, maxLength: 64 }
        status: { $ref: '#/components/schemas/MediaStatus' }
        reject_reason: { type: string, maxLength: 255 }
        alt_text: { type: string, maxLength: 500 }
        license: { type: string, maxLength: 64 }
        variants:
          type: array
          maxItems: 32
          items:
            type: object
            required: [variant, url]
            properties:
              variant: { type: string, maxLength: 64 }
              url: { type: string, format: uri, maxLength: 2048 }
              size_bytes: { type: integer, format: int64 }
        used_in:
          type: array
          maxItems: 500
          items:
            type: object
            properties:
              item_type: { type: string, maxLength: 64 }
              item_id: { $ref: '#/components/schemas/Uuid' }
              version: { type: integer }
        created_at: { $ref: '#/components/schemas/Timestamp' }
    SisConnectionSchool:
      type: object
      required: [sis_connection_id, school_id, active]

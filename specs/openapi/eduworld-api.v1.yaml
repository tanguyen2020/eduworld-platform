      required: [response]
      properties:
        kind: { type: string, enum: [question, cue_answer, branch_choice, simulation_question], default: question, description: 'Vắng mặt = question; exam (PUT /exams/attempts/{attempt_id}/answers/{position}) chỉ dùng question' }

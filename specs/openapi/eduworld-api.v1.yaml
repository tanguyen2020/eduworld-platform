      properties:
        platform: { type: string, maxLength: 32 }
        client_version: { type: string, maxLength: 64 }
        device_tier: { $ref: '#/components/schemas/DeviceTier' }
        preset: { $ref: '#/components/schemas/QualityPreset' }
        renderer: { $ref: '#/components/schemas/RendererKind' }
        locale: { $ref: '#/components/schemas/Locale' }
        events:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/TelemetryEvent' }
    ContentManifest:
      type: object
      required: [tenant_id, manifest_version, etag, items]
      description: Manifest nội dung theo tenant (ADR-0043). Snapshot bất biến theo (item_id, version); client cache theo khóa có version
      properties:
        tenant_id: { $ref: '#/components/schemas/Uuid' }
        manifest_version: { type: integer, format: int64 }
        etag: { type: string, maxLength: 128 }
        generated_at: { $ref: '#/components/schemas/Timestamp' }
        min_client_version: { type: string, maxLength: 64 }
        items:
          type: array
          maxItems: 20000
          items: { $ref: '#/components/schemas/ContentManifestItem' }
        bundles:
          type: array
          maxItems: 500
          items: { $ref: '#/components/schemas/ContentBundle' }
        areas:
          type: array
          maxItems: 500
          items:
            type: object
            required: [area_id, bundle_id]
            properties:
              area_id: { type: string, maxLength: 128 }
              scene_ref: { type: string, maxLength: 512 }
              bundle_id: { type: string, maxLength: 128 }
    PublishRequest:
      type: object
      properties:
        publish_at:
          description: Hẹn giờ xuất bản (UTC); bỏ trống = xuất bản ngay
          $ref: '#/components/schemas/Timestamp'
        change_note: { type: string, maxLength: 500 }
    RollbackRequest:
      type: object
      required: [to_version, reason]
      properties:
        to_version:
          type: integer
          minimum: 1
          description: Số version đã publish của chính item (ROLLBACK_TARGET_INVALID nếu không hợp lệ)
        reason: { type: string, minLength: 1, maxLength: 500 }
    ReasonRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }
    ContentRelease:
      type: object
      required: [release_id, item_type, item_id, action, released_by, released_at]
      properties:
        release_id: { $ref: '#/components/schemas/Uuid' }
        item_type: { type: string, maxLength: 64 }
        item_id: { $ref: '#/components/schemas/Uuid' }
        action: { type: string, enum: [publish, rollback, unpublish] }
        from_version: { type: integer, minimum: 1 }
        to_version: { type: integer, minimum: 1 }
        reason: { type: string, maxLength: 500 }
        scheduled_for: { $ref: '#/components/schemas/Timestamp' }
        status: { type: string, enum: [scheduled, applied, cancelled] }
        released_by: { $ref: '#/components/schemas/Uuid' }
        released_at: { $ref: '#/components/schemas/Timestamp' }
    ContentVersionSummary:
      type: object
      required: [version, status]
      properties:
        version: { type: integer, minimum: 1 }
        content_version_id: { $ref: '#/components/schemas/Uuid' }
        status: { $ref: '#/components/schemas/ContentStatus' }
        is_current: { type: boolean, description: 'true nếu là con trỏ release hiện hành' }
        change_note: { type: string, maxLength: 500 }
        author_id: { $ref: '#/components/schemas/Uuid' }
        reviewer_id: { $ref: '#/components/schemas/Uuid' }
        published_by: { $ref: '#/components/schemas/Uuid' }
        published_at: { $ref: '#/components/schemas/Timestamp' }
        publish_at: { $ref: '#/components/schemas/Timestamp' }
        active_pinned_sessions: { type: integer, minimum: 0, description: 'Số lượt chơi/học đang ghim version này (ước lượng)' }
    ContentVersionHistory:
      type: object
      required: [item_id, data, page]
      properties:
        item_id: { $ref: '#/components/schemas/Uuid' }
        current_version: { type: integer, minimum: 1, description: 'Version học sinh nhận khi bắt đầu lượt mới; vắng = chưa publish/đã gỡ' }
        data:
          type: array
          items: { $ref: '#/components/schemas/ContentVersionSummary' }
        page: { $ref: '#/components/schemas/PageInfo' }
    ContentVersionDiff:
      type: object
      required: [from_version, to_version, changes]
      properties:
        from_version: { type: integer, minimum: 1 }
        to_version: { type: integer, minimum: 1 }
        changes:
          type: array
          maxItems: 2000
          items:
            type: object
            required: [path, op]
            properties:
              path: { type: string, maxLength: 512, description: 'JSON pointer của field/khối' }
              op: { type: string, enum: [added, removed, changed] }
              before: { description: 'Giá trị cũ (answer_key chỉ trả khi có quyền review)' }
              after: { description: 'Giá trị mới' }
    ContentManifestItem:
      type: object
      required: [item_type, item_id, version_id, version_no, sha256]
      properties:
        item_type: { type: string, maxLength: 64 }
        item_id: { $ref: '#/components/schemas/Uuid' }
        version_id: { $ref: '#/components/schemas/Uuid' }
        version_no: { type: integer, minimum: 1 }
        snapshot_url: { type: string, format: uri, maxLength: 2048, description: 'Vắng với nội dung chỉ phục vụ qua API (câu hỏi đề, nội dung nhạy cảm)' }
        sha256: { type: string, maxLength: 64 }
    ContentBundle:
      type: object
      required: [bundle_id, version, url, sha256]
      properties:
        bundle_id: { type: string, maxLength: 128 }
        version: { type: integer, minimum: 1 }
        url: { type: string, format: uri, maxLength: 2048 }
        sha256: { type: string, maxLength: 64 }
        size_bytes: { type: integer, format: int64 }
        platforms:
          type: array
          items: { type: string, enum: [windows, android, ios, web, macos, linux] }
        requires_client: { type: string, maxLength: 64 }
    LevelSession:
      type: object
      required: [level_session_id, level_id, level_version, status, content_versions]

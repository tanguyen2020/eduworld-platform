openapi: 3.1.0
info:
  title: EduWorld API
  version: 1.0.0-draft.1
  summary: REST API của nền tảng EduWorld (Godot game client, CMS/LMS web).
  description: |
    Contract-first (ADR-0010). Tài liệu quy ước: docs/07-backend/API_DESIGN.md.

    - Xác thực: `Authorization: Bearer <Keycloak access token>` (audience `eduworld-api`, ADR-0008). Game đăng nhập bằng form trong game
      qua `POST /auth/game/login` (username + mật khẩu, client confidential `eduworld-game-backend`, token `azp = eduworld-game-backend`;
      không tự đăng nhập, token chỉ trong RAM — ADR-0063, ADR-0064, ADR-0068, ADR-0069). Portal đăng nhập trang Keycloak riêng
      (`eduworld-portal`, học sinh bị chặn `PORTAL_ACCESS_STAFF_ONLY` — ADR-0066). Không chọn tenant trước đăng nhập.
    - Tenant: header `X-Tenant-Id` (UUID) **bắt buộc** ở mọi operation tenant-scoped (tham số `TenantIdHeader`), luôn kiểm tra chéo với
      token + membership (ADR-0065). Không gửi: `/auth/game/login`, `/auth/game/tenant:select`, `/auth/session`, `/me/tenants`,
      `/game/client-config`, health. `/admin/*`: bắt buộc ở thao tác ghi dữ liệu của một tenant (tenant đích), vắng mặt ở thao tác đọc
      liên tenant (dùng `tenant_ids`); `/cms/*`, `/me/permissions`, `/catalog/countries|provinces`: tùy chọn với role platform
      (`TenantIdHeaderOptional`). `/game-admin/*`, `/game-media*` là dữ liệu platform, không gửi header.
    - Dashboard: `from`/`to` bắt buộc (≤ 730 ngày), `grain` do server quyết định, phản hồi có `grain`, `data_as_of`, `is_partial` (ADR-0062).
    - Lỗi: RFC 9457 `application/problem+json` với `code` ổn định.
    - Danh sách: cursor pagination (`limit`, `cursor`).
    - Thao tác quan trọng: header `Idempotency-Key` bắt buộc.
    - JSON `snake_case`, ID UUIDv7, thời gian ISO-8601 UTC.
    - Server-authoritative: client không bao giờ gửi điểm/kết quả; render payload không chứa đáp án (ADR-0016).

    Realtime (WebSocket) được đặc tả riêng trong specs/asyncapi/.
  contact:
    name: EduWorld Backend Team
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://api.{env}.eduworld.example/api/v1
    description: |
      Gateway public (APISIX). Domain thật [TBD — OQ-10]; `eduworld.example` là placeholder.
      Local dev: `http://localhost:9080/api/v1` (APISIX trong docker compose, xem docs/11-operations/LOCAL_DEVELOPMENT.md) —
      không khai báo thành server ở đây để spec không trỏ tới localhost.
    variables:
      env:
        default: dev
        enum: [dev, staging]
security:
  - keycloakBearer: []
tags:
  - name: auth
    description: Đăng nhập game qua backend (ADR-0068), bootstrap phiên portal, đăng xuất
  - name: students
    description: Hồ sơ học sinh (tối giản cho học sinh, đầy đủ hơn cho giáo viên trong scope)
  - name: game
    description: Game profile, game session, realtime ticket, quest, mini-game, inventory
  - name: learning
    description: Curriculum, lesson, progress, activity & attempt (một họ API duy nhất `/learning/activity-attempts` — ADR-0059), bài được giao cho học sinh
  - name: exams
    description: Exam session, làm đề, nộp bài, kết quả
  - name: multiplayer
    description: Party, invitation, room
  - name: competition
    description: Matchmaking, match, rating, tournament
  - name: leaderboards
    description: Bảng xếp hạng theo scope × period (chỉ nickname/avatar)
  - name: chat
    description: Channel, tin nhắn (REST fallback), báo cáo, kiểm duyệt, chat policy
  - name: social
    description: Bạn bè, lời mời kết bạn, chặn, nhóm học tập
  - name: notifications
    description: Thông báo trong game/CMS
  - name: schools
    description: "Quản trị trường: settings, lớp, học sinh, phân quyền"
  - name: me
    description: Tenant và quyền hiệu lực của người dùng — dựng bộ chọn tenant và menu web (không phải nguồn quyết định quyền)
  - name: catalog
    description: Danh mục quốc gia, tỉnh/thành (34 đơn vị hiện hành của Việt Nam), trường — ADR-0060
  - name: cms
    description: "Learning Management — nội dung học tập (curriculum, question bank, bài học, blueprint, workflow) phạm vi trường/organization/platform. Không chứa cấu hình game (ADR-0027)"
  - name: lms
    description: Khóa học, lộ trình, giao bài, thử thách từ template platform, catalog hoạt động game đã publish (chỉ đọc), dashboard giáo viên
  - name: sis
    description: INTERNAL — không publish trên public gateway
  - name: admin
    description: "INTERNAL — không publish trên public gateway. Gồm quản lý tenant, gán/clone dữ liệu giữa tenant (ADR-0029), Thùng rác (ADR-0028); chỉ System Admin"
  - name: tenant
    description: "Tự quản trị của tenant (tenant của phiên): cài đặt, trường trong đơn vị, phân quyền, Thùng rác tenant [Proposed]"
  - name: game-admin
    description: "INTERNAL — Game Operations Console & cấu hình thi đấu (Admin Portal workspace A), chỉ role platform qua client eduworld-portal + MFA, chỉ gateway nội bộ (ADR-0027)"

paths:
  # ---------------------------------------------------------------- auth
  /auth/game/login:
    post:
      x-service: identity
      tags: [auth]
      operationId: gameLogin
      summary: Đăng nhập game bằng form trong game (username + password) qua backend — ADR-0068
      description: |
        Public, **không** cần token và `X-Tenant-Id`. Một người một tài khoản SSO; username/email duy nhất trên Keycloak (ADR-0069).
        Thứ tự xử lý của identity-service:

        1. **Xác thực SSO:** gọi token endpoint Keycloak bằng client confidential `eduworld-game-backend` (Direct Access Grants;
           secret chỉ ở identity-service). Sai username hoặc mật khẩu (kể cả tài khoản đang bị khóa tạm do brute-force) →
           `401 INVALID_CREDENTIALS` với thông điệp chung. Chỉ realm role `student` (khác → `403 GAME_ACCESS_STUDENT_ONLY`).
        2. **Kiểm tra tài khoản theo `keycloak_sub`** (ADR-0063): `user_type` học sinh, các tenant còn hiệu lực, enrollment,
           đồng bộ hồ sơ SIS khi đăng nhập (ADR-0061).
        3. **Quyết định tenant:** **1 tenant** → `200` vào thẳng; **nhiều tenant** → `403 TENANT_NOT_SELECTED` kèm `choices[]` +
           `login_ticket` (dùng một lần, 2 phút) → gọi `/auth/game/tenant:select`, không nhập lại mật khẩu; **chỉ tenant chung** →
           vào tenant chung; **không có tenant hợp lệ** (không thuộc tenant chung, không có membership SIS) → `403 ACCOUNT_NOT_PROVISIONED`
           (không JIT).
        4. Một thiết bị (ADR-0031) và tạo game session trong cùng lời gọi.

        Mỗi lần mở game phải đăng nhập lại; token chỉ giữ trong RAM (ADR-0064).

        Body **không bao giờ log** (APISIX, service, tracing). Rate limit 10 lần/phút theo thiết bị và theo username; hàng chờ
        đăng nhập toàn cục (ADR-0045) → `429 LOGIN_QUEUE_BUSY`. Không dùng `Idempotency-Key` (không lưu token vào kho idempotency).
      security: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GameLoginRequest' }
      responses:
        '200':
          description: Đăng nhập thành công — token + PlayerBootstrap
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
            Content-Language: { $ref: '#/components/headers/ContentLanguage' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GameLoginResponse' }
        '401':
          description: INVALID_CREDENTIALS — Keycloak từ chối username/mật khẩu (không tồn tại, sai mật khẩu hoặc đang bị khóa tạm; một thông điệp chung)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: TENANT_NOT_SELECTED (học sinh thuộc nhiều tenant — kèm choices + login_ticket), GAME_ACCESS_STUDENT_ONLY, ACCOUNT_NOT_PROVISIONED, ACCOUNT_LOCKED, ACCOUNT_DEACTIVATED, NO_ACTIVE_ENROLLMENT, TENANT_ACCESS_DISABLED, ACCESS_OUTSIDE_ALLOWED_HOURS
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/GameLoginProblem' }
        '409':
          description: ACTIVE_SESSION_ON_OTHER_DEVICE — gọi lại với `takeover = true` sau khi học sinh xác nhận
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/GameLoginProblem' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '426':
          description: CLIENT_VERSION_UNSUPPORTED
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ClientVersionProblem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /auth/game/tenant:select:
    post:
      x-service: identity
      tags: [auth]
      operationId: selectGameLoginTenant
      summary: Chọn tenant sau đăng nhập game khi học sinh thuộc nhiều tenant (dùng login_ticket, không nhập lại mật khẩu)
      description: |
        `login_ticket` lưu Valkey, **dùng một lần, TTL 2 phút**, gắn `device_id`. Hết hạn/đã dùng/sai thiết bị → `401 LOGIN_TICKET_INVALID`
        (game quay về form đăng nhập). `tenant_id` không thuộc `choices` → `403 TENANT_MISMATCH`. Phản hồi giống `/auth/game/login`.
      security: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GameTenantSelectRequest' }
      responses:
        '200':
          description: Đã chọn tenant — token + PlayerBootstrap
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GameLoginResponse' }
        '401':
          description: LOGIN_TICKET_INVALID
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: TENANT_MISMATCH, TENANT_ACCESS_DISABLED, NO_ACTIVE_ENROLLMENT, ACCESS_OUTSIDE_ALLOWED_HOURS
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/GameLoginProblem' }
        '409':
          description: ACTIVE_SESSION_ON_OTHER_DEVICE
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/GameLoginProblem' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/game/token:refresh:
    post:
      x-service: identity
      tags: [auth]
      operationId: refreshGameToken
      summary: Làm mới access token game bằng refresh token trong RAM (qua backend vì refresh token thuộc client confidential)
      description: |
        Refresh token hết hạn (idle 30 phút / tối đa 10 giờ, ADR-0064) hoặc bị thu hồi → `401 UNAUTHENTICATED`, game về form đăng nhập.
        Header `X-Tenant-Id` bắt buộc; backend kiểm tra membership còn hiệu lực (ADR-0065).
      security: []
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GameTokenRefreshRequest' }
      responses:
        '200':
          description: Token mới
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GameTokenSet' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/game/logout:
    post:
      x-service: identity
      tags: [auth]
      operationId: gameLogout
      summary: Thoát game — thu hồi refresh token + phiên Keycloak, đóng game session, thu hồi realtime ticket
      description: Gọi khi thoát game hoặc bấm Đăng xuất. Idempotent (`204` cả khi token đã hết hạn).
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GameLogoutRequest' }
      responses:
        '204': { description: Đã đăng xuất }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /auth/session:
    post:
      x-service: identity
      tags: [auth]
      operationId: createAuthSession
      summary: Bootstrap sau đăng nhập portal (Keycloak trên trình duyệt) — map (iss, sub) → User, không JIT
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Bootstrap thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerBootstrap'
          headers:
            Content-Language: { $ref: '#/components/headers/ContentLanguage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Problem' }
      description: |
        Dùng cho Admin Portal và client đăng nhập qua trình duyệt; game dùng `/auth/game/login` (ADR-0068). Không cần `X-Tenant-Id`.
        Không có JIT provisioning (ADR-0063): tài khoản không có membership tenant chung/SIS hoặc không còn UserRole portal → `403 ACCOUNT_NOT_PROVISIONED`
        / `403 PORTAL_ACCESS_STAFF_ONLY`. Nhân sự thuộc nhiều tenant chọn tenant sau đăng nhập qua `GET /me/tenants` (ADR-0067, ADR-0069).
  /auth/me:
    get:
      x-service: identity
      tags: [auth]
      operationId: getMe
      summary: Principal hiện tại (roles, scopes)
      parameters:
        - { $ref: '#/components/parameters/TenantIdHeader' }
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Principal'
          headers:
            Content-Language: { $ref: '#/components/headers/ContentLanguage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /auth/logout:
    post:
      x-service: identity
      tags: [auth]
      operationId: logout
      summary: Đóng game session, thu hồi realtime ticket (client tự gọi Keycloak end-session)
      parameters:
        - { $ref: '#/components/parameters/TenantIdHeader' }
      responses:
        '204': { description: Đã đăng xuất }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /auth/sessions:revoke-all:
    post:
      x-service: identity
      tags: [auth]
      operationId: revokeAllSessions
      summary: Đăng xuất trên mọi thiết bị (thu hồi Keycloak session + kết thúc game session, ADR-0031)
      parameters:
        - { $ref: '#/components/parameters/TenantIdHeader' }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204': { description: Đã thu hồi }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  # ---------------------------------------------------------------- me
  /me/permissions:
    get:
      x-service: identity
      tags: [me]
      operationId: getMyPermissions
      summary: Permission hiệu lực của người dùng trong một tenant (dựng menu CMS)
      description: |
        Trả về role và permission đã giải theo scope. Role tenant không bao giờ chứa permission
        `game.*`, `competition.config.*`, `platform.*` (ADR-0027). Backend vẫn kiểm tra quyền ở mọi endpoint.
      parameters:
        - { $ref: '#/components/parameters/TenantIdHeaderOptional' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionSet'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/tenants:
    get:
      x-service: identity
      tags: [me]
      operationId: listMyTenants
      summary: Tenant của người dùng sau đăng nhập (không cần X-Tenant-Id) — chọn tenant sau đăng nhập portal
      description: |
        Danh sách tenant mà người dùng có membership và (với portal) UserRole portal còn hiệu lực, cờ `has_platform_role`.
        Portal: 1 tenant → vào thẳng; nhiều tenant → màn chọn tenant sau đăng nhập và bộ chọn trên topbar; rỗng và không có role
        platform → `403 PORTAL_ACCESS_STAFF_ONLY` (ADR-0066, ADR-0067). Token game nhận đúng một tenant của phiên.
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyTenantsResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------------------------------------------------------------- catalog (ADR-0060)
  /catalog/countries:
    get:
      x-service: identity
      tags: [catalog]
      operationId: listCountries
      summary: Danh mục quốc gia đang dùng (song ngữ theo Accept-Language)
      parameters:
        - { $ref: '#/components/parameters/TenantIdHeaderOptional' }
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 300
                    items: { $ref: '#/components/schemas/Country' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /catalog/provinces:
    get:
      x-service: identity
      tags: [catalog]
      operationId: listProvinces
      summary: Danh mục tỉnh/thành theo quốc gia (mặc định 34 đơn vị hiện hành của Việt Nam)
      parameters:
        - { $ref: '#/components/parameters/TenantIdHeaderOptional' }
        - name: country
          in: query
          required: false
          schema: { type: string, pattern: '^[A-Z]{2}$', maxLength: 2, default: VN }
        - name: status
          in: query
          required: false
          description: '`all`/`inactive` chỉ cho System Admin (`platform.catalog.write`)'
          schema: { type: string, enum: [active, inactive, all], default: active }
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 500
                    items: { $ref: '#/components/schemas/Province' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /catalog/schools:
    get:
      x-service: identity
      tags: [catalog]
      operationId: listCatalogSchools
      summary: Danh mục trường (người dùng tenant thấy trường trong tenant; System Admin lọc theo tenant_ids)
      parameters:
        - { $ref: '#/components/parameters/TenantIdHeader' }
        - name: province
          in: query
          required: false
          description: Mã tỉnh/thành (`code`, vd. `vn.ha-noi`)
          schema: { type: string, maxLength: 64 }
        - name: school_level
          in: query
          required: false
          schema: { $ref: '#/components/schemas/SchoolLevel' }
        - name: q
          in: query
          required: false
          description: Tìm theo tên/mã trường (prefix, không phân biệt dấu)
          schema: { type: string, minLength: 2, maxLength: 100 }
        - $ref: '#/components/parameters/TenantIds'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SchoolPage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------------------------------------------------------------- students
  /students/me:
    get:
      x-service: identity
      tags: [students]
      operationId: getMyStudentProfile
      summary: Hồ sơ học sinh tối giản của mình
      parameters:
        - { $ref: '#/components/parameters/TenantIdHeader' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentSummary'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /students/{student_id}:
    get:
      x-service: identity
      tags: [students]
      operationId: getStudentProfile
      summary: Hồ sơ học sinh dạng đầy đủ cho giáo viên (lớp được phân công) / quản trị trường
      parameters:
        - { $ref: '#/components/parameters/TenantIdHeader' }
        - $ref: '#/components/parameters/StudentId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudentSummary' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /students/{student_id}/progress:
    get:
      x-service: learning
      tags: [students]
      operationId: getStudentProgress
      summary: Tiến độ & mastery của một học sinh (học sinh xem của mình, giáo viên lớp được phân công, quản trị trường)
      parameters:
        - { $ref: '#/components/parameters/TenantIdHeader' }
        - $ref: '#/components/parameters/StudentId'
        - $ref: '#/components/parameters/SubjectIdQuery'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LearningProgress' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- game
  /game/profile:
    get:
      x-service: game
      tags: [game]
      operationId: getGameProfile
      summary: Game profile của mình
      parameters:
        - { $ref: '#/components/parameters/TenantIdHeader' }
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameProfile'
          headers:
            Content-Language: { $ref: '#/components/headers/ContentLanguage' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      x-service: game
      tags: [game]
      operationId: updateGameProfile
      summary: Đổi nickname (từ danh sách đã duyệt) và settings
      parameters:
        - { $ref: '#/components/parameters/TenantIdHeader' }
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/GameProfileUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameProfile'
          headers:
            Content-Language: { $ref: '#/components/headers/ContentLanguage' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        default: { $ref: '#/components/responses/Problem' }
  /game/profile/nickname-suggestions:
    get:
      x-service: game
      tags: [game]
      operationId: suggestNicknames
      summary: Gợi ý nickname tự sinh chưa ai dùng trong tenant, theo ngôn ngữ đang chọn (không cho gõ tự do)
      parameters:
        - { $ref: '#/components/parameters/TenantIdHeader' }
        - name: count
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 10, default: 6 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    maxItems: 10
                    items: { $ref: '#/components/schemas/NicknameSuggestion' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /game/sessions:
    post:
      x-service: game
      tags: [game]
      operationId: createGameSession
      summary: Tạo game session — chỉ học sinh, một thiết bị mỗi tài khoản (ADR-0031)
      description: |
        Chỉ User `student` với token game `azp = eduworld-game-backend` (cấp qua `/auth/game/login`, ADR-0068; khác → 403 GAME_ACCESS_STUDENT_ONLY).
        Ghi `game.login_events` và cập nhật `last_login_at`. Nếu học sinh đang có session active trên
        thiết bị khác → 409 ACTIVE_SESSION_ON_OTHER_DEVICE kèm `other_device`; client hỏi xác nhận rồi gọi
        lại với `takeover: true` để kết thúc session cũ (thiết bị cũ nhận `session.session.replaced`).
      parameters:
        - { $ref: '#/components/parameters/TenantIdHeader' }
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/DeviceIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameSessionCreate'
      responses:
        '201':
          description: Đã tạo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameSession'
          headers:
            Content-Language: { $ref: '#/components/headers/ContentLanguage' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: ACTIVE_SESSION_ON_OTHER_DEVICE — tài khoản đang được dùng trên thiết bị khác
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ActiveSessionConflict' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        default: { $ref: '#/components/responses/Problem' }
  /game/sessions/{game_session_id}:end:
    post:
      x-service: game
      tags: [game]
      operationId: endGameSession
      summary: Kết thúc game session (đăng xuất hoặc đóng game)
      parameters:
        - { $ref: '#/components/parameters/TenantIdHeader' }
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/GameSessionId'
      responses:
        '204': { description: Đã kết thúc }
        '404': { $ref: '#/components/responses/NotFound' }
  /game/sessions/{game_session_id}:heartbeat:
    post:
      x-service: game
      tags: [game]
      operationId: heartbeatGameSession
      summary: Giữ game session active khi không có WebSocket (timeout 45 giây)
      parameters:
        - { $ref: '#/components/parameters/TenantIdHeader' }
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/GameSessionId'
        - $ref: '#/components/parameters/DeviceIdHeader'
      responses:
        '204': { description: OK }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Session đã bị thay bởi thiết bị khác hoặc đã kết thúc
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /game/sessions/{game_session_id}/realtime-tickets:
    post:
      x-service: game
      tags: [game]
      operationId: createRealtimeTicket
      summary: Cấp ticket WebSocket dùng 1 lần, TTL 60 giây (ADR-0008)
      parameters:
        - { $ref: '#/components/parameters/TenantIdHeader' }
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/GameSessionId'
      responses:
        '201':
          description: Ticket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RealtimeTicket'
          headers:
            Content-Language: { $ref: '#/components/headers/ContentLanguage' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /game/content-manifest:
    get:
      x-service: game
      tags: [game]
      operationId: getContentManifest
      summary: Content manifest của tenant (item → version hiện hành, snapshot URL, bundle) — tải khi khởi động và khi vào màn mới (ADR-0043)
      parameters:
        - { $ref: '#/components/parameters/TenantIdHeader' }
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/IfNoneMatch'
        - name: client_version
          in: query
          schema: { type: string, maxLength: 64 }
      responses:
        '200':
          description: OK
          headers:
            ETag:
              schema: { type: string, maxLength: 128 }
            Content-Language: { $ref: '#/components/headers/ContentLanguage' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentManifest'
        '304': { $ref: '#/components/responses/NotModified' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /game/client-config:
    get:
      x-service: game
      tags: [game]
      operationId: getClientConfig
      summary: Cấu hình client công khai (min_client_version, manifest URL, cờ bảo trì) — không cần đăng nhập
      security: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'

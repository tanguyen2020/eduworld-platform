        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientConfig'
          headers:
            Content-Language: { $ref: '#/components/headers/ContentLanguage' }
        '429': { $ref: '#/components/responses/RateLimited' }

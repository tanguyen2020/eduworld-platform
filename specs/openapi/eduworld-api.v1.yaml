        rewards_granted: { type: integer, minimum: 0 }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
    DeviceTier: { type: string, enum: [minimum, mid, high], description: 'Hạng thiết bị (ADR-0057, PERFORMANCE_BUDGET)' }
    QualityPreset: { type: string, enum: [low, medium, high] }
    RendererKind: { type: string, enum: [mobile, compatibility, forward_plus] }
    GameMetricSeries:
      type: object
      required: [metric_code, granularity, points]
      properties:
        metric_code: { type: string, maxLength: 64, description: Mã chỉ số — định nghĩa tại GAME_ANALYTICS §4 }
        unit: { type: string, maxLength: 32 }
        granularity: { $ref: '#/components/schemas/DashboardGrain' }
        points:
          type: array
          maxItems: 400
          items:
            type: object
            required: [period_start]
            properties:
              period_start: { type: string, format: date }
              value: { type: [number, 'null'] }
              suppressed: { type: boolean, description: true khi ô < 5 học sinh bị ẩn }
    GameMetricsResponse:
      type: object
      required: [data, grain, data_as_of, is_partial]
      properties:
        data:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/GameMetricSeries' }
        generated_at: { $ref: '#/components/schemas/Timestamp' }
        suppression_threshold: { type: integer, minimum: 1 }
        grain: { $ref: '#/components/schemas/DashboardGrain' }
        data_as_of:
          $ref: '#/components/schemas/Timestamp'
          description: "`computed_at` cũ nhất trong kết quả (DASHBOARD_DATA §8)"
        is_partial: { type: boolean, description: true nếu có dòng chưa chốt (hôm nay) }
    RetentionMatrix:
      type: object
      required: [cohorts, grain, data_as_of, is_partial]
      properties:
        cohorts:
          type: array
          maxItems: 400
          items:
            type: object
            required: [cohort_date, cohort_size]
            properties:
              cohort_date: { type: string, format: date }
              cohort_size: { type: [integer, 'null'] }
              retention:
                type: array
                maxItems: 60
                items:
                  type: object
                  properties:
                    day_offset: { type: integer, minimum: 0 }
                    rate: { type: [number, 'null'] }
        grain: { $ref: '#/components/schemas/DashboardGrain' }
        data_as_of:
          $ref: '#/components/schemas/Timestamp'
          description: "`computed_at` cũ nhất trong kết quả (DASHBOARD_DATA §8)"
        is_partial: { type: boolean, description: true nếu có dòng chưa chốt (hôm nay) }
    FunnelReport:
      type: object
      required: [funnel_code, steps, grain, data_as_of, is_partial]
      properties:
        funnel_code: { type: string, maxLength: 64 }
        steps:
          type: array
          maxItems: 50
          items:
            type: object
            required: [step_code]
            properties:
              step_code: { type: string, maxLength: 64 }
              count: { type: [integer, 'null'] }
              conversion_rate: { type: [number, 'null'] }
        grain: { $ref: '#/components/schemas/DashboardGrain' }
        data_as_of:
          $ref: '#/components/schemas/Timestamp'
          description: "`computed_at` cũ nhất trong kết quả (DASHBOARD_DATA §8)"
        is_partial: { type: boolean, description: true nếu có dòng chưa chốt (hôm nay) }
    ContentStatsItem:
      type: object
      required: [kind, content_id]
      properties:
        kind: { type: string, enum: [quest, challenge, boss] }
        content_id: { $ref: '#/components/schemas/Uuid' }
        title: { $ref: '#/components/schemas/LocalizedName' }
        starts: { type: integer }
        completions: { type: integer }
        completion_rate: { type: [number, 'null'] }
        abandon_rate: { type: [number, 'null'] }
        success_rate: { type: [number, 'null'] }
        median_duration_ms: { type: [integer, 'null'] }
        flagged_for_review: { type: boolean }
    PerformanceReportRow:
      type: object
      required: [platform, device_tier]
      properties:
        platform: { type: string, maxLength: 32 }
        device_tier: { $ref: '#/components/schemas/DeviceTier' }
        preset: { $ref: '#/components/schemas/QualityPreset' }
        renderer: { $ref: '#/components/schemas/RendererKind' }
        client_version: { type: string, maxLength: 64 }
        sessions: { type: integer }
        fps_p50: { type: [number, 'null'] }
        fps_p10: { type: [number, 'null'] }
        fps_budget_pass_rate: { type: [number, 'null'] }
        load_time_p50_ms: { type: [integer, 'null'] }
        crash_free_sessions: { type: [number, 'null'] }
    AnalyticsExportRequest:
      type: object
      required: [report]
      properties:
        report: { type: string, enum: [metrics, retention, funnel, content_stats, performance] }
        params: { type: object, maxProperties: 30, additionalProperties: true }
        format: { type: string, enum: [csv], default: csv }
    AnalyticsExportJob:
      type: object
      required: [job_id, status]
      properties:
        job_id: { $ref: '#/components/schemas/Uuid' }
        status: { type: string, enum: [queued, running, succeeded, failed] }
        download_url: { type: string, maxLength: 2048, format: uri }
        expires_at: { $ref: '#/components/schemas/Timestamp' }
    TenantGameSummary:
      type: object
      required: [from, to, grain, data_as_of, is_partial]
      description: Báo cáo tổng hợp tenant; ô < 5 học sinh bị ẩn (null)
      properties:
        tenant_id: { $ref: '#/components/schemas/Uuid' }
        from: { type: string, format: date }
        to: { type: string, format: date }
        active_students: { type: [integer, 'null'] }
        dau_avg: { type: [number, 'null'] }
        retention_d7: { type: [number, 'null'] }
        quest_completion_rate: { type: [number, 'null'] }
        event_participation_rate: { type: [number, 'null'] }
        sessions_over_reminder_rate: { type: [number, 'null'] }
        by_school:
          type: array
          maxItems: 200
          items:
            type: object
            properties:
              school_id: { $ref: '#/components/schemas/Uuid' }
              active_students: { type: [integer, 'null'] }
              quest_completion_rate: { type: [number, 'null'] }
        suppressed_cells: { type: integer, minimum: 0 }
        grain: { $ref: '#/components/schemas/DashboardGrain' }
        data_as_of:
          $ref: '#/components/schemas/Timestamp'
          description: "`computed_at` cũ nhất trong kết quả (DASHBOARD_DATA §8)"
        is_partial: { type: boolean, description: true nếu có dòng chưa chốt (hôm nay) }
    TelemetryEvent:
      type: object
      required: [type, occurred_at]
      description: Không PII (GAME_ANALYTICS §3.2). Thuộc tính dùng theo type.
      properties:
        type:
          type: string
          enum: [screen_view, tutorial_step, perf_sample, load_time, client_error, crash, network_sample]
        client_event_id: { $ref: '#/components/schemas/Uuid', description: Khử trùng phía server }
        occurred_at: { $ref: '#/components/schemas/Timestamp' }
        screen_code: { type: string, maxLength: 64 }
        duration_ms: { type: integer, minimum: 0 }
        step_code: { type: string, maxLength: 64 }
        result: { type: string, enum: [done, skipped] }
        scene_code: { type: string, maxLength: 64 }
        fps_p50: { type: number }
        fps_p10: { type: number }
        frame_ms_p95: { type: number }
        render_scale: { type: number, minimum: 0.3, maximum: 1 }
        mem_mb: { type: integer, minimum: 0 }
        kind: { type: string, enum: [cold_start, area_transition, activity_open] }
        ms: { type: integer, minimum: 0 }
        error_code: { type: string, maxLength: 64 }
        fatal: { type: boolean }
        crash_signature: { type: string, maxLength: 256 }
        rtt_p50_ms: { type: integer, minimum: 0 }
        rtt_p95_ms: { type: integer, minimum: 0 }
        reconnects: { type: integer, minimum: 0 }
    NicknameSuggestion:
      type: object
      required: [nickname_option_id, nickname]
      properties:
        nickname_option_id: { $ref: '#/components/schemas/Uuid' }
        nickname: { type: string, maxLength: 24 }
    MyAssignment:
      type: object
      required: [assignment_id, title, status]
      properties:
        assignment_id: { $ref: '#/components/schemas/Uuid' }
        title: { type: string, maxLength: 255 }
        subject_id: { $ref: '#/components/schemas/Uuid' }
        content_kind: { type: string, enum: [activity, question_set, assessment, quest, lesson] }
        content_ref: { $ref: '#/components/schemas/Uuid' }
        open_at: { $ref: '#/components/schemas/Timestamp' }
        due_at: { $ref: '#/components/schemas/Timestamp' }
        status: { type: string, enum: [not_started, in_progress, submitted, pending_review, graded, overdue] }
        attempt_id: { $ref: '#/components/schemas/Uuid' }
        attempts_left: { type: [integer, 'null'] }
    DeviceProfile:
      type: object
      required: [match, renderer, preset]
      properties:
        match:
          type: object
          properties:
            platform: { type: string, maxLength: 32 }
            gpu_vendor: { type: string, maxLength: 64 }
            gpu_model_pattern: { type: string, maxLength: 255 }
            device_model_pattern: { type: string, maxLength: 255 }
            os_version_max: { type: string, maxLength: 32 }
        renderer: { $ref: '#/components/schemas/RendererKind' }
        preset: { $ref: '#/components/schemas/QualityPreset' }
        reason: { type: string, maxLength: 255 }

    # ---------- SPEC-3: đăng nhập game, RBAC, danh mục, dashboard, learning (ADR-0060..0069)
    GameLoginRequest:
      type: object
      required: [username, password, device_id, client_version, platform]
      additionalProperties: false
      description: Body của `POST /auth/game/login`. **Không bao giờ log** (APISIX, service, tracing); mật khẩu chỉ chuyển tiếp tới Keycloak.
      properties:
        username: { type: string, minLength: 1, maxLength: 128, description: 'So sánh không phân biệt hoa thường sau chuẩn hóa trim/NFC; duy nhất trên SSO (ADR-0069)' }
        password: { type: string, format: password, minLength: 1, maxLength: 256, writeOnly: true }
        device_id: { $ref: '#/components/schemas/Uuid', description: UUID của bản cài game (giống header X-Device-Id) }
        client_version: { type: string, maxLength: 32, pattern: '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]{1,20})?$' }
        platform: { type: string, enum: [windows, macos, linux, android, ios, web] }
        locale: { $ref: '#/components/schemas/Locale' }
        takeover: { type: boolean, default: false, description: 'true sau khi học sinh xác nhận đăng xuất thiết bị khác (ADR-0031)' }
    GameTenantSelectRequest:
      type: object
      required: [login_ticket, tenant_id, device_id]
      additionalProperties: false
      properties:
        login_ticket: { type: string, minLength: 16, maxLength: 128, writeOnly: true }
        tenant_id: { $ref: '#/components/schemas/Uuid' }
        device_id: { $ref: '#/components/schemas/Uuid' }
        takeover: { type: boolean, default: false }
    GameTokenSet:
      type: object
      required: [access_token, refresh_token, token_type, expires_in, refresh_expires_in]
      description: Token Keycloak của học sinh (client `eduworld-game-backend`, `azp = eduworld-game-backend`). Game chỉ giữ trong RAM, không ghi xuống đĩa (ADR-0064).
      properties:
        access_token: { type: string, maxLength: 8192 }
        refresh_token: { type: string, maxLength: 8192 }
        token_type: { type: string, enum: [Bearer] }
        expires_in: { type: integer, minimum: 1, description: Giây (mặc định 300) }
        refresh_expires_in: { type: integer, minimum: 1, description: 'Giây tới khi refresh token hết hạn theo idle (30 phút, tối đa 10 giờ — ADR-0064)' }
    GameLoginResponse:
      type: object
      required: [tokens, bootstrap]
      properties:
        tokens: { $ref: '#/components/schemas/GameTokenSet' }
        bootstrap:
          $ref: '#/components/schemas/PlayerBootstrap'
          description: '`bootstrap.tenant_id` là giá trị header `X-Tenant-Id` của mọi request tiếp theo (ADR-0065)'
        game_session_id: { $ref: '#/components/schemas/Uuid', description: 'Game session đã tạo trong cùng lời gọi (ghi login_events, last_login_at — ADR-0031)' }
    GameTokenRefreshRequest:
      type: object
      required: [refresh_token]
      additionalProperties: false
      properties:
        refresh_token: { type: string, maxLength: 8192, writeOnly: true }
    GameLogoutRequest:
      type: object
      additionalProperties: false
      properties:
        refresh_token: { type: string, maxLength: 8192, writeOnly: true }
    GameLoginTenantChoice:
      type: object
      required: [tenant_id, tenant_type, name]
      properties:
        tenant_id: { $ref: '#/components/schemas/Uuid' }
        tenant_type: { $ref: '#/components/schemas/TenantType' }
        name: { type: string, maxLength: 255 }
        school_name: { type: string, maxLength: 255, description: Trường của học sinh trong tenant đó (để học sinh nhận ra) }
        logo_url: { type: string, maxLength: 2048, format: uri }
    GameLoginProblem:
      description: |
        Problem của `/auth/game/login` và `/auth/game/tenant:select`. Khi `code = TENANT_NOT_SELECTED` có `choices` (các tenant còn
        hiệu lực của học sinh — ADR-0063) + `login_ticket` (dùng một lần, TTL 2 phút, gắn `device_id`); khi `code = ACTIVE_SESSION_ON_OTHER_DEVICE` có `other_device`.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            choices:
              type: array
              minItems: 2
              maxItems: 20
              items: { $ref: '#/components/schemas/GameLoginTenantChoice' }
            login_ticket: { type: string, minLength: 16, maxLength: 128 }
            login_ticket_expires_at: { $ref: '#/components/schemas/Timestamp' }
            other_device:
              type: object
              properties:
                platform: { type: string, maxLength: 32 }
                device_label: { type: string, maxLength: 128 }
                last_seen_at: { $ref: '#/components/schemas/Timestamp' }
    ClientVersionProblem:
      description: '`426 CLIENT_VERSION_UNSUPPORTED` — game hiển thị màn cập nhật'
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [min_client_version]
          properties:
            min_client_version: { type: string, maxLength: 32 }
            store_url: { type: string, maxLength: 2048, format: uri }
    # ---------- tenant của người dùng, RBAC (ADR-0066, ADR-0067)
    MyTenant:
      allOf:
        - $ref: '#/components/schemas/TenantSummary'
        - type: object
          properties:
            logo_url: { type: string, maxLength: 2048, format: uri }
            role_codes:
              type: array
              maxItems: 50
              description: Mã role đang hiệu lực của người dùng trong tenant (tóm tắt để hiển thị)
              items: { $ref: '#/components/schemas/RoleCode' }
    MyTenantsResponse:
      type: object
      required: [items, has_platform_role]
      properties:
        items:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/MyTenant' }
        has_platform_role: { type: boolean, description: 'true nếu người dùng có UserRole platform còn hiệu lực (vào phạm vi platform, không cần chọn tenant)' }
    PermissionScopeKind: { type: string, enum: [tenant, platform] }
    PermissionCode:
      type: string
      maxLength: 64
      pattern: '^[a-z_]+(\.[a-z_]+)+$'
      description: Mã permission định nghĩa trong code (catalog cố định — SECURITY_ARCHITECTURE §5.2)
    Permission:
      type: object
      required: [code, scope_kind, group_code, name]
      properties:
        code: { $ref: '#/components/schemas/PermissionCode' }
        scope_kind: { $ref: '#/components/schemas/PermissionScopeKind' }
        group_code: { type: string, maxLength: 64, description: Nhóm hiển thị (theo workspace/module) }
        name: { $ref: '#/components/schemas/LocalizedName' }
    PermissionList:
      type: object
      required: [items, catalog_version]
      properties:
        items:
          type: array
          maxItems: 1000
          items: { $ref: '#/components/schemas/Permission' }
        catalog_version: { type: string, maxLength: 64 }
    RoleInput:
      type: object
      required: [code, name, permission_codes]
      additionalProperties: false
      properties:
        code: { $ref: '#/components/schemas/RoleCode' }
        name: { $ref: '#/components/schemas/TenantLocalizedName' }
        description: { type: string, maxLength: 1000 }
        role_scope_kind:
          $ref: '#/components/schemas/PermissionScopeKind'
          description: 'Chỉ dùng ở `/admin/roles`; `/tenant/roles` luôn là `tenant`'
        permission_codes:
          type: array
          minItems: 1
          maxItems: 500
          uniqueItems: true
          description: 'Role `tenant` không được chứa permission `platform.*`, `game.*`, `competition.config.*` → `422 VALIDATION_FAILED` với `errors[].code = PERMISSION_NOT_ALLOWED_FOR_SCOPE`'
          items: { $ref: '#/components/schemas/PermissionCode' }
        reason: { type: string, maxLength: 1000, description: Bắt buộc khi sửa role platform hoặc role dùng chung }
    Role:
      type: object
      required: [role_id, code, name, role_scope_kind, is_system, permission_codes, version]
      properties:
        role_id: { $ref: '#/components/schemas/Uuid' }
        code: { $ref: '#/components/schemas/RoleCode' }
        name: { $ref: '#/components/schemas/TenantLocalizedName' }
        description: { type: string, maxLength: 1000 }
        role_scope_kind: { $ref: '#/components/schemas/PermissionScopeKind' }
        is_system: { type: boolean, description: Role hệ thống seed sẵn — không sửa/xóa được }
        tenant_id:
          description: null = role dùng chung toàn platform; có giá trị = role tùy biến của tenant
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        permission_codes:
          type: array
          maxItems: 500
          items: { $ref: '#/components/schemas/PermissionCode' }
        active_user_role_count: { type: integer, minimum: 0 }
        version: { type: integer, minimum: 1 }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
    RolePage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/Role' }
        page: { $ref: '#/components/schemas/PageInfo' }
    UserRoleScopeType: { type: string, enum: [platform, tenant, school, class, subject] }
    UserRoleGrantRequest:
      type: object
      required: [user_id, role_id, scope_type]
      additionalProperties: false
      properties:
        user_id: { $ref: '#/components/schemas/Uuid' }
        role_id: { $ref: '#/components/schemas/Uuid' }
        scope_type: { $ref: '#/components/schemas/UserRoleScopeType' }
        scope_id:
          description: 'school_id / class_id / subject_id theo scope_type; null với tenant/platform'
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        valid_from: { $ref: '#/components/schemas/Timestamp' }
        valid_to:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        reason: { type: string, maxLength: 1000 }
    UserRole:
      type: object
      required: [user_role_id, user_id, role_id, role_code, scope_type, source, valid_from]
      description: Gán role cho người dùng trong một phạm vi (`identity.user_roles`, ADR-0066) — thay `RoleAssignment` cũ
      properties:
        user_role_id: { $ref: '#/components/schemas/Uuid' }
        user_id: { $ref: '#/components/schemas/Uuid' }
        role_id: { $ref: '#/components/schemas/Uuid' }
        role_code: { $ref: '#/components/schemas/RoleCode' }
        tenant_id:
          description: null khi scope_type = platform
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        scope_type: { $ref: '#/components/schemas/UserRoleScopeType' }
        scope_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        valid_from: { $ref: '#/components/schemas/Timestamp' }
        valid_to:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        source: { type: string, enum: [sis, manual] }
        granted_by:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        created_at: { $ref: '#/components/schemas/Timestamp' }
    UserRolePage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/UserRole' }
        page: { $ref: '#/components/schemas/PageInfo' }
    User:
      type: object
      required: [user_id, user_type, status, username]
      description: Tài khoản SSO (`identity.users`, liên kết `keycloak_sub`). Một người một tài khoản; username và email duy nhất trên Keycloak và trong identity-service (không phân biệt hoa thường), nên không bao giờ trùng trong cùng tenant; thuộc nhiều tenant qua membership/UserRole (ADR-0066, ADR-0069).
      properties:
        user_id: { $ref: '#/components/schemas/Uuid' }
        user_type: { type: string, enum: [student, teacher, staff, admin] }
        status: { type: string, enum: [pending, active, locked, deactivated] }
        username: { type: string, minLength: 3, maxLength: 128 }
        email: { type: [string, 'null'], format: email, maxLength: 320 }
        display_name: { type: string, maxLength: 128 }
        locale: { $ref: '#/components/schemas/Locale' }
        source: { type: string, enum: [sis, manual, import] }
        last_login_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        user_roles:
          type: array
          maxItems: 100
          description: UserRole hiệu lực trong tenant hiện tại
          items: { $ref: '#/components/schemas/UserRole' }
        version: { type: integer, minimum: 1 }
    UserPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/User' }
        page: { $ref: '#/components/schemas/PageInfo' }
    TenantUserCreateRequest:
      type: object
      required: [username, email, display_name, user_type, initial_user_roles]
      additionalProperties: false
      description: 'Tạo tài khoản nhân sự thủ công (ngoài SIS) trong tenant của phiên. Username/email đã thuộc tài khoản khác (trong tenant hoặc trên SSO) → `409 USERNAME_TAKEN` / `409 EMAIL_TAKEN`; cùng một người thì thêm membership thay vì tạo tài khoản (ADR-0069).'
      properties:
        username: { type: string, minLength: 3, maxLength: 128, pattern: '^[A-Za-z0-9._-]{3,128}$' }
        email: { type: string, format: email, maxLength: 320, description: 'Bắt buộc với nhân sự; duy nhất trên SSO (ADR-0069)' }
        display_name: { type: string, minLength: 1, maxLength: 128 }
        user_type: { type: string, enum: [teacher, staff] }
        locale: { $ref: '#/components/schemas/Locale' }
        initial_user_roles:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            required: [role_id, scope_type]
            additionalProperties: false
            properties:
              role_id: { $ref: '#/components/schemas/Uuid' }
              scope_type: { type: string, enum: [tenant, school, class, subject] }
              scope_id: { $ref: '#/components/schemas/Uuid' }
    TenantUserUpdateRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        username: { type: string, minLength: 3, maxLength: 128, pattern: '^[A-Za-z0-9._-]{3,128}$' }
        email: { type: string, format: email, maxLength: 320 }
        display_name: { type: string, minLength: 1, maxLength: 128 }
        locale: { $ref: '#/components/schemas/Locale' }
        status: { type: string, enum: [active, locked, deactivated] }
    # ---------- danh mục quốc gia / tỉnh / trường / lớp (ADR-0060)
    Country:
      type: object
      required: [country_code, name, default_locale, status]
      properties:
        country_code: { type: string, pattern: '^[A-Z]{2}$', maxLength: 2 }
        name: { $ref: '#/components/schemas/LocalizedName' }
        default_locale: { $ref: '#/components/schemas/Locale' }
        status: { type: string, enum: [active, inactive] }
    CountryInput:
      type: object
      additionalProperties: false
      properties:
        country_code: { type: string, pattern: '^[A-Z]{2}$', maxLength: 2, description: Chỉ khi tạo }
        name: { $ref: '#/components/schemas/LocalizedName' }
        default_locale: { $ref: '#/components/schemas/Locale' }
        status: { type: string, enum: [active, inactive] }
        reason: { type: string, maxLength: 1000 }
    Province:
      type: object
      required: [province_id, code, country_code, name, short_name, province_type, status]
      description: Đơn vị hành chính cấp tỉnh (34 tỉnh/thành từ 01/07/2025 — Nghị quyết 202/2025/QH15; 63 đơn vị cũ ở trạng thái inactive). Mã nội bộ `code` ổn định; `official_code` [TBD].
      properties:
        province_id: { $ref: '#/components/schemas/Uuid' }
        code: { type: string, maxLength: 64, pattern: '^[a-z]{2}(\.old)?\.[a-z0-9-]+$' }
        country_code: { type: string, pattern: '^[A-Z]{2}$', maxLength: 2 }
        official_code: { type: [string, 'null'], maxLength: 16 }
        name: { $ref: '#/components/schemas/LocalizedName' }
        short_name: { $ref: '#/components/schemas/LocalizedName' }
        province_type: { type: string, enum: [municipality, province] }
        effective_from: { type: [string, 'null'], format: date }
        effective_to: { type: [string, 'null'], format: date }
        status: { type: string, enum: [active, inactive] }
        successor_code: { type: [string, 'null'], maxLength: 64, description: 'Với đơn vị inactive: mã đơn vị kế thừa hiện hành' }
    ProvinceInput:
      type: object
      additionalProperties: false
      properties:
        code: { type: string, maxLength: 64, pattern: '^[a-z]{2}(\.old)?\.[a-z0-9-]+$', description: Chỉ khi tạo }
        country_code: { type: string, pattern: '^[A-Z]{2}$', maxLength: 2 }
        official_code: { type: [string, 'null'], maxLength: 16 }
        name: { $ref: '#/components/schemas/LocalizedName' }
        short_name: { $ref: '#/components/schemas/LocalizedName' }
        province_type: { type: string, enum: [municipality, province] }
        effective_from: { type: [string, 'null'], format: date }
        effective_to: { type: [string, 'null'], format: date }
        status: { type: string, enum: [active, inactive] }
        reason: { type: string, maxLength: 1000 }
    ProvinceSuccessionInput:
      type: object
      required: [old_province_id, new_province_id, effective_date, kind]
      additionalProperties: false
      properties:
        old_province_id: { $ref: '#/components/schemas/Uuid' }
        new_province_id: { $ref: '#/components/schemas/Uuid' }
        effective_date: { type: string, format: date }
        kind: { type: string, enum: [merged, unchanged, renamed, split] }
        reason: { type: string, maxLength: 1000 }
    SchoolLevel: { type: string, enum: [primary, lower_secondary, multi_level] }
    ProvinceRef:
      type: object
      required: [code, name]
      properties:
        code: { type: string, maxLength: 64 }
        name: { $ref: '#/components/schemas/LocalizedName' }
    School:
      type: object
      required: [school_id, tenant_id, code, name, school_level, grade_min, grade_max, status, is_virtual]
      properties:
        school_id: { $ref: '#/components/schemas/Uuid' }
        tenant_id: { $ref: '#/components/schemas/Uuid' }
        code: { type: string, maxLength: 64 }
        name: { $ref: '#/components/schemas/TenantLocalizedName' }
        country_code: { type: [string, 'null'], pattern: '^[A-Z]{2}$', maxLength: 2 }
        province: { $ref: '#/components/schemas/ProvinceRef' }
        moet_code: { type: [string, 'null'], maxLength: 32 }
        school_level: { $ref: '#/components/schemas/SchoolLevel' }
        grade_min: { $ref: '#/components/schemas/GradeLevel' }
        grade_max: { $ref: '#/components/schemas/GradeLevel' }
        address: { type: [string, 'null'], maxLength: 500 }
        status: { type: string, enum: [pending_review, active, disabled] }
        is_virtual: { type: boolean, description: 'Trường ảo "EduWorld chung" của tenant common' }
        source: { type: string, enum: [sis, manual, import] }
        version: { type: integer, minimum: 1 }
    SchoolUpdateRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      description: Trường đồng bộ từ SIS chỉ sửa được phần hiển thị (tên tiếng Anh, địa chỉ); dữ liệu nguồn SIS ghi đè ở lần đồng bộ sau (ADR-0061).
      properties:
        name: { $ref: '#/components/schemas/TenantLocalizedName' }
        province_code: { type: string, maxLength: 64, description: Chỉ đơn vị `active` }
        moet_code: { type: [string, 'null'], maxLength: 32 }
        school_level: { $ref: '#/components/schemas/SchoolLevel' }
        grade_min: { $ref: '#/components/schemas/GradeLevel' }
        grade_max: { $ref: '#/components/schemas/GradeLevel' }
        address: { type: [string, 'null'], maxLength: 500 }
    SchoolPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/School' }
        page: { $ref: '#/components/schemas/PageInfo' }
    ClassPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/Class' }
        page: { $ref: '#/components/schemas/PageInfo' }
    UnassignedStudent:
      type: object
      required: [student_id, display_name, school_id, reason]
      properties:
        student_id: { $ref: '#/components/schemas/Uuid' }
        display_name: { type: string, maxLength: 128 }
        username: { type: string, maxLength: 128 }
        school_id: { $ref: '#/components/schemas/Uuid' }
        grade_level: { $ref: '#/components/schemas/GradeLevel' }
        reason: { type: string, enum: [missing_class, class_not_found, multiple_classes] }
        sis_connection_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        detected_at: { $ref: '#/components/schemas/Timestamp' }
    UnassignedStudentPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/UnassignedStudent' }
        page: { $ref: '#/components/schemas/PageInfo' }
    SchoolImportJob:
      type: object
      required: [import_id, status, dry_run, created_at]
      properties:
        import_id: { $ref: '#/components/schemas/Uuid' }
        status: { type: string, enum: [queued, running, succeeded, failed, cancelled] }
        dry_run: { type: boolean }
        target_tenant_id: { $ref: '#/components/schemas/Uuid' }
        total_rows: { type: integer, minimum: 0 }
        created_rows: { type: integer, minimum: 0 }
        updated_rows: { type: integer, minimum: 0 }
        error_rows: { type: integer, minimum: 0 }
        errors:
          type: array
          maxItems: 1000
          items:
            type: object
            required: [row, code]
            properties:
              row: { type: integer, minimum: 1 }
              field: { type: string, maxLength: 64 }
              code: { type: string, maxLength: 64, description: 'vd. PROVINCE_INACTIVE, DUPLICATE_MOET_CODE, GRADE_RANGE_INVALID' }
              message: { type: string, maxLength: 1000 }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        finished_at: { $ref: '#/components/schemas/Timestamp' }
    PlayerSchool:
      type: object
      required: [school_id, name, is_virtual]
      description: Trường của học sinh để hiển thị trong game (song ngữ, ADR-0056/0060)
      properties:
        school_id: { $ref: '#/components/schemas/Uuid' }
        name: { $ref: '#/components/schemas/TenantLocalizedName' }
        province: { $ref: '#/components/schemas/ProvinceRef' }
        school_level: { $ref: '#/components/schemas/SchoolLevel' }
        is_virtual: { type: boolean }
    PlayerClass:
      type: object
      required: [class_id, name, grade_level]
      properties:
        class_id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string, maxLength: 255 }
        grade_level: { $ref: '#/components/schemas/GradeLevel' }
        academic_year: { type: string, maxLength: 16, examples: ['2026-2027'] }
    # ---------- dashboard & báo cáo (ADR-0062, DASHBOARD_DATA)
    DashboardGrain: { type: string, enum: [day, week, month] }
    DashboardMeta:
      type: object
      required: [grain, data_as_of, is_partial]
      description: Siêu dữ liệu bắt buộc của mọi phản hồi dashboard (DASHBOARD_DATA §8)
      properties:
        grain: { $ref: '#/components/schemas/DashboardGrain' }
        data_as_of: { $ref: '#/components/schemas/Timestamp', description: '`computed_at` cũ nhất trong kết quả' }
        is_partial: { type: boolean, description: 'true nếu có dòng chưa chốt (`is_final = false`, ví dụ hôm nay)' }
        from: { type: string, format: date }
        to: { type: string, format: date }
    AnalyticsPoint:
      type: object
      required: [period_start]
      properties:
        period_start: { type: string, format: date }
        value: { type: [number, 'null'] }
        suppressed: { type: boolean, description: true khi ô < 5 học sinh bị ẩn }
        is_final: { type: boolean }
    AnalyticsSeries:
      allOf:
        - $ref: '#/components/schemas/DashboardMeta'
        - type: object
          required: [metric, points]
          properties:
            metric: { type: string, maxLength: 64 }
            unit: { type: string, maxLength: 32 }
            points:
              type: array
              maxItems: 120
              items: { $ref: '#/components/schemas/AnalyticsPoint' }
    TeacherDashboard:
      allOf:
        - $ref: '#/components/schemas/DashboardMeta'
        - type: object
          required: [class_id, widgets]
          description: Gói widget trang chủ giáo viên trong một lần gọi (DASHBOARD_DATA §5)
          properties:
            class_id: { $ref: '#/components/schemas/Uuid' }
            subject_id: { $ref: '#/components/schemas/Uuid' }
            widgets:
              type: object
              properties:
                active_students: { type: integer, minimum: 0 }
                assignments_open: { type: integer, minimum: 0 }
                assignments_due_soon: { type: integer, minimum: 0 }
                reviews_pending: { type: integer, minimum: 0 }
                accuracy: { type: [number, 'null'], minimum: 0, maximum: 1 }
                active_minutes_series:
                  type: array
                  maxItems: 120
                  items: { $ref: '#/components/schemas/AnalyticsPoint' }
                weak_objectives:
                  type: array
                  maxItems: 20
                  items:
                    type: object
                    required: [objective_id, code]
                    properties:
                      objective_id: { $ref: '#/components/schemas/Uuid' }
                      code: { type: string, maxLength: 64 }
                      below_proficient_ratio: { type: number, minimum: 0, maximum: 1 }
                students_needing_attention:
                  type: array
                  maxItems: 100
                  items:
                    type: object
                    required: [student_id]
                    properties:
                      student_id: { $ref: '#/components/schemas/Uuid' }
                      display_name: { type: string, maxLength: 128 }
                      reason: { type: string, enum: [inactive, low_accuracy, missed_assignments] }
    LearningSummary:
      allOf:
        - $ref: '#/components/schemas/DashboardMeta'
        - type: object
          description: Tổng hợp học tập cấp tenant/platform; ô < 5 học sinh bị ẩn (null)
          properties:
            active_students: { type: [integer, 'null'] }
            active_minutes_avg: { type: [number, 'null'] }
            attempts_completed: { type: [integer, 'null'] }
            accuracy: { type: [number, 'null'], minimum: 0, maximum: 1 }
            assignment_completion_rate: { type: [number, 'null'], minimum: 0, maximum: 1 }
            by_school:
              type: array
              maxItems: 200
              items:
                type: object
                properties:
                  school_id: { $ref: '#/components/schemas/Uuid' }
                  active_students: { type: [integer, 'null'] }
                  accuracy: { type: [number, 'null'] }
            by_tenant:
              type: array
              maxItems: 500
              description: Chỉ ở `/admin/analytics/learning/summary`
              items:
                type: object
                properties:
                  tenant_id: { $ref: '#/components/schemas/Uuid' }
                  active_students: { type: [integer, 'null'] }
                  accuracy: { type: [number, 'null'] }
            series:
              type: array
              maxItems: 10
              items:
                type: object
                required: [metric, points]
                properties:
                  metric: { type: string, maxLength: 64 }
                  points:
                    type: array
                    maxItems: 120
                    items: { $ref: '#/components/schemas/AnalyticsPoint' }
            suppressed_cells: { type: integer, minimum: 0 }
    ReportRequest:
      type: object
      required: [report_type, format, from, to]
      additionalProperties: false
      properties:
        report_type: { type: string, enum: [learning_summary, class_progress, assignment_results, game_summary] }
        format: { type: string, enum: [csv, xlsx] }
        from: { type: string, format: date }
        to: { type: string, format: date }
        school_ids:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/Uuid' }
        tenant_ids:
          type: array
          maxItems: 100
          description: Chỉ `/admin/reports` (System Admin)
          items: { $ref: '#/components/schemas/Uuid' }
        grade_level: { $ref: '#/components/schemas/GradeLevel' }
    ReportJob:
      type: object
      required: [report_id, status, report_type, format, created_at]
      properties:
        report_id: { $ref: '#/components/schemas/Uuid' }
        status: { type: string, enum: [queued, running, succeeded, failed, expired] }
        report_type: { type: string, maxLength: 64 }
        format: { type: string, enum: [csv, xlsx] }
        row_count: { type: integer, minimum: 0 }
        download_url: { type: [string, 'null'], maxLength: 2048, format: uri, description: 'URL ký, hết hạn sau 15 phút' }
        download_expires_at: { $ref: '#/components/schemas/Timestamp' }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        finished_at: { $ref: '#/components/schemas/Timestamp' }
    # ---------- learning (học sinh)
    Subject:
      type: object
      required: [subject_id, code, name]
      properties:
        subject_id: { $ref: '#/components/schemas/Uuid' }
        code: { type: string, maxLength: 64 }
        name: { $ref: '#/components/schemas/LearningName' }
        grade_levels:
          type: array
          maxItems: 9
          items: { $ref: '#/components/schemas/GradeLevel' }
        icon_url: { type: string, maxLength: 2048, format: uri }
    CurriculumSummary:
      type: object
      required: [curriculum_id, code, name, version]
      properties:
        curriculum_id: { $ref: '#/components/schemas/Uuid' }
        code: { type: string, maxLength: 64 }
        name: { $ref: '#/components/schemas/LearningName' }
        subject_id: { $ref: '#/components/schemas/Uuid' }
        grade_level: { $ref: '#/components/schemas/GradeLevel' }
        version: { type: integer, minimum: 1, description: Version đang áp dụng cho trường (ADR-0043) }
    Lesson:
      type: object
      required: [lesson_id, version, title, activities]
      description: Lesson đã publish, ghim version theo level session (ADR-0043); không chứa đáp án
      properties:
        lesson_id: { $ref: '#/components/schemas/Uuid' }
        version: { type: integer, minimum: 1 }
        title: { $ref: '#/components/schemas/LearningName' }
        summary: { $ref: '#/components/schemas/LearningText' }
        subject_id: { $ref: '#/components/schemas/Uuid' }
        grade_level: { $ref: '#/components/schemas/GradeLevel' }
        objective_ids:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/Uuid' }
        estimated_minutes: { type: integer, minimum: 1 }
        activities:
          type: array
          maxItems: 50
          items:
            type: object
            required: [activity_id, activity_type]
            properties:
              activity_id: { $ref: '#/components/schemas/Uuid' }
              activity_type: { type: string, maxLength: 64 }
              title: { $ref: '#/components/schemas/LearningName' }
              required: { type: boolean }
              completed: { type: boolean }
        completion_rule: { type: string, enum: [all_required_activities, any_activity, view_only] }
        completed_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    LessonCompletion:
      type: object
      required: [lesson_id, completed_at]
      properties:
        lesson_id: { $ref: '#/components/schemas/Uuid' }
        completed_at: { $ref: '#/components/schemas/Timestamp' }
        xp_granted: { type: integer, minimum: 0, description: XP do game-service cấp bất đồng bộ qua event (giá trị dự kiến để hiển thị) }
    RecommendationList:
      type: object
      required: [items, generated_at]
      properties:
        items:
          type: array
          maxItems: 20
          items:
            type: object
            required: [kind, target_id, reason]
            properties:
              kind: { type: string, enum: [retry_wrong, lesson, activity, objective_review] }
              target_id: { $ref: '#/components/schemas/Uuid' }
              title: { $ref: '#/components/schemas/LearningName' }
              objective_id: { $ref: '#/components/schemas/Uuid' }
              reason: { type: string, enum: [weak_objective, due_review, not_started, assignment_soon] }
        generated_at: { $ref: '#/components/schemas/Timestamp' }

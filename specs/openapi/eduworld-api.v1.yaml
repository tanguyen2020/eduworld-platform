      type: object
      required: [kind, filename, mime_type, size_bytes, sha256, license]
      properties:
        kind: { $ref: '#/components/schemas/MediaKind' }
        filename: { type: string, maxLength: 255 }
        mime_type: { type: string, maxLength: 127 }
        size_bytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 314572800
          description: 'Giới hạn [Proposed]: ảnh 10 MB, âm thanh 20 MB, video 300 MB, mô hình 3D 50 MB'
        sha256: { type: string, maxLength: 64, pattern: '^[0-9a-f]{64}$' }
        license: { type: string, maxLength: 64 }
        alt_text: { type: string, maxLength: 500 }
        owner_scope: { type: string, enum: [platform, tenant], default: tenant }
        tenant_id: { $ref: '#/components/schemas/Uuid' }
    MediaPresignResponse:
      type: object
      required: [asset_id, status, upload_url, expires_at]
      properties:
        asset_id: { $ref: '#/components/schemas/Uuid' }
        status: { $ref: '#/components/schemas/MediaStatus' }
        upload_url: { type: string, format: uri, maxLength: 2048 }
        upload_headers:
          type: object
          additionalProperties: { type: string, maxLength: 512 }
        expires_at: { $ref: '#/components/schemas/Timestamp' }
        duplicate_of: { $ref: '#/components/schemas/Uuid' }
    MediaAsset:
      type: object
      required: [asset_id, kind, status, sha256, original_filename]
      properties:
        asset_id: { $ref: '#/components/schemas/Uuid' }
        tenant_id: { $ref: '#/components/schemas/Uuid' }

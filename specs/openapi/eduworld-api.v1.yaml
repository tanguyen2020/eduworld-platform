  /schools/{school_id}/sis-imports:
    post:
      x-service: identity
      tags: [schools]
      operationId: createSisImport
      summary: School Admin tải file CSV SIS (csv_import, cột theo EduWorld SIS Contract) — xử lý bất đồng bộ trong worker
      description: |
        Endpoint public duy nhất liên quan SIS, giới hạn role `school_admin` trong scope trường.
        Luồng: tạo import → nhận presigned URL (`upload_url`, TTL 15 phút) → upload CSV (≤ 10 MB [Proposed]);
        worker nhận job khi object được upload, validate theo EduWorld SIS Contract v1 (cột CSV = tên trường DTO, xem specs/sis) và tạo SyncRun `kind=csv_import`.
        Cấu hình kết nối SIS và đồng bộ API vẫn chỉ ở `/sis/*` (gateway nội bộ).
      parameters:
        - { $ref: '#/components/parameters/TenantIdHeader' }
        - $ref: '#/components/parameters/SchoolId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SisImportCreate'
      responses:
        '202':
          description: Đã tạo import, trả presigned URL để upload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SisImport'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /schools/{school_id}/sis-imports/{import_id}:
    get:
      x-service: identity
      tags: [schools]
      operationId: getSisImport
      summary: Trạng thái import CSV SIS (số dòng hợp lệ/lỗi, reconciliation issue)
      parameters:
        - { $ref: '#/components/parameters/TenantIdHeader' }
        - $ref: '#/components/parameters/SchoolId'
        - name: import_id
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SisImport'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

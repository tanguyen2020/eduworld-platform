        sis_connection_id: { $ref: '#/components/schemas/Uuid' }
        school_id: { $ref: '#/components/schemas/Uuid' }
        tenant_id: { $ref: '#/components/schemas/Uuid' }
        school_name: { type: string, maxLength: 255 }
        active: { type: boolean }
        assigned_at: { $ref: '#/components/schemas/Timestamp' }
    QuestType:
      type: string

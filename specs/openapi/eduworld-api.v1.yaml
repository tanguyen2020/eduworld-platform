                  submission_id: { $ref: '#/components/schemas/Uuid' }
                  kind: { type: string, enum: [project_file, solution_photo, text] }
                  download_url: { type: string, maxLength: 2048, format: uri }
                  text: { type: string, maxLength: 10000 }

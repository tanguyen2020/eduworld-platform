      type: string
      enum: [practice, assignment, quest, minigame, challenge, exam, competition, retry_wrong]
    AttemptStatus:
      type: string
      enum: [in_progress, submitted, pending_review, returned, graded, expired, abandoned]
    QuestionRender:
      type: object
      description: Render payload — KHÔNG chứa đáp án, scoring rule hay giải thích (ADR-0016)
      required: [position, question_version_id, type, render_payload]
      properties:
        position: { type: integer, minimum: 1 }
        question_version_id: { $ref: '#/components/schemas/Uuid' }
        type: { $ref: '#/components/schemas/QuestionType' }
        render_payload:
          type: object
          description: Theo specs/schemas/question.schema.json (phần render)
          additionalProperties: true
          not:
            anyOf:
              - required: [answer_key]
              - required: [correct_option_ids]
        media:
          type: array
          items:
            type: object
            properties:
              asset_id: { $ref: '#/components/schemas/Uuid' }
              url: { type: string, maxLength: 2048, format: uri }
              kind: { type: string, enum: [image, audio, video] }
        max_score: { type: number }
    Attempt:
      type: object
      description: 'Entity Attempt duy nhất cho mọi activity_type và mode (ADR-0048, ADR-0059). Server-authoritative: không chứa đáp án (ADR-0016).'
      required: [attempt_id, mode, status, started_at]
      properties:
        attempt_id: { $ref: '#/components/schemas/Uuid' }
        activity_id:
          $ref: '#/components/schemas/Uuid'
          description: Vắng mặt với attempt ad-hoc (question_set/selection/retry_wrong)
        activity_version_id: { $ref: '#/components/schemas/Uuid' }
        activity_type: { $ref: '#/components/schemas/ActivityType' }
        mode: { $ref: '#/components/schemas/AttemptMode' }
        status: { $ref: '#/components/schemas/AttemptStatus' }
        context_type:
          type: string
          maxLength: 64
          description: quest_step, assignment, challenge, lesson, free_play, exam_session, match…
        context_id: { $ref: '#/components/schemas/Uuid' }
        started_at: { $ref: '#/components/schemas/Timestamp' }
        deadline_at: { $ref: '#/components/schemas/Timestamp' }
        submitted_at: { $ref: '#/components/schemas/Timestamp' }
        server_time: { $ref: '#/components/schemas/Timestamp' }
        feedback_policy: { type: string, enum: [immediate, on_submit, after_close, never] }
        display_language: { $ref: '#/components/schemas/Locale', description: Ngôn ngữ hiển thị cố định trong suốt attempt (ADR-0056) }
        items:
          type: array
          maxItems: 200
          description: Câu hỏi (render payload, không đáp án) cho hoạt động dạng câu hỏi
          items: { $ref: '#/components/schemas/QuestionRender' }
        saved_responses:
          type: array
          maxItems: 200
          description: Câu trả lời đã lưu (để resume)
          items:
            type: object
            properties:
              position: { type: integer, minimum: 1 }
              response: { type: object, additionalProperties: true }
        resume_position_ms: { type: integer, minimum: 0 }
        progress: { $ref: '#/components/schemas/ActivityProgressState' }
        render: { $ref: '#/components/schemas/ActivityRender' }
        evaluation: { $ref: '#/components/schemas/Evaluation' }
    AttemptSummary:
      type: object
      required: [attempt_id, mode, status, started_at]
      properties:
        attempt_id: { $ref: '#/components/schemas/Uuid' }
        activity_id: { $ref: '#/components/schemas/Uuid' }
        activity_type: { $ref: '#/components/schemas/ActivityType' }
        title: { type: string, maxLength: 255, description: Tên hoạt động theo display_language }
        mode: { $ref: '#/components/schemas/AttemptMode' }
        status: { $ref: '#/components/schemas/AttemptStatus' }
        started_at: { $ref: '#/components/schemas/Timestamp' }
        submitted_at: { $ref: '#/components/schemas/Timestamp' }
        score: { type: [number, 'null'] }
        max_score: { type: [number, 'null'] }
    AttemptResult:
      type: object
      required: [attempt_id, status]
      properties:
        attempt_id: { $ref: '#/components/schemas/Uuid' }
        status: { $ref: '#/components/schemas/AttemptStatus' }
        score: { type: [number, 'null'] }
        max_score: { type: [number, 'null'] }
        correct_count: { type: [integer, 'null'] }
        duration_ms: { type: integer }
        result_available_at: { $ref: '#/components/schemas/Timestamp' }
        rewards:
          type: array
          description: Phần thưởng game đã cấp (không ảnh hưởng điểm)
          items: { $ref: '#/components/schemas/RewardPreview' }
    AttemptReview:
      type: object
      required: [attempt_id, items]
      properties:
        attempt_id: { $ref: '#/components/schemas/Uuid' }
        score: { type: [number, 'null'] }
        max_score: { type: [number, 'null'] }
        items:
          type: array
          items:
            type: object
            properties:
              position: { type: integer }
              question: { $ref: '#/components/schemas/QuestionRender' }
              response: { type: object, additionalProperties: true }
              is_correct: { type: [boolean, 'null'] }
              score: { type: [number, 'null'] }
              explanation: { type: [object, 'null'], additionalProperties: true }
              objective_ids:
                type: array
                items: { $ref: '#/components/schemas/Uuid' }
        weak_objectives:
          type: array
          items: { $ref: '#/components/schemas/Uuid' }
        recommendations:
          type: array
          items:
            type: object
            properties:
              kind: { type: string, enum: [lesson, question_set, quest] }
              ref_id: { $ref: '#/components/schemas/Uuid' }
              title: { type: string, maxLength: 255 }
    ExamType:
      type: string
      enum: [practice_test, mock, chapter, semester, subject, custom]
    ExamSession:
      type: object
      required: [exam_session_id, type, is_official, duration_seconds]
      properties:
        exam_session_id: { $ref: '#/components/schemas/Uuid' }
        title: { type: string, maxLength: 255 }
        type: { $ref: '#/components/schemas/ExamType' }
        is_official: { type: boolean }
        subject_id: { $ref: '#/components/schemas/Uuid' }
        grade_level: { $ref: '#/components/schemas/GradeLevel' }
        window_start: { $ref: '#/components/schemas/Timestamp' }
        window_end: { $ref: '#/components/schemas/Timestamp' }
        duration_seconds: { type: integer }
        question_count: { type: integer }
        max_attempts: { type: integer }
        attempts_used: { type: integer }

    # ---------- multiplayer
    PartyType:
      type: string
      enum: [friend, study_group, quest, competition_team, class_group, custom]
    PartyVisibility:
      type: string
      enum: [private, friends, class]
    PartyCreate:
      type: object
      required: [name, party_type]
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }
        party_type: { $ref: '#/components/schemas/PartyType' }
        visibility: { $ref: '#/components/schemas/PartyVisibility' }
        invitation_policy: { type: string, enum: [leader_only, members], default: leader_only }
        max_members: { type: integer, minimum: 2, maximum: 8, default: 4 }
    PartySettingsUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }
        visibility: { $ref: '#/components/schemas/PartyVisibility' }
        invitation_policy: { type: string, enum: [leader_only, members] }
        max_members: { type: integer, minimum: 2, maximum: 8 }
    PartyMember:
      type: object
      required: [student_id, nickname, role, joined_at]
      properties:
        student_id: { $ref: '#/components/schemas/Uuid' }
        nickname: { type: string, maxLength: 128 }
        avatar_config: { $ref: '#/components/schemas/AvatarConfig' }
        role: { type: string, enum: [leader, member] }
        ready: { type: boolean }
        presence: { type: string, enum: [online, in_activity, disconnected, offline] }
        joined_at: { $ref: '#/components/schemas/Timestamp' }
    Party:
      type: object
      required: [party_id, name, leader_id, party_type, visibility, max_members, status, members]
      properties:
        party_id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string, maxLength: 255 }
        leader_id: { $ref: '#/components/schemas/Uuid' }
        party_type: { $ref: '#/components/schemas/PartyType' }
        visibility: { $ref: '#/components/schemas/PartyVisibility' }
        invitation_policy: { type: string, enum: [leader_only, members] }
        max_members: { type: integer, minimum: 2, maximum: 8 }
        status: { type: string, enum: [open, in_activity, disbanded] }
        current_activity: { $ref: '#/components/schemas/PartyActivitySelection' }
        current_game_session_ref: { $ref: '#/components/schemas/Uuid' }
        members:
          type: array
          items: { $ref: '#/components/schemas/PartyMember' }
        chat_channel_id: { $ref: '#/components/schemas/Uuid' }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
    PartyActivitySelection:
      type: object
      required: [activity_type]
      properties:
        activity_type: { type: string, enum: [explore, quest, learning_challenge, coop_challenge, team_battle] }
        activity_ref: { $ref: '#/components/schemas/Uuid' }
        game_mode: { type: string, maxLength: 64 }
    PartySessionStart:
      type: object
      required: [room_id, game_session_ref, members]
      properties:
        room_id: { $ref: '#/components/schemas/Uuid' }
        game_session_ref: { $ref: '#/components/schemas/Uuid' }
        members:
          type: array
          items: { $ref: '#/components/schemas/Uuid' }
        excluded_members:
          type: array
          description: Thành viên không đủ điều kiện (policy) kèm lý do
          items:
            type: object
            properties:
              student_id: { $ref: '#/components/schemas/Uuid' }
              reason: { type: string, maxLength: 1000 }
    InvitationStatus:
      type: string
      enum: [pending, accepted, rejected, expired, cancelled]
    PartyInvitation:
      type: object
      required: [invitation_id, party_id, inviter, status, expires_at]
      properties:
        invitation_id: { $ref: '#/components/schemas/Uuid' }
        party_id: { $ref: '#/components/schemas/Uuid' }
        party_name: { type: string, maxLength: 128 }
        inviter: { $ref: '#/components/schemas/PlayerCard' }
        invitee_id: { $ref: '#/components/schemas/Uuid' }
        status: { $ref: '#/components/schemas/InvitationStatus' }
        expires_at: { $ref: '#/components/schemas/Timestamp' }
    Room:
      type: object
      required: [room_id, room_type, status]
      properties:
        room_id: { $ref: '#/components/schemas/Uuid' }
        room_type: { type: string, enum: [hub_instance, private_instance, battle, coop, lobby] }
        area_id: { type: string, maxLength: 64 }
        capacity: { type: integer }
        status: { type: string, enum: [open, running, closing, closed] }
        member_count: { type: integer }

    # ---------- competition
    MatchMode:
      type: string
      enum: [battle_1v1, team_battle, coop_challenge, timed_quiz, tournament]
    MatchmakingTicketCreate:
      type: object
      required: [mode, subject_id]
      properties:
        mode: { $ref: '#/components/schemas/MatchMode' }
        subject_id: { $ref: '#/components/schemas/Uuid' }
        topic_id: { $ref: '#/components/schemas/Uuid' }
        party_id:
          $ref: '#/components/schemas/Uuid'
        matchmaking_type:
          type: string
          enum: [random, skill, grade, subject, topic, friend, team, tournament]
          default: skill
    MatchmakingTicket:
      type: object
      required: [ticket_id, status, mode, created_at]
      properties:
        ticket_id: { $ref: '#/components/schemas/Uuid' }
        status: { type: string, enum: [queued, proposed, matched, cancelled, expired] }
        mode: { $ref: '#/components/schemas/MatchMode' }
        subject_id: { $ref: '#/components/schemas/Uuid' }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        estimated_wait_seconds: { type: integer }
        match_id: { $ref: '#/components/schemas/Uuid' }
    Match:
      type: object
      required: [match_id, mode, status]
      properties:
        match_id: { $ref: '#/components/schemas/Uuid' }
        mode: { $ref: '#/components/schemas/MatchMode' }
        subject_id: { $ref: '#/components/schemas/Uuid' }
        grade_level: { $ref: '#/components/schemas/GradeLevel' }
        status: { type: string, enum: [proposed, lobby, running, completed, cancelled, aborted] }
        room_id: { $ref: '#/components/schemas/Uuid' }
        started_at: { $ref: '#/components/schemas/Timestamp' }
        ended_at: { $ref: '#/components/schemas/Timestamp' }
        participants:
          type: array
          items:
            type: object
            properties:
              player: { $ref: '#/components/schemas/PlayerCard' }
              team_no: { type: integer }
              outcome: { type: [string, 'null'], enum: [win, loss, draw, abandoned, null] }
              score: { type: [number, 'null'] }
              competition_points: { type: [integer, 'null'] }
              rating_delta: { type: [number, 'null'] }
    Rating:
      type: object
      required: [mode, subject_id, season_id, tier]
      properties:
        mode: { $ref: '#/components/schemas/MatchMode' }
        subject_id: { $ref: '#/components/schemas/Uuid' }
        season_id: { $ref: '#/components/schemas/Uuid' }
        tier: { type: string, maxLength: 64, description: 'Hiển thị thân thiện (vd. Đồng, Bạc, Vàng)' }
        rating: { type: number }
        rd: { type: number }
        games_played: { type: integer }
    TournamentCreate:
      type: object
      description: Giải đấu luôn được tạo từ tournament template của platform; tenant tạo qua POST /lms/challenges (ADR-0027).
      required: [template_id, name, format, scope_type, scope_id, subject_id, registration_closes_at]
      properties:
        template_id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string, maxLength: 80 }
        format: { type: string, enum: [single_elim, double_elim, round_robin, team] }
        scope_type: { type: string, enum: [class, school, organization] }
        scope_id: { $ref: '#/components/schemas/Uuid' }
        subject_id: { $ref: '#/components/schemas/Uuid' }
        grade_level: { $ref: '#/components/schemas/GradeLevel' }
        registration_closes_at: { $ref: '#/components/schemas/Timestamp' }
        starts_at: { $ref: '#/components/schemas/Timestamp' }
        max_entries: { type: integer, minimum: 2, maximum: 256 }
    Tournament:
      allOf:
        - $ref: '#/components/schemas/TournamentCreate'
        - type: object
          required: [tournament_id, status]
          properties:
            tournament_id: { $ref: '#/components/schemas/Uuid' }
            status: { type: string, enum: [draft, registration, seeded, running, completed, cancelled] }
            entry_count: { type: integer }
    LeaderboardPage:
      type: object
      required: [leaderboard_id, period_key, entries]
      properties:
        leaderboard_id: { $ref: '#/components/schemas/Uuid' }
        scope_type: { type: string, enum: [global, organization, school, class, grade, subject, topic, game_mode, friends, team] }
        metric: { type: string, enum: [competition_points, xp, quests_completed, rating] }
        period: { type: string, enum: [daily, weekly, monthly, season, all_time] }
        period_key: { type: string, maxLength: 64 }
        entries:
          type: array
          items:
            type: object
            required: [rank, player, value]
            properties:
              rank: { type: integer }
              player: { $ref: '#/components/schemas/PlayerCard' }
              value: { type: number }
              is_me: { type: boolean }
        page: { $ref: '#/components/schemas/PageInfo' }

    # ---------- chat / social / notification
    ChannelType:
      type: string
      enum: [world, area, match, party, team, class, study_group, direct]
    MessageKind:
      type: string
      enum: [text, emoji, quick, sticker, gif, system]
    ChatFeatures:
      type: object
      description: Tính năng hiệu lực của channel (ADR-0034, cấu hình platform)
      properties:
        edit: { type: boolean }
        recall: { type: boolean }
        reply: { type: boolean }
        quote: { type: boolean }
        forward: { type: boolean }
        sticker: { type: boolean }
        gif: { type: boolean }
        reaction: { type: boolean }
        mention: { type: boolean }
        pin: { type: boolean }
        typing: { type: boolean }
        receipts: { type: string, enum: [none, count, per_member] }
        search: { type: boolean }
    Channel:
      type: object
      required: [channel_id, channel_type, allowed_kinds]
      properties:
        channel_id: { $ref: '#/components/schemas/Uuid' }
        channel_type: { $ref: '#/components/schemas/ChannelType' }
        title: { type: string, maxLength: 255 }
        allowed_kinds:
          type: array
          items: { $ref: '#/components/schemas/MessageKind' }
        features: { $ref: '#/components/schemas/ChatFeatures' }
        unread_count: { type: integer }
        unread_mentions: { type: integer }
        last_seq: { type: integer, format: int64 }
        my_read_seq: { type: integer, format: int64 }
        pinned_count: { type: integer, maximum: 3 }
        status: { type: string, enum: [open, closed] }
        purge_after: { $ref: '#/components/schemas/Timestamp' }
        muted: { type: boolean }
    QuoteRef:
      type: object
      required: [message_id]
      properties:
        message_id: { $ref: '#/components/schemas/Uuid' }
        excerpt_start: { type: integer, minimum: 0 }
        excerpt_end: { type: integer, minimum: 0 }
        excerpt:
          type: string
          maxLength: 200
          readOnly: true
          description: Server cắt từ nội dung đã che; client không gửi
    ForwardedFrom:
      type: object
      readOnly: true
      properties:
        message_id: { $ref: '#/components/schemas/Uuid' }
        channel_type: { $ref: '#/components/schemas/ChannelType' }
        sender_nickname: { type: string, maxLength: 128 }
    MessageCreate:
      type: object
      required: [kind, client_message_id]
      properties:
        client_message_id: { $ref: '#/components/schemas/Uuid' }
        kind: { type: string, enum: [text, emoji, quick, sticker, gif] }
        body: { type: string, maxLength: 300 }
        quick_message_id: { $ref: '#/components/schemas/Uuid' }
        emoji: { type: string, maxLength: 16 }
        sticker_id: { $ref: '#/components/schemas/Uuid' }
        gif_id: { $ref: '#/components/schemas/Uuid' }
        reply_to_message_id: { $ref: '#/components/schemas/Uuid' }
        quote: { $ref: '#/components/schemas/QuoteRef' }
        mentions:
          type: array
          maxItems: 5
          items: { $ref: '#/components/schemas/Uuid' }
    MessageEdit:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 300 }
        mentions:
          type: array
          maxItems: 5
          items: { $ref: '#/components/schemas/Uuid' }
    ForwardRequest:
      type: object
      required: [target_channel_ids]
      properties:
        target_channel_ids:
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          items: { $ref: '#/components/schemas/Uuid' }
        comment: { type: string, maxLength: 300 }
    ReactionSummary:
      type: object
      properties:
        counts:
          type: object
          additionalProperties: { type: integer }
          description: emoji_code → số lượng
        mine:
          type: array
          maxItems: 3
          items: { type: string, maxLength: 255 }
    Message:
      type: object
      required: [message_id, channel_id, seq, sender, kind, created_at, moderation_state]
      properties:
        message_id: { $ref: '#/components/schemas/Uuid' }
        channel_id: { $ref: '#/components/schemas/Uuid' }
        seq: { type: integer, format: int64 }
        sender: { $ref: '#/components/schemas/PlayerCard' }
        kind: { $ref: '#/components/schemas/MessageKind' }
        body:
          type: [string, 'null']
          maxLength: 1000
          description: Nội dung hiển thị (đã che); null khi đã thu hồi/gỡ
        quick_message_id:
          type: string
          maxLength: 64
          description: Mã quick message; client hiển thị theo locale của người nhận (ADR-0056)
        sticker_id: { $ref: '#/components/schemas/Uuid' }
        gif_id: { $ref: '#/components/schemas/Uuid' }
        reply_to_message_id: { $ref: '#/components/schemas/Uuid' }
        quote: { $ref: '#/components/schemas/QuoteRef' }
        forwarded_from: { $ref: '#/components/schemas/ForwardedFrom' }
        mentions:
          type: array
          items: { $ref: '#/components/schemas/PlayerCard' }
        reactions: { $ref: '#/components/schemas/ReactionSummary' }
        revision: { type: integer, minimum: 1 }
        edited_at: { $ref: '#/components/schemas/Timestamp' }
        recalled: { type: boolean }
        pinned: { type: boolean }
        moderation_state: { type: string, enum: [allowed, masked, unchecked, held, removed] }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        system_code:
          type: string
          maxLength: 128
          description: 'kind=system: mã thông điệp hệ thống, client dựng câu theo locale'
        params:
          type: object
          maxProperties: 20
          additionalProperties: { type: string, maxLength: 255 }
    PinnedMessage:
      type: object
      required: [message, pinned_by, pinned_at]
      properties:
        message: { $ref: '#/components/schemas/Message' }
        pinned_by: { $ref: '#/components/schemas/PlayerCard' }
        pinned_at: { $ref: '#/components/schemas/Timestamp' }
    MessageReceipts:
      type: object
      required: [message_id, mode]
      properties:
        message_id: { $ref: '#/components/schemas/Uuid' }
        mode: { type: string, enum: [per_member, count] }
        delivered_count: { type: integer }
        read_count: { type: integer }
        members:
          type: array
          description: Chỉ có khi mode = per_member (hoặc giáo viên ở channel lớp)
          items:
            type: object
            required: [member, status]
            properties:
              member: { $ref: '#/components/schemas/PlayerCard' }
              status: { type: string, enum: [sent, delivered, read] }
    MessageSearchHit:
      type: object
      required: [message, channel_id, channel_type]
      properties:
        message: { $ref: '#/components/schemas/Message' }
        channel_id: { $ref: '#/components/schemas/Uuid' }
        channel_type: { $ref: '#/components/schemas/ChannelType' }
        highlight: { type: string, maxLength: 1000, description: Đoạn trích có đánh dấu từ khớp (từ nội dung đã che) }
    Sticker:
      type: object
      required: [sticker_id, url, alt_text]
      properties:
        sticker_id: { $ref: '#/components/schemas/Uuid' }
        url: { type: string, maxLength: 2048, format: uri }
        alt_text: { type: string, maxLength: 1000 }
    StickerPack:
      type: object
      required: [pack_id, code, name, unlocked, stickers]
      properties:
        pack_id: { $ref: '#/components/schemas/Uuid' }
        code: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 255 }
        unlocked: { type: boolean }
        unlock_hint: { type: string, maxLength: 1000, description: Gợi ý cách mở khóa (vd. hoàn thành quest) }
        stickers:
          type: array
          items: { $ref: '#/components/schemas/Sticker' }
    GifAsset:
      type: object
      required: [gif_id, url, preview_url, width, height]
      properties:
        gif_id: { $ref: '#/components/schemas/Uuid' }
        url: { type: string, maxLength: 2048, format: uri }
        preview_url: { type: string, maxLength: 2048, format: uri }
        width: { type: integer }
        height: { type: integer }
        tags:
          type: array
          items: { type: string, maxLength: 64 }
    ReportCreate:
      type: object
      required: [target_type, target_id, reason]
      properties:
        target_type: { type: string, enum: [message, user] }
        target_id: { $ref: '#/components/schemas/Uuid' }
        reason: { type: string, enum: [bad_words, bullying, personal_info, spam, inappropriate, other] }
        note: { type: string, maxLength: 500 }
    FriendRequest:
      type: object
      required: [request_id, status, created_at]
      properties:
        request_id: { $ref: '#/components/schemas/Uuid' }
        requester: { $ref: '#/components/schemas/PlayerCard' }
        addressee: { $ref: '#/components/schemas/PlayerCard' }
        status: { type: string, enum: [pending, accepted, rejected, cancelled, expired] }
        created_at: { $ref: '#/components/schemas/Timestamp' }
    Notification:
      type: object
      required: [notification_id, kind, created_at, read]
      properties:
        notification_id: { $ref: '#/components/schemas/Uuid' }
        kind: { type: string, enum: [assignment_new, assignment_due, party_invitation, friend_request, quest_available, reward_granted, tournament_update, moderation_notice, system] }
        title: { $ref: '#/components/schemas/LocalizedName' }
        body: { $ref: '#/components/schemas/LocalizedText' }
        ref_type: { type: string, maxLength: 64 }
        ref_id: { $ref: '#/components/schemas/Uuid' }
        read: { type: boolean }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        message_code:
          type: string
          maxLength: 128
          description: Mã thông điệp (ui.notification.<code>) — client có thể tự dựng câu theo locale
        params:
          type: object
          maxProperties: 20
          additionalProperties: { type: string, maxLength: 255 }

    # ---------- cms
    ContentStatus:
      type: string
      enum: [draft, in_review, approved, published, archived, rejected]
    ContentVersion:
      type: object
      required: [content_type, content_id, version, status]
      properties:
        content_type: { type: string, maxLength: 128 }
        content_id: { $ref: '#/components/schemas/Uuid' }
        content_version_id: { $ref: '#/components/schemas/Uuid' }
        version: { type: integer }
        status: { $ref: '#/components/schemas/ContentStatus' }
        owner_scope: { type: string, enum: [platform, tenant] }
        tenant_id:
          description: Tenant sở hữu; null với dữ liệu platform (owner_scope = platform). Luôn trả về cho System Admin
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        school_id: { $ref: '#/components/schemas/Uuid' }
        assigned: { type: boolean, description: 'true nếu là dữ liệu platform được gán cho tenant (chỉ đọc với tenant)' }
        cloned_from_id: { $ref: '#/components/schemas/Uuid' }
        cloned_from_tenant_id: { $ref: '#/components/schemas/Uuid' }
        author_id: { $ref: '#/components/schemas/Uuid' }
        reviewer_id: { $ref: '#/components/schemas/Uuid' }
        published_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
        content_language: { $ref: '#/components/schemas/ContentLanguage' }
        translation_status: { $ref: '#/components/schemas/TranslationStatus', readOnly: true }
    QuestionAuthoringInput:
      type: object
      description: Dạng soạn thảo — chỉ dùng trong CMS, có answer_key
      properties:
        tenant_id:
          description: Tenant đích — bắt buộc khi người gọi là System Admin và owner_scope = tenant; người dùng tenant bỏ trống (khác tenant phiên → TENANT_MISMATCH)
          $ref: '#/components/schemas/Uuid'
        owner_scope: { type: string, enum: [platform, tenant], default: tenant }
        type: { $ref: '#/components/schemas/QuestionType' }
        stem: { type: object, additionalProperties: true }
        render_payload: { type: object, additionalProperties: true }
        answer_key: { type: object, additionalProperties: true }
        scoring_rule: { type: object, additionalProperties: true }
        explanation: { type: object, additionalProperties: true }
        difficulty: { type: integer, minimum: 1, maximum: 5 }
        grade_level: { $ref: '#/components/schemas/GradeLevel' }
        subject_id: { $ref: '#/components/schemas/Uuid' }
        topic_id: { $ref: '#/components/schemas/Uuid' }
        objective_ids:
          type: array
          items: { $ref: '#/components/schemas/Uuid' }
        media_refs:
          type: array
          items: { $ref: '#/components/schemas/Uuid' }
        content_language:
          $ref: '#/components/schemas/ContentLanguage'
          description: Ngôn ngữ gốc của câu hỏi; stem/explanation dùng khóa vi/en (specs/schemas/question.schema.json)
    QuestionAuthoring:
      allOf:
        - $ref: '#/components/schemas/ContentVersion'
        - $ref: '#/components/schemas/QuestionAuthoringInput'

    # ---------- lms
    AssignmentCreate:
      type: object
      required: [title, content_ref, mode, targets, open_at, due_at]
      properties:
        tenant_id:
          description: Tenant đích — bắt buộc khi người gọi là System Admin; người dùng tenant bỏ trống
          $ref: '#/components/schemas/Uuid'
        title: { type: string, maxLength: 120 }
        content_ref:
          type: object
          required: [content_type, content_version_id]
          properties:
            content_type:
              type: string
              description: quest/minigame_config chỉ chọn version đã publish từ /lms/catalog/game-activities (ADR-0027)
              enum: [question_set, assessment_blueprint, lesson, quest, minigame_config]
            content_version_id: { $ref: '#/components/schemas/Uuid' }
        mode: { type: string, enum: [practice, graded] }
        targets:
          type: array
          minItems: 1
          items:
            type: object
            required: [target_type, target_id]
            properties:
              target_type: { type: string, enum: [class, group, student] }
              target_id: { $ref: '#/components/schemas/Uuid' }
        open_at: { $ref: '#/components/schemas/Timestamp' }
        due_at: { $ref: '#/components/schemas/Timestamp' }
        max_attempts: { type: integer, minimum: 1, maximum: 10, default: 1 }
        result_visibility: { type: string, enum: [immediate, after_due, manual], default: after_due }
    Assignment:
      allOf:
        - $ref: '#/components/schemas/AssignmentCreate'
        - type: object
          required: [assignment_id, status, created_by]
          properties:
            assignment_id: { $ref: '#/components/schemas/Uuid' }
            tenant_id: { $ref: '#/components/schemas/Uuid' }
            status: { type: string, enum: [scheduled, open, closed, cancelled] }
            created_by: { $ref: '#/components/schemas/Uuid' }
            completion:
              type: object
              properties:
                assigned: { type: integer }
                submitted: { type: integer }
                average_score: { type: [number, 'null'] }
    Challenge:
      allOf:
        - $ref: '#/components/schemas/ChallengeCreate'
        - type: object
          required: [challenge_id, status, created_by]
          properties:
            challenge_id: { $ref: '#/components/schemas/Uuid' }
            tenant_id: { $ref: '#/components/schemas/Uuid' }
            status: { type: string, enum: [scheduled, running, completed, cancelled] }
            created_by: { $ref: '#/components/schemas/Uuid' }
            tournament_id:
              description: Có khi template thuộc loại giải đấu
              oneOf:
                - $ref: '#/components/schemas/Uuid'
                - type: 'null'
    ChallengeCreate:
      type: object
      required: [template_id, name, targets, starts_at]
      properties:
        tenant_id:
          description: Tenant đích — bắt buộc khi người gọi là System Admin; người dùng tenant bỏ trống
          $ref: '#/components/schemas/Uuid'
        template_id:
          description: Template phải được gán cho tenant (nếu không → RESOURCE_NOT_ASSIGNED)
          $ref: '#/components/schemas/Uuid'
        name: { type: string, maxLength: 80 }
        targets:
          type: array
          minItems: 1
          items:
            type: object
            required: [target_type, target_id]
            properties:
              target_type: { type: string, enum: [class, group, grade_level, school] }
              target_id: { $ref: '#/components/schemas/Uuid' }
        starts_at: { $ref: '#/components/schemas/Timestamp' }
        ends_at: { $ref: '#/components/schemas/Timestamp' }
        participation: { type: string, enum: [individual, study_group] }
        question_set_version_id: { $ref: '#/components/schemas/Uuid' }
        params:
          type: object
          description: Chỉ các khóa nằm trong ChallengeTemplate.allowed_params; khóa khác → 422
          additionalProperties: true
    ChallengeTemplate:
      type: object
      required: [template_id, version, kind, name, allowed_params]
      properties:
        template_id: { $ref: '#/components/schemas/Uuid' }
        version: { type: integer }
        kind: { type: string, enum: [class_challenge, school_tournament] }
        name: { type: string, maxLength: 255 }
        description: { type: string, maxLength: 1000 }
        mode: { $ref: '#/components/schemas/MatchMode' }
        tournament_format: { type: string, enum: [single_elim, double_elim, round_robin, team] }
        grade_levels:
          type: array
          items: { $ref: '#/components/schemas/GradeLevel' }
        allowed_params:
          type: array
          description: Tham số tenant được phép điền
          items: { type: string, maxLength: 64 }
        reward_summary: { type: string, maxLength: 1000, description: Mô tả phần thưởng cố định của template (tenant không sửa) }
    GameActivityCatalogItem:
      type: object
      required: [content_type, content_version_id, title]
      properties:
        content_type: { type: string, enum: [quest, minigame_config] }
        content_id: { $ref: '#/components/schemas/Uuid' }
        content_version_id: { $ref: '#/components/schemas/Uuid' }
        title: { type: string, maxLength: 255 }
        grade_levels:
          type: array
          items: { $ref: '#/components/schemas/GradeLevel' }
        subject_id: { $ref: '#/components/schemas/Uuid' }
        objective_ids:
          type: array
          items: { $ref: '#/components/schemas/Uuid' }
        estimated_minutes: { type: integer }
        preview_media_url: { type: string, maxLength: 2048, format: uri }
    PermissionSet:
      type: object
      required: [roles, permissions]
      properties:
        tenant_id:
          description: Tenant của phiên; null với System Admin ở phạm vi platform
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        roles:
          type: array
          items: { $ref: '#/components/schemas/EffectiveRole' }
        permissions:
          type: array
          description: 'Ví dụ: lms.assignment.write, learning_content.publish, game.quest.write (chỉ role platform)'
          items: { type: string, maxLength: 64, pattern: '^[a-z_]+(\.[a-z_]+)+$' }
        workspaces:
          type: array
          description: Workspace của Admin Portal người dùng được thấy (ADR-0027 mục 7). Chỉ dùng dựng menu, không phải nguồn quyết định quyền.
          items:
            type: string
            enum: [school_lms, content_studio, game_ops, live_ops, platform_admin]
    TenantType:
      type: string
      enum: [school, unit, common]
      description: school = trường độc lập; unit = đơn vị nhiều trường; common = tenant chung (ADR-0005)
    TenantSummary:
      type: object
      required: [tenant_id, code, name, tenant_type, status]
      properties:
        tenant_id: { $ref: '#/components/schemas/Uuid' }
        code: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 255 }
        tenant_type: { $ref: '#/components/schemas/TenantType' }
        status: { type: string, enum: [active, disabled] }
        school_count: { type: integer }
    ResourceType:
      type: string
      description: Loại tài nguyên dùng cho Thùng rác, gán và clone (ADR-0028, ADR-0029)
      enum: [curriculum, lesson, question, question_set, assessment_blueprint, media, assignment, course, learning_path, challenge, challenge_template, tournament_template, quest, minigame_config, item, class_template, school_settings, tenant_settings]
    TrashItem:
      type: object
      description: Chỉ trả trong API Thùng rác — schema duy nhất có deleted_at
      required: [resource_type, resource_id, title, deleted_at, deleted_by]
      properties:
        resource_type: { $ref: '#/components/schemas/ResourceType' }
        resource_id: { $ref: '#/components/schemas/Uuid' }
        tenant_id:
          description: null với dữ liệu platform
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        title: { type: string, maxLength: 255 }
        deleted_at: { $ref: '#/components/schemas/Timestamp' }
        deleted_by: { $ref: '#/components/schemas/Uuid' }
        delete_reason: { type: string, maxLength: 1000 }
        restorable: { type: boolean, description: false nếu khôi phục sẽ vi phạm unique (đã có bản ghi mới cùng mã) }
    TenantAssignmentRequest:
      type: object
      required: [resource_type, resource_id]
      properties:
        resource_type: { $ref: '#/components/schemas/ResourceType' }
        resource_id: { $ref: '#/components/schemas/Uuid' }
        tenant_ids:
          type: array
          description: Bắt buộc trừ khi apply_to_all_tenants = true
          items: { $ref: '#/components/schemas/Uuid' }
        apply_to_all_tenants: { type: boolean, default: false, description: 'Gán cho mọi tenant hiện tại [Proposed]' }
        apply_to_new_tenants: { type: boolean, default: false, description: 'Tự động gán cho tenant tạo sau này [Proposed]' }
    TenantAssignment:
      type: object
      required: [resource_type, resource_id, tenant_id, assigned_at]
      properties:
        resource_type: { $ref: '#/components/schemas/ResourceType' }
        resource_id: { $ref: '#/components/schemas/Uuid' }
        tenant_id: { $ref: '#/components/schemas/Uuid' }
        tenant_name: { type: string, maxLength: 255 }
        assigned_by: { $ref: '#/components/schemas/Uuid' }
        assigned_at: { $ref: '#/components/schemas/Timestamp' }
    TenantCloneRequest:
      type: object
      required: [source_tenant_id, target_tenant_id, resource_type, resource_ids]
      properties:
        source_tenant_id: { $ref: '#/components/schemas/Uuid' }
        target_tenant_id: { $ref: '#/components/schemas/Uuid' }
        resource_type: { $ref: '#/components/schemas/ResourceType' }
        resource_ids:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: '#/components/schemas/Uuid' }
    TenantCloneJob:
      type: object
      required: [job_id, status, source_tenant_id, target_tenant_id, resource_type]
      properties:
        job_id: { $ref: '#/components/schemas/Uuid' }
        status: { type: string, enum: [queued, running, succeeded, partially_failed, failed] }
        source_tenant_id: { $ref: '#/components/schemas/Uuid' }
        target_tenant_id: { $ref: '#/components/schemas/Uuid' }
        resource_type: { $ref: '#/components/schemas/ResourceType' }
        cloned_count: { type: integer }
        id_map:
          type: array
          description: Ánh xạ ID nguồn → ID bản sao (gồm phụ thuộc được clone)
          items:
            type: object
            required: [source_id, clone_id]
            properties:
              resource_type: { $ref: '#/components/schemas/ResourceType' }
              source_id: { $ref: '#/components/schemas/Uuid' }
              clone_id: { $ref: '#/components/schemas/Uuid' }
        errors:
          type: array
          items: { type: string, maxLength: 255 }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        finished_at: { $ref: '#/components/schemas/Timestamp' }
    GameConfigType:
      type: string
      description: Loại cấu hình game — mỗi loại có JSON Schema trong specs/schemas (nếu có)
      enum: [quests, minigame-configs, npc-dialogues, world-areas, story-chapters, items, reward-rules, levels, progression-curves, challenges, bosses, achievements, collections, shop-items, currencies, matchmaking-configs, ranking-rules, seasons, tournament-templates, challenge-templates, leaderboard-definitions, sticker-packs, gifs, events, event-templates, season-tracks]
    GameConfigInput:
      type: object
      required: [payload]
      properties:
        title: { type: string, maxLength: 200 }
        payload:
          type: object
          description: Nội dung cấu hình theo schema của loại (vd. specs/schemas/quest.schema.json, minigame-config.schema.json, reward-rule.schema.json)
          additionalProperties: true
    GameConfigVersion:
      type: object
      required: [config_type, config_id, version, status, payload]
      properties:
        config_type: { $ref: '#/components/schemas/GameConfigType' }
        config_id: { $ref: '#/components/schemas/Uuid' }
        config_version_id: { $ref: '#/components/schemas/Uuid' }
        version: { type: integer }
        status: { $ref: '#/components/schemas/ContentStatus' }
        title: { type: string, maxLength: 255 }
        payload: { type: object, additionalProperties: true }
        effective_from: { $ref: '#/components/schemas/Timestamp' }
        author_id: { $ref: '#/components/schemas/Uuid' }
        reviewer_id: { $ref: '#/components/schemas/Uuid' }
        published_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
    ClassDashboard:
      type: object
      required: [class_id, generated_at, grain, data_as_of, is_partial]
      properties:
        class_id: { $ref: '#/components/schemas/Uuid' }
        generated_at: { $ref: '#/components/schemas/Timestamp' }
        active_students_7d: { type: integer }
        assignments_open: { type: integer }
        objective_distribution:
          type: array
          items:
            type: object
            properties:
              objective_id: { $ref: '#/components/schemas/Uuid' }
              code: { type: string, maxLength: 64 }
              level_counts:
                type: object
                additionalProperties: { type: integer }
        students_needing_attention:
          type: array
          items:
            type: object
            properties:
              student_id: { $ref: '#/components/schemas/Uuid' }
              display_name: { type: string, maxLength: 128 }
              weak_objective_ids:
                type: array
                items: { $ref: '#/components/schemas/Uuid' }
        grain: { $ref: '#/components/schemas/DashboardGrain' }
        data_as_of:
          $ref: '#/components/schemas/Timestamp'
          description: "`computed_at` cũ nhất trong kết quả (DASHBOARD_DATA §8)"
        is_partial: { type: boolean, description: true nếu có dòng chưa chốt (hôm nay) }

    # ---------- sis
    SisImportCreate:
      type: object
      required: [file_name, size_bytes, entity_kinds]
      properties:
        file_name: { type: string, maxLength: 200, pattern: '\.csv$' }
        size_bytes: { type: integer, minimum: 1, maximum: 10485760 }
        sha256: { type: string, maxLength: 128 }
        entity_kinds:
          type: array
          minItems: 1
          items: { type: string, enum: [students, teachers, classes, enrollments, teaching_assignments] }
        academic_year_id: { $ref: '#/components/schemas/Uuid' }
    SisImport:
      type: object
      required: [import_id, school_id, status, created_at]
      properties:
        import_id: { $ref: '#/components/schemas/Uuid' }
        school_id: { $ref: '#/components/schemas/Uuid' }
        status: { type: string, enum: [awaiting_upload, queued, validating, applying, completed, completed_with_issues, failed, expired] }
        upload_url: { type: string, maxLength: 2048, format: uri, description: 'Presigned URL — chỉ trả khi status=awaiting_upload' }
        upload_expires_at: { $ref: '#/components/schemas/Timestamp' }
        sync_run_id: { $ref: '#/components/schemas/Uuid' }
        rows_total: { type: integer }
        rows_applied: { type: integer }
        rows_rejected: { type: integer }
        reconciliation_issue_count: { type: integer }
        created_at: { $ref: '#/components/schemas/Timestamp' }
    SyncRun:
      type: object
      required: [sync_run_id, kind, status]
      properties:
        sync_run_id: { $ref: '#/components/schemas/Uuid' }
        kind: { type: string, enum: [full, delta, webhook] }
        status: { type: string, enum: [queued, running, succeeded, failed, partial] }
        started_at: { $ref: '#/components/schemas/Timestamp' }
        finished_at: { $ref: '#/components/schemas/Timestamp' }
        stats:
          type: object
          additionalProperties: { type: integer }

    # ---------- game: progression & exploration (PROGRESSION_SYSTEM, ADR-0049)
    LevelTitle:
      type: object
      required: [code, label]
      properties:
        code: { type: string, maxLength: 64 }
        label: { $ref: '#/components/schemas/LocalizedName' }
    RewardGrantSummary:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [xp, currency, item, badge, title] }
        amount: { type: integer, minimum: 0 }
        currency_code: { type: string, maxLength: 64 }
        item_id: { $ref: '#/components/schemas/Uuid' }
        label: { $ref: '#/components/schemas/LocalizedName' }
    ProgressionStatus:
      type: object
      required: [level, title, xp_total, xp_in_level, xp_to_next, curve_version]
      properties:
        level: { type: integer, minimum: 1 }
        title: { $ref: '#/components/schemas/LevelTitle' }
        xp_total: { type: integer, minimum: 0 }
        xp_in_level: { type: integer, minimum: 0 }
        xp_to_next: { type: [integer, 'null'], minimum: 0, description: 'null khi đã đạt max_level' }
        daily_xp_remaining: { type: integer, minimum: 0 }
        curve_version: { type: integer, minimum: 1 }
        max_level: { type: integer, minimum: 1 }
        next_level_rewards:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/RewardGrantSummary' }
    XpLedgerEntry:
      type: object
      required: [amount, source_type, created_at]
      properties:
        amount: { type: integer }
        source_type: { type: string, maxLength: 64 }
        source_code: { type: string, maxLength: 64 }
        source_label: { type: string, maxLength: 255, description: Mô tả thân thiện cho học sinh }
        capped: { type: boolean }
        created_at: { $ref: '#/components/schemas/Timestamp' }
    ProgressionLevel:
      type: object
      required: [level, xp_required]
      properties:
        level: { type: integer, minimum: 1 }
        xp_required: { type: integer, minimum: 0 }
        title_code: { type: string, maxLength: 64 }
        rewards:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/RewardGrantSummary' }
    AreaExploration:
      type: object
      required: [area_id, unlocked, completion_pct]
      properties:
        area_id: { type: string, maxLength: 64 }
        unlocked: { type: boolean }
        unlocked_at: { $ref: '#/components/schemas/Timestamp' }
        completion_pct: { type: number, minimum: 0, maximum: 100 }
        discoveries_found: { type: integer, minimum: 0 }
        discoveries_total: { type: integer, minimum: 0 }
        collectibles_found: { type: integer, minimum: 0 }
        collectibles_total: { type: integer, minimum: 0 }
        unlock_requirements:
          type: array
          maxItems: 10
          description: Điều kiện còn thiếu để mở khu (khi unlocked = false)
          items:
            type: object
            required: [kind]
            properties:
              kind: { type: string, enum: [level, quest, learning_objective, achievement, event] }
              ref: { type: string, maxLength: 64 }
              label: { type: string, maxLength: 255 }
              met: { type: boolean }
    DiscoveryResult:
      type: object
      required: [area_id, interactable_id, area_completion_pct]
      properties:
        area_id: { type: string, maxLength: 64 }
        interactable_id: { type: string, maxLength: 64 }
        kind: { type: string, enum: [discovery, collectible] }
        area_completion_pct: { type: number, minimum: 0, maximum: 100 }
        rewards:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/RewardGrantSummary' }
        unlocked_quest_ids:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/Uuid' }
    AvatarPresetInput:
      type: object
      required: [avatar_config]
      properties:
        name: { type: string, maxLength: 64 }
        avatar_config: { $ref: '#/components/schemas/AvatarConfig' }
    AvatarPreset:
      type: object
      required: [slot, avatar_config, updated_at]
      properties:
        slot: { type: integer, minimum: 1, maximum: 3 }
        name: { type: string, maxLength: 64 }
        avatar_config: { $ref: '#/components/schemas/AvatarConfig' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
    AchievementCategory:
      type: string
      enum: [first_time, progress, learning, exploration, social, team, competition, seasonal, hidden]
    AchievementProgress:
      type: object
      required: [achievement_id, code, category, unlocked]
      properties:
        achievement_id: { $ref: '#/components/schemas/Uuid' }
        code: { type: string, maxLength: 64 }
        title: { $ref: '#/components/schemas/LocalizedName' }
        description: { $ref: '#/components/schemas/LocalizedText' }
        category: { $ref: '#/components/schemas/AchievementCategory' }
        unlocked: { type: boolean }
        unlocked_at: { $ref: '#/components/schemas/Timestamp' }
        tier: { type: string, enum: [none, bronze, silver, gold] }
        progress_current: { type: number, minimum: 0 }
        progress_target: { type: number, minimum: 0 }
        rewards:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/RewardGrantSummary' }

    # ---------- game: challenge & boss (CHALLENGE_BOSS_SYSTEM)
    ChallengeType:
      type: string
      enum: [time, perfect, survival, puzzle, knowledge, boss, coop, party, weekly, seasonal, tournament]
    ChallengeDifficulty:
      type: string
      enum: [easy, normal, hard, expert, legendary]
    GameChallengeSummary:
      type: object
      required: [challenge_id, challenge_type, title, available_difficulties]
      properties:
        challenge_id: { $ref: '#/components/schemas/Uuid' }
        challenge_type: { $ref: '#/components/schemas/ChallengeType' }
        title: { $ref: '#/components/schemas/LocalizedName' }
        area_id: { type: string, maxLength: 64 }
        subject_id: { $ref: '#/components/schemas/Uuid' }
        available_difficulties:
          type: array
          maxItems: 5
          items: { $ref: '#/components/schemas/ChallengeDifficulty' }
        party_required: { type: boolean }
        available_to: { $ref: '#/components/schemas/Timestamp' }
        attempts_left: { type: integer, minimum: 0 }
    GameChallengeDetail:
      allOf:
        - $ref: '#/components/schemas/GameChallengeSummary'
        - type: object
          properties:
            description: { type: string, maxLength: 1000 }
            version: { type: integer, minimum: 1 }
            rules_summary: { type: string, maxLength: 1000 }
            time_limit_seconds: { type: integer, minimum: 1 }
            lives: { type: integer, minimum: 1 }
            cooldown_until: { $ref: '#/components/schemas/Timestamp' }
            first_clear_rewards:
              type: array
              maxItems: 20
              items: { $ref: '#/components/schemas/RewardGrantSummary' }
    GameChallengeAttempt:
      type: object
      required: [challenge_attempt_id, challenge_id, challenge_version, difficulty, status, started_at]
      properties:
        challenge_attempt_id: { $ref: '#/components/schemas/Uuid' }
        challenge_id: { $ref: '#/components/schemas/Uuid' }
        challenge_version: { type: integer, minimum: 1 }
        difficulty: { $ref: '#/components/schemas/ChallengeDifficulty' }
        party_id: { $ref: '#/components/schemas/Uuid' }
        status: { type: string, enum: [in_progress, succeeded, failed, abandoned] }
        score: { type: number, minimum: 0 }
        lives_left: { type: integer, minimum: 0 }
        activities_completed: { type: integer, minimum: 0 }
        started_at: { $ref: '#/components/schemas/Timestamp' }
        deadline_at: { $ref: '#/components/schemas/Timestamp' }
        ended_at: { $ref: '#/components/schemas/Timestamp' }
        rewards:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/RewardGrantSummary' }
    ChallengeNextActivity:
      type: object
      required: [challenge_attempt, done]
      properties:
        challenge_attempt: { $ref: '#/components/schemas/GameChallengeAttempt' }
        done: { type: boolean, description: true khi challenge đã kết thúc — không có attempt tiếp }
        attempt: { $ref: '#/components/schemas/Attempt' }
    BossSummary:
      type: object
      required: [boss_id, code, title, modes]
      properties:
        boss_id: { $ref: '#/components/schemas/Uuid' }
        code: { type: string, maxLength: 64 }
        title: { $ref: '#/components/schemas/LocalizedName' }
        area_id: { type: string, maxLength: 64 }
        subject_id: { $ref: '#/components/schemas/Uuid' }
        phase_count: { type: integer, minimum: 1, maximum: 10 }
        modes:
          type: array
          maxItems: 2
          items: { type: string, enum: [solo, party] }
        party_size_min: { type: integer, minimum: 1 }
        party_size_max: { type: integer, minimum: 1, maximum: 8 }
        defeated_before: { type: boolean }
    BossEncounter:
      type: object
      required: [encounter_id, boss_id, boss_version, mode, status]
      properties:
        encounter_id: { $ref: '#/components/schemas/Uuid' }
        boss_id: { $ref: '#/components/schemas/Uuid' }
        boss_version: { type: integer, minimum: 1 }
        mode: { type: string, enum: [solo, party] }
        party_id: { $ref: '#/components/schemas/Uuid' }
        status: { type: string, enum: [lobby, phase_active, phase_transition, phase_retry, defeated, ended] }
        current_phase: { type: integer, minimum: 0 }
        energy_remaining_pct: { type: number, minimum: 0, maximum: 100 }
        phase_deadline_at: { $ref: '#/components/schemas/Timestamp' }
        members:
          type: array
          maxItems: 8
          items:
            type: object
            required: [student_id, nickname]
            properties:
              student_id: { $ref: '#/components/schemas/Uuid' }
              nickname: { type: string, maxLength: 128 }
              ready: { type: boolean }
              contribution_met: { type: boolean, description: Đạt min_contribution của phase hiện tại (không công bố xếp hạng trong nhóm) }
        started_at: { $ref: '#/components/schemas/Timestamp' }
        ended_at: { $ref: '#/components/schemas/Timestamp' }

    # ---------- game: inventory, wallet, shop, collection (INVENTORY_ECONOMY)
    ItemKind:
      type: string
      enum: [outfit, hair, accessory, emote, pet, title, badge, frame, decoration, knowledge_card, consumable_cosmetic]
    ItemRarity:
      type: string
      enum: [common, uncommon, rare, epic, legendary]
    ItemLedgerEntry:
      type: object
      required: [item_id, delta, reason_code, created_at]
      properties:
        item_id: { $ref: '#/components/schemas/Uuid' }
        item_name: { type: string, maxLength: 255 }
        kind: { $ref: '#/components/schemas/ItemKind' }
        delta: { type: integer }
        reason_code: { type: string, enum: [reward, shop_purchase, collection, adjustment, duplicate_conversion] }
        source_label: { type: string, maxLength: 255 }
        created_at: { $ref: '#/components/schemas/Timestamp' }
    Wallet:
      type: object
      required: [currency_code, balance]
      properties:
        currency_code: { type: string, maxLength: 64, description: 'Mặc định `xu` (ADR-0049); loại tiền thứ hai [TBD] OQ-14' }
        balance: { type: integer, minimum: 0 }
        daily_earn_remaining: { type: integer, minimum: 0 }
    CurrencyLedgerEntry:
      type: object
      required: [currency_code, delta, balance_after, reason_code, created_at]
      properties:
        currency_code: { type: string, maxLength: 64 }
        delta: { type: integer }
        balance_after: { type: integer, minimum: 0 }
        reason_code: { type: string, enum: [reward, shop_purchase, adjustment, refund, duplicate_conversion] }
        source_label: { type: string, maxLength: 255 }
        created_at: { $ref: '#/components/schemas/Timestamp' }
    ShopItem:
      type: object
      required: [shop_item_id, item_id, name, kind, rarity, price]
      properties:
        shop_item_id: { $ref: '#/components/schemas/Uuid' }
        item_id: { $ref: '#/components/schemas/Uuid' }
        name: { $ref: '#/components/schemas/LocalizedName' }
        description: { $ref: '#/components/schemas/LocalizedText' }
        kind: { $ref: '#/components/schemas/ItemKind' }
        rarity: { $ref: '#/components/schemas/ItemRarity' }
        price: { type: integer, minimum: 1, description: Giá bằng Xu — không có giá tiền thật }
        currency_code: { type: string, maxLength: 64 }
        purchase_limit: { type: integer, minimum: 1 }
        purchased_count: { type: integer, minimum: 0 }
        owned: { type: boolean }
        available_to: { $ref: '#/components/schemas/Timestamp' }
        thumbnail_url: { type: string, maxLength: 2048, format: uri }
    PurchaseResult:
      type: object
      required: [shop_item_id, balance_after, item]
      properties:
        shop_item_id: { $ref: '#/components/schemas/Uuid' }
        balance_after: { type: integer, minimum: 0 }
        item: { $ref: '#/components/schemas/InventoryItem' }
    CollectionType:
      type: string
      enum: [pet, knowledge_card, cosmetic, badge, exploration, event]
    CollectionProgress:
      type: object
      required: [collection_id, code, type, owned_count, total_count]
      properties:
        collection_id: { $ref: '#/components/schemas/Uuid' }
        code: { type: string, maxLength: 64 }
        title: { $ref: '#/components/schemas/LocalizedName' }
        type: { $ref: '#/components/schemas/CollectionType' }
        owned_count: { type: integer, minimum: 0 }
        total_count: { type: integer, minimum: 0 }
        completed_at: { $ref: '#/components/schemas/Timestamp' }
    CollectionDetail:
      allOf:
        - $ref: '#/components/schemas/CollectionProgress'
        - type: object
          properties:
            items:
              type: array
              maxItems: 200
              items:
                type: object
                required: [item_id, owned]
                properties:
                  item_id: { $ref: '#/components/schemas/Uuid' }
                  name: { type: string, maxLength: 255 }
                  rarity: { $ref: '#/components/schemas/ItemRarity' }
                  owned: { type: boolean }
                  how_to_obtain: { type: string, maxLength: 500, description: 'Nguồn nhận công khai, xác định' }
            completion_rewards:
              type: array
              maxItems: 20
              items: { $ref: '#/components/schemas/RewardGrantSummary' }
    EconomyAdjustmentRequest:
      type: object
      required: [tenant_id, student_id, kind, delta, reason]
      properties:
        tenant_id: { $ref: '#/components/schemas/Uuid' }
        student_id: { $ref: '#/components/schemas/Uuid' }
        kind: { type: string, enum: [currency, item, xp] }
        currency_code: { type: string, maxLength: 64 }
        item_id: { $ref: '#/components/schemas/Uuid' }
        delta: { type: integer, description: 'Âm để thu hồi, dương để bù; số dư không được âm' }
        reason: { type: string, minLength: 10, maxLength: 1000 }
        ticket_ref: { type: string, maxLength: 128, description: Mã yêu cầu hỗ trợ/sự cố }
    EconomyAdjustment:
      allOf:
        - $ref: '#/components/schemas/EconomyAdjustmentRequest'
        - type: object
          required: [adjustment_id, status, created_by, created_at]
          properties:
            adjustment_id: { $ref: '#/components/schemas/Uuid' }
            status: { type: string, enum: [pending_approval, applied, rejected] }
            created_by: { $ref: '#/components/schemas/Uuid' }
            approved_by: { $ref: '#/components/schemas/Uuid' }
            created_at: { $ref: '#/components/schemas/Timestamp' }
            applied_at: { $ref: '#/components/schemas/Timestamp' }

    # ---------- learning: Activity Engine (ACTIVITY_ENGINE, ADR-0048, ADR-0055)
    ActivityType:
      type: string
      enum: [quiz, interactive_exercise, written_response, video_lesson, audio_lesson, speaking, simulation, minigame, project]
    EvaluationStrategy:
      type: string
      enum: [auto, exact, accepted_answers, rule, numeric_tolerance, rubric, teacher_review, completion, deterministic_check]
    MathAssetRef:
      type: object
      description: Công thức đã render sẵn thành SVG (ADR-0055) — game chỉ hiển thị
      required: [math_id, svg_url]
      properties:
        math_id: { type: string, maxLength: 64 }
        svg_url: { type: string, maxLength: 2048, format: uri }
        sha256: { type: string, maxLength: 64, pattern: '^[a-f0-9]{64}$' }
        speech_text: { type: string, maxLength: 1000 }
        display: { type: string, enum: [inline, block] }
    ActivityRender:
      type: object
      description: Render payload — KHÔNG chứa đáp án, rubric chấm hay scoring rule (ADR-0016)
      required: [activity_id, activity_version_id, activity_type, title, render_payload]
      properties:
        activity_id: { $ref: '#/components/schemas/Uuid' }
        activity_version_id: { $ref: '#/components/schemas/Uuid' }
        version: { type: integer, minimum: 1 }
        activity_type: { $ref: '#/components/schemas/ActivityType' }
        title: { type: string, maxLength: 255 }
        instructions: { type: string, maxLength: 2000 }
        time_limit_seconds: { type: integer, minimum: 1 }
        render_payload:
          type: object
          description: Theo specs/schemas/activities/<type>.schema.json (phần hiển thị)
          additionalProperties: true
          not:
            anyOf:
              - required: [answer_key]
              - required: [scoring_rule]
        math_assets:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/MathAssetRef' }
        media:
          type: array
          maxItems: 50
          items:
            type: object
            required: [asset_id, url]
            properties:
              asset_id: { $ref: '#/components/schemas/Uuid' }
              url: { type: string, maxLength: 2048, format: uri }
              kind: { type: string, enum: [image, audio, video, subtitle] }
        min_client_version: { type: string, maxLength: 32 }
        content_language: { $ref: '#/components/schemas/ContentLanguage' }
        display_language: { $ref: '#/components/schemas/Locale' }
        translation_missing:
          type: boolean
          description: true khi học sinh chọn ngôn ngữ chưa có bản dịch — hiển thị ngôn ngữ gốc kèm nhãn "Chưa có bản tiếng Anh"
    Evaluation:
      type: object
      required: [evaluation_id, attempt_id, source, status, effective, created_at]
      properties:
        evaluation_id: { $ref: '#/components/schemas/Uuid' }
        attempt_id: { $ref: '#/components/schemas/Uuid' }
        source: { type: string, enum: [system, teacher, ai_suggestion] }
        status: { type: string, enum: [pending, final, superseded] }
        score: { type: number, minimum: 0 }
        max_score: { type: number, minimum: 0 }
        passed: { type: boolean }
        criteria_scores:
          type: array
          maxItems: 20
          items:
            type: object
            required: [criterion_id, level_id]
            properties:
              criterion_id: { type: string, maxLength: 64 }
              level_id: { type: string, maxLength: 64 }
              points: { type: number, minimum: 0 }
              comment: { type: string, maxLength: 1000 }
        feedback: { type: string, maxLength: 4000 }
        feedback_math_assets:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/MathAssetRef' }
        effective: { type: boolean }
        created_at: { $ref: '#/components/schemas/Timestamp' }
    ActivityProgressReport:
      type: object
      required: [client_seq, position_ms]
      properties:
        client_seq: { type: integer, minimum: 0, description: Tăng dần; server bỏ qua giá trị cũ (idempotent) }
        position_ms: { type: integer, minimum: 0 }
        watched_ranges:
          type: array
          maxItems: 64
          items:
            type: object
            required: [start_ms, end_ms]
            properties:
              start_ms: { type: integer, minimum: 0 }
              end_ms: { type: integer, minimum: 0 }
        playback_rate: { type: number, minimum: 0.5, maximum: 2 }
    ActivityProgressState:
      type: object
      required: [watched_ratio, completed]
      properties:
        position_ms: { type: integer, minimum: 0 }
        watched_ratio: { type: number, minimum: 0, maximum: 1 }
        completed: { type: boolean }
        pending_cue_ids:
          type: array
          maxItems: 50
          items: { type: string, maxLength: 64 }
    ActivityResponseResult:
      type: object
      required: [accepted]
      properties:
        accepted: { type: boolean }
        position: { type: integer, minimum: 1 }
        is_correct: { type: [boolean, 'null'], description: null khi feedback policy chưa cho hiện }
        score: { type: [number, 'null'] }
        explanation: { type: string, maxLength: 4000 }
        explanation_math_assets:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/MathAssetRef' }
        correct_response:
          type: [object, 'null']
          additionalProperties: true
          description: Chỉ trả khi chính sách practice cho phép hiện đáp án sau khi trả lời
        next_segment_id: { type: string, maxLength: 64 }
    WrittenResponseDraft:
      type: object
      required: [client_seq]
      properties:
        client_seq: { type: integer, minimum: 0 }
        response_kind: { type: string, enum: [short_answer, long_answer, essay, math_solution] }
        body: { type: string, maxLength: 10000, description: Văn bản thường (không nhập công thức trong game) }
        numeric_answer: { type: number }
        milestone_id: { type: string, maxLength: 64 }
    WrittenResponseState:
      type: object
      required: [saved_at, word_count]
      properties:
        saved_at: { $ref: '#/components/schemas/Timestamp' }
        word_count: { type: integer, minimum: 0 }
        char_count: { type: integer, minimum: 0 }
        min_words: { type: integer, minimum: 0 }
        max_words: { type: integer, minimum: 0 }
    UploadPresign:
      type: object
      required: [upload_id, upload_url, expires_at]
      properties:
        upload_id: { $ref: '#/components/schemas/Uuid', description: recording_id hoặc submission_id }
        upload_url: { type: string, maxLength: 2048, format: uri }
        method: { type: string, enum: [PUT] }
        required_headers:
          type: object
          maxProperties: 10
          additionalProperties: { type: string, maxLength: 512 }
        expires_at: { $ref: '#/components/schemas/Timestamp' }
    AudioRecording:
      type: object
      required: [recording_id, attempt_id, status]
      properties:
        recording_id: { $ref: '#/components/schemas/Uuid' }
        attempt_id: { $ref: '#/components/schemas/Uuid' }
        status: { type: string, enum: [uploading, ready, processed, rejected, expired] }
        duration_ms: { type: integer, minimum: 0 }
        playback_url: { type: string, maxLength: 2048, format: uri, description: Signed URL 15 phút }
        retention_until: { $ref: '#/components/schemas/Timestamp' }
    SimulationRunInput:
      type: object
      required: [template_code, template_version, seed, parameters, action_log]
      properties:
        template_code: { type: string, maxLength: 64 }
        template_version: { type: integer, minimum: 1 }
        seed: { type: integer, minimum: 0 }
        parameters:
          type: object
          maxProperties: 50
          additionalProperties: true
        action_log:
          type: array
          maxItems: 500
          items:
            type: object
            required: [t_ms, action]
            properties:
              t_ms: { type: integer, minimum: 0 }
              action: { type: string, maxLength: 64 }
              args:
                type: object
                maxProperties: 20
                additionalProperties: true
        client_outcome:
          type: object
          maxProperties: 50
          additionalProperties: true
    SimulationRunResult:
      type: object
      required: [run_id, verified]
      properties:
        run_id: { $ref: '#/components/schemas/Uuid' }
        verified: { type: boolean }
        goal_met: { type: boolean }
        verified_outcome:
          type: object
          maxProperties: 50
          additionalProperties: true
        feedback: { type: string, maxLength: 1000 }

    # ---------- cms: activity definitions, types, rubrics, simulation templates
    ActivityDefinitionInput:
      type: object
      required: [activity_type, title, grade_levels, subject_id, objective_ids, config, content_language]
      properties:
        activity_type: { $ref: '#/components/schemas/ActivityType' }
        title: { $ref: '#/components/schemas/LearningName' }
        description: { $ref: '#/components/schemas/LearningText' }
        instructions: { $ref: '#/components/schemas/LearningText' }
        grade_levels:
          type: array
          minItems: 1
          maxItems: 9
          items: { $ref: '#/components/schemas/GradeLevel' }
        subject_id: { $ref: '#/components/schemas/Uuid' }
        topic_id: { $ref: '#/components/schemas/Uuid' }
        objective_ids:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: '#/components/schemas/Uuid' }
        difficulty: { type: integer, minimum: 1, maximum: 5 }
        time_limit_seconds: { type: integer, minimum: 1 }
        rubric_id: { $ref: '#/components/schemas/Uuid' }
        reward_rule_id: { $ref: '#/components/schemas/Uuid' }
        tenant_id: { $ref: '#/components/schemas/Uuid', description: 'Tenant đích khi System Admin tạo (ADR-0027); null = nội dung platform' }
        config:
          type: object
          description: content/interaction/evaluation/feedback/scoring/completion_rule theo specs/schemas/activities/<type>.schema.json (ACTIVITY_CONFIG_INVALID)
          additionalProperties: true
        math_assets:
          type: array
          maxItems: 200
          description: SVG + speech text do portal render bằng MathJax 4 (ADR-0055); server sanitize, thiếu → MATH_RENDER_FAILED
          items:
            type: object
            required: [math_id, latex, svg]
            properties:
              math_id: { type: string, maxLength: 64 }
              latex: { type: string, maxLength: 2000 }
              svg: { type: string, maxLength: 262144, description: 'SVG ≤ 256 KB' }
              speech_text: { type: string, maxLength: 1000 }
              display: { type: string, enum: [inline, block] }
        content_language: { $ref: '#/components/schemas/ContentLanguage' }
    ActivityDefinition:
      type: object
      required: [activity_id, activity_type, title, status, version]
      properties:
        activity_id: { $ref: '#/components/schemas/Uuid' }
        activity_version_id: { $ref: '#/components/schemas/Uuid' }
        version: { type: integer, minimum: 1 }
        activity_type: { $ref: '#/components/schemas/ActivityType' }
        title: { $ref: '#/components/schemas/LearningName' }
        status: { $ref: '#/components/schemas/ContentStatus' }
        owner_scope: { type: string, enum: [platform, tenant] }
        tenant_id: { $ref: '#/components/schemas/Uuid' }
        grade_levels:
          type: array
          maxItems: 9
          items: { $ref: '#/components/schemas/GradeLevel' }
        subject_id: { $ref: '#/components/schemas/Uuid' }
        objective_ids:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/Uuid' }
        difficulty: { type: integer, minimum: 1, maximum: 5 }
        config:
          type: object
          additionalProperties: true
        current_published_version: { type: [integer, 'null'], minimum: 1 }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
        content_language: { $ref: '#/components/schemas/ContentLanguage' }
        translation_status: { $ref: '#/components/schemas/TranslationStatus', readOnly: true }
    ActivityTypeInfo:
      type: object
      required: [activity_type, schema_url, evaluation_strategies]
      properties:
        activity_type: { $ref: '#/components/schemas/ActivityType' }
        label: { type: string, maxLength: 128 }
        schema_url: { type: string, maxLength: 2048, description: Đường dẫn JSON Schema cấu hình của loại }
        schema_version: { type: integer, minimum: 1 }
        evaluation_strategies:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/EvaluationStrategy' }
        min_client_version: { type: string, maxLength: 32 }
        status: { type: string, enum: [enabled, preview, disabled] }
    RubricLevel:
      type: object
      required: [level_id, label, points]
      properties:
        level_id: { type: string, maxLength: 64 }
        label: { type: string, maxLength: 64 }
        points: { type: number, minimum: 0 }
        descriptor: { type: string, maxLength: 1000 }
    RubricCriterion:
      type: object
      required: [criterion_id, title, levels]
      properties:
        criterion_id: { type: string, maxLength: 64 }
        title: { type: string, maxLength: 128 }
        description: { type: string, maxLength: 1000 }
        weight: { type: number, minimum: 0 }
        required: { type: boolean }
        objective_ids:
          type: array

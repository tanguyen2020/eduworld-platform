asyncapi: 3.0.0
info:
  title: EduWorld Realtime API
  version: 1.0.0-draft
  description: |
    Giao thức WebSocket giữa Godot client (và CMS SPA cho notification) với `realtime` (ADR-0036).
    Mô tả từ góc nhìn **server**: operation `receive` = lệnh client gửi lên, `send` = sự kiện server đẩy xuống.

    Tài liệu kiến trúc: docs/06-architecture/REALTIME_ARCHITECTURE.md (ADR-0008, ADR-0011, ADR-0012, ADR-0035, ADR-0036).

    Định tuyến phía server (không ảnh hưởng client; nguồn chuẩn REALTIME_ARCHITECTURE §4.1, F090):
    - `realtime` không chứa logic nghiệp vụ. Lệnh client có phản hồi (ack/error) được chuyển tới module sở hữu
      (handler NATS trong `core-api`) bằng **NATS request/reply** `ew.cmd.<module>.<type>` (vd. `ew.cmd.chat.chat.message.send`),
      header do gateway gắn: `Ew-Tenant-Id` (luôn lấy từ ticket, không bao giờ từ dữ liệu client), `Ew-User-Id`,
      `Ew-Game-Session-Id`, `Ew-Device-Id`, `Ew-Conn-Id`, `Ew-Node-Id`, `traceparent`. Reply:
      `{ok: true, result?, subscribe?: [topic], unsubscribe?: [topic]}` hoặc `{ok: false, problem: {code, retryable, retry_after_ms?}}`.
    - Mỗi operation `receive` khai báo `x-routing` (`module` đích; `room_input` = các `type` đi **NATS core**
      `ew.in.room.<payload.room_id>`, fire-and-forget, không ack); bảng định tuyến và validator envelope của gateway sinh từ
      file này bằng `scripts/realtime/gen-routes.mjs` (CI fail khi lệch). `module: realtime` = xử lý tại gateway.
    - Subject nội bộ không có message client: gateway gửi `ew.cmd.game.session.heartbeat` (payload `{game_session_id}`) mỗi
      `ws_heartbeat` để module game cập nhật `last_heartbeat_at` (F090-AC-12).
    - Sự kiện xuống client: module publish **Valkey Pub/Sub** `ew:rt:user:<user_id>`, `ew:rt:party:<party_id>`,
      `ew:rt:room:<room_id>:out`, `ew:chat:fanout:<channel_id>`, `ew:rt:broadcast` với envelope
      `specs/schemas/realtime/rt-pubsub-envelope.schema.json`; gateway gán `seq` và giao qua WebSocket.
    - Bảng domain → module: `chat.*`, `notification.*` → module chat; `party.*`, `matchmaking.*`, `battle.*`,
      `coop.*`, `hub.*` → module competition (`hub.player.move` → `ew.in.room.<room_id>`); `session.*`, `boss.*`, `challenge.*`,
      `progression.*`, `quest.*`, `world.*`, `event.*`, `season.*` → module game; `system.*`, `presence.*` → realtime.

    Quy ước:
    - Envelope JSON `{v, type, id|ref, seq, ts, payload}`, field `snake_case`.
    - `type` = `<domain>.<entity>.<action>`. Lệnh client dùng động từ hiện tại (`chat.message.send`);
      sự kiện server dùng quá khứ (`chat.message.created`).
    - Mỗi lệnh client (trừ `hub.player.move`, `system.heartbeat.ping`) nhận đúng một `system.ack` hoặc `system.error` có `ref` = `id`;
      riêng `system.session.resume` được trả bằng `system.session.resumed` hoặc `system.session.resume_failed` có `ref` = `id`.
      Gửi lại lệnh cùng `id` trong `resume_window` nhận lại đúng kết quả đã trả, không chuyển tiếp lần hai (F090-AC-16).
    - Thao tác quản trị cần idempotency (tạo/giải tán party, gửi/chấp nhận lời mời, kick, tạo matchmaking ticket)
      đi qua REST (`specs/openapi`); WebSocket chỉ đẩy sự kiện kết quả.
    - Server không bao giờ gửi answer key (ADR-0016). Không gửi PII: chỉ `nickname`, `avatar_config`, ID.
    - Trạng thái: Draft. Mọi tham số số học là [Proposed].
  license:
    name: Proprietary
servers:
  local:
    host: localhost:9080
    pathname: /realtime/v1
    protocol: ws
    description: APISIX local (Docker Compose)
  staging:
    host: staging.eduworld.example
    pathname: /realtime/v1
    protocol: wss
    security:
      - $ref: '#/components/securitySchemes/realtimeTicket'
  production:
    host: play.eduworld.example
    pathname: /realtime/v1
    protocol: wss
    security:
      - $ref: '#/components/securitySchemes/realtimeTicket'
defaultContentType: application/json

channels:
  realtime:
    address: /realtime/v1
    title: Kết nối realtime chính
    description: |
      Một kết nối WebSocket cho mỗi người dùng (kết nối mới thay thế kết nối cũ, close 4409).
      Chỉ học sinh (token game `azp = eduworld-game-backend`, ADR-0068) được cấp ticket (ADR-0031); tenant của kết nối cố định theo `X-Tenant-Id` lúc cấp ticket (ADR-0065). Khi tài khoản đăng nhập trên thiết bị khác
      (takeover), thiết bị cũ nhận `session.session.replaced` rồi bị đóng với close 4409. Khi server kết thúc game session, client nhận
      `session.session.ended` rồi bị đóng: `reason = curfew` hoặc `daily_limit` → close 4410 (không thu hồi credential); lý do khác → close 4403 (credential/phiên bị thu hồi).
      Subprotocol `eduworld.v1`. Ticket lấy từ `POST /api/v1/game/sessions/{id}/realtime-tickets` (TTL 60s, dùng 1 lần).
      Close codes: 4400 bad message · 4401 ticket invalid · 4403 access revoked (đăng xuất, xóa refresh token) · 4408 heartbeat timeout ·
      4409 replaced · 4410 session ended không thu hồi credential (curfew, daily_limit; không reconnect) · 4429 rate limited ·
      1012 node shutdown sau `system.server.draining` (chờ `reconnect_after_ms` rồi reconnect + resume ở node khác).
    bindings:
      ws:
        query:
          type: object
          required: [ticket]
          properties:
            ticket:
              type: string
              maxLength: 512
              description: Realtime ticket opaque, dùng một lần.
        headers:
          type: object
          properties:
            Sec-WebSocket-Protocol:
              type: string
              const: eduworld.v1
        bindingVersion: 0.1.0
    messages:
      # ---------- system ----------
      SystemPing: { $ref: '#/components/messages/SystemPing' }
      SystemSessionResume: { $ref: '#/components/messages/SystemSessionResume' }
      SystemSessionWelcome: { $ref: '#/components/messages/SystemSessionWelcome' }
      SystemPong: { $ref: '#/components/messages/SystemPong' }
      SystemAck: { $ref: '#/components/messages/SystemAck' }
      SystemError: { $ref: '#/components/messages/SystemError' }
      SystemSessionResumed: { $ref: '#/components/messages/SystemSessionResumed' }
      SystemSessionResumeFailed: { $ref: '#/components/messages/SystemSessionResumeFailed' }
      SystemDegraded: { $ref: '#/components/messages/SystemDegraded' }
      SystemNoticeBroadcast: { $ref: '#/components/messages/SystemNoticeBroadcast' }
      SystemServerDraining: { $ref: '#/components/messages/SystemServerDraining' }
      SessionReplaced: { $ref: '#/components/messages/SessionReplaced' }
      SessionEnded: { $ref: '#/components/messages/SessionEnded' }
      SessionEndingSoon: { $ref: '#/components/messages/SessionEndingSoon' }
      ContentManifestUpdated: { $ref: '#/components/messages/ContentManifestUpdated' }
      # ---------- presence ----------
      PresenceStatusSet: { $ref: '#/components/messages/PresenceStatusSet' }
      PresenceFriendUpdated: { $ref: '#/components/messages/PresenceFriendUpdated' }
      # ---------- chat ----------
      ChatChannelJoin: { $ref: '#/components/messages/ChatChannelJoin' }
      ChatChannelLeave: { $ref: '#/components/messages/ChatChannelLeave' }
      ChatMessageSend: { $ref: '#/components/messages/ChatMessageSend' }
      ChatReactionToggle: { $ref: '#/components/messages/ChatReactionToggle' }
      ChatReceiptRead: { $ref: '#/components/messages/ChatReceiptRead' }

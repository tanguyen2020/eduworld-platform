                  match_id: { $ref: '#/components/schemas/Uuid' }
                  question_instance_id: { type: string, maxLength: 64 }
                  answered: { type: boolean }
                  is_correct: { type: boolean }
                  points: { type: integer }
                  time_bonus: { type: integer }
                  correct_response: { $ref: '#/components/schemas/AnswerResponse' }
                  explanation: { type: object, description: Giải thích ngắn (nếu chế độ cho phép). }
    BattleQuestionRevealed:
      name: battle.question.revealed
      payload:
        allOf:
          - $ref: '#/components/schemas/ServerEnvelope'

      type: httpApiKey
      name: ticket
      in: query
      description: Ticket opaque 60s, dùng một lần (ADR-0008). Không bao giờ đặt JWT vào query string.

  schemas:
    # ================= Envelope =================
    ClientEnvelope:
      type: object
      required: [v, type, id, payload]
      additionalProperties: false
      properties:
        v: { type: integer, const: 1 }
        type: { type: string, maxLength: 64, pattern: '^[a-z_]+\.[a-z_]+\.[a-z_]+$' }
        id:
          type: string
          minLength: 10
          maxLength: 40
          description: ID lệnh do client sinh (ULID/UUIDv7); dùng ghép ack/error và chống lặp trong cửa sổ resume.
        ts: { type: integer, description: Epoch ms phía client (tham khảo). }
        payload: { type: object }
    ServerEnvelope:
      type: object
      required: [v, type, seq, ts, payload]
      additionalProperties: false
      properties:
        v: { type: integer, const: 1 }
        type: { type: string, maxLength: 64, pattern: '^[a-z_]+\.[a-z_]+\.[a-z_]+$' }
        seq:
          type: integer
          minimum: 1
          description: Số thứ tự tăng dần theo kết nối logic (giữ qua resume).
        ref: { type: string, maxLength: 255, description: '`id` của lệnh client mà message này phản hồi.' }
        ts: { type: integer, description: Epoch ms phía server (thẩm quyền). }
        payload: { type: object }

    # ================= Common =================
    RewardList:
      type: array
      maxItems: 20
      items:
        type: object
        required: [kind]
        properties:
          kind: { type: string, enum: [xp, currency, item, badge, title] }
          amount: { type: integer, minimum: 0 }
          currency_code: { type: string, maxLength: 64 }
          item_id: { $ref: '#/components/schemas/Uuid' }
          label: { $ref: '#/components/schemas/LocalizedName' }
    Uuid: { type: string, format: uuid }
    EpochMs: { type: integer, minimum: 0 }
    GradeLevel: { type: integer, minimum: 1, maximum: 9 }
    LocalizedName:
      type: object
      description: Tên/nhãn song ngữ bắt buộc vi + en (ADR-0056)
      required: [vi, en]
      additionalProperties: false
      properties:
        vi: { type: string, minLength: 1, maxLength: 255 }
        en: { type: string, minLength: 1, maxLength: 255 }
    LocalizedText:
      type: object
      description: Văn bản song ngữ bắt buộc vi + en (ADR-0056)
      required: [vi, en]
      additionalProperties: false
      properties:
        vi: { type: string, minLength: 1, maxLength: 4000 }
        en: { type: string, minLength: 1, maxLength: 4000 }
    TenantLocalizedName:
      type: object
      description: 'Tên do tenant nhập (sự kiện trường): vi bắt buộc, en tùy chọn'
      required: [vi]
      additionalProperties: false
      properties:
        vi: { type: string, minLength: 1, maxLength: 255 }
        en: { type: string, minLength: 1, maxLength: 255 }
    Vec3:
      type: array
      items: { type: number }
      minItems: 3
      maxItems: 3
      description: Vị trí mét [x, y, z], lượng tử hóa 1 cm.
    PublicPlayer:
      type: object
      description: Thông tin người chơi được phép hiển thị cho người khác (không PII).
      required: [user_id, nickname]
      properties:
        user_id: { $ref: '#/components/schemas/Uuid' }
        nickname: { type: string, maxLength: 32 }
        avatar_config: { type: object, description: 'Tham chiếu item_id cho body/hair/outfit/accessories.' }
        level: { type: integer, minimum: 1 }
        tier: { type: string, maxLength: 64, description: 'Hạng thi đấu dạng thân thiện (không lộ rating số).' }
    ErrorCode:
      type: string
      enum:
        - BAD_REQUEST
        - UNKNOWN_TYPE
        - VALIDATION_FAILED
        - UNAUTHENTICATED
        - PERMISSION_DENIED
        - GAME_ACCESS_STUDENT_ONLY
        - NOT_FOUND
        - CONFLICT
        - RATE_LIMITED
        - POLICY_DENIED
        - CHAT_CONTENT_BLOCKED
        - CHAT_NOT_ALLOWED
        - CHAT_KIND_NOT_ALLOWED
        - CHAT_RATE_LIMITED
        - CHAT_MUTED
        - CHAT_CHANNEL_CLOSED
        - CURFEW_ACTIVE
        - BOSS_ENCOUNTER_FULL
        - BOSS_PHASE_CLOSED
        - CHALLENGE_NOT_ELIGIBLE
        - CHAT_EDIT_WINDOW_EXPIRED
        - CHAT_RECALL_WINDOW_EXPIRED
        - CHAT_FORWARD_NOT_ALLOWED
        - CHAT_PIN_LIMIT_REACHED
        - CHAT_MENTION_LIMIT
        - CHAT_TEMPORARILY_UNAVAILABLE
        - CHAT_FEATURE_DISABLED
        - CHAT_ASSET_NOT_AVAILABLE
        - PARTY_NOT_LEADER
        - PARTY_NOT_READY
        - PARTY_ACTIVITY_NOT_ELIGIBLE
        - ROOM_FULL
        - ROOM_NOT_MEMBER
        - ANSWER_LATE
        - ANSWER_ALREADY_SUBMITTED
        - MATCH_NOT_ACTIVE
        - PROPOSAL_EXPIRED
        - INTERNAL
        - UNAVAILABLE
    ChatChannelType:
      type: string
      enum: [world, area, match, party, team, class, study_group, direct]
    ChatMessageKind:
      type: string
      enum: [text, quick, emoji, sticker, gif, system]
    ChatMessage:
      type: object
      required: [message_id, channel_id, seq, sender, kind, created_at]
      properties:
        message_id: { $ref: '#/components/schemas/Uuid' }
        channel_id: { $ref: '#/components/schemas/Uuid' }
        seq: { type: integer, description: Thứ tự tin trong channel. }
        sender: { $ref: '#/components/schemas/PublicPlayer' }
        kind: { $ref: '#/components/schemas/ChatMessageKind' }
        body: { type: string, maxLength: 500, description: 'Nội dung đã chuẩn hóa/che (masked) sau moderation.' }
        quick_message_id:
          type: string
          maxLength: 64
          description: 'kind=quick: client hiển thị văn bản theo locale của người nhận (GET /chat/quick-messages)'
        system_code:
          type: string
          maxLength: 128
          description: 'kind=system: mã thông điệp (ui.chat.system.<code>), client dựng câu theo locale'
        params:
          type: object
          maxProperties: 20
          additionalProperties: { type: string, maxLength: 255 }
          description: Tham số chèn vào chuỗi theo mã (client dựng câu theo locale)
        emoji: { type: string, maxLength: 64 }
        sticker_id: { $ref: '#/components/schemas/Uuid' }
        gif_id: { $ref: '#/components/schemas/Uuid' }
        reply_to_message_id: { $ref: '#/components/schemas/Uuid' }
        quote:
          type: object
          properties:
            message_id: { $ref: '#/components/schemas/Uuid' }
            excerpt: { type: string, maxLength: 200, description: Cắt từ nội dung đã che }
        forwarded_from:
          type: object
          properties:
            message_id: { $ref: '#/components/schemas/Uuid' }
            channel_type: { $ref: '#/components/schemas/ChatChannelType' }
            sender_nickname: { type: string, maxLength: 128 }
        mentions: { type: array, items: { $ref: '#/components/schemas/PublicPlayer' } }
        reactions:
          type: object
          additionalProperties: { type: integer }
        revision: { type: integer, minimum: 1 }
        edited_at: { $ref: '#/components/schemas/EpochMs' }
        recalled: { type: boolean }
        pinned: { type: boolean }
        moderation_state: { type: string, enum: [allowed, masked, unchecked] }
        created_at: { $ref: '#/components/schemas/EpochMs' }
    PartyMemberState:
      type: object
      required: [player, role, status, ready]
      properties:
        player: { $ref: '#/components/schemas/PublicPlayer' }
        role: { type: string, enum: [leader, member] }
        status: { type: string, enum: [online, away, in_activity, disconnected] }
        ready: { type: boolean }
        joined_at: { $ref: '#/components/schemas/EpochMs' }
    ActivityRef:
      type: object
      required: [kind, id]
      properties:
        kind: { type: string, enum: [quest, minigame, learning_challenge, team_competition, free_explore] }
        id: { type: string, maxLength: 64, description: 'quest_version_id / minigame_version_id / ...' }
        title: { type: string, maxLength: 255 }
    QuestionRender:
      type: object
      description: Render payload câu hỏi — KHÔNG chứa answer key / scoring rule (ADR-0016).
      required: [question_instance_id, question_type, stem]
      properties:
        question_instance_id: { type: string, maxLength: 64, description: 'ID duy nhất cho câu hỏi trong trận/phiên (không lộ question_version_id).' }
        question_type: { $ref: '#/components/schemas/QuestionType' }
        stem: { type: object, description: 'Rich content (text/latex/media refs).' }
        options:
          type: array
          items:
            type: object
            required: [option_id]
            properties:
              option_id: { type: string, maxLength: 64 }
              content: { type: object }
        media: { type: array, items: { type: object } }
        time_limit_ms: { type: integer }
    QuestionType:
      type: string
      description: Loại câu hỏi — giá trị đồng bộ với specs/schemas/common/enums.schema.json#/$defs/QuestionType.
      enum: [single_choice, multiple_choice, true_false, fill_in_blank, short_answer, numeric, matching, ordering, drag_drop, image_based, interactive]
    AttemptMode:
      type: string
      description: Chế độ attempt — đồng bộ với specs/schemas/common/enums.schema.json#/$defs/AttemptMode.
      enum: [practice, assignment, quest, minigame, challenge, exam, competition, retry_wrong, diagnostic]
    AttemptStatus:
      type: string
      description: Trạng thái attempt — đồng bộ với specs/schemas/common/enums.schema.json#/$defs/AttemptStatus.
      enum: [in_progress, submitted, graded, expired, abandoned]
    ItemId: { type: string, maxLength: 64, pattern: '^[a-z]_[a-z0-9_]{1,24}$' }
    AnswerResponse:
      description: |
        Câu trả lời thô theo loại câu hỏi — shape y hệt specs/schemas/question.schema.json#/$defs/response và
        OpenAPI `QuestionResponse`. Server biết loại câu từ question_instance_id; client không gửi điểm (ADR-0016).
      oneOf:
        - title: single_choice
          type: object
          required: [option_id]
          additionalProperties: false
          properties:
            option_id: { $ref: '#/components/schemas/ItemId' }
        - title: multiple_choice
          type: object
          required: [option_ids]
          additionalProperties: false
          properties:
            option_ids:
              type: array
              minItems: 1
              maxItems: 10
              uniqueItems: true
              items: { $ref: '#/components/schemas/ItemId' }
        - title: true_false
          type: object
          required: [value]
          additionalProperties: false
          properties:
            value: { type: boolean }
        - title: true_false_statements
          type: object
          required: [statement_values]
          additionalProperties: false
          properties:
            statement_values:
              type: object
              minProperties: 1
              maxProperties: 8
              propertyNames: { $ref: '#/components/schemas/ItemId' }
              additionalProperties: { type: boolean }
        - title: fill_in_blank
          type: object
          required: [blanks]
          additionalProperties: false
          properties:
            blanks:
              type: object
              minProperties: 1
              maxProperties: 10
              propertyNames: { $ref: '#/components/schemas/ItemId' }
              additionalProperties: { type: string, maxLength: 200 }
        - title: short_answer
          type: object
          required: [text]
          additionalProperties: false
          properties:
            text: { type: string, minLength: 1, maxLength: 500 }
        - title: numeric
          type: object
          required: [value]
          additionalProperties: false
          properties:
            value: { type: string, maxLength: 64, description: 'Chuỗi số học sinh nhập (dấu thập phân theo decimal_separator; a/b khi allow_fraction_input).' }
        - title: matching
          type: object
          required: [pairs]
          additionalProperties: false
          properties:
            pairs:
              type: array
              minItems: 1
              maxItems: 10
              items:
                type: array
                minItems: 2
                maxItems: 2
                items:
                  - { $ref: '#/components/schemas/ItemId' }
                  - { $ref: '#/components/schemas/ItemId' }
                additionalItems: false
        - title: ordering
          type: object
          required: [order]
          additionalProperties: false
          properties:
            order:
              type: array
              minItems: 3
              maxItems: 10
              uniqueItems: true
              items: { $ref: '#/components/schemas/ItemId' }
        - title: drag_drop
          type: object
          required: [placements]
          additionalProperties: false
          properties:
            placements:
              type: object
              minProperties: 1
              maxProperties: 16
              propertyNames: { $ref: '#/components/schemas/ItemId' }
              additionalProperties: { $ref: '#/components/schemas/ItemId' }
        - title: image_based_hotspot
          type: object
          required: [points]
          additionalProperties: false
          properties:
            points:
              type: array
              minItems: 1
              maxItems: 10
              items:
                type: object
                required: [x, y]
                additionalProperties: false
                properties:
                  x: { type: number }
                  y: { type: number }
        - title: image_based_label
          type: object
          required: [label_placements]
          additionalProperties: false
          properties:
            label_placements:
              type: object
              minProperties: 1
              maxProperties: 16
              propertyNames: { $ref: '#/components/schemas/ItemId' }
              additionalProperties: { $ref: '#/components/schemas/ItemId' }
        - title: interactive
          type: object
          required: [state]
          additionalProperties: false
          properties:
            state: { type: object, maxProperties: 50 }
            action_log:
              type: array
              maxItems: 500
              items:
                type: object
                required: [t_ms, action]
                additionalProperties: false
                properties:
                  t_ms: { type: integer, minimum: 0 }
                  action: { type: string, maxLength: 64 }
                  args: { type: object, maxProperties: 20 }
    HubEntity:
      type: object
      required: [eid]
      properties:
        eid: { type: integer, description: Entity id ngắn trong instance. }
        p: { $ref: '#/components/schemas/Vec3' }
        r: { type: number, description: Yaw (radian). }
        a: { type: string, maxLength: 255, description: 'Animation state: idle, walk, run, jump, emote:<id>, sit.' }

  messages:
    # ======================= SYSTEM =======================
    SystemPing:
      name: system.heartbeat.ping
      title: Heartbeat (mỗi 15s)
      summary: Không cần ack; server trả system.heartbeat.pong. Không nhận frame nào 45s → close 4408.
      payload:
        allOf:
          - $ref: '#/components/schemas/ClientEnvelope'
          - type: object
            properties:
              type: { const: system.heartbeat.ping }
              payload:
                type: object
                properties:
                  client_time: { $ref: '#/components/schemas/EpochMs' }
    SystemSessionResume:
      name: system.session.resume
      title: Khôi phục phiên sau reconnect
      payload:
        allOf:
          - $ref: '#/components/schemas/ClientEnvelope'
          - type: object
            properties:
              type: { const: system.session.resume }
              payload:
                type: object
                required: [resume_token, last_seq]
                properties:
                  resume_token: { type: string, maxLength: 512 }
                  last_seq: { type: integer, minimum: 0 }
    SystemSessionWelcome:
      name: system.session.welcome
      title: Kết nối được chấp nhận
      payload:
        allOf:
          - $ref: '#/components/schemas/ServerEnvelope'
          - type: object
            properties:
              type: { const: system.session.welcome }
              payload:
                type: object
                required: [conn_id, server_time, heartbeat_s, timeout_s, resume_token, protocol_version]
                properties:
                  conn_id: { type: string, maxLength: 64 }
                  user_id: { $ref: '#/components/schemas/Uuid' }
                  game_session_id: { $ref: '#/components/schemas/Uuid' }
                  server_time: { $ref: '#/components/schemas/EpochMs' }
                  heartbeat_s: { type: integer, default: 15 }
                  timeout_s: { type: integer, default: 45 }
                  resume_token: { type: string, maxLength: 512 }
                  resume_window_s: { type: integer, default: 120 }
                  protocol_version: { type: integer, const: 1 }
                  limits:
                    type: object
                    properties:
                      max_frame_bytes: { type: integer, default: 16384 }
                      max_move_hz: { type: integer, default: 10 }
    SystemPong:
      name: system.heartbeat.pong
      payload:
        allOf:
          - $ref: '#/components/schemas/ServerEnvelope'
          - type: object
            properties:
              type: { const: system.heartbeat.pong }
              payload:
                type: object
                properties:
                  client_time: { $ref: '#/components/schemas/EpochMs' }
                  server_time: { $ref: '#/components/schemas/EpochMs' }
    SystemAck:
      name: system.command.acked
      title: Xác nhận lệnh thành công
      summary: Type thực tế là `system.command.acked`; tài liệu gọi tắt là system.ack.
      payload:
        allOf:
          - $ref: '#/components/schemas/ServerEnvelope'
          - type: object
            required: [ref]
            properties:
              type: { const: system.command.acked }
              payload:
                type: object
                properties:
                  result: { type: object, description: Dữ liệu kết quả tùy lệnh (vd. message_id). }
    SystemError:
      name: system.command.failed
      title: Lệnh thất bại / lỗi giao thức
      summary: Type thực tế là `system.command.failed`; tài liệu gọi tắt là system.error. `ref` có thể vắng nếu lỗi không gắn lệnh.
      payload:
        allOf:
          - $ref: '#/components/schemas/ServerEnvelope'
          - type: object
            properties:
              type: { const: system.command.failed }
              payload:
                type: object
                required: [code, message]
                properties:
                  code: { $ref: '#/components/schemas/ErrorCode' }
                  message: { type: string, maxLength: 1000, description: Thông điệp thân thiện (vi-VN) có thể hiển thị. }
                  retry_after_ms: { type: integer }
                  details: { type: object }
    SystemSessionResumed:
      name: system.session.resumed
      summary: Gửi sau khi replay xong các message seq > last_seq.
      payload:
        allOf:
          - $ref: '#/components/schemas/ServerEnvelope'
          - type: object
            properties:
              type: { const: system.session.resumed }
              payload:
                type: object
                properties:
                  replayed: { type: integer }
                  rejoined_rooms: { type: array, items: { type: string, maxLength: 64 } }
    SystemSessionResumeFailed:
      name: system.session.resume_failed
      summary: Buffer đã hết hạn — client resync qua REST (party, chat unread, quest, match).
      payload:
        allOf:
          - $ref: '#/components/schemas/ServerEnvelope'
          - type: object
            properties:
              type: { const: system.session.resume_failed }
              payload:
                type: object
                properties:
                  reason: { type: string, enum: [expired, unknown_token, seq_gap] }
    SystemDegraded:
      name: system.service.degraded
      summary: Hạ tầng realtime suy giảm (vd. Valkey) — client chuyển sang poll REST.
      payload:
        allOf:
          - $ref: '#/components/schemas/ServerEnvelope'
          - type: object
            properties:
              type: { const: system.service.degraded }
              payload:
                type: object
                properties:
                  features: { type: array, items: { type: string, enum: [chat, presence, party, matchmaking, notification] } }
                  poll_interval_s: { type: integer, default: 10 }
    SystemNoticeBroadcast:
      name: system.notice.broadcasted
      summary: Thông báo hệ thống (bảo trì, sự kiện).
      payload:
        allOf:
          - $ref: '#/components/schemas/ServerEnvelope'
          - type: object
            properties:
              type: { const: system.notice.broadcasted }
              payload:
                type: object
                required: [level, message]
                properties:
                  level: { type: string, enum: [info, warning, maintenance] }
                  message_code: { type: string, maxLength: 128 }
                  message: { $ref: '#/components/schemas/LocalizedText' }
                  starts_at: { $ref: '#/components/schemas/EpochMs' }

    SessionReplaced:
      name: session.session.replaced
      summary: Tài khoản vừa đăng nhập trên thiết bị khác — phiên này bị kết thúc (ADR-0031).
      description: |
        Gửi ngay trước khi server đóng kết nối với close code 4409. Client hiển thị thông báo thân thiện
        ("Bạn đã được đăng xuất vì tài khoản vừa đăng nhập trên thiết bị khác"), xóa token cục bộ và
        quay về màn hình đăng nhập. Không tự reconnect.
      payload:
        allOf:
          - $ref: '#/components/schemas/ServerEnvelope'
          - type: object
            properties:
              type: { const: session.session.replaced }
              payload:
                type: object
                required: [game_session_id, replaced_at]
                properties:
                  game_session_id: { type: string, format: uuid }
                  replaced_at: { $ref: '#/components/schemas/EpochMs' }
                  new_device_platform: { type: string, enum: [windows, android, ios, web, macos, linux] }

    ContentManifestUpdated:
      name: content.manifest.updated
      summary: Có content manifest mới cho tenant (ADR-0043) — chỉ báo, áp dụng ở màn kế tiếp.
      description: |
        Phát bởi module game (qua realtime) sau khi publish/rollback/unpublish nội dung làm đổi manifest
        của tenant. Client chỉ đặt cờ "có bản mới"; KHÔNG đổi nội dung của màn đang chơi (version pinning).
        Khi vào màn mới, client gọi GET /api/v1/game/content-manifest (If-None-Match) rồi POST /game/levels/{id}:start.
      payload:
        allOf:
          - $ref: '#/components/schemas/ServerEnvelope'
          - type: object
            properties:
              type: { const: content.manifest.updated }
              payload:
                type: object
                required: [tenant_id, manifest_version, etag]
                properties:
                  tenant_id: { type: string, format: uuid }
                  manifest_version: { type: integer }
                  etag: { type: string, maxLength: 128 }
                  changed_items_count: { type: integer, minimum: 0 }

    # ======================= PRESENCE =======================
    PresenceStatusSet:
      name: presence.status.set
      payload:
        allOf:
          - $ref: '#/components/schemas/ClientEnvelope'
          - type: object
            properties:
              type: { const: presence.status.set }
              payload:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [online, away, busy, invisible] }
                  activity: { type: string, enum: [idle, learning, quest, battle, party_lobby, exam] }
    PresenceFriendUpdated:
      name: presence.friend.updated
      summary: Chỉ gửi cho bạn bè/party/lớp theo policy; trong exam không lộ chi tiết hoạt động.
      payload:
        allOf:
          - $ref: '#/components/schemas/ServerEnvelope'
          - type: object
            properties:
              type: { const: presence.friend.updated }
              payload:
                type: object
                required: [user_id, status]
                properties:
                  user_id: { $ref: '#/components/schemas/Uuid' }
                  status: { type: string, enum: [online, away, busy, offline] }
                  activity: { type: string, maxLength: 64 }
                  area_id: { type: string, maxLength: 64 }

    # ======================= CHAT =======================
    ChatChannelJoin:
      name: chat.channel.join
      summary: Subscribe nhận tin nhắn realtime của channel (server kiểm tra membership + tenant).
      payload:
        allOf:
          - $ref: '#/components/schemas/ClientEnvelope'
          - type: object
            properties:
              type: { const: chat.channel.join }
              payload:
                type: object
                required: [channel_id]
                properties:
                  channel_id: { $ref: '#/components/schemas/Uuid' }
                  since_seq: { type: integer, description: Nhận bù tin nhắn sau seq này (tối đa 50). }
    ChatChannelLeave:
      name: chat.channel.leave
      payload:
        allOf:
          - $ref: '#/components/schemas/ClientEnvelope'
          - type: object
            properties:
              type: { const: chat.channel.leave }
              payload:
                type: object
                required: [channel_id]
                properties:
                  channel_id: { $ref: '#/components/schemas/Uuid' }
    ChatMessageSend:
      name: chat.message.send
      summary: |
        Gửi tin. `kind` được phép theo ChatPolicy của channel — một bộ quy tắc cho mọi lớp (ADR-0020); mọi kind qua kiểm tra hợp lệ.
        Pipeline lọc đồng bộ: allow → created; mask → created với body đã che; block → system.command.failed CHAT_CONTENT_BLOCKED;
        hold_for_review → chat.message.held (chỉ người gửi). Người gửi nhận chat.message.acked (Sent) chỉ sau khi NATS JetStream ack;
        NATS lỗi → system.command.failed CHAT_TEMPORARILY_UNAVAILABLE (ADR-0035).
      payload:
        allOf:
          - $ref: '#/components/schemas/ClientEnvelope'
          - type: object
            properties:
              type: { const: chat.message.send }
              payload:
                type: object
                required: [channel_id, kind]
                properties:
                  channel_id: { $ref: '#/components/schemas/Uuid' }
                  client_msg_id: { $ref: '#/components/schemas/Uuid' }
                  kind: { type: string, enum: [text, quick, emoji, sticker, gif] }
                  body: { type: string, maxLength: 300 }
                  quick_message_id: { type: string, maxLength: 64 }
                  emoji: { type: string, maxLength: 64 }
                  sticker_id: { $ref: '#/components/schemas/Uuid' }
                  gif_id: { $ref: '#/components/schemas/Uuid' }
                  reply_to_message_id: { $ref: '#/components/schemas/Uuid' }
                  quote:
                    type: object
                    required: [message_id]
                    properties:
                      message_id: { $ref: '#/components/schemas/Uuid' }
                      excerpt_start: { type: integer, minimum: 0 }
                      excerpt_end: { type: integer, minimum: 0 }
                  mentions: { type: array, maxItems: 5, items: { $ref: '#/components/schemas/Uuid' } }
    ChatReactionToggle:
      name: chat.reaction.toggle
      payload:
        allOf:
          - $ref: '#/components/schemas/ClientEnvelope'
          - type: object
            properties:
              type: { const: chat.reaction.toggle }
              payload:
                type: object
                required: [message_id, reaction]
                properties:
                  message_id: { $ref: '#/components/schemas/Uuid' }
                  reaction: { type: string, maxLength: 64, description: Mã reaction trong danh sách cho phép. }
    ChatHistoryFetch:
      name: chat.history.fetch
      payload:
        allOf:
          - $ref: '#/components/schemas/ClientEnvelope'
          - type: object
            properties:
              type: { const: chat.history.fetch }
              payload:
                type: object
                required: [channel_id]
                properties:
                  channel_id: { $ref: '#/components/schemas/Uuid' }
                  before_seq: { type: integer }
                  limit: { type: integer, minimum: 1, maximum: 50, default: 30 }
    ChatMessageCreated:
      name: chat.message.created
      payload:
        allOf:
          - $ref: '#/components/schemas/ServerEnvelope'
          - type: object
            properties:
              type: { const: chat.message.created }
              payload: { $ref: '#/components/schemas/ChatMessage' }
    ChatMessageHeld:
      name: chat.message.held
      summary: Chỉ gửi cho người gửi — tin đang chờ kiểm duyệt, chưa phát tới người khác.
      payload:
        allOf:
          - $ref: '#/components/schemas/ServerEnvelope'
          - type: object
            properties:
              type: { const: chat.message.held }
              payload:
                type: object
                required: [message_id, channel_id]
                properties:
                  message_id: { $ref: '#/components/schemas/Uuid' }
                  channel_id: { $ref: '#/components/schemas/Uuid' }
                  notice: { type: string, maxLength: 1000, description: 'Thông điệp thân thiện, vd. "Tin nhắn đang được kiểm tra an toàn".' }
    ChatMessageRemoved:
      name: chat.message.removed
      payload:
        allOf:
          - $ref: '#/components/schemas/ServerEnvelope'
          - type: object
            properties:
              type: { const: chat.message.removed }
              payload:
                type: object
                required: [message_id, channel_id]
                properties:
                  message_id: { $ref: '#/components/schemas/Uuid' }
                  channel_id: { $ref: '#/components/schemas/Uuid' }
                  reason: { type: string, enum: [moderation, sender_deleted, retention] }
    ChatReactionUpdated:
      name: chat.reaction.updated
      payload:
        allOf:
          - $ref: '#/components/schemas/ServerEnvelope'
          - type: object
            properties:
              type: { const: chat.reaction.updated }
              payload:
                type: object
                required: [message_id, channel_id, reactions]
                properties:
                  message_id: { $ref: '#/components/schemas/Uuid' }
                  channel_id: { $ref: '#/components/schemas/Uuid' }
                  reactions:
                    type: object
                    additionalProperties: { type: integer }
    ChatUnreadUpdated:
      name: chat.unread.updated

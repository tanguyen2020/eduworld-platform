    # ======================= BATTLE =======================
    BattleAnswerSubmit:
      name: battle.answer.submit
      summary: Server gắn received_at (server time). Trễ hơn deadline + 300ms grace → ANSWER_LATE. Mỗi câu chỉ một lần.
      payload:
        allOf:
          - $ref: '#/components/schemas/ClientEnvelope'
          - type: object
            properties:
              type: { const: battle.answer.submit }
              payload:
                type: object
                required: [match_id, question_instance_id, response]
                properties:
                  match_id: { $ref: '#/components/schemas/Uuid' }
                  question_instance_id: { type: string, maxLength: 64 }
                  response: { $ref: '#/components/schemas/AnswerResponse' }
                  client_elapsed_ms: { type: integer, description: Chỉ tham khảo cho anti-cheat, không dùng chấm điểm. }
    BattleStateRequest:
      name: battle.state.request
      summary: Yêu cầu snapshot đầy đủ (sau reconnect hoặc lệch state_version).
      payload:
        allOf:
          - $ref: '#/components/schemas/ClientEnvelope'
          - type: object
            properties:
              type: { const: battle.state.request }
              payload:
                type: object
                required: [match_id]
                properties:
                  match_id: { $ref: '#/components/schemas/Uuid' }
    BattleStateSnapshot:
      name: battle.state.snapshot
      payload:
        allOf:
          - $ref: '#/components/schemas/ServerEnvelope'
          - type: object
            properties:
              type: { const: battle.state.snapshot }
              payload:
                type: object
                required: [match_id, state, state_version, participants]
                properties:
                  match_id: { $ref: '#/components/schemas/Uuid' }
                  mode: { type: string, enum: [battle_1v1, team_battle, timed_quiz, tournament] }
                  state: { type: string, enum: [lobby, ready_check, countdown, question_shown, reveal, round_end, paused, finalizing, ended, cancelled] }
                  state_version: { type: integer }
                  round: { type: integer }
                  question_index: { type: integer }
                  question_count: { type: integer }
                  current_question: { $ref: '#/components/schemas/QuestionRender' }
                  deadline_at: { $ref: '#/components/schemas/EpochMs' }
                  my_answer_locked: { type: boolean }
                  participants:
                    type: array
                    items:
                      type: object
                      properties:
                        player: { $ref: '#/components/schemas/PublicPlayer' }
                        team: { type: integer }
                        score: { type: integer }
                        connected: { type: boolean }
    BattleCountdownStarted:

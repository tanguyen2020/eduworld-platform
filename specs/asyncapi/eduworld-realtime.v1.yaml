    BattleMatchPaused:
      name: battle.match.paused
      payload:
        allOf:
          - $ref: '#/components/schemas/ServerEnvelope'
          - type: object
            properties:
              type: { const: battle.match.paused }
              payload:
                type: object
                required: [match_id, reason, resume_deadline_at]
                properties:
                  match_id: { $ref: '#/components/schemas/Uuid' }
                  reason: { type: string, enum: [participant_disconnected, server_failover] }
                  resume_deadline_at: { $ref: '#/components/schemas/EpochMs' }
    BattleMatchResumed:
      name: battle.match.resumed
      payload:
        allOf:
          - $ref: '#/components/schemas/ServerEnvelope'
          - type: object
            properties:
              type: { const: battle.match.resumed }
              payload:
                type: object
                required: [match_id]
                properties:
                  match_id: { $ref: '#/components/schemas/Uuid' }
                  replay_current_question: { type: boolean, description: 'true khi failover — câu dở được làm lại.' }
    BattleMatchEnded:
      name: battle.match.ended
      summary: Kết quả đã được ghi bền vững (MatchResult unique theo match_id). Rating/XP cập nhật bất đồng bộ qua event.
      payload:
        allOf:
          - $ref: '#/components/schemas/ServerEnvelope'
          - type: object
            properties:
              type: { const: battle.match.ended }
              payload:
                type: object
                required: [match_id, status, results]

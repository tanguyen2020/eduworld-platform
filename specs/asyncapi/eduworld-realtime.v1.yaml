                  match_id: { $ref: '#/components/schemas/Uuid' }
                  status: { type: string, enum: [completed, aborted, cancelled] }
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        user_id: { $ref: '#/components/schemas/Uuid' }
                        team: { type: integer }
                        outcome: { type: string, enum: [win, loss, draw, abandoned, forfeit, no_contest] }
                        score: { type: integer }
                        correct_count: { type: integer }
                        competition_points: { type: integer }
                  end_reason: { type: string, enum: [finished, abandon, forfeit, all_left, server_failure, plan_failure], description: 'Lý do kết thúc (F105).' }
                  rated: { type: boolean, description: 'false khi aborted / chế độ không tính rating.' }
                  review_available: { type: boolean, description: 'Có thể xem lại câu sai qua REST.' }
                  top:
                    type: array
                    maxItems: 5
                    description: 'Timed Quiz lớp ≥ 4: top 5 theo điểm (nickname do client lấy từ snapshot, không tên thật). Không gửi cho lớp 1–3 (COMPETITION_SYSTEM §3.4).'
                    items:
                      type: object
                      properties:
                        user_id: { $ref: '#/components/schemas/Uuid' }
                        rank: { type: integer, minimum: 1 }
                        score: { type: integer }
                  my_rank: { type: integer, minimum: 1, description: 'Timed Quiz lớp ≥ 4: vị trí của chính người nhận (message gửi riêng từng người).' }
                  grade_goal:
                    type: object
                    description: 'Timed Quiz lớp 1–3 (thử thách khối grade_challenge, ADR-0095): tiến độ tập thể (tổng câu đúng so với mục tiêu), không thứ hạng cá nhân, không nickname người khác; contributors_count ẩn khi < 5 học sinh.'
                    properties:
                      current: { type: integer, minimum: 0 }
                      target: { type: integer, minimum: 0 }
                      reached: { type: boolean }
                      contributors_count: { type: integer, minimum: 5 }

    # ======================= COOP =======================
    # ---------- boss / challenge / progression (CHALLENGE_BOSS_SYSTEM, PROGRESSION_SYSTEM) — module game qua ew.cmd.game.*
    BossEncounterReady:
      name: boss.encounter.ready
      summary: Báo sẵn sàng trong lobby encounter (gateway → NATS ew.cmd.game.boss.ready). Tạo encounter đi qua REST.
      payload:
        allOf:
          - $ref: '#/components/schemas/ClientEnvelope'
          - type: object
            properties:
              type: { const: boss.encounter.ready }
              payload:
                type: object
                required: [encounter_id, ready]
                properties:
                  encounter_id: { $ref: '#/components/schemas/Uuid' }
                  ready: { type: boolean }
    BossAnswerSubmit:
      name: boss.answer.submit
      summary: Nộp câu trả lời cho yêu cầu của phase hiện tại (ew.cmd.game.boss.answer); module game gọi module learning chấm. Phase đã đóng → BOSS_PHASE_CLOSED.
      payload:
        allOf:
          - $ref: '#/components/schemas/ClientEnvelope'
          - type: object
            properties:
              type: { const: boss.answer.submit }
              payload:
                type: object
                required: [encounter_id, phase_id, requirement_id, question_instance_id, response]
                properties:
                  encounter_id: { $ref: '#/components/schemas/Uuid' }
                  phase_id: { type: string, maxLength: 64 }
                  requirement_id: { type: string, maxLength: 64 }
                  question_instance_id: { type: string, maxLength: 64 }
                  response: { $ref: '#/components/schemas/AnswerResponse' }
                  client_elapsed_ms: { type: integer, minimum: 0, description: Chỉ tham khảo cho anti-cheat. }
    BossEncounterUpdated:
      name: boss.encounter.updated
      summary: Trạng thái encounter thay đổi (thành viên, sẵn sàng, năng lượng boss). Không công bố xếp hạng đóng góp trong nhóm.
      payload:
        allOf:
          - $ref: '#/components/schemas/ServerEnvelope'
          - type: object
            properties:
              type: { const: boss.encounter.updated }
              payload:
                type: object
                required: [encounter_id, status, state_version]
                properties:
                  encounter_id: { $ref: '#/components/schemas/Uuid' }
                  state_version: { type: integer, minimum: 0 }
                  status: { type: string, enum: [lobby, phase_active, phase_transition, phase_retry, defeated, ended] }
                  current_phase: { type: integer, minimum: 0 }
                  energy_remaining_pct: { type: number, minimum: 0, maximum: 100 }
                  phase_deadline_at: { type: string, format: date-time }
                  members:
                    type: array
                    maxItems: 8
                    items:
                      type: object
                      required: [student_id, nickname]
                      properties:
                        student_id: { $ref: '#/components/schemas/Uuid' }
                        nickname: { type: string, maxLength: 32 }
                        ready: { type: boolean }
                        connected: { type: boolean }
                        contribution_met: { type: boolean }
    BossPhaseStarted:
      name: boss.phase.started
      payload:
        allOf:
          - $ref: '#/components/schemas/ServerEnvelope'
          - type: object
            properties:
              type: { const: boss.phase.started }
              payload:
                type: object
                required: [encounter_id, phase_id, phase_index, deadline_at]
                properties:
                  encounter_id: { $ref: '#/components/schemas/Uuid' }
                  phase_id: { type: string, maxLength: 64 }
                  phase_index: { type: integer, minimum: 0 }
                  deadline_at: { type: string, format: date-time }
                  retry: { type: boolean, description: true khi bắt đầu lại phase với câu hỏi mới (on_fail retry_phase) }
                  presentation_ref: { type: string, maxLength: 128, description: Khóa hoạt ảnh/câu thoại boss trong gói nội dung đã ghim }
    BossPhaseCompleted:
      name: boss.phase.completed
      payload:
        allOf:
          - $ref: '#/components/schemas/ServerEnvelope'
          - type: object
            properties:
              type: { const: boss.phase.completed }
              payload:
                type: object
                required: [encounter_id, phase_id, phase_index, energy_remaining_pct]
                properties:
                  encounter_id: { $ref: '#/components/schemas/Uuid' }
                  phase_id: { type: string, maxLength: 64 }
                  phase_index: { type: integer, minimum: 0 }
                  energy_remaining_pct: { type: number, minimum: 0, maximum: 100 }
                  next_phase_index: { type: [integer, 'null'], minimum: 0 }
    BossEncounterEnded:
      name: boss.encounter.ended
      summary: Kết thúc encounter. Phần thưởng chỉ cho người đạt min_contribution; kết quả học tập ghi riêng từng học sinh.
      payload:
        allOf:
          - $ref: '#/components/schemas/ServerEnvelope'
          - type: object
            properties:
              type: { const: boss.encounter.ended }
              payload:
                type: object
                required: [encounter_id, outcome]
                properties:
                  encounter_id: { $ref: '#/components/schemas/Uuid' }
                  outcome: { type: string, enum: [defeated, time_up, abandoned] }
                  rewards: { $ref: '#/components/schemas/RewardList' }
    ChallengeAttemptUpdated:
      name: challenge.attempt.updated
      payload:
        allOf:
          - $ref: '#/components/schemas/ServerEnvelope'
          - type: object
            properties:
              type: { const: challenge.attempt.updated }
              payload:
                type: object
                required: [challenge_attempt_id, status]
                properties:
                  challenge_attempt_id: { $ref: '#/components/schemas/Uuid' }
                  status: { type: string, enum: [in_progress, succeeded, failed, abandoned] }
                  score: { type: number, minimum: 0 }
                  lives_left: { type: integer, minimum: 0 }
                  activities_completed: { type: integer, minimum: 0 }
                  deadline_at: { type: string, format: date-time }
                  rewards: { $ref: '#/components/schemas/RewardList' }
    ProgressionXpUpdated:
      name: progression.xp.updated
      summary: XP vừa được cộng (server-authoritative, sau khi ghi xp_ledger).
      payload:
        allOf:
          - $ref: '#/components/schemas/ServerEnvelope'
          - type: object
            properties:
              type: { const: progression.xp.updated }
              payload:
                type: object
                required: [delta, xp_total, xp_in_level]
                properties:
                  delta: { type: integer }
                  xp_total: { type: integer, minimum: 0 }
                  xp_in_level: { type: integer, minimum: 0 }
                  xp_to_next: { type: [integer, 'null'], minimum: 0 }
                  daily_xp_remaining: { type: integer, minimum: 0 }
                  capped: { type: boolean }
                  source_label: { $ref: '#/components/schemas/LocalizedName' }
    QuestProgressUpdated:
      name: quest.progress.updated
      summary: Tiến độ quest thay đổi sau khi server xử lý event (vd. exercise.submitted, world.discovery_found) — client cập nhật Quest Journal/HUD.
      payload:
        allOf:
          - $ref: '#/components/schemas/ServerEnvelope'
          - type: object
            properties:
              type: { const: quest.progress.updated }
              payload:
                type: object
                required: [quest_id, status]
                properties:
                  quest_id: { type: string, format: uuid }
                  quest_progress_id: { type: string, format: uuid }
                  quest_version_id: { type: string, format: uuid }
                  status: { type: string, enum: [active, completed, failed, abandoned, expired] }
                  step_id: { type: string, maxLength: 64 }
                  step_status: { type: string, enum: [locked, active, completed, failed] }
                  count: { type: integer, minimum: 0, description: Tiến độ bước collect/discover (F072) }
                  target: { type: integer, minimum: 1 }
                  passed: { type: boolean, description: 'Kết quả pass_rule của attempt vừa chấm (bước học tập, F072-AC-15); false = bước vẫn active, gợi ý ôn và thử lại' }
                  hint: { $ref: '#/components/schemas/LocalizedText', description: Gợi ý ôn của bước khi chưa đạt }
                  next_step_ids:
                    type: array
                    maxItems: 30
                    items: { type: string, maxLength: 64 }
                  progress_label: { $ref: '#/components/schemas/LocalizedName' }
                  completed_at: { type: string, format: date-time }
    WorldAreaUnlocked:
      name: world.area.unlocked
      summary: Một khu vực vừa được mở khóa cho người chơi (WORLD_DESIGN §7) — client hiển thị hiệu ứng và cập nhật bản đồ.
      payload:
        allOf:
          - $ref: '#/components/schemas/ServerEnvelope'
          - type: object
            properties:
              type: { const: world.area.unlocked }
              payload:
                type: object
                required: [area_id]
                properties:
                  area_id: { type: string, maxLength: 64 }
                  name: { $ref: '#/components/schemas/LocalizedName' }
                  unlocked_by: { type: string, enum: [level, quest, learning_objective, achievement, event, chapters_completed] }
    ProgressionLevelReached:
      name: progression.level.reached
      summary: Lên cấp — client hiển thị hiệu ứng, phần thưởng đã được cấp phía server.
      payload:
        allOf:
          - $ref: '#/components/schemas/ServerEnvelope'
          - type: object
            properties:
              type: { const: progression.level.reached }
              payload:
                type: object
                required: [from_level, to_level]
                properties:
                  from_level: { type: integer, minimum: 1 }
                  to_level: { type: integer, minimum: 1 }
                  title_code: { type: string, maxLength: 64 }
                  title: { $ref: '#/components/schemas/LocalizedName' }
                  rewards: { $ref: '#/components/schemas/RewardList' }
    EventProgressUpdated:
      name: event.progress.updated
      summary: Điểm sự kiện của người chơi thay đổi / đạt mốc (EVENT_SEASON_SYSTEM §15) — client cập nhật HUD sự kiện.
      payload:
        allOf:
          - $ref: '#/components/schemas/ServerEnvelope'
          - type: object
            properties:
              type: { const: event.progress.updated }
              payload:
                type: object
                required: [event_id, event_run_id, event_points]
                properties:
                  event_id: { $ref: '#/components/schemas/Uuid' }
                  event_run_id: { $ref: '#/components/schemas/Uuid' }
                  delta: { type: integer, minimum: 0 }
                  event_points: { type: integer, minimum: 0 }
                  daily_points_remaining: { type: integer, minimum: 0 }
                  milestones_reached:
                    type: array
                    maxItems: 20
                    items: { type: string, maxLength: 64 }
                    description: milestone_id vừa đạt (chưa nhận thưởng)
    EventCommunityGoalUpdated:
      name: event.community_goal.updated
      summary: Tiến độ community goal (gộp tối đa 1 lần/10 giây mỗi phạm vi [Proposed]) — không có xếp hạng cá nhân.
      payload:
        allOf:
          - $ref: '#/components/schemas/ServerEnvelope'
          - type: object
            properties:
              type: { const: event.community_goal.updated }
              payload:
                type: object
                required: [goal_id, target, progress]
                properties:
                  goal_id: { $ref: '#/components/schemas/Uuid' }
                  event_run_id: { $ref: '#/components/schemas/Uuid' }
                  scope: { type: string, enum: [school, tenant, platform] }
                  target: { type: integer, minimum: 1 }
                  progress: { type: integer, minimum: 0 }
                  milestone_reached: { type: integer, minimum: 0, maximum: 100, description: Mốc % vừa đạt (25/50/75/100) nếu có }
    EventStatusChanged:
      name: event.status.changed
      summary: Sự kiện bắt đầu/kết thúc/bị tạm dừng/hủy — client làm mới danh sách sự kiện (GET /game/events).
      payload:
        allOf:
          - $ref: '#/components/schemas/ServerEnvelope'
          - type: object
            properties:
              type: { const: event.status.changed }
              payload:
                type: object
                required: [event_id, event_run_id, status]
                properties:
                  event_id: { $ref: '#/components/schemas/Uuid' }
                  event_run_id: { $ref: '#/components/schemas/Uuid' }
                  status: { type: string, enum: [live, suspended, ended, cancelled] }
                  name: { $ref: '#/components/schemas/TenantLocalizedName' }
    SeasonTrackUpdated:
      name: season.track.updated
      summary: Điểm/cấp season track thay đổi (EVENT_SEASON_SYSTEM §7).
      payload:
        allOf:
          - $ref: '#/components/schemas/ServerEnvelope'
          - type: object
            properties:
              type: { const: season.track.updated }
              payload:
                type: object
                required: [season_id, points, tier]
                properties:
                  season_id: { $ref: '#/components/schemas/Uuid' }
                  delta: { type: integer, minimum: 0 }
                  points: { type: integer, minimum: 0 }
                  tier: { type: integer, minimum: 0 }
                  tier_reached: { type: boolean, description: true khi vừa lên cấp mới }
                  daily_points_remaining: { type: integer, minimum: 0 }
    CoopActionPerform:
      name: coop.action.perform
      summary: Hành động gameplay trong puzzle co-op (đặt mảnh, kéo vật thể, kích hoạt công tắc...). Server validate theo MiniGameConfig.
      payload:
        allOf:
          - $ref: '#/components/schemas/ClientEnvelope'
          - type: object
            properties:
              type: { const: coop.action.perform }
              payload:
                type: object
                required: [room_id, state_version, action_type]
                properties:
                  room_id: { type: string, maxLength: 64 }
                  state_version: { type: integer, description: Phiên bản state client đang thấy (optimistic concurrency). }
                  action_type: { type: string, maxLength: 64 }
                  data: { type: object }
    CoopAnswerSubmit:
      name: coop.answer.submit
      summary: Câu trả lời học tập của cá nhân trong co-op — ghi attempt riêng từng học sinh.
      payload:
        allOf:
          - $ref: '#/components/schemas/ClientEnvelope'
          - type: object
            properties:
              type: { const: coop.answer.submit }
              payload:
                type: object
                required: [room_id, task_id, question_instance_id, response]
                properties:
                  room_id: { type: string, maxLength: 64 }
                  task_id: { type: string, maxLength: 64 }
                  question_instance_id: { type: string, maxLength: 64 }
                  response: { $ref: '#/components/schemas/AnswerResponse' }
    CoopStateSnapshot:
      name: coop.state.snapshot
      payload:
        allOf:
          - $ref: '#/components/schemas/ServerEnvelope'
          - type: object
            properties:
              type: { const: coop.state.snapshot }
              payload:
                type: object
                required: [room_id, state_version, puzzle_state, members]
                properties:
                  room_id: { type: string, maxLength: 64 }
                  party_id: { $ref: '#/components/schemas/Uuid' }
                  quest_version_id: { $ref: '#/components/schemas/Uuid' }
                  state_version: { type: integer }
                  puzzle_state: { type: object }
                  members: { type: array, items: { $ref: '#/components/schemas/PartyMemberState' } }
                  shared_progress: { type: number, minimum: 0, maximum: 1 }
    CoopStateUpdated:
      name: coop.state.updated
      payload:
        allOf:
          - $ref: '#/components/schemas/ServerEnvelope'
          - type: object
            properties:
              type: { const: coop.state.updated }
              payload:
                type: object
                required: [room_id, state_version, patch]
                properties:
                  room_id: { type: string, maxLength: 64 }
                  state_version: { type: integer }
                  actor_id: { $ref: '#/components/schemas/Uuid' }
                  patch: { type: array, description: 'JSON Patch (RFC 6902) trên puzzle_state.', items: { type: object } }
    CoopTaskAssigned:
      name: coop.task.assigned
      payload:
        allOf:
          - $ref: '#/components/schemas/ServerEnvelope'
          - type: object
            properties:
              type: { const: coop.task.assigned }
              payload:
                type: object
                required: [room_id, task_id, assignee_id]
                properties:
                  room_id: { type: string, maxLength: 64 }
                  task_id: { type: string, maxLength: 64 }
                  assignee_id: { $ref: '#/components/schemas/Uuid' }
                  question: { $ref: '#/components/schemas/QuestionRender' }
                  reassigned_from: { $ref: '#/components/schemas/Uuid' }
    CoopAnswerEvaluated:
      name: coop.answer.evaluated
      payload:
        allOf:
          - $ref: '#/components/schemas/ServerEnvelope'
          - type: object
            properties:
              type: { const: coop.answer.evaluated }
              payload:
                type: object
                required: [room_id, task_id, is_correct]
                properties:
                  room_id: { type: string, maxLength: 64 }
                  task_id: { type: string, maxLength: 64 }
                  is_correct: { type: boolean }
                  explanation: { type: object }
                  attempts_left: { type: integer }
    CoopProgressUpdated:
      name: coop.progress.updated
      payload:
        allOf:
          - $ref: '#/components/schemas/ServerEnvelope'
          - type: object
            properties:
              type: { const: coop.progress.updated }
              payload:
                type: object
                required: [room_id, shared_progress]
                properties:
                  room_id: { type: string, maxLength: 64 }
                  shared_progress: { type: number, minimum: 0, maximum: 1 }
                  step_id: { type: string, maxLength: 64 }
                  contributions:
                    type: object
                    description: user_id → số task hoàn thành (hiển thị khích lệ, không phải điểm học tập).
                    additionalProperties: { type: integer }
    CoopSessionEnded:
      name: coop.session.ended
      payload:
        allOf:
          - $ref: '#/components/schemas/ServerEnvelope'
          - type: object
            properties:
              type: { const: coop.session.ended }
              payload:
                type: object
                required: [room_id, outcome]
                properties:
                  room_id: { type: string, maxLength: 64 }
                  outcome: { type: string, enum: [completed, failed, abandoned, aborted] }
                  quest_step_completed: { type: boolean }
                  rewards_pending: { type: boolean, description: 'Reward trao bất đồng bộ qua event; client nhận reward.granted qua notification.' }

              payload:
                type: object
                required: [match_id, room_id, mode]
                properties:
                  match_id: { $ref: '#/components/schemas/Uuid' }
                  room_id: { type: string, maxLength: 64 }
                  mode: { type: string, maxLength: 64 }
                  scene_ref: { type: string, maxLength: 255 }

    # ======================= HUB =======================
    HubInstanceJoin:
      name: hub.instance.join
      summary: Yêu cầu vào một khu vực (area transition). Server chọn instance (ưu tiên bạn bè/party).
      payload:
        allOf:
          - $ref: '#/components/schemas/ClientEnvelope'
          - type: object
            properties:
              type: { const: hub.instance.join }
              payload:
                type: object
                required: [area_id]
                properties:
                  area_id: { type: string, maxLength: 64, description: 'Danh sách chuẩn ở docs/01-game-design/WORLD_DESIGN.md §3: main_hub, practice_zone, social_zone, learning_zone.math|vietnamese|english|science|history, quest_zone.discovery_ocean, exam_zone, challenge_mountain, arena' }
                  spawn_point: { type: string, maxLength: 64 }
    HubPlayerMove:
      name: hub.player.move
      summary: ≤10 Hz, chỉ khi thay đổi (+1 Hz khi đứng yên). Không ack. Server validate tốc độ/biên.
      payload:
        allOf:
          - $ref: '#/components/schemas/ClientEnvelope'
          - type: object
            properties:
              type: { const: hub.player.move }
              payload:
                type: object
                required: [room_id, client_seq, p, r]
                properties:
                  room_id: { type: string, maxLength: 64 }
                  client_seq: { type: integer }
                  p: { $ref: '#/components/schemas/Vec3' }
                  r: { type: number }
                  v: { $ref: '#/components/schemas/Vec3' }
                  a: { type: string, maxLength: 255 }
    HubPlayerEmote:
      name: hub.player.emote
      payload:
        allOf:
          - $ref: '#/components/schemas/ClientEnvelope'
          - type: object
            properties:
              type: { const: hub.player.emote }
              payload:
                type: object
                required: [room_id, emote_id]
                properties:
                  room_id: { type: string, maxLength: 64 }
                  emote_id: { type: string, maxLength: 64, description: Emote phải có trong inventory. }
    HubInstanceAssigned:
      name: hub.instance.assigned
      payload:
        allOf:
          - $ref: '#/components/schemas/ServerEnvelope'
          - type: object
            properties:
              type: { const: hub.instance.assigned }
              payload:
                type: object
                required: [room_id, area_id, self_eid, spawn, tick_rate_hz]
                properties:
                  room_id: { type: string, maxLength: 64 }
                  area_id: { type: string, maxLength: 64 }
                  scene_ref: { type: string, maxLength: 255 }
                  self_eid: { type: integer }
                  spawn: { $ref: '#/components/schemas/Vec3' }
                  tick_rate_hz: { type: integer, default: 10 }
                  max_speed_mps: { type: number }
                  players:
                    type: array
                    items:
                      type: object
                      properties:
                        eid: { type: integer }
                        player: { $ref: '#/components/schemas/PublicPlayer' }
                        state: { $ref: '#/components/schemas/HubEntity' }
    HubSnapshotUpdated:
      name: hub.snapshot.updated
      summary: Delta snapshot 10 Hz, đã lọc theo interest grid. Droppable (chỉ giữ bản mới nhất khi queue đầy).
      payload:
        allOf:
          - $ref: '#/components/schemas/ServerEnvelope'
          - type: object
            properties:
              type: { const: hub.snapshot.updated }
              payload:
                type: object
                required: [room_id, tick, entities]
                properties:
                  room_id: { type: string, maxLength: 64 }
                  tick: { type: integer }
                  ack_client_seq: { type: integer, description: client_seq cuối cùng server đã xử lý của chính người nhận. }
                  entities: { type: array, items: { $ref: '#/components/schemas/HubEntity' } }
                  removed: { type: array, items: { type: integer } }
    HubPlayerJoined:
      name: hub.player.joined
      payload:
        allOf:
          - $ref: '#/components/schemas/ServerEnvelope'
          - type: object
            properties:
              type: { const: hub.player.joined }
              payload:
                type: object
                required: [room_id, eid, player]
                properties:
                  room_id: { type: string, maxLength: 64 }
                  eid: { type: integer }
                  player: { $ref: '#/components/schemas/PublicPlayer' }
                  state: { $ref: '#/components/schemas/HubEntity' }
    HubPlayerLeft:
      name: hub.player.left
      payload:
        allOf:
          - $ref: '#/components/schemas/ServerEnvelope'
          - type: object
            properties:
              type: { const: hub.player.left }
              payload:
                type: object
                required: [room_id, eid]
                properties:
                  room_id: { type: string, maxLength: 64 }
                  eid: { type: integer }
    HubPlayerEmoted:
      name: hub.player.emoted
      payload:
        allOf:
          - $ref: '#/components/schemas/ServerEnvelope'
          - type: object
            properties:
              type: { const: hub.player.emoted }
              payload:
                type: object
                required: [room_id, eid, emote_id]
                properties:
                  room_id: { type: string, maxLength: 64 }
                  eid: { type: integer }
                  emote_id: { type: string, maxLength: 64 }
    HubPlayerAppearanceChanged:
      name: hub.player.appearance_changed
      summary: Người chơi trong cùng instance đổi trang phục/avatar (sau updateAvatar) — client tải lại appearance theo item_id.
      payload:
        allOf:
          - $ref: '#/components/schemas/ServerEnvelope'
          - type: object
            properties:
              type: { const: hub.player.appearance_changed }
              payload:
                type: object
                required: [room_id, eid, appearance]
                properties:
                  room_id: { type: string, maxLength: 64 }
                  eid: { type: integer }
                  appearance:
                    type: object
                    description: Bản tóm tắt avatar_config (slot → item_id), không chứa thông tin cá nhân
                    maxProperties: 16
                    additionalProperties: { type: string, maxLength: 64 }
    HubPlayerCorrected:
      name: hub.player.corrected
      summary: Server từ chối/clamp vị trí của chính người nhận — client snap/blend về vị trí này.
      payload:
        allOf:
          - $ref: '#/components/schemas/ServerEnvelope'
          - type: object
            properties:
              type: { const: hub.player.corrected }
              payload:
                type: object
                required: [room_id, client_seq, p]
                properties:
                  room_id: { type: string, maxLength: 64 }
                  client_seq: { type: integer }
                  p: { $ref: '#/components/schemas/Vec3' }
                  reason: { type: string, enum: [speed, out_of_bounds, teleport_denied] }
    HubInstanceMigrated:
      name: hub.instance.migrated
      summary: Room chuyển owner node (failover) hoặc party được dời sang instance khác.
      payload:
        allOf:
          - $ref: '#/components/schemas/ServerEnvelope'
          - type: object
            properties:
              type: { const: hub.instance.migrated }
              payload:
                type: object
                required: [old_room_id, room_id]
                properties:
                  old_room_id: { type: string, maxLength: 64 }
                  room_id: { type: string, maxLength: 64 }
                  reason: { type: string, enum: [failover, party_regroup, rebalance] }

    # ======================= BATTLE =======================
    BattleAnswerSubmit:
      name: battle.answer.submit
      summary: Server gắn received_at (server time). Trễ hơn deadline + 300ms grace → ANSWER_LATE. Mỗi câu chỉ một lần.
      payload:
        allOf:
          - $ref: '#/components/schemas/ClientEnvelope'
          - type: object
            properties:
              type: { const: battle.answer.submit }
              payload:
                type: object
                required: [match_id, question_instance_id, response]
                properties:
                  match_id: { $ref: '#/components/schemas/Uuid' }
                  question_instance_id: { type: string, maxLength: 64 }
                  response: { $ref: '#/components/schemas/AnswerResponse' }
                  client_elapsed_ms: { type: integer, description: Chỉ tham khảo cho anti-cheat, không dùng chấm điểm. }
    BattleStateRequest:
      name: battle.state.request
      summary: Yêu cầu snapshot đầy đủ (sau reconnect hoặc lệch state_version).

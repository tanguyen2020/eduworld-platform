            properties:
              type: { const: battle.question.shown }
              payload:
                type: object
                required: [match_id, round, question_index, question, deadline_at]
                properties:
                  match_id: { $ref: '#/components/schemas/Uuid' }
                  round: { type: integer }
                  question_index: { type: integer }
                  question: { $ref: '#/components/schemas/QuestionRender' }
                  shown_at: { $ref: '#/components/schemas/EpochMs' }
                  deadline_at: { $ref: '#/components/schemas/EpochMs' }
    BattleAnswerRecorded:
      name: battle.answer.recorded
      summary: Gửi cho người trả lời (đã khóa đáp án) và thông báo cho người khác rằng người này đã trả lời (không lộ nội dung).
      payload:
        allOf:
          - $ref: '#/components/schemas/ServerEnvelope'
          - type: object
            properties:
              type: { const: battle.answer.recorded }
              payload:
                type: object
                required: [match_id, question_instance_id, user_id]
                properties:
                  match_id: { $ref: '#/components/schemas/Uuid' }
                  question_instance_id: { type: string, maxLength: 64 }
                  user_id: { $ref: '#/components/schemas/Uuid' }
                  answered_count: { type: integer }
    BattleAnswerEvaluated:
      name: battle.answer.evaluated
      summary: Kết quả riêng của người nhận cho câu vừa reveal.

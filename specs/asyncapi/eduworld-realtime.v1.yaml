                  proposal_id: { $ref: '#/components/schemas/Uuid' }
                  ticket_id: { $ref: '#/components/schemas/Uuid' }
                  deadline_at: { $ref: '#/components/schemas/EpochMs' }
                  mode: { type: string, maxLength: 64 }
                  teams:
                    type: array
                    items:
                      type: array
                      items: { $ref: '#/components/schemas/Uuid' }
                  participants: { type: array, items: { $ref: '#/components/schemas/PublicPlayer' } }
    MatchmakingProposalUpdated:

                  next_round_at: { $ref: '#/components/schemas/EpochMs' }
    BattleParticipantStatusChanged:
      name: battle.participant.status_changed
      payload:
        allOf:
          - $ref: '#/components/schemas/ServerEnvelope'
          - type: object
            properties:
              type: { const: battle.participant.status_changed }
              payload:
                type: object
                required: [match_id, user_id, connected]

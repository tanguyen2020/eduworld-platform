            properties:
              type: { const: battle.question.revealed }
              payload:
                type: object
                required: [match_id, question_instance_id, scoreboard]
                properties:
                  match_id: { $ref: '#/components/schemas/Uuid' }
                  question_instance_id: { type: string, maxLength: 64 }
                  correct_rate: { type: number, minimum: 0, maximum: 1 }
                  scoreboard:
                    type: array
                    items:
                      type: object
                      properties:
                        user_id: { $ref: '#/components/schemas/Uuid' }
                        team: { type: integer }
                        is_correct: { type: boolean }
                        score: { type: integer }
                  next_at: { $ref: '#/components/schemas/EpochMs' }
    BattleRoundEnded:
      name: battle.round.ended
      payload:
        allOf:
          - $ref: '#/components/schemas/ServerEnvelope'
          - type: object
            properties:
              type: { const: battle.round.ended }
              payload:
                type: object
                required: [match_id, round, standings]
                properties:
                  match_id: { $ref: '#/components/schemas/Uuid' }
                  round: { type: integer }
                  standings:
                    type: array
                    items:
                      type: object
                      properties:
                        user_id: { $ref: '#/components/schemas/Uuid' }

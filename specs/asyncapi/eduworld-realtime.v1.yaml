components:
  securitySchemes:
    realtimeTicket:
      type: httpApiKey
      name: ticket
      in: query
      description: Ticket opaque 60s, dùng một lần (ADR-0008). Không bao giờ đặt JWT vào query string.

  schemas:
    # ================= Envelope =================
    ClientEnvelope:
      type: object
      required: [v, type, id, payload]
      additionalProperties: false
      properties:
        v: { type: integer, const: 1 }
        type: { type: string, maxLength: 64, pattern: '^[a-z_]+\.[a-z_]+\.[a-z_]+$' }
        id:
          type: string
          minLength: 10
          maxLength: 40
          description: ID lệnh do client sinh (ULID/UUIDv7); dùng ghép ack/error và chống lặp trong cửa sổ resume.
        ts: { type: integer, description: Epoch ms phía client (tham khảo). }
        payload: { type: object }
    ServerEnvelope:
      type: object
      required: [v, type, seq, ts, payload]
      additionalProperties: false
      properties:
        v: { type: integer, const: 1 }
        type: { type: string, maxLength: 64, pattern: '^[a-z_]+\.[a-z_]+\.[a-z_]+$' }
        seq:
          type: integer
          minimum: 1
          description: Số thứ tự tăng dần theo kết nối logic (giữ qua resume).
        ref: { type: string, maxLength: 255, description: '`id` của lệnh client mà message này phản hồi.' }
        ts: { type: integer, description: Epoch ms phía server (thẩm quyền). }
        payload: { type: object }

    # ================= Common =================
    RewardList:
      type: array
      maxItems: 20
      items:
        type: object
        required: [kind]
        properties:
          kind: { type: string, enum: [xp, currency, item, badge, title] }
          amount: { type: integer, minimum: 0 }
          currency_code: { type: string, maxLength: 64 }
          item_id: { $ref: '#/components/schemas/Uuid' }
          label: { $ref: '#/components/schemas/LocalizedName' }
    Uuid: { type: string, format: uuid }
    EpochMs: { type: integer, minimum: 0 }
    GradeLevel: { type: integer, minimum: 1, maximum: 9 }
    LocalizedName:
      type: object
      description: Tên/nhãn song ngữ bắt buộc vi + en (ADR-0056)
      required: [vi, en]
      additionalProperties: false
      properties:
        vi: { type: string, minLength: 1, maxLength: 255 }
        en: { type: string, minLength: 1, maxLength: 255 }
    LocalizedText:
      type: object
      description: Văn bản song ngữ bắt buộc vi + en (ADR-0056)
      required: [vi, en]
      additionalProperties: false
      properties:
        vi: { type: string, minLength: 1, maxLength: 4000 }
        en: { type: string, minLength: 1, maxLength: 4000 }
    TenantLocalizedName:
      type: object
      description: 'Tên do tenant nhập (sự kiện trường): vi bắt buộc, en tùy chọn'
      required: [vi]
      additionalProperties: false
      properties:
        vi: { type: string, minLength: 1, maxLength: 255 }
        en: { type: string, minLength: 1, maxLength: 255 }
    Vec3:
      type: array
      items: { type: number }
      minItems: 3
      maxItems: 3
      description: Vị trí mét [x, y, z], lượng tử hóa 1 cm.
    PresenceStatus:
      type: string
      description: 'Enum presence duy nhất (MULTIPLAYER_GAMEPLAY §5), dùng chung AsyncAPI, PlayerCard và REST; nguồn specs/schemas/common/enums.schema.json.'
      enum: [offline, online, in_activity, in_match, away]
    PublicPlayer:
      type: object
      description: Thông tin người chơi được phép hiển thị cho người khác (không PII).
      required: [user_id, nickname]
      properties:
        user_id: { $ref: '#/components/schemas/Uuid' }
        nickname: { type: string, maxLength: 32 }
        avatar_config: { type: object, description: 'Tham chiếu item_id cho body/hair/outfit/accessories.' }
        level: { type: integer, minimum: 1 }
        tier: { type: string, maxLength: 64, description: 'Hạng thi đấu dạng thân thiện (không lộ rating số).' }
    ErrorCode:
      type: string
      enum:
        - BAD_REQUEST
        - UNKNOWN_TYPE
        - VALIDATION_FAILED
        - UNAUTHENTICATED
        - PERMISSION_DENIED
        - GAME_ACCESS_STUDENT_ONLY
        - NOT_FOUND
        - CONFLICT
        - RATE_LIMITED
        - POLICY_DENIED
        - CHAT_CONTENT_BLOCKED
        - CHAT_NOT_ALLOWED
        - CHAT_KIND_NOT_ALLOWED
        - CHAT_RATE_LIMITED
        - CHAT_MUTED
        - CHAT_CHANNEL_CLOSED
        - CURFEW_ACTIVE
        - BOSS_ENCOUNTER_FULL
        - BOSS_PHASE_CLOSED
        - CHALLENGE_NOT_ELIGIBLE
        - CHAT_EDIT_WINDOW_EXPIRED
        - CHAT_RECALL_WINDOW_EXPIRED
        - CHAT_FORWARD_NOT_ALLOWED
        - CHAT_PIN_LIMIT_REACHED
        - CHAT_MENTION_LIMIT
        - CHAT_REACTION_LIMIT
        - CHAT_TEMPORARILY_UNAVAILABLE
        - CHAT_FEATURE_DISABLED
        - CHAT_ASSET_NOT_AVAILABLE
        - PARTY_NOT_LEADER
        - PARTY_NOT_READY
        - PARTY_ACTIVITY_NOT_ELIGIBLE
        - ROOM_FULL
        - ROOM_NOT_MEMBER
        - ANSWER_LATE
        - ANSWER_ALREADY_SUBMITTED
        - MATCH_NOT_ACTIVE
        - PROPOSAL_EXPIRED
        - INTERNAL
        - UNAVAILABLE
    ChatChannelType:
      type: string
      description: Không còn class, study_group (ADR-0095).
      enum: [world, area, match, party, team, direct]
    ChatMessageKind:
      type: string
      enum: [text, quick, emoji, sticker, gif, system]
    ChatMessage:
      type: object
      required: [message_id, channel_id, seq, sender, kind, created_at]
      properties:
        message_id: { $ref: '#/components/schemas/Uuid' }
        channel_id: { $ref: '#/components/schemas/Uuid' }
        seq: { type: integer, description: Thứ tự tin trong channel. }
        sender: { $ref: '#/components/schemas/PublicPlayer' }
        kind: { $ref: '#/components/schemas/ChatMessageKind' }
        body: { type: string, maxLength: 500, description: 'Nội dung đã chuẩn hóa/che (masked) sau moderation.' }
        quick_message_id:
          type: string
          maxLength: 64
          description: 'kind=quick: client hiển thị văn bản theo locale của người nhận (GET /chat/quick-messages)'
        system_code:
          type: string
          maxLength: 128
          description: 'kind=system: mã thông điệp (ui.chat.system.<code>), client dựng câu theo locale'
        params:
          type: object
          maxProperties: 20
          additionalProperties: { type: string, maxLength: 255 }
          description: 'Tham số chèn vào chuỗi theo mã (client dựng câu theo locale): kind=system theo system_code; kind=quick theo quick message (đã qua pipeline kiểm duyệt, F116-AC-28)'
        emoji: { type: string, maxLength: 64 }
        sticker_id: { $ref: '#/components/schemas/Uuid' }
        gif_id: { $ref: '#/components/schemas/Uuid' }
        reply_to_message_id: { $ref: '#/components/schemas/Uuid' }
        reply_excerpt: { type: string, maxLength: 80, description: 'Trích ngắn từ nội dung đã che của tin được trả lời; vắng mặt khi tin gốc đã thu hồi/gỡ (F118-AC-05, AC-07)' }
        quote:
          type: object
          properties:
            message_id: { $ref: '#/components/schemas/Uuid' }
            excerpt: { type: string, maxLength: 200, description: Cắt từ nội dung đã che }
        forwarded_from:
          type: object
          properties:
            message_id: { $ref: '#/components/schemas/Uuid' }
            channel_type: { $ref: '#/components/schemas/ChatChannelType' }
            sender_nickname: { type: string, maxLength: 32 }
        mentions: { type: array, items: { $ref: '#/components/schemas/PublicPlayer' } }
        reactions:
          type: object
          additionalProperties: { type: integer }
        revision: { type: integer, minimum: 1 }
        edited_at: { $ref: '#/components/schemas/EpochMs' }
        recalled: { type: boolean }
        pinned: { type: boolean }
        moderation_state: { type: string, enum: [allowed, masked, unchecked, held], description: "held chỉ xuất hiện trong lịch sử của chính người gửi (F115-AC-18)" }
        created_at: { $ref: '#/components/schemas/EpochMs' }
    PartyMemberState:
      type: object
      required: [player, role, status, ready]
      properties:
        player: { $ref: '#/components/schemas/PublicPlayer' }
        role: { type: string, enum: [leader, member] }
        status: { type: string, enum: [online, away, in_activity, disconnected] }
        ready: { type: boolean }
        joined_at: { $ref: '#/components/schemas/EpochMs' }
    PartyActivityType:
      type: string
      description: 'Một enum loại hoạt động party (PARTY_SYSTEM §5); nguồn specs/schemas/common/enums.schema.json. M4a chỉ bật explore, quest, boss.'
      enum: [explore, quest, boss, learning_challenge, coop_challenge, team_battle]
    PartyIneligibleMember:
      type: object
      required: [user_id, reason_code]
      properties:
        user_id: { $ref: '#/components/schemas/Uuid' }
        reason_code: { type: string, enum: [grade_not_allowed, grade_band_mismatch, prerequisite_missing, area_locked, attempt_limit, sanctioned, not_online] }
        requirement: { type: string, maxLength: 255, description: 'Yêu cầu của hoạt động (vd. "grade_levels:4"), không phải dữ liệu của học sinh' }
    ActivityRef:
      type: object
      required: [kind, id]
      properties:
        kind: { $ref: '#/components/schemas/PartyActivityType' }
        id: { type: string, maxLength: 64, pattern: '^[a-z0-9_.-]{1,64}$', description: 'area_id (explore) / quest_id (quest) / boss_id (boss)' }
        title: { type: string, maxLength: 255 }
    QuestionRender:
      type: object
      description: Render payload câu hỏi — KHÔNG chứa answer key / scoring rule (ADR-0016).
      required: [question_instance_id, question_type, stem]
      properties:
        question_instance_id: { type: string, maxLength: 64, description: 'ID duy nhất cho câu hỏi trong trận/phiên (không lộ question_version_id).' }
        question_type: { $ref: '#/components/schemas/QuestionType' }
        stem: { type: object, description: 'Rich content (text/latex/media refs).' }
        options:
          type: array
          items:
            type: object
            required: [option_id]
            properties:
              option_id: { type: string, maxLength: 64 }
              content: { type: object }
        media: { type: array, items: { type: object } }
        time_limit_ms: { type: integer }
    QuestionType:
      type: string
      description: Loại câu hỏi — giá trị đồng bộ với specs/schemas/common/enums.schema.json#/$defs/QuestionType.
      enum: [single_choice, multiple_choice, true_false, fill_in_blank, short_answer, numeric, matching, ordering, drag_drop, image_based, interactive]
    AttemptMode:
      type: string
      description: Chế độ attempt — đồng bộ với specs/schemas/common/enums.schema.json#/$defs/AttemptMode.
      enum: [practice, assignment, quest, minigame, challenge, exam, competition, retry_wrong, diagnostic]
    AttemptStatus:
      type: string
      description: Trạng thái attempt — đồng bộ với specs/schemas/common/enums.schema.json#/$defs/AttemptStatus.
      enum: [in_progress, submitted, graded, expired, abandoned]
    ItemId: { type: string, maxLength: 64, pattern: '^[a-z]_[a-z0-9_]{1,24}$' }
    AnswerResponse:
      description: |
        Câu trả lời thô theo loại câu hỏi — shape y hệt specs/schemas/question.schema.json#/$defs/response và
        OpenAPI `QuestionResponse`. Server biết loại câu từ question_instance_id; client không gửi điểm (ADR-0016).
      oneOf:
        - title: single_choice
          type: object
          required: [option_id]
          additionalProperties: false
          properties:
            option_id: { $ref: '#/components/schemas/ItemId' }
        - title: multiple_choice
          type: object
          required: [option_ids]
          additionalProperties: false
          properties:
            option_ids:
              type: array
              minItems: 1
              maxItems: 10
              uniqueItems: true
              items: { $ref: '#/components/schemas/ItemId' }
        - title: true_false
          type: object
          required: [value]
          additionalProperties: false
          properties:
            value: { type: boolean }
        - title: true_false_statements
          type: object
          required: [statement_values]
          additionalProperties: false
          properties:
            statement_values:
              type: object
              minProperties: 1
              maxProperties: 8
              propertyNames: { $ref: '#/components/schemas/ItemId' }
              additionalProperties: { type: boolean }
        - title: fill_in_blank
          type: object
          required: [blanks]
          additionalProperties: false
          properties:
            blanks:
              type: object
              minProperties: 1
              maxProperties: 10
              propertyNames: { $ref: '#/components/schemas/ItemId' }
              additionalProperties: { type: string, maxLength: 200 }
        - title: short_answer
          type: object
          required: [text]
          additionalProperties: false
          properties:
            text: { type: string, minLength: 1, maxLength: 500 }
        - title: numeric
          type: object
          required: [value]
          additionalProperties: false
          properties:
            value: { type: string, maxLength: 64, description: 'Chuỗi số học sinh nhập (dấu thập phân theo decimal_separator; a/b khi allow_fraction_input).' }
        - title: matching
          type: object
          required: [pairs]
          additionalProperties: false
          properties:
            pairs:
              type: array
              minItems: 1
              maxItems: 10
              items:
                type: array
                minItems: 2
                maxItems: 2
                items:
                  - { $ref: '#/components/schemas/ItemId' }
                  - { $ref: '#/components/schemas/ItemId' }
                additionalItems: false
        - title: ordering
          type: object
          required: [order]
          additionalProperties: false
          properties:
            order:
              type: array
              minItems: 3
              maxItems: 10
              uniqueItems: true
              items: { $ref: '#/components/schemas/ItemId' }
        - title: drag_drop
          type: object
          required: [placements]
          additionalProperties: false
          properties:
            placements:
              type: object
              minProperties: 1
              maxProperties: 16
              propertyNames: { $ref: '#/components/schemas/ItemId' }
              additionalProperties: { $ref: '#/components/schemas/ItemId' }
        - title: image_based_hotspot
          type: object
          required: [points]
          additionalProperties: false
          properties:
            points:
              type: array
              minItems: 1
              maxItems: 10
              items:
                type: object
                required: [x, y]
                additionalProperties: false
                properties:
                  x: { type: number }
                  y: { type: number }
        - title: image_based_label
          type: object
          required: [label_placements]
          additionalProperties: false
          properties:
            label_placements:
              type: object
              minProperties: 1
              maxProperties: 16
              propertyNames: { $ref: '#/components/schemas/ItemId' }
              additionalProperties: { $ref: '#/components/schemas/ItemId' }
        - title: interactive
          type: object
          required: [state]
          additionalProperties: false
          properties:
            state: { type: object, maxProperties: 50 }
            action_log:
              type: array
              maxItems: 500
              items:
                type: object
                required: [t_ms, action]
                additionalProperties: false
                properties:
                  t_ms: { type: integer, minimum: 0 }
                  action: { type: string, maxLength: 64 }
                  args: { type: object, maxProperties: 20 }
    HubEntity:
      type: object
      required: [eid]
      properties:
        eid: { type: integer, description: Entity id ngắn trong instance. }
        p: { $ref: '#/components/schemas/Vec3' }
        r: { type: number, description: Yaw (radian). }
        a: { type: string, maxLength: 255, description: 'Animation state: idle, walk, run, jump, emote:<id>, sit.' }

  messages:
    # ======================= SYSTEM =======================
    SystemPing:
      name: system.heartbeat.ping
      title: Heartbeat (mỗi 15s)
      summary: Không cần ack; server trả system.heartbeat.pong. Không nhận frame nào 45s → close 4408.
      payload:
        allOf:
          - $ref: '#/components/schemas/ClientEnvelope'
          - type: object
            properties:
              type: { const: system.heartbeat.ping }
              payload:
                type: object
                properties:
                  client_time: { $ref: '#/components/schemas/EpochMs' }
    SystemSessionResume:
      name: system.session.resume
      examples:
        - name: resume
          payload: {"v":1,"type":"system.session.resume","id":"0192f3a4-5b6c-7d8e-9f01-23456789abd3","ts":1763600000000,"payload":{"resume_token":"rt-example-opaque-0001","last_seq":42}}
      title: Khôi phục phiên sau reconnect
      payload:
        allOf:
          - $ref: '#/components/schemas/ClientEnvelope'
          - type: object
            properties:
              type: { const: system.session.resume }
              payload:
                type: object
                required: [resume_token, last_seq]
                properties:
                  resume_token: { type: string, maxLength: 512 }
                  last_seq: { type: integer, minimum: 0 }
    SystemSessionWelcome:
      name: system.session.welcome
      examples:
        - name: new_connection
          payload: {"v":1,"type":"system.session.welcome","seq":1,"ts":1763600000000,"payload":{"conn_id":"c-01HZX4Q7","user_id":"0b9a8f7e-1c2d-4e3f-8a9b-0c1d2e3f4a5b","game_session_id":"3f2e1d0c-9b8a-4765-8432-10fedcba9876","server_time":1763600000000,"heartbeat_s":15,"timeout_s":45,"resume_token":"rt-example-opaque-0001","resume_window_s":120,"protocol_version":1,"limits":{"max_frame_bytes":16384,"max_move_hz":10}}}
      title: Kết nối được chấp nhận
      payload:
        allOf:
          - $ref: '#/components/schemas/ServerEnvelope'
          - type: object
            properties:
              type: { const: system.session.welcome }
              payload:
                type: object
                required: [conn_id, server_time, heartbeat_s, timeout_s, resume_token, protocol_version]
                properties:
                  conn_id: { type: string, maxLength: 64 }
                  user_id: { $ref: '#/components/schemas/Uuid' }
                  game_session_id: { $ref: '#/components/schemas/Uuid' }
                  server_time: { $ref: '#/components/schemas/EpochMs' }
                  heartbeat_s: { type: integer, default: 15 }
                  timeout_s: { type: integer, default: 45 }
                  resume_token: { type: string, maxLength: 512 }
                  resume_window_s: { type: integer, default: 120 }
                  protocol_version: { type: integer, const: 1 }
                  limits:
                    type: object
                    properties:
                      max_frame_bytes: { type: integer, default: 16384 }
                      max_move_hz: { type: integer, default: 10 }
    SystemPong:
      name: system.heartbeat.pong
      examples:
        - name: pong
          payload: {"v":1,"type":"system.heartbeat.pong","seq":5,"ts":1763600015040,"payload":{"client_time":1015000,"server_time":1763600015020}}
      payload:
        allOf:
          - $ref: '#/components/schemas/ServerEnvelope'
          - type: object
            properties:
              type: { const: system.heartbeat.pong }
              payload:
                type: object
                properties:
                  client_time: { $ref: '#/components/schemas/EpochMs' }
                  server_time: { $ref: '#/components/schemas/EpochMs' }
    SystemAck:
      name: system.command.acked
      examples:
        - name: acked
          payload: {"v":1,"type":"system.command.acked","seq":3,"ts":1763600000200,"ref":"0192f3a4-5b6c-7d8e-9f01-23456789abcd","payload":{"result":{}}}
      title: Xác nhận lệnh thành công
      summary: Type thực tế là `system.command.acked`; tài liệu gọi tắt là system.ack.
      payload:
        allOf:
          - $ref: '#/components/schemas/ServerEnvelope'
          - type: object
            required: [ref]
            properties:
              type: { const: system.command.acked }
              payload:
                type: object
                properties:
                  result: { type: object, description: Dữ liệu kết quả tùy lệnh (vd. message_id). }
    SystemError:
      name: system.command.failed
      examples:
        - name: room_full
          payload: {"v":1,"type":"system.command.failed","seq":4,"ts":1763600000300,"ref":"0192f3a4-5b6c-7d8e-9f01-23456789abce","payload":{"code":"ROOM_FULL","message":"Khu này đang đông, em thử lại sau nhé."}}
      title: Lệnh thất bại / lỗi giao thức
      summary: Type thực tế là `system.command.failed`; tài liệu gọi tắt là system.error. `ref` có thể vắng nếu lỗi không gắn lệnh.
      payload:
        allOf:
          - $ref: '#/components/schemas/ServerEnvelope'
          - type: object
            properties:
              type: { const: system.command.failed }
              payload:
                type: object
                required: [code, message]
                properties:
                  code: { $ref: '#/components/schemas/ErrorCode' }
                  message: { type: string, maxLength: 1000, description: Thông điệp thân thiện (vi-VN) có thể hiển thị. }
                  retry_after_ms: { type: integer }
                  details:
                    type: object
                    description: Chi tiết ổn định của lỗi; CHAT_CONTENT_BLOCKED chỉ có category_code (không có từ đã khớp hay vị trí — ADR-0030, F116-AC-05)
                    properties:
                      category_code: { type: string, maxLength: 64 }
    SystemSessionResumed:
      name: system.session.resumed
      examples:
        - name: resumed
          payload: {"v":1,"type":"system.session.resumed","seq":43,"ts":1763600060000,"payload":{"replayed":2,"rejoined_rooms":["hub:main_hub:01"]}}
      summary: Gửi sau khi replay xong các message seq > last_seq.
      payload:
        allOf:
          - $ref: '#/components/schemas/ServerEnvelope'
          - type: object
            properties:
              type: { const: system.session.resumed }
              payload:
                type: object
                properties:
                  replayed: { type: integer }
                  rejoined_rooms: { type: array, items: { type: string, maxLength: 64 } }
    SystemSessionResumeFailed:
      name: system.session.resume_failed
      examples:
        - name: expired
          payload: {"v":1,"type":"system.session.resume_failed","seq":2,"ts":1763600060000,"payload":{"reason":"expired"}}
      summary: Buffer đã hết hạn — client resync qua REST (party, chat unread, quest, match).
      payload:
        allOf:
          - $ref: '#/components/schemas/ServerEnvelope'
          - type: object
            properties:
              type: { const: system.session.resume_failed }
              payload:
                type: object
                properties:
                  reason: { type: string, enum: [expired, unknown_token, seq_gap] }
    SystemDegraded:
      name: system.service.degraded
      examples:
        - name: chat_presence
          payload: {"v":1,"type":"system.service.degraded","seq":7,"ts":1763600001000,"payload":{"features":["chat","presence"],"poll_interval_s":10}}
      summary: Hạ tầng realtime suy giảm (vd. Valkey) — client chuyển sang poll REST.
      payload:
        allOf:
          - $ref: '#/components/schemas/ServerEnvelope'
          - type: object
            properties:
              type: { const: system.service.degraded }
              payload:
                type: object
                properties:
                  features: { type: array, items: { type: string, enum: [chat, presence, party, matchmaking, notification] } }
                  poll_interval_s: { type: integer, default: 10 }
    SystemNoticeBroadcast:
      name: system.notice.broadcasted
      summary: Thông báo hệ thống (bảo trì, sự kiện).
      payload:
        allOf:
          - $ref: '#/components/schemas/ServerEnvelope'
          - type: object
            properties:
              type: { const: system.notice.broadcasted }
              payload:
                type: object
                required: [level, message]
                properties:
                  level: { type: string, enum: [info, warning, maintenance] }
                  message_code: { type: string, maxLength: 128 }
                  message: { $ref: '#/components/schemas/LocalizedText' }
                  starts_at: { $ref: '#/components/schemas/EpochMs' }

    SystemServerDraining:
      name: system.server.draining
      examples:
        - name: deploy
          payload: {"v":1,"type":"system.server.draining","seq":9,"ts":1763600002000,"payload":{"reconnect_after_ms":3500,"reason":"deploy"}}
      summary: Node gateway sắp tắt (deploy, bảo trì) — sau message này server đóng kết nối với close 1012 (F090-AC-27, RB-401).
      description: |
        Client chờ `reconnect_after_ms` (ngẫu nhiên theo kết nối để giãn tải) rồi xin ticket mới, kết nối lại (APISIX đưa tới
        node khác) và gửi `system.session.resume` với `last_seq`; message không droppable trong `resume_window` được phát lại.
      payload:
        allOf:
          - $ref: '#/components/schemas/ServerEnvelope'
          - type: object
            properties:
              type: { const: system.server.draining }
              payload:
                type: object
                required: [reconnect_after_ms]
                properties:
                  reconnect_after_ms: { type: integer, minimum: 0, maximum: 120000 }
                  reason: { type: string, enum: [deploy, maintenance] }

    SessionReplaced:
      name: session.session.replaced
      examples:
        - name: takeover
          payload: {"v":1,"type":"session.session.replaced","seq":12,"ts":1763600005000,"payload":{"game_session_id":"3f2e1d0c-9b8a-4765-8432-10fedcba9876","replaced_at":1763600005000,"new_device_platform":"android"}}
      summary: Tài khoản vừa đăng nhập trên thiết bị khác — phiên này bị kết thúc (ADR-0031).
      description: |
        Gửi ngay trước khi server đóng kết nối với close code 4409. Client hiển thị thông báo thân thiện
        ("Bạn đã được đăng xuất vì tài khoản vừa đăng nhập trên thiết bị khác"), xóa token cục bộ và
        quay về màn hình đăng nhập. Không tự reconnect.
      payload:
        allOf:
          - $ref: '#/components/schemas/ServerEnvelope'
          - type: object
            properties:
              type: { const: session.session.replaced }
              payload:
                type: object
                required: [game_session_id, replaced_at]
                properties:
                  game_session_id: { type: string, format: uuid }
                  replaced_at: { $ref: '#/components/schemas/EpochMs' }
                  new_device_platform: { type: string, enum: [windows, android, ios, web, macos, linux] }

    SessionEnded:
      name: session.session.ended
      examples:
        - name: curfew
          payload: {"v":1,"type":"session.session.ended","seq":13,"ts":1763600006000,"payload":{"game_session_id":"3f2e1d0c-9b8a-4765-8432-10fedcba9876","reason":"curfew","reopen_at":1763632400000,"ended_at":1763600006000}}
        - name: account_locked
          payload: {"v":1,"type":"session.session.ended","seq":13,"ts":1763600006000,"payload":{"game_session_id":"3f2e1d0c-9b8a-4765-8432-10fedcba9876","reason":"account_locked","ended_at":1763600006000}}
      summary: Server kết thúc game session đang giữ kết nối (giờ giới nghiêm, khóa tài khoản, dọn học sinh, thu hồi quyền, quản trị, đặt lại mật khẩu) — owner F014.
      description: |
        Gửi ngay trước khi gateway (F090) đóng kết nối đang giữ đúng `game_session_id` (REALTIME_ARCHITECTURE §3.1):
        - `reason = curfew` (module game, job `curfew-session-closer`, F014-AC-26): close **4410** — session kết thúc **không** thu hồi credential;
          client hiện màn giờ giới nghiêm với `reopen_at`, giữ refresh token, không tự kết nối lại.
        - `reason = daily_limit` (module game, job `curfew-session-closer`, F014-AC-27, OQ-17): học sinh đạt giới hạn chơi/ngày của trường; xử lý như `curfew`
          (close **4410**, `reopen_at` = 00:00 ICT hôm sau, giữ refresh token).
        - `account_locked`, `access_revoked`, `cleanup`, `admin`, `password_changed` (credential/phiên đã bị thu hồi, vd. `user.access_revoked`): close **4403**;
          client đăng xuất, xóa refresh token, về màn đăng nhập với thông báo theo `reason` (GAME_NETWORKING §4.4).
        `session.session.replaced`/4409 không đổi.
      payload:
        allOf:
          - $ref: '#/components/schemas/ServerEnvelope'
          - type: object
            properties:
              type: { const: session.session.ended }
              payload:
                type: object
                required: [game_session_id, reason, ended_at]
                properties:
                  game_session_id: { type: string, format: uuid, description: Session bị kết thúc; gateway chỉ đóng kết nối đang giữ session này }
                  reason: { type: string, enum: [curfew, daily_limit, account_locked, cleanup, access_revoked, admin, password_changed], description: 'curfew, daily_limit → close 4410; còn lại → close 4403' }
                  reopen_at: { $ref: '#/components/schemas/EpochMs', description: Chỉ có khi reason = curfew (hết giờ giới nghiêm hiệu lực) hoặc daily_limit (00:00 ICT hôm sau) — giờ server }
                  ended_at: { $ref: '#/components/schemas/EpochMs' }
                if:
                  properties: { reason: { enum: [curfew, daily_limit] } }
                then:
                  required: [reopen_at]
                else:
                  not: { required: [reopen_at] }

    SessionEndingSoon:
      name: session.session.ending_soon
      summary: Game session sắp bị server kết thúc vì đạt giới hạn chơi/ngày của trường — owner F014 (F014-AC-27, OQ-17).
      description: |
        Job `curfew-session-closer` của module game gửi một lần khi thời gian chơi còn lại trong ngày (ICT) của học sinh
        ≤ `curfew_warning_minutes` (CONFIG_DEFAULTS, 10 phút). Client hiện cảnh báo trong game và lưu tiến độ; tới `ends_at`
        server gửi `session.session.ended` (`reason = daily_limit`). Cảnh báo giờ giới nghiêm vẫn do client tự tính từ
        khung giới nghiêm trong bootstrap (F015-AC-22). Best effort: thiếu tin này không đổi việc kết thúc phiên.
      payload:
        allOf:
          - $ref: '#/components/schemas/ServerEnvelope'
          - type: object
            properties:
              type: { const: session.session.ending_soon }
              payload:
                type: object
                required: [game_session_id, reason, ends_at]
                properties:
                  game_session_id: { type: string, format: uuid }
                  reason: { type: string, enum: [daily_limit] }
                  ends_at: { $ref: '#/components/schemas/EpochMs', description: Thời điểm dự kiến kết thúc phiên (giờ server) }

    ContentManifestUpdated:
      name: content.manifest.updated
      summary: Có content manifest mới cho tenant (ADR-0043) — chỉ báo, áp dụng ở màn kế tiếp.
      description: |
        Phát bởi module game (qua realtime) sau khi publish/rollback/unpublish nội dung làm đổi manifest
        của tenant. Client chỉ đặt cờ "có bản mới"; KHÔNG đổi nội dung của màn đang chơi (version pinning).
        Khi vào màn mới, client gọi GET /api/v1/game/content-manifest (If-None-Match) rồi POST /game/levels/{id}:start.
      payload:
        allOf:
          - $ref: '#/components/schemas/ServerEnvelope'
          - type: object
            properties:
              type: { const: content.manifest.updated }
              payload:
                type: object
                required: [tenant_id, manifest_version, etag]
                properties:
                  tenant_id: { type: string, format: uuid }
                  manifest_version: { type: integer }
                  etag: { type: string, maxLength: 128 }
                  changed_items_count: { type: integer, minimum: 0 }

    # ======================= PRESENCE =======================
    PresenceStatusSet:
      name: presence.status.set
      examples:
        - name: in_activity
          payload: {"v":1,"type":"presence.status.set","id":"0192f3a4-5b6c-7d8e-9f01-23456789abd2","ts":1763600000000,"payload":{"status":"in_activity","activity":"learning"}}
      payload:
        allOf:
          - $ref: '#/components/schemas/ClientEnvelope'
          - type: object
            properties:
              type: { const: presence.status.set }
              payload:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [online, in_activity, in_match, away], description: 'Tập con của PresenceStatus (MULTIPLAYER_GAMEPLAY §5); offline chỉ do gateway đặt khi không còn kết nối (F091-AC-22).' }
                  activity: { type: string, enum: [idle, learning, quest, battle, party_lobby, exam] }
                  hidden: { type: boolean, description: 'Ẩn trạng thái: người không được thấy nhận offline (MULTIPLAYER_GAMEPLAY §5). Vắng = giữ giá trị hiện tại.' }
    PresenceFriendUpdated:
      name: presence.friend.updated
      summary: Chỉ gửi cho bạn bè/party/club theo policy (không theo lớp — ADR-0095); trong exam không lộ chi tiết hoạt động.
      payload:
        allOf:
          - $ref: '#/components/schemas/ServerEnvelope'
          - type: object
            properties:
              type: { const: presence.friend.updated }
              payload:
                type: object
                required: [user_id, status]
                properties:
                  user_id: { $ref: '#/components/schemas/Uuid' }
                  status: { $ref: '#/components/schemas/PresenceStatus' }
                  activity: { type: string, maxLength: 64 }
                  area_id: { type: string, maxLength: 64 }

    # ======================= CHAT =======================
    ChatChannelJoin:
      name: chat.channel.join
      summary: Subscribe nhận tin nhắn realtime của channel (server kiểm tra membership + tenant).
      payload:
        allOf:
          - $ref: '#/components/schemas/ClientEnvelope'
          - type: object
            properties:
              type: { const: chat.channel.join }
              payload:
                type: object
                required: [channel_id]
                properties:
                  channel_id: { $ref: '#/components/schemas/Uuid' }
                  since_seq: { type: integer, minimum: 0, description: "Nhận bù tin sau seq này qua chat.history.loaded (tối đa chat_recent_buffer = 200 tin, nhiều hơn → has_more, tải REST; F115-AC-19)." }
    ChatChannelLeave:
      name: chat.channel.leave
      payload:
        allOf:
          - $ref: '#/components/schemas/ClientEnvelope'
          - type: object
            properties:
              type: { const: chat.channel.leave }
              payload:
                type: object
                required: [channel_id]
                properties:
                  channel_id: { $ref: '#/components/schemas/Uuid' }
    ChatMessageSend:
      name: chat.message.send
      summary: |
        Gửi tin. `kind` được phép theo ChatPolicy của channel — một bộ quy tắc cho mọi khối (ADR-0020); mọi kind qua kiểm tra hợp lệ.
        Pipeline lọc đồng bộ: allow → created; mask → created với body đã che; block → system.command.failed CHAT_CONTENT_BLOCKED;
        hold_for_review → chat.message.held (chỉ người gửi). Người gửi nhận chat.message.acked (Sent) chỉ sau khi NATS JetStream ack;
        NATS lỗi → system.command.failed CHAT_TEMPORARILY_UNAVAILABLE (ADR-0035).
      payload:
        allOf:
          - $ref: '#/components/schemas/ClientEnvelope'
          - type: object
            properties:
              type: { const: chat.message.send }
              payload:
                type: object
                required: [channel_id, kind, client_message_id]
                properties:
                  channel_id: { $ref: '#/components/schemas/Uuid' }
                  client_message_id: { $ref: '#/components/schemas/Uuid' }
                  kind: { type: string, enum: [text, quick, emoji, sticker, gif] }
                  body: { type: string, maxLength: 300 }
                  quick_message_id: { type: string, maxLength: 64 }
                  params:
                    type: object
                    maxProperties: 5
                    description: "kind=quick: tham số của quick message có chỗ trống ({n}); mỗi giá trị qua pipeline kiểm duyệt như text (F116-AC-28)"
                    propertyNames: { type: string, maxLength: 32, pattern: '^[a-z][a-z0-9_]{0,31}$' }
                    additionalProperties: { type: string, minLength: 1, maxLength: 64 }
                  emoji: { type: string, maxLength: 64 }
                  sticker_id: { $ref: '#/components/schemas/Uuid' }
                  gif_id: { $ref: '#/components/schemas/Uuid' }
                  reply_to_message_id: { $ref: '#/components/schemas/Uuid' }
                  quote:
                    type: object
                    required: [message_id]
                    properties:
                      message_id: { $ref: '#/components/schemas/Uuid' }
                      excerpt_start: { type: integer, minimum: 0 }
                      excerpt_end: { type: integer, minimum: 0 }
                  mentions: { type: array, maxItems: 20, description: "Vượt chat_mentions_max (5) → CHAT_MENTION_LIMIT; id không hợp lệ bị loại (CHAT_SYSTEM §7.7)", items: { $ref: '#/components/schemas/Uuid' } }
    ChatReactionToggle:
      name: chat.reaction.toggle
      payload:
        allOf:
          - $ref: '#/components/schemas/ClientEnvelope'
          - type: object
            properties:
              type: { const: chat.reaction.toggle }
              payload:
                type: object
                required: [message_id, reaction]
                properties:
                  message_id: { $ref: '#/components/schemas/Uuid' }
                  reaction: { type: string, maxLength: 64, description: Mã reaction trong danh sách cho phép. }
    ChatHistoryFetch:
      name: chat.history.fetch
      payload:
        allOf:
          - $ref: '#/components/schemas/ClientEnvelope'
          - type: object
            properties:
              type: { const: chat.history.fetch }
              payload:
                type: object
                required: [channel_id]
                properties:
                  channel_id: { $ref: '#/components/schemas/Uuid' }
                  before_seq: { type: integer }
                  limit: { type: integer, minimum: 1, maximum: 50, default: 30 }
    ChatMessageCreated:
      name: chat.message.created
      payload:
        allOf:
          - $ref: '#/components/schemas/ServerEnvelope'
          - type: object
            properties:
              type: { const: chat.message.created }
              payload: { $ref: '#/components/schemas/ChatMessage' }
    ChatMessageHeld:
      name: chat.message.held
      summary: Chỉ gửi cho người gửi — tin đang chờ kiểm duyệt, chưa phát tới người khác.
      payload:
        allOf:
          - $ref: '#/components/schemas/ServerEnvelope'
          - type: object
            properties:
              type: { const: chat.message.held }
              payload:
                type: object
                required: [message_id, channel_id]
                properties:
                  message_id: { $ref: '#/components/schemas/Uuid' }
                  channel_id: { $ref: '#/components/schemas/Uuid' }
                  notice: { type: string, maxLength: 1000, description: 'Thông điệp thân thiện, vd. "Tin nhắn đang được kiểm tra an toàn".' }
    ChatMessageRemoved:
      name: chat.message.removed
      payload:
        allOf:
          - $ref: '#/components/schemas/ServerEnvelope'
          - type: object
            properties:
              type: { const: chat.message.removed }
              payload:
                type: object
                required: [message_id, channel_id]
                properties:
                  message_id: { $ref: '#/components/schemas/Uuid' }
                  channel_id: { $ref: '#/components/schemas/Uuid' }
                  reason: { type: string, enum: [moderation, sender_deleted, retention] }
    ChatReactionUpdated:
      name: chat.reaction.updated
      payload:
        allOf:
          - $ref: '#/components/schemas/ServerEnvelope'
          - type: object
            properties:
              type: { const: chat.reaction.updated }
              payload:
                type: object
                required: [message_id, channel_id, reactions]
                properties:
                  message_id: { $ref: '#/components/schemas/Uuid' }
                  channel_id: { $ref: '#/components/schemas/Uuid' }
                  reactions:
                    type: object
                    additionalProperties: { type: integer }
    ChatUnreadUpdated:
      name: chat.unread.updated
      payload:
        allOf:
          - $ref: '#/components/schemas/ServerEnvelope'
          - type: object
            properties:
              type: { const: chat.unread.updated }
              payload:
                type: object
                required: [counts]
                properties:
                  counts:
                    type: object
                    description: channel_id → số tin chưa đọc
                    additionalProperties: { type: integer }
                  mentions:
                    type: object
                    description: channel_id → số mention chưa đọc
                    additionalProperties: { type: integer }
    ChatHistoryLoaded:
      name: chat.history.loaded
      summary: |
        Tin bù/lịch sử cho đúng kết nối đã gửi chat.history.fetch, chat.channel.sync hoặc chat.channel.join có since_seq (F115-AC-18, AC-19).
        Module chat đẩy qua Valkey Pub/Sub ew:rt:user:<user_id> với target.conn_id nên không mang ref; system.command.acked của lệnh gốc có
        result {channel_id | channels, count, has_more}. Chỉ nội dung đã che; tin held chỉ có cho người gửi.
      payload:
        allOf:
          - $ref: '#/components/schemas/ServerEnvelope'
          - type: object
            properties:
              type: { const: chat.history.loaded }
              payload:
                type: object
                required: [channel_id, messages, has_more]
                properties:
                  channel_id: { $ref: '#/components/schemas/Uuid' }
                  messages: { type: array, items: { $ref: '#/components/schemas/ChatMessage' } }
                  has_more: { type: boolean }
    ChatMessageEdit:
      name: chat.message.edit
      summary: Sửa tin của chính mình trong 15 phút (ADR-0034). Nội dung mới chạy lại pipeline kiểm duyệt.
      payload:
        allOf:
          - $ref: '#/components/schemas/ClientEnvelope'
          - type: object
            properties:
              type: { const: chat.message.edit }
              payload:
                type: object
                required: [message_id, body, revision_expected]
                properties:
                  message_id: { $ref: '#/components/schemas/Uuid' }
                  body: { type: string, minLength: 1, maxLength: 300 }
                  revision_expected: { type: integer, minimum: 1 }
                  mentions: { type: array, maxItems: 20, description: "Vượt chat_mentions_max (5) → CHAT_MENTION_LIMIT", items: { $ref: '#/components/schemas/Uuid' } }
    ChatMessageRecall:
      name: chat.message.recall
      summary: Thu hồi tin của chính mình trong 24 giờ; nội dung gốc giữ làm bằng chứng (ADR-0034).
      payload:
        allOf:
          - $ref: '#/components/schemas/ClientEnvelope'
          - type: object
            properties:
              type: { const: chat.message.recall }
              payload:
                type: object
                required: [message_id]
                properties:
                  message_id: { $ref: '#/components/schemas/Uuid' }
    ChatMessageForward:
      name: chat.message.forward
      summary: Chuyển tiếp tới tối đa 5 channel cùng tenant; mỗi tin mới chạy lại kiểm duyệt của channel đích.
      payload:
        allOf:
          - $ref: '#/components/schemas/ClientEnvelope'
          - type: object
            properties:
              type: { const: chat.message.forward }
              payload:
                type: object
                required: [message_id, target_channel_ids]
                properties:
                  message_id: { $ref: '#/components/schemas/Uuid' }
                  target_channel_ids: { type: array, minItems: 1, maxItems: 5, uniqueItems: true, items: { $ref: '#/components/schemas/Uuid' } }
    ChatPinAdd:
      name: chat.pin.add
      payload:
        allOf:

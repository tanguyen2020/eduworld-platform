operations:
  receiveSystemCommands:
    action: receive
    x-routing: { module: realtime }
    channel: { $ref: '#/channels/realtime' }
    summary: Lệnh hệ thống từ client (heartbeat, resume).
    messages:
      - $ref: '#/channels/realtime/messages/SystemPing'
      - $ref: '#/channels/realtime/messages/SystemSessionResume'
  sendSystemEvents:
    action: send
    channel: { $ref: '#/channels/realtime' }
    summary: Sự kiện hệ thống tới client.
    messages:
      - $ref: '#/channels/realtime/messages/SystemSessionWelcome'
      - $ref: '#/channels/realtime/messages/SystemPong'
      - $ref: '#/channels/realtime/messages/SystemAck'
      - $ref: '#/channels/realtime/messages/SystemError'
      - $ref: '#/channels/realtime/messages/SystemSessionResumed'
      - $ref: '#/channels/realtime/messages/SystemSessionResumeFailed'
      - $ref: '#/channels/realtime/messages/SystemDegraded'
      - $ref: '#/channels/realtime/messages/SystemNoticeBroadcast'
      - $ref: '#/channels/realtime/messages/SystemServerDraining'
      - $ref: '#/channels/realtime/messages/SessionReplaced'
      - $ref: '#/channels/realtime/messages/SessionEnded'
      - $ref: '#/channels/realtime/messages/SessionEndingSoon'
      - $ref: '#/channels/realtime/messages/ContentManifestUpdated'
  receivePresenceCommands:
    action: receive
    x-routing: { module: realtime }
    channel: { $ref: '#/channels/realtime' }
    messages:
      - $ref: '#/channels/realtime/messages/PresenceStatusSet'
  sendPresenceEvents:
    action: send
    channel: { $ref: '#/channels/realtime' }
    messages:
      - $ref: '#/channels/realtime/messages/PresenceFriendUpdated'
  receiveChatCommands:
    action: receive
    x-routing: { module: chat }
    channel: { $ref: '#/channels/realtime' }
    summary: Lệnh chat. Quyền gửi do ChatPolicy quyết định (ADR-0020).
    messages:
      - $ref: '#/channels/realtime/messages/ChatChannelJoin'
      - $ref: '#/channels/realtime/messages/ChatChannelLeave'
      - $ref: '#/channels/realtime/messages/ChatMessageSend'
      - $ref: '#/channels/realtime/messages/ChatReactionToggle'
      - $ref: '#/channels/realtime/messages/ChatReceiptRead'
      - $ref: '#/channels/realtime/messages/ChatHistoryFetch'
      - $ref: '#/channels/realtime/messages/ChatMessageEdit'
      - $ref: '#/channels/realtime/messages/ChatMessageRecall'
      - $ref: '#/channels/realtime/messages/ChatMessageForward'
      - $ref: '#/channels/realtime/messages/ChatPinAdd'
      - $ref: '#/channels/realtime/messages/ChatPinRemove'
      - $ref: '#/channels/realtime/messages/ChatTypingStart'
      - $ref: '#/channels/realtime/messages/ChatTypingStop'
      - $ref: '#/channels/realtime/messages/ChatReceiptDelivered'
      - $ref: '#/channels/realtime/messages/ChatSync'
  sendChatEvents:
    action: send
    channel: { $ref: '#/channels/realtime' }
    messages:
      - $ref: '#/channels/realtime/messages/ChatMessageCreated'
      - $ref: '#/channels/realtime/messages/ChatMessageHeld'
      - $ref: '#/channels/realtime/messages/ChatMessageRemoved'
      - $ref: '#/channels/realtime/messages/ChatReactionUpdated'
      - $ref: '#/channels/realtime/messages/ChatUnreadUpdated'
      - $ref: '#/channels/realtime/messages/ChatHistoryLoaded'
      - $ref: '#/channels/realtime/messages/ChatSanctionApplied'
      - $ref: '#/channels/realtime/messages/ChatMessageAcked'
      - $ref: '#/channels/realtime/messages/ChatMessageEdited'
      - $ref: '#/channels/realtime/messages/ChatMessageRecalled'
      - $ref: '#/channels/realtime/messages/ChatPinUpdated'
      - $ref: '#/channels/realtime/messages/ChatTypingUpdated'
      - $ref: '#/channels/realtime/messages/ChatReceiptUpdated'
      - $ref: '#/channels/realtime/messages/ChatMentionCreated'
  receiveNotificationCommands:
    action: receive
    x-routing: { module: chat }
    channel: { $ref: '#/channels/realtime' }
    messages:
      - $ref: '#/channels/realtime/messages/NotificationItemMarkRead'
  sendNotificationEvents:
    action: send
    channel: { $ref: '#/channels/realtime' }
    messages:
      - $ref: '#/channels/realtime/messages/NotificationItemCreated'
  receivePartyCommands:
    action: receive
    x-routing: { module: competition }
    channel: { $ref: '#/channels/realtime' }
    summary: Lệnh Party Lobby realtime. Tạo/mời/chấp nhận/kick/giải tán qua REST /api/v1/multiplayer/parties.
    messages:
      - $ref: '#/channels/realtime/messages/PartyMemberReadySet'
      - $ref: '#/channels/realtime/messages/PartyActivitySelect'
      - $ref: '#/channels/realtime/messages/PartySessionStart'
  sendPartyEvents:
    action: send
    channel: { $ref: '#/channels/realtime' }
    messages:
      - $ref: '#/channels/realtime/messages/PartyStateSnapshot'
      - $ref: '#/channels/realtime/messages/PartyInvitationReceived'
      - $ref: '#/channels/realtime/messages/PartyInvitationUpdated'
      - $ref: '#/channels/realtime/messages/PartyMemberJoined'
      - $ref: '#/channels/realtime/messages/PartyMemberLeft'
      - $ref: '#/channels/realtime/messages/PartyMemberStatusChanged'
      - $ref: '#/channels/realtime/messages/PartyMemberReadyChanged'
      - $ref: '#/channels/realtime/messages/PartyLeaderTransferred'
      - $ref: '#/channels/realtime/messages/PartyActivitySelected'
      - $ref: '#/channels/realtime/messages/PartySessionStarted'
      - $ref: '#/channels/realtime/messages/PartySessionEnded'
      - $ref: '#/channels/realtime/messages/PartyDisbanded'
  receiveMatchmakingCommands:
    action: receive
    x-routing: { module: competition }
    channel: { $ref: '#/channels/realtime' }
    summary: Ready check và hủy ticket. Tạo ticket qua REST POST /api/v1/competition/matchmaking/tickets (Idempotency-Key).
    messages:
      - $ref: '#/channels/realtime/messages/MatchmakingTicketCancel'
      - $ref: '#/channels/realtime/messages/MatchmakingProposalAccept'
      - $ref: '#/channels/realtime/messages/MatchmakingProposalDecline'
  sendMatchmakingEvents:
    action: send
    channel: { $ref: '#/channels/realtime' }
    messages:
      - $ref: '#/channels/realtime/messages/MatchmakingTicketUpdated'
      - $ref: '#/channels/realtime/messages/MatchmakingProposalCreated'
      - $ref: '#/channels/realtime/messages/MatchmakingProposalUpdated'
      - $ref: '#/channels/realtime/messages/MatchmakingProposalCancelled'
      - $ref: '#/channels/realtime/messages/MatchmakingMatchAssigned'
  sendRankingEvents:
    action: send
    channel: { $ref: '#/channels/realtime' }
    summary: 'Tier của chính học sinh sau trận ranked (F106-AC-07): không số rating/RD; không có thông báo "bị vượt" (COMPETITION_SYSTEM §9.4).'
    messages:
      - $ref: '#/channels/realtime/messages/CompetitionTierUpdated'
  receiveHubCommands:
    action: receive
    x-routing: { module: competition, room_input: [hub.player.move] }
    channel: { $ref: '#/channels/realtime' }
    summary: Đồng bộ thế giới hub (≤10 Hz move, không ack).
    messages:
      - $ref: '#/channels/realtime/messages/HubInstanceJoin'
      - $ref: '#/channels/realtime/messages/HubPlayerMove'
      - $ref: '#/channels/realtime/messages/HubPlayerEmote'
  sendHubEvents:
    action: send
    channel: { $ref: '#/channels/realtime' }
    messages:
      - $ref: '#/channels/realtime/messages/HubInstanceAssigned'
      - $ref: '#/channels/realtime/messages/HubSnapshotUpdated'
      - $ref: '#/channels/realtime/messages/HubPlayerJoined'
      - $ref: '#/channels/realtime/messages/HubPlayerLeft'
      - $ref: '#/channels/realtime/messages/HubPlayerEmoted'
      - $ref: '#/channels/realtime/messages/HubPlayerAppearanceChanged'
      - $ref: '#/channels/realtime/messages/HubPlayerCorrected'
      - $ref: '#/channels/realtime/messages/HubInstanceMigrated'
  receiveBattleCommands:
    action: receive
    x-routing: { module: competition }
    channel: { $ref: '#/channels/realtime' }
    summary: Knowledge Battle / Team Battle / Timed Quiz — server-authoritative.
    messages:
      - $ref: '#/channels/realtime/messages/BattleAnswerSubmit'
      - $ref: '#/channels/realtime/messages/BattleStateRequest'
  sendBattleEvents:
    action: send
    channel: { $ref: '#/channels/realtime' }
    messages:
      - $ref: '#/channels/realtime/messages/BattleStateSnapshot'
      - $ref: '#/channels/realtime/messages/BattleCountdownStarted'
      - $ref: '#/channels/realtime/messages/BattleQuestionShown'
      - $ref: '#/channels/realtime/messages/BattleAnswerRecorded'
      - $ref: '#/channels/realtime/messages/BattleAnswerEvaluated'
      - $ref: '#/channels/realtime/messages/BattleQuestionRevealed'
      - $ref: '#/channels/realtime/messages/BattleRoundEnded'
      - $ref: '#/channels/realtime/messages/BattleParticipantStatusChanged'
      - $ref: '#/channels/realtime/messages/BattleMatchPaused'
      - $ref: '#/channels/realtime/messages/BattleMatchResumed'
      - $ref: '#/channels/realtime/messages/BattleMatchEnded'
  receiveCoopCommands:
    action: receive
    x-routing: { module: competition }
    channel: { $ref: '#/channels/realtime' }
    summary: Cooperative Quest / Educational Puzzle trong private instance của Party.
    messages:
      - $ref: '#/channels/realtime/messages/CoopActionPerform'
      - $ref: '#/channels/realtime/messages/CoopAnswerSubmit'
  sendCoopEvents:
    action: send
    channel: { $ref: '#/channels/realtime' }
    messages:
      - $ref: '#/channels/realtime/messages/CoopStateSnapshot'
      - $ref: '#/channels/realtime/messages/CoopStateUpdated'
      - $ref: '#/channels/realtime/messages/CoopTaskAssigned'
      - $ref: '#/channels/realtime/messages/CoopAnswerEvaluated'
      - $ref: '#/channels/realtime/messages/CoopProgressUpdated'
      - $ref: '#/channels/realtime/messages/CoopSessionEnded'

  receiveBossCommands:
    action: receive
    x-routing: { module: game }
    channel: { $ref: '#/channels/realtime' }
    summary: Boss encounter (module game, ew.cmd.game.boss.*) — server-authoritative.
    messages:
      - $ref: '#/channels/realtime/messages/BossEncounterReady'
      - $ref: '#/channels/realtime/messages/BossAnswerSubmit'
  sendBossEvents:
    action: send
    channel: { $ref: '#/channels/realtime' }
    messages:
      - $ref: '#/channels/realtime/messages/BossEncounterUpdated'
      - $ref: '#/channels/realtime/messages/BossPhaseStarted'
      - $ref: '#/channels/realtime/messages/BossPhaseCompleted'
      - $ref: '#/channels/realtime/messages/BossEncounterEnded'
  sendProgressionEvents:
    action: send
    channel: { $ref: '#/channels/realtime' }
    summary: Challenge và tiến trình người chơi (module game, Valkey ew:rt:user:<user_id>).
    messages:
      - $ref: '#/channels/realtime/messages/ChallengeAttemptUpdated'
      - $ref: '#/channels/realtime/messages/ProgressionXpUpdated'
      - $ref: '#/channels/realtime/messages/ProgressionLevelReached'

                type: object
                required: [match_id, starts_at]
                properties:
                  match_id: { $ref: '#/components/schemas/Uuid' }
                  starts_at: { $ref: '#/components/schemas/EpochMs' }
                  question_count: { type: integer }
                  rounds: { type: integer }
    BattleQuestionShown:

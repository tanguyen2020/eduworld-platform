                    type: object
                    description: channel_id → số mention chưa đọc
                    additionalProperties: { type: integer }
    ChatHistoryLoaded:
      name: chat.history.loaded
      payload:
        allOf:
          - $ref: '#/components/schemas/ServerEnvelope'

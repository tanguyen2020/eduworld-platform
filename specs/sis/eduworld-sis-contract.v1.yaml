openapi: 3.1.0
info:
  title: EduWorld SIS Contract
  version: 1.2.1
  summary: Contract do EduWorld định nghĩa mà hệ thống SIS của trường phải triển khai.
  description: |
    **EduWorld sở hữu toàn bộ DTO trong contract này** (ADR-0021). SIS của trường (hoặc lớp facade
    do trường/nhà cung cấp SIS tự xây) phải expose các endpoint dưới đây đúng shape đã định nghĩa.
    EduWorld **không** viết adapter ánh xạ theo DTO riêng của từng SIS.

    - Phần `paths`: endpoint **trường triển khai**, worker của module `identity` gọi (pull).
    - Phần `webhooks`: payload **SIS gửi tới EduWorld** (push, tùy chọn) tại
      `POST /internal/sis/webhooks/{connection_id}` (chỉ gateway nội bộ / IP allowlist).
    - File CSV (`csv_import`) dùng đúng tên trường của các DTO này.

    Quy tắc version: path `/v1`; trong v1 chỉ thêm trường **tùy chọn** hoặc giá trị enum mới
    kèm thông báo trước tối thiểu 1 học kỳ. Breaking change → `/v2` chạy song song.
    Tài liệu: docs/09-identity/SIS_INTEGRATION.md.

    Phiên bản 1.2.0 (ADR-0072): contract chỉ gồm trường, năm học, lớp, học sinh và enrollment. EduWorld không nhập
    nhân sự hay phân công giảng dạy từ SIS (contract vẫn ở trạng thái Draft, chưa có trường nào triển khai).

    Phiên bản 1.2.1 (F017, chỉ bổ sung): `examples` dữ liệu demo TH Demo A cho mọi response 200 (mock `sis-mock` bằng Prism
    và bộ conformance `specs/postman/sis-conformance/`); webhook `receiveSisChanges` thêm response 404 và 503.
  license:
    name: Proprietary — EduWorld
    identifier: LicenseRef-EduWorld-Proprietary
servers:
  - url: '{sis_base_url}/eduworld/v1'
    description: Base URL do trường cung cấp, cấu hình trong sis_connections.config.base_url
    variables:
      sis_base_url:
        default: https://sis.school.example
        description: Thay bằng base URL thật của trường (cấu hình theo connection, không hardcode).
security:
  - oauth2ClientCredentials: [eduworld.sis.read]
  - apiKeyHeader: []
  - mutualTLS: []
tags:
  - name: system
    description: Kiểm tra kết nối và phiên bản contract
  - name: organization
    description: Trường, năm học, lớp
  - name: people
    description: Học sinh
  - name: membership
    description: Enrollment (học sinh thuộc lớp)
  - name: changes
    description: Delta sync theo cursor

paths:
  /health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Kiểm tra kết nối và phiên bản contract SIS đã triển khai
      responses:
        '200':
          description: SIS sẵn sàng
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
              examples:
                th_demo_a:
                  summary: Dữ liệu demo TH Demo A (khớp seed th-demo-a)
                  value: {"status":"ok","contract_version":"1.2.1","capabilities":["full_sync","delta","webhook","student_lookup"],"server_time":"2026-11-01T08:00:00Z"}
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /schools:
    get:
      tags: [organization]
      operationId: listSchools
      summary: Danh sách trường thuộc phạm vi connection
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Một trang trường
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SchoolPage' }
              examples:
                th_demo_a:
                  summary: Dữ liệu demo TH Demo A (khớp seed th-demo-a)
                  value: {"data":[{"school_external_id":"TH-DEMO-001","school_code":"DEMOA1","name":"TH Demo A","province_code":"vn.ha-noi","school_level":"primary","status":"active","updated_at":"2026-11-01T08:00:00Z"}],"page":{"has_more":false,"next_cursor":null}}
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /schools/{school_external_id}/academic-years:
    get:
      tags: [organization]
      operationId: listAcademicYears
      summary: Danh sách năm học của trường
      parameters:
        - $ref: '#/components/parameters/SchoolExternalId'
      responses:
        '200':
          description: Danh sách năm học
          content:
            application/json:
              schema:
                type: object
                required: [data]
                additionalProperties: false
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AcademicYear' }
              examples:
                th_demo_a:
                  summary: Dữ liệu demo TH Demo A (khớp seed th-demo-a)
                  value: {"data":[{"academic_year":"2026-2027","start_date":"2026-09-05","end_date":"2027-05-31","is_current":true}]}
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /schools/{school_external_id}/classes:
    get:
      tags: [organization]
      operationId: listClasses
      summary: Danh sách lớp của trường trong một năm học
      parameters:
        - $ref: '#/components/parameters/SchoolExternalId'
        - $ref: '#/components/parameters/AcademicYearCode'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Một trang lớp
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClassPage' }
              examples:
                th_demo_a:
                  summary: Dữ liệu demo TH Demo A (khớp seed th-demo-a)
                  value: {"data":[{"class_external_id":"C-3A-2026","school_external_id":"TH-DEMO-001","academic_year":"2026-2027","grade_level":3,"name":"3A","updated_at":"2026-11-01T08:00:00Z"},{"class_external_id":"C-3B-2026","school_external_id":"TH-DEMO-001","academic_year":"2026-2027","grade_level":3,"name":"3B","updated_at":"2026-11-01T08:00:00Z"}],"page":{"has_more":false,"next_cursor":null}}
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /schools/{school_external_id}/students:
    get:
      tags: [people]
      operationId: listStudents
      summary: Danh sách học sinh của trường
      parameters:
        - $ref: '#/components/parameters/SchoolExternalId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Một trang học sinh
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudentPage' }
              examples:
                th_demo_a:
                  summary: Dữ liệu demo TH Demo A (khớp seed th-demo-a)
                  value: {"data":[{"student_external_id":"HS-DEMO-0001","school_external_id":"TH-DEMO-001","student_code":"A001","full_name":"Nguyễn Văn An","grade_level":3,"status":"active","login":{"username":"hs.an.3a"},"updated_at":"2026-11-01T08:00:00Z"},{"student_external_id":"HS-DEMO-0002","school_external_id":"TH-DEMO-001","student_code":"A002","full_name":"Trần Thị Bình","grade_level":3,"status":"active","login":{"username":"hs.binh.3a"},"updated_at":"2026-11-01T08:00:00Z"},{"student_external_id":"HS-DEMO-0003","school_external_id":"TH-DEMO-001","student_code":"A003","full_name":"Lê Minh Chi","grade_level":3,"status":"active","login":{"username":"hs.chi.3b"},"updated_at":"2026-11-01T08:00:00Z"}],"page":{"has_more":false,"next_cursor":null}}
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /schools/{school_external_id}/students/lookup:
    get:
      tags: [people]
      operationId: lookupStudent
      summary: Tra cứu một học sinh theo login (on-demand lookup khi học sinh đăng nhập — đồng bộ hồ sơ theo ADR-0061, không JIT)
      description: Tùy chọn. Trường khai báo trong Health.capabilities nếu hỗ trợ. EduWorld gọi với timeout 3 giây.
      parameters:
        - $ref: '#/components/parameters/SchoolExternalId'
        - name: login_username
          in: query
          required: true
          schema: { type: string, maxLength: 128 }
      responses:
        '200':
          description: Tìm thấy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Student' }
              examples:
                hs_an_3a:
                  summary: Dữ liệu demo TH Demo A (khớp seed th-demo-a)
                  value: {"student_external_id":"HS-DEMO-0001","school_external_id":"TH-DEMO-001","student_code":"A001","full_name":"Nguyễn Văn An","grade_level":3,"status":"active","login":{"username":"hs.an.3a"},"updated_at":"2026-11-01T08:00:00Z"}
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /schools/{school_external_id}/enrollments:
    get:
      tags: [membership]
      operationId: listEnrollments
      summary: Danh sách enrollment (học sinh thuộc lớp) trong một năm học
      parameters:
        - $ref: '#/components/parameters/SchoolExternalId'
        - $ref: '#/components/parameters/AcademicYearCode'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Một trang enrollment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnrollmentPage' }
              examples:
                th_demo_a:
                  summary: Dữ liệu demo TH Demo A (khớp seed th-demo-a)
                  value: {"data":[{"student_external_id":"HS-DEMO-0001","class_external_id":"C-3A-2026","start_date":"2026-09-05","status":"active","updated_at":"2026-11-01T08:00:00Z"},{"student_external_id":"HS-DEMO-0002","class_external_id":"C-3A-2026","start_date":"2026-09-05","status":"active","updated_at":"2026-11-01T08:00:00Z"},{"student_external_id":"HS-DEMO-0003","class_external_id":"C-3B-2026","start_date":"2026-09-05","status":"active","updated_at":"2026-11-01T08:00:00Z"}],"page":{"has_more":false,"next_cursor":null}}
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /changes:
    get:
      tags: [changes]
      operationId: listChanges
      summary: Delta sync — các thay đổi kể từ watermark
      description: |
        Tùy chọn (capability `delta`). Trả về thay đổi theo thứ tự tăng dần của `sequence`.
        `next_cursor` của trang cuối là watermark mới; EduWorld lưu sau khi apply thành công
        và gửi lại ở lần gọi sau. Watermark quá cũ → 410, EduWorld chuyển sang full sync.
      parameters:
        - name: since
          in: query
          required: false
          description: Watermark opaque do SIS cấp; bỏ trống = từ đầu cửa sổ lưu giữ.
          schema: { type: string, maxLength: 512 }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Một trang thay đổi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChangePage' }
              examples:
                th_demo_a:
                  summary: Dữ liệu demo TH Demo A (khớp seed th-demo-a)
                  value: {"data":[{"sequence":101,"entity_kind":"student","operation":"upsert","external_id":"HS-DEMO-0003","occurred_at":"2026-11-01T08:00:00Z","record":{"student_external_id":"HS-DEMO-0003","school_external_id":"TH-DEMO-001","student_code":"A003","full_name":"Lê Minh Chi","grade_level":3,"status":"suspended","login":{"username":"hs.chi.3b"},"updated_at":"2026-11-01T08:00:00Z"}},{"sequence":102,"entity_kind":"enrollment","operation":"delete","external_id":"HS-DEMO-0002|C-3A-2026","occurred_at":"2026-11-01T08:00:00Z"}],"page":{"has_more":false,"next_cursor":"wm-000102"}}
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '410':
          description: Watermark hết hạn — cần full sync
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

webhooks:
  sisChanges:
    post:
      tags: [changes]
      operationId: receiveSisChanges
      summary: SIS đẩy thay đổi tới EduWorld (POST /internal/sis/webhooks/{connection_id})
      description: |
        Tùy chọn (capability `webhook`). SIS ký body bằng HMAC-SHA256 với secret được cấp khi
        đăng ký connection. EduWorld từ chối nếu chữ ký sai, timestamp lệch quá ±5 phút,
        hoặc `delivery_id` đã nhận (chống replay). Trả 202 ngay; xử lý bất đồng bộ.
      parameters:
        - name: X-EduWorld-Signature
          in: header
          required: true
          description: 'sha256=<hex(HMAC_SHA256(secret, timestamp + "." + raw_body))>'
          schema: { type: string, maxLength: 512 }
        - name: X-EduWorld-Timestamp
          in: header
          required: true
          description: Unix epoch giây lúc gửi.
          schema: { type: string, maxLength: 32, pattern: '^[0-9]{10}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangeBatch' }
      responses:
        '202': { description: 'Đã nhận, xử lý bất đồng bộ' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: 'Connection không tồn tại, không active, không khai báo capability webhook hoặc chưa có webhook secret' }
        '409': { description: delivery_id đã được nhận trước đó (replay) }
        '503': { description: 'EduWorld tạm thời không nhận được (kho chống replay hoặc hàng đợi lỗi) — SIS gửi lại; delivery_id được dùng làm Nats-Msg-Id' }

components:
  securitySchemes:
    oauth2ClientCredentials:
      type: oauth2
      description: Khuyến nghị. Token endpoint do trường cung cấp, EduWorld giữ client secret trong secret manager.
      flows:
        clientCredentials:
          tokenUrl: https://sis.school.example/oauth2/token
          scopes:
            eduworld.sis.read: Đọc dữ liệu tổ chức, lớp, học sinh cho EduWorld
    apiKeyHeader:
      type: apiKey
      in: header
      name: X-Api-Key
      description: Chấp nhận khi trường không hỗ trợ OAuth2; bắt buộc kèm IP allowlist.
    mutualTLS:
      type: mutualTLS
      description: Tùy chọn, có thể kết hợp với một trong hai cơ chế trên.

  parameters:
    SchoolExternalId:
      name: school_external_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ExternalId' }
    AcademicYearCode:
      name: academic_year
      in: query
      required: true
      description: Mã năm học dạng YYYY-YYYY.
      schema: { type: string, maxLength: 32, pattern: '^[0-9]{4}-[0-9]{4}$', examples: ['2026-2027'] }
    Cursor:
      name: cursor
      in: query
      required: false
      description: Cursor opaque lấy từ page.next_cursor của trang trước.
      schema: { type: string, maxLength: 512 }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 1000, default: 500 }

  responses:
    BadRequest:
      description: Tham số không hợp lệ
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Thiếu hoặc sai credential
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Không tìm thấy
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: Vượt rate limit — EduWorld tôn trọng header Retry-After
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unavailable:
      description: SIS tạm thời không sẵn sàng
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    ExternalId:
      type: string
      description: Khóa ổn định, không tái sử dụng, do SIS cấp. Không phải email, không phải tên.
      minLength: 1
      maxLength: 64
      pattern: '^[A-Za-z0-9._:-]+$'

    RecordStatus:
      type: string
      enum: [active, inactive, transferred_out, graduated, suspended]

    PageInfo:
      type: object
      required: [has_more]
      additionalProperties: false
      properties:
        next_cursor: { type: [string, 'null'], maxLength: 512 }
        has_more: { type: boolean }

    Health:
      type: object
      required: [status, contract_version, capabilities]
      additionalProperties: false
      properties:
        status: { type: string, enum: [ok, degraded] }
        contract_version:
          type: string
          maxLength: 64
          description: Phiên bản contract SIS đã triển khai (semver), ví dụ 1.0.0.
          pattern: '^1\.[0-9]+\.[0-9]+$'
        capabilities:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [full_sync, delta, webhook, student_lookup]
        server_time: { type: string, format: date-time }

    School:
      type: object
      required: [school_external_id, school_code, name, status, updated_at]
      additionalProperties: false
      properties:
        school_external_id: { $ref: '#/components/schemas/ExternalId' }
        school_code: { type: string, maxLength: 32 }
        name: { type: string, maxLength: 255 }
        organization_external_id: { $ref: '#/components/schemas/ExternalId' }
        province_code:
          type: string
          maxLength: 64
          pattern: '^[a-z]{2}\.[a-z0-9-]+$'
          description: 'Tùy chọn (thêm trong v1.1). Mã tỉnh/thành theo danh mục EduWorld (specs/reference-data, ví dụ vn.ha-noi). Thiếu thì Tenant Admin chọn tỉnh khi duyệt trường (ADR-0060).'
        moet_code:
          type: string
          maxLength: 32
          description: 'Tùy chọn (thêm trong v1.1). Mã trường do ngành giáo dục cấp, nếu có.'
        school_level:
          type: string
          enum: [primary, lower_secondary, multi_level]
          description: 'Tùy chọn (thêm trong v1.1). Cấp học.'
        status: { type: string, enum: [active, inactive] }
        updated_at: { type: string, format: date-time }

    AcademicYear:
      type: object
      required: [academic_year, start_date, end_date, is_current]
      additionalProperties: false
      properties:
        academic_year: { type: string, maxLength: 32, pattern: '^[0-9]{4}-[0-9]{4}$' }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        is_current: { type: boolean }

    Class:
      type: object
      required: [class_external_id, school_external_id, academic_year, grade_level, name, updated_at]
      additionalProperties: false
      properties:
        class_external_id: { $ref: '#/components/schemas/ExternalId' }
        school_external_id: { $ref: '#/components/schemas/ExternalId' }
        academic_year: { type: string, maxLength: 32, pattern: '^[0-9]{4}-[0-9]{4}$' }
        grade_level: { type: integer, minimum: 1, maximum: 9 }
        name: { type: string, maxLength: 32 }
        updated_at: { type: string, format: date-time }

    Login:
      type: object
      description: Gợi ý liên kết đăng nhập. Khóa định danh cuối cùng vẫn là (issuer, subject) trong Keycloak.
      required: [username]
      additionalProperties: false
      properties:
        username: { type: string, maxLength: 128 }
        idp_alias: { type: string, maxLength: 64, description: Alias IdP trong Keycloak nếu trường dùng IdP riêng }
        idp_subject: { type: string, maxLength: 255, description: 'Subject của học sinh trong IdP của trường, nếu biết' }

    Student:
      type: object
      required: [student_external_id, school_external_id, student_code, full_name, grade_level, status, updated_at]
      additionalProperties: false
      description: |
        Chỉ gồm các trường EduWorld cần (data minimization). Không gửi địa chỉ, số điện thoại,
        thông tin phụ huynh, ảnh, điểm số SIS.
      properties:
        student_external_id: { $ref: '#/components/schemas/ExternalId' }
        school_external_id: { $ref: '#/components/schemas/ExternalId' }
        student_code: { type: string, maxLength: 32 }
        full_name: { type: string, maxLength: 128 }
        date_of_birth: { type: string, format: date }
        grade_level: { type: integer, minimum: 1, maximum: 9 }
        national_student_id:
          type: string
          maxLength: 32
          description: Mã định danh học sinh (tùy chọn). EduWorld chỉ lưu dạng hash để phát hiện chuyển trường.
        status: { $ref: '#/components/schemas/RecordStatus' }
        login: { $ref: '#/components/schemas/Login' }
        updated_at: { type: string, format: date-time }

    Enrollment:
      type: object
      required: [student_external_id, class_external_id, start_date, status, updated_at]
      additionalProperties: false
      properties:
        student_external_id: { $ref: '#/components/schemas/ExternalId' }
        class_external_id: { $ref: '#/components/schemas/ExternalId' }
        start_date: { type: string, format: date }
        end_date: { type: [string, 'null'], format: date }
        status: { type: string, enum: [active, transferred, ended] }
        updated_at: { type: string, format: date-time }

    Change:
      type: object
      required: [sequence, entity_kind, operation, external_id, occurred_at]
      additionalProperties: false
      properties:
        sequence: { type: integer, minimum: 0, description: Tăng dần đơn điệu theo connection }
        entity_kind: { type: string, enum: [school, class, student, enrollment] }
        operation: { type: string, enum: [upsert, delete] }
        external_id:
          type: string
          maxLength: 200
          description: Với enrollment là khóa ghép "student_external_id|class_external_id".
        occurred_at: { type: string, format: date-time }
        record:
          description: Bản ghi đầy đủ theo DTO của entity_kind; bắt buộc khi operation = upsert.
          oneOf:
            - $ref: '#/components/schemas/School'
            - $ref: '#/components/schemas/Class'
            - $ref: '#/components/schemas/Student'
            - $ref: '#/components/schemas/Enrollment'

    ChangeBatch:
      type: object
      required: [delivery_id, contract_version, changes]
      additionalProperties: false
      properties:
        delivery_id: { type: string, format: uuid }
        contract_version: { type: string, maxLength: 64, pattern: '^1\.[0-9]+\.[0-9]+$' }
        changes:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: '#/components/schemas/Change' }

    SchoolPage:
      type: object
      required: [data, page]
      additionalProperties: false
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/School' } }
        page: { $ref: '#/components/schemas/PageInfo' }
    ClassPage:
      type: object
      required: [data, page]
      additionalProperties: false
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Class' } }
        page: { $ref: '#/components/schemas/PageInfo' }
    StudentPage:
      type: object
      required: [data, page]
      additionalProperties: false
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Student' } }
        page: { $ref: '#/components/schemas/PageInfo' }
    EnrollmentPage:
      type: object
      required: [data, page]
      additionalProperties: false
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Enrollment' } }
        page: { $ref: '#/components/schemas/PageInfo' }
    ChangePage:
      type: object
      required: [data, page]
      additionalProperties: false
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Change' } }
        page: { $ref: '#/components/schemas/PageInfo' }

    Problem:
      type: object
      description: RFC 9457 Problem Details.
      required: [type, title, status]
      properties:
        type: { type: string, maxLength: 64 }
        title: { type: string, maxLength: 255 }
        status: { type: integer }
        detail: { type: string, maxLength: 1000 }
        code: { type: string, maxLength: 64 }

# Breaking changes of the OpenAPI contracts accepted on purpose (ADR-0095 mục 7). Read by scripts/ci/specs-breaking.mjs
# (make specs-breaking): oasdiff still reports every breaking change; a change passes only when an entry below names it
# exactly — spec file(s), oasdiff check id, HTTP method, path and a fragment of the message — and cites an existing ADR.
# Nothing else is accepted and the check is never disabled. Entries list the change set of ADR-0094 (no MFA on the Admin
# Portal) and ADR-0095 (no class, enrollment, course, learning path, schedule, study group) measured from c7f84c94, the
# last commit before both: `BASE_REF=c7f84c94 make specs-breaking` still reports, as it must, the breaking changes of
# other features (F071 /game/world/*), which no ADR here covers. Add an entry only with the ADR that decides the break;
# `node scripts/ci/specs-breaking.mjs <base> --suggest` prints candidate entries (adr/reason empty) to review.

# Danh mục menu/action của Admin Portal — NGUỒN DUY NHẤT (ADR-0090). File viết tay, review như contract.
# Schema: specs/schemas/portal-menu-catalog.schema.json · Kiểm tra: node scripts/specs/check-portal-catalog.mjs
# - Sinh menuRegistry/workspaceRegistry cho web/apps/portal (make portal-catalog) và bảng đọc-chỉ platform.portal_menu_catalog
#   (eduworld_identity, ghi bởi cmd/migrate lúc deploy). Không khai báo menu tay trong TSX.
# - Khóa: workspace (school_lms, content_studio, game_ops, live_ops, platform_admin) · menu.<workspace>.<menu> ·
#   action.<workspace>.<menu>.<action>. Đổi/xóa khóa đã phát hành cần migration dữ liệu feature flag (khóa cũ bị soft-delete trong catalog DB).
# - required_permissions: người dùng cần ÍT NHẤT MỘT permission trong danh sách (any-of); mã lấy từ catalog permission ADMIN_PORTAL §2.2.
# - operation_ids: operationId của specs/openapi/eduworld-api.v1.yaml; operation dùng chung định tuyến theo tham số ghi dạng
#   "operationId[param=value]" (khớp x-portal-action: {param, map} trong OpenAPI). Mỗi operation thuộc đúng một action.
#   Action không có operation (operation_ids: []) chỉ điều khiển hiển thị (màn [TBD], tổng quan).
# - can_disable: false = mục được bảo vệ, không tắt được (422 FEATURE_NOT_DISABLEABLE); action của menu được bảo vệ cũng false.
# - title chỉ để người đọc file và màn hình Bật/tắt; nhãn hiển thị lấy theo label_key từ file dịch của portal.
# - Tăng catalog_version mỗi khi đổi file (cmd/migrate ghi vào platform.portal_menu_catalog).
catalog_version: "2026.11.24.1"

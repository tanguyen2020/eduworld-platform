# Specs lane (F001 T038): contract checks, SDD feature specs, workflow rules (F001-AC-25).
name: specs

on:
  pull_request:
    paths:
      - "specs/**"
      - "scripts/specs/**"
      - "scripts/openapi/**"
      - "scripts/ci/**"
      - "scripts/package.json"
      - "scripts/package-lock.json"
      - ".github/**"
  push:
    branches: [main]
    paths:
      - "specs/**"
      - "scripts/specs/**"
      - "scripts/openapi/**"
      - "scripts/ci/**"
      - "scripts/package.json"
      - "scripts/package-lock.json"
      - ".github/**"

permissions:
  contents: read

concurrency:
  group: specs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  specs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - run: make specs-lint
      - run: node --test scripts/ci/breaking-allowlist.test.mjs
      - run: make specs-breaking
      - name: workflow rules and path filters
        run: |
          node scripts/ci/check-workflows.mjs
          node --test scripts/ci/check-workflows.test.mjs
          bash scripts/ci/test-path-filters.sh
          bash scripts/ci/test-design-rules.sh
          bash scripts/ci/test-web-rules.sh
          bash scripts/ci/check-admin-ports.sh

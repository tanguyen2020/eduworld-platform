# Secrets sync (F130 T026, F130-AC-08, AC-10; DEPLOYMENT §13; research R1): decrypts deploy/secrets/<env>/*.sops.yaml with
# the age key of the GitHub Environment, creates the changed Docker secrets as <name>_v<N+1> (previous version kept) and,
# optionally, redeploys the stacks so only the services referencing a changed secret roll (rolling update).
# Manual only; required reviewers of Environment production apply; runs on the self-hosted runner `deploy`, which must
# have `sops` installed (version pinned by the runner image).
name: secrets-sync

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [staging, production]
        default: staging
      keycloak_rotated:
        description: "Keycloak client secrets changed and the new value is already valid in Keycloak (rotation policy)"
        type: boolean
        default: false
      redeploy:
        description: "Redeploy infra, data, ops and app (current backend version, no migration) after the sync"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: secrets-sync-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  sync:
    if: vars.DEPLOY_ENABLED == 'true' && github.event.pull_request.head.repo.fork != true
    runs-on: [self-hosted, deploy]
    environment: ${{ inputs.environment }}
    env:
      DOCKER_HOST: ${{ vars.SWARM_MANAGER_HOST }}
      DOCKER_TLS_VERIFY: "1"
      DOCKER_CERT_PATH: ${{ github.workspace }}/.docker-tls
      TARGET_ENV: ${{ inputs.environment }}
      EW_DEPLOY_REASON: secrets-sync
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - run: npm ci --prefix scripts --silent
      - name: Docker API client certificate
        env:
          CA: ${{ secrets.SWARM_TLS_CA }}
          CERT: ${{ secrets.SWARM_TLS_CERT }}
          KEY: ${{ secrets.SWARM_TLS_KEY }}
        run: bash scripts/deploy/write-docker-tls.sh
      - name: SOPS → versioned Docker secrets
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          KC_FLAG: ${{ inputs.keycloak_rotated && '--keycloak-rotated' || '' }}
        run: bash scripts/deploy/secrets-sync.sh --env="$TARGET_ENV" $KC_FLAG
      - name: redeploy (rolling update of the services whose secret version changed)
        if: inputs.redeploy
        run: |
          for s in infra data ops; do bash scripts/deploy/deploy-service.sh --env="$TARGET_ENV" --stack="$s"; done
          current=$(docker service inspect eduworld_core-api --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}' | sed -E 's#.*:(v[0-9][^@]*)(@.*)?$#\1#')
          bash scripts/deploy/deploy-service.sh --env="$TARGET_ENV" --stack=app --version="$current" --skip-migrate --redeploy --hotfix
      - name: remove credentials
        if: always()
        run: rm -rf "$DOCKER_CERT_PATH"

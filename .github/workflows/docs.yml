# Docs lane (F001 T038): Mermaid syntax, internal links, traceability matrix.
name: docs

on:
  pull_request:
    paths:
      - "docs/**"
      - "*.md"
      - "specs/**/*.md"
      - "scripts/docs/**"
      - "specs/openapi/eduworld-api.v1.yaml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "*.md"
      - "specs/**/*.md"
      - "scripts/docs/**"
      - "specs/openapi/eduworld-api.v1.yaml"

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - run: make docs-check

# Godot lane (F060 T042, F060-AC-19, GODOT_ARCHITECTURE §11, DEPLOYMENT §10.2, ADR-0088).
# Order: design-tokens-check → lint (gdlint, typed, theme overrides, layers, signals, translation keys, fixtures,
# no Admin UI) → GdUnit4 headless → native SecureStorage plugins (Windows DPAPI GDExtension + its tests on a Windows
# runner, Android Keystore AAR) → export Windows + Android with artifact scan → smoke boot (--env=mock) + UiGallery
# screenshots. Also called by design.yml (workflow_call) when tokens change.
name: godot

on:
  pull_request:
    paths:
      - "src/game/**"
      - "specs/**"
      - "design/game-tokens/**"
      - "design/shared-tokens/**"
      - ".github/workflows/godot.yml"
      - "scripts/ci/setup-godot.sh"
  push:
    branches: [main]
    paths:
      - "src/game/**"
      - "specs/**"
      - "design/game-tokens/**"
      - "design/shared-tokens/**"
      - ".github/workflows/godot.yml"
      - "scripts/ci/setup-godot.sh"
  workflow_call: {}

permissions:
  contents: read

concurrency:
  group: godot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GDTOOLKIT_VERSION: "4.5.0"
  SCONS_VERSION: "4.9.1"
  GODOT_CPP_SHA: "e83fd0904c13356ed1d4c3d09f8bb9132bdc6b77" # godot-cpp tag godot-4.5-stable (compatibility_minimum 4.5)
  GRADLE_VERSION: "8.11.1"
  GRADLE_SHA256: "f397b287023acdba1e9f6fc5ea72d22dd63669d59ed4a289a29b1a76eee151c6"

jobs:
  tokens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - run: corepack enable
      - name: design-tokens-check (generated Theme / UiTokens / 3D resources match design/, no Admin UI)
        run: make design-tokens-check BASE_REF=origin/${{ github.base_ref || 'main' }}

  lint:
    needs: tokens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install "gdtoolkit==${GDTOOLKIT_VERSION}"
      - run: npm ci --prefix scripts --silent
      - run: bash scripts/ci/setup-godot.sh linux
      - name: gdlint + typed check + lint theme overrides / layers / signals + translation keys + fixtures
        run: make godot-lint GODOT="$GODOT_BIN"

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: bash scripts/ci/setup-godot.sh linux
      - name: GdUnit4 headless + artifact scan tests
        run: make godot-test GODOT="$GODOT_BIN"
      - name: GdUnit4 report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: godot-gdunit4-report
          path: src/game/reports/
          if-no-files-found: ignore

  platform-windows:
    needs: lint
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install "scons==${SCONS_VERSION}"
      - name: godot-cpp (pinned commit)
        run: |
          git init -q "$RUNNER_TEMP/godot-cpp"
          git -C "$RUNNER_TEMP/godot-cpp" fetch -q --depth 1 https://github.com/godotengine/godot-cpp.git "$GODOT_CPP_SHA"
          git -C "$RUNNER_TEMP/godot-cpp" checkout -q FETCH_HEAD
      - name: Build the DPAPI GDExtension (debug + release)
        working-directory: src/game/addons/eduworld_platform/windows
        run: |
          scons platform=windows target=template_debug godot_cpp="$RUNNER_TEMP/godot-cpp" -j2
          scons platform=windows target=template_release godot_cpp="$RUNNER_TEMP/godot-cpp" -j2
      - run: bash scripts/ci/setup-godot.sh windows
      - name: SecureStorage tests with the real DPAPI adapter (F060-AC-23, AC-25, AC-26)
        run: |
          "$GODOT_BIN" --headless --path src/game --import
          "$GODOT_BIN" --headless --path src/game -s res://addons/gdUnit4/bin/GdUnitCmdTool.gd --ignoreHeadlessMode -c \
            -a res://tests/unit/platform -a res://tests/integration/platform -a res://tests/unit/test_device_config_defaults.gd
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: eduworld-platform-windows
          path: src/game/addons/eduworld_platform/bin/*.dll
          if-no-files-found: error

  platform-android:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"
      - name: Gradle (official distribution, pinned checksum)
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/gradle.zip" "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          echo "${GRADLE_SHA256}  $RUNNER_TEMP/gradle.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-${GRADLE_VERSION}/bin" >>"$GITHUB_PATH"
      - name: Build the Android Keystore plugin AAR
        run: gradle --no-daemon -p src/game/addons/eduworld_platform/android assemble
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: eduworld-platform-android
          path: src/game/addons/eduworld_platform/bin/*.aar
          if-no-files-found: error

  export:
    needs: [test, platform-windows, platform-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"
      - run: bash scripts/ci/setup-godot.sh linux --templates
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: eduworld-platform-*
          path: src/game/addons/eduworld_platform/bin
          merge-multiple: true
      - name: Install the GDExtension descriptor, client_version and Android SDK paths
        run: |
          cp src/game/addons/eduworld_platform/windows/eduworld_platform.gdextension.template \
            src/game/addons/eduworld_platform/eduworld_platform.gdextension
          node -e "const f='src/game/config/env/production.json';const j=require('./'+f);j.client_version='0.0.0-ci.${{ github.run_number }}';require('fs').writeFileSync(f,JSON.stringify(j,null,2)+'\n')"
          mkdir -p "$HOME/.config/godot"
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' \
            "$ANDROID_HOME" "$JAVA_HOME" >"$HOME/.config/godot/editor_settings-4.7.tres"
      - name: Export Windows (release preset) + scan
        run: make godot-export-windows GODOT="$GODOT_BIN"
      - name: Export Android (debug-signed in CI; release signing belongs to release.yml) + scan
        run: make godot-export-android GODOT="$GODOT_BIN"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: godot-builds
          path: |
            src/game/build/windows/
            src/game/build/android/*.apk
          if-no-files-found: error

  smoke:
    needs: export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: bash scripts/ci/setup-godot.sh linux
      - name: Smoke boot Boot → Splash with --env=mock (MOCK badge environment)
        run: make godot-smoke GODOT="$GODOT_BIN" GAME_ENV=mock
      - name: UiGallery screenshots (4 densities × vi/en/xx-PS + high contrast) vs baselines
        run: >-
          xvfb-run -a make godot-screenshots GODOT="$GODOT_BIN"
          GODOT_RENDER_FLAGS="--rendering-method gl_compatibility --rendering-driver opengl3"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: godot-ui-gallery
          path: src/game/tests/scene/screenshots/
          if-no-files-found: ignore

<!DOCTYPE html>
<!--
  EduWorld Web shell (F133 T028, F133-AC-16, PERFORMANCE_BUDGET §14, ADR-0101): custom HTML shell of the Web export
  preset (export_presets.cfg → html/custom_html_shell). Before any engine byte is downloaded it checks the browser:
  - no WebGL 2 (or no WebAssembly/fetch/secure context) → friendly notice page, the engine is never loaded;
  - Chrome and Edge are the supported browsers; any other browser with WebGL 2 is NOT blocked, it gets a dismissible
    "not officially supported" banner (owner 2026-11-20, OQ-04);
  - wasm heap policy of §14: reserve 512 MiB at the first heap growth, never grow beyond 1 GiB;
  - the engine and the main pack download right away, but the engine starts (and creates its AudioContext) only
    after the first user interaction ("Chơi" button), so audio never starts before a gesture (browser autoplay policy).
  No storage API is used here (no localStorage, sessionStorage, IndexedDB or cookie: the Web build keeps the refresh
  token in RAM only, ADR-0086). Colors, fonts and sizes come from shell_tokens.css, generated from design/game-tokens
  (make design-tokens, AGENTS R32) and copied next to index.html by make godot-export-web.
  EduWorld loading view (F096-AC-02): the S01 sky, the logo (Knowledge Spark + wordmark), the guide Mây speaking the
  status in a bubble and a rounded progress bar — no Godot logo; the shapes are inline SVG painted with token variables.
  Rotate prompt (F113-AC-06, F113-AC-07, STUDENT_GAME_UX §2 landscape only): while the loading view is up and the window
  is taller than wide, Mây asks to turn the phone sideways (the notice and error pages are never covered); the game
  shows its own prompt once running (OrientationGuard). "Chơi" on a touch device also tries full screen +
  screen.orientation.lock('landscape'); any refusal is ignored silently.
  The exporter replaces the GODOT_URL, GODOT_CONFIG, ... placeholders (dollar sign + name). Tests: src/game/web/tests/.
-->
<html lang="vi">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>$GODOT_PROJECT_NAME</title>
		<link rel="stylesheet" href="shell_tokens.css">
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	background-color: var(--ew-component-backdrop-sky-top);
	color: var(--ew-color-text-primary);
	font-family: var(--ew-font-family-body);
	font-size: var(--ew-density-font-base);
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

/* EduWorld loading view (F096-AC-02): the sky, hills and floating sparks of S01, the logo, Mây and a rounded bar. */
#ew-shell {
	position: absolute;
	inset: 0;
	display: flex;
	align-items: center;
	justify-content: center;
	padding: var(--ew-size-space-16);
	overflow: hidden;
	background: linear-gradient(var(--ew-component-backdrop-sky-top), var(--ew-component-backdrop-sky-bottom));
}

#ew-shell[hidden], #ew-banner[hidden], #ew-progress[hidden], #ew-play[hidden] {
	display: none;
}

.ew-hill {
	position: absolute;
	left: -10%;
	right: -10%;
	border-radius: 50% 50% 0 0;
}

.ew-hill-far {
	bottom: -6%;
	height: 34%;
	background-color: var(--ew-component-backdrop-hill-far);
}

.ew-hill-near {
	bottom: -14%;
	height: 30%;
	left: 20%;
	background-color: var(--ew-component-backdrop-hill-near);
}

.ew-spark-fill {
	fill: var(--ew-component-logo-spark);
}

.ew-spark-line {
	stroke: var(--ew-component-logo-spark-outline);
}

.ew-spark-core {
	fill: var(--ew-component-logo-spark-core);
}

.ew-float {
	position: absolute;
	width: 3%;
	min-width: var(--ew-size-space-16);
}

.ew-float-1 {
	left: 12%;
	top: 14%;
}

.ew-float-2 {
	right: 14%;
	top: 22%;
}

.ew-float-3 {
	left: 22%;
	top: 62%;
}

.ew-panel {
	position: relative;
	display: flex;
	flex-direction: column;
	align-items: center;
	gap: var(--ew-size-space-16);
	width: 100%;
	max-width: var(--ew-size-layout-660);
	text-align: center;
}

.ew-logo {
	display: flex;
	align-items: center;
	gap: var(--ew-size-space-12);
}

.ew-logo svg {
	width: var(--ew-component-logo-font-size);
	height: var(--ew-component-logo-font-size);
}

.ew-wordmark {
	margin: 0;
	font-family: var(--ew-font-family-heading);
	font-size: var(--ew-component-logo-font-size);
	font-weight: bold;
	line-height: 1.2;
	color: var(--ew-component-logo-text);
	-webkit-text-stroke: var(--ew-component-logo-outline-width) var(--ew-component-logo-outline);
	paint-order: stroke fill;
}

.ew-bubble {
	position: relative;
	box-sizing: border-box;
	width: 100%;
	padding: var(--ew-size-space-16) var(--ew-size-space-24);
	border: var(--ew-size-border-3) solid var(--ew-color-accent-primary);
	border-radius: var(--ew-size-radius-24);
	background-color: var(--ew-color-surface-panel);
}

.ew-bubble::after {
	content: "";
	position: absolute;
	left: 50%;
	bottom: calc(-2 * var(--ew-size-space-8));
	border: var(--ew-size-space-8) solid transparent;
	border-top-color: var(--ew-color-accent-primary);
	transform: translateX(-50%);
}

.ew-bubble p {
	margin: 0;
	color: var(--ew-color-text-primary);
	font-size: var(--ew-density-font-heading);
}

#ew-shell[data-state="unsupported"] .ew-bubble, #ew-shell[data-state="error"] .ew-bubble {
	border-color: var(--ew-color-feedback-incorrect);
}

.ew-mascot {
	width: var(--ew-component-mascot-size);
	max-width: 40%;
}

.ew-puff-line {
	fill: var(--ew-component-mascot-outline);
}

.ew-puff {
	fill: var(--ew-component-mascot-body);
}

.ew-eye {
	fill: var(--ew-component-mascot-eye);
}

.ew-eye-light {
	fill: var(--ew-component-mascot-body);
}

.ew-cheek {
	fill: var(--ew-component-mascot-cheek);
}

.ew-smile {
	fill: none;
	stroke: var(--ew-component-mascot-eye);
}

#ew-progress {
	box-sizing: border-box;
	width: 100%;
	height: var(--ew-component-progress-height);
	padding: var(--ew-size-border-3);
	border: var(--ew-size-border-3) solid var(--ew-component-progress-border);
	border-radius: var(--ew-size-radius-24);
	background-color: var(--ew-component-progress-track);
	overflow: hidden;
}

#ew-progress-fill {
	width: 8%;
	height: 100%;
	border-radius: var(--ew-size-radius-24);
	background-color: var(--ew-component-progress-fill);
	transition: width 0.3s ease-out;
}

#ew-progress[data-indeterminate="true"] #ew-progress-fill {
	width: 30%;
	animation: ew-slide 1.6s ease-in-out infinite alternate;
}

@keyframes ew-slide {
	from { margin-left: 0; }
	to { margin-left: 70%; }
}

@media (prefers-reduced-motion: reduce) {
	#ew-progress-fill {
		transition: none;
	}

	#ew-progress[data-indeterminate="true"] #ew-progress-fill {
		width: 100%;
		animation: none;
	}
}

#ew-play {
	min-height: var(--ew-density-button-min-height);
	min-width: 50%;
	padding: 0 var(--ew-size-space-32);
	border: 0;
	border-radius: var(--ew-size-radius-12);
	background-color: var(--ew-color-accent-primary);
	color: var(--ew-color-text-on-accent);
	font-family: var(--ew-font-family-heading);
	font-size: var(--ew-density-font-heading);
	cursor: pointer;
}

#ew-play:active {
	background-color: var(--ew-color-accent-primary-pressed);
}

#ew-play:focus-visible, #ew-banner button:focus-visible {
	outline: var(--ew-size-border-3) solid var(--ew-color-focus);
	outline-offset: var(--ew-size-border-2);
}

/* F113: a phone held sideways (2:1 or wider) is short — a smaller Mây keeps the logo, the line and "Chơi" in view. */
@media (min-aspect-ratio: 2/1) {
	.ew-panel {
		gap: var(--ew-size-space-8);
	}

	.ew-panel .ew-mascot {
		width: calc(var(--ew-component-mascot-size) / 3);
	}
}

/* Rotate prompt (F113-AC-06): covers the loading view while the window is portrait; never the notice/error pages. */
#ew-rotate {
	position: absolute;
	inset: 0;
	z-index: 1;
	display: none;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	gap: var(--ew-size-space-16);
	padding: var(--ew-size-space-24);
	text-align: center;
	background: linear-gradient(var(--ew-component-backdrop-sky-top), var(--ew-component-backdrop-sky-bottom));
}

#ew-shell[data-portrait="true"]:is([data-state="checking"], [data-state="loading"], [data-state="ready"], [data-state="starting"]) #ew-rotate {
	display: flex;
}

#ew-rotate .ew-bubble {
	max-width: var(--ew-size-layout-660);
}

#ew-rotate .ew-rotate-title {
	font-family: var(--ew-font-family-heading);
	font-weight: bold;
}

#ew-rotate .ew-rotate-hint {
	margin-top: var(--ew-size-space-8);
	font-size: var(--ew-density-font-base);
}

.ew-rotate-phone {
	width: var(--ew-size-layout-120);
	height: var(--ew-size-layout-120);
}

.ew-rotate-upright {
	fill: var(--ew-color-surface-panel-alt);
	stroke: var(--ew-color-accent-primary);
}

.ew-rotate-sideways {
	fill: var(--ew-color-accent-primary);
	stroke: var(--ew-color-accent-primary);
}

.ew-rotate-button {
	fill: var(--ew-color-text-on-accent);
}

.ew-rotate-arrow {
	fill: none;
	stroke: var(--ew-color-accent-reward);
}

#ew-banner {
	position: absolute;
	top: 0;
	left: 0;
	right: 0;
	display: flex;
	align-items: center;
	justify-content: center;
	gap: var(--ew-size-space-12);
	padding: var(--ew-size-space-8) var(--ew-size-space-16);
	background-color: var(--ew-color-surface-card);
	color: var(--ew-color-text-primary);
	font-size: var(--ew-density-font-small);
	z-index: 2;
}

#ew-banner button {
	min-height: var(--ew-density-button-min-height);
	padding: 0 var(--ew-size-space-16);
	border: var(--ew-size-border-2) solid var(--ew-color-text-secondary);
	border-radius: var(--ew-size-radius-8);
	background-color: var(--ew-color-surface-panel);
	color: var(--ew-color-text-primary);
	font-family: var(--ew-font-family-body);
	font-size: var(--ew-density-font-small);
	cursor: pointer;
}

		<script>
const GODOT_URL = '$GODOT_URL';
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;

(function (global) {
	'use strict';

	// Shell strings (the engine and its translation files are not loaded yet): Vietnamese by default, English
	// when the browser prefers it (same locales as the game, F060).
	const STRINGS = {
		vi: {
			title: 'EduWorld',
			checking: 'Đang kiểm tra trình duyệt…',
			loading: 'Đang chuẩn bị thế giới cho em…',
			ready: 'Đã sẵn sàng. Nhấn "Chơi" để bắt đầu.',
			play: 'Chơi',
			starting: 'Đang khởi động…',
			no_webgl2: 'Trình duyệt hoặc máy này chưa hỗ trợ WebGL 2 nên chưa chơi được EduWorld. Hãy mở EduWorld bằng Chrome hoặc Edge bản mới và bật "Tăng tốc phần cứng" trong cài đặt trình duyệt, hoặc nhờ thầy cô kiểm tra máy.',
			no_runtime: 'Trình duyệt này đã cũ hoặc trang không được mở qua HTTPS nên chưa chơi được EduWorld. Hãy mở EduWorld bằng Chrome hoặc Edge bản mới.',
			unofficial: 'EduWorld chỉ hỗ trợ chính thức Chrome và Edge. Trình duyệt này vẫn chơi được nhưng có thể gặp lỗi.',
			dismiss: 'Đã hiểu',
			error: 'Không khởi động được trò chơi. Hãy tải lại trang; nếu vẫn lỗi, hãy đóng bớt thẻ khác hoặc dùng Chrome, Edge bản mới.',
			rotate_title: 'Xoay ngang điện thoại để chơi nhé!',
			rotate_hint: 'EduWorld chơi theo chiều ngang. Trên máy tính, em kéo cửa sổ rộng ra nhé.',
		},
		en: {
			title: 'EduWorld',
			checking: 'Checking your browser…',
			loading: 'Getting your world ready…',
			ready: 'Ready. Press "Play" to start.',
			play: 'Play',
			starting: 'Starting…',
			no_webgl2: 'This browser or device does not support WebGL 2, so EduWorld cannot run. Open EduWorld in a recent Chrome or Edge and turn on hardware acceleration in the browser settings, or ask your teacher to check the device.',
			no_runtime: 'This browser is too old or the page is not served over HTTPS, so EduWorld cannot run. Open EduWorld in a recent Chrome or Edge.',
			unofficial: 'EduWorld officially supports Chrome and Edge only. This browser can still play but may show errors.',
			dismiss: 'Got it',
			error: 'The game could not start. Reload the page; if it still fails, close other tabs or use a recent Chrome or Edge.',
			rotate_title: 'Turn your phone sideways to play!',
			rotate_hint: 'EduWorld plays in landscape. On a computer, make the window wider.',
		},
	};

	// PERFORMANCE_BUDGET §14: wasm heap starts at 512 MiB and never exceeds 1 GiB.
	const HEAP_POLICY = { initialMiB: 512, maxMiB: 1024 };
	const MIB = 1048576;
	const WASM_PAGE = 65536;

	function pickLocale(languages) {
		for (const lang of languages || []) {
			const l = String(lang).toLowerCase();
			if (l.startsWith('vi')) {
				return 'vi';
			}
			if (l.startsWith('en')) {
				return 'en';
			}
		}
		return 'vi';
	}

	// 'supported' for Chrome and Edge (NFR-COMP-004), 'unofficial' for every other browser (never blocked).
	function browserSupport(nav) {
		const brands = ((nav.userAgentData && nav.userAgentData.brands) || []).map((b) => String(b.brand));
		if (brands.length > 0) {
			return brands.some((b) => b === 'Google Chrome' || b === 'Microsoft Edge') ? 'supported' : 'unofficial';
		}
		const ua = String(nav.userAgent || '');
		// iOS browsers (CriOS, EdgiOS) are WebKit, Firefox is Gecko, other Chromium browsers add their own token.
		if (/CriOS|EdgiOS|FxiOS|Firefox\/|OPR\/|SamsungBrowser\/|YaBrowser\/|UCBrowser\//.test(ua)) {
			return 'unofficial';
		}
		if (/Edg(A)?\/\d+/.test(ua) || /Chrome\/\d+/.test(ua)) {
			return 'supported';
		}
		return 'unofficial';
	}

	function hasWebGL2(doc) {
		try {
			return !!doc.createElement('canvas').getContext('webgl2');
		} catch (e) {
			return false;
		}
	}

	function hasRuntime(win) {
		return typeof win.WebAssembly === 'object' && typeof win.fetch === 'function' && win.isSecureContext !== false;
	}

	// Wraps WebAssembly.Memory.prototype.grow (the only wasm memory of the page is the engine's): the first growth
	// reserves the initial heap at once (fallback to the exact request when the device cannot), and any growth past
	// the maximum throws RangeError, which the engine's allocator treats as out of memory.
	function installHeapPolicy(wasm, policy) {
		const proto = wasm.Memory.prototype;
		if (proto.grow.eduworldHeapPolicy) {
			return proto.grow.eduworldHeapPolicy;
		}
		const original = proto.grow;
		const maxPages = Math.floor((policy.maxMiB * MIB) / WASM_PAGE);
		const initialPages = Math.floor((policy.initialMiB * MIB) / WASM_PAGE);
		const grow = function (delta) {
			const current = this.buffer.byteLength / WASM_PAGE;
			const wanted = current + Number(delta);
			if (wanted > maxPages) {
				throw new RangeError('EduWorld heap budget exceeded (' + policy.maxMiB + ' MiB)');
			}
			const target = Math.min(maxPages, Math.max(wanted, initialPages));
			if (target > wanted) {
				try {
					return original.call(this, target - current);
				} catch (e) {
					// The device cannot reserve the initial heap: grow only as requested.
				}
			}
			return original.call(this, delta);
		};
		grow.eduworldHeapPolicy = { maxPages: maxPages, initialPages: initialPages };
		proto.grow = grow;
		return grow.eduworldHeapPolicy;
	}

	// Rounded loading bar (F096-AC-02): the share downloaded when the size is known, else a gentle back-and-forth.
	function setProgress(bar, current, total) {
		const fill = bar.firstElementChild;
		if (current > 0 && total > 0) {
			const pct = Math.max(0, Math.min(100, Math.round((current / total) * 100)));
			bar.dataset.indeterminate = 'false';
			bar.setAttribute('aria-valuenow', String(pct));
			fill.style.width = pct + '%';
		} else {
			bar.dataset.indeterminate = 'true';
			bar.removeAttribute('aria-valuenow');
			fill.style.removeProperty('width');
		}
	}

	// F113 (STUDENT_GAME_UX §2): a window taller than wide is portrait; a square one counts as landscape (same rule as
	// OrientationPolicy in the game).
	function isPortrait(width, height) {
		return Number(height) > Number(width);
	}

	// Keeps #ew-shell[data-portrait] in step with the window (CSS shows the rotate prompt from it).
	function watchOrientation(win, shell) {
		const update = () => {
			shell.dataset.portrait = isPortrait(win.innerWidth, win.innerHeight) ? 'true' : 'false';
		};
		update();
		win.addEventListener('resize', update);
		win.addEventListener('orientationchange', update);
		return update;
	}

	// F113-AC-07: on a touch device, inside the "Chơi" click (user gesture), try full screen then the landscape lock
	// (Android Chrome); every refusal or missing API resolves to false silently. Never delays the engine start.
	function tryLockLandscape(win) {
		try {
			const coarse = typeof win.matchMedia === 'function' && win.matchMedia('(pointer: coarse)').matches;
			const orientation = win.screen && win.screen.orientation;
			if (!coarse || !orientation || typeof orientation.lock !== 'function') {
				return Promise.resolve(false);
			}
			const doc = win.document;
			const root = doc.documentElement;
			const full = doc.fullscreenElement || typeof root.requestFullscreen !== 'function'
				? Promise.resolve() : root.requestFullscreen({ navigationUI: 'hide' });
			return Promise.resolve(full).then(() => orientation.lock('landscape')).then(() => true, () => false);
		} catch (e) {
			return Promise.resolve(false);
		}
	}

	function loadScript(doc, src) {
		return new Promise((resolve, reject) => {
			const s = doc.createElement('script');
			s.src = src;
			s.onload = () => resolve();
			s.onerror = () => reject(new Error('engine script failed to load'));
			doc.body.appendChild(s);
		});
	}

	function run(win, deps) {
		const doc = win.document;
		const d = Object.assign({ loadScript: (src) => loadScript(doc, src), lockLandscape: tryLockLandscape }, deps || {});
		const t = STRINGS[pickLocale(win.navigator.languages || [win.navigator.language])];
		const shell = doc.getElementById('ew-shell');
		const message = doc.getElementById('ew-message');
		const progress = doc.getElementById('ew-progress');
		const play = doc.getElementById('ew-play');
		doc.documentElement.lang = t === STRINGS.en ? 'en' : 'vi';
		doc.getElementById('ew-title').textContent = t.title;
		play.textContent = t.play;
		doc.getElementById('ew-rotate-title').textContent = t.rotate_title;
		doc.getElementById('ew-rotate-hint').textContent = t.rotate_hint;
		watchOrientation(win, shell);

		function state(name, text) {
			shell.dataset.state = name;
			message.textContent = text;
			progress.hidden = name !== 'loading';
			play.hidden = name !== 'ready';
		}

		function fail(err) {
			if (win.console) {
				win.console.error(err);
			}
			shell.hidden = false;
			state('error', t.error);
		}

		state('checking', t.checking);
		if (!hasWebGL2(doc)) {
			state('unsupported', t.no_webgl2);
			shell.dataset.reason = 'webgl2';
			return Promise.resolve('unsupported');
		}
		if (!hasRuntime(win)) {
			state('unsupported', t.no_runtime);
			shell.dataset.reason = 'runtime';
			return Promise.resolve('unsupported');
		}
		if (browserSupport(win.navigator) !== 'supported') {
			const banner = doc.getElementById('ew-banner');
			doc.getElementById('ew-banner-text').textContent = t.unofficial;
			const close = doc.getElementById('ew-banner-close');
			close.textContent = t.dismiss;
			close.addEventListener('click', () => {
				banner.hidden = true;
			});
			banner.hidden = false;
		}
		installHeapPolicy(win.WebAssembly, HEAP_POLICY);
		state('loading', t.loading);

		return d.loadScript(GODOT_URL).then(() => {
			const config = Object.assign({}, GODOT_CONFIG, {
				onProgress: (current, total) => setProgress(progress, current, total),
				onExit: (code) => {
					if (code !== 0) {
						fail(new Error('engine exited with code ' + code));
					}
				},
			});
			const engine = new win.Engine(config);
			const exe = config.executable;
			const pack = config.mainPack || exe + '.pck';
			// Download the engine and the main pack now; start only after the first interaction.
			return Promise.all([engine.init(exe), engine.preloadFile(pack, pack)]).then(() => {
				state('ready', t.ready);
				play.focus();
				return new Promise((resolve) => {
					play.addEventListener('click', function onPlay() {
						play.removeEventListener('click', onPlay);
						try {
							d.lockLandscape(win);
						} catch (e) {
							// F113-AC-07: a refused or missing lock never stops the start.
						}
						state('starting', t.starting);
						const args = ['--main-pack', pack].concat(config.args || []);
						engine.start({ args: args }).then(() => {
							shell.hidden = true;
							doc.getElementById('canvas').focus();
							resolve('started');
						}, (err) => {
							fail(err);
							resolve('error');
						});
					});
				});
			});
		}).catch((err) => {
			fail(err);
			return 'error';
		});
	}

	global.EduWorldShell = {
		STRINGS: STRINGS,
		HEAP_POLICY: HEAP_POLICY,
		pickLocale: pickLocale,
		setProgress: setProgress,
		isPortrait: isPortrait,
		watchOrientation: watchOrientation,
		tryLockLandscape: tryLockLandscape,
		browserSupport: browserSupport,
		hasWebGL2: hasWebGL2,
		installHeapPolicy: installHeapPolicy,
		run: run,
		threads: GODOT_THREADS_ENABLED,
	};
	if (!global.EW_SHELL_MANUAL_START) {
		global.EduWorldShell.done = run(global);
	}
}(window));
		</script>
	</body>

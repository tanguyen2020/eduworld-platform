; EduWorld release export presets (F060 T003, GODOT_ARCHITECTURE §11). No password here: the Android release
; keystore comes from GitHub Environment secrets through GODOT_ANDROID_KEYSTORE_RELEASE_PATH/_USER/_PASSWORD.
; Release presets never ship the mock configuration, tests, tools, debug scenes (UiGallery, MockBadge) nor the
; pseudo-locale (AGENTS R17, F060-AC-21); src/game/tools/scan_artifact.sh checks every artifact in CI.

[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features="eduworld_production"
export_filter="all_resources"
include_filter="config/env/production.json"
exclude_filter="config/env/mock.json, config/env/local.json, config/env/dev.json, config/env/staging.json, tests/*, tools/*, scenes/ui/debug/*, locale/xx_PS.po, locale/messages.pot, addons/gdUnit4/*, reports/*"
export_path="build/windows/EduWorld.exe"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2


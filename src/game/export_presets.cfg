; EduWorld release export presets (F060 T003, F133 T002, GODOT_ARCHITECTURE §11): Android (preset.0), iOS (preset.1),
; Web (preset.2). No Windows preset (ADR-0101: the client ships on Web, Android and iOS only).
; No password, certificate or team id here (F133-AC-02, AGENTS R4): the Android release keystore comes from GitHub
; Environment secrets through GODOT_ANDROID_KEYSTORE_RELEASE_PATH/_USER/_PASSWORD; the Apple team id, signing identity
; and provisioning profile are written by the iOS signing job on the macOS runner (F133 T019).
; Every preset is a release preset: custom feature eduworld_production selects config/env/production.json and only
; that env file is packed. Release presets never ship the mock configuration, tests, tools, debug scenes (UiGallery,
; MockBadge), the pseudo-locale nor the Web shell sources (AGENTS R17, F060-AC-21); src/game/tools/scan_artifact.sh
; checks every artifact in CI. Keep the filters of the three presets identical (test_export_presets.gd).


# Dev seed of module identity (LOCAL_DEVELOPMENT §5), loaded by `make seed` (go run ./modules/identity/cmd/seed).
# Fake data only. Every username is a user of the realm import deploy/keycloak/realm-eduworld.dev.json, which holds
# the demo password; the seed links accounts to those users and never sets a password.
# The common tenant "common" (EduWorld chung) comes with the migrations. Not seeded yet [Proposed]: qa-probe
# (createTenant cannot set is_qa), hs.tudo (createCommonStudents sets a generated password), hs.nosis (on purpose:
# ACCOUNT_NOT_PROVISIONED), sa.moi (required action UPDATE_PASSWORD; no OTP since ADR-0094).
tenants:
  - code: th-demo-a
    name: TH Demo A
    type: school
    alias: th-demo-a
    schools:
      - code: DEMOA1
        name_vi: Trường Tiểu học Demo A
        name_en: Demo Primary School A
        province: vn.ha-noi
        level: primary
        grade_min: 1
        grade_max: 5
        sis: sis/DEMOA1
  - code: pgd-demo
    name: PGD Demo
    type: unit
    alias: pgd-demo
    schools:
      - code: DEMOB1
        name_vi: Trường THCS Demo B
        name_en: Demo Lower Secondary School B
        province: vn.ha-noi
        level: lower_secondary
        grade_min: 6
        grade_max: 9
        sis: sis/DEMOB1
      - code: DEMOC1
        name_vi: Trường Tiểu học Demo C
        name_en: Demo Primary School C
        province: vn.ha-noi
        level: primary
        grade_min: 1
        grade_max: 5
        sis: sis/DEMOC1


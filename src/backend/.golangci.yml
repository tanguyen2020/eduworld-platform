# golangci-lint v2 for the single Go module src/backend (F002 T003/T048). golangci-lint has no config
# inheritance, so one file serves every module; `make lint MOD=<m>` scopes by path. Architecture rules
# (layers, cross-module imports, domain/infrastructure imports, ent/pgx-free core pkg) are enforced by
# tools/archgen (`make arch-check`) with the generated depguard config .golangci.arch.yml as a second
# layer; tenancy gates by tools/lint/ewlint (bypassreason, scopeguard).
version: "2"
linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - nilerr
    - unconvert
    - misspell
    - sqlclosecheck
    - rowserrcheck
    - noctx
  settings:
    errcheck:
      exclude-functions:
        # Builder methods returning *problem.Error for chaining.
        - (*github.com/tanguyen2020/eduworld-platform/src/backend/pkg/problem.Error).AddField
        # Writing CLI output to stdout/stderr.
        - fmt.Fprintln
        - fmt.Fprintf
        - fmt.Fprint
  exclusions:
    paths:
      - testdata
    rules:
      # Tests and dev tools use httptest.NewRequest / exec.Command without a caller context.
      - path: (_test.go|^tools/)
        linters: [noctx]
formatters:
  enable: [gofmt]
